name: Cross-Position Catastrophic Casebook V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/backtest-cross-position-catastrophic-casebook-v1.yml'
      - 'scripts/backtest/cross_position_catastrophic_casebook_v1.py'
      - 'scripts/backtest/cross_position_catastrophic_pbp_v1.py'
      - 'scripts/backtest/cross_position_catastrophic_game_spot_v1.py'
      - 'docs/migrations/CROSS_POSITION_CATASTROPHIC_CASEBOOK_V1_PLAN.md'
      - 'docs/migrations/CROSS_POSITION_CATASTROPHIC_GAME_SPOT_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  phase-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-A evaluator
        run: python -m py_compile scripts/backtest/cross_position_catastrophic_casebook_v1.py
      - name: Download exact frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/qb evidence/wr evidence/te evidence/rb
          gh run download 33331073376 --repo "${GITHUB_REPOSITORY}" --name m89-qb-data-integrity-casebook-synthesis --dir evidence/qb
          gh run download 34142510405 --repo "${GITHUB_REPOSITORY}" --name pass-receiving-conservation-integration-v1 --dir evidence/wr
          gh run download 34132127351 --repo "${GITHUB_REPOSITORY}" --name te-r5-participation-entitlement-v1 --dir evidence/te
          gh run download 33539468967 --repo "${GITHUB_REPOSITORY}" --name rb-stack3-frozen-state-composition --dir evidence/rb
      - name: Verify frozen evidence paths
        run: |
          test -s evidence/qb/synthesis/m89_2024_2025_synthesis_trace.csv
          test -s evidence/qb/reconciliation/m89_corrected_qb_common_trace.csv
          test -s evidence/wr/data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_paired_player_casebook.csv
          test -s evidence/te/data/backtests/te_r5_participation_entitlement_v1/te_r5_oos_player_casebook.csv
          test -s evidence/rb/stack3_2025_casebook.csv
      - name: Run Phase-A cross-position decomposition
        run: |
          python scripts/backtest/cross_position_catastrophic_casebook_v1.py \
            --qb-root evidence/qb \
            --wr-casebook evidence/wr/data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_paired_player_casebook.csv \
            --te-casebook evidence/te/data/backtests/te_r5_participation_entitlement_v1/te_r5_oos_player_casebook.csv \
            --rb-casebook evidence/rb/stack3_2025_casebook.csv \
            --out-dir data/backtests/cross_position_catastrophic_casebook_v1
      - name: Show Phase-A result
        if: always()
        run: |
          cat data/backtests/cross_position_catastrophic_casebook_v1/cross_position_phase_a_result.json 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1/cross_position_summary.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1/cross_position_mechanism_summary.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1/cross_position_q4_summary.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1/cross_position_q4_direction_mechanisms.csv 2>/dev/null || true
      - name: Upload Phase-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-a
          path: |
            data/backtests/cross_position_catastrophic_casebook_v1/*
            docs/migrations/CROSS_POSITION_CATASTROPHIC_CASEBOOK_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30

  phase-b:
    needs: phase-a
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Phase-B evaluator
        run: python -m py_compile scripts/backtest/cross_position_catastrophic_pbp_v1.py
      - name: Download same-run Phase-A artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-a
          path: evidence/phase_a
      - name: Verify Phase-A casebook
        run: test -s evidence/phase_a/data/backtests/cross_position_catastrophic_casebook_v1/cross_position_catastrophic_casebook.csv
      - name: Run Phase-B play-by-play forensics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/cross_position_catastrophic_pbp_v1.py \
            --phase-a-casebook evidence/phase_a/data/backtests/cross_position_catastrophic_casebook_v1/cross_position_catastrophic_casebook.csv \
            --out-dir data/backtests/cross_position_catastrophic_casebook_v1_phase_b
      - name: Show Phase-B result
        if: always()
        run: |
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_b/cross_position_phase_b_result.json 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_b/cross_position_pbp_mechanism_summary.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_b/cross_position_predictability_summary.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_b/cross_position_largest_play_sensitivity.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_b/cross_position_q4_pbp_mechanisms.csv 2>/dev/null || true
      - name: Upload Phase-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-b
          path: data/backtests/cross_position_catastrophic_casebook_v1_phase_b/*
          if-no-files-found: warn
          retention-days: 30

  phase-c:
    needs: [phase-a, phase-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-C evaluator
        run: python -m py_compile scripts/backtest/cross_position_catastrophic_game_spot_v1.py
      - name: Restore PBP cache
        uses: actions/cache@v4
        with:
          path: data/nflverse_pbp
          key: cross-position-pbp-2019-2025-v1
      - name: Download same-run Phase-A artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-a
          path: evidence/phase_a
      - name: Download same-run Phase-B artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-b
          path: evidence/phase_b
      - name: Verify Phase-C inputs
        run: |
          test -s evidence/phase_a/data/backtests/cross_position_catastrophic_casebook_v1/cross_position_all_rows.csv
          test -s evidence/phase_b/cross_position_pbp_casebook.csv
      - name: Run Phase-C pregame game-spot overlay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/cross_position_catastrophic_game_spot_v1.py \
            --phase-a-all-rows evidence/phase_a/data/backtests/cross_position_catastrophic_casebook_v1/cross_position_all_rows.csv \
            --phase-b-casebook evidence/phase_b/cross_position_pbp_casebook.csv \
            --out-dir data/backtests/cross_position_catastrophic_casebook_v1_phase_c
      - name: Show Phase-C result
        if: always()
        run: |
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_phase_c_result.json 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_game_spot_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_q4_game_spot_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_game_spot_alignment.csv 2>/dev/null || true
      - name: Upload Phase-C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-c
          path: |
            data/backtests/cross_position_catastrophic_casebook_v1_phase_c/*
            docs/migrations/CROSS_POSITION_CATASTROPHIC_GAME_SPOT_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
