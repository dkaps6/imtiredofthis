name: Full Slate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: false
        default: "2026"
      prior_season:
        description: "Prior season used for historical priors/backfills"
        required: false
        default: "2025"
      date:
        description: "Slate date (YYYY-MM-DD) or blank for nearest upcoming NFL week"
        required: false
        default: ""
      fetch_live_odds:
        description: "Fetch live player props/game odds (USES ODDS API CREDITS)"
        required: false
        type: boolean
        default: false

concurrency:
  group: full-slate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  SEASON: ${{ github.event.inputs.season || '2026' }}
  PRIOR_SEASON: ${{ github.event.inputs.prior_season || '2025' }}
  SLATE_DATE: ${{ github.event.inputs.date || '' }}
  FETCH_LIVE_ODDS: ${{ github.event.inputs.fetch_live_odds || 'false' }}
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv

jobs:
  full_slate:
    name: Full slate (single job)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest

      - name: Validate season context
        run: |
          export PYTHONPATH="${PWD}"
          python - <<'EOF'
          import os
          from scripts.config import SEASON, PRIOR_SEASON, SLATE_DATE
          assert SEASON == int(os.environ["SEASON"])
          assert PRIOR_SEASON == int(os.environ["PRIOR_SEASON"])
          assert PRIOR_SEASON < SEASON
          assert SLATE_DATE == os.environ.get("SLATE_DATE", "").strip()
          print(f"current={SEASON} prior={PRIOR_SEASON} slate={SLATE_DATE or '<latest>'}")
          EOF

      - name: Live odds mode status
        run: |
          if [ "${FETCH_LIVE_ODDS}" = "true" ]; then
            echo "LIVE ODDS ENABLED — sportsbook acquisition will occur only after football eligibility is resolved"
          else
            echo "LIVE ODDS PAUSED — football model builds with zero sportsbook fetches"
          fi

      - name: Build raw Ourlads roles
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/providers/ourlads_depth.py --season "${SEASON}"
          mkdir -p outputs
          cp data/roles_ourlads.csv outputs/roles_ourlads.csv
          test -s data/roles_ourlads.csv

      - name: Build authoritative team-week map
        env:
          TEAM_WEEK_MAP_CSV: data/team_week_map.csv
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/build_team_week_map_v2.py --season "${SEASON}" --out data/team_week_map.csv
          test -s data/team_week_map.csv
          python -c "from scripts.runtime_context import log_runtime_context,resolve_week; log_runtime_context(); print('week=',resolve_week())"

      - name: Build weather and weekly injuries
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/build/build_weather_week_v2.py --season "${SEASON}" --date "${SLATE_DATE}"
          python scripts/build/build_injuries_weekly.py data/injuries.csv --season "${SEASON}"
          test -s data/weather_week.csv
          test -s data/injuries.csv
          test -s data/injuries_source_status.json

      - name: Resolve current availability before opportunity
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          WEEK_RESOLVED=$(python -c "from scripts.runtime_context import resolve_week; print(resolve_week())")
          python scripts/run_current_player_availability_candidate_prep_v1.py --season "${SEASON}" --week "${WEEK_RESOLVED}"
          test -s data/current_player_availability.csv
          test -s data/current_player_availability_game_certification.csv
          test -s data/roles_current_production_eligible_v1.csv
          cp data/current_player_availability.csv outputs/current_player_availability.csv
          cp data/current_player_availability_game_certification.csv outputs/current_player_availability_game_certification.csv
          cp data/roles_current_production_eligible_v1.csv outputs/roles_current_production_eligible_v1.csv
          python - <<'EOF'
          import json, pandas as pd
          a=pd.read_csv('data/current_player_availability.csv')
          c=pd.read_csv('data/current_player_availability_game_certification.csv')
          r=pd.read_csv('data/roles_current_production_eligible_v1.csv')
          bad=a[pd.to_numeric(a['definitive_unavailable'],errors='coerce').fillna(0).eq(1)]
          if set(zip(bad.team.astype(str),bad.player_clean_key.astype(str))) & set(zip(r.team.astype(str),r.player_clean_key.astype(str))):
              raise SystemExit('FATAL: definitive unavailable player survived eligible roles')
          if int(pd.to_numeric(c['production_eligible'],errors='coerce').fillna(0).sum())*2 != r['team'].nunique():
              raise SystemExit('FATAL: eligible role team count does not match certified game universe')
          print('AVAILABILITY_BEFORE_OPPORTUNITY_PASS', {'availability_rows':len(a),'eligible_role_rows':len(r),'eligible_teams':r.team.nunique()})
          EOF

      - name: Build TeamForm with explicit Week1 strict-prior authority
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_sharpfootball_v2.py --season "${SEASON}" --dump-html
          python scripts/team_form_prior_bridge.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}"
          WEEK_RESOLVED=$(python -c "from scripts.runtime_context import resolve_week; print(resolve_week())")
          if [ "${WEEK_RESOLVED}" = "1" ]; then
            python scripts/run_team_form_context_week1_prior_v1.py --season "${SEASON}" --box-backfill-prev
          else
            python scripts/run_team_form_context.py --season "${SEASON}" --box-backfill-prev
          fi
          test -s data/team_form.csv

      - name: Build promoted QB M89/M90 context
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_qb_promoted_context.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}"
          test -s data/qb_promoted_team_context.csv
          test -s data/qb_promoted_context_audit.csv
          python - <<'EOF'
          import pandas as pd
          ctx=pd.read_csv('data/qb_promoted_team_context.csv')
          if len(ctx) != 32 or ctx['team'].nunique() != 32:
              raise SystemExit(f'FATAL: promoted QB context expected 32 teams, got rows={len(ctx)} teams={ctx["team"].nunique()}')
          conv=pd.to_numeric(ctx['pass_attempts_per_dropback'],errors='coerce')
          if conv.isna().any() or not conv.between(.50,1.0,inclusive='both').all():
              raise SystemExit('FATAL: promoted QB attempt conversion is missing/out of range')
          print(f'promoted QB context OK teams=32 attempt_conversion={conv.min():.4f}..{conv.max():.4f}')
          EOF

      - name: Build Coverage v2 matchup intelligence
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_coverage_v2.py --season "${SEASON}"
          for f in data/cb_coverage_team.csv data/cb_coverage_player.csv data/wr_cb_exposure.csv; do test -s "$f"; done

      - name: Build optional current-season PBP enrichment
        continue-on-error: true
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/build/pbp_features.py --season "${SEASON}" || true

      - name: Build PlayerForm from production-eligible current roles
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/run_player_form_current_roles_v1.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}" --date "${SLATE_DATE}"
          python scripts/enrich_player_scoring_v2.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}" --date "${SLATE_DATE}"
          for f in data/player_game_logs.csv data/player_season_totals.csv data/player_form.csv data/player_form_consensus.csv data/player_identity_validation.csv; do test -s "$f"; done
          python - <<'EOF'
          import pandas as pd
          a=pd.read_csv('data/current_player_availability.csv')
          f=pd.read_csv('data/player_form_consensus.csv')
          bad=set(zip(a.loc[pd.to_numeric(a.definitive_unavailable,errors='coerce').fillna(0).eq(1),'team'].astype(str),a.loc[pd.to_numeric(a.definitive_unavailable,errors='coerce').fillna(0).eq(1),'player_clean_key'].astype(str)))
          got=set(zip(f.team.astype(str),f.player_clean_key.astype(str)))
          if bad & got: raise SystemExit(f'FATAL: unavailable PlayerForm identities: {sorted(bad & got)[:20]}')
          logs=pd.read_csv('data/player_game_logs.csv')
          season=pd.to_numeric(logs.season,errors='coerce'); week=pd.to_numeric(logs.week,errors='coerce')
          illegal=season.eq(int(2026)) & week.ge(1)
          if illegal.fillna(False).any(): raise SystemExit('FATAL: PlayerForm published current/future Week1 history')
          print('PLAYERFORM_CURRENT_ROLES_AND_STRICT_PRIOR_PASS')
          EOF

      - name: Gate football providers and materialize canonical Team Context v3
        env:
          FETCH_LIVE_ODDS: 'false'
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_model_context_bridge.py
          test -s data/provider_readiness_v3.csv
          test -s data/team_context_v3.csv
          test -s data/team_context_v3_provenance.csv
          test -s data/model_context_bridge.csv

      - name: Validate empirical Bayesian baseline
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_model_bayesian_bridge.py
          test -s data/model_bayesian_diagnostics.csv

      - name: Train and validate supervised ML v2
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_model_ml_bridge.py
          test -s data/model_ml_diagnostics.csv
          test -s data/model_ml_v2.joblib

      - name: Train and validate Markov state v2
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_model_state_bridge.py
          test -s data/model_state_diagnostics.csv
          test -s data/model_state_v2.joblib
          python - <<'EOF'
          import pandas as pd
          df=pd.read_csv('data/model_state_diagnostics.csv')
          if df.empty or int(df['state_available'].sum()) == 0: raise SystemExit('FATAL: state v2 produced no available predictions')
          print(f"state v2 players={len(df)} available={int(df['state_available'].sum())}")
          EOF

      - name: Validate empirical rule layer
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_model_rules_bridge.py
          test -s data/model_rule_diagnostics.csv

      - name: Validate evidence-weighted ensemble framework
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_model_ensemble_bridge.py
          test -s data/model_ensemble_diagnostics.csv
          python - <<'EOF'
          import pandas as pd
          df=pd.read_csv('data/model_ensemble_diagnostics.csv')
          if df.empty: raise SystemExit('FATAL: ensemble diagnostics empty')
          sums=(df['mc_weight']+df['ml_weight']+df['state_weight']).round(9)
          if not sums.eq(1.0).all(): raise SystemExit('FATAL: ensemble weights do not sum to one')
          print('ensemble status:', df['ensemble_status'].value_counts().to_dict())
          EOF

      - name: Build promoted RB P3 from production-eligible current roles
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          WEEK_RESOLVED=$(python -c "from scripts.runtime_context import resolve_week; print(resolve_week())")
          if [ "${WEEK_RESOLVED}" != "1" ]; then
            echo "FATAL: promoted RB production path is currently locked to Week 1; resolved week=${WEEK_RESOLVED}"
            exit 1
          fi
          python scripts/run_rb_week1_current_roles_v1.py --season "${SEASON}" --week "${WEEK_RESOLVED}" --iterations 25000 --out data/rb_rush_synthesis_context.csv
          test -s data/rb_rush_synthesis_context.csv
          python - <<'EOF'
          import pandas as pd
          from scripts.utils.eligible_team_set_v1 import validate_current_team_set
          x=pd.read_csv('data/rb_rush_synthesis_context.csv')
          if x.empty: raise SystemExit('FATAL: promoted RB context empty')
          validate_current_team_set(x['team'].dropna().astype(str).unique(),label='promoted RB context')
          if not pd.to_numeric(x['sportsbook_inputs_used'],errors='coerce').eq(0).all(): raise SystemExit('FATAL: RB sportsbook leakage flag')
          if not x['rb_synthesis_route'].astype(str).eq('WEEK1_STACK_OVERRIDE').all(): raise SystemExit('FATAL: non-Week1 RB route')
          print(f"promoted RB context OK players={x.player_clean_key.nunique()} teams={x.team.nunique()}")
          EOF

      - name: Build QB C2 football-only distribution state context
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          WEEK_RESOLVED=$(python -c "from scripts.runtime_context import resolve_week; print(resolve_week())")
          python scripts/run_qb_distribution_state_context.py --season "${SEASON}" --week "${WEEK_RESOLVED}"
          test -s data/qb_distribution_state_context.csv
          test -s data/qb_distribution_state_context_audit.csv
          python - <<'EOF'
          import pandas as pd
          x=pd.read_csv('data/qb_distribution_state_context.csv',low_memory=False)
          if len(x) != 32 or x['team'].nunique() != 32:
              raise SystemExit(f'FATAL: QB C2 state context expected 32 teams, got rows={len(x)} teams={x["team"].nunique()}')
          if not pd.to_numeric(x['sportsbook_inputs_used'],errors='coerce').eq(0).all():
              raise SystemExit('FATAL: QB C2 state context reports sportsbook input')
          print('QB C2 football state context OK teams=32')
          EOF

      - name: Apply certified availability-aware current-output coverage seams
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python -m py_compile scripts/run_pricing_with_full_roster_universe_v1.py scripts/modeling/rb_r26_receptions_production_adapter_v1.py scripts/modeling/qb_c2_production_adapter_v1.py

      - name: Fetch and gate player props and game odds after football eligibility
        id: live_odds
        if: ${{ env.FETCH_LIVE_ODDS == 'true' }}
        env:
          TEAM_WEEK_MAP_CSV: data/team_week_map.csv
          ROLES_CSV: data/roles_current_production_eligible_v1.csv
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/run_live_odds_gate.py --season "${SEASON}" --date "${SLATE_DATE}"
          test -s data/live_odds_status.json
          python - <<'EOF'
          import json, os
          status=json.load(open('data/live_odds_status.json', encoding='utf-8'))
          available=str(bool(status.get('available'))).lower()
          state=str(status.get('status','unknown'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"available={available}\n")
              fh.write(f"status={state}\n")
          print(f"live odds gate: status={state} available={available}")
          if not status.get('available'):
              print('No current active-slate player prop markets are posted; sportsbook pricing will be skipped cleanly.')
          EOF

      - name: Validate and compact live sportsbook boundary
        if: ${{ env.FETCH_LIVE_ODDS == 'true' && steps.live_odds.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/materialize_live_props_for_model_v1.py
          test -s outputs/props_raw_compact.csv
          test -s data/live_odds_placeholder_rows.csv
          python - <<'EOF'
          import json, pandas as pd
          status=json.load(open('data/live_odds_status.json',encoding='utf-8'))
          compact=pd.read_csv('outputs/props_raw_compact.csv',low_memory=False)
          quarantine=pd.read_csv('data/live_odds_placeholder_rows.csv',low_memory=False)
          if len(compact) != int(status.get('production_compact_rows',-1)):
              raise SystemExit('FATAL: live compact sportsbook boundary row-count drift')
          if len(quarantine) != int(status.get('production_quarantined_rows',-1)):
              raise SystemExit('FATAL: live sportsbook quarantine row-count drift')
          print('model-facing compact rows=',len(compact),'quarantine rows=',len(quarantine))
          EOF

      - name: Validate live opponent map
        if: ${{ env.FETCH_LIVE_ODDS == 'true' && steps.live_odds.outputs.available == 'true' }}
        run: |
          export PYTHONPATH="${PWD}"
          python - <<'EOF'
          import pandas as pd
          df=pd.read_csv('data/opponent_map_from_props.csv')
          if df.empty: raise SystemExit('FATAL: opponent map empty')
          if df['team'].isna().any() or df['opponent'].isna().any(): raise SystemExit('FATAL: unresolved opponent map')
          print(f'opponent map OK: rows={len(df)}')
          EOF

      - name: Audit live player identity semantics
        if: ${{ env.FETCH_LIVE_ODDS == 'true' && steps.live_odds.outputs.available == 'true' }}
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/validate_player_identity_semantics_v1.py
          test -s data/player_identity_semantic_audit.json

      - name: Classify live Full Slate data quality
        if: ${{ env.FETCH_LIVE_ODDS == 'true' && steps.live_odds.outputs.available == 'true' }}
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/validate_full_slate_data_quality_v1.py
          test -s data/full_slate_data_quality_audit.json

      - name: Assemble exact bookmaker offers and deterministic metrics
        if: ${{ env.FETCH_LIVE_ODDS == 'true' && steps.live_odds.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/materialize_pricing_offers_v1.py
          test -s outputs/props_pricing_offers.csv
          test -s data/live_pricing_offer_audit.json
          python scripts/run_metrics_context.py --season "${SEASON}" --mode full --date "${SLATE_DATE}"
          python scripts/validate_build_integrity.py
          python scripts/metrics_ready.py --season "${SEASON}" --date "${SLATE_DATE}"
          test -s data/metrics_ready.csv

      - name: Price from certified football-first Full Slate stack
        if: ${{ env.FETCH_LIVE_ODDS == 'true' && steps.live_odds.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          test -s data/football_simulation_universe_audit.json
          test -s data/wr_r15_full_slate_entitlement_audit.json
          test -s data/qb_c2_production_integration_audit.json
          python - <<'EOF'
          import json, pandas as pd
          from scripts.utils.eligible_team_set_v1 import expected_current_teams
          expected=len(expected_current_teams() or [])
          q=json.load(open('data/qb_c2_production_integration_audit.json',encoding='utf-8'))
          w=json.load(open('data/wr_r15_full_slate_entitlement_audit.json',encoding='utf-8'))
          if q.get('disposition') != 'QB_C2_PRODUCTION_DISTRIBUTION_INTEGRATION_PASS': raise SystemExit(f"FATAL: QB C2 production integration not certified: {q.get('disposition')}")
          if int(q.get('football_qb_rows',0)) != expected or int(q.get('selected_qb_rows',0)) <= 0: raise SystemExit(f"FATAL: QB C2 current-output coverage invalid expected={expected}: {q}")
          if float(q.get('max_raw_qb_mean_gap',1.0)) > 1e-10: raise SystemExit(f"FATAL: QB C2 raw mean drift: {q.get('max_raw_qb_mean_gap')}")
          if int(q.get('state_capture_changed_arrays',-1)) != 0: raise SystemExit(f"FATAL: QB C2 state-capture seam changed arrays: {q.get('state_capture_changed_arrays')}")
          if float(q.get('state_capture_max_element_gap',1.0)) > 1e-12: raise SystemExit(f"FATAL: QB C2 state-capture element drift: {q.get('state_capture_max_element_gap')}")
          if int(q.get('sportsbook_inputs_to_selector',1)) != 0 or int(q.get('sportsbook_inputs_to_starter_selection',1)) != 0 or int(q.get('sportsbook_inputs_to_c2_generation',1)) != 0: raise SystemExit('FATAL: QB C2 sportsbook leakage flag')
          if int(q.get('receiver_outputs_replaced',1)) != 0 or int(q.get('rb_outputs_replaced',1)) != 0: raise SystemExit('FATAL: QB C2 replaced non-QB outputs')
          if q.get('wr_r15_consumed_before_c2') is not True: raise SystemExit('FATAL: QB C2 did not consume the post-R15 football state')
          required={'disposition':'WR_R15_FULL_SLATE_ENTITLEMENT_READY','model_version':'WR_R15_PRODUCTION_MODEL_V1','m38_wr1_anchor_preserved':True,'wr2plus_pool_preserved':True,'wr_room_mass_preserved':True,'non_wr_entitlement_preserved':True,'team_total_player_entitlement_preserved':True,'sportsbook_inputs_used':False,'current_or_future_outcomes_used':False}
          for k,v in required.items():
              if w.get(k)!=v: raise SystemExit(f'FATAL: WR-R15 contract drift {k}: {w.get(k)!r}')
          if int(w.get('current_wr1_anchor_rows',0)) != expected: raise SystemExit(f'FATAL: WR-R15 anchor coverage expected={expected}')
          if float(w.get('max_wr1_anchor_entitlement_delta',1.0)) != 0.0 or float(w.get('max_non_wr_entitlement_delta',1.0)) != 0.0: raise SystemExit('FATAL: WR-R15 changed WR1 or non-WR entitlement')
          print('M38_R15_TE_R5P_C2_PRODUCTION_INTEGRATION_CERTIFIED')
          EOF
          python scripts/stamp_qb_c2_pricing_lineage_v1.py
          test -s data/qb_c2_pricing_lineage_stamp_audit.json
          python scripts/validate_rb_rush_rec_conservation_v1.py
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_anytime_td_model_status_v1.py
          python scripts/validate_team_target_pool_full_universe_v2.py
          python scripts/validate_certified_full_slate_stack_v2.py
          python - <<'EOF'
          import numpy as np
          import pandas as pd
          from scripts.artifact_contracts import CONTRACTS
          from scripts.utils.eligible_team_set_v1 import expected_current_teams
          c=CONTRACTS['props_priced']; df=pd.read_csv(c.path,low_memory=False)
          if df.empty: raise SystemExit('FATAL: certified Full Slate pricing produced zero rows')
          missing=[x for x in c.required_columns if x not in df.columns]
          if missing: raise SystemExit(f'FATAL: priced artifact contract missing columns: {missing}')
          for col in ('simulation_iterations','ml_applied','state_applied','bayes_applied','rules_applied','ensemble_status'):
              if col not in df.columns: raise SystemExit(f'FATAL: priced output missing {col}')
          expected=set(expected_current_teams() or [])
          outteams=set(df['team'].dropna().astype(str)) if 'team' in df.columns else set()
          if not outteams.issubset(expected): raise SystemExit(f'FATAL: sportsbook resurrected withheld team(s): {sorted(outteams-expected)}')
          qb=df.loc[df['source_market'].astype(str).eq('player_pass_yds')].copy()
          if not qb.empty:
              required=['qb_synthesis_applied','qb_synthesis_proj','qb_synthesis_version','qb_distribution_candidate_version','qb_distribution_selector_version','qb_distribution_route']
              missing=[x for x in required if x not in qb.columns]
              if missing: raise SystemExit(f'FATAL: certified QB pricing audit columns missing: {missing}')
              if not pd.to_numeric(qb['qb_synthesis_applied'],errors='coerce').eq(1).all(): raise SystemExit('FATAL: not every priced pass_yards row used promoted QB synthesis')
              proj=pd.to_numeric(qb['qb_synthesis_proj'],errors='coerce'); final=pd.to_numeric(qb['model_proj'],errors='coerce')
              if proj.isna().any() or final.isna().any() or not np.allclose(proj,final,rtol=0,atol=1e-8): raise SystemExit('FATAL: final QB model projection is not the promoted synthesis mean')
              if qb['qb_distribution_candidate_version'].fillna('').astype(str).str.strip().eq('').any(): raise SystemExit('FATAL: QB C2 candidate lineage missing from pass-yard rows')
          metrics=pd.read_csv('data/metrics_ready.csv',low_memory=False)
          pos_col=next((c for c in ('position_group','position','alignment_position') if c in metrics.columns),None)
          if pos_col is None: raise SystemExit('FATAL: metrics missing position for RB routing audit')
          pos=metrics[['player','team',pos_col]].drop_duplicates(['player','team']).copy(); pos['position_family']=pos[pos_col].fillna('').astype(str).str.upper().str.strip().replace({'HB':'RB','TB':'RB'})
          rush=df.loc[df['source_market'].astype(str).eq('player_rush_yds')].merge(pos[['player','team','position_family']],on=['player','team'],how='left',validate='many_to_one')
          rb=rush.loc[rush['position_family'].isin({'RB','FB'})].copy(); nonrb=rush.loc[~rush['position_family'].isin({'RB','FB'})].copy()
          if not rb.empty:
              if not pd.to_numeric(rb['rb_synthesis_applied'],errors='coerce').eq(1).all(): raise SystemExit('FATAL: eligible RB/FB rush rows bypassed P3')
              p3=pd.to_numeric(rb['rb_synthesis_proj'],errors='coerce'); final=pd.to_numeric(rb['model_proj'],errors='coerce')
              if p3.isna().any() or final.isna().any() or not np.allclose(p3,final,rtol=0,atol=1e-8): raise SystemExit('FATAL: final RB model projection is not the promoted P3 synthesis mean')
          if not nonrb.empty and not pd.to_numeric(nonrb['rb_synthesis_applied'],errors='coerce').fillna(0).eq(0).all(): raise SystemExit('FATAL: non-RB rushing rows incorrectly consumed RB P3')
          print(f"CERTIFIED LIVE PRICING rows={len(df)} players={df.player.nunique()} QB_side_rows={len(qb)} RB_FB_rush_side_rows={len(rb)} non_RB_rush_side_rows={len(nonrb)}")
          EOF

      - name: Strict repository audits
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict

      - name: Build master betting workbook artifact
        if: always()
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          mkdir -p outputs
          python scripts/build_master_betting_workbook_v1.py \
            --root . \
            --out outputs/NFL_BETTING_MODEL_MASTER.xlsx \
            --run-id "${GITHUB_RUN_ID}" \
            --sha "${GITHUB_SHA}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --fetch-live-odds "${FETCH_LIVE_ODDS}"
          test -s outputs/NFL_BETTING_MODEL_MASTER.xlsx
          echo "MASTER BETTING WORKBOOK: outputs/NFL_BETTING_MODEL_MASTER.xlsx"

      - name: Summarize outputs
        if: always()
        run: |
          echo '=== availability certification ==='
          test -f data/current_player_availability_game_certification.json && cat data/current_player_availability_game_certification.json || true
          echo '=== availability status ==='
          test -f data/current_player_availability_status.json && cat data/current_player_availability_status.json || true
          echo '=== live odds status ==='
          test -f data/live_odds_status.json && cat data/live_odds_status.json || echo 'live odds not requested'
          echo '=== certified stack status ==='
          test -f data/certified_full_slate_stack_audit.json && cat data/certified_full_slate_stack_audit.json || echo 'certified pricing stack not executed'
          echo '=== provider status ==='
          test -f data/provider_readiness_v3.csv && cat data/provider_readiness_v3.csv || true
          echo '=== identity status ==='
          test -f data/player_identity_validation.csv && cat data/player_identity_validation.csv || true
          echo '=== generated artifacts ==='
          find data outputs -maxdepth 2 -type f \( -name "*.csv" -o -name "*.json" -o -name "*.xlsx" \) -print0 2>/dev/null | xargs -0 -r -I{} sh -c 'echo "--- {}"; wc -l "{}"'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run_${{ github.run_id }}
          path: |
            data/**
            outputs/**
          if-no-files-found: warn
          retention-days: 7