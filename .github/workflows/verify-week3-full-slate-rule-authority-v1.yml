name: Verify Week3 Full Slate Rule Authority V1

on:
  push:
    branches:
      - fix-week3-full-slate-rule-authority-v1
    paths:
      - 'docs/production/WEEK3_FULL_SLATE_RULE_AUTHORITY_REPAIR_V1_RUN.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SEASON: '2026'
      PRIOR_SEASON: '2025'
      NFL_RUNTIME_WEEK: '3'
      ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused regression tests
        run: |
          export PYTHONPATH="${PWD}"
          pytest -q tests/test_simulation_rules_v2.py
          python -m py_compile scripts/modeling/simulation_rules.py scripts/run_pricing_v2.py

      - name: Restore exact failed Week3 prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/week3_failed
          mkdir -p /tmp/week3_failed
          gh run download 36276421905             --repo "${GITHUB_REPOSITORY}"             --name run_36276421905             --dir /tmp/week3_failed
          test -s /tmp/week3_failed/data/player_form_consensus.csv
          test -s /tmp/week3_failed/data/model_bayesian_diagnostics.csv
          test -s /tmp/week3_failed/data/metrics_ready.csv
          cp -a /tmp/week3_failed/data/. data/
          cp -a /tmp/week3_failed/outputs/. outputs/

      - name: Assert frozen root-cause precondition
        run: |
          python - <<'PY'
          import pandas as pd
          pf=pd.read_csv('data/player_form_consensus.csv',low_memory=False)
          metrics=pd.read_csv('data/metrics_ready.csv',low_memory=False)
          bayes=pd.read_csv('data/model_bayesian_diagnostics.csv',low_memory=False)
          p=pf.loc[(pf.team.astype(str)=='LAR') & (pf.player_clean_key.astype(str)=='pukanacua')]
          b=bayes.loc[(bayes.team.astype(str)=='LAR') & (bayes.player_clean_key.astype(str)=='pukanacua')]
          m=metrics.loc[(metrics.team.astype(str)=='LAR') & (metrics.player_clean_key.astype(str)=='pukanacua')]
          assert len(p)==1, len(p)
          assert len(b)==1, len(b)
          assert len(m)==0, len(m)
          raw=float(p.iloc[0].tgt_share)
          post=float(b.iloc[0].bayes_tgt_share)
          assert abs(raw-post) > 1e-6
          print({'puka_raw_tgt_share':raw,'puka_bayes_tgt_share':post,'metrics_rows':len(m)})
          PY

      - name: Apply the same current-slate runtime seams
        run: |
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py

      - name: Replay exact pricing stack without a new odds fetch
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          rm -f outputs/props_priced_clean.csv
          python scripts/run_pricing_with_full_roster_universe_v3.py --season 2026
          test -s outputs/props_priced_clean.csv
          test -s data/football_simulation_universe_audit.json
          test -s data/rb_rush_rec_conservation_v2_production_audit.json

      - name: Verify football-rule parity and output
        run: |
          python - <<'PY'
          import json, pandas as pd
          a=json.load(open('data/football_simulation_universe_audit.json'))
          diffs=a.get('max_abs_football_assumption_diff',{})
          bad={k:float(v) for k,v in diffs.items() if float(v)>1e-9}
          if bad:
              raise SystemExit(f'football assumption drift remains: {bad}')
          out=pd.read_csv('outputs/props_priced_clean.csv',low_memory=False)
          if out.empty:
              raise SystemExit('priced output empty')
          print({'priced_rows':len(out),'players':out.player.nunique(),'teams':out.team.nunique(),'max_rule_diffs':diffs})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week3-full-slate-rule-authority-v1
          path: |
            data/football_simulation_universe_audit.json
            data/football_simulation_universe_audit.csv
            data/model_rule_simulation_inputs.csv
            data/target_entitlement_v1_trace.csv
            data/te_r5p_full_slate_entitlement_trace.csv
            data/wr_r15_full_slate_entitlement_trace.csv
            data/qb_c2_production_integration_audit.json
            data/rb_rush_rec_conservation_v2_production_audit.json
            outputs/props_priced_clean.csv
          if-no-files-found: warn
          retention-days: 90
