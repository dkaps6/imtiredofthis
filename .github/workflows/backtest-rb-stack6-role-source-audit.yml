name: RB-STACK6 Role Source Audit

on:
  push:
    branches:
      - research-rb-stack6-secondary-back-role-state
    paths:
      - 'scripts/backtest/audit_rb_stack6_role_sources.py'
      - 'docs/migrations/RB_STACK6_SECONDARY_BACK_ROLE_STATE_PLAN.md'
      - '.github/workflows/backtest-rb-stack6-role-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 pyarrow==17.0.0 nflreadpy
      - name: Compile
        run: python -m py_compile scripts/backtest/audit_rb_stack6_role_sources.py
      - name: Audit role sources
        run: |
          rm -rf data/backtests/rb_stack6_source
          python scripts/backtest/audit_rb_stack6_role_sources.py \
            --seasons 2024,2025 \
            --out-dir data/backtests/rb_stack6_source
      - name: Show outputs
        if: always()
        run: |
          echo '=== disposition ==='
          cat data/backtests/rb_stack6_source/stack6_source_disposition.csv 2>/dev/null || true
          echo '=== source by season ==='
          cat data/backtests/rb_stack6_source/stack6_source_by_season.csv 2>/dev/null || true
          echo '=== feasibility ==='
          cat data/backtests/rb_stack6_source/stack6_feature_feasibility.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6-role-source-audit
          path: data/backtests/rb_stack6_source/**
          if-no-files-found: warn
          retention-days: 30
