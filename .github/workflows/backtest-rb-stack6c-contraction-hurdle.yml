name: RB-STACK6C Contraction Hurdle

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6c-contraction-hurdle
    paths:
      - 'scripts/backtest/evaluate_rb_stack6c_contraction_hurdle.py'
      - 'docs/migrations/RB_STACK6C_CONTRACTION_HURDLE_PLAN.md'
      - '.github/workflows/backtest-rb-stack6c-contraction-hurdle.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  STACK6_RUN_ID: '33549529203'
  ROTATION_RUN_ID: '33571118247'
  IDENTITY_RUN_ID: '33548910561'
  MARKET_RUN_ID: '33499129109'

jobs:
  stack6c:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2

      - name: Compile evaluator
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6c_contraction_hurdle.py

      - name: Download frozen parent, source, identity, and downstream market artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6c/stack6 \
                   data/backtests/rb_stack6c/rotation \
                   data/backtests/rb_stack6c/identity \
                   data/backtests/rb_stack6c/market
          gh run download "$STACK6_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-model --dir data/backtests/rb_stack6c/stack6
          gh run download "$ROTATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6c-rotation-source-audit --dir data/backtests/rb_stack6c/rotation
          gh run download "$IDENTITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-source-audit --dir data/backtests/rb_stack6c/identity
          gh run download "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-market-benchmark-2025 --dir data/backtests/rb_stack6c/market
          test -s data/backtests/rb_stack6c/stack6/stack6_2025_casebook.csv
          test -s data/backtests/rb_stack6c/rotation/stack6c_rotation_player_game_comparison.csv
          test -s data/backtests/rb_stack6c/identity/stack6_rb_player_game_roles.csv
          test -s data/backtests/rb_stack6c/market/rb_market_casebook.csv

      - name: Evaluate frozen STACK6C hurdle
        run: |
          rm -rf data/backtests/rb_stack6c/results
          python scripts/backtest/evaluate_rb_stack6c_contraction_hurdle.py \
            --stack6-root data/backtests/rb_stack6c/stack6 \
            --rotation-root data/backtests/rb_stack6c/rotation \
            --identity-root data/backtests/rb_stack6c/identity \
            --market-root data/backtests/rb_stack6c/market \
            --out-dir data/backtests/rb_stack6c/results

      - name: Show results
        if: always()
        run: |
          echo '=== coverage ==='
          cat data/backtests/rb_stack6c/results/stack6c_coverage.csv 2>/dev/null || true
          echo '=== scores ==='
          cat data/backtests/rb_stack6c/results/stack6c_score_table.csv 2>/dev/null || true
          echo '=== gates ==='
          cat data/backtests/rb_stack6c/results/stack6c_retention_gates.csv 2>/dev/null || true
          echo '=== frozen disposition ==='
          cat data/backtests/rb_stack6c/results/stack6c_disposition.csv 2>/dev/null || true
          echo '=== downstream market ==='
          cat data/backtests/rb_stack6c/results/stack6c_market_metrics.csv 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6c-contraction-hurdle
          path: data/backtests/rb_stack6c/results/**
          if-no-files-found: warn
          retention-days: 30
