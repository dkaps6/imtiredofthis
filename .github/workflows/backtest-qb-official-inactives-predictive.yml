name: Migration 79 QB Official Inactives Predictive Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/test_qb_official_inactives_predictive.py'
      - 'data/backtests/qb_m78_official_inactives_corrected/**'
      - 'data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv'
      - '.github/workflows/backtest-qb-official-inactives-predictive.yml'

permissions:
  contents: write
  actions: read

jobs:
  backtest:
    if: github.head_ref == 'backtest-migration-79-qb-official-inactives-predictive-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow requests beautifulsoup4 scikit-learn

      - name: Frozen M79 experiment contract
        run: |
          echo 'M79 is ONE predictive test of corrected official game-day inactive identities.'
          echo 'Canonical baseline: SHA c4a481a760657bb7516d52b9aa9ba84af096063a4e78660b12a541f59fd7b742.'
          echo 'Corrected M78 source: Run #23 artifact 9725181841; CSV SHA d39aaf0feea101f3e0d2721ebd4118ef33fb1a4d3c76670e2a4f17734e37b609.'
          echo '2024 development/training only. 2025 untouched evaluation.'
          echo 'One model family: StandardScaler + Ridge(alpha=10, fit_intercept=False).'
          echo 'Targets: attempt residual and YPA residual separately.'
          echo 'Features: exact inactive identity/position, strictly-prior snap role, strictly-prior individual pass-rush quality.'
          echo 'No sportsbook data. No generic injury feed. No M77 depth-chart-discontinuity remix. No target-game outcomes as features.'
          echo 'Promotion gates frozen before first result:'
          echo '  2024 late-development pass MAE gain >= 0.0'
          echo '  2025 pass MAE gain >= 1.50 yards'
          echo '  2025 correlation gain >= 0.02'
          echo '  2025 100+ yard misses do not increase'
          echo '  paired bootstrap P(pass-MAE gain > 0) >= 0.80'
          echo '  real attempt or YPA component signal under frozen component thresholds'
          echo '  inactive-to-GSIS bridge >= 0.90'
          echo 'If rejected, no model/threshold/subset retest on the same inactive information family.'

      - name: Verify canonical v3
        run: |
          set -euo pipefail
          CANON=data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv
          test -s "$CANON"
          echo 'c4a481a760657bb7516d52b9aa9ba84af096063a4e78660b12a541f59fd7b742  '$CANON | sha256sum -c -

      - name: Persist exact corrected M78 snapshot before prediction
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=data/backtests/qb_m78_official_inactives_corrected
          TARGET=$ROOT/m78_corrected_candidate_teamweek.csv
          EXPECT=d39aaf0feea101f3e0d2721ebd4118ef33fb1a4d3c76670e2a4f17734e37b609
          if [ -s "$TARGET" ]; then
            echo "$EXPECT  $TARGET" | sha256sum -c -
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/backtests/qb_m78_official_inactives_corrected/manifest.json')
          m=json.loads(p.read_text())
          assert m['source_run_id']==33288381864
          assert m['source_artifact_id']==9725181841
          assert m['csv_sha256']=='d39aaf0feea101f3e0d2721ebd4118ef33fb1a4d3c76670e2a4f17734e37b609'
          PY
            echo 'persisted=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/m78artifact "$ROOT"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9725181841/zip" \
            -o /tmp/m78.zip
          unzip -q /tmp/m78.zip -d /tmp/m78artifact
          SRC=$(find /tmp/m78artifact -type f -name m78_corrected_candidate_teamweek.csv | head -1)
          test -n "$SRC"
          echo "$EXPECT  $SRC" | sha256sum -c -
          cp "$SRC" "$TARGET"
          python - <<'PY'
          import pandas as pd
          p='data/backtests/qb_m78_official_inactives_corrected/m78_corrected_candidate_teamweek.csv'
          d=pd.read_csv(p)
          assert len(d)==1088
          assert d.groupby('season').size().to_dict()=={2024:544,2025:544}
          assert not d.duplicated(['season','week','team']).any()
          PY
          cat > "$ROOT/manifest.json" <<'JSON'
          {
            "migration": "M78 corrected snapshot frozen for M79",
            "source_run_id": 33288381864,
            "source_artifact_id": 9725181841,
            "source_artifact_digest": "sha256:af0d72a31bc522791bb887dea9ba4f2087e41949be1db15f92973c06140106e6",
            "source_head_sha": "426fde17668aad049e887ba8da0776a28a4dc9ca",
            "csv_sha256": "d39aaf0feea101f3e0d2721ebd4118ef33fb1a4d3c76670e2a4f17734e37b609",
            "rows": 1088,
            "season_rows": {"2024": 544, "2025": 544},
            "semantics": "NFL official game-day inactive identities; fixed pre-kickoff fact. M78 Run #3 snapshot is superseded."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          git commit -m 'Persist corrected M78 inactive snapshot for M79'
          git push origin HEAD:${GITHUB_HEAD_REF}
          echo 'persisted=true' >> "$GITHUB_OUTPUT"
          echo 'Snapshot persisted. This run intentionally skips prediction; the pushed head will trigger the authoritative M79 run.'

      - name: Compile M79
        if: steps.freeze.outputs.persisted != 'true'
        run: python -m py_compile scripts/backtest/test_qb_official_inactives_predictive.py

      - name: Run M79 predictive test
        if: steps.freeze.outputs.persisted != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/test_qb_official_inactives_predictive.py \
            --canonical data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv \
            --inactives data/backtests/qb_m78_official_inactives_corrected/m78_corrected_candidate_teamweek.csv \
            --out-dir data/backtests/qb_m79

      - name: Print M79 outputs
        if: steps.freeze.outputs.persisted != 'true'
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_m79/m79_interpretation.csv
          echo '--- metrics ---'
          cat data/backtests/qb_m79/m79_metrics.csv
          echo '--- promotion gates ---'
          cat data/backtests/qb_m79/m79_promotion_gates.csv
          echo '--- bootstrap ---'
          cat data/backtests/qb_m79/m79_bootstrap.csv

      - name: Upload M79 artifact
        if: steps.freeze.outputs.persisted != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: migration-79-qb-official-inactives-predictive
          path: data/backtests/qb_m79/*
          if-no-files-found: error
          retention-days: 14
