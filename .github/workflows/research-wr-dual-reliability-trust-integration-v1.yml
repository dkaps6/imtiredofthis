name: Research WR Dual Reliability Trust Integration V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/WR_DUAL_RELIABILITY_TRUST_INTEGRATION_V1_FREEZE.md"
      - "scripts/research/evaluate_wr_dual_reliability_trust_integration_v1.py"
      - "tests/test_wr_dual_reliability_trust_integration_v1.py"
      - ".github/workflows/research-wr-dual-reliability-trust-integration-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_wr_dual_reliability_trust_integration_v1.py
          pytest -q tests/test_wr_dual_reliability_trust_integration_v1.py

      - name: Download exact WR efficiency-trust parent
        uses: actions/download-artifact@v4
        with:
          name: pass-catcher-efficiency-difficulty-trust-selectivity-v1-38826418315
          path: /tmp/parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38826418315

      - name: Resolve exact source
        run: |
          set -euo pipefail
          ROWS="$(find /tmp/parent -type f -name 'wr_efficiency_difficulty_trust_rows.csv' -print -quit)"
          test -n "$ROWS" && test -s "$ROWS"
          echo "ROWS=$ROWS" >> "$GITHUB_ENV"

      - name: Evaluate frozen no-fit dual trust integration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/result
          mkdir -p /tmp/result
          python scripts/research/evaluate_wr_dual_reliability_trust_integration_v1.py             --rows "$ROWS"             --out-dir /tmp/result

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/result/wr_dual_reliability_trust_integration_result.json'))
          assert p['version']=='WR_DUAL_RELIABILITY_TRUST_INTEGRATION_V1',p
          assert p['disposition'] in {
            'WR_DUAL_RELIABILITY_TRUST_HISTORICAL_INTEGRATION_SUPPORTED__PROSPECTIVE_REQUIRED',
            'NO_ACTIONABLE_WR_DUAL_RELIABILITY_TRUST_INTEGRATION',
          },p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['models_fit']==0,p
          assert p['projection_distribution_values_changed']==0,p
          assert p['production_changed'] is False,p
          print('WR_DUAL_RELIABILITY_TRUST_INTEGRATION_V1_BOUNDARY_PASS')
          PY

      - name: Show result
        if: always()
        run: cat /tmp/result/wr_dual_reliability_trust_integration_result.json 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-dual-reliability-trust-integration-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/result/**
            docs/research/WR_DUAL_RELIABILITY_TRUST_INTEGRATION_V1_FREEZE.md
