name: RB R25 Receptions Specialist V1

on:
  push:
    branches:
      - research-rb-r25-receptions-specialist-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PRODUCTION_BASE_SHA: f8417f55b04ce0e19baf260e9d532765034c47f1

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml scipy scikit-learn

      - name: Verify frozen plan, code, and protected production authority
        run: |
          set -euo pipefail
          test -s docs/research/RB_R25_RECEPTIONS_SPECIALIST_V1_FROZEN_PLAN.md
          test -s scripts/backtest/evaluate_rb_r25_receptions_specialist_v1.py
          test -s scripts/backtest/finalize_rb_r25_receptions_specialist_v1.py
          python -m py_compile \
            scripts/backtest/evaluate_rb_r25_receptions_specialist_v1.py \
            scripts/backtest/finalize_rb_r25_receptions_specialist_v1.py
          sha256sum docs/research/RB_R25_RECEPTIONS_SPECIALIST_V1_FROZEN_PLAN.md | tee r25_plan.sha256
          sha256sum \
            scripts/backtest/evaluate_rb_r25_receptions_specialist_v1.py \
            scripts/backtest/finalize_rb_r25_receptions_specialist_v1.py | tee r25_code.sha256
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml \
            .github/workflows/production-week1-v4-r22-certification.yml
          echo 'Protected production authority diff: CLEAN'

      - name: Build and evaluate frozen R25 confirmation folds
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for SEASON in 2020 2021 2022; do
            PRIOR=$((SEASON-1))
            if [ "$SEASON" = "2020" ]; then WEEKS='1-17'; else WEEKS='1-18'; fi
            D="data/r25_candidate_${SEASON}"
            O="data/backtests/r25_candidate_${SEASON}"
            rm -rf "$D" "$O"
            python scripts/backtest/build_historical_inputs.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py \
              --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" \
              --audit "$D/historical_defense_enrichment_audit.csv" \
              --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" \
              --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py \
              --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" \
              --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py \
              --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py \
              --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"
            python scripts/backtest/evaluate_rb_r25_receptions_specialist_v1.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" \
              --player-logs "$D/player_game_logs_history.csv" \
              --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" \
              --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" \
              --weather "$D/weather_history.csv" \
              --out-dir "$O"
          done

      - name: Apply frozen pooled R25 scientific gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/finalize_rb_r25_receptions_specialist_v1.py \
            --dirs \
              data/backtests/r25_candidate_2020 \
              data/backtests/r25_candidate_2021 \
              data/backtests/r25_candidate_2022 \
            --out data/backtests/r25_candidate_final/r25_final_disposition.json

      - name: Assert structural integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/backtests/r25_candidate_final/r25_final_disposition.json')
          d = json.loads(p.read_text())
          gates = d['integrity_gates']
          assert all(gates.values()), gates
          assert d['structural']['max_room_mass_gap'] < 1e-10
          assert d['structural']['max_receiving_yard_mean_gap'] == 0.0
          print('R25 structural integrity: PASS; sportsbook=0 future=0 RB-room conserved receiving-yard mean exact')
          PY

      - name: Upload R25 confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r25-receptions-specialist-v1
          retention-days: 90
          path: |
            r25_plan.sha256
            r25_code.sha256
            data/r25_candidate_2020/historical_input_validation.csv
            data/r25_candidate_2021/historical_input_validation.csv
            data/r25_candidate_2022/historical_input_validation.csv
            data/backtests/r25_candidate_2020/*
            data/backtests/r25_candidate_2021/*
            data/backtests/r25_candidate_2022/*
            data/backtests/r25_candidate_final/*
