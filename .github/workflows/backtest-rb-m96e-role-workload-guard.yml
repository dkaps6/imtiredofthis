name: M96E RB Role Workload Risk Guard

on:
  push:
    branches:
      - research-rb-m96e-workload-risk-guard
    paths:
      - 'scripts/backtest/evaluate_rb_m96e_role_workload_guard.py'
      - 'docs/migrations/M96E_RB_ROLE_WORKLOAD_RISK_GUARD_PLAN.md'
      - '.github/workflows/backtest-rb-m96e-role-workload-guard.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  M96D_RUN_ID: '33467325153'
  M95F_RUN_ID: '33389924330'
  M95I_RUN_ID: '33402566592'

jobs:
  rb-role-workload-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2
      - name: Download frozen parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m96d_frozen data/backtests/rb_m95f_frozen data/backtests/rb_m95i_frozen
          gh run download "$M96D_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-96d-rb-pregame-efficiency-router --dir data/backtests/rb_m96d_frozen
          gh run download "$M95F_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95f-rb-workload-regime-calibration --dir data/backtests/rb_m95f_frozen
          gh run download "$M95I_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95i-rb-deep-concentration-tail --dir data/backtests/rb_m95i_frozen
          test -s data/backtests/rb_m96d_frozen/m96d_router_trace.csv
          test -s data/backtests/rb_m95f_frozen/m95f_2025_rb_trace.csv
          test -s data/backtests/rb_m95i_frozen/m95i_2025_trace.csv
      - name: Run frozen M96E final router
        run: |
          python -m py_compile scripts/backtest/evaluate_rb_m96e_role_workload_guard.py
          python scripts/backtest/evaluate_rb_m96e_role_workload_guard.py --m96d-root data/backtests/rb_m96d_frozen --m95f-root data/backtests/rb_m95f_frozen --m95i-root data/backtests/rb_m95i_frozen --out-dir data/backtests/rb_m96e
      - name: Show results
        if: always()
        run: |
          cat data/backtests/rb_m96e/m96e_disposition.csv 2>/dev/null || true
          cat data/backtests/rb_m96e/m96e_retention_gate.csv 2>/dev/null || true
          cat data/backtests/rb_m96e/m96e_activation.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-96e-rb-role-workload-risk-guard
          path: data/backtests/rb_m96e/**
          retention-days: 30
          if-no-files-found: warn
