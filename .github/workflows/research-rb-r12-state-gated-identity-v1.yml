name: RB R12 State Gated Identity V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - scripts/backtest/evaluate_rb_r12_state_gated_identity_v1.py
      - .github/workflows/research-rb-r12-state-gated-identity-v1.yml
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.4.2
      - name: Download authoritative R10 artifact
        uses: actions/download-artifact@v4
        with:
          name: rb-r10-modern-stability-v1
          path: r10-artifact
          github-token: ${{ github.token }}
          repository: dkaps6/imtiredofthis
          run-id: 34269618181
      - name: Locate R10 predictions
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          PRED="$(find r10-artifact -type f -name rb_r10_predictions.csv -print -quit)"
          test -n "$PRED"
          echo "pred=$PRED" >> "$GITHUB_OUTPUT"
      - name: Run frozen R12 state-gated stability candidate
        run: |
          python scripts/backtest/evaluate_rb_r12_state_gated_identity_v1.py \
            --predictions '${{ steps.locate.outputs.pred }}' \
            --out-dir data/backtests/rb_r12_state_gated_identity_v1
      - name: Show R12 result
        run: |
          cat data/backtests/rb_r12_state_gated_identity_v1/rb_r12_result.json
          echo '=== summary ==='
          cat data/backtests/rb_r12_state_gated_identity_v1/rb_r12_summary.csv
      - name: Upload R12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r12-state-gated-identity-v1
          path: data/backtests/rb_r12_state_gated_identity_v1/*
          retention-days: 30
