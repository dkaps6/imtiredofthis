name: RB Individual Mechanism Decomposition
on:
  push:
    branches: [audit-rb-individual-mechanism-decomposition]
    paths:
      - 'scripts/backtest/evaluate_rb_individual_mechanism_decomposition.py'
      - 'docs/migrations/RB_INDIVIDUAL_MECHANISM_DECOMPOSITION_PLAN.md'
      - '.github/workflows/audit-rb-individual-mechanism-decomposition.yml'
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m py_compile scripts/backtest/evaluate_rb_individual_mechanism_decomposition.py
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p evidence/rb
          gh run download 34064260950 --repo "${GITHUB_REPOSITORY}" --name rb-individual-error-role-transition --dir evidence/rb
      - run: python scripts/backtest/evaluate_rb_individual_mechanism_decomposition.py --rb-root evidence/rb --out-dir data/backtests/rb_individual_mechanism_decomposition
      - run: cat data/backtests/rb_individual_mechanism_decomposition/rb_mechanism_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: rb-individual-mechanism-decomposition
          path: |
            data/backtests/rb_individual_mechanism_decomposition/*
            docs/migrations/RB_INDIVIDUAL_MECHANISM_DECOMPOSITION_PLAN.md
