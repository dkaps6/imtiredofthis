name: Fit TE-R5P Production Model V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - 'scripts/modeling/fit_te_r5p_production_model_v1.py'
      - 'docs/migrations/TE_R5P_FINAL_PRODUCTION_MODEL_V1_PLAN.md'
      - '.github/workflows/fit-te-r5p-production-model-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fit-te-r5p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile fitter
        run: python -m py_compile scripts/modeling/fit_te_r5p_production_model_v1.py
      - name: Download TE-R3 historical source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/te_r3
          gh run download 34126813280 --repo "${GITHUB_REPOSITORY}" --name te-r3-target-pool-context-model --dir evidence/te_r3
      - name: Download TE-R4 participation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/te_r4
          gh run download 34127474412 --repo "${GITHUB_REPOSITORY}" --name te-r4-strict-prior-participation-source --dir evidence/te_r4
      - name: Download TE-R5P authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/te_r5p
          gh run download 34152797603 --repo "${GITHUB_REPOSITORY}" --name te-r5p-production-contract-refit-v1 --dir evidence/te_r5p
      - name: Verify inputs
        run: |
          find evidence/te_r3 -name te_r3_oos_player_casebook.csv -size +0c | grep -q .
          find evidence/te_r4 -name te_r4_prior_participation_casebook.csv -size +0c | grep -q .
          find evidence/te_r4 -name te_r4_result.json -size +0c | grep -q .
          find evidence/te_r5p -name te_r5p_result.json -size +0c | grep -q .
      - name: Fit frozen final TE-R5P model
        run: |
          python scripts/modeling/fit_te_r5p_production_model_v1.py \
            --te-r3-root evidence/te_r3 \
            --te-r4-root evidence/te_r4 \
            --te-r5p-root evidence/te_r5p \
            --out-dir data/models/te_r5p_production_model_v1
      - name: Show fit result
        run: |
          cat data/models/te_r5p_production_model_v1/te_r5p_final_fit_result.json
          cat data/models/te_r5p_production_model_v1/te_r5p_production_model_v1.json
      - name: Upload fit evidence
        uses: actions/upload-artifact@v4
        with:
          name: te-r5p-production-model-v1
          path: |
            data/models/te_r5p_production_model_v1/*
            docs/migrations/TE_R5P_FINAL_PRODUCTION_MODEL_V1_PLAN.md
          retention-days: 30
