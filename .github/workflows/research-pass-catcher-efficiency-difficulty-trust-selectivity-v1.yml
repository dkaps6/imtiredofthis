name: Research Pass Catcher Efficiency Difficulty Trust Selectivity V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_V1_FREEZE.md"
      - "scripts/research/evaluate_pass_catcher_efficiency_difficulty_trust_selectivity_v1.py"
      - "tests/test_pass_catcher_efficiency_difficulty_trust_selectivity_v1.py"
      - ".github/workflows/research-pass-catcher-efficiency-difficulty-trust-selectivity-v1.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Run frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_pass_catcher_efficiency_difficulty_trust_selectivity_v1.py
          pytest -q tests/test_pass_catcher_efficiency_difficulty_trust_selectivity_v1.py

      - name: Download exact WR mechanism parent
        uses: actions/download-artifact@v4
        with:
          name: wr-player-mechanism-persistence-v1-37634044900
          path: /tmp/wr_parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37634044900

      - name: Download exact TE mechanism parent
        uses: actions/download-artifact@v4
        with:
          name: te-player-mechanism-persistence-v1-37631011196
          path: /tmp/te_parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37631011196

      - name: Resolve exact frozen parents
        run: |
          set -euo pipefail
          WR_ROWS="$(find /tmp/wr_parent -type f -name 'wr_player_mechanism_persistence_rows.csv' -print -quit)"
          TE_ROWS="$(find /tmp/te_parent -type f -name 'te_player_mechanism_persistence_rows.csv' -print -quit)"
          test -n "$WR_ROWS" && test -s "$WR_ROWS"
          test -n "$TE_ROWS" && test -s "$TE_ROWS"
          echo "WR_ROWS=$WR_ROWS" >> "$GITHUB_ENV"
          echo "TE_ROWS=$TE_ROWS" >> "$GITHUB_ENV"

      - name: Evaluate frozen efficiency-difficulty trust selector
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/result
          mkdir -p /tmp/result
          python scripts/research/evaluate_pass_catcher_efficiency_difficulty_trust_selectivity_v1.py             --wr-rows "$WR_ROWS"             --te-rows "$TE_ROWS"             --out-dir /tmp/result

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/result/pass_catcher_efficiency_difficulty_trust_selectivity_result.json'))
          assert p['version']=='PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_V1',p
          assert p['disposition'] in {
            'PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_BOTH_QUALIFIED',
            'PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_PARTIAL',
            'PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_CLOSED',
          },p
          assert p['wr']['disposition'] in {
            'WR_PLAYER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_QUALIFIED',
            'NO_ACTIONABLE_WR_PLAYER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY',
          },p
          assert p['te']['disposition'] in {
            'TE_PLAYER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_QUALIFIED',
            'NO_ACTIONABLE_TE_PLAYER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY',
          },p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['predictive_models_fit']==0,p
          assert p['projection_distribution_values_changed']==0,p
          assert p['production_changed'] is False,p
          for pos in ('wr','te'):
              integ=p[pos]['integrity']
              assert integ['max_decomposition_gap']<=1e-9,p
              assert integ['max_abs_total_gap']<=1e-9,p
              assert integ['max_abs_opportunity_gap']<=1e-9,p
              assert integ['max_abs_efficiency_gap']<=1e-9,p
          print('PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_V1_BOUNDARY_PASS')
          PY

      - name: Show result
        if: always()
        run: |
          cat /tmp/result/pass_catcher_efficiency_difficulty_trust_selectivity_result.json 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-catcher-efficiency-difficulty-trust-selectivity-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/result/**
            docs/research/PASS_CATCHER_EFFICIENCY_DIFFICULTY_TRUST_SELECTIVITY_V1_FREEZE.md
