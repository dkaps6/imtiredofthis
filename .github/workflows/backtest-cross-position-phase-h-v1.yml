name: Cross-Position Phase H V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/backtest-cross-position-phase-h-v1.yml'
      - 'scripts/backtest/cross_position_phase_h_v1.py'
      - 'docs/migrations/CROSS_POSITION_PHASE_H_PLAYER_YARD_PROPAGATION_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  phase-h:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-H evaluator
        run: python -m py_compile scripts/backtest/cross_position_phase_h_v1.py
      - name: Download authoritative Phase-C evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_c
          gh run download 34147777341 --repo "${GITHUB_REPOSITORY}" --name cross-position-catastrophic-casebook-v1-phase-c --dir evidence/phase_c
      - name: Download authoritative Phase-G evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_g
          gh run download 34150685094 --repo "${GITHUB_REPOSITORY}" --name cross-position-phase-g-v1 --dir evidence/phase_g
      - name: Verify frozen inputs
        run: |
          test -s evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv
          test -s evidence/phase_g/data/backtests/cross_position_phase_g_v1/phase_g_casebook.csv
      - name: Run Phase-H player-yard propagation
        run: |
          python scripts/backtest/cross_position_phase_h_v1.py \
            --phase-c-all-rows evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv \
            --phase-g-casebook evidence/phase_g/data/backtests/cross_position_phase_g_v1/phase_g_casebook.csv \
            --out-dir data/backtests/cross_position_phase_h_v1
      - name: Show Phase-H result
        if: always()
        run: |
          cat data/backtests/cross_position_phase_h_v1/phase_h_result.json 2>/dev/null || true
          cat data/backtests/cross_position_phase_h_v1/phase_h_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_h_v1/phase_h_q4_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_h_v1/phase_h_catastrophic_yard_counts.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_h_v1/phase_h_actual_state_scorecard.csv 2>/dev/null || true
      - name: Upload Phase-H evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-phase-h-v1
          path: |
            data/backtests/cross_position_phase_h_v1/*
            docs/migrations/CROSS_POSITION_PHASE_H_PLAYER_YARD_PROPAGATION_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
