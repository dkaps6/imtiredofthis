name: Research Player Opportunity Difficulty Target Allocation Source V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/PLAYER_OPPORTUNITY_DIFFICULTY_TARGET_ALLOCATION_SOURCE_V1.md"
      - "scripts/research/audit_player_opportunity_difficulty_target_allocation_source_v1.py"
      - ".github/workflows/research-player-opportunity-difficulty-target-allocation-source-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy
      - name: Download certified recovered WR/TE fold authority
        uses: actions/download-artifact@v4
        with:
          name: wr-te-fold-authorities-recovered-v1
          path: /tmp/recovered
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37782189538
      - name: Verify recovery manifest and resolve files
        run: |
          set -euo pipefail
          test -s /tmp/recovered/recovery_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/recovered/recovery_manifest.json').read_text())
          assert p['status']=='WR_TE_FOLD_AUTHORITIES_RECOVERED_EXACT',p
          assert p['provider_rebuild_used'] is False,p
          assert p['sportsbook_inputs_used'] is False,p
          print('RECOVERED_FOLD_AUTHORITY_CERTIFIED')
          PY
          WR="$(find /tmp/recovered -type f -name 'wr_r15_confirmation_predictions.csv' -print -quit)"
          TE="$(find /tmp/recovered -type f -name 'te_r5p_oos_player_casebook.csv' -print -quit)"
          test -n "$WR" && test -s "$WR"
          echo "WR=$WR" >> "$GITHUB_ENV"
          if [ -n "$TE" ] && [ -s "$TE" ]; then
            echo "TE=$TE" >> "$GITHUB_ENV"
            echo "TE casebook preserved in recovered authority"
          else
            echo "TE=" >> "$GITHUB_ENV"
            echo "TE casebook not preserved; replay reconstruction required"
          fi
      - name: Audit frozen authority lineage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/out
          python scripts/research/audit_player_opportunity_difficulty_target_allocation_source_v1.py \
            --wr "$WR" \
            --te "$TE" \
            --out-dir /tmp/out
      - name: Show result
        if: always()
        run: cat /tmp/out/result.json 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-opportunity-difficulty-target-allocation-source-v1
          path: /tmp/out/*
          if-no-files-found: warn
          retention-days: 30
