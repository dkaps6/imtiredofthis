name: Migration 87 QB Low-Chaos Pregame Atlas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-qb-low-chaos-pregame-atlas.yml"
      - "scripts/backtest/audit_qb_low_chaos_pregame_atlas.py"
      - "docs/migrations/M87_LOW_CHAOS_CATASTROPHIC_PREGAME_ATLAS.md"

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen M87 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          doc=Path('docs/migrations/M87_LOW_CHAOS_CATASTROPHIC_PREGAME_ATLAS.md').read_text()
          required=[
              '38', '16', '17', '5',
              '56.749517', '41.103131',
              'latest `8` prior regular-season games',
              'five nearest controls',
              'LOW_EVENT_CHAOS',
              'STABLE_FORENSIC_DIFFERENTIATOR',
              'MODEL_REPRESENTATION_CLUE',
              'advancement_eligible = false',
              'No Ridge/HGB/XGB/neural-network/selector search',
              'production_actionable = false',
          ]
          missing=[x for x in required if x not in doc]
          assert not missing, missing
          print('M87 frozen contract: PASS')
          PY

  forensic-atlas:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Recover authoritative M86 forensic trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m86_artifact
          gh api /repos/dkaps6/imtiredofthis/actions/artifacts/9735538162/zip > /tmp/m86.zip
          unzip -q /tmp/m86.zip -d /tmp/m86_artifact
          TRACE=$(find /tmp/m86_artifact -name m86_qb_forensic_trace.csv -print -quit)
          test -n "$TRACE"
          cp "$TRACE" /tmp/m86_qb_forensic_trace.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('/tmp/m86_qb_forensic_trace.csv',low_memory=False)
          tail=x['tail100'].astype(str).str.lower().isin(['true','1'])
          chaos=x['high_event_chaos'].astype(str).str.lower().isin(['true','1'])
          low=x.loc[tail & ~chaos]
          counts=low['component_class'].astype(str).str.upper().value_counts().to_dict()
          assert len(x)==884, len(x)
          assert int(tail.sum())==123, int(tail.sum())
          assert len(low)==38, len(low)
          assert counts.get('VOLUME_DOMINANT',0)==16, counts
          assert counts.get('EFFICIENCY_DOMINANT',0)==17, counts
          assert counts.get('MIXED',0)==5, counts
          print('M86 authoritative target recovered:', len(low), 'low-chaos tails', counts)
          PY

      - name: Build target-week historical injury context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out /tmp/m87_injuries.csv

      - name: Run M87 low-chaos pregame atlas
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/m87_low_chaos_pregame_atlas
          python scripts/backtest/audit_qb_low_chaos_pregame_atlas.py \
            --m86-trace /tmp/m86_qb_forensic_trace.csv \
            --injuries /tmp/m87_injuries.csv \
            --out-dir data/backtests/m87_low_chaos_pregame_atlas

      - name: Verify M87 forensic-only boundary and decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('data/backtests/m87_low_chaos_pregame_atlas')
          d=json.loads((root/'m87_decision.json').read_text())
          atlas=pd.read_csv(root/'m87_feature_atlas.csv')
          rescue=pd.read_csv(root/'m87_model_rescue.csv')
          targets=pd.read_csv(root/'m87_low_chaos_targets_with_pregame_features.csv',low_memory=False)
          assert d['rows']==884, d
          assert d['tail100']==123, d
          assert d['low_event_chaos_tail_count']==38, d
          assert d['volume_low_chaos_n']==16, d
          assert d['efficiency_low_chaos_n']==17, d
          assert d['mixed_low_chaos_n']==5, d
          assert d['postgame_features_used_as_atlas_features'] is False
          assert d['predictive_model_fit'] is False
          assert d['sportsbook_features_used'] is False
          assert d['production_actionable'] is False
          assert set(atlas['family'])=={'VOLUME_DOMINANT','EFFICIENCY_DOMINANT'}
          assert len(targets)==38
          assert set(rescue['family'])=={'VOLUME_DOMINANT','EFFICIENCY_DOMINANT'}
          print('--- M87 DECISION ---')
          print(json.dumps(d,indent=2))
          print('--- M87 STABLE DIFFERENTIATORS ---')
          s=atlas.loc[atlas['stable_forensic_differentiator'].astype(str).str.lower().isin(['true','1'])]
          print(s.to_string(index=False) if len(s) else 'NONE')
          print('--- M87 MODEL RESCUE ---')
          print(rescue.to_string(index=False))
          PY

      - name: Upload M87 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m87-low-chaos-pregame-atlas
          path: data/backtests/m87_low_chaos_pregame_atlas/*
          if-no-files-found: warn
          retention-days: 14
