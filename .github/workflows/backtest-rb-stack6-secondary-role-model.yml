name: RB-STACK6 Secondary Role Model

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6-secondary-role-model
    paths:
      - 'scripts/backtest/evaluate_rb_stack6_secondary_role_model.py'
      - 'docs/migrations/RB_STACK6_SECONDARY_ROLE_MODEL_PLAN.md'
      - '.github/workflows/backtest-rb-stack6-secondary-role-model.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  SOURCE_RUN_ID: '33548910561'
  STACK4_RUN_ID: '33539814046'
  MARKET_RUN_ID: '33499129109'

jobs:
  stack6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2
      - name: Compile
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6_secondary_role_model.py
      - name: Download frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6_model/source data/backtests/rb_stack6_model/stack4 data/backtests/rb_stack6_model/market
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-source-audit --dir data/backtests/rb_stack6_model/source
          gh run download "$STACK4_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack4-efficiency-portability --dir data/backtests/rb_stack6_model/stack4
          gh run download "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-market-benchmark-2025 --dir data/backtests/rb_stack6_model/market
          test -s data/backtests/rb_stack6_model/source/stack6_rb_player_game_roles.csv
          test -s data/backtests/rb_stack6_model/stack4/stack4_2025_casebook.csv
          test -s data/backtests/rb_stack6_model/market/rb_market_casebook.csv
      - name: Evaluate frozen STACK6 protocol
        run: |
          rm -rf data/backtests/rb_stack6_model/results
          python scripts/backtest/evaluate_rb_stack6_secondary_role_model.py \
            --stack4-root data/backtests/rb_stack6_model/stack4 \
            --source-root data/backtests/rb_stack6_model/source \
            --market-root data/backtests/rb_stack6_model/market \
            --out-dir data/backtests/rb_stack6_model/results
      - name: Show results
        if: always()
        run: |
          echo '=== coverage ==='
          cat data/backtests/rb_stack6_model/results/stack6_coverage.csv 2>/dev/null || true
          echo '=== gates ==='
          cat data/backtests/rb_stack6_model/results/stack6_retention_gates.csv 2>/dev/null || true
          echo '=== market ==='
          cat data/backtests/rb_stack6_model/results/stack6_market_metrics.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6_model/results/stack6_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6-secondary-role-model
          path: data/backtests/rb_stack6_model/results/**
          if-no-files-found: warn
          retention-days: 30
