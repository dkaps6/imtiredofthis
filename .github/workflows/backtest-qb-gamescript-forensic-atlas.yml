name: Migration 69 QB Game Script Forensic Atlas

on:
  workflow_dispatch:
    inputs:
      iterations: {description: "MC iterations for canonical reconstruction", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-69-qb-gamescript-forensic-atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn scipy joblib pyarrow

      - name: Declare Migration 69 frozen scope
        run: |
          echo "M69 follows M68 m68_opening_playcaller_partial_signal."
          echo "M69 is forensic discovery, NOT predictive model selection and NOT production promotion."
          echo "Target games are the already-consumed 2024/2025 development seasons; 2023 is history context only."
          echo "Postgame PBP/participation is explicitly allowed only to reconstruct what football mechanism occurred."
          echo "Pregame-candidate tests use only already-pregame M65/M68 columns."
          echo "Raw pass-yards error is decomposed into attempt-volume contribution, YPA contribution, and interaction."
          echo "Frozen volume mechanism priority: role -> opening-plan deviation -> score-state occupancy -> possessions -> attempt conversion -> run efficiency -> other/mixed."
          echo "Opening plan deviation threshold is +/-12 percentage points versus playcaller prior first-15 baseline."
          echo "Forced trailing/leading occupancy surprise threshold is +15 percentage points."
          echo "Possession surprise threshold is +/-2 drives."
          echo "Attempt conversion loss threshold is -8 percentage points."
          echo "Run takeover/failure diagnostic threshold is actual rush EPA +/-0.08."
          echo "M68 explanation screen: pregame defense profile vs actual first-15 DBR deviation from verified playcaller baseline."
          echo "Strong replicated descriptive scheme pair requires same sign, abs corr>=.10 in both 2024 and 2025, combined abs corr>=.15."
          echo "Realized defensive scheme from postseason participation is diagnostic only and can never become a live feature from M69."
          echo "No M69 output directly promotes a model or feature. Any hypothesis moves to M70/live-2026 prospective validation."

      - name: Compile M69 module
        run: python -m py_compile scripts/backtest/audit_qb_gamescript_forensic_atlas.py

      - name: Build canonical M59-M65 target rows
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_m69/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries_optional.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"
            python scripts/backtest/diagnose_qb_raw_tail_attribution_mc.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m59"
            python scripts/backtest/audit_qb_extreme_error_regimes.py --season "$SEASON" --game-attribution "$D/m59/m59_game_attribution_${SEASON}.csv" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/m62"
          }

          run_season 2024 2023
          run_season 2025 2024

          python scripts/backtest/validate_qb_possession_dropback_generative_fixed.py \
            --season-file data/backtests/qb_m69/2024/m62/m62_enriched_games_2024.csv \
            --season-file data/backtests/qb_m69/2025/m62/m62_enriched_games_2025.csv \
            --player-logs data/backtests/qb_m69/2024/player_game_logs_history.csv \
            --player-logs data/backtests/qb_m69/2025/player_game_logs_history.csv \
            --out-dir data/backtests/qb_m69/m64_summary

          python scripts/backtest/validate_qb_dropback_state_occupancy.py \
            --m64-game-level data/backtests/qb_m69/m64_summary/m64_game_level.csv \
            --out-dir data/backtests/qb_m69/m65_summary

      - name: Rebuild leakage-safe M68 playcaller opening features
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/build_qb_playcaller_opening_leverage.py \
            --master-game-level data/backtests/qb_m69/m65_summary/m65_game_level.csv \
            --seasons 2023,2024,2025 \
            --leverage-sims 100 \
            --out-dir data/backtests/qb_m69/m68_source

      - name: Run Migration 69 forensic atlas
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/audit_qb_gamescript_forensic_atlas.py \
            --m65-game-level data/backtests/qb_m69/m65_summary/m65_game_level.csv \
            --m68-features data/backtests/qb_m69/m68_source/m68_pregame_new_information_features.csv \
            --seasons 2024,2025 \
            --out-dir data/backtests/qb_m69/m69_summary

      - name: Show Migration 69 results
        if: always()
        run: |
          echo '--- M69 interpretation ---'
          cat data/backtests/qb_m69/m69_summary/m69_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- M69 mechanisms ---'
          cat data/backtests/qb_m69/m69_summary/m69_mechanism_summary.csv 2>/dev/null || true
          echo '--- M69 recoverability ---'
          cat data/backtests/qb_m69/m69_summary/m69_recoverability_summary.csv 2>/dev/null || true
          echo '--- M69 pregame defensive profile screen ---'
          cat data/backtests/qb_m69/m69_summary/m69_pregame_defense_opening_deviation_screen.csv 2>/dev/null || true
          echo '--- M69 defensive scheme stability ---'
          cat data/backtests/qb_m69/m69_summary/m69_defensive_scheme_stability.csv 2>/dev/null || true
          echo '--- M69 realized defense by opening regime ---'
          cat data/backtests/qb_m69/m69_summary/m69_realized_defense_by_opening_regime.csv 2>/dev/null || true
          echo '--- M69 source manifest ---'
          cat data/backtests/qb_m69/m69_summary/m69_source_manifest.csv 2>/dev/null || true

      - name: Upload Migration 69 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-69-qb-gamescript-forensic-atlas
          path: |
            data/backtests/qb_m69/m69_summary/*.csv
            data/backtests/qb_m69/m68_source/*.csv
            data/backtests/qb_m69/m65_summary/*.csv
            data/backtests/qb_m69/m64_summary/*.csv
            data/backtests/qb_m69/2024/historical_input_validation.csv
            data/backtests/qb_m69/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
