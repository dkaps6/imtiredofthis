name: WR Phase4B Authority Attribution V2

on:
  push:
    branches:
      - research-wr-phase4-authority-exact-opportunity-attribution-v1
    paths:
      - '.github/workflows/research-wr-phase4b-attribution-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authority-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_RUN_ID: '34238301577'
      AUTHORITY_ARTIFACT_ID: '10061328722'
      AUTHORITY_ARTIFACT_NAME: wr-r15-wr1-anchor-participation-v1
      AUTHORITY_DIGEST: sha256:8df31b5e136621d959272daf0422dfc665593cd0da2eb0892b4aa69c1417f3ce
      AUTHORITY_ROOT: /tmp/wr_r15_artifact/backtests/wr_r15_wr1_anchor_v1
      PREFLIGHT_DIR: data/backtests/wr_phase4b_attribution_v2_preflight
      OUT_DIR: data/backtests/wr_phase4b_attribution_v2

    steps:
      - name: Checkout Phase4B branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow nflreadpy

      - name: Compile reviewed Phase4B V2 implementation
        run: |
          python -m py_compile scripts/research/evaluate_wr_phase4b_authority_exact_opportunity_attribution_v2.py
          python -m py_compile scripts/research/test_wr_phase4b_authority_exact_opportunity_synthetic_v1.py
          python -m py_compile scripts/research/test_wr_phase4b_static_identity_source_synthetic_v2.py

      - name: Re-run reviewed synthetic suites
        run: |
          python -m scripts.research.test_wr_phase4b_authority_exact_opportunity_synthetic_v1
          python -m scripts.research.test_wr_phase4b_static_identity_source_synthetic_v2

      - name: Verify exact WR-R15 authority artifact lineage
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORITY_RUN_ID}/artifacts" > /tmp/wr_r15_artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/wr_r15_artifacts.json').read_text())
          matches = [a for a in payload.get('artifacts', []) if int(a.get('id', -1)) == int(os.environ['AUTHORITY_ARTIFACT_ID'])]
          if len(matches) != 1:
              raise SystemExit(f"expected one authority artifact id={os.environ['AUTHORITY_ARTIFACT_ID']}, got {len(matches)}")
          a = matches[0]
          if a.get('name') != os.environ['AUTHORITY_ARTIFACT_NAME']:
              raise SystemExit(f"authority name mismatch: {a.get('name')}")
          if a.get('digest') != os.environ['AUTHORITY_DIGEST']:
              raise SystemExit(f"authority digest mismatch: {a.get('digest')}")
          if bool(a.get('expired')):
              raise SystemExit('authority artifact expired')
          print('WR-R15 exact authority lineage: PASS')
          print(json.dumps({k:a.get(k) for k in ['id','name','digest','expired','size_in_bytes']}, indent=2))
          PY

      - name: Download exact WR-R15 authority artifact
        run: |
          rm -rf /tmp/wr_r15_artifact
          mkdir -p /tmp/wr_r15_artifact
          gh run download "${AUTHORITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${AUTHORITY_ARTIFACT_NAME}" \
            --dir /tmp/wr_r15_artifact
          test -s "${AUTHORITY_ROOT}/wr_r15_confirmation_predictions.csv"
          test -s "${AUTHORITY_ROOT}/wr_r15_confirmation_features.csv"
          test -s "${AUTHORITY_ROOT}/wr_r15_conservation_audit.csv"

      - name: Re-run reviewed preflight immediately before attribution
        run: |
          rm -rf "${PREFLIGHT_DIR}"
          python -m scripts.research.evaluate_wr_phase4b_authority_exact_opportunity_attribution_v2 \
            --predictions "${AUTHORITY_ROOT}/wr_r15_confirmation_predictions.csv" \
            --features "${AUTHORITY_ROOT}/wr_r15_confirmation_features.csv" \
            --conservation "${AUTHORITY_ROOT}/wr_r15_conservation_audit.csv" \
            --out-dir "${PREFLIGHT_DIR}" \
            --preflight-only
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['PREFLIGHT_DIR'])/'phase4b_preflight_v2.json').read_text())
          q = p['candidate_target_parity']
          assert q['resolved_rows'] == 4193 and q['exact_target_parity_rows'] == 4193 and q['target_parity_fail_rows'] == 0
          assert p['layer4_identity']['resolved_gsis'] == 5320 and p['layer4_identity']['ambiguous'] == 1
          assert p['layer23_identity']['resolved_gsis'] == 6011 and p['layer23_identity']['ambiguous'] == 1
          assert p['attribution_outcomes_run'] is False
          assert p['receiving_yard_fields_loaded'] is False
          assert p['sportsbook_inputs'] == 0 and p['challenger_model_authorized'] is False and p['production_change'] is False
          for audit in p['v2_v3_overlap_nonreassignment'].values():
              assert audit['gsis_reassignment_rows'] == 0 and audit['target_change_rows'] == 0
          print('Immediate pre-attribution guard: PASS')
          PY

      - name: Run one-shot Phase4B authority-exact attribution
        run: |
          rm -rf "${OUT_DIR}"
          python -m scripts.research.evaluate_wr_phase4b_authority_exact_opportunity_attribution_v2 \
            --predictions "${AUTHORITY_ROOT}/wr_r15_confirmation_predictions.csv" \
            --features "${AUTHORITY_ROOT}/wr_r15_confirmation_features.csv" \
            --conservation "${AUTHORITY_ROOT}/wr_r15_conservation_audit.csv" \
            --out-dir "${OUT_DIR}"

      - name: Guard attribution output contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT_DIR'])
          r = json.loads((out/'phase4b_result_v2.json').read_text())
          if r.get('specification') != 'WR_PHASE4B_AUTHORITY_EXACT_OPPORTUNITY_ATTRIBUTION_V2':
              raise SystemExit('specification drift')
          q = r['candidate_target_parity']
          if q['resolved_rows'] != 4193 or q['exact_target_parity_rows'] != 4193 or q['target_parity_fail_rows'] != 0 or abs(q['max_abs_target_delta']) > 1e-12:
              raise SystemExit(f'authority target parity failed: {q}')
          if r.get('layer1_rows') != 4193:
              raise SystemExit(f"Layer1 row drift: {r.get('layer1_rows')}")
          cov = r['layer4_coverage']
          if cov['resolved_gsis_rows'] != 5320 or cov['ambiguous_or_unresolved_rows'] != 1:
              raise SystemExit(f'Layer4 coverage drift: {cov}')
          if r.get('attribution_outcomes_run') is not True:
              raise SystemExit('attribution result flag missing')
          if r.get('sportsbook_inputs') != 0 or r.get('challenger_model_authorized') is not False or r.get('production_change') is not False:
              raise SystemExit('research boundary violated')
          required = [
              'phase4b_layer1_yard_decomposition.csv',
              'phase4b_layer1_summary.csv',
              'phase4b_layer2_3_team_game_detail.csv',
              'phase4b_layer2_3_summary.csv',
              'phase4b_layer4_resolved.csv',
              'phase4b_layer4_unresolved.csv',
              'phase4b_layer4_metrics.csv',
              'phase4b_off_model_wr_targets.csv',
              'phase4b_anchor_observability.csv',
          ]
          missing = [x for x in required if not (out/x).is_file()]
          if missing:
              raise SystemExit(f'missing attribution outputs: {missing}')
          print('Phase4B one-shot attribution output guard: PASS')
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Upload canonical Phase4B attribution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-phase4b-authority-attribution-v2
          path: |
            data/backtests/wr_phase4b_attribution_v2/
            data/backtests/wr_phase4b_attribution_v2_preflight/
          if-no-files-found: warn
          retention-days: 30
