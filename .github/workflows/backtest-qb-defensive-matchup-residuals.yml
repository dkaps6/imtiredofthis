name: Migration 56 QB Defensive Matchup Residual Audit

on:
  workflow_dispatch:
    inputs:
      weeks: {description: "Weeks", required: false, default: "1-18"}
      iterations: {description: "Canonical MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-56-qb-defensive-matchup-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Declare Migration 56 scope and decision rule
        run: |
          echo "Diagnostic only: no production football/model logic changes."
          echo "Scored development seasons are locked to 2024 and 2025."
          echo "2023 is prior history for 2024 only; the consumed 2023 holdout is not rescored."
          echo "Hypothesis: richer weekly defensive opportunity, coverage-family, recency/trend, and QB-defense interaction signals explain residual QB passing error."
          echo "Migration 57 eligibility was fixed before results: a NEW defensive group must improve combined OOS passing-yard MAE by >=0.50 yards versus existing-defense-only and be non-worse in BOTH 2024 and 2025."
          echo "Migration 56 itself cannot promote a production change."

      - name: Build canonical development traces for 2024 and 2025
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          WEEKS="${{ inputs.weeks || '1-18' }}"
          ITERATIONS="${{ inputs.iterations || '2000' }}"

          run_season () {
            SEASON="$1"
            PRIOR="$2"
            TARGET_DIR="data/backtests/qb_defensive_matchup/${SEASON}"

            echo "=== BUILD ${SEASON}; PRIOR HISTORY ${PRIOR} ==="
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$TARGET_DIR"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$TARGET_DIR/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$TARGET_DIR/historical_defense_enrichment_audit.csv" --observations "$TARGET_DIR/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$TARGET_DIR" --report "$TARGET_DIR/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$TARGET_DIR/schedule_history.csv" --out "$TARGET_DIR/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$TARGET_DIR/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$TARGET_DIR/schedule_history.csv" --out "$TARGET_DIR/weather_history.csv"

            echo "=== REBUILD FROZEN JOINT QB TRACE FOR ${SEASON} ==="
            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --team-weekly "$TARGET_DIR/team_weekly_history.csv" --schedule "$TARGET_DIR/schedule_history.csv" --universe-dir "$TARGET_DIR/pregame_universe" --injuries "$TARGET_DIR/injuries_history.csv" --weather "$TARGET_DIR/weather_history.csv" --out-dir "$TARGET_DIR/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$TARGET_DIR/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --out-dir "$TARGET_DIR/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$TARGET_DIR/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$TARGET_DIR/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$TARGET_DIR/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$TARGET_DIR/team_weekly_history.csv" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --weather "$TARGET_DIR/weather_history.csv" --out-dir "$TARGET_DIR/qb_joint_attempts_ypa"
            python scripts/backtest/validate_qb_joint_attempts_ypa_mc.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --candidate-trace "$TARGET_DIR/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --team-weekly "$TARGET_DIR/team_weekly_history.csv" --schedule "$TARGET_DIR/schedule_history.csv" --universe-dir "$TARGET_DIR/pregame_universe" --injuries "$TARGET_DIR/injuries_history.csv" --weather "$TARGET_DIR/weather_history.csv" --out-dir "$TARGET_DIR/qb_joint_attempts_ypa_mc"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Audit defensive matchup residual signal
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/audit_qb_defensive_matchup_residuals.py \
            --root data/backtests/qb_defensive_matchup \
            --seasons 2024,2025 \
            --min-train 80 \
            --out-dir data/backtests/qb_defensive_matchup/summary

      - name: Show Migration 56 results
        if: always()
        run: |
          echo "=== OOS PASSING-YARD SUMMARY ==="
          cat data/backtests/qb_defensive_matchup/summary/qb_defensive_oos_summary.csv 2>/dev/null || true
          echo "=== PRECOMMITTED VERDICT ==="
          cat data/backtests/qb_defensive_matchup/summary/qb_defensive_audit_verdict.csv 2>/dev/null || true
          echo "=== TOP DEFENSIVE SIGNALS ==="
          head -31 data/backtests/qb_defensive_matchup/summary/qb_defensive_signal_ranking.csv 2>/dev/null || true
          echo "=== LOWEST-COVERAGE FEATURES ==="
          head -31 data/backtests/qb_defensive_matchup/summary/qb_defensive_feature_coverage.csv 2>/dev/null || true

      - name: Upload Migration 56 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-56-qb-defensive-matchup-residual-audit
          path: |
            data/backtests/qb_defensive_matchup/summary/*.csv
            data/backtests/qb_defensive_matchup/2024/historical_input_validation.csv
            data/backtests/qb_defensive_matchup/2024/historical_defense_enrichment_audit.csv
            data/backtests/qb_defensive_matchup/2025/historical_input_validation.csv
            data/backtests/qb_defensive_matchup/2025/historical_defense_enrichment_audit.csv
          if-no-files-found: warn
          retention-days: 14
