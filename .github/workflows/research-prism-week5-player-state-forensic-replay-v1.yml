name: Research PRISM Week5 Player State Forensic Replay V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/audit_prism_week5_player_state_forensic_replay_v1.py'
      - 'docs/research/PRISM_2026_WEEK5_PLAYER_STATE_FORENSIC_REPLAY_V1_RESULT.md'
      - '.github/workflows/research-prism-week5-player-state-forensic-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Verify frozen source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          expected={
            37777319154:(11550446909,'player-output-component-decomposition-v1-37777319154','sha256:7acfc453258a49f3aadf0d0ea386b13827eb715f1dfb055b96505f733320d204'),
            38395384228:(11812200405,'week5-full-model-postmortem-v1-38395384228','sha256:5888cab39506ae0bf70034dfb60f297defd28dd3219ea8118870738706f55ac3'),
            38397361891:(11812403368,'week5-player-failure-casebook-v1-38397361891','sha256:4cdef29912f35368473d57e15b38efdc3dd0f75e897bbbdc3b97fe1ff8f67670'),
            37717016519:(11524296325,'player-landscape-transmission-audit-v1-37717016519','sha256:e043133d4b9a48ce472dde8810d4d77d636f4ce2fbcee14708b23fe0ea35f6a0'),
          }
          repo=os.environ['GITHUB_REPOSITORY']
          for run,(aid,name,digest) in expected.items():
              raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'])
              payload=json.loads(raw)
              arts={int(a['id']):a for a in payload.get('artifacts',[])}
              if aid not in arts:
                  raise SystemExit(f'missing expected artifact {aid} for run {run}')
              a=arts[aid]
              if a.get('expired'):
                  raise SystemExit(f'artifact expired: {aid}')
              if a.get('name') != name:
                  raise SystemExit(f'artifact name drift {aid}: {a.get("name")} != {name}')
              if a.get('digest') != digest:
                  raise SystemExit(f'artifact digest drift {aid}: {a.get("digest")} != {digest}')
              print('SOURCE_VERIFIED',run,aid,name,digest)
          PY

      - name: Download exact replay authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-w5-replay
          mkdir -p /tmp/prism-w5-replay/{history,target,cases,state,out}
          gh run download 37777319154 --repo "${{ github.repository }}" --name player-output-component-decomposition-v1-37777319154 --dir /tmp/prism-w5-replay/history
          gh run download 38395384228 --repo "${{ github.repository }}" --name week5-full-model-postmortem-v1-38395384228 --dir /tmp/prism-w5-replay/target
          gh run download 38397361891 --repo "${{ github.repository }}" --name week5-player-failure-casebook-v1-38397361891 --dir /tmp/prism-w5-replay/cases
          gh run download 37717016519 --repo "${{ github.repository }}" --name player-landscape-transmission-audit-v1-37717016519 --dir /tmp/prism-w5-replay/state
          test -s /tmp/prism-w5-replay/history/player_output_component_rows.csv
          test -s /tmp/prism-w5-replay/target/week5_full_board_graded_detail.csv
          test -s /tmp/prism-w5-replay/cases/week5_player_failure_casebook_v1_rows.csv
          test -s /tmp/prism-w5-replay/state/player_landscape_week5_player_state.csv

      - name: Execute exact player-first forensic replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/audit_prism_week5_player_state_forensic_replay_v1.py
          python scripts/research/audit_prism_week5_player_state_forensic_replay_v1.py \
            --history /tmp/prism-w5-replay/history/player_output_component_rows.csv \
            --target /tmp/prism-w5-replay/target/week5_full_board_graded_detail.csv \
            --failure-cases /tmp/prism-w5-replay/cases/week5_player_failure_casebook_v1_rows.csv \
            --player-state /tmp/prism-w5-replay/state/player_landscape_week5_player_state.csv \
            --out-dir /tmp/prism-w5-replay/out

      - name: Certify frozen replay result
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p='/tmp/prism-w5-replay/out/prism_week5_player_state_forensic_replay_result.json'
          r=json.load(open(p))
          expected={
            'status':'PLAYER_STATE_FORENSIC_REPLAY_COMPLETE__NO_PROMOTION',
            'strict_prior_replay_rows':318,
            'strict_prior_unique_players':166,
            'week5_frozen_failure_cases':40,
            'week5_failure_cases_with_4week_reliability':30,
            'week5_direct_skill_failure_cases':23,
            'week5_direct_skill_cases_opportunity_underpredicted':22,
            'week5_direct_skill_opportunity_dominant_cases':8,
            'week5_opp_dominant_with_opportunity_underpredicted':8,
            'week5_opp_dominant_current_share_above_rules':6,
            'w4_w5_same_player_market_top40_repeats':9,
            'w4_w5_repeat_component_state_changes':7,
            'new_model_fit':0,
            'thresholds_fit':0,
            'sportsbook_predictor_used':False,
            'oddsapi_calls':0,
            'production_changed':False,
          }
          for k,v in expected.items():
              if r.get(k) != v:
                  raise SystemExit(f'CERT FAIL {k}: {r.get(k)!r} != {v!r}')
          cert={
            'version':'PRISM_2026_WEEK5_PLAYER_STATE_FORENSIC_REPLAY_V1_CERT',
            'status':'PRISM_WEEK5_PLAYER_FIRST_REPLAY_REPRODUCED',
            'exact_head':os.environ['HEAD_SHA'],
            'run_id':int(os.environ['RUN_ID']),
            'source_result':r,
            'week6_outcomes_used':0,
            'sportsbook_refetch':False,
            'oddsapi_calls':0,
            'model_fit':0,
            'production_changed':False,
          }
          open('/tmp/prism-w5-replay/out/replay_certificate.json','w').write(
              json.dumps(cert,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(cert,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 535 --repo "${{ github.repository }}" --body "PRISM Week-5 named-player forensic replay reproduced at exact head ${{ github.sha }} (run ${{ github.run_id }}). Exact frozen authorities: W1-W4 decomposition 37777319154/11550446909; Week-5 settled postmortem 38395384228/11812200405; failure casebook 38397361891/11812403368; Week-5 player state 37717016519/11524296325. Results: 318 strict-prior same-player/market replay rows, 166 players, 30/40 top failures with four prior same-market weeks, 22/23 direct skill failures underpredicted opportunity, 8/8 opportunity-dominant direct skill cases underpredicted opportunity, 9 W4/W5 same-player+market repeat top-40 cases with 7/9 changing failure component state. Diagnostic only: no fit, no sportsbook predictor/refetch, no OddsAPI, no Week-6 outcomes, no production change."

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload replay certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-week5-player-state-forensic-replay-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-w5-replay/out/**
