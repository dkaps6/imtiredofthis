name: RB Rush Rec Conservation V2 Mean

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-rush-rec-conservation-v2
    paths:
      - 'docs/research/RB_RUSH_REC_CONSERVATION_V2_MEAN_PLAN.md'
      - 'scripts/research/rb_rush_rec_conservation_v2_mean.py'
      - '.github/workflows/rb-rush-rec-conservation-v2-mean.yml'

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download exact PR549 compact authority
        uses: actions/download-artifact@v4
        with:
          name: wr-te-production-order-historical-replay-v1
          path: /tmp/pr549
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34722725629

      - name: Compile
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m py_compile scripts/research/rb_rush_rec_conservation_v2_mean.py

      - name: Run frozen conservation mean test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/rb_rush_rec_v2
          mkdir -p /tmp/rb_rush_rec_v2
          python scripts/research/rb_rush_rec_conservation_v2_mean.py \
            --trace /tmp/pr549/full_stack_projection_trace_base.csv \
            --out-dir /tmp/rb_rush_rec_v2

      - name: Verify integrity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rb_rush_rec_v2/summary.json'))
          assert p['study']=='RB_RUSH_REC_CONSERVATION_V2_MEAN'
          assert p['sportsbook_inputs_used']==0
          assert p['outcomes_2026_used']==0
          assert p['fitted_parameters']==0
          assert p['production_changed'] is False
          assert p['max_actual_identity_gap'] <= 1e-9
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rb-rush-rec-conservation-v2-mean
          path: /tmp/rb_rush_rec_v2/
          if-no-files-found: error
          retention-days: 90
