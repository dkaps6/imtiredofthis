name: WR R20 Early No Extended Stage A V1

on:
  push:
    branches:
      - research-wr-r20-early-no-extended-v1
    paths:
      - '.github/workflows/research-wr-r20-stage-a-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-a-2023-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_RUN_ID: '34238301577'
      AUTHORITY_ARTIFACT_ID: '10061328722'
      AUTHORITY_ARTIFACT_NAME: wr-r15-wr1-anchor-participation-v1
      AUTHORITY_DIGEST: sha256:8df31b5e136621d959272daf0422dfc665593cd0da2eb0892b4aa69c1417f3ce
      AUTHORITY_CSV: /tmp/wr_r15_artifact/backtests/wr_r15_wr1_anchor_v1/wr_r15_confirmation_predictions.csv
      OUT_DIR: data/backtests/wr_r20_early_no_extended_v1

    steps:
      - name: Checkout frozen R20 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow nflreadpy

      - name: Run frozen WR-R20 synthetic mechanics suite
        run: |
          python -m scripts.research.test_wr_r20_early_no_extended_synthetic_v1

      - name: Verify exact WR-R15 authority artifact lineage
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORITY_RUN_ID}/artifacts" > /tmp/wr_r15_artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path('/tmp/wr_r15_artifacts.json').read_text())
          matches = [a for a in payload.get('artifacts', []) if int(a.get('id', -1)) == int(os.environ['AUTHORITY_ARTIFACT_ID'])]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one authority artifact id={os.environ['AUTHORITY_ARTIFACT_ID']}, got {len(matches)}")
          a = matches[0]
          if a.get('name') != os.environ['AUTHORITY_ARTIFACT_NAME']:
              raise SystemExit(f"authority artifact name mismatch: {a.get('name')}")
          if a.get('digest') != os.environ['AUTHORITY_DIGEST']:
              raise SystemExit(f"authority digest mismatch: {a.get('digest')}")
          if bool(a.get('expired')):
              raise SystemExit('authority artifact is expired')
          print('WR-R15 authority artifact lineage: PASS')
          print(json.dumps({k: a.get(k) for k in ['id','name','digest','expired','size_in_bytes']}, indent=2))
          PY

      - name: Download exact WR-R15 authority artifact
        run: |
          rm -rf /tmp/wr_r15_artifact
          mkdir -p /tmp/wr_r15_artifact
          gh run download "${AUTHORITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${AUTHORITY_ARTIFACT_NAME}" \
            --dir /tmp/wr_r15_artifact
          test -s "${AUTHORITY_CSV}"
          ls -lh "${AUTHORITY_CSV}"

      - name: Run frozen WR-R20 Stage A on 2023 development only
        run: |
          rm -rf "${OUT_DIR}"
          python -m scripts.research.evaluate_wr_r20_early_no_extended_stage_a_v1 \
            --authority "${AUTHORITY_CSV}" \
            --out-dir "${OUT_DIR}"

      - name: Assert 2024 holdout remained sealed and source contract stayed pre-2024
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          out = Path(os.environ['OUT_DIR'])
          result_path = out / 'wr_r20_stage_a_result.json'
          audit_path = out / 'wr_r20_stage_a_identity_source_audit.json'
          raw_path = out / 'wr_r20_stage_a_raw_metrics_2023.json'
          for p in [result_path, audit_path, raw_path]:
              if not p.exists():
                  raise SystemExit(f'missing Stage-A evidence: {p}')

          result = json.loads(result_path.read_text())
          audit = json.loads(audit_path.read_text())

          if result.get('stage') != 'A_2023_DEVELOPMENT_ONLY':
              raise SystemExit(f"unexpected stage: {result.get('stage')}")
          if result.get('holdout_2024_scored') is not False:
              raise SystemExit('2024 holdout was not sealed in result')
          if result.get('holdout_2024_projection_or_outcome_fields_parsed') is not False:
              raise SystemExit('2024 projection/outcome cells were parsed')
          if audit.get('holdout_2024_scored') is not False:
              raise SystemExit('2024 holdout was not sealed in audit')
          if audit.get('holdout_2024_projection_or_outcome_fields_parsed') is not False:
              raise SystemExit('2024 projection/outcome cells were parsed in audit')
          source_seasons = sorted({int(x.get('season')) for x in audit.get('source_meta', [])})
          air_seasons = sorted({int(x.get('season')) for x in audit.get('air_meta', [])})
          if source_seasons != [2022, 2023]:
              raise SystemExit(f'unexpected progression source seasons: {source_seasons}')
          if air_seasons != [2022, 2023]:
              raise SystemExit(f'unexpected air source seasons: {air_seasons}')
          if not all(x.get('season_week_parity') is True for x in audit.get('source_meta', [])):
              raise SystemExit('FTN/PBP season-week parity assertion missing or failed')
          if result.get('sportsbook_inputs') != 0 or audit.get('sportsbook_inputs') != 0:
              raise SystemExit('sportsbook boundary violated')

          print('WR-R20 2024 holdout/source guards: PASS')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload WR-R20 Stage A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-r20-early-no-extended-stage-a-v1
          path: data/backtests/wr_r20_early_no_extended_v1/
          if-no-files-found: warn
          retention-days: 30
