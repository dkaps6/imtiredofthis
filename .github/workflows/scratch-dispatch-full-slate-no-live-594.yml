name: Scratch Dispatch Full Slate No Live 594

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-dispatch-full-slate-no-live-594.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch branch Full Slate with live odds disabled
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${BRANCH}"
          echo "Dispatching Full Slate on ${BRANCH} with fetch_live_odds=false"
          gh workflow run full-slate.yml \
            --repo "${REPO}" \
            --ref "${BRANCH}" \
            -f season=2026 \
            -f prior_season=2025 \
            -f date= \
            -f fetch_live_odds=false
          echo "FULL_SLATE_NO_LIVE_DISPATCHED"
