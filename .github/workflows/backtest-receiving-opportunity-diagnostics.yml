name: 2025 Receiving Opportunity Diagnostics

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks to diagnose (for example 1-18)"
        required: false
        default: "1-18"
      iterations:
        description: "MC iterations per week"
        required: false
        default: "2000"

jobs:
  diagnose-receiving-opportunity:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib
      - name: Run focused regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_receiving_opportunity_diagnostics.py tests/test_simulation_v2.py
      - name: Build leakage-safe historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --out-dir data/backtests
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests/historical_defense_enrichment_audit.csv --observations data/backtests/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --data-dir data/backtests --report data/backtests/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule data/backtests/schedule_history.csv --out data/backtests/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/schedule_history.csv --out data/backtests/weather_history.csv
      - name: Run Migration 31 receiving opportunity diagnostics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/receiving_opportunity_diagnostics
          python scripts/backtest/audit_receiving_opportunity.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.iterations || '2000' }}" --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out-dir data/backtests/receiving_opportunity_diagnostics
      - name: Show Migration 31 results
        if: always()
        run: |
          echo "Receiving opportunity stage summary:"
          cat data/backtests/receiving_opportunity_diagnostics/receiving_opportunity_stage_summary.csv 2>/dev/null || true
          echo "Receiving pool summary:"
          cat data/backtests/receiving_opportunity_diagnostics/receiving_opportunity_pool_summary.csv 2>/dev/null || true
      - name: Upload Migration 31 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-31-receiving-opportunity-diagnostics
          path: |
            data/backtests/historical_input_validation.csv
            data/backtests/receiving_opportunity_diagnostics/*.csv
          if-no-files-found: warn
          retention-days: 14
