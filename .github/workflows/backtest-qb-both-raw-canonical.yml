name: Migration 58 QB BOTH RAW Canonical Validation

on:
  workflow_dispatch:
    inputs:
      weeks: {description: "Weeks", required: false, default: "1-18"}
      iterations: {description: "MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-58-qb-both-raw-canonical'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Declare Migration 58 scope and frozen gates
        run: |
          echo "Diagnostic/canonical candidate validation only; no production defaults change."
          echo "2024 and 2025 are development seasons. The consumed 2023 holdout is NOT rescored."
          echo "Candidate: Migration 57 BOTH RAW (same features/Ridge/walk-forward; no inner residual cap or 60% shrinkage)."
          echo "Reference: official Migration 53 joint cap+shrink candidate."
          echo "Precommitted gates:"
          echo "1) combined stable-QB passing MAE improves >= 0.50 yards"
          echo "2) stable-QB passing MAE is non-worse in both 2024 and 2025"
          echo "3) combined stable-QB passing correlation improves >= 0.02"
          echo "4) combined stable-QB RMSE is non-worse"
          echo "5) combined 100+ yard misses increase no more than 5%"
          echo "6) combined absolute bias worsens by no more than 2.0 yards"
          echo "7) combined collateral-market MAE regression <= 1% for rec yards, receptions, rush attempts, rush yards, and rush+rec yards"

      - name: Build and score canonical BOTH RAW candidate
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          WEEKS="${{ inputs.weeks || '1-18' }}"
          ITERATIONS="${{ inputs.iterations || '2000' }}"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_both_raw_canonical/${SEASON}"

            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"

            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/validate_qb_both_raw_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" \
              --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" \
              --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" \
              --weather "$D/weather_history.csv" \
              --out-dir "$D/qb_both_raw_mc"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Combine seasons and apply precommitted gates
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path('data/backtests/qb_both_raw_canonical')
          out = root / 'summary'; out.mkdir(parents=True, exist_ok=True)

          summaries=[]; stable_traces=[]; all_traces=[]
          for season in (2024, 2025):
              d=root/str(season)/'qb_both_raw_mc'
              summaries.append(pd.read_csv(d/'qb_both_raw_mc_summary.csv'))
              stable_traces.append(pd.read_csv(d/'qb_both_raw_mc_stable.csv'))
              all_traces.append(pd.read_csv(d/'qb_both_raw_mc_trace.csv'))
          by_season=pd.concat(summaries,ignore_index=True)
          stable=pd.concat(stable_traces,ignore_index=True)
          all_rows=pd.concat(all_traces,ignore_index=True)
          by_season.to_csv(out/'migration58_by_season_summary.csv',index=False)

          def metric(g):
              a=pd.to_numeric(g.actual,errors='coerce'); p=pd.to_numeric(g.mc_proj,errors='coerce')
              z=pd.DataFrame({'a':a,'p':p}).dropna(); e=z.p-z.a
              return {
                  'n':len(z),'mae':float(e.abs().mean()),'rmse':float(np.sqrt(np.mean(e*e))),
                  'bias':float(e.mean()),'correlation':float(z.p.corr(z.a)),
                  'catastrophic_100plus':int(e.abs().ge(100).sum()),
                  'under_100plus':int(e.le(-100).sum()),'over_100plus':int(e.ge(100).sum())
              }

          combined=[]
          for cand,g in stable.groupby('candidate'):
              combined.append({'candidate':cand,'slice':'stable_qb','market':'pass_yards',**metric(g)})
          for (cand,market),g in all_rows.groupby(['candidate','market']):
              combined.append({'candidate':cand,'slice':'all_available','market':market,**metric(g)})
          combined=pd.DataFrame(combined)
          combined.to_csv(out/'migration58_combined_summary.csv',index=False)

          st=combined[(combined['slice']=='stable_qb')&(combined['market']=='pass_yards')]
          ref=st[st.candidate=='joint_cap_shrink'].iloc[0]
          raw=st[st.candidate=='both_raw'].iloc[0]

          season_ok=True; season_detail=[]
          for season in (2024,2025):
              z=by_season[(by_season.season==season)&(by_season['slice']=='stable_qb')&(by_season.market=='pass_yards')]
              r=z[z.candidate=='joint_cap_shrink'].iloc[0]; c=z[z.candidate=='both_raw'].iloc[0]
              gain=float(r.mae-c.mae); season_ok &= gain >= 0
              season_detail.append(f'{season}:{r.mae:.3f}->{c.mae:.3f} ({gain:+.3f})')

          gates=[]
          def gate(name, passed, detail): gates.append({'gate':name,'passed':bool(passed),'detail':detail})
          mae_gain=float(ref.mae-raw.mae); corr_gain=float(raw.correlation-ref.correlation)
          gate('combined_mae_gain_ge_0_50', mae_gain >= 0.50, f'gain={mae_gain:.4f}; {ref.mae:.4f}->{raw.mae:.4f}')
          gate('both_seasons_mae_nonworse', season_ok, ' '.join(season_detail))
          gate('combined_correlation_gain_ge_0_02', corr_gain >= 0.02, f'gain={corr_gain:.4f}; {ref.correlation:.4f}->{raw.correlation:.4f}')
          gate('combined_rmse_nonworse', raw.rmse <= ref.rmse, f'{ref.rmse:.4f}->{raw.rmse:.4f}')
          tail_ratio=float(raw.catastrophic_100plus/ref.catastrophic_100plus) if ref.catastrophic_100plus else 1.0
          gate('catastrophic_100plus_increase_lte_5pct', tail_ratio <= 1.05, f'{int(ref.catastrophic_100plus)}->{int(raw.catastrophic_100plus)} ratio={tail_ratio:.4f}')
          bias_worsening=abs(float(raw.bias))-abs(float(ref.bias))
          gate('absolute_bias_worsening_lte_2yd', bias_worsening <= 2.0, f'{ref.bias:.4f}->{raw.bias:.4f}; abs_worsening={bias_worsening:.4f}')

          collateral=['rec_yards','receptions','rush_att','rush_yards','rush_rec_yards']
          collateral_ok=True; details=[]
          aa=combined[combined['slice']=='all_available']
          for market in collateral:
              r=aa[(aa.market==market)&(aa.candidate=='joint_cap_shrink')]
              c=aa[(aa.market==market)&(aa.candidate=='both_raw')]
              if len(r)!=1 or len(c)!=1: raise RuntimeError(f'missing collateral market {market}')
              rm=float(r.iloc[0].mae); cm=float(c.iloc[0].mae); reg=(cm/rm-1.0) if rm else 0.0
              collateral_ok &= reg <= 0.01; details.append(f'{market}:{reg*100:+.3f}%')
          gate('collateral_mae_regression_lte_1pct', collateral_ok, ' '.join(details))

          verdict=pd.DataFrame(gates)
          verdict['migration58_all_gates_pass']=bool(verdict.passed.all())
          verdict.to_csv(out/'migration58_precommitted_verdict.csv',index=False)
          print('=== MIGRATION 58 COMBINED ==='); print(combined.to_string(index=False))
          print('\n=== MIGRATION 58 PRECOMMITTED GATES ==='); print(verdict.to_string(index=False))
          print('\nMIGRATION 58:', 'PASS' if verdict.passed.all() else 'HOLD')
          PY

      - name: Show final results
        if: always()
        run: |
          cat data/backtests/qb_both_raw_canonical/summary/migration58_by_season_summary.csv 2>/dev/null || true
          cat data/backtests/qb_both_raw_canonical/summary/migration58_combined_summary.csv 2>/dev/null || true
          cat data/backtests/qb_both_raw_canonical/summary/migration58_precommitted_verdict.csv 2>/dev/null || true

      - name: Upload Migration 58 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-58-qb-both-raw-canonical
          path: |
            data/backtests/qb_both_raw_canonical/summary/*.csv
            data/backtests/qb_both_raw_canonical/2024/historical_input_validation.csv
            data/backtests/qb_both_raw_canonical/2025/historical_input_validation.csv
            data/backtests/qb_both_raw_canonical/2024/qb_both_raw_mc/qb_both_raw_mc_summary.csv
            data/backtests/qb_both_raw_canonical/2025/qb_both_raw_mc/qb_both_raw_mc_summary.csv
          if-no-files-found: warn
          retention-days: 14
