name: WR Phase4B Static GSIS Preflight V2

on:
  push:
    branches:
      - research-wr-phase4-authority-exact-opportunity-attribution-v1
    paths:
      - '.github/workflows/research-wr-phase4b-static-gsis-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_RUN_ID: '34238301577'
      AUTHORITY_ARTIFACT_ID: '10061328722'
      AUTHORITY_ARTIFACT_NAME: wr-r15-wr1-anchor-participation-v1
      AUTHORITY_DIGEST: sha256:8df31b5e136621d959272daf0422dfc665593cd0da2eb0892b4aa69c1417f3ce
      AUTHORITY_ROOT: /tmp/wr_r15_artifact/backtests/wr_r15_wr1_anchor_v1
      OUT_DIR: data/backtests/wr_phase4b_static_gsis_preflight_v2

    steps:
      - name: Checkout Phase4B branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow nflreadpy

      - name: Compile Phase4B V2 implementation and tests
        run: |
          python -m py_compile scripts/research/evaluate_wr_phase4b_authority_exact_opportunity_attribution_v2.py
          python -m py_compile scripts/research/test_wr_phase4b_authority_exact_opportunity_synthetic_v1.py
          python -m py_compile scripts/research/test_wr_phase4b_static_identity_source_synthetic_v2.py

      - name: Run original frozen accounting synthetic suite
        run: |
          python -m scripts.research.test_wr_phase4b_authority_exact_opportunity_synthetic_v1

      - name: Run static identity source synthetic suite
        run: |
          python -m scripts.research.test_wr_phase4b_static_identity_source_synthetic_v2

      - name: Verify exact WR-R15 authority artifact lineage
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORITY_RUN_ID}/artifacts" > /tmp/wr_r15_artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/wr_r15_artifacts.json').read_text())
          matches = [a for a in payload.get('artifacts', []) if int(a.get('id', -1)) == int(os.environ['AUTHORITY_ARTIFACT_ID'])]
          if len(matches) != 1:
              raise SystemExit(f"expected one authority artifact id={os.environ['AUTHORITY_ARTIFACT_ID']}, got {len(matches)}")
          a = matches[0]
          if a.get('name') != os.environ['AUTHORITY_ARTIFACT_NAME']:
              raise SystemExit(f"authority name mismatch: {a.get('name')}")
          if a.get('digest') != os.environ['AUTHORITY_DIGEST']:
              raise SystemExit(f"authority digest mismatch: {a.get('digest')}")
          if bool(a.get('expired')):
              raise SystemExit('authority artifact expired')
          print('WR-R15 exact authority lineage: PASS')
          print(json.dumps({k:a.get(k) for k in ['id','name','digest','expired','size_in_bytes']}, indent=2))
          PY

      - name: Download exact WR-R15 authority artifact
        run: |
          rm -rf /tmp/wr_r15_artifact
          mkdir -p /tmp/wr_r15_artifact
          gh run download "${AUTHORITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${AUTHORITY_ARTIFACT_NAME}" \
            --dir /tmp/wr_r15_artifact
          test -s "${AUTHORITY_ROOT}/wr_r15_confirmation_predictions.csv"
          test -s "${AUTHORITY_ROOT}/wr_r15_confirmation_features.csv"
          test -s "${AUTHORITY_ROOT}/wr_r15_conservation_audit.csv"

      - name: Run Phase4B V2 source/identity preflight only
        run: |
          rm -rf "${OUT_DIR}"
          python -m scripts.research.evaluate_wr_phase4b_authority_exact_opportunity_attribution_v2 \
            --predictions "${AUTHORITY_ROOT}/wr_r15_confirmation_predictions.csv" \
            --features "${AUTHORITY_ROOT}/wr_r15_confirmation_features.csv" \
            --conservation "${AUTHORITY_ROOT}/wr_r15_conservation_audit.csv" \
            --out-dir "${OUT_DIR}" \
            --preflight-only

      - name: Guard source contract and sealed attribution boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['OUT_DIR'])/'phase4b_preflight_v2.json').read_text())
          if p.get('receiving_yard_fields_loaded') is not False:
              raise SystemExit('receiving-yard boundary violated')
          if p.get('attribution_outcomes_run') is not False:
              raise SystemExit('attribution outcomes were improperly run')
          if p.get('predictive_feature_temporal_rules_changed') is not False:
              raise SystemExit('predictive temporal rule changed')
          if p.get('fuzzy_matching') is not False:
              raise SystemExit('fuzzy matching boundary violated')
          if p.get('sportsbook_inputs') != 0:
              raise SystemExit('sportsbook boundary violated')
          if p.get('challenger_model_authorized') is not False:
              raise SystemExit('challenger improperly authorized')
          if p.get('candidate_rows') != 4193 or p.get('authority_team_games') != 1088:
              raise SystemExit('authority population drift')
          if p.get('anchor_observable_team_games') != 1026 or p.get('canonical_wr2plus_feature_rows') != 5321:
              raise SystemExit('authority identity population drift')
          q = p['candidate_target_parity']
          if q['resolved_rows'] != 4193 or q['exact_target_parity_rows'] != 4193 or q['target_parity_fail_rows'] != 0 or abs(q['max_abs_target_delta']) > 1e-12:
              raise SystemExit(f'candidate target parity failed: {q}')
          l4 = p['layer4_identity']
          if l4['resolved_gsis'] != 5320 or l4['ambiguous'] != 1 or l4['unresolved'] != 0:
              raise SystemExit(f'Layer4 identity coverage drift: {l4}')
          l23 = p['layer23_identity']
          if l23['resolved_gsis'] != 6011 or l23['ambiguous'] != 1 or l23['unresolved'] != 0:
              raise SystemExit(f'Layer23 identity coverage drift: {l23}')
          for name, audit in p['v2_v3_overlap_nonreassignment'].items():
              if audit['gsis_reassignment_rows'] != 0 or audit['target_change_rows'] != 0:
                  raise SystemExit(f'V3 changed prior resolution in {name}: {audit}')
          print('Phase4B V2 static identity preflight: PASS')
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload Phase4B V2 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-phase4b-static-gsis-preflight-v2
          path: data/backtests/wr_phase4b_static_gsis_preflight_v2/
          if-no-files-found: warn
          retention-days: 30
