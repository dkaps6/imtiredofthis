name: Test Current Player Availability Timing V1
on:
  push:
    branches: [ops-current-player-availability-v1]
    paths:
      - 'tests/test_current_player_availability_timing_v1.py'
      - 'scripts/validate_current_player_availability_timing_v1.py'
      - 'docs/operations/CURRENT_PLAYER_AVAILABILITY_TIMING_V1_FROZEN_PLAN.md'
permissions:
  contents: read
jobs:
  timing-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Verify production boundary
        run: |
          python -m py_compile scripts/validate_current_player_availability_timing_v1.py
          git diff --quiet bb76ba9eabb08e2f0875a9af49301c3877f4141f HEAD -- scripts/modeling scripts/simulation_v2.py scripts/simulation_c2_qb_candidate.py data/models model .github/workflows/full-slate.yml
      - name: Run frozen timing fixtures
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -vv tests/test_current_player_availability_timing_v1.py 2>&1 | tee timing-fixtures.txt
      - name: Upload timing transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-player-availability-timing-fixture-transcript
          retention-days: 14
          path: timing-fixtures.txt
