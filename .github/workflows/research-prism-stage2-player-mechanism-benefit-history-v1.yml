name: Research PRISM Stage2 Player Mechanism Benefit History V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/audit_prism_stage2_player_mechanism_benefit_history_v1.py'
      - 'tests/test_prism_stage2_player_mechanism_benefit_history_v1.py'
      - '.github/workflows/research-prism-stage2-player-mechanism-benefit-history-v1.yml'
      - 'docs/research/PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_PLAN.md'
      - 'docs/research/PRISM_PLAYER_SPECIFIC_RULE_LEARNING_V1_ANTI_RETEST_SOURCE_SUPPORT_MAP.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml

      - name: Verify immutable source-audit freeze and parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor 2a7d0f4a33b4669207f34bd98ee44128de7522c2 HEAD
          git cat-file -e 2a7d0f4a33b4669207f34bd98ee44128de7522c2:docs/research/PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_PLAN.md
          if git cat-file -e 2a7d0f4a33b4669207f34bd98ee44128de7522c2:scripts/research/audit_prism_stage2_player_mechanism_benefit_history_v1.py 2>/dev/null; then
            echo "ERROR: source-audit implementation existed at freeze commit"
            exit 1
          fi
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12070774378 --jq '.workflow_run.id')" = "38957575645"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12070774378 --jq '.digest')" = "sha256:e07edbad1bf97a4917ba95c58156c8941448e7b2668bd0eae2e9bcad5d4945b0"

      - uses: actions/download-artifact@v4
        with:
          name: player-active-role-conditional-allocation-bridge-v1-38957575645
          path: /tmp/stage2-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38957575645

      - name: Resolve immutable row-level parent
        run: |
          PARENT_ROWS="$(find /tmp/stage2-parent -type f -name 'active_role_conditional_allocation_bridge_player_rows.csv' -print -quit)"
          test -n "$PARENT_ROWS" && test -s "$PARENT_ROWS"
          echo "PARENT_ROWS=$PARENT_ROWS" >> "$GITHUB_ENV"

      - name: Run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_stage2_player_mechanism_benefit_history_v1.py
          pytest -q tests/test_prism_stage2_player_mechanism_benefit_history_v1.py

      - name: Audit strictly-prior player mechanism-benefit history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/stage2-player-benefit-source
          mkdir -p /tmp/stage2-player-benefit-source
          python scripts/research/audit_prism_stage2_player_mechanism_benefit_history_v1.py             --parent-rows "$PARENT_ROWS"             --out-dir /tmp/stage2-player-benefit-source

      - name: Certify source-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage2-player-benefit-source/stage2_player_mechanism_benefit_source_result.json'))
          assert p['version']=='PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='2a7d0f4a33b4669207f34bd98ee44128de7522c2',p
          assert p['parent_run']==38957575645,p
          assert p['parent_artifact']==12070774378,p
          assert p['qualified_cells']==['RB_RUSHING','RB_RECEIVING','TE_RECEIVING'],p
          assert p['chronology_violations']==0,p
          assert p['duplicate_identities']==0,p
          assert p['personalization_rule_scored'] is False,p
          assert p['coefficients_fit']==0,p
          assert p['threshold_searches']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['week6_outcomes_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_SOURCE_READY_ALL',
              'PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_SOURCE_READY_PARTIAL',
              'PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_SOURCE_BLOCKED',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 source result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/stage2-player-benefit-source/stage2_player_mechanism_benefit_source_result.json'))
          lines=[
              '### PRISM player-specific rule learning — Stage-2 mechanism-benefit history source audit',
              '',
              f"- Run: `{os.environ['RUN_ID']}`",
              f"- Exact head: `{os.environ['HEAD_SHA']}`",
              f"- Frozen source plan: `{p['freeze_commit']}`",
              f"- Parent Stage-2 run/artifact: `{p['parent_run']}` / `{p['parent_artifact']}`",
              f"- Disposition: `{p['disposition']}`",
              '',
          ]
          for cell,rec in p['cell_summaries'].items():
              lines += [
                  f"- {cell}: `{p['cell_dispositions'][cell]}`",
                  f"  - 2025 rows: {rec['target_rows']}; players: {rec['distinct_players']}",
                  f"  - rows with >=3 prior OOS mechanism rows: {rec['rows_with_ge3_prior']}",
                  f"  - players with >=3 / >=6 / >=10 prior rows: {rec['players_with_ge3_prior']} / {rec['players_with_ge6_prior']} / {rec['players_with_ge10_prior']}",
                  f"  - players spanning 2024+2025: {rec['players_spanning_2024_2025']}",
              ]
          lines += [
              '',
              'No personalization rule was scored. No coefficient/threshold search, no 2026 or Week-6 outcomes, no sportsbook/OddsAPI, no production mutation.',
          ]
          open('/tmp/issue535_stage2_player_benefit_source.md','w').write('\n'.join(lines)+'\n')
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/issue535_stage2_player_benefit_source.md

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-stage2-player-mechanism-benefit-history-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/stage2-player-benefit-source/**
