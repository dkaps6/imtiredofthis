name: Probe sparse WR-CB Arquivo.pt archive V1
on:
  push:
    branches: ["research-wr-cb-historical-snapshot-discovery-v1"]
    paths:
      - "scripts/research/probe_wr_cb_arquivo_pt_v1.py"
      - "tests/test_probe_wr_cb_arquivo_pt_v1.py"
      - "data/research/wr_cb_arquivo_pt_sparse_targets_v1.csv"
      - ".github/workflows/probe-wr-cb-arquivo-pt-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arquivo-sparse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pytest
      - env: {PYTHONPATH: .}
        run: pytest -q tests/test_probe_wr_cb_arquivo_pt_v1.py
      - name: Query exact historical URLs in Arquivo.pt
        env: {PYTHONPATH: .}
        run: |
          python scripts/research/probe_wr_cb_arquivo_pt_v1.py \
            --targets data/research/wr_cb_arquivo_pt_sparse_targets_v1.csv \
            --out-dir outputs/wr_cb_arquivo_pt_sparse_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-cb-arquivo-pt-sparse-v1
          path: outputs/wr_cb_arquivo_pt_sparse_v1/arquivo_pt_sparse_exact_url.json
          if-no-files-found: error
          retention-days: 14
