name: RB R26L 2026 Week 1 Regime Transportability V1

on:
  push:
    branches:
      - research-rb-r26l-2026-week1-regime-transportability-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PRODUCTION_BASE_SHA: f8417f55b04ce0e19baf260e9d532765034c47f1
  R26J_RUN_ID: '34374987828'
  R26J_ARTIFACT_ID: '10113466373'
  R26J_ARTIFACT_NAME: rb-r26j-2020-week1-comparability-source-audit-v1
  R26J_DIGEST: sha256:7d886f228487e052ee1617cc5f42b974cd9da6a9d448f3a86b1de82cb4fc4f46
  PROD_RUN_ID: '34317211395'
  PROD_ARTIFACT_ID: '10090547415'
  PROD_ARTIFACT_NAME: run_34317211395
  PROD_DIGEST: sha256:7eab77e41c5879d4f54d87497eee0d1186010784cfc4ef966178930e16fb7c3b

jobs:
  transportability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source-audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 pyarrow nflreadpy requests scikit-learn

      - name: Repair nflreadpy explicit 2026 weekly-roster validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          from pathlib import Path

          mod = importlib.import_module('nflreadpy.load_rosters_weekly')
          path = Path(mod.__file__)
          text = path.read_text()
          needle = "    current_season = get_current_season()\n    for season in seasons:"
          replacement = "    current_season = max(get_current_season(), 2026)\n    for season in seasons:"
          if text.count(needle) != 1:
              raise SystemExit(f'FATAL: nflreadpy weekly-roster validation shape changed; matches={text.count(needle)} path={path}')
          path.write_text(text.replace(needle, replacement, 1))
          repaired = path.read_text()
          if replacement not in repaired:
              raise SystemExit('FATAL: nflreadpy weekly-roster validation repair did not persist')
          print('R26L_NFLREADPY_2026_WEEKLY_ROSTER_GATE_REPAIR_PASS path=' + str(path))
          print('Source remains nflverse-data weekly_rosters/roster_weekly_2026 via nflreadpy downloader')
          PY

      - name: Verify frozen R26L contract and production boundary
        run: |
          set -euo pipefail
          test -s docs/research/RB_R26L_2026_WEEK1_REGIME_TRANSPORTABILITY_V1_FROZEN_PLAN.md
          test -s docs/research/RB_R26L_2026_WEEK1_REGIME_TRANSPORTABILITY_V1_IMPLEMENTATION_LOCK.md
          test -s docs/research/RB_R26L_2026_WEEK1_REGIME_TRANSPORTABILITY_V1_MECHANICAL_REPAIR.md
          test -s scripts/backtest/audit_rb_r26l_2026_week1_regime_transportability_v1.py
          test -s scripts/backtest/run_rb_r26l_2026_week1_regime_transportability_v1.py
          python -m py_compile scripts/backtest/audit_rb_r26l_2026_week1_regime_transportability_v1.py
          python -m py_compile scripts/backtest/run_rb_r26l_2026_week1_regime_transportability_v1.py
          sha256sum docs/research/RB_R26L_2026_WEEK1_REGIME_TRANSPORTABILITY_V1_FROZEN_PLAN.md | tee r26l_plan.sha256
          sha256sum docs/research/RB_R26L_2026_WEEK1_REGIME_TRANSPORTABILITY_V1_IMPLEMENTATION_LOCK.md | tee r26l_lock.sha256
          sha256sum docs/research/RB_R26L_2026_WEEK1_REGIME_TRANSPORTABILITY_V1_MECHANICAL_REPAIR.md | tee r26l_repair_note.sha256
          sha256sum scripts/backtest/audit_rb_r26l_2026_week1_regime_transportability_v1.py | tee r26l_code.sha256
          sha256sum scripts/backtest/run_rb_r26l_2026_week1_regime_transportability_v1.py | tee r26l_compat_runner.sha256
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml \
            .github/workflows/production-week1-v4-r22-certification.yml
          echo PASS > r26l_protected_clean.txt
          echo R26L_PROTECTED_PRODUCTION_BOUNDARY_PASS

      - name: Verify and download immutable parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R26J_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26J_ARTIFACT_ID}" --jq '.digest')"
          PROD_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROD_ARTIFACT_ID}" --jq '.digest')"
          test "$R26J_ACTUAL" = "$R26J_DIGEST"
          test "$PROD_ACTUAL" = "$PROD_DIGEST"
          rm -rf parent_r26j current_prod current_prod_secondary
          mkdir -p parent_r26j current_prod
          gh run download "$R26J_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26J_ARTIFACT_NAME" --dir parent_r26j
          gh run download "$PROD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PROD_ARTIFACT_NAME" --dir current_prod
          test -s parent_r26j/data/backtests/r26j_2020_week1_comparability_source_audit_v1/r26j_source_disposition.json
          test -s parent_r26j/data/backtests/r26j_2020_week1_comparability_source_audit_v1/r26j_week1_vacancy_room_source_state.csv
          test -s current_prod/data/roles_ourlads.csv
          test -s current_prod/outputs/roles_ourlads.csv
          test -s current_prod/data/player_form_consensus.csv
          cmp --silent current_prod/data/roles_ourlads.csv current_prod/outputs/roles_ourlads.csv
          mkdir -p current_prod_secondary/data
          cp current_prod/data/roles_ourlads.csv current_prod_secondary/data/roles_ourlads.csv
          cp current_prod/data/player_form_consensus.csv current_prod_secondary/data/player_form_consensus.csv
          test "$(find current_prod_secondary -type f -name roles_ourlads.csv | wc -l)" -eq 1
          test "$(find current_prod_secondary -type f -name player_form_consensus.csv | wc -l)" -eq 1
          echo "R26L_IMMUTABLE_PARENTS_PASS r26j=$R26J_ACTUAL prod=$PROD_ACTUAL"
          echo R26L_SECONDARY_PRODUCTION_STAGING_PASS

      - name: Execute prospective source-only transportability audit
        run: |
          set -euo pipefail
          rm -rf data/backtests/r26l_2026_week1_regime_transportability_v1
          python scripts/backtest/run_rb_r26l_2026_week1_regime_transportability_v1.py \
            --r26j-root parent_r26j \
            --production-root current_prod_secondary \
            --protected-clean-marker r26l_protected_clean.txt \
            --out-dir data/backtests/r26l_2026_week1_regime_transportability_v1

      - name: Assert R26L authority contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/backtests/r26l_2026_week1_regime_transportability_v1/r26l_disposition.json').read_text())
          assert d['disposition'] in {
              '2026_SOURCE_REGIME_MODERN_LIKE_FOR_PROSPECTIVE_QUALIFICATION',
              '2026_SOURCE_REGIME_2020_LIKE_NO_MODERN_QUALIFICATION',
              '2026_SOURCE_REGIME_MIXED_NO_TRANSPORTABILITY_CONCLUSION',
              '2026_CURRENT_SOURCE_NOT_READY',
          }
          assert d['exclude_2020_authorized'] is False
          assert d['prospective_shadow_authorized'] is False
          assert d['production_promotion_authorized'] is False
          assert d['r9_refit'] is False
          assert d['predictions_regenerated'] is False
          assert d['sportsbook_inputs_used'] == 0
          assert d['same_week_depth_used'] is False
          assert d['production_parameters_changed'] is False
          assert d['r22_changed'] is False
          assert d['receiving_yard_means_changed'] is False
          assert d['secondary_production_diagnostics_decisive'] is False
          print('R26L_AUTHORITY_CONTRACT_PASS disposition=' + d['disposition'])
          PY

      - name: Show R26L result
        run: |
          cat data/backtests/r26l_2026_week1_regime_transportability_v1/r26l_disposition.json
          echo '=== 2026 source summary ==='
          cat data/backtests/r26l_2026_week1_regime_transportability_v1/r26l_2026_source_summary.csv
          echo '=== feature comparison ==='
          cat data/backtests/r26l_2026_week1_regime_transportability_v1/r26l_transportability_feature_comparison.csv

      - name: Upload R26L evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r26l-2026-week1-regime-transportability-v1
          retention-days: 90
          path: |
            r26l_plan.sha256
            r26l_lock.sha256
            r26l_repair_note.sha256
            r26l_code.sha256
            r26l_compat_runner.sha256
            r26l_protected_clean.txt
            data/backtests/r26l_2026_week1_regime_transportability_v1/*
