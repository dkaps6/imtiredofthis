name: Finalize RB R20 Handoff Once

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - .github/workflows/finalize-rb-r20-handoff-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-cross-position-catastrophic-casebook-v1
      - name: Advance canonical RB receiving handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/migrations/RB_RECEIVING_RESEARCH_HANDOFF_LATEST.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Exact next step'
          i = text.rfind(marker)
          if i < 0:
              raise SystemExit('FATAL: canonical handoff missing Exact next step marker')
          replacement = '''## R20 — real 2026 slate shadow integration — PASS, SHADOW ONLY

Full immutable result ledger: `docs/migrations/RB_R20_REAL_2026_SLATE_SHADOW_INTEGRATION_V1_RESULT.md`.

R20 run `34291433027`, artifact `10081502774`, artifact digest `sha256:853c0d3aea971c058ae6cc3b80c99ae2a5a0f681fae642835bbfa544da8283ca`, disposition `RB_R20_REAL_2026_SLATE_SHADOW_INTEGRATION_PASS_SHADOW_ONLY`.

R20 scored the real governed 2026 Week-1 slate (16 games, 32 teams, 469 players, 107 RB/FB scorer rows) through the immutable R19 scorer and frozen R17/R18 adapter with zero 2026 outcomes and no new OddsAPI fetch. All frozen gates passed. The current certified full-slate validator passed before and after shadow scoring; production files were byte-identical; canonical RB receiving-yard means were preserved to max delta `3.552713678800501e-15`; minimum rank correlation was `0.9999999999999999`; 94 true RB distributions were adapted in shadow while 13 FB rows remained exact under the frozen adapter contract.

R20 is deployability/parity evidence only. It does not activate the RB receiving-tail adapter in production.

## Exact next step

Freeze **R21: prospective 2026 shadow grading** before using Week-1 outcomes. Once the already-scored Week-1 slate is complete, grade the frozen R20 casebook without refitting or changing R19/R20 scores. Evaluate p30/p50 calibration/discrimination and distribution quality (CRPS, tail Brier, q90/q95 pinball/coverage) against the untouched canonical comparator. Do not promote silently; any activation requires a separately governed decision after prospective evidence.
'''
          p.write_text(text[:i] + replacement, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/migrations/RB_RECEIVING_RESEARCH_HANDOFF_LATEST.md
      - name: Commit canonical handoff advance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migrations/RB_RECEIVING_RESEARCH_HANDOFF_LATEST.md
          git commit -m 'Advance RB receiving handoff after R20'
          git push origin HEAD:research-cross-position-catastrophic-casebook-v1
