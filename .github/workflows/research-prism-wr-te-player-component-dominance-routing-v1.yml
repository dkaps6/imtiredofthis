name: Research PRISM WR TE Player Component Dominance Routing V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_WR_TE_PLAYER_COMPONENT_DOMINANCE_ROUTING_V1_FREEZE.md'
      - 'scripts/research/evaluate_prism_wr_te_player_component_dominance_routing_v1.py'
      - 'tests/test_prism_wr_te_player_component_dominance_routing_v1.py'
      - '.github/workflows/research-prism-wr-te-player-component-dominance-routing-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "f72e8c644c8cac0280fddb39ba4e02cc96c30931"

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_WR_TE_PLAYER_COMPONENT_DOMINANCE_ROUTING_V1_FREEZE.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/evaluate_prism_wr_te_player_component_dominance_routing_v1.py" 2>/dev/null; then
            echo "ERROR: scorer existed at frozen plan commit"
            exit 1
          fi

      - name: Verify exact component source authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run=39061606501
          aid=12111278777
          name='prism-player-mechanism-instability-source-v1-39061606501'
          digest='sha256:f64c6e7efde9deaf91b7bc19076693a5106cb632338c461acc4d2cfe2ae37ea9'
          repo=os.environ['GITHUB_REPOSITORY']
          payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))
          arts={int(a['id']):a for a in payload.get('artifacts',[])}
          a=arts.get(aid)
          assert a is not None,(run,aid)
          assert not a.get('expired'),a
          assert a.get('name')==name,a
          assert a.get('digest')==digest,a
          print('SOURCE_VERIFIED',run,aid,name,digest)
          PY

      - name: Download immutable source panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-component-routing
          mkdir -p /tmp/prism-component-routing/{source,out}
          gh run download 39061606501 --repo "${{ github.repository }}" \
            --name prism-player-mechanism-instability-source-v1-39061606501 \
            --dir /tmp/prism-component-routing/source
          test -s /tmp/prism-component-routing/source/wr_mechanism_instability_source_rows.csv
          test -s /tmp/prism-component-routing/source/te_mechanism_instability_source_rows.csv

      - name: Compile and test frozen scorer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_prism_wr_te_player_component_dominance_routing_v1.py
          pytest -q tests/test_prism_wr_te_player_component_dominance_routing_v1.py

      - name: Execute frozen component-routing test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_prism_wr_te_player_component_dominance_routing_v1.py \
            --wr /tmp/prism-component-routing/source/wr_mechanism_instability_source_rows.csv \
            --te /tmp/prism-component-routing/source/te_mechanism_instability_source_rows.csv \
            --out-dir /tmp/prism-component-routing/out

      - name: Certify frozen contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p=json.load(open('/tmp/prism-component-routing/out/component_dominance_routing_result.json'))
          wr=pd.read_csv('/tmp/prism-component-routing/out/wr_component_dominance_routing_rows.csv')
          te=pd.read_csv('/tmp/prism-component-routing/out/te_component_dominance_routing_rows.csv')
          assert p['version']=='PRISM_WR_TE_PLAYER_COMPONENT_DOMINANCE_ROUTING_V1',p
          assert p['freeze_commit']=='f72e8c644c8cac0280fddb39ba4e02cc96c30931',p
          assert p['disposition'] in {
              'PRISM_WR_TE_PLAYER_COMPONENT_DOMINANCE_ROUTING_V1_QUALIFIED_ALL',
              'PRISM_WR_TE_PLAYER_COMPONENT_DOMINANCE_ROUTING_V1_QUALIFIED_PARTIAL',
              'PRISM_WR_TE_PLAYER_COMPONENT_DOMINANCE_ROUTING_V1_CLOSED_ALL',
          },p
          assert p['dominance_ratio']==1.5,p
          assert p['prior_window_max']==8 and p['prior_window_min']==4,p
          assert p['position_prior_pseudo_observations']==4.0,p
          assert p['tail_harm_floor']==-0.01,p
          assert p['bootstrap_replicates']==5000,p
          assert len(wr)>0 and len(te)>0,(len(wr),len(te))
          assert (wr['prior_player_rows'].between(4,8)).all()
          assert (te['prior_player_rows'].between(4,8)).all()
          assert (wr['prior_player_max_week'] < wr['week']).all()
          assert (te['prior_player_max_week'] < te['week']).all()
          for frame in (wr,te):
              bp=frame[['baseline_opp_prob','baseline_eff_prob','baseline_mixed_prob']].sum(axis=1)
              cp=frame[['candidate_opp_prob','candidate_eff_prob','candidate_mixed_prob']].sum(axis=1)
              assert ((bp-1.0).abs()<=1e-10).all()
              assert ((cp-1.0).abs()<=1e-10).all()
          assert p['wr']['max_decomposition_identity_gap']<=1e-10,p
          assert p['te']['max_decomposition_identity_gap']<=1e-10,p
          assert p['wr']['chronology_violations']==0,p
          assert p['te']['chronology_violations']==0,p
          assert p['rb_status']=='SOURCE_NOT_CERTIFIED_FOR_THIS_V1',p
          assert p['qb_status']=='EXCLUDED_BY_ANTI_RETEST',p
          assert p['projection_means_changed']==0,p
          assert p['distributions_changed']==0,p
          assert p['coefficients_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['week6_week7_outcomes_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json,os
          p=json.load(open('/tmp/prism-component-routing/out/component_dominance_routing_result.json'))
          print("### PRISM WR/TE player component-dominance routing V1")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for pos in ('wr','te'):
              q=p[pos]
              d=q['development']; c=q['confirmation']
              print()
              print(f"**{pos.upper()} — qualified={q['qualified']}**")
              print(f"- development {d['season']}: rows={d['rows']} players={d['players']} Brier gain={d['brier_improvement']:+.6f} logloss gain={d['logloss_improvement']:+.6f} equal-player={d['mean_equal_player_brier_improvement']:+.6f}")
              print(f"- confirmation {c['season']}: rows={c['rows']} players={c['players']} Brier gain={c['brier_improvement']:+.6f} logloss gain={c['logloss_improvement']:+.6f}")
              print(f"- confirmation player CI low={c['player_cluster']['ci_low']:+.6f}; team-week CI low={c['team_week_cluster']['ci_low']:+.6f}; equal-player CI low={c['equal_player']['ci_low']:+.6f}")
              print(f"- player median={c['median_player_brier_improvement']:+.6f}; improved/worsened={c['player_improved_share']:.2%}/{c['player_worsened_share']:.2%}; p10={c['p10_player_brier_improvement']:+.6f}")
              failed=[k for k,v in q['gates'].items() if not v]
              print(f"- failed gates: {failed or ['NONE']}")
          print()
          print("Player-specific mechanism routing only. No mean/width change, no 2026 outcomes, no sportsbook/OddsAPI, no fitted coefficient/threshold, no production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload immutable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-wr-te-player-component-dominance-routing-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-component-routing/out/**
