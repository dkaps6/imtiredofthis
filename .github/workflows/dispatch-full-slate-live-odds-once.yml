name: Dispatch Full Slate Live Odds Once

# One-shot operational dispatcher; touch only when an explicit live-odds run is requested.
# authorized-live-run: 2026-09-11T21:35Z
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-full-slate-live-odds-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Full Slate with live odds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run full-slate.yml \
            --repo "${GH_REPO}" \
            --ref main \
            -f season=2026 \
            -f prior_season=2025 \
            -f date= \
            -f fetch_live_odds=true
          echo "Dispatched canonical Full Slate with fetch_live_odds=true"
