name: Research One Pass State Integration V1

on:
  push:
    branches: [research-one-pass-state-integration-v1]
    paths:
      - 'docs/research/ONE_PASS_STATE_INTEGRATION_V1_PLAN.md'
      - 'docs/research/ONE_PASS_STATE_INTEGRATION_V1_HISTORICAL_SELECTOR_AMENDMENT.md'
      - 'docs/research/ONE_PASS_STATE_INTEGRATION_V1_MECHANICAL_SCOPE_CLARIFICATION.md'
      - 'scripts/research/evaluate_one_pass_state_integration_v1.py'
      - '.github/workflows/research-one-pass-state-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-one-pass-state-integration-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow scikit-learn joblib

      - name: Compile frozen evaluator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_one_pass_state_integration_v1.py

      - name: Create workspace
        run: |
          rm -rf /tmp/one_pass /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model /tmp/phase_c /tmp/phase_j
          mkdir -p /tmp/one_pass /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model /tmp/phase_c /tmp/phase_j

      - name: Download WR-R15 fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: /tmp/wr_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34238301577

      - name: Download TE-R5P fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: /tmp/te_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34152797603

      - name: Download Phase-C selector source
        uses: actions/download-artifact@v4
        with:
          name: cross-position-catastrophic-casebook-v1-phase-c
          path: /tmp/phase_c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34147777341

      - name: Download Phase-J preserved walk-forward selector
        uses: actions/download-artifact@v4
        with:
          name: cross-position-phase-j-v1
          path: /tmp/phase_j
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34151640191

      - name: Verify frozen authorities exist
        run: |
          set -euo pipefail
          test -s /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          test -s /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv
          test -s /tmp/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv
          test -s /tmp/phase_j/data/backtests/cross_position_phase_j_v1/phase_j_state_casebook.csv

      - name: Build independent historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir /tmp/hist_2025

      - name: Combine historical schedule and team state
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/one_pass')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined rows in {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build canonical historical player injury and weather inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024,2025 --schedule /tmp/one_pass/schedule_history.csv --out /tmp/one_pass/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024,2025 --out /tmp/one_pass/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule /tmp/one_pass/schedule_history.csv --out /tmp/one_pass/weather_history.csv

      - name: Run frozen one-pass-state full-stack A/B
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_one_pass_state_integration_v1.py \
            --player-logs /tmp/one_pass/player_game_logs_history.csv \
            --team-weekly /tmp/one_pass/team_weekly_history.csv \
            --schedule /tmp/one_pass/schedule_history.csv \
            --universe-2024 /tmp/hist_2024/pregame_universe \
            --universe-2025 /tmp/hist_2025/pregame_universe \
            --injuries /tmp/one_pass/injuries_history.csv \
            --weather /tmp/one_pass/weather_history.csv \
            --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv \
            --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv \
            --phase-c-all-rows /tmp/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv \
            --phase-j-state-casebook /tmp/phase_j/data/backtests/cross_position_phase_j_v1/phase_j_state_casebook.csv \
            --weights data/model_ensemble_weights.csv \
            --weeks '1-18' \
            --iterations 2000 \
            --out-dir /tmp/one_pass/result
          cat /tmp/one_pass/result/RESULT.md

      - name: Upload frozen result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-pass-state-integration-v1
          path: |
            /tmp/one_pass/result/**
          if-no-files-found: warn
          retention-days: 30
