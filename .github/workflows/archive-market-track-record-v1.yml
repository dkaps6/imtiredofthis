name: Archive Market Track Record

on:
  workflow_run:
    workflows: ["Full Slate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"

jobs:
  archive:
    # Only archive genuine production runs of the canonical Full Slate
    # pipeline that actually completed (success or the run still produced a
    # priced board before a later step failed). This job never re-fetches
    # odds or re-prices anything -- it only reads outputs the triggering
    # run already produced and already paid for, same boundary as
    # scripts/operations/archive_priced_board_v1.py itself.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the triggering Full Slate run's artifact
        run: |
          rm -rf /tmp/fs_artifact
          mkdir -p /tmp/fs_artifact
          # Full Slate names its artifact run_<id>; the preserved-artifact
          # replay path names it offline_replay_<id>. Either one carries a
          # priced board, so try both before giving up.
          for NAME in "run_${SOURCE_RUN_ID}" "offline_replay_${SOURCE_RUN_ID}"; do
            if gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
                 --name "${NAME}" --dir /tmp/fs_artifact 2>/dev/null; then
              echo "downloaded ${NAME}"
              break
            fi
          done
          test -s /tmp/fs_artifact/outputs/props_priced_clean.csv \
            || echo "no priced board artifact for run ${SOURCE_RUN_ID} (likely no live odds this run)"

      - name: Archive priced board, if this run produced one
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          SRC=/tmp/fs_artifact/outputs/props_priced_clean.csv
          if [ ! -s "$SRC" ]; then
            echo "no priced board in this run's artifact (no-live-odds run) -- nothing to archive"
            exit 0
          fi
          WEEK_RESOLVED=$(python -c "from scripts.runtime_context import resolve_week; print(resolve_week())")
          python scripts/operations/archive_priced_board_v1.py \
            --priced-file "$SRC" \
            --season "${SEASON}" \
            --week "${WEEK_RESOLVED}" \
            --run-id "${SOURCE_RUN_ID}"

      - name: Snapshot recoverable ledger before git mutation
        run: |
          set -euo pipefail
          rm -rf /tmp/market_track_record_ledger
          if [ -d data/market_track_record/boards ]; then
            mkdir -p /tmp/market_track_record_ledger
            cp -a data/market_track_record/boards/. /tmp/market_track_record_ledger/
          fi

      - name: Commit archived board to the durable ledger
        run: |
          set -euo pipefail
          # A no-live-odds run archives nothing, so the ledger directory may
          # not exist at all. That is the normal case, not a failure: every
          # archive run in this workflow's history died here on
          # "pathspec did not match any files" under set -e, which is why the
          # committed ledger was empty for the whole 2026 season to date.
          if [ ! -d data/market_track_record/boards ]; then
            echo "no ledger directory -- this run archived nothing"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_track_record/boards/
          if git diff --cached --quiet; then
            echo "no market track record changes to commit"
            exit 0
          fi
          git commit -m "market track record: archive Full Slate run ${SOURCE_RUN_ID}"
          for ATTEMPT in 1 2 3 4; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push attempt ${ATTEMPT} lost a race; retrying from clean branch state"
            else
              echo "rebase attempt ${ATTEMPT} conflicted; aborting before retry/preservation"
              git rebase --abort || true
            fi
            sleep $((2 ** ATTEMPT))
          done
          # Never leave a conflicted/in-progress rebase for the retention step.
          git rebase --abort 2>/dev/null || true
          echo "::error::could not push the archived board to main; recoverable pre-git snapshot will be retained"
          exit 1

      - name: Preserve the ledger as a long-retention artifact
        # Backstop for the failure mode that nearly lost Week 1: Full Slate
        # artifacts expire after 7 days, so a board that is not committed is
        # unrecoverable a week later. Upload the pre-git snapshot, never the
        # working tree, so rebase conflicts cannot contaminate retained evidence.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: market_track_record_ledger_${{ github.run_id }}
          path: /tmp/market_track_record_ledger/
          if-no-files-found: ignore
          retention-days: 90
