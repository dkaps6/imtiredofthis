name: M96E Advance Research Handoff

on:
  push:
    branches:
      - research-rb-m96e-workload-risk-guard
    paths:
      - 'scripts/backtest/advance_m96e_handoff.py'
      - '.github/workflows/advance-m96e-research-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update terminal handoff
        run: python scripts/backtest/advance_m96e_handoff.py
      - name: Commit handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          git commit -m "M96E: freeze retrospective RB research pending prospective 2026"
          git push
