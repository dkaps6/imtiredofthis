name: QB Team Pass Opportunity Play Rate Decomp V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-team-pass-opportunity-play-rate-decomp-v1
    paths:
      - ".github/workflows/audit-qb-team-pass-opportunity-play-rate-decomp-v1.yml"
      - "scripts/backtest/evaluate_qb_team_pass_opportunity_play_rate_decomp_v1.py"
      - "docs/migrations/QB_TEAM_PASS_OPPORTUNITY_PLAY_RATE_DECOMP_V1_PLAN.md"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy
      - name: Compile frozen evaluator
        run: python -m py_compile scripts/backtest/evaluate_qb_team_pass_opportunity_play_rate_decomp_v1.py
      - name: Download immutable parent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/chain evidence/m89 evidence/shared
          gh run download 34523313743 --repo "${GITHUB_REPOSITORY}" --name qb-opportunity-chain-decomposition-v1 --dir evidence/chain
          gh run download 33331073376 --repo "${GITHUB_REPOSITORY}" --name m89-qb-data-integrity-casebook-synthesis --dir evidence/m89
          gh run download 34066549394 --repo "${GITHUB_REPOSITORY}" --name qb-wr-shared-pass-volume-mechanism --dir evidence/shared
      - name: Run frozen play/rate decomposition
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/qb_team_pass_opportunity_play_rate_decomp_v1
          python scripts/backtest/evaluate_qb_team_pass_opportunity_play_rate_decomp_v1.py \
            --chain-root evidence/chain \
            --m89-root evidence/m89 \
            --shared-root evidence/shared \
            --out-dir data/backtests/qb_team_pass_opportunity_play_rate_decomp_v1
      - name: Show result
        if: always()
        run: cat data/backtests/qb_team_pass_opportunity_play_rate_decomp_v1/play_rate_decomposition_result.json 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-team-pass-opportunity-play-rate-decomp-v1
          path: |
            data/backtests/qb_team_pass_opportunity_play_rate_decomp_v1/*
            docs/migrations/QB_TEAM_PASS_OPPORTUNITY_PLAY_RATE_DECOMP_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
