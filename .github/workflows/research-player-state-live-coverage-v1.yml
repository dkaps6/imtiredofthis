name: Research Player State Live Coverage V1

on:
  push:
    branches:
      - research-player-state-live-coverage-v1
    paths:
      - 'docs/research/PLAYER_STATE_LIVE_COVERAGE_V1_PLAN.md'
      - 'scripts/research/audit_player_state_live_coverage_v1.py'
      - 'tests/test_player_state_live_coverage_v1.py'
      - '.github/workflows/research-player-state-live-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyarrow
      - name: Run frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_player_state_live_coverage_v1.py
      - name: Run Week-5 no-outcome player-state audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/player_state_live
          mkdir -p /tmp/player_state_live
          python scripts/research/audit_player_state_live_coverage_v1.py --out-dir /tmp/player_state_live
      - name: Verify prospective boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/player_state_live/player_state_live_result.json').read_text())
          assert p['season']==2026 and p['target_week']==5,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['week5_outcomes_read']==0,p
          assert p['candidate_models_fit']==0,p
          assert p['production_changed'] is False,p
          assert p['chronology_violations']==0,p
          assert p['disposition'] in {
            'PLAYER_STATE_LIVE_READY_FOR_PROSPECTIVE_SHADOW',
            'PLAYER_STATE_LIVE_PARTIAL',
            'PLAYER_STATE_LIVE_NOT_READY',
          },p
          print('PLAYER_STATE_LIVE_COVERAGE_CONTRACT_CERTIFIED')
          PY
      - name: Display result
        if: always()
        run: |
          cat /tmp/player_state_live/player_state_live_result.json || true
          echo
          cat /tmp/player_state_live/player_state_live_position_coverage.csv || true
          echo
          cat /tmp/player_state_live/player_state_live_rb_rooms.csv || true
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-state-live-coverage-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/player_state_live/**
