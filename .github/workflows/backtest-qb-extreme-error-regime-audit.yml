name: Migration 62 QB Extreme Error Regime Audit

on:
  workflow_dispatch:
    inputs:
      iterations: {description: "MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-62-qb-extreme-error-regime-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib pyarrow

      - name: Declare Migration 62 scope and frozen interpretation rules
        run: |
          echo "Migration 62 is DIAGNOSTIC ONLY. No production football prediction changes."
          echo "Reference candidate: canonical attempts_raw_only from Migration 59."
          echo "2024/2025 development seasons only. Consumed 2023 holdout is NOT rescored; 2022 is not a target test."
          echo "Outcome-derived labels (actual attempts, error band, catastrophic miss) are diagnostics only and can never enter prospective feature manifests."
          echo "Situational labels are objective proxies, not claims that motivation/heart was measured directly."
          echo "Examples: division/rematch, prior blowout loss, prior postseason rematch, rest, coach change, recent former-opponent QB, record trajectory, late bubble/desperation/spoiler/Cinderella proxies."
          echo "Cross-season prospective test is frozen: train error-risk/confidence classifiers on 2024 only, test on 2025 only."
          echo "Actionable catastrophic-risk signal: 2025 ROC AUC >= .60 AND highest predicted-risk quintile catastrophic rate >= 1.5x 2025 base rate."
          echo "Actionable good-game confidence signal: 2025 ROC AUC >= .60 AND highest-confidence quintile <50-yard hit rate >= base+10pp AND MAE <= 85% of 2025 base MAE."
          echo "Replicated univariate signal: same effect direction in 2024 and 2025 with diagnostic AUC >= .58. Two or more such signals can justify a focused follow-up."
          echo "Passing these diagnostic criteria does NOT promote a football model; it only identifies information worth prospective modeling."

      - name: Build canonical Raw-Attempts errors and enrich regimes
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_extreme_error_regimes/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/diagnose_qb_raw_tail_attribution_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m59"

            python scripts/backtest/audit_qb_extreme_error_regimes.py \
              --season "$SEASON" \
              --game-attribution "$D/m59/m59_game_attribution_${SEASON}.csv" \
              --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" \
              --out-dir "$D/m62"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Cross-season prospective regime validation
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/finalize_qb_extreme_error_regimes.py \
            --season-file data/backtests/qb_extreme_error_regimes/2024/m62/m62_enriched_games_2024.csv \
            --season-file data/backtests/qb_extreme_error_regimes/2025/m62/m62_enriched_games_2025.csv \
            --manifest-file data/backtests/qb_extreme_error_regimes/2024/m62/m62_safe_feature_manifest_2024.csv \
            --manifest-file data/backtests/qb_extreme_error_regimes/2025/m62/m62_safe_feature_manifest_2025.csv \
            --out-dir data/backtests/qb_extreme_error_regimes/summary

      - name: Show Migration 62 results
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_extreme_error_regimes/summary/m62_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- combined error bands ---'
          cat data/backtests/qb_extreme_error_regimes/summary/m62_combined_error_bands.csv 2>/dev/null || true
          echo '--- classifiers ---'
          cat data/backtests/qb_extreme_error_regimes/summary/m62_2024_to_2025_classifier_metrics.csv 2>/dev/null || true
          echo '--- risk quintiles ---'
          cat data/backtests/qb_extreme_error_regimes/summary/m62_2025_risk_quintiles.csv 2>/dev/null || true
          echo '--- replicated features ---'
          cat data/backtests/qb_extreme_error_regimes/summary/m62_replicated_strong_features.csv 2>/dev/null || true

      - name: Upload Migration 62 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-62-qb-extreme-error-regime-audit
          path: |
            data/backtests/qb_extreme_error_regimes/summary/*.csv
            data/backtests/qb_extreme_error_regimes/2024/m62/*.csv
            data/backtests/qb_extreme_error_regimes/2025/m62/*.csv
            data/backtests/qb_extreme_error_regimes/2024/m59/m59_game_attribution_2024.csv
            data/backtests/qb_extreme_error_regimes/2025/m59/m59_game_attribution_2025.csv
            data/backtests/qb_extreme_error_regimes/2024/historical_input_validation.csv
            data/backtests/qb_extreme_error_regimes/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
