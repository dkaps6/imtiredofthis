name: Week1 QB Distribution Shadow V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/shadow-qb-distribution-week1-v1.yml'
      - 'scripts/run_qb_distribution_shadow_full_roster_v2.py'
      - 'scripts/run_qb_distribution_state_context.py'
      - 'scripts/utils/build_team_week_map_v2.py'
      - 'scripts/simulation_c2_qb_candidate.py'
      - 'scripts/modeling/qb_distribution_state_v1.py'
      - 'model/qb_distribution_state_selector_v1.json'
      - 'docs/migrations/QB_DISTRIBUTION_SHADOW_WEEK1_V1_PLAN.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dispatch exact-branch no-credit paid-artifact replay
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "launcher_sha=${GITHUB_SHA}"
          echo 'NO OddsAPI fetch: dispatching replay-paid-full-slate-artifact-v1.yml, which reuses run 34152868136.'
          gh workflow run replay-paid-full-slate-artifact-v1.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}"
          RUN_ID=''
          for i in $(seq 1 24); do
            RUN_ID=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow replay-paid-full-slate-artifact-v1.yml \
              --branch "${GITHUB_REF_NAME}" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${GITHUB_SHA}\") | .databaseId" | head -n1 || true)
            if [ -n "${RUN_ID}" ]; then break; fi
            sleep 5
          done
          if [ -z "${RUN_ID}" ]; then
            echo 'FATAL: could not resolve dispatched no-credit replay for launcher SHA'
            exit 1
          fi
          echo "replay_run_id=${RUN_ID}" | tee full_slate_run_id.txt
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json status,conclusion,headSha,url

      - name: Download exact no-credit replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence/full_slate
          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name paid-full-slate-replay-v1 \
            --dir evidence/full_slate
          test -s evidence/full_slate/data/live_odds_status.json
          test -s evidence/full_slate/data/football_simulation_universe.csv
          test -s evidence/full_slate/outputs/props_priced_clean.csv
          python - <<'PY'
          import json
          x=json.load(open('evidence/full_slate/data/live_odds_status.json',encoding='utf-8'))
          if x.get('odds_api_refetched') is not False:
              raise SystemExit(f'FATAL: replay did not certify no-refetch: {x.get("odds_api_refetched")}')
          if int(x.get('replay_source_run',0)) != 34152868136:
              raise SystemExit(f'FATAL: unexpected paid source run: {x.get("replay_source_run")}')
          print('NO_CREDIT_REPLAY_CERTIFIED source_run=34152868136')
          PY

      - name: Install frozen shadow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml
          python -m py_compile \
            scripts/run_qb_distribution_shadow_full_roster_v2.py \
            scripts/run_qb_distribution_state_context.py \
            scripts/simulation_c2_qb_candidate.py \
            scripts/modeling/qb_distribution_state_v1.py

      - name: Build strict-prior 2026 Week1 selector context
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/utils/build_team_week_map_v2.py --season 2026 --out data/team_week_map.csv
          test -s data/team_week_map.csv
          python scripts/run_qb_distribution_state_context.py --season 2026 --week 1
          test -s data/qb_distribution_state_context.csv

      - name: Run full-roster real-slate QB distribution shadow audit
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_qb_distribution_shadow_full_roster_v2.py \
            --universe evidence/full_slate/data/football_simulation_universe.csv \
            --priced evidence/full_slate/outputs/props_priced_clean.csv \
            --state-context data/qb_distribution_state_context.csv \
            --out outputs/qb_distribution_shadow_v1.csv \
            --result outputs/qb_distribution_shadow_v1_result.json

      - name: Show frozen deployment result
        if: always()
        run: |
          echo '=== No-credit replay source run ==='
          cat full_slate_run_id.txt 2>/dev/null || true
          echo '=== Shadow result ==='
          cat outputs/qb_distribution_shadow_v1_result.json 2>/dev/null || true
          echo '=== Shadow QB rows ==='
          test -s outputs/qb_distribution_shadow_v1.csv && cat outputs/qb_distribution_shadow_v1.csv || true

      - name: Upload shadow deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-distribution-shadow-week1-v1
          path: |
            full_slate_run_id.txt
            data/qb_distribution_state_context.csv
            data/qb_distribution_state_context_audit.csv
            outputs/qb_distribution_shadow_v1.csv
            outputs/qb_distribution_shadow_v1_result.json
            docs/migrations/QB_DISTRIBUTION_SHADOW_WEEK1_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
