name: Archive Market Track Record

on:
  workflow_run:
    workflows: ["Full Slate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"

jobs:
  archive:
    # Only archive genuine production runs of the canonical Full Slate
    # pipeline that actually completed (success or the run still produced a
    # priced board before a later step failed). This job never re-fetches
    # odds or re-prices anything -- it only reads outputs the triggering
    # run already produced and already paid for, same boundary as
    # scripts/operations/archive_priced_board_v1.py itself.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the triggering Full Slate run's artifact
        run: |
          rm -rf /tmp/fs_artifact
          mkdir -p /tmp/fs_artifact
          # Full Slate names its artifact run_<id>; the preserved-artifact
          # replay path names it offline_replay_<id>. Either one carries a
          # priced board, so try both before giving up.
          for NAME in "run_${SOURCE_RUN_ID}" "offline_replay_${SOURCE_RUN_ID}"; do
            if gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
                 --name "${NAME}" --dir /tmp/fs_artifact 2>/dev/null; then
              echo "downloaded ${NAME}"
              break
            fi
          done
          test -s /tmp/fs_artifact/outputs/props_priced_clean.csv \
            || echo "no priced board artifact for run ${SOURCE_RUN_ID} (likely no live odds this run)"

      - name: Resolve the triggering run's season and week from its own artifact
        run: |
          set -euo pipefail
          # Scope must come from the run being archived, not from this job.
          # SEASON is hard-coded in this workflow's env and resolve_week()
          # answers for the archive job's own wall clock, so a manually
          # dispatched Full Slate using the season/date inputs -- or any
          # replay of an earlier slate -- would be labelled as the current
          # week and overwrite that week's ledger files. Every candidate below
          # is content the triggering run itself wrote into the artifact.
          read -r ARCH_SEASON ARCH_WEEK <<<"$(python - <<'PY'
          import csv, sys

          # Ordered by authority. The priced board is definitive when pricing
          # succeeded; the other two exist even when it failed, which is the
          # case this has to survive.
          CANDIDATES = [
              "/tmp/fs_artifact/outputs/props_priced_clean.csv",
              "/tmp/fs_artifact/data/metrics_ready.csv",
              "/tmp/fs_artifact/data/player_form.csv",
          ]

          for path in CANDIDATES:
              try:
                  with open(path, newline="", encoding="utf-8") as fh:
                      rows = list(csv.DictReader(fh))
              except OSError:
                  continue
              if not rows or "season" not in rows[0] or "week" not in rows[0]:
                  continue
              pairs = {(r["season"], r["week"]) for r in rows
                       if (r.get("season") or "").strip() and (r.get("week") or "").strip()}
              if len(pairs) != 1:
                  # Two slates in one artifact means the scope is not provable.
                  print(f"{path}: ambiguous scope {sorted(pairs)}", file=sys.stderr)
                  continue
              season, week = pairs.pop()
              print(f"resolved from {path}", file=sys.stderr)
              print(int(float(season)), int(float(week)))
              break
          else:
              print("FATAL: no artifact content proves this run's season/week",
                    file=sys.stderr)
              raise SystemExit(1)
          PY
          )"
          echo "triggering run scope: season=${ARCH_SEASON} week=${ARCH_WEEK}"
          echo "ARCH_SEASON=${ARCH_SEASON}" >> "$GITHUB_ENV"
          echo "ARCH_WEEK=${ARCH_WEEK}" >> "$GITHUB_ENV"
          echo "ARCH_STEM=$(printf '%d_wk%02d' "${ARCH_SEASON}" "${ARCH_WEEK}")" >> "$GITHUB_ENV"

      - name: Preserve the paid raw inputs, whether or not pricing succeeded
        run: |
          set -euo pipefail
          # This runs BEFORE the priced-board step and does not depend on it.
          # A run can buy the odds and then fail in pricing -- Week 6's paid
          # acquisition (run 38791377571) did exactly that, failing at the
          # pricing step with props_raw.csv and odds_game.csv already on disk.
          # Gating these behind the priced board recreates the precise failure
          # that lost Weeks 3-5: acquisition paid, pricing failed, paid
          # boundary expired.
          #
          # odds_game.csv also carries the game total, spread and implied team
          # totals, which is the pregame game-environment signal.
          for pair in "odds_game.csv:game_odds" "props_raw.csv:raw_props"; do
            f="${pair%%:*}"; d="${pair##*:}"
            if [ -s "/tmp/fs_artifact/outputs/$f" ]; then
              mkdir -p "data/market_track_record/$d"
              cp "/tmp/fs_artifact/outputs/$f" "data/market_track_record/$d/${ARCH_STEM}.csv"
              echo "preserved $d/${ARCH_STEM}.csv ($(wc -l < "/tmp/fs_artifact/outputs/$f") lines)"
            else
              echo "note: $f absent from this run's artifact (expected with no live odds)"
            fi
          done

      - name: Preserve the REPLAY INPUT SET
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          # Fourth instance of one gap: weeks 3-5 boards expired at retention 7;
          # decision-gate evidence missing for weeks 6-7; the week-7 explanatory
          # trace has the ML/State prediction columns stripped so the production
          # pricing path cannot be replayed; and run 40551229604's artifact has
          # those columns but no pricing boundary. The archive and the trace each
          # hold half of what a replay needs.
          #
          # This preserves the other half: the model-side inputs, ungzipped size
          # ~5MB, ~350KB gzipped per slate. Deliberately NOT denylist-stripped --
          # a replay needs what production actually consumed, and the paid
          # boundary is already archived beside it. The directory README says so.
          #
          # Soft-fails like the explanatory step: the paid boundary is the
          # archive's first duty. But a stripped required column warns loudly,
          # on the run that causes it rather than months later.
          python scripts/operations/preserve_replay_input_set_v1.py \
            --artifact-dir /tmp/fs_artifact \
            --out-dir data/market_track_record/replay_inputs \
            --stem "${ARCH_STEM}" \
            --run-id "${SOURCE_RUN_ID}" \
            --git-sha "${GITHUB_SHA}" \
            --week "${ARCH_WEEK}" || \
            echo "::warning::replay-input preservation FAILED for ${ARCH_STEM}; the paid boundary is unaffected"

      - name: Preserve the PRE-SPORTSBOOK explanatory state
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          # Forward-looking half of the §5a fix required by audit response
          # 6428042413. Weeks 3-5 taught that an unarchived paid boundary is
          # unrecoverable; Week 7 taught the same about the EXPLANATORY state.
          # prior_games, current_games, bayes_*_share, post-rule opportunity
          # shares, allocator admission and target entitlement are what make
          # a projection's route auditable, and no run was committing them --
          # so artifact 12456298985 was the only copy, expiring 2027-01-20.
          #
          # Reuses the research extractor rather than reimplementing the §3
          # denylist: every sportsbook and decision column is stripped, and
          # the extractor raises if one survives.
          #
          # Soft-fails on purpose. The archive's first duty is the paid
          # boundary preserved above, and that must never be jeopardised by
          # an enrichment -- but the failure is loud, per AGENTS.md §4.
          mkdir -p data/market_track_record/explanatory
          if python scripts/research/preserve_week7_opportunity_trace_v1.py \
               --artifact-dir /tmp/fs_artifact \
               --week "${ARCH_WEEK}" \
               --stem-prefix "${ARCH_STEM}" \
               --out-dir data/market_track_record/explanatory \
               --run-id "${SOURCE_RUN_ID}"; then
            echo "preserved explanatory state for ${ARCH_STEM}"
          else
            echo "::warning::explanatory-state preservation FAILED for ${ARCH_STEM};"\
                 "the paid boundary above is unaffected, but this slate's"\
                 "projection route will not be auditable once the run"\
                 "artifact expires"
          fi

      - name: Archive priced board, if this run produced one
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          SRC=/tmp/fs_artifact/outputs/props_priced_clean.csv
          if [ ! -s "$SRC" ]; then
            echo "no priced board in this run's artifact -- raw paid inputs already preserved above"
            exit 0
          fi
          python scripts/operations/archive_priced_board_v1.py \
            --priced-file "$SRC" \
            --season "${ARCH_SEASON}" \
            --week "${ARCH_WEEK}" \
            --run-id "${SOURCE_RUN_ID}"

      - name: Snapshot recoverable ledger before git mutation
        run: |
          set -euo pipefail
          rm -rf /tmp/market_track_record_ledger
          if [ -d data/market_track_record ]; then
            mkdir -p /tmp/market_track_record_ledger
            cp -a data/market_track_record/. /tmp/market_track_record_ledger/
          fi

      - name: Commit archived board to the durable ledger
        run: |
          set -euo pipefail
          # A no-live-odds run archives nothing, so the ledger directory may
          # not exist at all. That is the normal case, not a failure: every
          # archive run in this workflow's history died here on
          # "pathspec did not match any files" under set -e, which is why the
          # committed ledger was empty for the whole 2026 season to date.
          if [ ! -d data/market_track_record/boards ]; then
            echo "no ledger directory -- this run archived nothing"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_track_record/
          if git diff --cached --quiet; then
            echo "no market track record changes to commit"
            exit 0
          fi
          git commit -m "market track record: archive Full Slate run ${SOURCE_RUN_ID}"
          for ATTEMPT in 1 2 3 4; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push attempt ${ATTEMPT} lost a race; retrying from clean branch state"
            else
              echo "rebase attempt ${ATTEMPT} conflicted; aborting before retry/preservation"
              git rebase --abort || true
            fi
            sleep $((2 ** ATTEMPT))
          done
          # Never leave a conflicted/in-progress rebase for the retention step.
          git rebase --abort 2>/dev/null || true
          echo "::error::could not push the archived board to main; recoverable pre-git snapshot will be retained"
          exit 1

      - name: Preserve the ledger as a long-retention artifact
        # Backstop for the failure mode that actually lost Weeks 3-5: a board
        # that is not committed is unrecoverable once its artifact expires.
        # Full Slate uploads are now pinned at 90 days rather than the 7 that
        # ran out on those slates, but 90 is GitHub's ceiling for a public
        # repository, not permanence -- the commit below is the durable copy
        # and this upload is only a safety net for a failed push. Upload the
        # pre-git snapshot, never the working tree, so rebase conflicts cannot
        # contaminate retained evidence.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: market_track_record_ledger_${{ github.run_id }}
          path: /tmp/market_track_record_ledger/
          if-no-files-found: ignore
          retention-days: 90
