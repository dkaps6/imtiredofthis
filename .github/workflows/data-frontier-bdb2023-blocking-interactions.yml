name: Data Frontier BDB2023 Blocking Interactions

on:
  push:
    branches:
      - data-frontier-phase0-bdb-contact-v1
    paths:
      - '.github/workflows/data-frontier-bdb2023-blocking-interactions.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_SECRET_RAW: ${{ secrets.KAGGLE_API_TOKEN }}
  BDB2023_COMPETITION: nfl-big-data-bowl-2023

jobs:
  audit-blocking-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize Kaggle token
        shell: bash
        run: |
          set -euo pipefail
          raw="${KAGGLE_SECRET_RAW:-}"
          token="${raw#export KAGGLE_API_TOKEN=}"
          token="${token#KAGGLE_API_TOKEN=}"
          token="${token//$'\r'/}"
          token="${token//$'\n'/}"
          [[ "$token" == KGAT_* ]]
          echo "::add-mask::$token"
          echo "KAGGLE_API_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p "${HOME}/.kaggle"
          printf '%s' "$token" > "${HOME}/.kaggle/access_token"
          chmod 600 "${HOME}/.kaggle/access_token"
      - name: Install dependencies
        run: pip install kaggle pandas
      - name: Download official BDB 2023 corpus ephemerally
        shell: bash
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/bdb2023_interaction_download"
          c="${RUNNER_TEMP}/bdb2023_interaction_corpus"
          mkdir -p "$d" "$c"
          kaggle competitions download -c "${BDB2023_COMPETITION}" -p "$d"
          z="$(find "$d" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$z"
          unzip -q "$z" -d "$c"
          rm -f "$z"
          echo "BDB2023_CORPUS_DIR=$c" >> "$GITHUB_ENV"
      - name: Audit complete blocking-interaction semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bdb2023_blocking_interactions"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ['BDB2023_CORPUS_DIR'])
          out = Path(os.environ['RUNNER_TEMP']) / 'bdb2023_blocking_interactions'
          pff = pd.read_csv(next(root.rglob('pffScoutingData.csv')))
          pff['blockedNflId'] = pd.to_numeric(pff['pff_nflIdBlockedPlayer'], errors='coerce').astype('Int64')
          interactions = pff[pff['blockedNflId'].notna()].copy()

          lookup = pff[['gameId','playId','nflId','pff_role','pff_positionLinedUp']].rename(columns={
              'nflId':'blockedNflId',
              'pff_role':'blockedPlayerRole',
              'pff_positionLinedUp':'blockedPlayerPffPosition',
          })
          interactions = interactions.merge(lookup, on=['gameId','playId','blockedNflId'], how='left')

          def nested_counts(df, a, b):
              if df.empty:
                  return {}
              t = pd.crosstab(df[a].fillna('<NULL>'), df[b].fillna('<NULL>'))
              return {str(i): {str(j): int(v) for j,v in row.items()} for i,row in t.to_dict(orient='index').items()}

          pass_block = pff[pff['pff_role'].eq('Pass Block')].copy()
          eligible_pass_block = pass_block[~pass_block['pff_blockType'].fillna('<NULL>').isin(['NB','<NULL>'])]
          eligible_assigned = eligible_pass_block['pff_nflIdBlockedPlayer'].notna()

          route_interactions = interactions[interactions['pff_role'].eq('Pass Route')]
          route_block_types = {str(k): int(v) for k,v in route_interactions['pff_blockType'].fillna('<NULL>').value_counts().items()}
          route_target_roles = {str(k): int(v) for k,v in route_interactions['blockedPlayerRole'].fillna('<MISSING>').value_counts().items()}

          summary = {
              'audit_version': 'BDB2023_BLOCKING_INTERACTION_CONTRACT_V1',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'raw_competition_files_uploaded': False,
              'predictive_experiment': False,
              'production_changed': False,
              'all_interaction_rows': int(len(interactions)),
              'interaction_source_role_counts': {str(k): int(v) for k,v in interactions['pff_role'].value_counts().items()},
              'interaction_target_role_counts': {str(k): int(v) for k,v in interactions['blockedPlayerRole'].fillna('<MISSING>').value_counts().items()},
              'interaction_source_role_by_block_type': nested_counts(interactions, 'pff_role', 'pff_blockType'),
              'interaction_source_role_by_target_role': nested_counts(interactions, 'pff_role', 'blockedPlayerRole'),
              'pass_block_rows': int(len(pass_block)),
              'pass_block_rows_excluding_nb_and_null_block_type': int(len(eligible_pass_block)),
              'pass_block_assignment_rows_excluding_nb_and_null_block_type': int(eligible_assigned.sum()),
              'pass_block_assignment_rate_excluding_nb_and_null_block_type': float(eligible_assigned.mean()),
              'pass_route_interaction_rows': int(len(route_interactions)),
              'pass_route_interaction_block_type_counts': route_block_types,
              'pass_route_interaction_target_role_counts': route_target_roles,
              'unresolved_blocked_player_rows': int(interactions['blockedPlayerRole'].isna().sum()),
              'resolved_blocked_player_rows': int(interactions['blockedPlayerRole'].notna().sum()),
          }
          (out/'bdb2023_blocking_interaction_contract.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))

          # Two source anomalies are known from the exception audit. Fail only if the
          # official corpus changes beyond that frozen tolerance; do not silently expand it.
          if summary['unresolved_blocked_player_rows'] > 2:
              raise SystemExit('Unexpected increase in unresolved blocked-player references')
          if summary['pass_block_assignment_rate_excluding_nb_and_null_block_type'] < 0.999:
              raise SystemExit('Eligible Pass Block assignment coverage below frozen source-contract floor')
          PY
      - name: Upload sanitized blocking-interaction contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdb2023-blocking-interaction-contract
          path: ${{ runner.temp }}/bdb2023_blocking_interactions
          if-no-files-found: error
          retention-days: 30
