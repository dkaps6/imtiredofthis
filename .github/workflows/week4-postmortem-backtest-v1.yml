name: Week4 Postmortem Backtest V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-week4-postmortem-execution-v1
    paths:
      - '.github/workflows/week4-postmortem-backtest-v1.yml'
      - 'scripts/research/week4_postmortem_source_gate_v1.py'
      - 'data/research/week4_postmortem/WEEK4_PRODUCTION_DECISION_GATE_EVIDENCE_V1.json'
      - 'data/research/week4_postmortem/WEEK4_MANUAL_SETTLEMENT_EVIDENCE_V1.json'
      - 'scripts/operations/grade_market_track_record_gsis_v1.py'
      - 'scripts/research/grade_week4_projection_authority_move_direction_v1.py'
      - 'scripts/research/analyze_weeks1_4_failure_modes_v1.py'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  WEEK: "4"
  WEEK4_SOURCE_RUN_ID: "36935917903"
  WEEK4_SOURCE_GIT_SHA: "88698538814669a83ce65aabe431b894e93c057c"
  WEEK4_ARTIFACT_ID: "11197776900"
  WEEK4_ARTIFACT_NAME: "week4-live-recovered-36935917903"
  WEEK4_ARTIFACT_DIGEST: "sha256:3f058570037ca016a5cbf1fa79e6e6abc4d845384de4dbdfaf477c8f0a3160a8"
  PAID_SOURCE_RUN_ID: "36934563481"
  PAID_ARTIFACT_ID: "11197726111"
  PAID_ARTIFACT_DIGEST: "sha256:202aa5205e71ad0acedf1910f505c2b362f564d8593a0f82dd0928fb45175aae"
  W13_RUN_ID: "36622608145"
  W13_ARTIFACT_ID: "11059171429"
  W13_ARTIFACT_DIGEST: "sha256:5e05afca1f94afaa04a4da6f93fa396714df2234d283cc75302b87eac97d38a6"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest

      - name: Verify Week 4 postgame source completeness
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          mkdir -p data/research/week4_postmortem
          python scripts/research/week4_postmortem_source_gate_v1.py \
            --out data/research/week4_postmortem/source_gate.json

      - name: Verify frozen Week 4 artifact authorities
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WEEK4_SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/w4_artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PAID_SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/paid_artifacts.json
          python - <<'PY'
          import json, os

          def check(path, artifact_id, name=None, digest=None):
              obj=json.load(open(path, encoding='utf-8'))
              want=int(artifact_id)
              matches=[a for a in obj.get('artifacts',[]) if int(a.get('id',-1)) == want]
              if len(matches) != 1:
                  raise SystemExit(f"FATAL artifact id {want} found {len(matches)} times in {path}")
              a=matches[0]
              if name is not None:
                  assert a.get('name') == name, a
              if digest is not None:
                  assert a.get('digest') == digest, a
              assert not bool(a.get('expired')), a
              print({'id':want,'name':a.get('name'),'digest':a.get('digest'),'expired':a.get('expired')})

          check('/tmp/w4_artifacts.json', os.environ['WEEK4_ARTIFACT_ID'],
                os.environ['WEEK4_ARTIFACT_NAME'], os.environ['WEEK4_ARTIFACT_DIGEST'])
          check('/tmp/paid_artifacts.json', os.environ['PAID_ARTIFACT_ID'],
                digest=os.environ['PAID_ARTIFACT_DIGEST'])
          PY

      - name: Download immutable recovered Week 4 board
        run: |
          set -euo pipefail
          rm -rf /tmp/week4_recovered
          mkdir -p /tmp/week4_recovered
          gh run download "${WEEK4_SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${WEEK4_ARTIFACT_NAME}" \
            --dir /tmp/week4_recovered
          test -s /tmp/week4_recovered/outputs/props_priced_clean.csv

      - name: Materialize Week 4 board in ephemeral market-track ledger
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/archive_priced_board_v1.py \
            --priced-file /tmp/week4_recovered/outputs/props_priced_clean.csv \
            --season "${SEASON}" \
            --week "${WEEK}" \
            --run-id "${WEEK4_SOURCE_RUN_ID}" \
            --git-sha "${WEEK4_SOURCE_GIT_SHA}"
          test -s data/market_track_record/boards/2026_wk04.csv

      - name: Settle canonical Week 4 selected record
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.operations.grade_market_track_record_gsis_v1 import grade

          out=Path("data/research/week4_postmortem")
          detail=out/"week4_selected_graded_detail.csv"
          evidence=json.loads((out/"WEEK4_PRODUCTION_DECISION_GATE_EVIDENCE_V1.json").read_text(encoding="utf-8"))
          manual=json.loads((out/"WEEK4_MANUAL_SETTLEMENT_EVIDENCE_V1.json").read_text(encoding="utf-8"))
          summary=grade(
              2026,[4],
              detail_out=detail,
              production_gate_evidence=evidence,
              manual_settlement_evidence=manual,
          )
          (out/"week4_selected_settlement_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, default=str)+"\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          unresolved=int(summary.get("still_unresolved_rows", -1))
          if unresolved != 0:
              raise SystemExit(
                  f"WEEK4_SETTLEMENT_BLOCKED_UNRESOLVED_ROWS={unresolved}; "
                  "headline metrics intentionally not computed"
              )
          print("WEEK4_SELECTED_SETTLEMENT_GATE_PASS")
          PY

      - name: Generate Week 4 diagnostics
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/report_weekly_backtest_v1.py \
            --detail data/research/week4_postmortem/week4_selected_graded_detail.csv \
            | tee data/research/week4_postmortem/week4_selected_weekly_report.txt

          python scripts/operations/backtest_full_report_v1.py \
            --season 2026 \
            --weeks 4 \
            --production-gate-evidence data/research/week4_postmortem/WEEK4_PRODUCTION_DECISION_GATE_EVIDENCE_V1.json \
            --manual-settlement-evidence data/research/week4_postmortem/WEEK4_MANUAL_SETTLEMENT_EVIDENCE_V1.json \
            --out data/research/week4_postmortem/week4_selected_full_graded.csv \
            | tee data/research/week4_postmortem/week4_selected_full_report.txt

          python scripts/research/slice_graded_track_record_v1.py \
            --detail data/research/week4_postmortem/week4_selected_full_graded.csv \
            --min-n 25 --fdr-q 0.10 \
            | tee data/research/week4_postmortem/week4_clustered_slice_report.txt

      - name: Grade frozen Week 4+ projection-authority move-direction shadow
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/research/grade_week4_projection_authority_move_direction_v1.py \
            --graded data/research/week4_postmortem/week4_selected_full_graded.csv \
            --out data/research/week4_postmortem/week4_projection_authority_move_direction_v1.json \
            | tee data/research/week4_postmortem/week4_projection_authority_move_direction_v1.txt

      - name: Download frozen Weeks 1-3 canonical graded artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/w13
          mkdir -p /tmp/w13
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${W13_ARTIFACT_ID}" > /tmp/w13_meta.json
          python - <<'PY'
          import json, os
          a=json.load(open('/tmp/w13_meta.json', encoding='utf-8'))
          assert int(a.get('id',-1)) == int(os.environ['W13_ARTIFACT_ID']), a
          assert a.get('digest') == os.environ['W13_ARTIFACT_DIGEST'], a
          assert not bool(a.get('expired')), a
          open('/tmp/w13_name.txt','w',encoding='utf-8').write(str(a.get('name','')))
          print({'id':a.get('id'),'name':a.get('name'),'digest':a.get('digest'),'expired':a.get('expired')})
          PY
          W13_NAME=$(cat /tmp/w13_name.txt)
          test -n "${W13_NAME}"
          gh run download "${W13_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${W13_NAME}" \
            --dir /tmp/w13
          W13_GRADED=$(find /tmp/w13 -type f -name 'weeks1_3_full_graded.csv' | head -1)
          test -n "${W13_GRADED}"
          test -s "${W13_GRADED}"
          cp "${W13_GRADED}" /tmp/weeks1_3_full_graded.csv

      - name: Build canonical Weeks 1-4 cumulative ledger without regrading Weeks 1-3
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          old=pd.read_csv('/tmp/weeks1_3_full_graded.csv', low_memory=False)
          w4=pd.read_csv('data/research/week4_postmortem/week4_selected_full_graded.csv', low_memory=False)
          assert set(pd.to_numeric(old['week'],errors='coerce').dropna().astype(int)) == {1,2,3}
          assert set(pd.to_numeric(w4['week'],errors='coerce').dropna().astype(int)) == {4}
          out=pd.concat([old,w4], ignore_index=True, sort=False)
          path=Path('data/research/week4_postmortem/weeks1_4_full_graded.csv')
          out.to_csv(path,index=False)
          print({'weeks1_3_rows':len(old),'week4_rows':len(w4),'weeks1_4_rows':len(out)})
          PY

          python - <<'PY' | tee data/research/week4_postmortem/weeks1_4_full_report.txt
          import pandas as pd
          from scripts.operations.backtest_full_report_v1 import report
          g=pd.read_csv('data/research/week4_postmortem/weeks1_4_full_graded.csv', low_memory=False)
          report(g, 2026, [1,2,3,4])
          PY

          python scripts/research/slice_graded_track_record_v1.py \
            --detail data/research/week4_postmortem/weeks1_4_full_graded.csv \
            --min-n 25 --fdr-q 0.10 \
            | tee data/research/week4_postmortem/weeks1_4_clustered_slice_report.txt

      - name: Build Weeks 1-4 failure-mode atlas
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          mkdir -p data/research/week4_postmortem/failure_mode_atlas_v1
          python scripts/research/analyze_weeks1_4_failure_modes_v1.py \
            --graded data/research/week4_postmortem/weeks1_4_full_graded.csv \
            --out-dir data/research/week4_postmortem/failure_mode_atlas_v1 \
            | tee data/research/week4_postmortem/failure_mode_atlas_v1/stdout.txt

      - name: Upload Week 4 postmortem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week4-postmortem-backtest-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            data/research/week4_postmortem/**
            data/market_track_record/boards/2026_wk04.csv
