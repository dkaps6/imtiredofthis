name: Research Future-Week WR TE Trajectory Lock Mechanics V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/lock_player_target_share_trajectory_future_week_v1.py'
      - 'tests/test_player_target_share_trajectory_future_week_v1.py'
      - '.github/workflows/research-future-week-target-share-trajectory-mechanics-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mechanics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml nflreadpy scipy pyarrow

      - name: Compile and test future-week WR TE trajectory mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/lock_player_target_share_trajectory_future_week_v1.py
          pytest -q tests/test_player_target_share_trajectory_future_week_v1.py

      - name: Certify no Week-6 trajectory lock was created
        run: |
          test ! -e /tmp/player_target_share_trajectory_shadow_week6_lock.csv
          echo "FUTURE_WEEK_TARGET_SHARE_TRAJECTORY_MECHANICS_ONLY_CERTIFIED"

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
