name: RB R27D0C xYAC Mechanism Split

on:
  push:
    branches:
      - research-rb-r27d0c-xyac-mechanism-split
    paths:
      - 'docs/research/RB_R27D0C_XYAC_MECHANISM_SPLIT_IMPLEMENTATION_LOCK.md'
      - 'docs/research/RB_R27D0C_RUN1_XYAC_OBSERVATION_SET_REPAIR_LOCK.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRODUCTION_BASE_SHA: bb76ba9eabb08e2f0875a9af49301c3877f4141f
  PLAN_BLOB: 6a01722bd0291805a44d6be37dec1e228c3adbd0
  SCRIPT_BLOB: 8428aa5cfe675efcf3c366a48e80d705ffdf5aea
  R27B_PARENT_RUN: '34428917229'
  R27B_PARENT_ARTIFACT_ID: '10134023092'
  R27B_PARENT_ARTIFACT_NAME: rb-r27b-v2-novel-efficiency-context
  R27B_PARENT_DIGEST: sha256:1df1a14c9900b890fe86e04269849dc90d76fc03a9215ad8612c1820dee5341f

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy
      - name: Verify frozen diagnostic and production boundary
        run: |
          set -euo pipefail
          test "$(git hash-object docs/research/RB_R27D0C_XYAC_MECHANISM_SPLIT_FROZEN_PLAN.md)" = "$PLAN_BLOB"
          test "$(git hash-object scripts/backtest/forensic_rb_r27d0c_xyac_mechanism_split.py)" = "$SCRIPT_BLOB"
          python -m py_compile scripts/backtest/forensic_rb_r27d0c_xyac_mechanism_split.py
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- scripts/modeling scripts/simulation_v2.py scripts/simulation_c2_qb_candidate.py data/models model .github/workflows/full-slate.yml
          echo R27D0C_FROZEN_BOUNDARY_PASS
      - name: Verify and stage exact V2 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R27B_PARENT_ARTIFACT_ID}" --jq .digest)"
          test "$D" = "$R27B_PARENT_DIGEST"
          rm -rf data/r27d0c_parent && mkdir -p data/r27d0c_parent
          gh run download "$R27B_PARENT_RUN" --repo "$GITHUB_REPOSITORY" --name "$R27B_PARENT_ARTIFACT_NAME" --dir data/r27d0c_parent
          test -s data/r27d0c_parent/data/backtests/r27b_v2_final/r27b_v2_all_predictions.csv
      - name: Run frozen xYAC mechanism split
        run: |
          rm -rf data/backtests/r27d0c_xyac_mechanism_split
          PYTHONPATH=. python scripts/backtest/forensic_rb_r27d0c_xyac_mechanism_split.py \
            --predictions data/r27d0c_parent/data/backtests/r27b_v2_final/r27b_v2_all_predictions.csv \
            --out-dir data/backtests/r27d0c_xyac_mechanism_split
      - name: Assert diagnostic integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/backtests/r27d0c_xyac_mechanism_split/r27d0c_summary.json').read_text())
          assert d['integrity_pass'] is True, d
          assert d['new_model_fit'] is False and d['new_candidate_created'] is False
          assert d['sportsbook_inputs']==0
          assert d['production_changed'] is False and d['r26_changed'] is False and d['r22_changed'] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          cat data/backtests/r27d0c_xyac_mechanism_split/r27d0c_xyac_distributions.csv
      - name: Upload immutable R27D0C evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r27d0c-xyac-mechanism-split
          retention-days: 90
          path: data/backtests/r27d0c_xyac_mechanism_split/*
