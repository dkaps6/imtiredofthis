name: Migration 78 QB Official Inactive Availability

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/audit_qb_official_inactive_availability.py'
      - 'data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv'
      - '.github/workflows/backtest-qb-official-inactive-availability.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'backtest-migration-78-qb-official-inactive-availability'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow requests beautifulsoup4

      - name: Frozen M78 scope
        run: |
          echo 'M78 is SOURCE/DATA-CONTRACT ONLY. It fits zero predictive models.'
          echo 'New information: official game-day inactive identity, a fixed pre-kickoff fact.'
          echo 'Historical reconstruction: archived NFL.com official inactive reports for 2024 and 2025.'
          echo 'Future 2026 use: snapshot the live NFL Inactives endpoint before kickoff.'
          echo 'No sportsbook data. No target-game performance. No article timestamp as a predictor.'
          echo 'M77 depth-chart discontinuity remains rejected; M78 does not remix M77 features.'
          echo 'M79 is authorized only if BOTH seasons reach >=90% canonical team-week coverage, >=90% roster identity bridge, >=95% listed-position parsing, >=17 regular weeks discovered, >=18 official inactive articles, and the live 2026 endpoint is reachable.'

      - name: Verify frozen canonical v3
        run: |
          set -euo pipefail
          CANON=data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv
          test -s "$CANON"
          echo "c4a481a760657bb7516d52b9aa9ba84af096063a4e78660b12a541f59fd7b742  $CANON" | sha256sum -c -

      - name: Compile M78
        run: python -m py_compile scripts/backtest/audit_qb_official_inactive_availability.py

      - name: Run M78 source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/audit_qb_official_inactive_availability.py \
            --canonical data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv \
            --out-dir data/backtests/qb_m78

      - name: Print M78 outputs
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_m78/m78_interpretation.csv 2>/dev/null || true
          echo '--- source gate ---'
          cat data/backtests/qb_m78/m78_source_gate.csv 2>/dev/null || true
          echo '--- contract ---'
          cat data/backtests/qb_m78/m78_contract.json 2>/dev/null || true
          echo '--- no-retest ledger ---'
          cat data/backtests/qb_m78/m78_no_retest_ledger.csv 2>/dev/null || true

      - name: Upload M78 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-78-qb-official-inactive-availability
          path: data/backtests/qb_m78/*
          if-no-files-found: warn
          retention-days: 14
