name: Migration 63 QB Directional Game Regimes

on:
  workflow_dispatch:
    inputs:
      iterations: {description: "MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main, backtest-migration-62-qb-extreme-error-regime-audit]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-63-qb-directional-game-regimes'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib pyarrow

      - name: Declare Migration 63 frozen scope and gates
        run: |
          echo "Migration 63 is DIAGNOSTIC ONLY. No production football projection changes."
          echo "Reference attempts model: canonical attempts_raw_only from Migration 59."
          echo "2024 development/training; 2025 prospective test. Consumed 2023 holdout is NOT rescored; 2022 is not a target test."
          echo "HIGH-volume surprise is frozen as actual_pass_attempts - attempts_raw >= +8."
          echo "LOW-volume surprise is frozen as actual_pass_attempts - attempts_raw <= -8."
          echo "Outcome labels and actual attempt deltas are NEVER prospective features."
          echo "Logistic and histogram-GB classifiers are predeclared and evaluated independently; 2025 cannot select the winner."
          echo "Per-model actionable gate: 2025 ROC AUC >= .60; bootstrap 95% AUC lower bound > .50; highest-risk quintile target rate >= 1.5x 2025 base; Q5-vs-Q1 mean attempt delta separates >=4 attempts in the target direction."
          echo "Passing-tail bridge is diagnostic: corresponding 100+ passing-yard tail in Q5 >= 1.25x its 2025 base rate."
          echo "A replicated directional feature requires same target-direction in 2024 and 2025 and combined diagnostic AUC >= .58."
          echo "M63 cannot promote a production model. A passing directional classifier only makes a mixture-of-regimes prototype eligible for the next migration."
          echo "Known-invalid M62 coaching-change/tenure fields remain excluded pending correct cross-season reconstruction."

      - name: Compile M63 module
        run: python -m py_compile scripts/backtest/finalize_qb_directional_game_regimes.py

      - name: Build canonical Raw-Attempts errors and pregame regimes
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_directional_regimes/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/diagnose_qb_raw_tail_attribution_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m59"

            python scripts/backtest/audit_qb_extreme_error_regimes.py \
              --season "$SEASON" \
              --game-attribution "$D/m59/m59_game_attribution_${SEASON}.csv" \
              --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" \
              --out-dir "$D/m62"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Run prospective directional-regime validation
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/finalize_qb_directional_game_regimes.py \
            --season-file data/backtests/qb_directional_regimes/2024/m62/m62_enriched_games_2024.csv \
            --season-file data/backtests/qb_directional_regimes/2025/m62/m62_enriched_games_2025.csv \
            --manifest-file data/backtests/qb_directional_regimes/2024/m62/m62_safe_feature_manifest_2024.csv \
            --manifest-file data/backtests/qb_directional_regimes/2025/m62/m62_safe_feature_manifest_2025.csv \
            --out-dir data/backtests/qb_directional_regimes/summary

      - name: Show Migration 63 results
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_directional_regimes/summary/m63_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- model verdicts ---'
          cat data/backtests/qb_directional_regimes/summary/m63_precommitted_model_verdicts.csv 2>/dev/null || true
          echo '--- classifier metrics ---'
          cat data/backtests/qb_directional_regimes/summary/m63_2024_to_2025_classifier_metrics.csv 2>/dev/null || true
          echo '--- regime base rates ---'
          cat data/backtests/qb_directional_regimes/summary/m63_regime_base_rates.csv 2>/dev/null || true
          echo '--- directional quintiles ---'
          cat data/backtests/qb_directional_regimes/summary/m63_2025_directional_quintiles.csv 2>/dev/null || true
          echo '--- replicated directional features ---'
          cat data/backtests/qb_directional_regimes/summary/m63_replicated_directional_features.csv 2>/dev/null || true

      - name: Upload Migration 63 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-63-qb-directional-game-regimes
          path: |
            data/backtests/qb_directional_regimes/summary/*.csv
            data/backtests/qb_directional_regimes/2024/m62/*.csv
            data/backtests/qb_directional_regimes/2025/m62/*.csv
            data/backtests/qb_directional_regimes/2024/m59/m59_game_attribution_2024.csv
            data/backtests/qb_directional_regimes/2025/m59/m59_game_attribution_2025.csv
            data/backtests/qb_directional_regimes/2024/historical_input_validation.csv
            data/backtests/qb_directional_regimes/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
