name: Research Player High Value Opportunity Persistence V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_V1_FREEZE.md"
      - "scripts/research/evaluate_player_high_value_opportunity_persistence_v1.py"
      - "tests/test_player_high_value_opportunity_persistence_v1.py"
      - ".github/workflows/research-player-high-value-opportunity-persistence-v1.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow nflreadpy

      - name: Frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_player_high_value_opportunity_persistence_v1.py
          pytest -q tests/test_player_high_value_opportunity_persistence_v1.py

      - name: Download exact source-ready parent
        uses: actions/download-artifact@v4
        with:
          name: player-high-value-opportunity-source-audit-v1-38848080453
          path: /tmp/high_value_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38848080453

      - name: Verify exact parent
        run: |
          set -euo pipefail
          ROWS="$(find /tmp/high_value_source -type f -name 'high_value_opportunity_playerweeks.csv' -print -quit)"
          RESULT="$(find /tmp/high_value_source -type f -name 'high_value_opportunity_source_result.json' -print -quit)"
          test -n "$ROWS" && test -s "$ROWS"
          test -n "$RESULT" && test -s "$RESULT"
          python - "$RESULT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['version']=='PLAYER_HIGH_VALUE_SCORING_OPPORTUNITY_IDENTITY_V1_SOURCE_AUDIT',p
          assert p['disposition']=='PLAYER_HIGH_VALUE_SCORING_OPPORTUNITY_SOURCE_READY',p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['predictive_models_fit']==0,p
          assert p['production_changed'] is False,p
          print('HIGH_VALUE_OPPORTUNITY_SOURCE_PARENT_VERIFIED')
          PY
          echo "PLAYERWEEKS=$ROWS" >> "$GITHUB_ENV"

      - name: Evaluate frozen named-player persistence
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/high_value_persistence
          mkdir -p /tmp/high_value_persistence
          python scripts/research/evaluate_player_high_value_opportunity_persistence_v1.py             --playerweeks "$PLAYERWEEKS"             --out-dir /tmp/high_value_persistence

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/high_value_persistence/high_value_opportunity_persistence_result.json'))
          assert p['version']=='PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_V1',p
          assert p['disposition'] in {
            'PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_ALL_QUALIFIED',
            'PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_PARTIAL',
            'PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_CLOSED',
          },p
          assert set(p['channels'])=={'RB_RUSH','RB_RECEIVING','WR_RECEIVING','TE_RECEIVING'},p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['predictive_models_fit']==0,p
          assert p['production_changed'] is False,p
          print('PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_V1_BOUNDARY_PASS')
          PY

      - name: Show result
        if: always()
        run: |
          cat /tmp/high_value_persistence/high_value_opportunity_persistence_result.json 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-high-value-opportunity-persistence-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/high_value_persistence/**
            docs/research/PLAYER_HIGH_VALUE_OPPORTUNITY_PERSISTENCE_V1_FREEZE.md
