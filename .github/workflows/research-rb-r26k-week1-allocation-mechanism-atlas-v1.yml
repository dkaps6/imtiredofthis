name: RB R26K Week 1 Allocation Mechanism Atlas V1

on:
  push:
    branches:
      - research-rb-r26k-week1-allocation-mechanism-atlas-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PRODUCTION_BASE_SHA: f8417f55b04ce0e19baf260e9d532765034c47f1
  R26_RUN_ID: '34356222339'
  R26_ARTIFACT_ID: '10106271075'
  R26_ARTIFACT_NAME: rb-r26-vacancy-gated-r9-retrospective-v1
  R26_DIGEST: sha256:607fca6e11c301ecb2a3bf74e3dfea8ae415bb33cf3c150a6d89eaedada2809e
  R26J_RUN_ID: '34374987828'
  R26J_ARTIFACT_ID: '10113466373'
  R26J_ARTIFACT_NAME: rb-r26j-2020-week1-comparability-source-audit-v1
  R26J_DIGEST: sha256:7d886f228487e052ee1617cc5f42b974cd9da6a9d448f3a86b1de82cb4fc4f46

jobs:
  mechanism-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4

      - name: Verify frozen R26K contract and production boundary
        run: |
          set -euo pipefail
          test -s docs/research/RB_R26K_WEEK1_ALLOCATION_MECHANISM_ATLAS_V1_FROZEN_PLAN.md
          test -s docs/research/RB_R26K_WEEK1_ALLOCATION_MECHANISM_ATLAS_V1_IMPLEMENTATION_LOCK.md
          test -s scripts/backtest/audit_rb_r26k_week1_allocation_mechanism_atlas_v1.py
          python -m py_compile scripts/backtest/audit_rb_r26k_week1_allocation_mechanism_atlas_v1.py
          sha256sum docs/research/RB_R26K_WEEK1_ALLOCATION_MECHANISM_ATLAS_V1_FROZEN_PLAN.md | tee r26k_plan.sha256
          sha256sum docs/research/RB_R26K_WEEK1_ALLOCATION_MECHANISM_ATLAS_V1_IMPLEMENTATION_LOCK.md | tee r26k_lock.sha256
          sha256sum scripts/backtest/audit_rb_r26k_week1_allocation_mechanism_atlas_v1.py | tee r26k_code.sha256
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml \
            .github/workflows/production-week1-v4-r22-certification.yml
          echo PASS > r26k_protected_clean.txt
          echo R26K_PROTECTED_PRODUCTION_BOUNDARY_PASS

      - name: Verify and download immutable parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R26_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26_ARTIFACT_ID}" --jq '.digest')"
          R26J_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26J_ARTIFACT_ID}" --jq '.digest')"
          test "$R26_ACTUAL" = "$R26_DIGEST"
          test "$R26J_ACTUAL" = "$R26J_DIGEST"
          rm -rf parent_r26 parent_r26j
          mkdir -p parent_r26 parent_r26j
          gh run download "$R26_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26_ARTIFACT_NAME" --dir parent_r26
          gh run download "$R26J_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26J_ARTIFACT_NAME" --dir parent_r26j
          test "$(find parent_r26 -name r26_predictions.csv -type f | wc -l)" -eq 6
          test "$(find parent_r26j -name r26j_source_disposition.json -type f | wc -l)" -eq 1
          test "$(find parent_r26j -name r26j_week1_vacancy_room_source_state.csv -type f | wc -l)" -eq 1
          echo "R26K_IMMUTABLE_PARENTS_PASS r26=$R26_ACTUAL r26j=$R26J_ACTUAL"

      - name: Execute frozen R26K mechanism atlas
        run: |
          set -euo pipefail
          rm -rf data/backtests/r26k_week1_allocation_mechanism_atlas_v1
          python scripts/backtest/audit_rb_r26k_week1_allocation_mechanism_atlas_v1.py \
            --r26-root parent_r26 \
            --r26j-root parent_r26j \
            --protected-clean-marker r26k_protected_clean.txt \
            --out-dir data/backtests/r26k_week1_allocation_mechanism_atlas_v1

      - name: Assert diagnostic authority contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/backtests/r26k_week1_allocation_mechanism_atlas_v1/r26k_disposition.json')
          d=json.loads(p.read_text())
          assert d['all_integrity_gates_pass'] is True
          assert d['disposition'] in {
              'REPLICATED_ALLOCATION_FAILURE_MECHANISM_IDENTIFIED',
              '2020_SPECIFIC_MECHANISM_NO_REPLICATED_ROUTER',
              'NO_COHERENT_MECHANISM_IDENTIFIED',
          }
          assert d['prospective_shadow_authorized'] is False
          assert d['production_promotion_authorized'] is False
          assert d['exclude_2020_authorized'] is False
          assert d['r9_refit'] is False
          assert d['predictions_regenerated'] is False
          assert d['production_parameters_changed'] is False
          assert d['receiving_yard_means_changed'] is False
          assert d['r22_changed'] is False
          assert d['sportsbook_inputs_added'] == 0
          print('R26K_DIAGNOSTIC_CONTRACT_PASS disposition=' + d['disposition'])
          PY

      - name: Show R26K result
        run: |
          cat data/backtests/r26k_week1_allocation_mechanism_atlas_v1/r26k_disposition.json
          echo '=== primary state summary ==='
          cat data/backtests/r26k_week1_allocation_mechanism_atlas_v1/r26k_primary_state_summary.csv

      - name: Upload R26K evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r26k-week1-allocation-mechanism-atlas-v1
          retention-days: 90
          path: |
            r26k_plan.sha256
            r26k_lock.sha256
            r26k_code.sha256
            r26k_protected_clean.txt
            data/backtests/r26k_week1_allocation_mechanism_atlas_v1/*
