name: Research PRISM Injury Partial Receiving Exposure Decomposition V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_INJURY_PARTIAL_RECEIVING_EXPOSURE_DECOMPOSITION_V1_FREEZE.md'
      - 'scripts/research/evaluate_prism_injury_partial_receiving_exposure_decomposition_v1.py'
      - 'tests/test_prism_injury_partial_receiving_exposure_decomposition_v1.py'
      - '.github/workflows/research-prism-injury-partial-receiving-exposure-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "653eb5e4e46a49f0b575c119259d2b11eb845380"

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_INJURY_PARTIAL_RECEIVING_EXPOSURE_DECOMPOSITION_V1_FREEZE.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/evaluate_prism_injury_partial_receiving_exposure_decomposition_v1.py" 2>/dev/null; then
            echo "ERROR: scorer existed at freeze"
            exit 1
          fi

      - name: Verify immutable source authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run=39161711741
          aid=12149181200
          name='prism-receiving-opportunity-earning-participation-exposure-v1-source-39161711741'
          digest='sha256:6cae427b667db4a120a1308747d00b82b6770fe0adbc46d3efc68fce3e1db240'
          repo=os.environ['GITHUB_REPOSITORY']
          payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))
          arts={int(a['id']):a for a in payload.get('artifacts',[])}
          a=arts.get(aid)
          assert a is not None,(run,aid)
          assert not a.get('expired'),a
          assert a.get('name')==name,a
          assert a.get('digest')==digest,a
          print('SOURCE_VERIFIED',run,aid,name,digest)
          PY

      - name: Download immutable source panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-injury-partial-exposure
          mkdir -p /tmp/prism-injury-partial-exposure/{source,out}
          gh run download 39161711741 --repo "${{ github.repository }}" \
            --name prism-receiving-opportunity-earning-participation-exposure-v1-source-39161711741 \
            --dir /tmp/prism-injury-partial-exposure/source
          test -s /tmp/prism-injury-partial-exposure/source/receiving_opportunity_earning_participation_exposure_rows.csv

      - name: Compile and run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_prism_injury_partial_receiving_exposure_decomposition_v1.py
          pytest -q tests/test_prism_injury_partial_receiving_exposure_decomposition_v1.py

      - name: Execute frozen named-player decomposition
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_prism_injury_partial_receiving_exposure_decomposition_v1.py \
            --source /tmp/prism-injury-partial-exposure/source/receiving_opportunity_earning_participation_exposure_rows.csv \
            --out-dir /tmp/prism-injury-partial-exposure/out

      - name: Certify frozen contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p=json.load(open('/tmp/prism-injury-partial-exposure/out/injury_partial_receiving_exposure_decomposition_result.json'))
          rows=pd.read_csv('/tmp/prism-injury-partial-exposure/out/injury_partial_receiving_exposure_decomposition_rows.csv')
          assert p['version']=='PRISM_INJURY_PARTIAL_RECEIVING_EXPOSURE_DECOMPOSITION_V1',p
          assert p['freeze_commit']=='653eb5e4e46a49f0b575c119259d2b11eb845380',p
          assert p['source_run']==39161711741,p
          assert p['source_artifact']==12149181200,p
          assert p['source_digest']=='sha256:6cae427b667db4a120a1308747d00b82b6770fe0adbc46d3efc68fce3e1db240',p
          assert p['disposition'] in {
              'PRISM_INJURY_PARTIAL_RECEIVING_EXPOSURE_DECOMPOSITION_V1_QUALIFIED',
              'PRISM_INJURY_PARTIAL_RECEIVING_EXPOSURE_DECOMPOSITION_V1_CLOSED',
          },p
          assert p['prior_window']==4,p
          assert p['minimum_comparable_rows']==3,p
          assert p['routes_inferred_from_snaps'] is False,p
          assert p['audit']['chronology_violations']==0,p
          assert len(rows)>0
          assert rows['prior_window_rows'].eq(4).all()
          assert rows['prior_comparable_rows'].ge(3).all()
          assert rows['prior_injury_partial_rows'].ge(1).all()
          assert rows['candidate_target_share'].between(0,1).all()
          assert p['coefficients_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          p=json.load(open('/tmp/prism-injury-partial-exposure/out/injury_partial_receiving_exposure_decomposition_result.json'))
          print("### PRISM injury-partial receiving exposure decomposition V1")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for label in ('development_2024','confirmation_2025'):
              s=p[label]
              print()
              print(f"**{s['season']} affected named players**")
              print(f"- target games={s['target_games']}; named players={s['named_players']}")
              print(f"- equal-player closeness gain={s['equal_player_average_closeness_gain']:+.6f}; median={s['median_player_gain']:+.6f}")
              print(f"- improved/tied/worsened={s['improved_player_share']:.2%}/{s['tied_player_share']:.2%}/{s['worsened_player_share']:.2%}")
              print(f"- p10/p25/p75/p90={s['p10_player_gain']:+.6f}/{s['p25_player_gain']:+.6f}/{s['p75_player_gain']:+.6f}/{s['p90_player_gain']:+.6f}")
              print(f"- candidate clipped rows={s['candidate_clipped_rows']}")
              if 'player_bootstrap' in s:
                  b=s['player_bootstrap']
                  print(f"- player-bootstrap 95% CI=[{b['ci_low']:+.6f},{b['ci_high']:+.6f}]")
              for fam in s['family_diagnostics']:
                  print(f"  - {fam['family']}: games={fam['target_games']} players={fam['named_players']} equal-player={fam['equal_player_average_closeness_gain']:+.6f} improved/worsened={fam['improved_player_share']:.2%}/{fam['worsened_player_share']:.2%}")
          failed=[k for k,v in p['gates'].items() if not v]
          print()
          print(f"- failed gates: {failed or ['NONE']}")
          print()
          print("Primary object is the affected named player. The formula separates ordinary participation exposure from target earning during actual participation; snaps are not routes. No 2026 outcomes, sportsbook/OddsAPI, fitted coefficient/threshold, or production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload immutable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-injury-partial-receiving-exposure-decomposition-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-injury-partial-exposure/out/**
