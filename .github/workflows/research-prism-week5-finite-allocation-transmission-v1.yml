name: Research PRISM Week5 Finite Allocation Transmission V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/audit_prism_week5_finite_allocation_transmission_v1.py'
      - '.github/workflows/research-prism-week5-finite-allocation-transmission-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Verify immutable diagnostic authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11524296325 --jq '.workflow_run.id')" = "37717016519"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11524296325 --jq '.digest')" = "sha256:e043133d4b9a48ce472dde8810d4d77d636f4ce2fbcee14708b23fe0ea35f6a0"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11812403368 --jq '.workflow_run.id')" = "38397361891"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11812403368 --jq '.digest')" = "sha256:4cdef29912f35368473d57e15b38efdc3dd0f75e897bbbdc3b97fe1ff8f67670"

      - name: Download preserved Week5 authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-w5-finite
          mkdir -p /tmp/prism-w5-finite/{state,casebook,out}
          gh run download 37717016519 --repo "${{ github.repository }}" --name player-landscape-transmission-audit-v1-37717016519 --dir /tmp/prism-w5-finite/state
          gh run download 38397361891 --repo "${{ github.repository }}" --name week5-player-failure-casebook-v1-38397361891 --dir /tmp/prism-w5-finite/casebook
          test -s /tmp/prism-w5-finite/state/player_landscape_week5_player_state.csv
          test -s /tmp/prism-w5-finite/casebook/week5_player_failure_casebook_v1_rows.csv

      - name: Execute deterministic finite-allocation audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/audit_prism_week5_finite_allocation_transmission_v1.py
          python scripts/research/audit_prism_week5_finite_allocation_transmission_v1.py             --player-state /tmp/prism-w5-finite/state/player_landscape_week5_player_state.csv             --casebook /tmp/prism-w5-finite/casebook/week5_player_failure_casebook_v1_rows.csv             --out-dir /tmp/prism-w5-finite/out

      - name: Certify no-fit architecture result
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p='/tmp/prism-w5-finite/out/prism_week5_finite_allocation_transmission_result.json'
          r=json.load(open(p))
          assert r['version']=='PRISM_WEEK5_FINITE_ALLOCATION_TRANSMISSION_V1_AUDIT',r
          assert r['disposition']=='PRISM_WEEK5_FINITE_ALLOCATION_TRANSMISSION_AUDIT_COMPLETE__ARCHITECTURE_GAP_CONFIRMED__NO_MODEL_CHANGE',r
          assert r['preserved_state_team_rooms']==30,r
          assert r['preserved_state_player_rows']==467,r
          assert r['target_rooms_global_cap_applied']==30,r
          assert r['target_rooms_global_cap_rate']==1.0,r
          assert r['rush_rooms_global_cap_applied']==30,r
          assert r['rush_rooms_global_cap_rate']==1.0,r
          assert r['exact_casebook_clean_nonwr_target_identities']==6,r
          assert r['exact_casebook_clean_nonwr_target_compressed']==6,r
          assert r['exact_casebook_clean_rush_identities']==10,r
          assert r['exact_casebook_clean_rush_compressed']==9,r
          assert abs(r['bowers_rules_tgt_share']-0.27766642611) < 1e-9,r
          assert abs(r['bowers_final_target_probability']-0.206264830495) < 1e-9,r
          assert abs(r['bowers_implied_team_target_mass_before_global_cap']-1.278856430209) < 1e-9,r
          assert r['stage2_transport_week4_5_status'].startswith('SOURCE_BLOCKED_'),r
          assert r['qualified_stage2_cells_preserved']==['RB_RUSHING','RB_RECEIVING','TE_RECEIVING'],r
          assert r['qb_stage2_status']=='CLOSED',r
          assert r['wr_stage2_status']=='SOURCE_BLOCKED_NOT_SCORED',r
          assert r['raw_recent_share_replacement_reopened'] is False,r
          assert r['new_model_fit']==0,r
          assert r['threshold_searches']==0,r
          assert r['sportsbook_inputs_used']==0,r
          assert r['oddsapi_calls']==0,r
          assert r['week6_outcomes_used']==0,r
          assert r['week6_locks_changed'] is False,r
          assert r['production_changed'] is False,r
          cert={
            'version':'PRISM_WEEK5_FINITE_ALLOCATION_TRANSMISSION_V1_CERT',
            'status':'PRISM_WEEK5_FINITE_ALLOCATION_TRANSMISSION_REPRODUCED',
            'exact_head':os.environ['HEAD_SHA'],
            'run_id':int(os.environ['RUN_ID']),
            'result':r,
          }
          open('/tmp/prism-w5-finite/out/audit_certificate.json','w').write(
              json.dumps(cert,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(cert,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 535 --repo "${{ github.repository }}" --body "PRISM Week-5 finite-allocation transmission audit completed at exact head ${{ github.sha }} (run ${{ github.run_id }}). Preserved player-state snapshot: 30/30 team target rooms exceeded the 0.95 finite-pool cap; raw target mass mean 1.5052 (range 1.2409-1.7392), so downstream proportional target scaling averaged 0.6352. After retaining only the top five rushing shares, 30/30 rooms still exceeded 0.95; retained rush mass mean 1.2682 and scaling averaged 0.7614. Exact frozen casebook validation: Brock Bowers rules target share 0.277666 -> final target probability 0.206265, clean TE path scale 0.742851, implying 1.278856 modeled team target mass before the global cap. This confirms a finite-opportunity transmission/coherence gap: independently estimated player shares can overbook the same team pool and force accurate named-player role knowledge downward. The cap itself is a conservation safeguard, not the proposed fix. W4/W5 replay of the later-qualified Stage-2 mechanism remains SOURCE_BLOCKED because exact original pregame q/availability artifacts expired; no approximation used. No fit, no threshold search, no sportsbook/OddsAPI, no Week-6 outcomes or lock changes, no production mutation."

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-week5-finite-allocation-transmission-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-w5-finite/out/**
