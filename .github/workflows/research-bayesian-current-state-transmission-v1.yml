name: Research Bayesian Current-State Transmission V1

on:
  push:
    branches:
      - research-bayesian-current-state-transmission-v1
    paths:
      - 'docs/research/BAYESIAN_CURRENT_STATE_TRANSMISSION_V1_PLAN.md'
      - 'scripts/research/audit_bayesian_current_state_transmission_v1.py'
      - 'tests/test_bayesian_current_state_transmission_v1.py'
      - '.github/workflows/research-bayesian-current-state-transmission-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy pytest

      - name: Run frozen-contract unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_bayesian_current_state_transmission_v1.py

      - name: Run frozen Bayesian transmission audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/research/bayesian_current_state_transmission_v1
          python scripts/research/audit_bayesian_current_state_transmission_v1.py \
            --out-dir data/research/bayesian_current_state_transmission_v1

      - name: Display result
        if: always()
        run: |
          test -s data/research/bayesian_current_state_transmission_v1/bayesian_current_state_transmission_result.json || true
          cat data/research/bayesian_current_state_transmission_v1/bayesian_current_state_transmission_result.json || true
          echo
          cat data/research/bayesian_current_state_transmission_v1/bayesian_current_state_transmission_summary.csv || true

      - name: Upload frozen audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayesian-current-state-transmission-v1
          retention-days: 30
          path: |
            data/research/bayesian_current_state_transmission_v1/
