# scratch: verify the QB C2/WR-R15 coverage-floor fix against tonight's real
# just-completed live run (34775307362), no re-fetch / no OddsAPI credits.
name: Scratch Replay QB C2 WR-R15 Coverage Floor Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-replay-qb-c2-wr-r15-floor.yml'

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: ""
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nflreadpy pyyaml beautifulsoup4 lxml pytest
      - name: Download real props/context data from tonight's real run 34775307362 (no re-fetch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 34775307362 --repo "$GITHUB_REPOSITORY" --name run_34775307362 --dir artifact
          cp -rv artifact/data/. data/
          cp -rv artifact/outputs/. outputs/
      - name: Apply certified availability-aware current-output coverage seams
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python -m py_compile scripts/run_pricing_with_full_roster_universe_v1.py scripts/modeling/rb_r26_receptions_production_adapter_v1.py scripts/modeling/qb_c2_production_adapter_v1.py
      - name: Price from certified football-first Full Slate stack (replay, no live fetch)
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          python - <<'EOF'
          import json, pandas as pd
          from scripts.utils.eligible_team_set_v1 import expected_current_teams
          expected=len(expected_current_teams() or [])
          q=json.load(open('data/qb_c2_production_integration_audit.json',encoding='utf-8'))
          w=json.load(open('data/wr_r15_full_slate_entitlement_audit.json',encoding='utf-8'))
          if q.get('disposition') != 'QB_C2_PRODUCTION_DISTRIBUTION_INTEGRATION_PASS': raise SystemExit(f"FATAL: QB C2 production integration not certified: {q.get('disposition')}")
          if int(q.get('football_qb_rows',0)) < expected or int(q.get('selected_qb_rows',0)) <= 0: raise SystemExit(f"FATAL: QB C2 current-output coverage invalid expected>={expected}: {q}")
          if int(w.get('current_wr1_anchor_rows',0)) < expected: raise SystemExit(f'FATAL: WR-R15 anchor coverage expected>={expected}')
          print(f"QB_C2_WR_R15_COVERAGE_FLOOR_PASS expected={expected} football_qb_rows={q.get('football_qb_rows')} current_wr1_anchor_rows={w.get('current_wr1_anchor_rows')}")
          EOF
      - name: Apply final-board-only verified prop quarantines
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/quarantine_final_priced_props_v1.py
          test -s data/final_priced_props_quarantine_status.json
      - name: Strict repository audits
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict
      - name: Priced output summary
        run: |
          python3 -c "
          import pandas as pd
          df = pd.read_csv('outputs/props_priced_clean.csv')
          print('rows:', len(df))
          print('teams:', sorted(df['team'].dropna().astype(str).unique()) if 'team' in df.columns else 'n/a')
          print('players:', df['player'].nunique() if 'player' in df.columns else 'n/a')
          "
