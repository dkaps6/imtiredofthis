name: Rush Pool Evidence Guard V1 Full Stack

on:
  push:
    branches:
      - integrate-rush-pool-evidence-guard-v1
    paths:
      - ".github/workflows/research-rush-pool-evidence-guard-v1-full-stack.yml"
      - "scripts/modeling/rush_pool_evidence_guard_v1.py"
      - "scripts/simulation_v2.py"
      - "scripts/simulation_c2_qb_candidate.py"
      - "scripts/research/evaluate_rush_pool_evidence_guard_v1_full_stack.py"
      - "tests/test_rush_pool_evidence_guard_v1_integration.py"
      - "docs/production/RUSH_POOL_EVIDENCE_GUARD_V1_INTEGRATION_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rush-pool-evidence-guard-v1-full-stack
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow scikit-learn joblib

      - name: Verify integration mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/modeling/rush_pool_evidence_guard_v1.py
          python -m py_compile scripts/simulation_v2.py
          python -m py_compile scripts/simulation_c2_qb_candidate.py
          python -m py_compile scripts/research/evaluate_rush_pool_evidence_guard_v1_full_stack.py
          pytest -q tests/test_rush_pool_evidence_guard_v1_integration.py

      - name: Create workspace
        run: |
          rm -rf /tmp/rush_guard /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model
          mkdir -p /tmp/rush_guard /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model

      - name: Download WR-R15 fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: /tmp/wr_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34238301577

      - name: Download TE-R5P production-contract OOS authority
        uses: actions/download-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: /tmp/te_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34152797603

      - name: Verify frozen specialist authority
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          wr_root=Path('/tmp/wr_model/backtests/wr_r15_wr1_anchor_v1')
          te_root=Path('/tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1')
          wr=pd.read_csv(wr_root/'wr_r15_fold_coefficients.csv')
          te=pd.read_csv(te_root/'te_r5p_coefficients.csv')
          wr_result=json.loads((wr_root/'wr_r15_result.json').read_text())
          te_result=json.loads((te_root/'te_r5p_result.json').read_text())
          if sorted(wr['test_season'].astype(int).unique().tolist()) != [2023,2024]:
              raise RuntimeError('WR-R15 fold authority drifted')
          if sorted(te['test_season'].astype(int).unique().tolist()) != [2023,2024,2025]:
              raise RuntimeError('TE-R5P fold authority drifted')
          if not bool(wr_result.get('design_motivated_by_2025_but_2025_confirmation_forbidden')):
              raise RuntimeError('WR-R15 2025 exclusion contract missing')
          if te_result.get('disposition') != 'TE_R5P_PRODUCTION_CONTRACT_REFIT_ELIGIBLE':
              raise RuntimeError('TE-R5P authority is not eligible')
          print('specialist authority PASS')
          PY

      - name: Build independent historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py             --season 2024 --prior-season 2023 --weeks "1-18" --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py             --season 2025 --prior-season 2024 --weeks "1-18" --out-dir /tmp/hist_2025

      - name: Combine historical schedule and team state
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/rush_guard')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([
                  pd.read_csv('/tmp/hist_2024/'+name),
                  pd.read_csv('/tmp/hist_2025/'+name),
              ],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined rows in {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build canonical historical player/injury/weather inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py             --seasons 2023,2024,2025             --schedule /tmp/rush_guard/schedule_history.csv             --out /tmp/rush_guard/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py             --seasons 2023,2024,2025             --out /tmp/rush_guard/injuries_history.csv
          python scripts/backtest/build_historical_weather.py             --schedule /tmp/rush_guard/schedule_history.csv             --out /tmp/rush_guard/weather_history.csv

      - name: Run frozen full-stack A/B
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_rush_pool_evidence_guard_v1_full_stack.py             --player-logs /tmp/rush_guard/player_game_logs_history.csv             --team-weekly /tmp/rush_guard/team_weekly_history.csv             --schedule /tmp/rush_guard/schedule_history.csv             --universe-2024 /tmp/hist_2024/pregame_universe             --universe-2025 /tmp/hist_2025/pregame_universe             --injuries /tmp/rush_guard/injuries_history.csv             --weather /tmp/rush_guard/weather_history.csv             --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv             --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv             --weights data/model_ensemble_weights.csv             --weeks "1-18"             --iterations 2000             --out-dir /tmp/rush_guard/result
          cat /tmp/rush_guard/result/RESULT.md

      - name: Upload frozen integration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rush-pool-evidence-guard-v1-full-stack
          path: |
            /tmp/rush_guard/result/**
          if-no-files-found: warn
          retention-days: 30
