name: Research RB Individual Run Location Matchup Source V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/RB_INDIVIDUAL_RUN_LOCATION_MATCHUP_SOURCE_V1_PLAN.md'
      - 'scripts/research/audit_rb_individual_run_location_matchup_source_v1.py'
      - 'tests/test_rb_individual_run_location_matchup_source_v1.py'
      - '.github/workflows/research-rb-individual-run-location-matchup-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml

      - name: Compile and test frozen source mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_rb_individual_run_location_matchup_source_v1.py
          pytest -q tests/test_rb_individual_run_location_matchup_source_v1.py

      - name: Run frozen RB individual run-location source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/rb-run-location-source-v1
          python scripts/research/audit_rb_individual_run_location_matchup_source_v1.py             --out-dir /tmp/rb-run-location-source-v1

      - name: Certify source-only result contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rb-run-location-source-v1/rb_individual_run_location_matchup_source_v1_result.json'))
          assert p['version']=='RB_INDIVIDUAL_RUN_LOCATION_MATCHUP_SOURCE_V1',p
          assert p['target_seasons']==[2024,2025],p
          assert p['target_weeks']==[2,18],p
          assert p['same_future_player_feature_violations']==0,p
          assert p['same_future_defense_feature_violations']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['football_outcomes_or_residuals_scored']==0,p
          assert p['candidate_models_fit']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'RB_INDIVIDUAL_RUN_LOCATION_MATCHUP_SOURCE_QUALIFIED',
              'RB_INDIVIDUAL_RUN_LOCATION_MATCHUP_SOURCE_NOT_QUALIFIED',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-individual-run-location-matchup-source-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/rb-run-location-source-v1/**
