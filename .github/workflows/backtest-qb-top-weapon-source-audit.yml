name: Migration 84 QB Top Weapon Source Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-qb-top-weapon-source-audit.yml"
      - "scripts/backtest/audit_top_weapon_escape_hatch_sources.py"
      - "docs/migrations/M84_TOP_WEAPON_ESCAPE_HATCH_SOURCE_AUDIT.md"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen M84 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          doc=Path('docs/migrations/M84_TOP_WEAPON_ESCAPE_HATCH_SOURCE_AUDIT.md').read_text()
          required=[
              'TOP_WEAPON_ESCAPE_HATCH',
              '56.749517',
              'M72 aggregate explosive-weapon x defense matchup',
              'M75 NGS receiver separation/cushion/aDOT/YACOE',
              'QUALIFIED_FOR_M85_PREDICTIVE_DEVELOPMENT',
              'HOLD_SOURCE_BLOCKED_NEW_INFORMATION',
              'production_actionable = false',
          ]
          missing=[x for x in required if x not in doc]
          assert not missing, missing
          print('M84 frozen contract: PASS')
          PY

  source-audit:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      - name: Run M84 source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/m84_top_weapon_source_audit
          python scripts/backtest/audit_top_weapon_escape_hatch_sources.py --out-dir data/backtests/m84_top_weapon_source_audit
      - name: Verify no predictive work and show decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('data/backtests/m84_top_weapon_source_audit')
          d=json.loads((root/'m84_decision.json').read_text())
          inv=pd.read_csv(root/'m84_source_inventory.csv')
          assert d['qb_outcomes_read'] is False
          assert d['sportsbook_features_used'] is False
          assert d['production_actionable'] is False
          assert d['final_disposition'] in {
              'QUALIFIED_FOR_M85_PREDICTIVE_DEVELOPMENT',
              'HOLD_SOURCE_BLOCKED_NEW_INFORMATION',
              'CLOSED_NO_MATERIALLY_NEW_SOURCE',
          }
          assert len(inv) >= 5
          print(inv.to_string(index=False))
          print(json.dumps(d, indent=2))
          PY
      - name: Upload M84 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m84-top-weapon-source-audit
          path: data/backtests/m84_top_weapon_source_audit/*
          if-no-files-found: warn
          retention-days: 14
