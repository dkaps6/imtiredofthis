name: Data Frontier BDB2024 Real Corpus

on:
  push:
    branches:
      - data-frontier-phase0-bdb-contact-v1
    paths:
      - '.github/workflows/data-frontier-bdb2024-real-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BDB2024_COMPETITION: nfl-big-data-bowl-2024

jobs:
  real-corpus-phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN_RAW: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout isolated data-frontier branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize Kaggle credential transport
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get('KAGGLE_API_TOKEN_RAW', '').strip()
          if not raw:
              print('KAGGLE_API_TOKEN repository secret is missing or empty.')
              raise SystemExit(2)
          token = raw
          for prefix in ('export KAGGLE_API_TOKEN=', 'KAGGLE_API_TOKEN='):
              if token.startswith(prefix):
                  token = token[len(prefix):].strip()
                  break
          if len(token) >= 2 and token[0] == token[-1] and token[0] in ('"', "'"):
              token = token[1:-1].strip()
          token = token.replace('\r', '').replace('\n', '')
          print(f"normalized_token_prefix_ok={token.startswith('KGAT_')}")
          print(f"normalized_token_length={len(token)}")
          if not token.startswith('KGAT_'):
              print('Stored Kaggle secret is not a KGAT_ API token after safe normalization.')
              raise SystemExit(2)
          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as handle:
              handle.write(f'KAGGLE_API_TOKEN={token}\n')
          token_dir = Path.home() / '.kaggle'
          token_dir.mkdir(parents=True, exist_ok=True)
          token_path = token_dir / 'access_token'
          token_path.write_text(token, encoding='utf-8')
          token_path.chmod(0o600)
          print('Kaggle credential normalized and materialized securely; value not printed.')
          PY

      - name: Validate Kaggle token with official introspection
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['KAGGLE_API_TOKEN'].strip()
          request = urllib.request.Request(
              'https://www.kaggle.com/api/v1/oauth2/introspect',
              data=json.dumps({'token': token}).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"Kaggle token introspection HTTP status={exc.code}")
              raise SystemExit(2)
          except Exception as exc:
              print(f"Kaggle token introspection request failed: {type(exc).__name__}")
              raise SystemExit(2)
          active = bool(payload.get('active'))
          print(f"kaggle_token_active={active}")
          if not active:
              raise SystemExit(2)
          PY

      - name: Install Phase-0 and Kaggle dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle pyyaml

      - name: Download and resolve official BDB 2024 competition corpus
        id: download
        shell: bash
        run: |
          set -euo pipefail
          download_dir="${RUNNER_TEMP}/bdb2024_download"
          extract_dir="${RUNNER_TEMP}/bdb2024_extract"
          diagnostics_dir="${RUNNER_TEMP}/bdb2024_download_diagnostics"
          mkdir -p "$download_dir" "$extract_dir" "$diagnostics_dir"
          kaggle competitions download \
            -c "${BDB2024_COMPETITION}" \
            -p "$download_dir"
          archive="$(find "$download_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "Official Kaggle download did not produce a zip archive."
            exit 2
          fi
          archive_size="$(stat -c '%s' "$archive")"
          echo "Downloaded official archive bytes=${archive_size}"
          unzip -q "$archive" -d "$extract_dir"
          rm -f "$archive"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'bdb2024_extract'
          diag = Path(os.environ['RUNNER_TEMP']) / 'bdb2024_download_diagnostics'
          files = sorted(p for p in root.rglob('*') if p.is_file())
          inventory = [
              {'relative_path': str(p.relative_to(root)), 'size_bytes': p.stat().st_size}
              for p in files
          ]
          (diag / 'package_inventory.json').write_text(
              json.dumps({'file_count': len(inventory), 'files': inventory}, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          required = {'plays.csv', 'tackles.csv', *{f'tracking_week_{w}.csv' for w in range(1, 10)}}
          parents = {}
          for p in files:
              if p.name in required:
                  parents.setdefault(p.parent, set()).add(p.name)
          candidates = [parent for parent, names in parents.items() if required.issubset(names)]
          if len(candidates) != 1:
              print(f'Could not uniquely resolve complete BDB 2024 corpus root; candidates={len(candidates)}')
              print(f'Extracted file count={len(files)}; see sanitized package inventory artifact.')
              raise SystemExit(2)
          corpus_root = candidates[0]
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'corpus_dir={corpus_root}\n')
          print(f'Official BDB 2024 corpus root resolved at relative depth={len(corpus_root.relative_to(root).parts)}')
          PY
          echo "Official BDB 2024 corpus downloaded to ephemeral runner storage."
          echo "Raw competition files will not be uploaded as workflow artifacts."

      - name: Upload sanitized download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdb2024-download-diagnostics
          path: ${{ runner.temp }}/bdb2024_download_diagnostics
          if-no-files-found: ignore
          retention-days: 30

      - name: Run fail-closed real-corpus Phase-0 benchmark
        id: phase0
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          export PYTHONPATH="${PWD}"
          out_dir="${RUNNER_TEMP}/bdb2024_phase0"
          mkdir -p "$out_dir"
          set +e
          python -m scripts.data_frontier.run_bdb_2024_phase0 \
            --input-dir "${{ steps.download.outputs.corpus_dir }}" \
            --out-dir "$out_dir" \
            2>&1 | tee "${RUNNER_TEMP}/bdb2024_phase0.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized benchmark artifact
        if: always() && steps.download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          summary_dir="${RUNNER_TEMP}/bdb2024_phase0_summary"
          out_dir="${RUNNER_TEMP}/bdb2024_phase0"
          mkdir -p "$summary_dir"
          for name in \
            corpus_preflight_v1.json \
            qa_summary.json \
            source_manifest.json \
            artifact_provenance_v1.json \
            contact_fidelity_report_v1.json \
            phase0_pipeline_status.json; do
            if [ -f "$out_dir/$name" ]; then
              cp "$out_dir/$name" "$summary_dir/$name"
            fi
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_dir = Path(os.environ['RUNNER_TEMP']) / 'bdb2024_phase0_summary'
          payload = {
              'workflow': 'Data Frontier BDB2024 Real Corpus',
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'git_sha': os.environ.get('GITHUB_SHA'),
              'git_ref': os.environ.get('GITHUB_REF'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'competition': os.environ.get('BDB2024_COMPETITION'),
              'raw_competition_files_uploaded': False,
              'predictive_experiment': False,
              'production_changed': False,
              'contact_detector_changed': False,
          }
          (summary_dir / 'execution_metadata.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY
          if [ -f "${RUNNER_TEMP}/bdb2024_phase0.log" ]; then
            cp "${RUNNER_TEMP}/bdb2024_phase0.log" "$summary_dir/phase0_execution.log"
          fi

      - name: Upload sanitized Phase-0 benchmark summary
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bdb2024-real-corpus-phase0-summary
          path: ${{ runner.temp }}/bdb2024_phase0_summary
          if-no-files-found: error
          retention-days: 30

      - name: Enforce download result
        if: steps.download.outcome != 'success'
        run: |
          echo "Official BDB 2024 corpus download/package resolution failed."
          echo "See bdb2024-download-diagnostics; no detector science was changed."
          exit 1

      - name: Enforce Phase-0 result
        if: steps.download.outcome == 'success' && steps.phase0.outputs.exit_code != '0'
        run: |
          echo "BDB 2024 real-corpus Phase-0 benchmark failed closed."
          echo "See sanitized summary artifact for corpus/fidelity diagnostics."
          exit 1
