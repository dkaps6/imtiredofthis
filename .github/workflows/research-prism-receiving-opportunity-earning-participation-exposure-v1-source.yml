name: Research PRISM Receiving Opportunity Earning Participation Exposure V1 Source

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_RECEIVING_OPPORTUNITY_EARNING_PARTICIPATION_EXPOSURE_V1_SOURCE_PLAN.md'
      - 'scripts/research/audit_prism_receiving_opportunity_earning_participation_exposure_v1.py'
      - 'tests/test_prism_receiving_opportunity_earning_participation_exposure_v1.py'
      - '.github/workflows/research-prism-receiving-opportunity-earning-participation-exposure-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "42ff90db6202b783f7e97b73d0b3d629e9566bb3"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy==0.1.5 pandas numpy pytest pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_RECEIVING_OPPORTUNITY_EARNING_PARTICIPATION_EXPOSURE_V1_SOURCE_PLAN.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_receiving_opportunity_earning_participation_exposure_v1.py" 2>/dev/null; then
            echo "ERROR: implementation existed at source freeze"
            exit 1
          fi

      - name: Verify exact PlayerForm blob
        run: |
          set -euo pipefail
          ACTUAL="$(git hash-object scripts/player_form_v2.py)"
          EXPECTED="9246e4daf19f3f01cf61de3ad036b07873fd9561"
          echo "PLAYERFORM_BLOB=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify immutable state parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected={
            39154145666:(12146625382,'prism-player-observation-health-state-v1-source-39154145666','sha256:d74f2d3c37a88aa639527aedf719e7e08001d464c722613b46291cda0f74cbeb'),
            39160554692:(12147549966,'prism-player-participation-anomaly-state-v1-source-39160554692','sha256:e7753e981f0ecaaf23289280830fd32b9d733402c02ab9aaa0116fc929450449'),
          }
          repo=os.environ['GITHUB_REPOSITORY']
          for run,(aid,name,digest) in expected.items():
              payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))
              arts={int(a['id']):a for a in payload.get('artifacts',[])}
              a=arts.get(aid)
              assert a is not None,(run,aid)
              assert not a.get('expired'),a
              assert a.get('name')==name,a
              assert a.get('digest')==digest,a
              print('PARENT_VERIFIED',run,aid,name,digest)
          PY

      - name: Download immutable state parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-receiving-exposure
          mkdir -p /tmp/prism-receiving-exposure/{health,anomaly,out}
          gh run download 39154145666 --repo "${{ github.repository }}" \
            --name prism-player-observation-health-state-v1-source-39154145666 \
            --dir /tmp/prism-receiving-exposure/health
          gh run download 39160554692 --repo "${{ github.repository }}" \
            --name prism-player-participation-anomaly-state-v1-source-39160554692 \
            --dir /tmp/prism-receiving-exposure/anomaly
          test -s /tmp/prism-receiving-exposure/health/player_observation_health_state_rows.csv
          test -s /tmp/prism-receiving-exposure/anomaly/player_participation_anomaly_state_rows.csv

      - name: Compile and run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_receiving_opportunity_earning_participation_exposure_v1.py
          pytest -q tests/test_prism_receiving_opportunity_earning_participation_exposure_v1.py

      - name: Execute frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/audit_prism_receiving_opportunity_earning_participation_exposure_v1.py \
            --health-parent /tmp/prism-receiving-exposure/health/player_observation_health_state_rows.csv \
            --anomaly-parent /tmp/prism-receiving-exposure/anomaly/player_participation_anomaly_state_rows.csv \
            --out-dir /tmp/prism-receiving-exposure/out

      - name: Certify source-only contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p=json.load(open('/tmp/prism-receiving-exposure/out/receiving_opportunity_earning_participation_exposure_source_result.json'))
          rows=pd.read_csv('/tmp/prism-receiving-exposure/out/receiving_opportunity_earning_participation_exposure_rows.csv')
          assert p['version']=='PRISM_RECEIVING_OPPORTUNITY_EARNING_PARTICIPATION_EXPOSURE_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='42ff90db6202b783f7e97b73d0b3d629e9566bb3',p
          assert p['disposition'] in {
              'PRISM_RECEIVING_OPPORTUNITY_EARNING_PARTICIPATION_EXPOSURE_V1_SOURCE_READY',
              'PRISM_RECEIVING_OPPORTUNITY_EARNING_PARTICIPATION_EXPOSURE_V1_SOURCE_BLOCKED',
          },p
          assert p['health_parent_run']==39154145666,p
          assert p['health_parent_artifact']==12146625382,p
          assert p['anomaly_parent_run']==39160554692,p
          assert p['anomaly_parent_artifact']==12147549966,p
          assert p['player_form_blob_sha']=='9246e4daf19f3f01cf61de3ad036b07873fd9561',p
          assert p['routes_inferred_from_snaps'] is False,p
          assert p['predictive_outcomes_scored']==0,p
          assert p['projections_generated']==0,p
          assert p['coefficients_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          assert len(rows)>0
          assert set(rows['family'].unique()).issubset({'RB','WR','TE'})
          for s in p['season_summaries']:
              assert s['gates']['duplicate_positive_participation_keys_zero'],s
              assert s['gates']['target_count_finite_all'],s
              assert s['gates']['target_share_finite_when_team_targets_positive'],s
              assert s['gates']['targets_per_snap_finite_when_snaps_positive'],s
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          p=json.load(open('/tmp/prism-receiving-exposure/out/receiving_opportunity_earning_participation_exposure_source_result.json'))
          print("### PRISM receiving opportunity earning / participation exposure V1 — source audit")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for s in p['season_summaries']:
              print()
              print(f"**{s['season']}**")
              print(f"- player-games={s['player_games']}; named players={s['players']}")
              print(f"- team-target coverage={s['team_target_coverage']:.2%}; snap-count coverage={s['snap_count_coverage']:.2%}; snap-pct coverage={s['snap_pct_coverage']:.2%}")
              print(f"- zero-target positive-participation rows={s['zero_target_positive_participation_rows']}")
              print(f"- injury-corroborated collapses={s['injury_corroborated_collapse_rows']}; unresolved collapses={s['unresolved_collapse_rows']}")
              failed=[k for k,v in s['gates'].items() if not v]
              print(f"- failed gates: {failed or ['NONE']}")
          print()
          print("Source only. This separates named-player participation exposure from target earning. Snaps are never called routes. No predictive outcome, 2026 outcome, sportsbook/OddsAPI, fitted coefficient/threshold, or production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-receiving-opportunity-earning-participation-exposure-v1-source-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-receiving-exposure/out/**
