name: RB STACK6S Conditional Run Advantage Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6s-conditional-run-advantage-audit
    paths:
      - 'scripts/backtest/audit_rb_stack6s_conditional_run_advantage.py'
      - 'docs/migrations/RB_STACK6S_CONDITIONAL_RUN_ADVANTAGE_AUDIT_PLAN.md'
      - '.github/workflows/backtest-rb-stack6s-conditional-run-advantage-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      STACK6H_RUN_ID: '33632678179'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 pyarrow==17.0.0 nflreadpy
      - name: Compile
        run: python -m py_compile scripts/backtest/audit_rb_stack6s_conditional_run_advantage.py
      - name: Download frozen STACK6H grading artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6s/stack6h
          gh run download "$STACK6H_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6h-current-pool-oracle --dir data/backtests/rb_stack6s/stack6h
          test -s data/backtests/rb_stack6s/stack6h/stack6h_team_trace.csv
      - name: Run frozen STACK6S audit
        run: |
          rm -rf data/backtests/rb_stack6s/results
          python scripts/backtest/audit_rb_stack6s_conditional_run_advantage.py \
            --stack6h-root data/backtests/rb_stack6s/stack6h \
            --out-dir data/backtests/rb_stack6s/results
      - name: Show outputs
        if: always()
        run: |
          echo '=== integrity ==='
          cat data/backtests/rb_stack6s/results/stack6s_integrity.csv 2>/dev/null || true
          echo '=== qualification ==='
          cat data/backtests/rb_stack6s/results/stack6s_signal_qualification.csv 2>/dev/null || true
          echo '=== signal summary ==='
          cat data/backtests/rb_stack6s/results/stack6s_signal_summary.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6s/results/stack6s_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6s-conditional-run-advantage-audit
          path: data/backtests/rb_stack6s/results/**
          if-no-files-found: warn
          retention-days: 30
