name: Recover WR TE Fold Authorities V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - '.github/workflows/research-recover-wr-te-fold-authorities-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact frozen TE-R5P source
        uses: actions/checkout@v4
        with:
          ref: 2194668c5af49ef15ee904c7d583cc61df0c58b4
          fetch-depth: 1

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "2194668c5af49ef15ee904c7d583cc61df0c58b4"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify exact surviving artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          expected = {
            10061328722: ("wr-r15-wr1-anchor-participation-v1",
              "sha256:8df31b5e136621d959272daf0422dfc665593cd0da2eb0892b4aa69c1417f3ce"),
            10020423842: ("te-r3-target-pool-context-model",
              "sha256:99699c7e4745ab8cf678b527fc57325c5f402a5c7be930ff9cb90dba96e63ff8"),
            10020700686: ("te-r4-strict-prior-participation-source",
              "sha256:56de7efe302cdf9c329c3a0386d798789d15e6a495c865535291173b6840c163"),
          }
          repo=os.environ["GITHUB_REPOSITORY"]
          for aid,(name,digest) in expected.items():
              doc=json.loads(subprocess.check_output(
                  ["gh","api",f"repos/{repo}/actions/artifacts/{aid}"], text=True))
              assert doc["expired"] is False, doc
              assert doc["name"] == name, doc
              assert doc.get("digest") == digest, doc
              print(aid, name, digest)
          PY

      - name: Re-archive exact original WR-R15 OOS bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/recovery/wr_r15_original
          gh run download 34238301577 --repo "${GITHUB_REPOSITORY}"             --name wr-r15-wr1-anchor-participation-v1             --dir /tmp/recovery/wr_r15_original
          test -s /tmp/recovery/wr_r15_original/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          test -s /tmp/recovery/wr_r15_original/backtests/wr_r15_wr1_anchor_v1/wr_r15_confirmation_predictions.csv

      - name: Download exact frozen TE-R3 and TE-R4 parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/te_r3 evidence/te_r4
          gh run download 34126813280 --repo "${GITHUB_REPOSITORY}"             --name te-r3-target-pool-context-model --dir evidence/te_r3
          gh run download 34127474412 --repo "${GITHUB_REPOSITORY}"             --name te-r4-strict-prior-participation-source --dir evidence/te_r4
          test -s evidence/te_r3/data/backtests/te_r3_target_pool_context_model/te_r3_oos_player_casebook.csv ||             find evidence/te_r3 -name te_r3_oos_player_casebook.csv -size +0c | grep -q .
          test -s evidence/te_r4/data/backtests/te_r4_strict_prior_participation_source/te_r4_prior_participation_casebook.csv ||             find evidence/te_r4 -name te_r4_prior_participation_casebook.csv -size +0c | grep -q .

      - name: Rehydrate original TE-R5P fold authority
        run: |
          rm -rf data/backtests/te_r5p_production_contract_refit_v1
          python scripts/backtest/evaluate_te_r5p_production_contract_refit_v1.py             --te-r3-root evidence/te_r3             --te-r4-root evidence/te_r4             --out-dir data/backtests/te_r5p_production_contract_refit_v1
          mkdir -p /tmp/recovery/te_r5p_recovered
          cp -a data/backtests/te_r5p_production_contract_refit_v1/. /tmp/recovery/te_r5p_recovered/

      - name: Certify original published TE-R5P result equivalence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          root=Path("/tmp/recovery/te_r5p_recovered")
          p=json.loads((root/"te_r5p_result.json").read_text())
          assert p["disposition"]=="TE_R5P_PRODUCTION_CONTRACT_REFIT_ELIGIBLE",p
          assert p["candidate_team_pool"]=="b0_te_pool",p
          assert float(p["pool_ratio_contract"])==1.0,p
          assert int(p["oos_player_games"])==3214,p
          assert abs(float(p["join_coverage"])-1.0)<=1e-12,p
          assert int(p["same_or_future_observations_used"])==0,p
          assert int(p["sportsbook_inputs_used"])==0,p
          def eq(a,b):
              assert abs(float(a)-float(b))<=1e-12,(a,b)
          eq(p["pooled"]["candidate_target"]["mae"],1.6183581460350753)
          eq(p["pooled"]["candidate_rec_yards"]["mae"],15.850607934418186)
          s=pd.read_csv(root/"te_r5p_season_scorecard.csv").set_index("season")
          expected={
            2023:(1.5893716066033456,15.985567134219334),
            2024:(1.6858340671516034,16.193165401536007),
            2025:(1.5793000481310762,15.394030572316792),
          }
          for y,(t,r) in expected.items():
              eq(s.loc[y,"candidate_target_mae"],t)
              eq(s.loc[y,"candidate_rec_yards_mae"],r)
          hashes={}
          for base in [Path("/tmp/recovery/wr_r15_original"), root]:
              for f in sorted(base.rglob("*")):
                  if f.is_file():
                      hashes[str(f.relative_to("/tmp/recovery"))]="sha256:"+hashlib.sha256(f.read_bytes()).hexdigest()
          manifest={
            "status":"WR_TE_FOLD_AUTHORITIES_RECOVERED_EXACT",
            "te_source_commit":"2194668c5af49ef15ee904c7d583cc61df0c58b4",
            "wr_original_run":34238301577,
            "wr_original_artifact":10061328722,
            "te_original_run":34152797603,
            "te_original_artifact_expired":10029942404,
            "te_r3_artifact":10020423842,
            "te_r4_artifact":10020700686,
            "te_published_metrics_exact_match":True,
            "provider_rebuild_used":False,
            "sportsbook_inputs_used":False,
            "paid_oddsapi_calls":0,
            "production_changed":False,
            "file_sha256":hashes,
          }
          Path("/tmp/recovery/recovery_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

      - name: Upload durable recovered fold authorities
        uses: actions/upload-artifact@v4
        with:
          name: wr-te-fold-authorities-recovered-v1
          retention-days: 90
          if-no-files-found: error
          path: /tmp/recovery/
