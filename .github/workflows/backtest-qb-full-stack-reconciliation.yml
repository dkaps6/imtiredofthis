name: Migration 82 QB Full-Stack Clean Reconciliation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-qb-full-stack-reconciliation.yml"
      - "scripts/backtest/reconcile_qb_full_stack.py"
      - "scripts/backtest/build_m82_integration_ledger.py"
      - "docs/migrations/M82_FULL_STACK_CLEAN_RECONCILIATION.md"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen M82 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          doc=Path('docs/migrations/M82_FULL_STACK_CLEAN_RECONCILIATION.md').read_text()
          required=[
              '2024 regular season Weeks 1-18',
              '2025 regular season Weeks 1-18',
              'Monte Carlo: 2,000 iterations',
              'current full production-style stack',
              '2024 OOS component predictions only',
              'c4a481a760657bb7516d52b9aa9ba84af096063a4e78660b12a541f59fd7b742',
              'TOP_WEAPON_ESCAPE_HATCH',
              'DEFENSIVE_ADAPTIVE_GAMEPLAN',
              'production_actionable = false',
          ]
          missing=[x for x in required if x not in doc]
          assert not missing, missing
          print('M82 frozen contract: PASS')
          PY

  full-stack:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Build 2024 historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data/backtests/m82/2024
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks "1-18" --out-dir data/backtests/m82/2024
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/m82/2024/team_weekly_history.csv --seasons 2023,2024 --audit data/backtests/m82/2024/historical_defense_enrichment_audit.csv --observations data/backtests/m82/2024/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2024 --prior-season 2023 --weeks "1-18" --data-dir data/backtests/m82/2024 --report data/backtests/m82/2024/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024 --schedule data/backtests/m82/2024/schedule_history.csv --out data/backtests/m82/2024/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024 --out data/backtests/m82/2024/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/m82/2024/schedule_history.csv --out data/backtests/m82/2024/weather_history.csv

      - name: Run 2024 current full-stack walk-forward
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f data/backtests/m82/2024/component_predictions.csv
          python scripts/backtest/walk_forward.py \
            --season 2024 --prior-season 2023 --weeks "1-18" \
            --player-logs data/backtests/m82/2024/player_game_logs_history.csv \
            --team-weekly data/backtests/m82/2024/team_weekly_history.csv \
            --schedule data/backtests/m82/2024/schedule_history.csv \
            --universe-dir data/backtests/m82/2024/pregame_universe \
            --injuries data/backtests/m82/2024/injuries_history.csv \
            --weather data/backtests/m82/2024/weather_history.csv \
            --out data/backtests/m82/2024/component_predictions.csv \
            --iterations 2000
          python scripts/backtest/evaluate_components.py --predictions data/backtests/m82/2024/component_predictions.csv --out-dir data/backtests/m82/2024/evaluation

      - name: Build 2025 historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data/backtests/m82/2025
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks "1-18" --out-dir data/backtests/m82/2025
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/m82/2025/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests/m82/2025/historical_defense_enrichment_audit.csv --observations data/backtests/m82/2025/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks "1-18" --data-dir data/backtests/m82/2025 --report data/backtests/m82/2025/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule data/backtests/m82/2025/schedule_history.csv --out data/backtests/m82/2025/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests/m82/2025/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/m82/2025/schedule_history.csv --out data/backtests/m82/2025/weather_history.csv

      - name: Run 2025 current full-stack walk-forward
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f data/backtests/m82/2025/component_predictions.csv
          python scripts/backtest/walk_forward.py \
            --season 2025 --prior-season 2024 --weeks "1-18" \
            --player-logs data/backtests/m82/2025/player_game_logs_history.csv \
            --team-weekly data/backtests/m82/2025/team_weekly_history.csv \
            --schedule data/backtests/m82/2025/schedule_history.csv \
            --universe-dir data/backtests/m82/2025/pregame_universe \
            --injuries data/backtests/m82/2025/injuries_history.csv \
            --weather data/backtests/m82/2025/weather_history.csv \
            --out data/backtests/m82/2025/component_predictions.csv \
            --iterations 2000
          python scripts/backtest/evaluate_components.py --predictions data/backtests/m82/2025/component_predictions.csv --out-dir data/backtests/m82/2025/evaluation

      - name: Reconcile current QB full stack on canonical-v3
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data/backtests/m82/reconciliation
          python scripts/backtest/reconcile_qb_full_stack.py \
            --canonical data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv \
            --predictions-2024 data/backtests/m82/2024/component_predictions.csv \
            --predictions-2025 data/backtests/m82/2025/component_predictions.csv \
            --out-dir data/backtests/m82/reconciliation
          python scripts/backtest/build_m82_integration_ledger.py --out-dir data/backtests/m82/reconciliation

      - name: Verify M82 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('data/backtests/m82/reconciliation')
          c=json.loads((root/'m82_reconciliation_contract.json').read_text())
          s=pd.read_csv(root/'m82_qb_full_stack_scoreboard.csv')
          ledger=pd.read_csv(root/'m82_m40_m81_integration_ledger.csv')
          assert c['canonical_rows'] == 884, c
          assert c['sportsbook_features_used'] is False
          assert set(s['season'].astype(str)) == {'2024','2025','COMBINED'}
          assert {'canonical_v3','current_mc','current_ml','current_state','oos_ensemble'}.issubset(set(s['model']))
          assert len(ledger) >= 20
          print('--- M82 QB FULL-STACK SCOREBOARD ---')
          print(s.to_string(index=False))
          print('--- M82 LEDGER DISPOSITIONS ---')
          print(ledger.groupby('disposition').size().to_string())
          print('--- M82 CONTRACT ---')
          print(json.dumps(c, indent=2))
          PY

      - name: Upload M82 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m82-full-stack-clean-reconciliation
          path: |
            data/backtests/m82/2024/historical_input_validation.csv
            data/backtests/m82/2024/historical_defense_enrichment_audit.csv
            data/backtests/m82/2024/component_predictions.csv
            data/backtests/m82/2024/evaluation/*.csv
            data/backtests/m82/2025/historical_input_validation.csv
            data/backtests/m82/2025/historical_defense_enrichment_audit.csv
            data/backtests/m82/2025/component_predictions.csv
            data/backtests/m82/2025/evaluation/*.csv
            data/backtests/m82/reconciliation/*
          if-no-files-found: warn
          retention-days: 14
