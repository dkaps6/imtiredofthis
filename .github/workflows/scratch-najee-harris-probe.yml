name: Scratch Najee Harris Identity Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-najee-harris-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download failed live-odds run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 34764033649 --repo "$GITHUB_REPOSITORY" --name run_34764033649 --dir artifact
          find artifact -maxdepth 3 -iname "roles_ourlads*.csv" -o -iname "live_prop_identity*"
      - name: Inspect Harris rows
        run: |
          echo "=== roles_ourlads.csv rows containing 'harris' ==="
          grep -i "harris" artifact/data/roles_ourlads.csv || echo "no match"
          echo
          echo "=== live_prop_identity_audit.csv rows containing 'harris' ==="
          grep -i "harris" artifact/data/live_prop_identity_audit.csv || echo "no match"
          echo
          echo "=== live_prop_identity_status.json ==="
          cat artifact/data/live_prop_identity_status.json || true
          echo
          echo "=== props_raw.csv rows containing 'harris' ==="
          grep -i "harris" artifact/data/props_raw.csv || echo "no match"
