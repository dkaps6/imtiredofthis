name: RB R26F 2020 Week 1 Vacancy Forensic Atlas V1

on:
  push:
    branches:
      - research-rb-r26f-2020-week1-vacancy-forensics-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PRODUCTION_BASE_SHA: f8417f55b04ce0e19baf260e9d532765034c47f1
  R26_RUN_ID: '34356222339'
  R26_ARTIFACT_ID: '10106271075'
  R26_ARTIFACT_NAME: rb-r26-vacancy-gated-r9-retrospective-v1
  R26_DIGEST: sha256:607fca6e11c301ecb2a3bf74e3dfea8ae415bb33cf3c150a6d89eaedada2809e
  R26E_RUN_ID: '34364872300'
  R26E_ARTIFACT_ID: '10109398212'
  R26E_ARTIFACT_NAME: rb-r26e-week1-vacancy-component-qualification-v1
  R26E_DIGEST: sha256:4d136cf20bccebbdd874b24392d95669d11ad01e55b4ac4af6cdee06e7e99651

jobs:
  forensic-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forensic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4

      - name: Verify frozen R26F contract and protected production boundary
        run: |
          set -euo pipefail
          test -s docs/research/RB_R26F_2020_WEEK1_VACANCY_FAILURE_FORENSIC_ATLAS_V1_FROZEN_PLAN.md
          test -s docs/research/RB_R26F_2020_WEEK1_VACANCY_FAILURE_FORENSIC_ATLAS_V1_IMPLEMENTATION_LOCK.md
          test -s docs/research/RB_R26E_WEEK1_VACANCY_COMPONENT_QUALIFICATION_V1_RESULT.md
          test -s docs/research/RESEARCH_COMPONENT_PRESERVATION_DOCTRINE.md
          test -s scripts/backtest/audit_rb_r26f_2020_week1_vacancy_forensics_v1.py
          python -m py_compile scripts/backtest/audit_rb_r26f_2020_week1_vacancy_forensics_v1.py
          sha256sum docs/research/RB_R26F_2020_WEEK1_VACANCY_FAILURE_FORENSIC_ATLAS_V1_FROZEN_PLAN.md | tee r26f_plan.sha256
          sha256sum docs/research/RB_R26F_2020_WEEK1_VACANCY_FAILURE_FORENSIC_ATLAS_V1_IMPLEMENTATION_LOCK.md | tee r26f_lock.sha256
          sha256sum scripts/backtest/audit_rb_r26f_2020_week1_vacancy_forensics_v1.py | tee r26f_code.sha256
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml \
            .github/workflows/production-week1-v4-r22-certification.yml
          echo 'R26F_PROTECTED_PRODUCTION_BOUNDARY_PASS'

      - name: Verify and download immutable parent evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R26_META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26_ARTIFACT_ID}" --jq '.digest')"
          R26E_META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26E_ARTIFACT_ID}" --jq '.digest')"
          test "$R26_META" = "$R26_DIGEST"
          test "$R26E_META" = "$R26E_DIGEST"
          rm -rf parent_r26 parent_r26e
          mkdir -p parent_r26 parent_r26e
          gh run download "$R26_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26_ARTIFACT_NAME" --dir parent_r26
          gh run download "$R26E_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26E_ARTIFACT_NAME" --dir parent_r26e
          test "$(find parent_r26 -name r26_predictions.csv -type f | wc -l)" -eq 6
          test -s parent_r26e/data/backtests/r26e_week1_vacancy_component_qualification_v1/r26e_week1_disposition.json
          python - <<'PY'
          import json
          d=json.load(open('parent_r26e/data/backtests/r26e_week1_vacancy_component_qualification_v1/r26e_week1_disposition.json'))
          assert d['disposition'] == 'WEEK1_COMPONENT_MIXED_OR_FAIL_NO_SHADOW'
          assert d['gates_passed'] == 17 and d['gates_total'] == 18
          assert d['gates']['11_no_w1_season_worsens_more_than_2pct'] is False
          PY
          echo "R26F_IMMUTABLE_PARENT_EVIDENCE_PASS r26=$R26_META r26e=$R26E_META"

      - name: Execute frozen no-refit R26F atlas
        run: |
          set -euo pipefail
          rm -rf data/backtests/r26f_2020_week1_vacancy_forensics_v1
          python scripts/backtest/audit_rb_r26f_2020_week1_vacancy_forensics_v1.py \
            --r26-root parent_r26 \
            --out-dir data/backtests/r26f_2020_week1_vacancy_forensics_v1

      - name: Assert forensic integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/backtests/r26f_2020_week1_vacancy_forensics_v1/r26f_disposition.json').read_text())
          i=d['integrity']
          assert i['r26_predictions_regenerated'] is False
          assert i['r9_refit'] is False
          assert i['sportsbook_inputs_added'] == 0
          assert i['production_parameters_changed'] is False
          assert i['same_week_depth_added'] is False
          assert i['required_seasons_present'] is True
          assert d['prospective_shadow_authorized'] is False
          assert d['production_promotion_authorized'] is False
          assert d['r26e_disposition_unchanged'] == 'WEEK1_COMPONENT_MIXED_OR_FAIL_NO_SHADOW'
          assert d['disposition'] in {
              'WEEK1_FAILURE_MECHANISM_IDENTIFIED_REPLICATED',
              'WEEK1_2020_FAILURE_LOCALIZED_NOT_REPLICATED',
              'WEEK1_FAILURE_MECHANISM_UNRESOLVED',
              'WEEK1_FORENSIC_INTEGRITY_FAILURE',
          }
          print('R26F_FORENSIC_INTEGRITY_PASS disposition=' + d['disposition'])
          PY

      - name: Show R26F forensic result
        run: |
          cat data/backtests/r26f_2020_week1_vacancy_forensics_v1/r26f_disposition.json
          echo '=== material/replicated harmful states ==='
          python - <<'PY'
          import pandas as pd
          p='data/backtests/r26f_2020_week1_vacancy_forensics_v1/r26f_harmful_state_replication.csv'
          d=pd.read_csv(p)
          print(d.loc[d.materially_harmful_2020.astype(bool)].to_csv(index=False))
          PY

      - name: Upload R26F evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r26f-2020-week1-vacancy-forensics-v1
          retention-days: 90
          path: |
            r26f_plan.sha256
            r26f_lock.sha256
            r26f_code.sha256
            data/backtests/r26f_2020_week1_vacancy_forensics_v1/*
