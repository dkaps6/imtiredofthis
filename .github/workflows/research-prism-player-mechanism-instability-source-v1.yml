name: Research PRISM Player Mechanism Instability Source Audit V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_PLAYER_MECHANISM_INSTABILITY_TRUST_V1_SOURCE_AUDIT.md'
      - 'scripts/research/audit_prism_player_mechanism_instability_trust_v1_source.py'
      - '.github/workflows/research-prism-player-mechanism-instability-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "5f19f200b281c7e80a9cc0af234746f5550598b5"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_PLAYER_MECHANISM_INSTABILITY_TRUST_V1_SOURCE_AUDIT.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_player_mechanism_instability_trust_v1_source.py" 2>/dev/null; then
            echo "ERROR: implementation existed at source-plan freeze"
            exit 1
          fi

      - name: Verify exact historical source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          expected={
            37634044900:(11487359185,'wr-player-mechanism-persistence-v1-37634044900','sha256:13bb2df4d239f9f2832370520c3d31a08ed4f39c782766fbfb96295edc11c4e3'),
            37631011196:(11486082927,'te-player-mechanism-persistence-v1-37631011196','sha256:1b208531a8cf34735760081b7a232c4cd164a551c325f518d33428a50d7da8ab'),
          }
          repo=os.environ['GITHUB_REPOSITORY']
          for run,(aid,name,digest) in expected.items():
              payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))
              arts={int(a['id']):a for a in payload.get('artifacts',[])}
              a=arts.get(aid)
              assert a is not None,(run,aid)
              assert not a.get('expired'),a
              assert a.get('name')==name,a
              assert a.get('digest')==digest,a
              print('SOURCE_VERIFIED',run,aid,name,digest)
          PY

      - name: Download exact source panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-mech-source
          mkdir -p /tmp/prism-mech-source/{wr,te,out}
          gh run download 37634044900 --repo "${{ github.repository }}"             --name wr-player-mechanism-persistence-v1-37634044900             --dir /tmp/prism-mech-source/wr
          gh run download 37631011196 --repo "${{ github.repository }}"             --name te-player-mechanism-persistence-v1-37631011196             --dir /tmp/prism-mech-source/te
          test -s /tmp/prism-mech-source/wr/wr_player_mechanism_persistence_rows.csv
          test -s /tmp/prism-mech-source/te/te_player_mechanism_persistence_rows.csv

      - name: Execute source/chronology audit only
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/audit_prism_player_mechanism_instability_trust_v1_source.py
          python scripts/research/audit_prism_player_mechanism_instability_trust_v1_source.py             --wr /tmp/prism-mech-source/wr/wr_player_mechanism_persistence_rows.csv             --te /tmp/prism-mech-source/te/te_player_mechanism_persistence_rows.csv             --out-dir /tmp/prism-mech-source/out

      - name: Certify source-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/prism-mech-source/out/mechanism_instability_source_result.json'))
          assert p['version']=='PRISM_PLAYER_MECHANISM_INSTABILITY_TRUST_V1_SOURCE_AUDIT',p
          assert p['status'] in {
            'PRISM_PLAYER_MECHANISM_INSTABILITY_TRUST_V1_SOURCE_READY_WR_TE',
            'PRISM_PLAYER_MECHANISM_INSTABILITY_TRUST_V1_SOURCE_BLOCKED',
          },p
          assert p['wr']['max_decomposition_identity_gap']<=1e-10,p
          assert p['te']['max_decomposition_identity_gap']<=1e-10,p
          assert p['wr']['chronology_violations']==0,p
          assert p['te']['chronology_violations']==0,p
          assert p['rb_status']=='SOURCE_NOT_PROVEN_FOR_THIS_V1',p
          assert p['qb_status']=='EXCLUDED_BY_ANTI_RETEST',p
          assert p['candidate_scored'] is False,p
          assert p['week4_5_candidate_rows_used']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['models_fit']==0,p
          assert p['threshold_searches']==0,p
          assert p['projection_changed'] is False,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json,os
          p=json.load(open('/tmp/prism-mech-source/out/mechanism_instability_source_result.json'))
          print("## PRISM player mechanism-instability trust V1 — source audit")
          print()
          print(f"Run: {os.environ['GITHUB_RUN_ID']}")
          print(f"Exact head: {os.environ['GITHUB_SHA']}")
          print(f"Disposition: {p['status']}")
          for pos in ['wr','te']:
              s=p[pos]
              print(f"{pos.upper()}: rows={s['source_rows']} players={s['source_players']} max_identity_gap={s['max_decomposition_identity_gap']:.3e}")
              for q in s['support']:
                  print(f"- {q['season']}: eligible={q['eligible_target_rows']} players={q['distinct_players']} ready={q['source_ready']}")
          print(f"RB: {p['rb_status']}; QB: {p['qb_status']}.")
          print()
          print("Source/chronology only: candidate not scored; zero 2026 outcomes, Week-4/5 candidate rows, sportsbook/OddsAPI, fits, threshold search, projection or production changes.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-player-mechanism-instability-source-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-mech-source/out/**
