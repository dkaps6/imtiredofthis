name: Weeks1-3 Postmortem Diagnostics V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-week3-postmortem-execution-v1
    paths:
      - 'data/research/week3_postmortem/PRODUCTION_DECISION_GATES_WEEKS1_3_V1.json'
      - 'data/research/week3_postmortem/WEEK3_MANUAL_SETTLEMENT_EVIDENCE_V1.json'
      - 'scripts/operations/backtest_full_report_v1.py'
      - 'scripts/operations/grade_market_track_record_gsis_v1.py'
      - 'tests/test_grade_market_track_record_gsis_verified_alias_v1.py'
      - '.github/workflows/weeks1-3-postmortem-diagnostics-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_RUN_ID: "36293274478"
  SOURCE_GIT_SHA: "0982b62276303403e2ca58b16e6f4fc3e041f65d"
  SOURCE_ARTIFACT_ID: "10923570170"
  SOURCE_ARTIFACT_NAME: "run_36293274478"
  SOURCE_ARTIFACT_DIGEST: "sha256:5a3d4f64592c70553e66dd51bb3bff45263d2900f4d270e370353fa60ea1c480"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest

      - name: Run historical-grader identity regression
        run: |
          export PYTHONPATH="${PWD}"
          pytest -q tests/test_grade_market_track_record_gsis_verified_alias_v1.py

      - name: Verify and download immutable paid Week 3 board
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/source_artifacts.json
          python - <<'PY'
          import json, os
          obj=json.load(open('/tmp/source_artifacts.json', encoding='utf-8'))
          want=int(os.environ['SOURCE_ARTIFACT_ID'])
          matches=[a for a in obj.get('artifacts',[]) if int(a.get('id',-1)) == want]
          if len(matches) != 1:
              raise SystemExit(f"FATAL artifact id {want} found {len(matches)} times")
          a=matches[0]
          assert a.get('name') == os.environ['SOURCE_ARTIFACT_NAME'], a
          assert a.get('digest') == os.environ['SOURCE_ARTIFACT_DIGEST'], a
          assert not bool(a.get('expired')), a
          PY
          rm -rf /tmp/week3_paid
          mkdir -p /tmp/week3_paid
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir /tmp/week3_paid
          test -s /tmp/week3_paid/outputs/props_priced_clean.csv

      - name: Materialize canonical Week 3 ledger row set
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/archive_priced_board_v1.py \
            --priced-file /tmp/week3_paid/outputs/props_priced_clean.csv \
            --season 2026 \
            --week 3 \
            --run-id "${SOURCE_RUN_ID}" \
            --git-sha "${SOURCE_GIT_SHA}"

      - name: Generate cumulative Weeks 1-3 diagnostics
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          mkdir -p data/research/week3_postmortem
          python scripts/operations/backtest_full_report_v1.py \
            --season 2026 \
            --weeks 1,2,3 \
            --production-gate-evidence data/research/week3_postmortem/PRODUCTION_DECISION_GATES_WEEKS1_3_V1.json \
            --manual-settlement-evidence data/research/week3_postmortem/WEEK3_MANUAL_SETTLEMENT_EVIDENCE_V1.json \
            --out data/research/week3_postmortem/weeks1_3_full_graded.csv \
            | tee data/research/week3_postmortem/weeks1_3_full_report.txt

      - name: Upload cumulative diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weeks1-3-postmortem-diagnostics-v1-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/research/week3_postmortem/weeks1_3_full_graded.csv
            data/research/week3_postmortem/weeks1_3_full_report.txt
