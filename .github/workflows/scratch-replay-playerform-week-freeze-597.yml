name: Scratch Replay PlayerForm Week Freeze 597

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: ""
  FETCH_LIVE_ODDS: "false"
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
  NFL_RUNTIME_WEEK: "1"

jobs:
  replay-playerform:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest

      - name: Download failed no-live Full Slate artifact
        uses: actions/download-artifact@v4
        with:
          name: run_34791136744
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34791136744

      - name: Restore exact failed run state
        run: |
          set -euo pipefail
          test -d replay_source/data
          test -d replay_source/outputs
          rm -rf data outputs
          mkdir -p data outputs
          cp -a replay_source/data/. data/
          cp -a replay_source/outputs/. outputs/
          test -s data/team_week_map.csv
          test -s data/roles_current_production_eligible_v1.csv
          python - <<'EOF'
          import pandas as pd
          r=pd.read_csv('data/roles_current_production_eligible_v1.csv')
          teams=sorted(r.team.astype(str).unique())
          assert teams == ['DAL','DEN','KC','NYG'], teams
          print('RESTORED_FAILED_CURRENT_UNIVERSE', teams, 'rows=', len(r))
          EOF
          echo "OFFLINE FOOTBALL REPLAY ONLY: no OddsAPI acquisition command exists in this workflow"

      - name: Re-run exact failed PlayerForm boundary with frozen Week 1
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'EOF'
          from scripts.runtime_context import resolve_week
          assert resolve_week() == 1
          print('FROZEN_RUNTIME_WEEK_PRE_PLAYERFORM_PASS', resolve_week())
          EOF
          python scripts/run_player_form_current_roles_v1.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}" --date "${SLATE_DATE}"
          python scripts/enrich_player_scoring_v2.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}" --date "${SLATE_DATE}"
          python - <<'EOF'
          import os, pandas as pd
          from scripts.runtime_context import resolve_week
          assert resolve_week() == 1
          logs=pd.read_csv('data/player_game_logs.csv')
          season=pd.to_numeric(logs.season,errors='coerce')
          week=pd.to_numeric(logs.week,errors='coerce')
          illegal=season.eq(int(os.environ['SEASON'])) & week.ge(int(os.environ['NFL_RUNTIME_WEEK']))
          if illegal.fillna(False).any():
              sample=logs.loc[illegal.fillna(False), ['season','week','player','team']].head(20).to_dict('records')
              raise SystemExit(f'FATAL: frozen Week-1 PlayerForm retained current/future history: {sample}')
          f=pd.read_csv('data/player_form_consensus.csv')
          teams=sorted(f.team.astype(str).unique())
          if teams != ['DAL','DEN','KC','NYG']:
              raise SystemExit(f'FATAL: PlayerForm current universe drifted: {teams}')
          print('PLAYERFORM_WEEK_FREEZE_REPLAY_PASS', {'week':resolve_week(),'history_rows':len(logs),'players':len(f),'teams':teams})
          EOF

      - name: Continue football-only downstream context through current-output seams
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_model_context_bridge.py
          python scripts/run_model_bayesian_bridge.py
          python scripts/run_model_ml_bridge.py
          python scripts/run_model_state_bridge.py
          python scripts/run_model_rules_bridge.py
          python scripts/run_model_ensemble_bridge.py
          python scripts/run_rb_week1_current_roles_v1.py --season "${SEASON}" --week "${NFL_RUNTIME_WEEK}" --iterations 25000 --out data/rb_rush_synthesis_context.csv
          python scripts/run_qb_distribution_state_context.py --season "${SEASON}" --week "${NFL_RUNTIME_WEEK}"
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python - <<'EOF'
          from scripts.runtime_context import resolve_week
          assert resolve_week() == 1
          print('DOWNSTREAM_FROZEN_WEEK1_CONTEXT_PASS')
          EOF

      - name: Strict repository audits
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict
