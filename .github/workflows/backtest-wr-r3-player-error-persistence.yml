name: WR-R3 Player Error Persistence

on:
  push:
    branches:
      - research-wr-r3-player-error-persistence
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen evaluator
        run: python -m py_compile scripts/backtest/evaluate_wr_r3_player_error_persistence.py
      - name: Download exact WR-R1 M38 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/wr_r1
          gh run download 34058453941 --repo "${GITHUB_REPOSITORY}" --name wr-r1-multiseason-2020-2025 --dir evidence/wr_r1
          test -s evidence/wr_r1/result/wr_r1_paired_wr_casebook.csv
      - name: Run frozen walk-forward individual-error persistence diagnostic
        run: |
          python scripts/backtest/evaluate_wr_r3_player_error_persistence.py --wr-r1-root evidence/wr_r1 --out-dir data/backtests/wr_r3_player_error_persistence
      - name: Show result
        if: always()
        run: |
          cat data/backtests/wr_r3_player_error_persistence/wr_r3_result.json 2>/dev/null || true
          cat data/backtests/wr_r3_player_error_persistence/wr_r3_metrics.csv 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-r3-player-error-persistence
          path: |
            data/backtests/wr_r3_player_error_persistence/*
            docs/migrations/WR_R3_PLAYER_ERROR_PERSISTENCE_PLAN.md
          if-no-files-found: warn
