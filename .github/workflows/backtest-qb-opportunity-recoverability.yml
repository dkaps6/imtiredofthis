name: Migration 73 QB Opportunity Recoverability

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/audit_qb_opportunity_recoverability.py'
      - 'scripts/backtest/audit_qb_efficiency_uncertainty.py'
      - '.github/workflows/backtest-qb-opportunity-recoverability.yml'
      - 'data/backtests/qb_frontier_canonical_v1/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scikit-learn

      - name: Frozen M73 scientific scope
        run: |
          echo 'M73 is diagnostic only and changes no production QB projection.'
          echo 'M73 loads immutable qb_frontier_canonical_v1 and does not rebuild M59-M72.'
          echo '2024/2025 are scored; 2023 is history only.'
          echo 'No sportsbook/player-prop/game-market field is used.'
          echo 'Primary oracle A: actual attempts x canonical implied predicted YPA.'
          echo 'Primary oracle B: predicted attempts x actual YPA.'
          echo 'Opportunity mechanisms: drives, plays/drive, dropback rate, attempt conversion, primary-QB share.'
          echo 'Expected mechanism baselines are prior-8 offense/opponent-allowed blends with a fixed 4-game league prior.'
          echo 'Large canonical attempt miss = 8+; extreme = 10+.'
          echo 'Attempt headroom: large >=8 passing-MAE yards, moderate >=4, otherwise limited.'
          echo 'A dominant M74 mechanism requires >=35% of 10+ misses and median absolute contribution >=3 attempts.'
          echo 'Drive-survival diagnostics: first-down rate, third-down conversion, early-down success, sack rate, turnovers/drive.'
          echo 'No candidate fitting, threshold sweep, or production promotion is permitted.'

      - name: Compile M73
        run: python -m py_compile scripts/backtest/audit_qb_opportunity_recoverability.py

      - name: Run M73
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/audit_qb_opportunity_recoverability.py \
            --canonical data/backtests/qb_frontier_canonical_v1/qb_frontier_canonical_v1.csv \
            --history-seasons 2023,2024,2025 \
            --out-dir data/backtests/qb_m73

      - name: Print M73 results
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_m73/m73_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- oracle summary ---'
          cat data/backtests/qb_m73/m73_oracle_summary.csv 2>/dev/null || true
          echo '--- mechanism summary ---'
          cat data/backtests/qb_m73/m73_mechanism_summary.csv 2>/dev/null || true
          echo '--- attempt bands ---'
          cat data/backtests/qb_m73/m73_attempt_band_summary.csv 2>/dev/null || true
          echo '--- drive survival ---'
          cat data/backtests/qb_m73/m73_drive_survival_summary.csv 2>/dev/null || true

      - name: Upload M73 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-73-qb-opportunity-recoverability
          path: data/backtests/qb_m73/*.csv
          if-no-files-found: warn
          retention-days: 14
