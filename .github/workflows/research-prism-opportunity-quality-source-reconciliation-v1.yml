name: Research PRISM Opportunity Quality Source Reconciliation V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_OPPORTUNITY_QUALITY_SOURCE_RECONCILIATION_V1_FREEZE.md'
      - 'scripts/research/reconcile_prism_opportunity_quality_source_v1.py'
      - 'tests/test_prism_opportunity_quality_source_reconciliation_v1.py'
      - '.github/workflows/research-prism-opportunity-quality-source-reconciliation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "b3d67fbb1840942dd80e9776f93c33fd230c732b"

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce exact source reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 535 --repo "${{ github.repository }}" --body 'PRISM opportunity-quality source reconciliation V1 started: run ${{ github.run_id }}, exact head ${{ github.sha }}. Exact finite-pool parity only; no predictive scoring, no sportsbook, no OddsAPI, no 2026 outcomes, no production mutation.'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Verify immutable reconciliation freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_OPPORTUNITY_QUALITY_SOURCE_RECONCILIATION_V1_FREEZE.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/reconcile_prism_opportunity_quality_source_v1.py" 2>/dev/null; then
            echo "ERROR: reconciliation implementation existed at freeze commit"
            exit 1
          fi
          grep -q 'tolerance \*\*0\*\*' docs/research/PRISM_OPPORTUNITY_QUALITY_SOURCE_RECONCILIATION_V1_FREEZE.md

      - name: Verify immutable parent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12085262613 --jq '.workflow_run.id')" = "38991429245"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12085262613 --jq '.digest')" = "sha256:77739799f34237538d7ffcba9715939c59d6a5b50f811f06f2f5836ff9deb31d"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12084992535 --jq '.workflow_run.id')" = "38991429809"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12084992535 --jq '.digest')" = "sha256:753dcc94db548b3be7e4da185d3c72cbc2c766bcf56520d6c99a213dfeff1ee8"

      - uses: actions/download-artifact@v4
        with:
          name: prism-opportunity-quality-team-high-value-volume-v1-38991429245
          path: /tmp/oq-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38991429245

      - uses: actions/download-artifact@v4
        with:
          name: prism-opportunity-quality-team-volume-v1-38991429809
          path: /tmp/oq-raw
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38991429809

      - name: Resolve source files
        run: |
          set -euo pipefail
          P_TEAM="$(find /tmp/oq-parent -type f -name 'prism_opportunity_quality_team_state.csv' -print -quit)"
          P_RESULT="$(find /tmp/oq-parent -type f -name 'prism_opportunity_quality_source_result.json' -print -quit)"
          R_TEAM="$(find /tmp/oq-raw -type f -name 'prism_opportunity_quality_teamgames.csv' -print -quit)"
          R_RESULT="$(find /tmp/oq-raw -type f -name 'prism_opportunity_quality_source_result.json' -print -quit)"
          for f in "$P_TEAM" "$P_RESULT" "$R_TEAM" "$R_RESULT"; do test -n "$f" && test -s "$f"; done
          echo "P_TEAM=$P_TEAM" >> "$GITHUB_ENV"
          echo "P_RESULT=$P_RESULT" >> "$GITHUB_ENV"
          echo "R_TEAM=$R_TEAM" >> "$GITHUB_ENV"
          echo "R_RESULT=$R_RESULT" >> "$GITHUB_ENV"

      - name: Run exact reconciliation safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/reconcile_prism_opportunity_quality_source_v1.py
          pytest -q tests/test_prism_opportunity_quality_source_reconciliation_v1.py

      - name: Reconcile finite team pools
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/oq-reconcile
          mkdir -p /tmp/oq-reconcile
          python scripts/research/reconcile_prism_opportunity_quality_source_v1.py             --parent-team-state "$P_TEAM"             --raw-teamgames "$R_TEAM"             --parent-result "$P_RESULT"             --raw-result "$R_RESULT"             --out-dir /tmp/oq-reconcile

      - name: Certify exact source integrity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/oq-reconcile/prism_opportunity_quality_source_reconciliation_result.json'))
          assert p['version']=='PRISM_OPPORTUNITY_QUALITY_SOURCE_RECONCILIATION_V1',p
          assert p['freeze_commit']=='b3d67fbb1840942dd80e9776f93c33fd230c732b',p
          assert p['predictive_candidates_scored']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PRISM_OPPORTUNITY_QUALITY_SOURCE_RECONCILED_READY_ALL',
              'PRISM_OPPORTUNITY_QUALITY_SOURCE_RECONCILIATION_BLOCKED',
          },p
          if p['disposition'].endswith('READY_ALL'):
              m=p['metrics']
              assert m['overlap_rows']==832,m
              assert m['left_only_rows']==0 and m['right_only_rows']==0,m
              assert m['mismatch_rows']==0,m
              assert m['exact_key_parity'] is True,m
              assert m['exact_field_parity'] is True,m
              assert all(v['max_abs_delta']==0 for v in m['field_metrics'].values()),m
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 reconciliation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/oq-reconcile/prism_opportunity_quality_source_reconciliation_result.json'))
          m=p.get('metrics',{})
          lines=[
              '### PRISM opportunity-quality source reconciliation V1',
              '',
              f"- Run: `{os.environ['RUN_ID']}`",
              f"- Exact head: `{os.environ['HEAD_SHA']}`",
              f"- Freeze: `{p['freeze_commit']}`",
              f"- Disposition: `{p['disposition']}`",
              f"- Overlap team-games: {m.get('overlap_rows','n/a')}",
              f"- Mismatch rows: {m.get('mismatch_rows','n/a')}",
              f"- Left/right-only keys: {m.get('left_only_rows','n/a')} / {m.get('right_only_rows','n/a')}",
          ]
          for field,v in (m.get('field_metrics') or {}).items():
              lines.append(f"- {field}: max abs delta={v['max_abs_delta']}; mismatch rows={v['mismatch_rows']}")
          lines += [
              '',
              'No predictive candidate was scored. This reconciles the raw finite-pool authority with Stage-2 entitlement compatibility only.',
              'Integrity: no sportsbook, no OddsAPI, no 2026 outcomes, no production mutation.',
          ]
          open('/tmp/oq_reconcile_issue.md','w').write('\n'.join(lines)+'\n')
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/oq_reconcile_issue.md

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-opportunity-quality-source-reconciliation-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/oq-reconcile/**
