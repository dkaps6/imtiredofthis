name: WR R19 Receiver Catchability Synthetic V1

on:
  push:
    branches:
      - research-wr-r19-receiver-catchability-v1
    paths:
      - 'scripts/research/evaluate_wr_r19_receiver_catchability_stage_a_v1.py'
      - 'scripts/research/test_wr_r19_receiver_catchability_synthetic_v1.py'
      - '.github/workflows/research-wr-r19-synthetic-v1.yml'
      - 'docs/research/WR_R19_RECEIVER_CATCHABILITY_V1_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R19 branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install synthetic-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Run WR-R19 synthetic mechanics
        run: python -m scripts.research.test_wr_r19_receiver_catchability_synthetic_v1
      - name: Prove no WR-R19 football output exists
        run: |
          test ! -e data/backtests/wr_r19_receiver_catchability_v1
          echo 'No WR-R19 football output directory exists: PASS'
