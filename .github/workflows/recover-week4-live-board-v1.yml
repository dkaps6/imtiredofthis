name: Recover Week4 Live Board From Paid Artifact V1

on:
  push:
    branches:
      - repair-week4-qb-starter-uncertainty-v1
    paths:
      - '.github/workflows/recover-week4-live-board-v1.yml'

permissions:
  contents: read
  actions: read

env:
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  FETCH_LIVE_ODDS: "true"
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
  SOURCE_RUN_ID: "36934563481"
  SOURCE_ARTIFACT_NAME: "run_36934563481"
  SOURCE_ARTIFACT_ID: "11197726111"
  SOURCE_ARTIFACT_DIGEST: "sha256:202aa5205e71ad0acedf1910f505c2b362f564d8593a0f82dd0928fb45175aae"

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest

      - name: Verify and restore exact paid Week4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY'
          import json, os
          meta=json.load(open('/tmp/artifacts.json'))
          want=int(os.environ['SOURCE_ARTIFACT_ID'])
          hits=[a for a in meta.get('artifacts',[]) if int(a.get('id',-1))==want]
          if len(hits)!=1: raise SystemExit(f'FATAL source artifact id not unique/present: {len(hits)}')
          a=hits[0]
          if a.get('name')!=os.environ['SOURCE_ARTIFACT_NAME']: raise SystemExit('FATAL source artifact name drift')
          if a.get('digest')!=os.environ['SOURCE_ARTIFACT_DIGEST']: raise SystemExit('FATAL source artifact digest drift')
          if a.get('expired'): raise SystemExit('FATAL source artifact expired')
          print('SOURCE_ARTIFACT_VERIFIED',a['id'],a['name'],a['digest'])
          PY
          rm -rf /tmp/source
          mkdir -p /tmp/source
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${SOURCE_ARTIFACT_NAME}" --dir /tmp/source
          test -s /tmp/source/outputs/props_priced_clean.csv
          test -s /tmp/source/data/qb_c2_production_integration_audit.csv
          cp data/manual_final_board_quarantine.csv /tmp/manual_final_board_quarantine.csv
          rm -rf data outputs
          cp -a /tmp/source/data ./data
          cp -a /tmp/source/outputs ./outputs
          cp /tmp/manual_final_board_quarantine.csv data/manual_final_board_quarantine.csv

      - name: Stamp QB lineage with Week4 final-board quarantines
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/stamp_qb_c2_pricing_lineage_v1.py
          test -s data/qb_c2_pricing_lineage_stamp_audit.json
          python - <<'PY'
          import json
          a=json.load(open('data/qb_c2_pricing_lineage_stamp_audit.json'))
          if a.get('disposition')!='QB_C2_PRICING_LINEAGE_STAMP_CERTIFIED':
              raise SystemExit(f'FATAL lineage stamp disposition: {a}')
          if int(a.get('quarantined_pass_yard_qbs',-1)) != 2:
              raise SystemExit(f'FATAL expected two quarantined QB identities: {a}')
          if int(a.get('quarantined_pass_yard_side_rows',-1)) != 6:
              raise SystemExit(f'FATAL expected six quarantined pass-yard side rows: {a}')
          print('QB_WEEK4_QUARANTINE_LINEAGE_PASS',a['quarantined_pass_yard_identities'])
          PY

      - name: Re-run certified downstream audits without sportsbook acquisition
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/validate_rb_rush_rec_conservation_v1.py
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_anytime_td_model_status_v1.py
          python scripts/validate_team_target_pool_full_universe_v2.py
          python scripts/validate_certified_full_slate_stack_v2.py

      - name: Apply Week4 final-board quarantine
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/quarantine_final_priced_props_v1.py
          test -s data/final_priced_props_quarantine_status.json
          python - <<'PY'
          import json
          s=json.load(open('data/final_priced_props_quarantine_status.json'))
          if int(s.get('rows_removed',0)) <= 0:
              raise SystemExit(f'FATAL Week4 quarantine removed no rows: {s}')
          print('FINAL_BOARD_QUARANTINE_PASS',s)
          PY

      - name: Strict repository audits
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict

      - name: Build recovered live Week4 workbook
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/build_master_betting_workbook_v1.py             --root .             --out outputs/NFL_BETTING_MODEL_MASTER.xlsx             --run-id "${GITHUB_RUN_ID}"             --sha "${GITHUB_SHA}"             --ref-name "${GITHUB_REF_NAME}"             --fetch-live-odds true
          test -s outputs/NFL_BETTING_MODEL_MASTER.xlsx
          python - <<'PY'
          import json, pandas as pd
          df=pd.read_csv('outputs/props_priced_clean.csv',low_memory=False)
          bad=df.loc[
              df['source_market'].astype(str).eq('player_pass_yds')
              & df['player'].astype(str).isin(['Tyson Bagent','Marcus Mariota'])
          ]
          if not bad.empty:
              raise SystemExit(f'FATAL unresolved Week4 backup-QB rows survived final board: {bad[["team","player"]].drop_duplicates().to_dict("records")}')
          audit=json.load(open('data/master_betting_workbook_audit.json'))
          if int(audit.get('priced_offer_rows',0)) <= 0:
              raise SystemExit(f'FATAL recovered workbook has zero priced rows: {audit}')
          print('RECOVERED_WEEK4_LIVE_BOARD_PASS',audit)
          PY

      - name: Upload recovered Week4 live board
        uses: actions/upload-artifact@v4
        with:
          name: week4-live-recovered-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            data/**
            outputs/**
