name: Verify Week 3 Identity Fix

# Reproduces the Full Slate step-28 identity-semantics failure against the
# odds already fetched and preserved by run 36275289734. No OddsAPI request
# is made here, so this costs no credits.

on:
  workflow_dispatch:
  push:
    branches: [claude/nice-cori-4qkwqs]
    paths: ['.github/workflows/diagnose-week3-identity-failure.yml']

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '36275289734'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the preserved paid run
        run: |
          set -euo pipefail
          rm -rf /tmp/fs && mkdir -p /tmp/fs
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "run_${SOURCE_RUN_ID}" --dir /tmp/fs
          cp -r /tmp/fs/data/. data/ 2>/dev/null || true
          mkdir -p outputs && cp -r /tmp/fs/outputs/. outputs/ 2>/dev/null || true
          echo "restored: $(find /tmp/fs -type f | wc -l) files"

      - name: Reproduce the identity-semantics validator
        run: |
          set +e
          export PYTHONPATH="${PWD}"
          python scripts/validate_player_identity_semantics_v1.py 2>&1 | tail -60
          echo "=== exit code: ${PIPESTATUS[0]} ==="

      - name: Re-materialize the compact boundary with the roster-presence rule
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          # Clear the idempotent-reuse short circuit so the rule actually runs
          # against the preserved provider rows rather than replaying the
          # compact layer the failed run already wrote.
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/live_odds_status.json")
          s = json.loads(p.read_text())
          s.pop("production_compact_disposition", None)
          p.write_text(json.dumps(s, indent=2, sort_keys=True) + "\n")
          print("cleared production_compact_disposition for a real re-materialization")
          EOF
          python scripts/materialize_live_props_for_model_v1.py
          python - <<'EOF'
          import pandas as pd
          q = pd.read_csv("data/live_odds_placeholder_rows.csv")
          print("quarantine reasons:", q["quarantine_reason"].value_counts().to_dict())
          un = q[q["quarantine_reason"].eq("UNROSTERED_NONCORE_PLAYER")]
          print(f"\nunrostered non-core rows: {len(un)}")
          if len(un):
              cols = [c for c in ("player","team_abbr","market") if c in un.columns]
              print(un[cols].drop_duplicates().to_string(index=False))
          c = pd.read_csv("outputs/props_raw_compact.csv")
          print(f"\nmodel-facing compact rows: {len(c)}")
          EOF

      - name: The gate that killed the paid run must now pass
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/validate_player_identity_semantics_v1.py
          test -s data/player_identity_semantic_audit.json
          echo "IDENTITY_AUDIT_PASSES_WITH_FIX"
