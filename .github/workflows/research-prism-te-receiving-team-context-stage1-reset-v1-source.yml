name: Research PRISM TE Receiving Team Context Stage1 Reset V1 Source

on:
  push:
    branches: [research-individual-opportunity-roadmap-2026-10-08]
    paths:
      - 'docs/research/PRISM_TE_RECEIVING_TEAM_CONTEXT_STAGE1_PARTICIPATION_AUTHORITY_RESET_V1_SOURCE_FREEZE.md'
      - 'scripts/research/audit_prism_te_receiving_team_context_stage1_participation_authority_reset_v1_source.py'
      - 'tests/test_prism_te_receiving_team_context_stage1_participation_authority_reset_v1_source.py'
      - '.github/workflows/research-prism-te-receiving-team-context-stage1-reset-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FREEZE_COMMIT: "37dc741d23fea0e030d03c33e8b63c094efb710f"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy pytest pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_TE_RECEIVING_TEAM_CONTEXT_STAGE1_PARTICIPATION_AUTHORITY_RESET_V1_SOURCE_FREEZE.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_te_receiving_team_context_stage1_participation_authority_reset_v1_source.py" 2>/dev/null; then
            echo "ERROR: source auditor existed at freeze"
            exit 1
          fi

      - name: Verify immutable parents
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12156204035 --jq '.workflow_run.id')" = "39182076127"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12156204035 --jq '.digest')" = "sha256:abc2a5b9d3ea2a4d683e56626ea2d33495fa1e7cad2c36c56c01071ccc0339c8"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12070774378 --jq '.workflow_run.id')" = "38957575645"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12070774378 --jq '.digest')" = "sha256:e07edbad1bf97a4917ba95c58156c8941448e7b2668bd0eae2e9bcad5d4945b0"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12049120604 --jq '.workflow_run.id')" = "38907459996"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12049120604 --jq '.digest')" = "sha256:41b1acd3f1b8d77abb53980db160ece32f8fc40351939d4827248b9caad0c64b"

      - uses: actions/download-artifact@v4
        with:
          name: prism-player-team-context-transition-v1-source-39182076127
          path: /tmp/team-context
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 39182076127

      - uses: actions/download-artifact@v4
        with:
          name: player-active-role-conditional-allocation-bridge-v1-38957575645
          path: /tmp/te-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38957575645

      - uses: actions/download-artifact@v4
        with:
          name: player-active-role-participation-mechanism-v1-38907459996
          path: /tmp/stage1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38907459996

      - name: Resolve source files
        run: |
          set -euo pipefail
          EVENTS="$(find /tmp/team-context -type f -name 'player_team_context_transition_events.csv' -print -quit)"
          STATES="$(find /tmp/team-context -type f -name 'player_team_context_states.csv' -print -quit)"
          PARENT="$(find /tmp/te-parent -type f -name 'active_role_conditional_allocation_bridge_player_rows.csv' -print -quit)"
          STAGE1="$(find /tmp/stage1 -type f -name 'player_active_role_mechanism_scored_rows.csv' -print -quit)"
          test -s "$EVENTS" && test -s "$STATES" && test -s "$PARENT" && test -s "$STAGE1"
          echo "EVENTS=$EVENTS" >> "$GITHUB_ENV"
          echo "STATES=$STATES" >> "$GITHUB_ENV"
          echo "PARENT=$PARENT" >> "$GITHUB_ENV"
          echo "STAGE1=$STAGE1" >> "$GITHUB_ENV"

      - name: Compile and focused tests
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          python -m py_compile scripts/research/audit_prism_te_receiving_team_context_stage1_participation_authority_reset_v1_source.py
          pytest -q tests/test_prism_te_receiving_team_context_stage1_participation_authority_reset_v1_source.py

      - name: Execute source audit
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          rm -rf /tmp/te-reset && mkdir -p /tmp/te-reset/out
          python scripts/research/audit_prism_te_receiving_team_context_stage1_participation_authority_reset_v1_source.py \
            --team-context-events "$EVENTS" \
            --team-context-states "$STATES" \
            --te-parent-rows "$PARENT" \
            --stage1-mechanism-rows "$STAGE1" \
            --out-dir /tmp/te-reset/out

      - name: Certify source contract
        run: |
          python - <<'PY'
          import json, pandas as pd
          b='/tmp/te-reset/out'
          p=json.load(open(f'{b}/te_receiving_team_context_stage1_reset_source_result.json'))
          r=pd.read_csv(f'{b}/te_receiving_team_context_stage1_reset_source_rows.csv')
          assert p['freeze_commit']=='37dc741d23fea0e030d03c33e8b63c094efb710f',p
          assert p['disposition']=='PRISM_TE_RECEIVING_TEAM_CONTEXT_STAGE1_PARTICIPATION_AUTHORITY_RESET_V1_SOURCE_READY',p
          assert p['eligible_team_context_transitions']==130,p
          assert p['selected_first_market_rows']==71,p
          assert p['source_exclusions']=={'NO_CANONICAL_TE_RECEIVING_BASELINE':59},p
          assert p['parent_state_link_hits']==2639 and p['parent_state_link_attempts']==2639,p
          assert p['per_season']['2024']['selected_market_rows']==33,p
          assert p['per_season']['2024']['distinct_stable_ids']==32,p
          assert p['per_season']['2024']['actionable_reset_rows']==17,p
          assert p['per_season']['2024']['actionable_reset_stable_ids']==17,p
          assert p['per_season']['2025']['selected_market_rows']==38,p
          assert p['per_season']['2025']['distinct_stable_ids']==36,p
          assert p['per_season']['2025']['actionable_reset_rows']==18,p
          assert p['per_season']['2025']['actionable_reset_stable_ids']==18,p
          assert all(p['source_gates'].values()),p['source_gates']
          assert r['stage1_candidate_matches_current'].all()
          assert r['stage1_support_flag_matches_exact_row'].all()
          assert not r['canonical_zero_share'].any()
          assert p['predictive_outcomes_read_or_scored']==0
          assert p['target_game_opportunity_counts_read']==0
          assert p['names_read_or_used']==0
          assert p['production_changed'] is False
          PY

      - name: Strict repository audit
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json,os
          p=json.load(open('/tmp/te-reset/out/te_receiving_team_context_stage1_reset_source_result.json'))
          print("### PRISM TE receiving team-context Stage-1 participation authority reset V1 — source audit")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          print(f"- Qualified TE parent -> team-context exact raw-ID lineage: {p['parent_state_link_hits']}/{p['parent_state_link_attempts']} ({p['parent_state_link_rate']:.2%})")
          print(f"- Source-certified transitions considered: {p['eligible_team_context_transitions']}")
          print(f"- First canonical post-change TE-receiving rows: {p['selected_first_market_rows']}")
          for season in ('2024','2025'):
              s=p['per_season'][season]
              print(f"- {season}: selected {s['selected_market_rows']} / IDs {s['distinct_stable_ids']} / actionable reset {s['actionable_reset_rows']} rows and {s['actionable_reset_stable_ids']} IDs")
          print(f"- Failed source gates: {[k for k,v in p['source_gates'].items() if not v] or ['NONE']}")
          print()
          print("Source/identity only. No predictive outcomes, target-game opportunity counts, names, sportsbook/OddsAPI, fit, threshold search or production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload immutable source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-te-receiving-team-context-stage1-reset-v1-source-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/te-reset/out/**
