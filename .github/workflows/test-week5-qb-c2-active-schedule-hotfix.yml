name: Week5 QB C2 Active Schedule Hotfix Gate

on:
  push:
    branches:
      - hotfix/week5-qb-c2-active-team-context-20261008
  pull_request:
    branches: [main]
    paths:
      - 'scripts/utils/qb_c2_active_team_context_v1.py'
      - 'scripts/run_qb_distribution_state_context.py'
      - 'scripts/operations/apply_qb_c2_active_schedule_context_seam_v1.py'
      - 'tests/test_qb_c2_active_team_context_v1.py'
      - 'scripts/validate_full_slate_data_quality_v1.py'
      - 'tests/test_full_slate_data_quality_scope.py'
      - '.github/workflows/full-slate.yml'
      - '.github/workflows/test-week5-qb-c2-active-schedule-hotfix.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==1.5.3 pytest pyyaml
      - name: Source-only compile and no-bye / bye-week tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/utils/qb_c2_active_team_context_v1.py scripts/run_qb_distribution_state_context.py scripts/operations/apply_qb_c2_active_schedule_context_seam_v1.py
          pytest -q tests/test_qb_c2_active_team_context_v1.py tests/test_full_slate_data_quality_scope.py
      - name: Verify original availability seams precede C2 source seam
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python scripts/operations/apply_qb_c2_active_schedule_context_seam_v1.py
          python -m py_compile scripts/modeling/qb_c2_production_adapter_v1.py
          grep -q 'active_context_audit = validate_qb_c2_state_context' scripts/modeling/qb_c2_production_adapter_v1.py
          test "$(grep -c 'QB C2 state context must cover exactly 32 teams' scripts/modeling/qb_c2_production_adapter_v1.py || true)" -eq 0
      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
