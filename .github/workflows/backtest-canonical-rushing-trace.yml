name: 2025 Canonical Rushing Path Trace

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks to trace (for example 1-18)"
        required: false
        default: "1-18"
      iterations:
        description: "MC iterations for canonical walk-forward and trace"
        required: false
        default: "2000"

jobs:
  trace-canonical-rushing:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib
      - name: Build leakage-safe historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --out-dir data/backtests
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests/historical_defense_enrichment_audit.csv --observations data/backtests/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --data-dir data/backtests --report data/backtests/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule data/backtests/schedule_history.csv --out data/backtests/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/schedule_history.csv --out data/backtests/weather_history.csv
      - name: Run canonical walk-forward at full validation settings
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f data/backtests/component_predictions.csv
          python scripts/backtest/walk_forward.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out data/backtests/component_predictions.csv --iterations "${{ inputs.iterations || '2000' }}"
      - name: Trace canonical MC rushing path
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/canonical_rushing_trace
          python scripts/backtest/trace_canonical_rushing_path.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.iterations || '2000' }}" --predictions data/backtests/component_predictions.csv --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out-dir data/backtests/canonical_rushing_trace
      - name: Show Migration 26 results
        if: always()
        run: |
          echo "Canonical rushing stage summary:"
          cat data/backtests/canonical_rushing_trace/canonical_rushing_stage_summary.csv 2>/dev/null || true
          echo "Canonical rushing divergence summary:"
          cat data/backtests/canonical_rushing_trace/canonical_rushing_divergence_summary.csv 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('data/backtests/canonical_rushing_trace/canonical_rushing_player_trace.csv')
          if p.exists():
              x=pd.read_csv(p)
              cols=[c for c in ['week','team','player','position','actual','component_mc_proj','rebuilt_mc_proj','direct_lookup_mean','sim_deterministic_player_carries','rush_att_row_rush_share','sim_selected_market','sim_selected_rush_share','sim_used_rush_share','abs_component_vs_rebuilt','abs_rebuilt_vs_direct','abs_rushrow_vs_selected_share'] if c in x.columns]
              print('\nLargest canonical-vs-deterministic gaps:')
              x['gap']=pd.to_numeric(x.get('component_mc_proj'),errors='coerce')-pd.to_numeric(x.get('sim_deterministic_player_carries'),errors='coerce')
              print(x.loc[x.gap.abs().sort_values(ascending=False).index,cols+['gap']].head(30).to_string(index=False))
          PY
      - name: Upload Migration 26 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-26-canonical-rushing-trace
          path: |
            data/backtests/historical_input_validation.csv
            data/backtests/component_predictions.csv
            data/backtests/canonical_rushing_trace/*.csv
          if-no-files-found: warn
          retention-days: 14
