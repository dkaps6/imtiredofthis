name: Offline Replay Week3 Paid Artifact Ertz Quarantine V2

on:
  push:
    branches: [ops-week3-ertz-offline-replay-v2]
    paths:
      - '.github/workflows/replay-week3-paid-artifact-ertz-quarantine-v2.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: "2026-09-27"
  FETCH_LIVE_ODDS: "false"
  FULL_SLATE_SOURCE_RUN_ID: "36292654942"
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest
      - name: Restore preserved paid run without refetching OddsAPI
        run: |
          set -euo pipefail
          cp data/manual_prop_quarantine.csv /tmp/manual_prop_quarantine.csv
          rm -rf replay_source
          mkdir -p replay_source
          gh run download "${FULL_SLATE_SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "run_${FULL_SLATE_SOURCE_RUN_ID}" --dir replay_source
          test -d replay_source/data
          test -d replay_source/outputs
          rm -rf data outputs
          mkdir -p data outputs
          cp -a replay_source/data/. data/
          cp -a replay_source/outputs/. outputs/
          cp /tmp/manual_prop_quarantine.csv data/manual_prop_quarantine.csv
          test -s data/live_prop_identity_status.json
          python - <<'PY'
          import json
          s=json.load(open('data/live_prop_identity_status.json',encoding='utf-8'))
          assert s.get('disposition')=='LIVE_PROP_IDENTITY_FAILURE',s
          assert s.get('core_unresolved_players')==['Zach Ertz'],s
          assert int(s.get('core_unresolved_rows',-1))==2,s
          print('PRESERVED_PAID_FAILURE_REPRODUCED',s['core_unresolved_players'],s['core_unresolved_rows'])
          PY
          echo "OFFLINE_REPLAY_ONLY source_run=${FULL_SLATE_SOURCE_RUN_ID}"
      - name: Apply verified pre-model Ertz quarantine and repair identity
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/repair_live_prop_identity_v1.py
          python - <<'PY'
          import json,pandas as pd
          s=json.load(open('data/live_prop_identity_status.json',encoding='utf-8'))
          assert s.get('disposition')=='LIVE_PROP_IDENTITY_READY',s
          assert int(s.get('core_unresolved_rows',-1))==0,s
          q=s.get('manual_prop_quarantine_rows_removed',{})
          assert int(q.get('compact',0))>0 and int(q.get('raw',0))>0,s
          p=pd.read_csv('outputs/props_raw.csv',low_memory=False)
          col=next(c for c in ('canonical_player_name','player_canonical','player','player_name_raw') if c in p.columns)
          assert not p[col].astype(str).str.strip().eq('Zach Ertz').any()
          print('ERTZ_VERIFIED_PREMODEL_QUARANTINE_PASS',q)
          PY
      - name: Stamp offline live-odds status
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'PY'
          import json,os
          import pandas as pd
          from pathlib import Path
          hard=json.load(open('data/live_odds_artifact_hardening.json',encoding='utf-8'))
          ident=json.load(open('data/live_prop_identity_status.json',encoding='utf-8'))
          props=pd.read_csv('outputs/props_raw.csv',low_memory=False)
          games=pd.read_csv('outputs/odds_game.csv',low_memory=False)
          pcol=next(c for c in ('canonical_player_name','player_canonical','player') if c in props.columns)
          actual=int(props[pcol].astype('string').fillna('').str.strip().ne('').sum())
          events=int(games['event_id'].astype(str).nunique()) if 'event_id' in games.columns else 0
          payload={
            'status':'available','available':True,'season':2026,'week':3,'slate_date':'2026-09-27',
            'active_game_count':events,'active_event_count':events,'actual_prop_rows':actual,
            'game_odds_rows':int(len(games)),'fetch_returncode':0,
            'artifact_hardening_disposition':hard.get('disposition','missing'),
            'game_identity_event_count':int(hard.get('game_identity_event_count',0)),
            'provider_source_duplicate_rows':int(hard.get('provider_source_duplicate_rows',0)),
            'raw_artifact_exact_duplicates_removed':int(hard.get('raw_artifact_exact_duplicates_removed',0)),
            'grouped_offer_entries_removed':int(hard.get('grouped_offer_entries_removed',0)),
            'blank_name_sentinels_removed':int(hard.get('blank_name_sentinels_removed',0)),
            'unresolved_real_player_names':int(hard.get('unresolved_real_player_names',0)),
            'core_prop_identity_disposition':ident.get('disposition','missing'),
            'core_prop_identity_unresolved_rows':int(ident.get('core_unresolved_rows',0)),
            'core_prop_identity_rows':int(ident.get('core_actual_rows',0)),
            'replay_source_run':int(os.environ['FULL_SLATE_SOURCE_RUN_ID']),
            'odds_api_refetched':False,
            'replay_mode':'OFFLINE_PRESERVED_PAID_ARTIFACT_AFTER_VERIFIED_PREMODEL_QUARANTINE'
          }
          Path('data/live_odds_status.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY
      - name: Materialize certified live sportsbook boundary
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/materialize_live_props_for_model_v1.py
          test -s outputs/props_raw_compact.csv
          test -s data/live_odds_placeholder_rows.csv
          python - <<'PY'
          import json,pandas as pd
          s=json.load(open('data/live_odds_status.json',encoding='utf-8'))
          c=pd.read_csv('outputs/props_raw_compact.csv',low_memory=False)
          assert s.get('production_compact_disposition')=='MODEL_LIVE_PROPS_READY',s
          assert int(s.get('production_compact_rows',-1))==len(c),s
          assert not c['player'].astype(str).str.strip().eq('Zach Ertz').any()
          print('MODEL_LIVE_PROPS_READY',len(c),s.get('production_quarantine_reasons'))
          PY
      - name: Validate live identity and data quality
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('data/opponent_map_from_props.csv')
          if df.empty or df['team'].isna().any() or df['opponent'].isna().any():
              raise SystemExit('FATAL: unresolved opponent map')
          print('opponent map OK rows=',len(df))
          PY
          python scripts/validate_player_identity_semantics_v1.py
          test -s data/player_identity_semantic_audit.json
          python scripts/validate_full_slate_data_quality_v1.py
          test -s data/full_slate_data_quality_audit.json
      - name: Assemble exact offers and deterministic metrics
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/materialize_pricing_offers_v1.py
          test -s outputs/props_pricing_offers.csv
          test -s data/live_pricing_offer_audit.json
          python scripts/run_metrics_context.py --season "${SEASON}" --mode full --date "${SLATE_DATE}"
          python scripts/validate_build_integrity.py
          python scripts/metrics_ready.py --season "${SEASON}" --date "${SLATE_DATE}"
          test -s data/metrics_ready.csv
      - name: Price from preserved certified football-first stack
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          python scripts/stamp_qb_c2_pricing_lineage_v1.py
          python scripts/validate_rb_rush_rec_conservation_v1.py
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_anytime_td_model_status_v1.py
          python scripts/validate_team_target_pool_full_universe_v2.py
          python scripts/validate_certified_full_slate_stack_v2.py
          python scripts/validate_full_slate_mechanical_certification_v1.py
          test -s outputs/paid_full_slate_replay_result.json
      - name: Final-board quarantine and strict audits
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/quarantine_final_priced_props_v1.py
          test -s data/final_priced_props_quarantine_status.json
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict
      - name: Build master betting workbook
        if: always()
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          mkdir -p outputs
          python scripts/build_master_betting_workbook_v1.py --root . --out outputs/NFL_BETTING_MODEL_MASTER.xlsx --run-id "${GITHUB_RUN_ID}" --sha "${GITHUB_SHA}" --ref-name "${GITHUB_REF_NAME}" --fetch-live-odds true
          test -s outputs/NFL_BETTING_MODEL_MASTER.xlsx
      - name: Upload offline replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week3_paid_offline_replay_${{ github.run_id }}
          path: |
            data/live_odds_status.json
            data/live_prop_identity_status.json
            data/live_prop_identity_audit.csv
            data/live_odds_placeholder_rows.csv
            data/player_identity_semantic_audit.csv
            data/player_identity_semantic_audit.json
            data/full_slate_data_quality_audit.csv
            data/full_slate_data_quality_audit.json
            data/live_pricing_offer_audit.json
            data/metrics_ready.csv
            data/certified_full_slate_stack_audit.json
            data/full_slate_post_pricing_audit.csv
            data/final_priced_props_quarantine_status.json
            outputs/props_raw_compact.csv
            outputs/props_pricing_offers.csv
            outputs/props_priced_clean.csv
            outputs/paid_full_slate_replay_result.json
            outputs/NFL_BETTING_MODEL_MASTER.xlsx
          if-no-files-found: warn
          retention-days: 7
