name: Migration 61 QB Attempt Trust Stack

on:
  workflow_dispatch:
    inputs:
      weeks: {description: "Regular-season weeks", required: false, default: "1-18"}
      iterations: {description: "Canonical MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-61-qb-attempt-trust-stack'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib pyarrow

      - name: Declare Migration 61 scope and frozen gates
        run: |
          echo "Migration 61 returns primary focus to REAL FOOTBALL PROJECTION accuracy."
          echo "Hypothesis: raw attempt corrections contain useful range signal, but require selective trust rather than a global cap/shrink rule."
          echo "Method: second-stage Ridge, nonlinear Huber-GBR, and 50/50 consensus trained only on PRIOR OOS capped/raw predictions plus pregame QB attempt stability/context."
          echo "All M61 candidates use M53 capped/shrunk contextual YPA to isolate the ATTEMPTS mechanism."
          echo "Vegas player-prop lines are downstream evaluation only and are NEVER model features or promotion gates."
          echo "2024/2025 development only. Consumed 2023 holdout is NOT rescored."
          echo "Frozen football gates vs attempts_raw_only reference:"
          echo "1) combined stable-QB pass-yard MAE improves >= 0.75 yards"
          echo "2) pass-yard MAE non-worse in BOTH 2024 and 2025"
          echo "3) combined pass-yard correlation improves >= 0.02"
          echo "4) combined pass-yard RMSE improves >= 0.25 yards"
          echo "5) combined 100+ misses do not increase AND 100+ overprojections fall by >=3"
          echo "6) combined ATTEMPTS MAE improves >=0.20 attempts AND attempts correlation improves >=0.02"
          echo "7) candidate wins MAE in at least 16 of 29 paired season-weeks"
          echo "8) collateral-market MAE regression <=1% for rec yards, receptions, rush attempts, rush yards, rush+rec yards"
          echo "Passing the gates means DEVELOPMENT CANDIDATE / 2026 shadow eligible, not historical holdout promotion."

      - name: Build and score Migration 61 canonical candidates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          WEEKS="${{ github.event.inputs.weeks || '1-18' }}"
          ITERATIONS="${{ github.event.inputs.iterations || '2000' }}"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_attempt_trust_stack/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"
            python scripts/backtest/fit_qb_attempt_trust_stack_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_attempt_trust_stack"

            python scripts/backtest/validate_qb_attempt_trust_stack_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --trust-trace "$D/qb_attempt_trust_stack/qb_attempt_trust_stack_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m61_mc"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Combine seasons and apply frozen football gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root=Path('data/backtests/qb_attempt_trust_stack'); out=root/'summary'; out.mkdir(parents=True,exist_ok=True)
          by=[]; stable=[]; allrows=[]; trust=[]
          for s in (2024,2025):
              d=root/str(s)
              by.append(pd.read_csv(d/'m61_mc/qb_attempt_trust_stack_mc_summary.csv'))
              stable.append(pd.read_csv(d/'m61_mc/qb_attempt_trust_stack_mc_stable.csv'))
              allrows.append(pd.read_csv(d/'m61_mc/qb_attempt_trust_stack_mc_trace.csv'))
              q=pd.read_csv(d/'qb_attempt_trust_stack/qb_attempt_trust_stack_trace.csv'); q['season']=s; trust.append(q)
          by=pd.concat(by,ignore_index=True); stable=pd.concat(stable,ignore_index=True); allrows=pd.concat(allrows,ignore_index=True); trust=pd.concat(trust,ignore_index=True)
          by.to_csv(out/'migration61_by_season_summary.csv',index=False)

          def met(g):
              a=pd.to_numeric(g.actual,errors='coerce'); p=pd.to_numeric(g.mc_proj,errors='coerce')
              z=pd.DataFrame({'a':a,'p':p}).dropna(); e=z.p-z.a
              return {'n':len(z),'mae':float(e.abs().mean()),'rmse':float(np.sqrt(np.mean(e*e))),'bias':float(e.mean()),'correlation':float(z.p.corr(z.a)),'catastrophic_100plus':int(e.abs().ge(100).sum()),'under_100plus':int(e.le(-100).sum()),'over_100plus':int(e.ge(100).sum())}
          combined=[]
          for c,g in stable.groupby('candidate'): combined.append({'candidate':c,'slice':'stable_qb','market':'pass_yards',**met(g)})
          for (c,m),g in allrows.groupby(['candidate','market']): combined.append({'candidate':c,'slice':'all_available','market':m,**met(g)})
          combined=pd.DataFrame(combined); combined.to_csv(out/'migration61_combined_summary.csv',index=False)

          stack_names=['stack_ridge','stack_gbr','stack_consensus']
          st=combined[(combined['slice']=='stable_qb')&(combined.market=='pass_yards')]
          ref=st[st.candidate=='attempts_raw_only'].iloc[0]
          candidates=st[st.candidate.isin(stack_names)].sort_values(['mae','rmse','correlation'],ascending=[True,True,False])
          best=candidates.iloc[0]; best_name=str(best.candidate)

          # Direct attempt metrics on the exact OOS trust trace.
          def att_metrics(pred_col):
              a=pd.to_numeric(trust.actual_pass_att,errors='coerce'); p=pd.to_numeric(trust[pred_col],errors='coerce')
              z=pd.DataFrame({'a':a,'p':p}).dropna(); e=z.p-z.a
              return {'mae':float(e.abs().mean()),'rmse':float(np.sqrt(np.mean(e*e))),'bias':float(e.mean()),'correlation':float(z.p.corr(z.a)),'n':len(z)}
          amap={'stack_ridge':'attempts_stack_ridge','stack_gbr':'attempts_stack_gbr','stack_consensus':'attempts_stack_consensus'}
          att_ref=att_metrics('attempts_raw'); att_best=att_metrics(amap[best_name])
          pd.DataFrame([{'candidate':'attempts_raw_only',**att_ref},{'candidate':best_name,**att_best}]).to_csv(out/'migration61_attempt_metrics.csv',index=False)

          season_ok=True; season_detail=[]
          for s in (2024,2025):
              z=by[(by.season==s)&(by['slice']=='stable_qb')&(by.market=='pass_yards')]
              r=z[z.candidate=='attempts_raw_only'].iloc[0]; c=z[z.candidate==best_name].iloc[0]
              gain=float(r.mae-c.mae); season_ok &= gain>=0
              season_detail.append(f'{s}:{r.mae:.3f}->{c.mae:.3f} ({gain:+.3f})')

          # Paired season-week wins.
          week_rows=[]
          for (s,w),g in stable.groupby(['season','week']):
              vals={}
              for c,cg in g.groupby('candidate'):
                  e=(pd.to_numeric(cg.mc_proj,errors='coerce')-pd.to_numeric(cg.actual,errors='coerce')).abs(); vals[c]=float(e.mean())
              if 'attempts_raw_only' in vals and best_name in vals:
                  week_rows.append({'season':int(s),'week':int(w),'reference_mae':vals['attempts_raw_only'],'candidate_mae':vals[best_name],'improvement':vals['attempts_raw_only']-vals[best_name]})
          weeks=pd.DataFrame(week_rows); weeks.to_csv(out/'migration61_paired_weekly.csv',index=False)
          weeks_won=int((weeks.improvement>0).sum())

          gates=[]
          def gate(name,passed,detail): gates.append({'gate':name,'passed':bool(passed),'detail':detail})
          mae_gain=float(ref.mae-best.mae); corr_gain=float(best.correlation-ref.correlation); rmse_gain=float(ref.rmse-best.rmse)
          gate('combined_mae_gain_ge_0_75',mae_gain>=0.75,f'{ref.mae:.4f}->{best.mae:.4f}; gain={mae_gain:.4f}')
          gate('both_seasons_mae_nonworse',season_ok,' '.join(season_detail))
          gate('combined_correlation_gain_ge_0_02',corr_gain>=0.02,f'{ref.correlation:.4f}->{best.correlation:.4f}; gain={corr_gain:.4f}')
          gate('combined_rmse_gain_ge_0_25',rmse_gain>=0.25,f'{ref.rmse:.4f}->{best.rmse:.4f}; gain={rmse_gain:.4f}')
          gate('catastrophic_nonworse_and_over_down_3',int(best.catastrophic_100plus)<=int(ref.catastrophic_100plus) and int(best.over_100plus)<=int(ref.over_100plus)-3,f'cats {int(ref.catastrophic_100plus)}->{int(best.catastrophic_100plus)}; over {int(ref.over_100plus)}->{int(best.over_100plus)}')
          att_mae_gain=float(att_ref['mae']-att_best['mae']); att_corr_gain=float(att_best['correlation']-att_ref['correlation'])
          gate('attempt_mae_gain_ge_0_20_and_corr_ge_0_02',att_mae_gain>=0.20 and att_corr_gain>=0.02,f'MAE {att_ref["mae"]:.4f}->{att_best["mae"]:.4f} gain={att_mae_gain:.4f}; corr {att_ref["correlation"]:.4f}->{att_best["correlation"]:.4f} gain={att_corr_gain:.4f}')
          gate('paired_weeks_won_ge_16',weeks_won>=16,f'wins={weeks_won}/{len(weeks)}')

          collateral=['rec_yards','receptions','rush_att','rush_yards','rush_rec_yards']; collateral_ok=True; details=[]
          aa=combined[combined['slice']=='all_available']
          for market in collateral:
              r=aa[(aa.market==market)&(aa.candidate=='attempts_raw_only')]; c=aa[(aa.market==market)&(aa.candidate==best_name)]
              if len(r)!=1 or len(c)!=1: raise RuntimeError(f'missing collateral {market}')
              rm=float(r.iloc[0].mae); cm=float(c.iloc[0].mae); reg=(cm/rm-1.0) if rm else 0.0
              collateral_ok &= reg<=0.01; details.append(f'{market}:{reg*100:+.3f}%')
          gate('collateral_mae_regression_lte_1pct',collateral_ok,' '.join(details))

          verdict=pd.DataFrame(gates); verdict['selected_candidate']=best_name; verdict['migration61_all_gates_pass']=bool(verdict.passed.all()); verdict['status']=np.where(verdict['migration61_all_gates_pass'],'development_candidate_2026_shadow_eligible','hold')
          verdict.to_csv(out/'migration61_precommitted_verdict.csv',index=False)
          print('=== M61 SELECTED DEVELOPMENT CANDIDATE ==='); print(best_name)
          print('\n=== M61 COMBINED ==='); print(combined.to_string(index=False))
          print('\n=== M61 ATTEMPTS ==='); print(pd.DataFrame([{'candidate':'attempts_raw_only',**att_ref},{'candidate':best_name,**att_best}]).to_string(index=False))
          print('\n=== M61 FROZEN GATES ==='); print(verdict.to_string(index=False))
          print('\nM61:', 'DEVELOPMENT PASS / 2026 SHADOW ELIGIBLE' if verdict.passed.all() else 'HOLD')
          PY

      - name: Run free downstream Vegas benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p data/backtests/qb_attempt_trust_stack/market data/backtests/qb_attempt_trust_stack/market_summary
          python scripts/backtest/prepare_free_qb_prop_archive.py \
            --projection-file data/backtests/qb_attempt_trust_stack/2024/m61_mc/m61_qb_projection_wide_2024.csv \
            --projection-file data/backtests/qb_attempt_trust_stack/2025/m61_mc/m61_qb_projection_wide_2025.csv \
            --out-dir data/backtests/qb_attempt_trust_stack/market
          STATUS=$(python - <<'PY'
          import pandas as pd
          x=pd.read_csv('data/backtests/qb_attempt_trust_stack/market/m60b_free_source_status.csv'); print(str(x.iloc[-1].status))
          PY
          )
          echo "M61 free market source status=$STATUS"
          if [ "$STATUS" = "complete" ]; then
            python scripts/backtest/grade_qb_vegas_benchmark_dynamic.py \
              --projection-file data/backtests/qb_attempt_trust_stack/2024/m61_mc/m61_qb_projection_wide_2024.csv \
              --projection-file data/backtests/qb_attempt_trust_stack/2025/m61_mc/m61_qb_projection_wide_2025.csv \
              --props data/backtests/qb_attempt_trust_stack/market/m60b_historical_qb_pass_props.csv \
              --out-dir data/backtests/qb_attempt_trust_stack/market_summary --min-coverage 0.70
          fi

      - name: Show Migration 61 results
        if: always()
        run: |
          echo '--- verdict ---'; cat data/backtests/qb_attempt_trust_stack/summary/migration61_precommitted_verdict.csv 2>/dev/null || true
          echo '--- combined football ---'; cat data/backtests/qb_attempt_trust_stack/summary/migration61_combined_summary.csv 2>/dev/null || true
          echo '--- attempts ---'; cat data/backtests/qb_attempt_trust_stack/summary/migration61_attempt_metrics.csv 2>/dev/null || true
          echo '--- market coverage ---'; cat data/backtests/qb_attempt_trust_stack/market_summary/m61_market_coverage.csv 2>/dev/null || true
          echo '--- football + Vegas ---'; cat data/backtests/qb_attempt_trust_stack/market_summary/m61_football_and_market_metrics.csv 2>/dev/null || true
          echo '--- edge thresholds ---'; cat data/backtests/qb_attempt_trust_stack/market_summary/m61_market_edge_thresholds.csv 2>/dev/null || true

      - name: Upload Migration 61 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-61-qb-attempt-trust-stack
          path: |
            data/backtests/qb_attempt_trust_stack/summary/*.csv
            data/backtests/qb_attempt_trust_stack/market/*.csv
            data/backtests/qb_attempt_trust_stack/market_summary/*.csv
            data/backtests/qb_attempt_trust_stack/2024/m61_mc/*.csv
            data/backtests/qb_attempt_trust_stack/2025/m61_mc/*.csv
            data/backtests/qb_attempt_trust_stack/2024/qb_attempt_trust_stack/*.csv
            data/backtests/qb_attempt_trust_stack/2025/qb_attempt_trust_stack/*.csv
            data/backtests/qb_attempt_trust_stack/2024/historical_input_validation.csv
            data/backtests/qb_attempt_trust_stack/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
