name: Replay Paid Full Slate Artifact Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: "2026-10-08"
  FETCH_LIVE_ODDS: "false"
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
  REPLAY_SOURCE_RUN_ID: "37855917750"
  REPLAY_SOURCE_ARTIFACT_ID: "11584521127"
  REPLAY_SOURCE_ARTIFACT_NAME: "week5-offline-paid-replay-37855917750"
  REPLAY_SOURCE_ARTIFACT_DIGEST: "sha256:a82f7745b4a97d21b929aff38b79ba902d01edd5bbb522f63fa463129c87b11e"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest

      - name: Verify exact non-expired replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REPLAY_SOURCE_ARTIFACT_ID}" > /tmp/replay_artifact_meta.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/replay_artifact_meta.json',encoding='utf-8'))
          want_run=int(os.environ['REPLAY_SOURCE_RUN_ID'])
          assert int(p['id']) == int(os.environ['REPLAY_SOURCE_ARTIFACT_ID']), p
          assert p['name'] == os.environ['REPLAY_SOURCE_ARTIFACT_NAME'], p
          assert p['digest'] == os.environ['REPLAY_SOURCE_ARTIFACT_DIGEST'], p
          assert int((p.get('workflow_run') or {}).get('id',-1)) == want_run, p
          assert p.get('expired') is False, p
          print('PINNED_REPLAY_ARTIFACT_VERIFIED', {
              'run':want_run,'artifact_id':p['id'],'digest':p['digest']
          })
          PY

      - name: Download preserved replay artifact
        uses: actions/download-artifact@v4
        with:
          name: week5-offline-paid-replay-37855917750
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37855917750

      - name: Restore preserved Week5 football and sportsbook state
        run: |
          set -euo pipefail
          test -d replay_source/data
          test -d replay_source/outputs
          rm -rf data outputs
          mkdir -p data outputs
          cp -a replay_source/data/. data/
          cp -a replay_source/outputs/. outputs/

          # Current branch governance is authoritative over archived mutable ledgers.
          git show HEAD:data/manual_final_board_quarantine.csv > data/manual_final_board_quarantine.csv
          git show HEAD:data/manual_prop_quarantine.csv > data/manual_prop_quarantine.csv

          test -s data/live_odds_status.json
          test -s outputs/props_raw_compact.csv
          test -s outputs/odds_game.csv
          test -s data/full_slate_data_quality_audit.json

          python - <<'PY'
          import json, os
          from pathlib import Path
          q=json.load(open('data/full_slate_data_quality_audit.json',encoding='utf-8'))
          if int(q.get('certification_blockers',-1)) != 0:
              raise SystemExit(f'FATAL: pinned replay fixture is not data-quality clean: {q}')
          p=Path('data/live_odds_status.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          s['replay_source_run']=int(os.environ['REPLAY_SOURCE_RUN_ID'])
          s['replay_source_artifact_id']=int(os.environ['REPLAY_SOURCE_ARTIFACT_ID'])
          s['replay_source_artifact_digest']=os.environ['REPLAY_SOURCE_ARTIFACT_DIGEST']
          s['odds_api_refetched']=False
          s['replay_mode']='PR_REQUIRED_OFFLINE_PINNED_WEEK5'
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('OFFLINE_PR_REPLAY_READY', {'compact_rows':s.get('production_compact_rows')})
          PY

      - name: Run replay and workflow contract tests
        run: |
          export PYTHONPATH="${PWD}"
          pytest -q             tests/test_full_slate_workflow_contract.py             tests/test_preserved_live_props_current_roster_v1.py             tests/test_qb_c2_active_team_context_v1.py             tests/test_full_slate_data_quality_scope.py

      - name: Apply protected current-output seams
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python scripts/operations/apply_qb_c2_active_schedule_context_seam_v1.py
          python -m py_compile scripts/run_pricing_with_full_roster_universe_v1.py scripts/modeling/rb_r26_receptions_production_adapter_v1.py scripts/modeling/qb_c2_production_adapter_v1.py

      - name: Reprice pinned board offline
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/materialize_pricing_offers_v1.py
          python scripts/run_metrics_context.py --season "${SEASON}" --mode full --date "${SLATE_DATE}"
          python scripts/validate_build_integrity.py
          python scripts/metrics_ready.py --season "${SEASON}" --date "${SLATE_DATE}"
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          python scripts/stamp_qb_c2_pricing_lineage_v1.py
          python scripts/validate_rb_rush_rec_conservation_v1.py
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_anytime_td_model_status_v1.py
          python scripts/validate_team_target_pool_full_universe_v2.py
          python scripts/validate_certified_full_slate_stack_v2.py
          python scripts/validate_full_slate_mechanical_certification_v1.py

      - name: Apply final-board-only verified prop quarantines
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/quarantine_final_priced_props_v1.py
          test -s data/final_priced_props_quarantine_status.json
          python - <<'PY'
          import json
          s=json.load(open('data/final_priced_props_quarantine_status.json',encoding='utf-8'))
          if 'BAL:tylerhuntley' not in set(s.get('quarantined_team_name_keys',[])):
              raise SystemExit(f'FATAL: Week5 Huntley quarantine not applied: {s}')
          if int(s.get('rows_removed',0)) <= 0:
              raise SystemExit(f'FATAL: expected Week5 final-board quarantine to remove rows: {s}')
          print('WEEK5_FINAL_BOARD_QUARANTINE_CERTIFIED',s)
          PY

      - name: Prove no OddsAPI refetch and run strict audits
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('data/live_odds_status.json',encoding='utf-8'))
          assert s.get('odds_api_refetched') is False, s
          assert s.get('replay_mode') == 'PR_REQUIRED_OFFLINE_PINNED_WEEK5', s
          print('ZERO_NEW_ODDSAPI_CONFIRMED')
          PY
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict

      - name: Upload offline replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline_replay_${{ github.run_id }}
          path: |
            data/live_odds_status.json
            data/full_slate_data_quality_audit.json
            data/final_priced_props_quarantine_status.json
            data/certified_full_slate_stack_audit.json
            data/full_slate_post_pricing_audit.csv
            outputs/paid_full_slate_replay_result.json
            outputs/props_pricing_offers.csv
            outputs/props_priced_clean.csv
          if-no-files-found: warn
          retention-days: 30
