# Migration 55 final holdout workflow; this comment-only follow-up triggers PR synchronization.
name: Migration 55 QB 2023 Final Holdout

on:
  workflow_dispatch:
    inputs:
      weeks: {description: "Weeks", required: false, default: "1-18"}
      iterations: {description: "MC iterations", required: false, default: "2000"}
      bootstrap: {description: "Paired bootstrap iterations", required: false, default: "10000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-55-qb-2023-final-holdout'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Declare frozen Migration 55 gates
        run: |
          echo "2023 is the final scored historical holdout. 2022 is input history only."
          echo "No candidate coefficients, features, caps, shrinkage, or thresholds may change in this migration."
          echo "Hard promotion gates were fixed before 2023 scoring:"
          echo "1) 2023 stable-QB joint MAE < current"
          echo "2) 2023 stable-QB joint RMSE <= current"
          echo "3) 2023 absolute bias <= current absolute bias"
          echo "4) 2023 correlation >= current"
          echo "5) 2023 100+ yard catastrophic misses <= current"
          echo "6) Joint stable-QB MAE improves in each of 2023, 2024, and 2025"
          echo "7) Combined 2023-2025 paired bootstrap 95% CI lower bound > 0"
          echo "8) Combined collateral-market MAE regression <= 1% for rec yards, receptions, rush attempts, rush yards, and rush+rec yards"
          echo "Subgroups are diagnostic only and cannot become post-hoc promotion gates."

      - name: Build, validate, and score frozen candidate across 2023-2025
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          WEEKS="${{ inputs.weeks || '1-18' }}"
          ITERATIONS="${{ inputs.iterations || '2000' }}"

          run_season () {
            SEASON="$1"
            PRIOR="$2"
            TARGET_DIR="data/backtests/qb_final_holdout/${SEASON}"

            echo "=== BUILD ${SEASON} USING ${PRIOR} AS PRIOR HISTORY ==="
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$TARGET_DIR"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$TARGET_DIR/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$TARGET_DIR/historical_defense_enrichment_audit.csv" --observations "$TARGET_DIR/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$TARGET_DIR" --report "$TARGET_DIR/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$TARGET_DIR/schedule_history.csv" --out "$TARGET_DIR/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$TARGET_DIR/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$TARGET_DIR/schedule_history.csv" --out "$TARGET_DIR/weather_history.csv"

            echo "=== SCORE ${SEASON} WITH FROZEN M53/M54 CANDIDATE ==="
            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --team-weekly "$TARGET_DIR/team_weekly_history.csv" --schedule "$TARGET_DIR/schedule_history.csv" --universe-dir "$TARGET_DIR/pregame_universe" --injuries "$TARGET_DIR/injuries_history.csv" --weather "$TARGET_DIR/weather_history.csv" --out-dir "$TARGET_DIR/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$TARGET_DIR/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --out-dir "$TARGET_DIR/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$TARGET_DIR/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$TARGET_DIR/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$TARGET_DIR/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$TARGET_DIR/team_weekly_history.csv" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --weather "$TARGET_DIR/weather_history.csv" --out-dir "$TARGET_DIR/qb_joint_attempts_ypa"
            python scripts/backtest/validate_qb_joint_attempts_ypa_mc.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --candidate-trace "$TARGET_DIR/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" --player-logs "$TARGET_DIR/player_game_logs_history.csv" --team-weekly "$TARGET_DIR/team_weekly_history.csv" --schedule "$TARGET_DIR/schedule_history.csv" --universe-dir "$TARGET_DIR/pregame_universe" --injuries "$TARGET_DIR/injuries_history.csv" --weather "$TARGET_DIR/weather_history.csv" --out-dir "$TARGET_DIR/qb_joint_attempts_ypa_mc"
          }

          run_season 2023 2022
          run_season 2024 2023
          run_season 2025 2024

      - name: Summarize 2023 holdout and three-season robustness
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/summarize_qb_joint_multi_season.py \
            --root data/backtests/qb_final_holdout \
            --seasons 2023,2024,2025 \
            --bootstrap "${{ inputs.bootstrap || '10000' }}" \
            --seed 55 \
            --out-dir data/backtests/qb_final_holdout/summary

      - name: Apply precommitted promotion gates
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('data/backtests/qb_final_holdout/summary')
          summary = pd.read_csv(root / 'qb_joint_multi_season_summary.csv')
          boot = pd.read_csv(root / 'qb_joint_multi_season_bootstrap.csv').iloc[0]

          stable = summary[(summary['slice'] == 'stable_qb') & (summary['market'] == 'pass_yards')].copy()
          def row(season, candidate):
              z = stable[(stable['season'].astype(str) == str(season)) & (stable['candidate'] == candidate)]
              if len(z) != 1:
                  raise RuntimeError(f'missing stable row season={season} candidate={candidate}')
              return z.iloc[0]

          c23, j23 = row('2023', 'current'), row('2023', 'joint')
          gates = []
          def gate(name, passed, detail):
              gates.append({'gate': name, 'passed': bool(passed), 'detail': detail})

          gate('2023_mae_improves', j23.mae < c23.mae, f'current={c23.mae:.4f} joint={j23.mae:.4f}')
          gate('2023_rmse_not_worse', j23.rmse <= c23.rmse, f'current={c23.rmse:.4f} joint={j23.rmse:.4f}')
          gate('2023_abs_bias_not_worse', abs(j23.bias) <= abs(c23.bias), f'current={c23.bias:.4f} joint={j23.bias:.4f}')
          gate('2023_corr_not_worse', j23.correlation >= c23.correlation, f'current={c23.correlation:.4f} joint={j23.correlation:.4f}')
          gate('2023_catastrophic_not_worse', j23.catastrophic_100plus <= c23.catastrophic_100plus, f'current={int(c23.catastrophic_100plus)} joint={int(j23.catastrophic_100plus)}')

          season_ok = True
          season_detail = []
          for season in ('2023', '2024', '2025'):
              cur, jnt = row(season, 'current'), row(season, 'joint')
              season_ok &= jnt.mae < cur.mae
              season_detail.append(f'{season}:{cur.mae:.2f}->{jnt.mae:.2f}')
          gate('all_three_seasons_mae_improve', season_ok, ' '.join(season_detail))
          gate('combined_bootstrap_ci_above_zero', float(boot.ci95_low) > 0, f"95% CI=[{boot.ci95_low:.4f}, {boot.ci95_high:.4f}]")

          collateral_markets = ['rec_yards', 'receptions', 'rush_att', 'rush_yards', 'rush_rec_yards']
          collateral_ok = True
          collateral_detail = []
          all_avail = summary[(summary['season'].astype(str) == 'combined') & (summary['slice'] == 'all_available')]
          for market in collateral_markets:
              cur = all_avail[(all_avail.market == market) & (all_avail.candidate == 'current')]
              jnt = all_avail[(all_avail.market == market) & (all_avail.candidate == 'joint')]
              if len(cur) != 1 or len(jnt) != 1:
                  raise RuntimeError(f'missing collateral rows for {market}')
              cm, jm = float(cur.iloc[0].mae), float(jnt.iloc[0].mae)
              regression = (jm / cm - 1.0) if cm else 0.0
              collateral_ok &= regression <= 0.01
              collateral_detail.append(f'{market}:{regression*100:+.3f}%')
          gate('collateral_mae_regression_lte_1pct', collateral_ok, ' '.join(collateral_detail))

          out = pd.DataFrame(gates)
          out['promotion_gate_pass'] = bool(out.passed.all())
          out.to_csv(root / 'migration55_precommitted_gate.csv', index=False)
          print('\n=== MIGRATION 55 PRECOMMITTED GATES ===')
          print(out.to_string(index=False))
          print('\nFINAL PROMOTION GATE:', 'PASS' if out.passed.all() else 'HOLD')
          PY

      - name: Show final results
        if: always()
        run: |
          cat data/backtests/qb_final_holdout/summary/qb_joint_multi_season_summary.csv 2>/dev/null || true
          cat data/backtests/qb_final_holdout/summary/qb_joint_multi_season_bootstrap.csv 2>/dev/null || true
          cat data/backtests/qb_final_holdout/summary/migration55_precommitted_gate.csv 2>/dev/null || true

      - name: Upload Migration 55 gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-55-qb-2023-final-holdout
          path: |
            data/backtests/qb_final_holdout/summary/*.csv
            data/backtests/qb_final_holdout/2023/historical_input_validation.csv
            data/backtests/qb_final_holdout/2023/qb_joint_attempts_ypa_mc/qb_joint_attempts_ypa_mc_summary.csv
          if-no-files-found: warn
          retention-days: 14
