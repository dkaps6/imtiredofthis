name: Opportunity Authority Priority V1

on:
  push:
    branches:
      - research-opportunity-authority-priority-v1
    paths:
      - 'scripts/modeling/simulation_rules.py'
      - 'scripts/simulation_v2.py'
      - 'scripts/research/evaluate_opportunity_authority_priority_v1.py'
      - 'tests/test_opportunity_authority_priority_v1.py'
      - 'tests/test_opportunity_authority_priority_full_stack_v1.py'
      - 'docs/research/OPPORTUNITY_AUTHORITY_PRIORITY_V1_PLAN.md'
      - 'docs/research/OPPORTUNITY_AUTHORITY_PRIORITY_V1_AMENDMENT1.md'
      - '.github/workflows/research-opportunity-authority-priority-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow scipy tabulate

      - name: Run frozen-contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_opportunity_authority_priority_v1.py \
            tests/test_opportunity_authority_priority_full_stack_v1.py \
            tests/test_simulation_rules_v2.py

      - name: Create workspace
        run: |
          rm -rf /tmp/opp /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model
          mkdir -p /tmp/opp/result /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model

      - name: Download WR-R15 fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: /tmp/wr_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34238301577

      - name: Download TE-R5P production-contract OOS authority
        uses: actions/download-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: /tmp/te_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34152797603

      - name: Verify frozen specialist authorities
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          wr_root=Path('/tmp/wr_model/backtests/wr_r15_wr1_anchor_v1')
          te_root=Path('/tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1')
          wr=pd.read_csv(wr_root/'wr_r15_fold_coefficients.csv')
          te=pd.read_csv(te_root/'te_r5p_coefficients.csv')
          wr_result=json.loads((wr_root/'wr_r15_result.json').read_text())
          te_result=json.loads((te_root/'te_r5p_result.json').read_text())

          assert sorted(wr['test_season'].astype(int).unique().tolist()) == [2023,2024]
          assert sorted(te['test_season'].astype(int).unique().tolist()) == [2023,2024,2025]
          assert bool(wr_result.get('design_motivated_by_2025_but_2025_confirmation_forbidden'))
          assert te_result.get('candidate_team_pool') == 'b0_te_pool'
          assert float(te_result.get('pool_ratio_contract')) == 1.0
          assert te_result.get('disposition') == 'TE_R5P_PRODUCTION_CONTRACT_REFIT_ELIGIBLE'
          print('FROZEN_SPECIALIST_AUTHORITY_PASS')
          PY

      - name: Build independent historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py \
            --season 2024 --prior-season 2023 --weeks 1-18 --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py \
            --season 2025 --prior-season 2024 --weeks 1-18 --out-dir /tmp/hist_2025

      - name: Combine schedule and team history
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/opp')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              parts=[pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)]
              x=pd.concat(parts,ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              assert not x.duplicated(keys).any()
              x.to_csv(out/name,index=False)
          PY

      - name: Build canonical historical player logs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py \
            --seasons 2023,2024,2025 \
            --schedule /tmp/opp/schedule_history.csv \
            --out /tmp/opp/player_game_logs_history.csv

      - name: Build fixed baseline ML-State component traces
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/walk_forward.py \
            --season 2024 --prior-season 2023 --weeks 2-18 --iterations 2000 \
            --player-logs /tmp/opp/player_game_logs_history.csv \
            --team-weekly /tmp/opp/team_weekly_history.csv \
            --schedule /tmp/opp/schedule_history.csv \
            --universe-dir /tmp/hist_2024/pregame_universe \
            --out /tmp/opp/component_predictions_2024.csv
          python scripts/backtest/walk_forward.py \
            --season 2025 --prior-season 2024 --weeks 2-18 --iterations 2000 \
            --player-logs /tmp/opp/player_game_logs_history.csv \
            --team-weekly /tmp/opp/team_weekly_history.csv \
            --schedule /tmp/opp/schedule_history.csv \
            --universe-dir /tmp/hist_2025/pregame_universe \
            --out /tmp/opp/component_predictions_2025.csv

      - name: Run frozen full-stack opportunity-authority candidate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_opportunity_authority_priority_v1.py \
            --player-logs /tmp/opp/player_game_logs_history.csv \
            --team-weekly /tmp/opp/team_weekly_history.csv \
            --schedule /tmp/opp/schedule_history.csv \
            --universe-2024 /tmp/hist_2024/pregame_universe \
            --universe-2025 /tmp/hist_2025/pregame_universe \
            --component-2024 /tmp/opp/component_predictions_2024.csv \
            --component-2025 /tmp/opp/component_predictions_2025.csv \
            --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv \
            --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv \
            --iterations 2000 \
            --weeks 2-18 \
            --out-dir /tmp/opp/result

      - name: Display frozen result
        if: always()
        run: |
          cat /tmp/opp/result/opportunity_authority_priority_result.json || true
          echo
          cat /tmp/opp/result/opportunity_authority_priority_direct_summary.csv || true
          echo
          cat /tmp/opp/result/opportunity_authority_priority_market_summary.csv || true

      - name: Upload frozen result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-authority-priority-v1
          retention-days: 30
          path: |
            /tmp/opp/result/**
          if-no-files-found: warn
