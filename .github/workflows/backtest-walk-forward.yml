name: 2025 Walk-Forward Backtest

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks to backtest (for example 1-18 or 1,2,3)"
        required: false
        default: "1-18"
      iterations:
        description: "Monte Carlo iterations per player/week"
        required: false
        default: "2000"
      ablation_iterations:
        description: "MC iterations per feature-ablation variant/week"
        required: false
        default: "750"
      script_iterations:
        description: "MC iterations per game-script decomposition variant/week"
        required: false
        default: "750"
      pass_recal_iterations:
        description: "MC iterations per pass-tendency candidate/week"
        required: false
        default: "750"

jobs:
  walk-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib
      - name: Build historical schedule, team features, and pregame universes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --out-dir data/backtests
      - name: Audit nflverse historical participation source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/audit_participation_source.py --seasons 2024,2025 --summary data/backtests/participation_source_audit.csv --by-week data/backtests/participation_field_coverage_by_week.csv
      - name: Audit historical WR-CB assignment source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/audit_wr_cb_source.py --seasons 2024,2025 --summary data/backtests/wr_cb_source_audit.csv --inventory data/backtests/wr_cb_candidate_columns.csv --by-week data/backtests/wr_cb_source_coverage_by_week.csv
      - name: Recover historical participation defensive context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests/historical_defense_enrichment_audit.csv --observations data/backtests/historical_defense_observations.csv
      - name: Validate historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --data-dir data/backtests --report data/backtests/historical_input_validation.csv
      - name: Build canonical 2024-2025 player-game history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule data/backtests/schedule_history.csv --out data/backtests/player_game_logs_history.csv
      - name: Build historical weekly injury snapshots
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests/injuries_history.csv
      - name: Build leakage-safe historical weather context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/schedule_history.csv --out data/backtests/weather_history.csv
      - name: Execute leakage-safe walk-forward predictions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f data/backtests/component_predictions.csv
          python scripts/backtest/walk_forward.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out data/backtests/component_predictions.csv --iterations "${{ inputs.iterations || '2000' }}"
      - name: Evaluate OOS component performance
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/evaluation
          python scripts/backtest/evaluate_components.py --predictions data/backtests/component_predictions.csv --out-dir data/backtests/evaluation
      - name: Audit historical feature coverage and MC passing inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/diagnostics
          python scripts/backtest/feature_coverage_audit.py --predictions data/backtests/component_predictions.csv --out-dir data/backtests/diagnostics
      - name: Run historical feature ablation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/ablation
          python scripts/backtest/run_feature_ablation.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.ablation_iterations || '750' }}" --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out-dir data/backtests/ablation
      - name: Run game-script decomposition
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/script_decomposition
          python scripts/backtest/run_script_decomposition.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.script_iterations || '750' }}" --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out-dir data/backtests/script_decomposition
      - name: Run pass-tendency architecture recalibration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/pass_tendency_recalibration
          python scripts/backtest/run_pass_tendency_recalibration.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.pass_recal_iterations || '750' }}" --player-logs data/backtests/player_game_logs_history.csv --team-weekly data/backtests/team_weekly_history.csv --schedule data/backtests/schedule_history.csv --universe-dir data/backtests/pregame_universe --injuries data/backtests/injuries_history.csv --weather data/backtests/weather_history.csv --out-dir data/backtests/pass_tendency_recalibration
      - name: Show prediction inventory
        if: always()
        run: |
          echo "Validation report:"
          cat data/backtests/historical_input_validation.csv 2>/dev/null || true
          echo "Historical participation source audit:"
          cat data/backtests/participation_source_audit.csv 2>/dev/null || true
          echo "Historical WR-CB source audit:"
          cat data/backtests/wr_cb_source_audit.csv 2>/dev/null || true
          echo "Historical defensive enrichment audit:"
          cat data/backtests/historical_defense_enrichment_audit.csv 2>/dev/null || true
          echo "Historical feature ablation summary:"
          cat data/backtests/ablation/feature_ablation_summary.csv 2>/dev/null || true
          echo "Game-script decomposition summary:"
          cat data/backtests/script_decomposition/script_decomposition_summary.csv 2>/dev/null || true
          echo "Pass-tendency recalibration summary:"
          cat data/backtests/pass_tendency_recalibration/pass_tendency_summary.csv 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          q=Path('data/backtests/component_predictions.csv')
          if q.exists():
              x=pd.read_csv(q); print('prediction rows=',len(x))
              for c in ['mc_proj','ml_proj','state_proj']: print(c,int(x[c].notna().sum()),'/',len(x))
          e=Path('data/backtests/evaluation/evaluation_summary.csv')
          if e.exists():
              s=pd.read_csv(e); cols=['market','model','n','coverage','mae','median_ae','rmse','bias','correlation','r2','market_winner']; print(s[cols].to_string(index=False))
          f=Path('data/backtests/diagnostics/historical_feature_coverage.csv')
          if f.exists(): print(pd.read_csv(f).to_string(index=False))
          PY
      - name: Upload walk-forward artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-2025-walk-forward
          path: |
            data/backtests/historical_input_validation.csv
            data/backtests/participation_source_audit.csv
            data/backtests/participation_field_coverage_by_week.csv
            data/backtests/wr_cb_source_audit.csv
            data/backtests/wr_cb_candidate_columns.csv
            data/backtests/wr_cb_source_coverage_by_week.csv
            data/backtests/historical_defense_enrichment_audit.csv
            data/backtests/historical_defense_observations.csv
            data/backtests/injuries_history.csv
            data/backtests/weather_history.csv
            data/backtests/player_game_logs_history.csv
            data/backtests/component_predictions.csv
            data/backtests/evaluation/*.csv
            data/backtests/diagnostics/*.csv
            data/backtests/ablation/*.csv
            data/backtests/script_decomposition/*.csv
            data/backtests/pass_tendency_recalibration/*.csv
          if-no-files-found: warn
          retention-days: 14
