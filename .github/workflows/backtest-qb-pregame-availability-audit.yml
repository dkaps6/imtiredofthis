name: 2025 QB Pregame Availability Audit
on:
  workflow_dispatch:
    inputs:
      weeks: {description: "Weeks", required: false, default: "1-18"}
      iterations: {description: "MC iterations", required: false, default: "2000"}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib
      - name: Build leakage-safe historical inputs
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --out-dir data/backtests
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests/historical_defense_enrichment_audit.csv --observations data/backtests/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --data-dir data/backtests --report data/backtests/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule data/backtests/schedule_history.csv --out data/backtests/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/schedule_history.csv --out data/backtests/weather_history.csv
      - name: Rebuild canonical QB passing trace
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python scripts/backtest/decompose_qb_passing_error.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.iterations || '2000' }}"
      - name: Rebuild Migration 47 participation trace
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python scripts/backtest/decompose_qb_participation_role.py
      - name: Run Migration 48 pregame availability audit
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python scripts/backtest/audit_qb_pregame_availability.py
      - name: Show results
        if: always()
        run: |
          cat data/backtests/qb_pregame_availability/qb_pregame_availability_summary.csv 2>/dev/null || true
          cat data/backtests/qb_pregame_availability/qb_pregame_signal_summary.csv 2>/dev/null || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-48-qb-pregame-availability-audit
          path: |
            data/backtests/historical_input_validation.csv
            data/backtests/qb_passing_error/*.csv
            data/backtests/qb_participation/*.csv
            data/backtests/qb_pregame_availability/*.csv
          if-no-files-found: warn
          retention-days: 14
