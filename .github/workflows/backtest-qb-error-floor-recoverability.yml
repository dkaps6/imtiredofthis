name: Migration 86 QB Error-Floor Recoverability Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-qb-error-floor-recoverability.yml"
      - "scripts/backtest/audit_qb_error_floor_recoverability.py"
      - "docs/migrations/M86_QB_ERROR_FLOOR_RECOVERABILITY_AUDIT.md"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen M86 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          doc=Path('docs/migrations/M86_QB_ERROR_FLOOR_RECOVERABILITY_AUDIT.md').read_text()
          required=['56.749517','123','41.103131','VOLUME_DOMINANT','EFFICIENCY_DOMINANT','HIGH_EVENT_CHAOS','production_actionable = false']
          missing=[x for x in required if x not in doc]
          assert not missing, missing
          print('M86 frozen contract: PASS')
          PY

  forensic-audit:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy
      - name: Recover authoritative M82 trace artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m82_artifact
          gh api /repos/${{ github.repository }}/actions/artifacts/9734973786/zip > /tmp/m82.zip
          unzip -q /tmp/m82.zip -d /tmp/m82_artifact
          TRACE=$(find /tmp/m82_artifact -name m82_qb_common_cohort_trace.csv -print -quit)
          test -n "$TRACE"
          cp "$TRACE" /tmp/m82_qb_common_cohort_trace.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('/tmp/m82_qb_common_cohort_trace.csv',low_memory=False)
          assert len(x)==884, len(x)
          assert ((x['ensemble_proj']-x['actual_pass_yards']).abs()>=100).sum()==123
          print('M82 authoritative trace recovered:', len(x), 'rows')
          PY
      - name: Run M86 forensic audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/m86_qb_error_floor
          python scripts/backtest/audit_qb_error_floor_recoverability.py \
            --m82-trace /tmp/m82_qb_common_cohort_trace.csv \
            --out-dir data/backtests/m86_qb_error_floor
      - name: Verify forensic-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('data/backtests/m86_qb_error_floor')
          s=json.loads((root/'m86_summary.json').read_text())
          x=pd.read_csv(root/'m86_qb_forensic_trace.csv',low_memory=False)
          assert s['rows']==884
          assert s['tail100']==123
          assert s['postgame_features_used_for_prediction'] is False
          assert s['sportsbook_features_used'] is False
          assert s['production_actionable'] is False
          assert len(x)==884
          print(json.dumps(s,indent=2))
          PY
      - name: Upload M86 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m86-qb-error-floor-recoverability
          path: data/backtests/m86_qb_error_floor/*
          if-no-files-found: warn
          retention-days: 14
