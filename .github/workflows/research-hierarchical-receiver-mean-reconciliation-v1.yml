name: Research Hierarchical Receiver Mean Reconciliation V1

on:
  push:
    branches: [research-hierarchical-receiver-mean-reconciliation-v1]
    paths:
      - 'docs/research/HIERARCHICAL_RECEIVER_MEAN_RECONCILIATION_V1_PLAN.md'
      - 'docs/research/HIERARCHICAL_RECEIVER_MEAN_RECONCILIATION_V1_PASS_ATTEMPT_AMENDMENT.md'
      - 'scripts/research/evaluate_hierarchical_receiver_mean_reconciliation_v1.py'
      - '.github/workflows/research-hierarchical-receiver-mean-reconciliation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-hierarchical-receiver-mean-reconciliation-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow scikit-learn joblib

      - name: Compile frozen evaluator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_hierarchical_receiver_mean_reconciliation_v1.py

      - name: Create workspace
        run: |
          rm -rf /tmp/hrr /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model /tmp/m89
          mkdir -p /tmp/hrr /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model /tmp/m89

      - name: Download WR-R15 fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: /tmp/wr_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34238301577

      - name: Download TE-R5P fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: /tmp/te_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34152797603

      - name: Download exact M89 884-row OOS authority
        uses: actions/download-artifact@v4
        with:
          name: qb-pd3-internal-disagreement-reliability
          path: /tmp/m89
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34122984048

      - name: Verify frozen authorities
        run: |
          set -euo pipefail
          test -s /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          test -s /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv
          test -s /tmp/m89/data/backtests/qb_pd3_internal_disagreement_reliability/qb_pd3_casebook.csv
          python - <<'PY'
          import pandas as pd
          p='/tmp/m89/data/backtests/qb_pd3_internal_disagreement_reliability/qb_pd3_casebook.csv'
          x=pd.read_csv(p)
          c=x.groupby('season').size().to_dict()
          if c != {2024:444,2025:440}: raise SystemExit(f'M89 authority drift {c}')
          if x.duplicated(['season','week','team']).any(): raise SystemExit('M89 duplicate team-game authority')
          print('M89_AUTHORITY_PASS', c)
          PY

      - name: Build independent historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir /tmp/hist_2025

      - name: Combine historical schedule and team state
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/hrr')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any(): raise RuntimeError(f'duplicate combined rows in {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build canonical historical player injury and weather inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024,2025 --schedule /tmp/hrr/schedule_history.csv --out /tmp/hrr/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024,2025 --out /tmp/hrr/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule /tmp/hrr/schedule_history.csv --out /tmp/hrr/weather_history.csv

      - name: Run frozen historical reconciliation A/B
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_hierarchical_receiver_mean_reconciliation_v1.py \
            --player-logs /tmp/hrr/player_game_logs_history.csv \
            --team-weekly /tmp/hrr/team_weekly_history.csv \
            --schedule /tmp/hrr/schedule_history.csv \
            --universe-2024 /tmp/hist_2024/pregame_universe \
            --universe-2025 /tmp/hist_2025/pregame_universe \
            --injuries /tmp/hrr/injuries_history.csv \
            --weather /tmp/hrr/weather_history.csv \
            --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv \
            --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv \
            --m89-casebook /tmp/m89/data/backtests/qb_pd3_internal_disagreement_reliability/qb_pd3_casebook.csv \
            --weights data/model_ensemble_weights.csv \
            --weeks '1-18' \
            --iterations 2000 \
            --out-dir /tmp/hrr/result
          cat /tmp/hrr/result/RESULT.md

      - name: Upload frozen result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-receiver-mean-reconciliation-v1
          path: |
            /tmp/hrr/result/**
          if-no-files-found: warn
          retention-days: 30
