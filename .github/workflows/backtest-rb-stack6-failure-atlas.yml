name: RB-STACK6 Failure Atlas

on:
  push:
    branches:
      - research-rb-stack6-secondary-back-role-state
    paths:
      - 'scripts/backtest/analyze_rb_stack6_failure_atlas.py'
      - '.github/workflows/backtest-rb-stack6-failure-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  STACK6_RUN_ID: '33546598092'
  MARKET_RUN_ID: '33499129109'

jobs:
  failure-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4
      - name: Compile
        run: python -m py_compile scripts/backtest/analyze_rb_stack6_failure_atlas.py
      - name: Download frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6_failure/stack6 data/backtests/rb_stack6_failure/market
          gh run download "$STACK6_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-allocation --dir data/backtests/rb_stack6_failure/stack6
          gh run download "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-market-benchmark-2025 --dir data/backtests/rb_stack6_failure/market
          test -s data/backtests/rb_stack6_failure/stack6/stack6_2025_casebook.csv
          test -s data/backtests/rb_stack6_failure/market/rb_market_casebook.csv
      - name: Analyze
        run: |
          rm -rf data/backtests/rb_stack6_failure/results
          python scripts/backtest/analyze_rb_stack6_failure_atlas.py \
            --stack6-root data/backtests/rb_stack6_failure/stack6 \
            --market-root data/backtests/rb_stack6_failure/market \
            --out-dir data/backtests/rb_stack6_failure/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6-failure-atlas
          path: data/backtests/rb_stack6_failure/results/**
          if-no-files-found: warn
          retention-days: 30
