name: Research QB Independent NLI Semantic Validator V1J

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/QB_TEAM_PASS_INTENT_INDEPENDENT_NLI_SEMANTIC_VALIDATOR_V1J_PLAN.md'
      - 'scripts/research/audit_qb_team_pass_intent_independent_nli_semantic_validator_v1j.py'
      - 'tests/test_qb_team_pass_intent_independent_nli_semantic_validator_v1j.py'
      - '.github/workflows/research-qb-independent-nli-semantic-validator-v1j.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-nli-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen semantic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml sentence-transformers==3.4.1

      - name: Compile and test frozen V1J mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_qb_team_pass_intent_independent_nli_semantic_validator_v1j.py
          pytest -q tests/test_qb_team_pass_intent_independent_nli_semantic_validator_v1j.py

      - name: Run immutable-gold independent NLI validator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/qb-v1j
          python scripts/research/audit_qb_team_pass_intent_independent_nli_semantic_validator_v1j.py             --gold docs/research/QB_TEAM_PASS_INTENT_V1D_GOLD_PREFIX.csv             --out-dir /tmp/qb-v1j

      - name: Certify source-only V1J result
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/qb-v1j/qb_intent_independent_nli_semantic_validator_v1j_result.json"))
          assert p["version"]=="QB_TEAM_PASS_INTENT_INDEPENDENT_NLI_SEMANTIC_VALIDATOR_V1J", p
          assert p["model_id"]=="cross-encoder/nli-deberta-v3-small", p
          assert p["model_revision"]=="fa2804872c3b4bd748f38c0185cc85775361e735", p
          assert p["min_entailment"]==0.70, p
          assert p["min_margin"]==0.20, p
          assert p["positive_gold"]==12, p
          assert p["negative_gold"]==1, p
          assert p["supervised_fit_or_finetune_used"] is False, p
          assert p["football_outcomes_read"]==0, p
          assert p["model_residuals_read"]==0, p
          assert p["sportsbook_inputs_used"] is False, p
          assert p["paid_oddsapi_calls"]==0, p
          assert p["week5_2026_outcomes_read"]==0, p
          assert p["football_predictive_models_fit"]==0, p
          assert p["production_changed"] is False, p
          assert p["disposition"] in {
              "INDEPENDENT_NLI_VALIDATOR_QUALIFIED_FOR_OFFICIAL_PROMOTION_SCREEN",
              "INDEPENDENT_NLI_VALIDATOR_NOT_QUALIFIED",
          }, p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload frozen V1J gold artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-independent-nli-semantic-validator-v1j
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/qb-v1j/
