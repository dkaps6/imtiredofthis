name: Backtest Weeks 1-2 Full Board

# Full graded backtest of the real priced boards for Week 1 and Week 2,
# now that nflverse carries final Week 2 stats. Read-only: it replays two
# already-paid-for Full Slate artifacts and never fetches sportsbook odds.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/nice-cori-4qkwqs
    paths:
      - '.github/workflows/backtest-weeks-1-2-full-board.yml'
      - 'scripts/operations/report_weekly_backtest_v1.py'

permissions:
  contents: read
  actions: read

env:
  BACKTEST_SEASON: '2026'
  # The original Week 1 priced-board artifact (run 34910010508) EXPIRED on
  # 2026-09-21T23:44Z. The only surviving copy of that board is the archived
  # ledger inside the Week 1 slice run's artifact, so Week 1 is restored from
  # the ledger rather than re-archived from a priced board.
  WEEK1_LEDGER_RUN_ID: '35520068364'
  WEEK1_LEDGER_ARTIFACT: week1_graded_slices_35520068364
  WEEK2_RUN_ID: '35282021679'
  WEEK2_ARTIFACT: run_35282021679

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Restore the Week 1 board from the surviving archived ledger
        run: |
          set -euo pipefail
          rm -rf /tmp/wk1 && mkdir -p /tmp/wk1
          gh run download "${WEEK1_LEDGER_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${WEEK1_LEDGER_ARTIFACT}" --dir /tmp/wk1
          echo "--- artifact contents ---"
          find /tmp/wk1 -type f | sed 's#^#  #'
          SRC=$(find /tmp/wk1 -type f -name '2026_wk01.csv' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::no 2026_wk01.csv in ${WEEK1_LEDGER_ARTIFACT};" \
                 "the Week 1 board has no surviving copy in this artifact"
            exit 1
          fi
          mkdir -p data/market_track_record/boards
          cp "$SRC" data/market_track_record/boards/2026_wk01.csv
          python -c "import pandas as pd; d=pd.read_csv('data/market_track_record/boards/2026_wk01.csv'); print(f'week 1 ledger restored: {len(d)} rows, {d[\"market\"].nunique()} markets')"

      - name: Archive the Week 2 priced board into the ledger
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          rm -rf /tmp/wk2 && mkdir -p /tmp/wk2
          gh run download "${WEEK2_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${WEEK2_ARTIFACT}" --dir /tmp/wk2
          test -s /tmp/wk2/outputs/props_priced_clean.csv
          python scripts/operations/archive_priced_board_v1.py \
            --priced-file /tmp/wk2/outputs/props_priced_clean.csv \
            --season "${BACKTEST_SEASON}" --week 2 --run-id "${WEEK2_RUN_ID}"

      - name: Grade both weeks against final nflverse actuals
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/grade_market_track_record_gsis_v1.py \
            --season "${BACKTEST_SEASON}" --weeks "1,2" \
            --detail-out /tmp/graded_weeks_1_2.csv
          test -s /tmp/graded_weeks_1_2.csv

      - name: Report the full decomposition
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/report_weekly_backtest_v1.py \
            --detail /tmp/graded_weeks_1_2.csv

      - name: Upload graded detail
        uses: actions/upload-artifact@v4
        with:
          name: backtest_weeks_1_2_graded
          path: |
            /tmp/graded_weeks_1_2.csv
            data/market_track_record/boards/
          if-no-files-found: error
          retention-days: 30
