name: Migration 76 QB 40s Information Frontier

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/audit_qb_40s_information_frontier.py'
      - 'scripts/backtest/freeze_qb_frontier_canonical_v3_football_only.py'
      - 'scripts/backtest/build_historical_inputs.py'
      - 'scripts/backtest/historical_inputs.py'
      - 'scripts/backtest/enrich_historical_defense.py'
      - 'scripts/backtest/validate_historical_inputs.py'
      - 'scripts/backtest/historical_player_logs.py'
      - 'scripts/backtest/build_historical_injuries.py'
      - 'scripts/backtest/build_historical_weather.py'
      - 'scripts/backtest/decompose_qb_passing_error.py'
      - 'scripts/backtest/component_predictions.py'
      - '.github/workflows/backtest-qb-40s-information-frontier.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'backtest-migration-76-qb-40s-information-frontier'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scikit-learn pyarrow pytest pyyaml joblib

      - name: Frozen M76 scope
        run: |
          echo 'M76 is a data-frontier audit, not a predictive-model migration.'
          echo 'Canonical source of truth: v3 football-only, 884 stable-primary QB games (444 in 2024; 440 in 2025).'
          echo 'No sportsbook field may affect cohort membership, projections, source qualification, or outputs.'
          echo 'M76 fits ZERO predictive models and changes ZERO production logic.'
          echo 'M76 quantifies the amount of attempt/YPA oracle-error recovery required to reach <50 passing-yard MAE.'
          echo 'M76 attributes the 2024-vs-2025 difficulty gap at the attempt/YPA component level.'
          echo 'M76 qualifies genuinely new point-in-time personnel identity sources: depth charts and weekly rosters.'
          echo 'Strictly-prior snap counts and PFR pass-rush stats may support role/replacement quality but target-game outcomes are prohibited.'
          echo 'Generic injury burden may not authorize M77 because it was already tested; the nflverse injury feed is known to end after 2024.'
          echo 'M77 is allowed only if the exact-personnel identity/discontinuity contract qualifies.'
          echo 'The no-retest ledger prohibits another same-information DBR/attempt/YPA/model-subset migration.'

      - name: Compile M76 and canonical v3 freezer
        run: |
          python -m py_compile scripts/backtest/audit_qb_40s_information_frontier.py
          python -m py_compile scripts/backtest/freeze_qb_frontier_canonical_v3_football_only.py

      - name: Rebuild pre-market 2024 QB trace
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          D=data/backtests/m76_premarket_2024
          mkdir -p "$D"
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir "$D"
          python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons 2023,2024 --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv" || echo '[m76] optional 2024 defensive enrichment unavailable; continuing with base team history'
          python scripts/backtest/validate_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024 --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024 --out "$D/injuries_history.csv" || true
          python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv" || true
          touch "$D/injuries_history.csv" "$D/weather_history.csv"
          python scripts/backtest/decompose_qb_passing_error.py \
            --season 2024 --prior-season 2023 --weeks '1-18' --iterations 2000 \
            --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" \
            --out-dir "$D/qb_passing_error"

      - name: Rebuild pre-market 2025 QB trace
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          D=data/backtests/m76_premarket_2025
          mkdir -p "$D"
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir "$D"
          python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons 2024,2025 --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv" || echo '[m76] optional 2025 defensive enrichment unavailable; continuing with base team history'
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out "$D/injuries_history.csv" || true
          python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv" || true
          touch "$D/injuries_history.csv" "$D/weather_history.csv"
          python scripts/backtest/decompose_qb_passing_error.py \
            --season 2025 --prior-season 2024 --weeks '1-18' --iterations 2000 \
            --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" \
            --out-dir "$D/qb_passing_error"

      - name: Freeze canonical v3 football-only
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/freeze_qb_frontier_canonical_v3_football_only.py \
            --trace-2024 data/backtests/m76_premarket_2024/qb_passing_error/qb_passing_player_trace.csv \
            --logs-2024 data/backtests/m76_premarket_2024/player_game_logs_history.csv \
            --trace-2025 data/backtests/m76_premarket_2025/qb_passing_error/qb_passing_player_trace.csv \
            --logs-2025 data/backtests/m76_premarket_2025/player_game_logs_history.csv \
            --out-dir data/backtests/qb_frontier_canonical_v3_football_only
          cat data/backtests/qb_frontier_canonical_v3_football_only/football_only_oracle_summary.csv
          cat data/backtests/qb_frontier_canonical_v3_football_only/manifest.json

      - name: Run M76 information frontier
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/audit_qb_40s_information_frontier.py \
            --canonical data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv \
            --out-dir data/backtests/qb_m76

      - name: Print M76 outputs
        if: always()
        run: |
          echo '--- M76 interpretation ---'
          cat data/backtests/qb_m76/m76_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- M76 season difficulty ---'
          cat data/backtests/qb_m76/m76_season_difficulty.csv 2>/dev/null || true
          echo '--- M76 source contracts ---'
          cat data/backtests/qb_m76/m76_source_contracts.csv 2>/dev/null || true
          echo '--- M76 recovery map ---'
          cat data/backtests/qb_m76/m76_recovery_map.csv 2>/dev/null || true
          echo '--- M76 no-retest ledger ---'
          cat data/backtests/qb_m76/m76_no_retest_ledger.csv 2>/dev/null || true
          echo '--- M76 unresolved frontiers ---'
          cat data/backtests/qb_m76/m76_unresolved_data_frontiers.csv 2>/dev/null || true

      - name: Upload M76 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-76-qb-40s-information-frontier
          path: |
            data/backtests/qb_m76/*
            data/backtests/qb_frontier_canonical_v3_football_only/*
            data/backtests/m76_premarket_2024/historical_input_validation.csv
            data/backtests/m76_premarket_2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
