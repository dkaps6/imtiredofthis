name: Migration 83 QB Defensive Adaptive Gameplan Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-qb-defensive-adaptive-gameplan.yml"
      - "scripts/backtest/audit_defensive_adaptive_gameplan.py"
      - "scripts/backtest/audit_defensive_adaptive_gameplan_v2.py"
      - "docs/migrations/M83_DEFENSIVE_ADAPTIVE_GAMEPLAN_AUDIT.md"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen M83 contract
        run: |
          python -m py_compile scripts/backtest/audit_defensive_adaptive_gameplan.py scripts/backtest/audit_defensive_adaptive_gameplan_v2.py
          grep -q "PREREGISTERED / DIAGNOSTIC ONLY" docs/migrations/M83_DEFENSIVE_ADAPTIVE_GAMEPLAN_AUDIT.md
          grep -q "2025 QB target outcomes remain" docs/migrations/M83_DEFENSIVE_ADAPTIVE_GAMEPLAN_AUDIT.md
          grep -q "K_NEIGHBORS = 4" scripts/backtest/audit_defensive_adaptive_gameplan.py
          grep -q "MIN_MAE_GAIN_PCT = 0.05" scripts/backtest/audit_defensive_adaptive_gameplan.py
          grep -q "MIN_CORR_GAIN = 0.05" scripts/backtest/audit_defensive_adaptive_gameplan.py

  audit:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow scikit-learn
      - name: Run M83 defensive adaptive gameplan audit
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/backtest:${{ github.workspace }}
        run: |
          rm -rf data/backtests/m83_defensive_adaptation
          python scripts/backtest/audit_defensive_adaptive_gameplan_v2.py --out data/backtests/m83_defensive_adaptation
      - name: Verify M83 output boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('data/backtests/m83_defensive_adaptation')
          d=json.loads((root/'m83_decision.json').read_text())
          assert d['migration']=='M83', d
          assert d['production_actionable'] is False, d
          assert d['qb_outcomes_read'] is False, d
          assert d['sportsbook_features_used'] is False, d
          for name in ['m83_ftn_adaptive_response_predictions_2024.csv','m83_participation_adaptive_response_predictions_2024.csv']:
              p=root/name
              if p.exists() and p.stat().st_size:
                  x=pd.read_csv(p, low_memory=False)
                  if len(x):
                      assert set(pd.to_numeric(x['season'], errors='coerce').dropna().astype(int)) <= {2024}, name
                  forbidden=[c for c in x.columns if any(t in c.lower() for t in ['pass_yards','actual_attempts','actual_ypa','sportsbook','moneyline','spread','game_total','prop_line'])]
                  assert not forbidden, (name, forbidden)
          print(json.dumps(d, indent=2))
          PY
      - name: Upload M83 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m83-defensive-adaptive-gameplan-audit
          path: data/backtests/m83_defensive_adaptation/*
          if-no-files-found: warn
          retention-days: 14
