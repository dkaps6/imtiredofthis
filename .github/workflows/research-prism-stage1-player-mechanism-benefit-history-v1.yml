name: Research PRISM Stage1 Player Mechanism Benefit History V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/audit_prism_stage1_player_mechanism_benefit_history_v1.py'
      - 'tests/test_prism_stage1_player_mechanism_benefit_history_v1.py'
      - '.github/workflows/research-prism-stage1-player-mechanism-benefit-history-v1.yml'
      - 'docs/research/PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml

      - name: Verify frozen source contract and parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor d8df3acf233103628e455a45358ff9f697657504 HEAD
          git cat-file -e d8df3acf233103628e455a45358ff9f697657504:docs/research/PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_PLAN.md
          if git cat-file -e d8df3acf233103628e455a45358ff9f697657504:scripts/research/audit_prism_stage1_player_mechanism_benefit_history_v1.py 2>/dev/null; then
            echo "ERROR: Stage-1 source implementation existed at freeze commit"
            exit 1
          fi
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12049120604 --jq '.workflow_run.id')" = "38907459996"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12049120604 --jq '.digest')" = "sha256:41b1acd3f1b8d77abb53980db160ece32f8fc40351939d4827248b9caad0c64b"

      - uses: actions/download-artifact@v4
        with:
          name: player-active-role-participation-mechanism-v1-38907459996
          path: /tmp/stage1-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38907459996

      - name: Resolve immutable Stage-1 rows
        run: |
          PARENT_ROWS="$(find /tmp/stage1-parent -type f -name 'player_active_role_mechanism_scored_rows.csv' -print -quit)"
          test -n "$PARENT_ROWS" && test -s "$PARENT_ROWS"
          echo "PARENT_ROWS=$PARENT_ROWS" >> "$GITHUB_ENV"

      - name: Run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_stage1_player_mechanism_benefit_history_v1.py
          pytest -q tests/test_prism_stage1_player_mechanism_benefit_history_v1.py

      - name: Audit strictly-prior Stage-1 player mechanism history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/stage1-player-benefit-source
          mkdir -p /tmp/stage1-player-benefit-source
          python scripts/research/audit_prism_stage1_player_mechanism_benefit_history_v1.py             --parent-rows "$PARENT_ROWS"             --out-dir /tmp/stage1-player-benefit-source

      - name: Certify source-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage1-player-benefit-source/stage1_player_mechanism_benefit_source_result.json'))
          assert p['version']=='PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='d8df3acf233103628e455a45358ff9f697657504',p
          assert p['parent_run']==38907459996,p
          assert p['parent_artifact']==12049120604,p
          assert p['families']==['QB','RB','WR','TE'],p
          assert p['chronology_violations']==0,p
          assert p['duplicate_identities']==0,p
          assert p['personalization_rule_scored'] is False,p
          assert p['coefficients_fit']==0,p
          assert p['threshold_searches']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['week6_outcomes_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_SOURCE_READY_ALL',
              'PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_SOURCE_READY_PARTIAL',
              'PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_SOURCE_BLOCKED',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 source result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/stage1-player-benefit-source/stage1_player_mechanism_benefit_source_result.json'))
          lines=[
              '### PRISM Stage-1 player mechanism-benefit history source audit',
              '',
              f"- Run: `{os.environ['RUN_ID']}`",
              f"- Exact head: `{os.environ['HEAD_SHA']}`",
              f"- Frozen source plan: `{p['freeze_commit']}`",
              f"- Disposition: `{p['disposition']}`",
              '',
          ]
          for fam in p['families']:
              a=p['summaries'][fam]['2024']; b=p['summaries'][fam]['2025']
              lines += [
                  f"- {fam}: `{p['family_dispositions'][fam]}`",
                  f"  - 2024 >=3 prior mechanism rows: {a['rows_with_ge3_prior']} / {a['players_with_ge3_prior']} players",
                  f"  - 2025 >=3 prior mechanism rows: {b['rows_with_ge3_prior']} / {b['players_with_ge3_prior']} players",
              ]
          lines += [
              '',
              'No Stage-1 personalization rule was scored. No fit/threshold search, no 2026 or Week-6 outcomes, no sportsbook/OddsAPI, no production mutation.',
          ]
          open('/tmp/issue535_stage1_player_benefit_source.md','w').write('\n'.join(lines)+'\n')
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/issue535_stage1_player_benefit_source.md

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-stage1-player-mechanism-benefit-history-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/stage1-player-benefit-source/**
