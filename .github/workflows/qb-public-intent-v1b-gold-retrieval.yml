name: QB Public Intent Source V1B Gold Retrieval

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-first-down-public-intent-source-v1b
    paths:
      - 'docs/migrations/QB_FIRST_DOWN_PUBLIC_INTENT_SOURCE_V1B_AUTOMATION_PLAN.md'
      - 'docs/migrations/QB_FIRST_DOWN_PUBLIC_INTENT_SOURCE_V1_COLLECTION_PREFIX.csv'
      - 'scripts/research/qb_public_intent_v1b_gold_retrieval.py'
      - '.github/workflows/qb-public-intent-v1b-gold-retrieval.yml'

permissions:
  contents: read

jobs:
  gold-retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Compile
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m py_compile scripts/research/qb_public_intent_v1b_gold_retrieval.py

      - name: Run frozen V1B gold retrieval test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/qb_public_intent_v1b
          mkdir -p /tmp/qb_public_intent_v1b
          python scripts/research/qb_public_intent_v1b_gold_retrieval.py \
            --gold docs/migrations/QB_FIRST_DOWN_PUBLIC_INTENT_SOURCE_V1_COLLECTION_PREFIX.csv \
            --out-dir /tmp/qb_public_intent_v1b

      - name: Verify contamination boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qb_public_intent_v1b/summary.json'))
          assert p['study'] == 'QB_FIRST_DOWN_PUBLIC_INTENT_SOURCE_V1B_GOLD_RETRIEVAL'
          assert p['football_outcomes_read'] == 0
          assert p['model_residuals_read'] == 0
          assert p['sportsbook_fields_used'] == 0
          assert p['predictive_models_fit'] == 0
          assert p['production_changes'] == 0
          print('V1B contamination boundary PASS')
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload V1B gold retrieval
        uses: actions/upload-artifact@v4
        with:
          name: qb-public-intent-v1b-gold-retrieval
          path: /tmp/qb_public_intent_v1b/
          if-no-files-found: error
          retention-days: 90
