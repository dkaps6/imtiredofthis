name: Pass Receiving Conservation Integration V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-pass-receiving-conservation-integration-v1
    paths:
      - '.github/workflows/backtest-pass-receiving-conservation-integration-v1.yml'
      - 'scripts/simulation_v2.py'
      - 'scripts/backtest/trace_pass_receiving_conservation_integration_v1.py'
      - 'scripts/backtest/evaluate_pass_receiving_conservation_integration_v1.py'
      - 'scripts/backtest/run_receiving_ecosystem_historical_player_logs.py'
      - 'docs/migrations/PASS_RECEIVING_CONSERVATION_INTEGRATION_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          path: research

      - name: Checkout exact M38 receiving parent
        uses: actions/checkout@v4
        with:
          ref: b98518d97b3038f471aee9ae3201009b2c70bb29
          path: m38_parent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Compile frozen integration code
        working-directory: research
        run: |
          python -m py_compile scripts/simulation_v2.py
          python -m py_compile scripts/backtest/trace_pass_receiving_conservation_integration_v1.py
          python -m py_compile scripts/backtest/evaluate_pass_receiving_conservation_integration_v1.py
          python -m py_compile scripts/backtest/run_receiving_ecosystem_historical_player_logs.py

      - name: Download frozen M89 QB synthesis evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/evidence/m89
          gh run download 33331073376 --repo "${GITHUB_REPOSITORY}" --name m89-qb-data-integrity-casebook-synthesis --dir research/evidence/m89

      - name: Build inputs and run exact B0 vs integrated C2 across 2020-2025
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}/research/data/backtests/pass_receiving_conservation_integration_v1"
          mkdir -p "${ROOT}"
          for SEASON in 2020 2021 2022 2023 2024 2025; do
            PRIOR=$((SEASON-1))
            if [ "${SEASON}" = "2020" ]; then WEEKS="1-17"; else WEEKS="1-18"; fi
            D="${ROOT}/${SEASON}"; I="${D}/inputs"; T="${D}/trace"; mkdir -p "${I}" "${T}"
            echo "=== integration-v1 season=${SEASON} prior=${PRIOR} weeks=${WEEKS} ==="

            PYTHONPATH="${GITHUB_WORKSPACE}/m38_parent" python m38_parent/scripts/backtest/build_historical_inputs.py --season "${SEASON}" --prior-season "${PRIOR}" --weeks "${WEEKS}" --out-dir "${I}"
            PYTHONPATH="${GITHUB_WORKSPACE}/m38_parent" python m38_parent/scripts/backtest/enrich_historical_defense.py --team-weekly "${I}/team_weekly_history.csv" --seasons "${PRIOR},${SEASON}" --audit "${I}/historical_defense_enrichment_audit.csv" --observations "${I}/historical_defense_observations.csv"
            PYTHONPATH="${GITHUB_WORKSPACE}/m38_parent" python m38_parent/scripts/backtest/validate_historical_inputs.py --season "${SEASON}" --prior-season "${PRIOR}" --weeks "${WEEKS}" --data-dir "${I}" --report "${I}/historical_input_validation.csv"
            PYTHONPATH="${GITHUB_WORKSPACE}/research:${GITHUB_WORKSPACE}/m38_parent" python research/scripts/backtest/run_receiving_ecosystem_historical_player_logs.py --seasons "${PRIOR},${SEASON}" --schedule "${I}/schedule_history.csv" --out "${I}/player_game_logs_history.csv"
            PYTHONPATH="${GITHUB_WORKSPACE}/m38_parent" python m38_parent/scripts/backtest/build_historical_injuries.py --seasons "${PRIOR},${SEASON}" --out "${I}/injuries_history.csv"
            PYTHONPATH="${GITHUB_WORKSPACE}/m38_parent" python m38_parent/scripts/backtest/build_historical_weather.py --schedule "${I}/schedule_history.csv" --out "${I}/weather_history.csv"

            PYTHONPATH="${GITHUB_WORKSPACE}/research:${GITHUB_WORKSPACE}/m38_parent" python research/scripts/backtest/trace_pass_receiving_conservation_integration_v1.py \
              --season "${SEASON}" --prior-season "${PRIOR}" --weeks "${WEEKS}" --iterations 2000 \
              --player-logs "${I}/player_game_logs_history.csv" --team-weekly "${I}/team_weekly_history.csv" --schedule "${I}/schedule_history.csv" --universe-dir "${I}/pregame_universe" \
              --injuries "${I}/injuries_history.csv" --weather "${I}/weather_history.csv" --m89-root "${GITHUB_WORKSPACE}/research/evidence/m89" --out-dir "${T}"
          done

      - name: Evaluate frozen integration gates
        working-directory: research
        run: |
          rm -rf data/backtests/pass_receiving_conservation_integration_v1/result
          python scripts/backtest/evaluate_pass_receiving_conservation_integration_v1.py --root data/backtests/pass_receiving_conservation_integration_v1 --out-dir data/backtests/pass_receiving_conservation_integration_v1/result

      - name: Show result
        if: always()
        working-directory: research
        run: |
          cat data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_result.json 2>/dev/null || true
          echo '--- season-position receiving score ---'
          cat data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_season_position_rec_yards.csv 2>/dev/null || true

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-receiving-conservation-integration-v1
          path: |
            research/data/backtests/pass_receiving_conservation_integration_v1/result/*
            research/data/backtests/pass_receiving_conservation_integration_v1/*/trace/integration_v1_conservation_trace.csv
            research/data/backtests/pass_receiving_conservation_integration_v1/*/trace/integration_v1_integrity_counts.csv
            research/docs/migrations/PASS_RECEIVING_CONSERVATION_INTEGRATION_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
