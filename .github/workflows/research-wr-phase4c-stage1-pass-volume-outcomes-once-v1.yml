name: WR Phase4C Stage1 Pass Volume Outcomes Once V1

# ONE-SHOT BLIND OUTCOME EXPOSURE.
# Do not modify/re-run this workflow after the first canonical execution.
# Science is frozen in evaluate_wr_phase4c_stage1_pass_volume_predictor_v1.py.
on:
  push:
    branches:
      - research-wr-phase4c-stage1-pass-volume-predictor-v1
    paths:
      - ".github/workflows/research-wr-phase4c-stage1-pass-volume-outcomes-once-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  outcomes_once:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHASE4B_ARTIFACT_ID: "10404525877"
      PHASE4B_DIGEST: "sha256:0dad0dbc91a4bd6aa3e3f45cbc62e8ed493ca7bf2c95daaa0c4028a54a0fd0d4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest scikit-learn

      - name: Re-run focused Stage1 synthetic tests before exposure
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_evaluate_wr_phase4c_stage1_pass_volume_predictor_v1.py

      - name: Verify canonical Phase4B authority artifact metadata and digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PHASE4B_ARTIFACT_ID}")"
          echo "$meta" > /tmp/phase4b_artifact_metadata.json
          actual_digest="$(printf '%s' "$meta" | jq -r '.digest')"
          actual_expired="$(printf '%s' "$meta" | jq -r '.expired')"
          echo "artifact=${PHASE4B_ARTIFACT_ID} digest=${actual_digest} expired=${actual_expired}"
          test "$actual_digest" = "$PHASE4B_DIGEST"
          test "$actual_expired" = "false"

      - name: Download exact Phase4B authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/phase4b /tmp/stage1_outcomes /tmp/phase4b.zip
          mkdir -p /tmp/phase4b /tmp/stage1_outcomes
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PHASE4B_ARTIFACT_ID}/zip" > /tmp/phase4b.zip
          unzip -q /tmp/phase4b.zip -d /tmp/phase4b
          test -f /tmp/phase4b/wr_phase4b_attribution_v2/phase4b_layer2_3_team_game_detail.csv
          test -f /tmp/phase4b/wr_phase4b_attribution_v2/phase4b_layer1_yard_decomposition.csv

      - name: Execute the single frozen blind Stage1 outcome exposure
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_wr_phase4c_stage1_pass_volume_predictor_v1.py \
            --phase4b-dir /tmp/phase4b/wr_phase4b_attribution_v2 \
            --out-dir /tmp/stage1_outcomes \
            --run-outcomes

      - name: Preserve and validate result contract without disposition gating
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/stage1_outcomes')
          required = [
              root / 'stage1_result.json',
              root / 'stage1_2024_team_game_detail.csv',
              root / 'stage1_pool_bootstrap.csv',
              root / 'stage1_tail_metrics.csv',
          ]
          for p in required:
              assert p.exists(), p
          j = json.loads((root / 'stage1_result.json').read_text())
          assert j['blind_2024_outcomes_scored'] is True
          assert j['production_change'] is False
          assert j['challenger_or_production_authorized'] is False
          assert j['specification'] == 'WR_PHASE4C_STAGE1_PASS_VOLUME_PREDICTOR_V1'
          print('STAGE1_FROZEN_OUTCOME_EXPOSURE_COMPLETE')
          print('DISPOSITION', j['disposition'])
          print('GATES', json.dumps(j['gates'], sort_keys=True))
          PY

      - name: Upload canonical Stage1 outcome artifact regardless of disposition
        uses: actions/upload-artifact@v4
        with:
          name: wr-phase4c-stage1-pass-volume-outcomes-v1
          path: |
            /tmp/stage1_outcomes/stage1_result.json
            /tmp/stage1_outcomes/stage1_2024_team_game_detail.csv
            /tmp/stage1_outcomes/stage1_pool_bootstrap.csv
            /tmp/stage1_outcomes/stage1_tail_metrics.csv
            /tmp/phase4b_artifact_metadata.json
            docs/research/WR_PHASE4C_STAGE1_PASS_VOLUME_PREDICTOR_V1_PLAN.md
            docs/research/WR_PHASE4C_STAGE1_PASS_VOLUME_SOURCE_AUDIT.md
            docs/research/WR_PHASE4C_STAGE1_LAYER2_DOMAIN_AMENDMENT_V1.md
          if-no-files-found: error
          retention-days: 30
