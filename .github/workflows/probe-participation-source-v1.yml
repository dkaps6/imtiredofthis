name: Probe Participation Source

# Diagnostic only. Full Slate on main fails closed in `make_team_form`:
# nflreadpy 0.1.5 caps participation at 2025 ("Season must be between 2016
# and 2025"), so 2026 is permanently unavailable from this source, the
# prior-season backfill runs, and light_box_rate / heavy_box_rate still come
# out missing for all 32 teams.
#
# Those two metrics feed live production paths (team_context_v3,
# modeling/rules_v2, modeling/context_bridge, modeling/contracts), so passing
# allow_missing_box would degrade the model rather than quiet a warning.
#
# This establishes the participation schema and which column resolution in
# compute_personnel_rates actually fails, then checks whether a corrected
# team-column candidate list produces real box rates.
#
# Reads no sportsbook data and spends nothing. Changes no production file.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/nice-cori-4qkwqs
    paths:
      - '.github/workflows/probe-participation-source-v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Participation schema and column resolution
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'EOF'
          import pandas as pd

          from scripts.make_team_form import load_participation

          part = load_participation(2025)
          print(f"2025 participation rows={len(part)}")
          print(f"all columns ({len(part.columns)}):")
          for c in sorted(part.columns):
              print(f"    {c}")

          # Exactly the candidate lists compute_personnel_rates uses today.
          box_cands = ["box", "men_in_box", "in_box", "defenders_in_box"]
          team_cands = ["offense_team", "posteam", "team", "club_code"]
          box_col = next((c for c in box_cands if c in part.columns), None)
          team_col = next((c for c in team_cands if c in part.columns), None)
          print()
          print(f"RESOLVED box_col  = {box_col!r}")
          print(f"RESOLVED team_col = {team_col!r}   <-- None means box rates are skipped")

          # Any column that actually looks like a team identifier.
          print()
          print("team-ish columns present:")
          for c in sorted(part.columns):
              if "team" in c.lower() or "club" in c.lower():
                  nun = part[c].nunique(dropna=True)
                  sample = sorted(str(v) for v in part[c].dropna().unique()[:4])
                  print(f"    {c}: nunique={nun} sample={sample}")
          EOF

      - name: Does a corrected team-column candidate list produce box rates
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'EOF'
          import numpy as np
          import pandas as pd

          from scripts._opponent_map import canon_team
          from scripts.make_team_form import load_participation

          part = load_participation(2025)
          box_col = "defenders_in_box"
          # possession_team is the nflverse participation offense identifier.
          team_col = next(
              (c for c in ("possession_team", "offense_team", "posteam", "team", "club_code")
               if c in part.columns),
              None,
          )
          print(f"using box_col={box_col!r} team_col={team_col!r}")
          if team_col is None or box_col not in part.columns:
              raise SystemExit("cannot resolve columns; schema differs from expectation")

          p = part.copy()
          p["_team"] = p[team_col].map(canon_team)
          p = p[p["_team"] != ""]
          box = pd.to_numeric(p[box_col], errors="coerce")
          p["_light"] = (box <= 6).astype(float)
          p["_heavy"] = (box >= 8).astype(float)
          g = p.groupby("_team").agg(
              light_box_rate=("_light", "mean"),
              heavy_box_rate=("_heavy", "mean"),
              plays=("_light", "size"),
          )
          print(f"\nteams with box rates: {len(g)}")
          print(f"nulls: light={int(g.light_box_rate.isna().sum())} heavy={int(g.heavy_box_rate.isna().sum())}")
          print()
          print(g.sort_index().head(34).to_string())
          EOF
