name: Diagnose Week 3 Full Slate

# Reproduces a Full Slate failure against odds a paid run already preserved,
# so debugging costs no OddsAPI credits. Restores the artifact verbatim and
# re-runs only the step under investigation.

on:
  workflow_dispatch:
  push:
    branches: [claude/nice-cori-4qkwqs]
    paths: ['.github/workflows/diagnose-week3-identity-failure.yml']

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '36276421905'
  SEASON: '2026'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Restore the preserved paid run verbatim
        run: |
          set -euo pipefail
          rm -rf /tmp/fs && mkdir -p /tmp/fs
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "run_${SOURCE_RUN_ID}" --dir /tmp/fs
          test -d /tmp/fs/data && test -d /tmp/fs/outputs
          rm -rf data outputs && mkdir -p data outputs
          cp -a /tmp/fs/data/. data/
          cp -a /tmp/fs/outputs/. outputs/
          echo "restored $(find data outputs -type f | wc -l) files"

      - name: State of the boundary this run reached
        run: |
          export PYTHONPATH="${PWD}"
          python - <<'EOF'
          import pandas as pd, pathlib
          q = pathlib.Path("data/live_odds_placeholder_rows.csv")
          if q.exists():
              d = pd.read_csv(q)
              print("quarantine reasons:", d["quarantine_reason"].value_counts().to_dict())
              un = d[d["quarantine_reason"].eq("UNROSTERED_NONCORE_PLAYER")]
              if len(un):
                  cols = [c for c in ("player","team_abbr","market") if c in un.columns]
                  print("unrostered non-core:")
                  print(un[cols].drop_duplicates().to_string(index=False))
          for f in ("outputs/props_raw_compact.csv", "data/metrics_ready.csv",
                    "outputs/props_pricing_offers.csv", "outputs/props_priced_clean.csv"):
              p = pathlib.Path(f)
              print(f"  {f}: {'ABSENT' if not p.exists() else str(len(pd.read_csv(p, low_memory=False))) + ' rows'}")
          EOF

      - name: Reproduce the failing pricing step
        run: |
          set +e
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}" 2>&1 | tail -50
          echo "=== pricing exit: ${PIPESTATUS[0]} ==="
