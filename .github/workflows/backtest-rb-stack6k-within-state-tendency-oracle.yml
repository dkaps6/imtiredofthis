name: RB STACK6K Within-State Tendency Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6k-within-state-tendency-oracle
    paths:
      - 'scripts/backtest/evaluate_rb_stack6k_within_state_tendency_oracle.py'
      - 'docs/migrations/RB_STACK6K_WITHIN_STATE_TENDENCY_ORACLE_PLAN.md'
      - '.github/workflows/backtest-rb-stack6k-within-state-tendency-oracle.yml'

permissions:
  contents: read
  actions: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      M94C_RUN_ID: '33353485070'
      STACK6H_RUN_ID: '33632678179'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4
      - name: Compile
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6k_within_state_tendency_oracle.py
      - name: Download frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6k/m94c data/backtests/rb_stack6k/stack6h
          gh run download "$M94C_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-94c-rb-game-environment --dir data/backtests/rb_stack6k/m94c
          gh run download "$STACK6H_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6h-current-pool-oracle --dir data/backtests/rb_stack6k/stack6h
          test -s data/backtests/rb_stack6k/m94c/m94c_2025_team_trace.csv
          test -s data/backtests/rb_stack6k/stack6h/stack6h_team_trace.csv
      - name: Run frozen STACK6K oracle
        run: |
          rm -rf data/backtests/rb_stack6k/results
          python scripts/backtest/evaluate_rb_stack6k_within_state_tendency_oracle.py \
            --m94c-root data/backtests/rb_stack6k/m94c \
            --stack6h-root data/backtests/rb_stack6k/stack6h \
            --out-dir data/backtests/rb_stack6k/results
      - name: Show outputs
        if: always()
        run: |
          echo '=== integrity ==='
          cat data/backtests/rb_stack6k/results/stack6k_integrity.csv 2>/dev/null || true
          echo '=== truth bridge ==='
          cat data/backtests/rb_stack6k/results/stack6k_truth_bridge.csv 2>/dev/null || true
          echo '=== overall ==='
          cat data/backtests/rb_stack6k/results/stack6k_overall_scores.csv 2>/dev/null || true
          echo '=== bins ==='
          cat data/backtests/rb_stack6k/results/stack6k_bin_scores.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6k/results/stack6k_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6k-within-state-tendency-oracle
          path: data/backtests/rb_stack6k/results/**
          if-no-files-found: warn
          retention-days: 30
