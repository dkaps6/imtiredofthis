name: M96A Advance Research Handoff

on:
  push:
    branches:
      - research-rb-m96a-opportunity-efficiency-attribution
    paths:
      - '.github/workflows/advance-m96a-research-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance-handoff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update canonical research handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md')
          s = p.read_text()

          s = s.replace(
              '- Current research branch: `research-rb-m95t-constrained-dual-layer-tail`',
              '- Current research branch: `research-rb-m96a-opportunity-efficiency-attribution`'
          )
          s = s.replace(
              '- No M91-M95T RB research has been promoted to production.',
              '- No M91-M96A RB research has been promoted to production.'
          )

          marker = '- **M95T was the final retrospective carry-tail candidate. It improved pooled Brier/logloss/AUC and repaired 2023 directionally, but failed the frozen cross-season stability gates because 2025 calibration still worsened materially. Per the stopping rule, new retrospective RB carry-tail candidates stop here; M94C/M95F is the conservative workload foundation for M96 rushing-yard synthesis.**'
          add = marker + '\n- **M96A attributed 2025 rushing-yard error jointly to opportunity and efficiency: perfect carries recovered 7.68 MAE yards, perfect efficiency 6.73, and opportunity was the larger absolute component in 59.7% of games. The precommitted 1-yard dominance margin was missed by 0.048 yards, so M96B must model workload and efficiency as separate distributions rather than declaring either side solved.**'
          if marker in s and 'M96A attributed 2025 rushing-yard error jointly' not in s:
              s = s.replace(marker, add)

          start = s.index('# NEXT MIGRATION — M96\n')
          end = s.index('\n## Fresh-chat startup procedure', start)
          new = '''# Latest completed migration: M96A — opportunity vs efficiency attribution\n\nFull results: `docs/migrations/M96A_RB_OPPORTUNITY_EFFICIENCY_ATTRIBUTION_RESULTS.md`.\n\nAuthoritative:\n\n- workflow `M96A RB Opportunity-Efficiency Attribution`\n- run **`33459376333`**\n- job **`99706110345`**\n- tested SHA **`9e3b152e7e756b8a29798ef82cfa9a0730c51f89`**\n- artifact **`9782611047`**\n- artifact SHA256 **`a2d4f99b9e7b3f2b75c8694e79c6856dd09e4b5ee9921b2d53488e89cdab3d6e`**\n- execution success\n- disposition **`JOINT_ADVANCE_M96B_SEPARATE_WORKLOAD_AND_EFFICIENCY_DISTRIBUTIONS`**\n- model fit `0`; feature search `0`; coefficient search `0`; sportsbook `0`; production change `0`\n\nM96A used complete M94C 2025 rushing-yard truth (`1,393/1,393`) and exact frozen M94C/M95F/M95I workload outputs. The first green run was not accepted because M95F carried only 1,340 nonmissing yard-truth rows; Run #2 fixed only the truth-source mechanics and retained the frozen candidate/routing contract.\n\nAll-RB M94C rushing-yard MAE was **`21.0312`**. Perfect actual carries with frozen pregame efficiency reduced MAE to **`13.3535`** (recovery `7.6777` yards). Perfect game efficiency with frozen projected carries reduced MAE to **`14.3055`** (recovery `6.7256`). Opportunity was the larger absolute residual component in **`59.73%`** of games, but the oracle recovery advantage was only **`0.9520`** yards versus the frozen `1.0`-yard dominance requirement. The route is therefore JOINT.\n\nThe regime split is highly informative: 0-5 and 20+/25+ carry games are primarily opportunity-sensitive; 11-19 carry games are primarily efficiency-sensitive. Actual 20+ games recover `11.37` MAE yards with perfect opportunity versus `3.60` with perfect efficiency. Stable-workhorse yardage is more efficiency-sensitive overall (`8.48` opportunity recovery vs `12.54` efficiency recovery). Carries are therefore not solved, but neither are they the only remaining RB bottleneck.\n\nCollapsing M95F's carry distribution to one expectation worsened all-RB yard MAE (`21.0312 -> 22.4455`) while improving true 20+ carry games (`40.0051 -> 36.3540`) and 25+ games (`49.3105 -> 44.8607`). This confirms that the post-M94C tail work belongs in a **distribution layer**, not as a universal point-mean boost. The frozen M95I deterministic vacancy point branch did not beat M94C globally; M95I's previously validated vacancy probability/ranking evidence remains separate research signal.\n\n# NEXT MIGRATION — M96B\n\nName: **M96B — RB Joint Workload × Efficiency Distribution Synthesis**\n\nPrimary question:\n\n> Can a joint but decomposed pregame model preserve M94C's strong central workload behavior, use M95F/M95I only where their distributional/regime evidence is valid, and combine that with the retained M95C efficiency/environment signal to materially improve rushing-yard point accuracy and 75+/100+ tail probabilities across time?\n\nRequired design:\n\n- Keep **M94C central carries** as the point/central opportunity anchor unless a later precommitted candidate earns replacement.\n- Preserve **M95F as workload-tail/distribution information**, not as a universally higher deterministic carry mean. M96A explicitly showed its mixture expectation hurts overall yard MAE despite helping true 20+/25+ games.\n- Keep **M95I vacancy/role-transition probability evidence separate**; do not silently apply the M95I deterministic transform to stable incumbents.\n- Build the efficiency side beginning with M95C's retained result: blocking/offensive environment was the most stable mean-efficiency signal, while runner-created/explosive information was more useful for high-yardage upside.\n- Represent rushing yards as **workload distribution × efficiency distribution**. Do not use one scalar YPC multiplier as if efficiency variance were solved.\n- The central point/median must be protected from tail inflation. Any tail distribution that raises aggregate expected yards must prove the point gain rather than inherit it automatically from M95F's mixture mean.\n- Explicitly audit 0-5, 6-10, 11-14, 15-19, 20+, 25+, stable-workhorse, incumbent and vacancy regimes because M96A showed the dominant error source changes by workload state.\n- Primary point metrics: rushing-yard MAE, RMSE, bias, correlation by season and pooled.\n- Tail metrics: 75+/100+ discrimination **and calibration**, plus distributional coverage/quantiles.\n- Use the broadest leakage-safe temporal panel available; 2025 is development/diagnostic evidence, not pristine confirmation.\n- No sportsbook/player-line inputs during football-model construction.\n- No production promotion until a frozen RB synthesis survives temporal/prospective 2026 confirmation.\n- Do not reopen generic M95 tail coefficient search. Only a carry failure specifically demonstrated downstream by M96 may be revisited.\n\nDecision path:\n\n- If the joint synthesis improves point and distributional rushing-yard metrics without material ordinary-game or season-specific regression, freeze it for prospective/shadow confirmation.\n- If efficiency improvements work but workload distribution remains unstable, retain M94C central workload and promote only the validated efficiency layer to the next confirmation stage.\n- If the joint model exposes a specific opportunity slice as the dominant remaining error, reopen only that narrowly demonstrated workload mechanism.\n- If no synthesis survives the guards, document the ceiling and retain the conservative RB stack rather than restarting broad M95 search.\n'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes required.'
            exit 0
          fi
          git commit -m 'M96A: advance canonical research handoff to M96B'
          git push origin HEAD:research-rb-m96a-opportunity-efficiency-attribution
