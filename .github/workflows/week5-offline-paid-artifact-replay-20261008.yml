name: Week5 Offline Paid Artifact Replay 20261008

on:
  push:
    branches:
      - hotfix/week5-offline-paid-artifact-replay-20261008
    paths:
      - '.github/workflows/week5-offline-paid-artifact-replay-20261008.yml'
      - 'scripts/validate_full_slate_data_quality_v1.py'
      - 'tests/test_full_slate_data_quality_scope.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: "2026-10-08"
  FETCH_LIVE_ODDS: "false"
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
  SOURCE_RUN_ID: "37852811339"
  SOURCE_ARTIFACT_ID: "11582178322"
  SOURCE_ARTIFACT_NAME: "run_37852811339"
  SOURCE_ARTIFACT_DIGEST: "sha256:4948e08003fcab0f519b35bd4b23d8c895554e4faced993238575acdc5d2e765"

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest

      - name: Verify exact paid Week5 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/source_artifact.json
          python - <<'PY'
          import json, os
          a=json.load(open('/tmp/source_artifact.json'))
          assert int(a['id'])==int(os.environ['SOURCE_ARTIFACT_ID']), a
          assert a['name']==os.environ['SOURCE_ARTIFACT_NAME'], a
          assert a.get('digest')==os.environ['SOURCE_ARTIFACT_DIGEST'], a
          assert a.get('expired') is False, a
          print({
            'source_artifact_id':a['id'],
            'name':a['name'],
            'digest':a.get('digest'),
            'expired':a.get('expired'),
          })
          PY

      - name: Download preserved paid Week5 artifact
        uses: actions/download-artifact@v4
        with:
          name: run_37852811339
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37852811339

      - name: Restore exact football and live-odds state without API acquisition
        run: |
          set -euo pipefail
          test -d replay_source/data
          test -d replay_source/outputs
          rm -rf data outputs
          mkdir -p data outputs
          cp -a replay_source/data/. data/
          cp -a replay_source/outputs/. outputs/

          test -s outputs/props_raw.csv
          test -s outputs/props_raw_compact.csv
          test -s outputs/odds_game.csv
          test -s data/live_odds_status.json
          test -s data/live_odds_placeholder_rows.csv
          test -s data/roles_current_production_eligible_v1.csv
          test -s data/qb_distribution_state_context.csv

          sha256sum outputs/props_raw.csv outputs/props_raw_compact.csv outputs/odds_game.csv > /tmp/preserved_odds.sha256

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/live_odds_status.json')
          s=json.loads(p.read_text())
          if not s.get('available'):
              raise SystemExit(f"preserved paid source does not report available markets: {s}")
          s['replay_source_run']=int(os.environ['SOURCE_RUN_ID'])
          s['replay_source_artifact_id']=int(os.environ['SOURCE_ARTIFACT_ID'])
          s['replay_source_artifact_digest']=os.environ['SOURCE_ARTIFACT_DIGEST']
          s['odds_api_refetched']=False
          s['replay_mode']='OFFLINE_PRESERVED_WEEK5_PAID_ARTIFACT'
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print('OFFLINE_WEEK5_PAID_ARTIFACT_RESTORED', {
              'production_compact_rows':s.get('production_compact_rows'),
              'production_quarantined_rows':s.get('production_quarantined_rows'),
              'odds_api_refetched':s['odds_api_refetched'],
          })
          PY

          echo "NO ODDS API ACQUISITION COMMAND EXISTS IN THIS WORKFLOW"

      - name: Certify bye-week data-quality repair
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_full_slate_data_quality_scope.py
          python scripts/validate_full_slate_data_quality_v1.py
          test -s data/full_slate_data_quality_audit.json
          cat data/full_slate_data_quality_audit.json

      - name: Reapply current production availability and QB C2 code seams
        env:
          PYTHONPATH: ${{ github.workspace }}
          ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
        run: |
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python scripts/operations/apply_qb_c2_active_schedule_context_seam_v1.py
          python -m py_compile scripts/run_pricing_with_full_roster_universe_v1.py scripts/modeling/rb_r26_receptions_production_adapter_v1.py scripts/modeling/qb_c2_production_adapter_v1.py

      - name: Assemble preserved bookmaker offers and deterministic metrics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/materialize_pricing_offers_v1.py
          test -s outputs/props_pricing_offers.csv
          test -s data/live_pricing_offer_audit.json
          python scripts/run_metrics_context.py --season "${SEASON}" --mode full --date "${SLATE_DATE}"
          python scripts/validate_build_integrity.py
          python scripts/metrics_ready.py --season "${SEASON}" --date "${SLATE_DATE}"
          test -s data/metrics_ready.csv

      - name: Price exact preserved Week5 board from certified football stack
        env:
          PYTHONPATH: ${{ github.workspace }}
          ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
        run: |
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          test -s data/football_simulation_universe_audit.json
          test -s data/wr_r15_full_slate_entitlement_audit.json
          test -s data/qb_c2_production_integration_audit.json
          test -s data/rb_rush_rec_conservation_v2_production_audit.json

          python scripts/stamp_qb_c2_pricing_lineage_v1.py
          python scripts/validate_rb_rush_rec_conservation_v1.py
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_anytime_td_model_status_v1.py
          python scripts/validate_team_target_pool_full_universe_v2.py
          python scripts/validate_certified_full_slate_stack_v2.py
          python scripts/validate_full_slate_mechanical_certification_v1.py

      - name: Apply final-board-only verified prop quarantines
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/operations/quarantine_final_priced_props_v1.py
          test -s data/final_priced_props_quarantine_status.json

      - name: Prove preserved odds bytes were not reacquired or mutated
        run: |
          set -euo pipefail
          sha256sum -c /tmp/preserved_odds.sha256
          python - <<'PY'
          import json
          s=json.load(open('data/live_odds_status.json'))
          assert s.get('odds_api_refetched') is False, s
          assert s.get('replay_mode')=='OFFLINE_PRESERVED_WEEK5_PAID_ARTIFACT', s
          assert int(s.get('replay_source_run',0))==37852811339, s
          print('ZERO_NEW_ODDSAPI_CONFIRMED', s['replay_mode'])
          PY

      - name: Strict repository and production audits
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict

      - name: Build master betting workbook from preserved Week5 odds
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p outputs
          python scripts/build_master_betting_workbook_v1.py             --root .             --out outputs/NFL_BETTING_MODEL_MASTER.xlsx             --run-id "${GITHUB_RUN_ID}"             --sha "${GITHUB_SHA}"             --ref-name "${GITHUB_REF_NAME}"             --fetch-live-odds "false"
          test -s outputs/NFL_BETTING_MODEL_MASTER.xlsx

      - name: Upload offline Week5 priced replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-offline-paid-replay-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            data/**
            outputs/**
