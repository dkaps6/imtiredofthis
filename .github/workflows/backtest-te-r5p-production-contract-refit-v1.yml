name: TE-R5P Production Contract Refit V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - 'scripts/backtest/evaluate_te_r5p_production_contract_refit_v1.py'
      - 'docs/migrations/TE_R5P_PRODUCTION_CONTRACT_REFIT_V1_PLAN.md'
      - '.github/workflows/backtest-te-r5p-production-contract-refit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  te-r5p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen evaluator
        run: python -m py_compile scripts/backtest/evaluate_te_r5p_production_contract_refit_v1.py
      - name: Download authoritative TE-R3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/te_r3
          gh run download 34126813280 --repo "${GITHUB_REPOSITORY}" --name te-r3-target-pool-context-model --dir evidence/te_r3
      - name: Download authoritative TE-R4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/te_r4
          gh run download 34127474412 --repo "${GITHUB_REPOSITORY}" --name te-r4-strict-prior-participation-source --dir evidence/te_r4
      - name: Verify frozen inputs
        run: |
          test -s evidence/te_r3/data/backtests/te_r3_target_pool_context_model/te_r3_oos_player_casebook.csv || find evidence/te_r3 -name te_r3_oos_player_casebook.csv -size +0c | grep -q .
          test -s evidence/te_r4/data/backtests/te_r4_strict_prior_participation_source/te_r4_prior_participation_casebook.csv || find evidence/te_r4 -name te_r4_prior_participation_casebook.csv -size +0c | grep -q .
          find evidence/te_r4 -name te_r4_result.json -size +0c | grep -q .
      - name: Run frozen TE-R5P validation
        run: |
          python scripts/backtest/evaluate_te_r5p_production_contract_refit_v1.py \
            --te-r3-root evidence/te_r3 \
            --te-r4-root evidence/te_r4 \
            --out-dir data/backtests/te_r5p_production_contract_refit_v1
      - name: Show result
        run: |
          cat data/backtests/te_r5p_production_contract_refit_v1/te_r5p_result.json
          cat data/backtests/te_r5p_production_contract_refit_v1/te_r5p_season_scorecard.csv
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: |
            data/backtests/te_r5p_production_contract_refit_v1/*
            docs/migrations/TE_R5P_PRODUCTION_CONTRACT_REFIT_V1_PLAN.md
          retention-days: 30
