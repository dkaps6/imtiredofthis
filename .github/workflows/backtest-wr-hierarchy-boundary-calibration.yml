name: 2025 WR Hierarchy Boundary Calibration
on:
  workflow_dispatch:
    inputs:
      weeks: {description: "Weeks", required: false, default: "1-18"}
      iterations: {description: "MC iterations per candidate/week", required: false, default: "2000"}
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib
      - name: Build leakage-safe historical inputs
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --out-dir data/backtests
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests/historical_defense_enrichment_audit.csv --observations data/backtests/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --data-dir data/backtests --report data/backtests/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule data/backtests/schedule_history.csv --out data/backtests/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests/schedule_history.csv --out data/backtests/weather_history.csv
      - name: Run Migration 37 WR hierarchy boundary calibration
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python scripts/backtest/calibrate_wr_hierarchy_boundary.py --season 2025 --prior-season 2024 --weeks "${{ inputs.weeks || '1-18' }}" --iterations "${{ inputs.iterations || '2000' }}" --out-dir data/backtests/wr_hierarchy_boundary_calibration
      - name: Show results
        if: always()
        run: |
          cat data/backtests/wr_hierarchy_boundary_calibration/wr_target_hierarchy_candidate_ranking.csv 2>/dev/null || true
          cat data/backtests/wr_hierarchy_boundary_calibration/wr_target_hierarchy_share_summary.csv 2>/dev/null || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-37-wr-hierarchy-boundary-calibration
          path: |
            data/backtests/historical_input_validation.csv
            data/backtests/wr_hierarchy_boundary_calibration/*.csv
          if-no-files-found: warn
          retention-days: 14
