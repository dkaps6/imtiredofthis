# probe: does Tua Tagovailoa have a real posted line for ATL tonight?
name: Scratch Replay Pricing With Eligible-Team Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-replay-pricing-with-fix.yml'

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: ""
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download real props/context data from run 34769507865 (no re-fetch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 34769507865 --repo "$GITHUB_REPOSITORY" --name run_34769507865 --dir artifact
          cp -rv artifact/data/. data/
          cp -rv artifact/outputs/. outputs/
          echo "=== restored props/context artifacts ==="
          test -s outputs/props_pricing_offers.csv && echo "props_pricing_offers.csv OK"
          test -s data/live_pricing_offer_audit.json && echo "live_pricing_offer_audit.json OK"
          test -s data/metrics_ready.csv && echo "metrics_ready.csv OK"
          test -s data/player_form_consensus.csv && echo "player_form_consensus.csv OK"
      - name: Check whether Tua Tagovailoa has a real posted ATL line
        run: |
          echo "=== props_raw.csv rows mentioning Tua ==="
          grep -i "tagovailoa" outputs/props_raw.csv || echo "no match in outputs/props_raw.csv"
          echo
          echo "=== data/props_raw.csv rows mentioning Tua ==="
          grep -i "tagovailoa" data/props_raw.csv || echo "no match in data/props_raw.csv"
          echo
          echo "=== ATL rows in roles_ourlads.csv ==="
          grep -i ",ATL," data/roles_ourlads.csv || grep -i "ATL" data/roles_ourlads.csv | head -20

      - name: Apply certified availability-aware current-output coverage seams
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python -m py_compile scripts/run_pricing_with_full_roster_universe_v1.py scripts/modeling/rb_r26_receptions_production_adapter_v1.py scripts/modeling/qb_c2_production_adapter_v1.py
      - name: Price from certified football-first Full Slate stack (replay, no live fetch)
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          test -s data/football_simulation_universe_audit.json
          echo "=== football_simulation_universe_audit.json ==="
          cat data/football_simulation_universe_audit.json
          echo
          echo "=== priced row count ==="
          python3 -c "
          import pandas as pd
          df = pd.read_csv('outputs/props_priced_clean.csv')
          print('rows:', len(df))
          print('teams:', sorted(df['team'].dropna().astype(str).unique()) if 'team' in df.columns else 'n/a')
          print('players:', df['player'].nunique() if 'player' in df.columns else 'n/a')
          "
