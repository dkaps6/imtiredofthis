name: Scratch WR-CB Source Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-wr-cb-source-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml beautifulsoup4 html5lib
      - name: Probe candidate WR-CB matchup sources
        run: |
          python - <<'EOF'
          import requests
          import pandas as pd
          from bs4 import BeautifulSoup

          HDRS = {"User-Agent": "Mozilla/5.0 (compatible; FullSlateProbe/1.0)"}

          def probe(name, url):
              print(f"\n=== {name} ===")
              print(f"URL: {url}")
              try:
                  resp = requests.get(url, headers=HDRS, timeout=30)
                  print(f"status={resp.status_code} len={len(resp.text)}")
                  if resp.status_code != 200:
                      print(f"non-200, first 500 chars:\n{resp.text[:500]}")
                      return
                  try:
                      tables = pd.read_html(resp.text)
                      print(f"pd.read_html found {len(tables)} tables")
                      for i, t in enumerate(tables[:6]):
                          print(f"  table[{i}] shape={t.shape} cols={list(t.columns)[:12]}")
                  except Exception as e:
                      print(f"pd.read_html failed: {e}")
                  soup = BeautifulSoup(resp.text, "html.parser")
                  next_data = soup.find("script", {"id": "__NEXT_DATA__"})
                  print(f"__NEXT_DATA__ present: {bool(next_data)}")
                  paywall_hits = sum(1 for kw in ["subscribe", "paywall", "sign in to continue", "premium content", "log in to view"] if kw in resp.text.lower())
                  print(f"paywall-keyword hits: {paywall_hits}")
              except Exception as e:
                  print(f"REQUEST FAILED: {type(e).__name__}: {e}")

          probe("FantasyPoints WR-CB (currently wired)", "https://www.fantasypoints.com/nfl/reports/wr-cb-matchups")
          probe("RotoBaller generic hub (currently wired)", "https://www.rotoballer.com/wr-cb-matchups")
          probe("RotoBaller weekly article (user-supplied, Week 1 2026)", "https://www.rotoballer.com/wr-cb-matchups-for-fantasy-football-sleepers-targets-for-week-1-2026/1922280")
          probe("Rotowire player alignment (currently wired)", "https://www.rotowire.com/football/player-alignment.php")
          EOF
