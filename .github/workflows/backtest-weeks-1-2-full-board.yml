name: Backtest Weeks 1-2 Full Board

# Full graded backtest of the real priced boards for Week 1 and Week 2,
# now that nflverse carries final Week 2 stats. Read-only: it replays two
# already-paid-for Full Slate artifacts and never fetches sportsbook odds.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/nice-cori-4qkwqs
    paths:
      - '.github/workflows/backtest-weeks-1-2-full-board.yml'
      - 'scripts/operations/grade_market_track_record_v1.py'
      - 'scripts/operations/grade_market_track_record_gsis_v1.py'
      - 'scripts/operations/report_weekly_backtest_v1.py'
      - 'scripts/operations/backtest_full_report_v1.py'

permissions:
  contents: read
  actions: read

env:
  BACKTEST_SEASON: '2026'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Verify the committed Week 1 and Week 2 boards
        run: |
          set -euo pipefail
          python - <<'EOF'
          import pandas as pd
          for week in (1, 2):
              p = f'data/market_track_record/boards/2026_wk{week:02d}.csv'
              d = pd.read_csv(p, low_memory=False)
              assert len(d) > 0, f'{p} is empty'
              print(f'week {week} committed board: {len(d)} rows, {d["market"].nunique()} markets')
          EOF

      - name: Grade both weeks against final nflverse actuals
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/grade_market_track_record_gsis_v1.py \
            --season "${BACKTEST_SEASON}" --weeks "1,2" \
            --detail-out /tmp/graded_weeks_1_2.csv
          test -s /tmp/graded_weeks_1_2.csv

      - name: Report the full decomposition
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/report_weekly_backtest_v1.py \
            --detail /tmp/graded_weeks_1_2.csv

      - name: Upload graded detail
        uses: actions/upload-artifact@v4
        with:
          name: backtest_weeks_1_2_graded
          path: |
            /tmp/graded_weeks_1_2.csv
            data/market_track_record/boards/
          if-no-files-found: error
          retention-days: 90
