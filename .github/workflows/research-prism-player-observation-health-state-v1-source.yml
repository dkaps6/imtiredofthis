name: Research PRISM Player Observation Health State V1 Source

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_PLAYER_OBSERVATION_HEALTH_STATE_V1_SOURCE_PLAN.md'
      - 'scripts/research/audit_prism_player_observation_health_state_v1.py'
      - 'tests/test_prism_player_observation_health_state_v1.py'
      - '.github/workflows/research-prism-player-observation-health-state-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "731541d42c82b94cf4261d31d12202ad0911e8e8"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest nflreadpy pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_PLAYER_OBSERVATION_HEALTH_STATE_V1_SOURCE_PLAN.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_player_observation_health_state_v1.py" 2>/dev/null; then
            echo "ERROR: source implementation existed at amended freeze"
            exit 1
          fi

      - name: Compile and test source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_player_observation_health_state_v1.py
          pytest -q tests/test_prism_player_observation_health_state_v1.py

      - name: Execute frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/prism-observation-health
          mkdir -p /tmp/prism-observation-health
          python scripts/research/audit_prism_player_observation_health_state_v1.py             --out-dir /tmp/prism-observation-health

      - name: Certify source-only boundary
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p=json.load(open('/tmp/prism-observation-health/player_observation_health_state_source_result.json'))
          rows=pd.read_csv('/tmp/prism-observation-health/player_observation_health_state_rows.csv')
          assert p['version']=='PRISM_PLAYER_OBSERVATION_HEALTH_STATE_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='731541d42c82b94cf4261d31d12202ad0911e8e8',p
          assert p['disposition'] in {
              'PRISM_PLAYER_OBSERVATION_HEALTH_STATE_V1_SOURCE_READY',
              'PRISM_PLAYER_OBSERVATION_HEALTH_STATE_V1_SOURCE_BLOCKED',
          },p
          assert set(p['season_summaries'][0]['state_counts']) == {
              'NO_REPORT_PARTICIPATED',
              'REPORTED_INJURY_PARTICIPATED',
              'REPORTED_INJURY_NO_OFFENSIVE_SNAPS',
              'NO_REPORT_NO_OFFENSIVE_SNAPS_UNRESOLVED',
          },p
          assert set(rows['season'].astype(int).unique()) == {2024,2025}
          assert set(rows['family'].astype(str).unique()).issubset({'QB','RB','WR','TE'})
          assert p['state_audit']['chronology_violations']==0,p
          assert p['predictive_relationships_scored']==0,p
          assert p['outcome_production_fields_scored']==0,p
          assert p['models_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json,os
          p=json.load(open('/tmp/prism-observation-health/player_observation_health_state_source_result.json'))
          print("### PRISM player observation health-state V1 — source audit")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for s in p['season_summaries']:
              failed=[k for k,v in s['gates'].items() if not v]
              print()
              print(f"**{s['season']}**")
              print(f"- roster rows={s['roster_rows']} players={s['players']} stable-ID={s['roster_stable_id_coverage']:.2%}")
              print(f"- positive-snap join={s['positive_snap_roster_join_coverage']:.2%}; injury join={s['injury_roster_join_coverage']:.2%}; injury-info={s['injury_joined_info_coverage']:.2%}")
              print(f"- states={s['state_counts']}; returns={s['return_rows']}; bye rows retained={s['bye_rows_retained']}")
              print(f"- failed gates={failed or ['NONE']}")
          print()
          print("Source/state labeling only. No yards/carries/targets/receptions/TD relationship scored; no 2026 outcomes; no sportsbook/OddsAPI; no fitted threshold; no production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-player-observation-health-state-v1-source-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-observation-health/**
