name: Game-Script-Confirmed Player Usage V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/diagnose_game_script_confirmed_player_usage_v1.py"
      - "scripts/research/diagnose_vegas_line_gamescript_calibration_v1.py"
      - "tests/test_diagnose_game_script_confirmed_player_usage_v1.py"
      - "docs/research/GAME_SCRIPT_CONFIRMED_PLAYER_USAGE_V1_PLAN.md"
      - ".github/workflows/research-game-script-confirmed-player-usage-v1.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_diagnose_game_script_confirmed_player_usage_v1.py tests/test_diagnose_vegas_line_gamescript_calibration_v1.py

  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml

      - name: Run game-script-confirmed player usage diagnosis
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/gs_player_usage/result
          python scripts/research/diagnose_game_script_confirmed_player_usage_v1.py \
            --seasons 2023,2024,2025 \
            --out-dir /tmp/gs_player_usage/result

      - name: Show results
        if: always()
        run: |
          cat /tmp/gs_player_usage/result/game_script_confirmed_player_usage_summary.csv 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-script-confirmed-player-usage-v1
          path: |
            /tmp/gs_player_usage/result/*.csv
            docs/research/GAME_SCRIPT_CONFIRMED_PLAYER_USAGE_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 14
