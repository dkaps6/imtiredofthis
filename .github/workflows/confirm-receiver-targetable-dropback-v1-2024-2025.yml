name: Confirm Receiver Targetable Dropback V1 2024-2025

on:
  push:
    branches: [research-receiver-targetable-dropback-v1-confirm-2024-2025]
    paths:
      - 'docs/research/RECEIVER_TARGETABLE_DROPBACK_V1_2024_2025_CONFIRMATION_PLAN.md'
      - 'scripts/research/confirm_receiver_targetable_dropback_v1_2024_2025.py'
      - '.github/workflows/confirm-receiver-targetable-dropback-v1-2024-2025.yml'
  workflow_dispatch:

concurrency:
  group: confirm-receiver-targetable-dropback-v1-2024-2025
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyarrow scikit-learn joblib

      - name: Compile frozen confirmation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/confirm_receiver_targetable_dropback_v1_2024_2025.py

      - name: Build 2024 and 2025 historical universes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/targetable_confirm /tmp/hist_2024 /tmp/hist_2025
          mkdir -p /tmp/targetable_confirm /tmp/hist_2024 /tmp/hist_2025
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir /tmp/hist_2025

      - name: Combine historical schedule and team state
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/targetable_confirm')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined rows in {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build player, injury and weather history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024,2025 --schedule /tmp/targetable_confirm/schedule_history.csv --out /tmp/targetable_confirm/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024,2025 --out /tmp/targetable_confirm/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule /tmp/targetable_confirm/schedule_history.csv --out /tmp/targetable_confirm/weather_history.csv

      - name: Run frozen 2024-2025 confirmation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/targetable_confirm/result
          python scripts/research/confirm_receiver_targetable_dropback_v1_2024_2025.py \
            --player-logs /tmp/targetable_confirm/player_game_logs_history.csv \
            --team-weekly /tmp/targetable_confirm/team_weekly_history.csv \
            --schedule /tmp/targetable_confirm/schedule_history.csv \
            --universe-2024 /tmp/hist_2024/pregame_universe \
            --universe-2025 /tmp/hist_2025/pregame_universe \
            --injuries /tmp/targetable_confirm/injuries_history.csv \
            --weather /tmp/targetable_confirm/weather_history.csv \
            --weeks '1-18' \
            --out-dir /tmp/targetable_confirm/result
          cat /tmp/targetable_confirm/result/RESULT.md

      - name: Upload confirmation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-targetable-dropback-v1-2024-2025-confirmation
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/targetable_confirm/result/**
