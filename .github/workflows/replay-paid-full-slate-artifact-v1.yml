name: Replay Paid Full Slate Artifact V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/replay-paid-full-slate-artifact-v1.yml'
      - 'data/manual_name_overrides.csv'
      - 'data/player_identity_aliases.csv'
      - 'data/models/wr_r15_production_model_v1/wr_r15_production_model_v1.json'
      - 'config/qb_starter_authority_v1.csv'
      - 'model/qb_distribution_state_selector_v1.json'
      - 'scripts/harden_live_odds_artifacts_v1.py'
      - 'scripts/repair_live_prop_identity_v1.py'
      - 'scripts/materialize_live_props_for_model_v1.py'
      - 'scripts/materialize_pricing_offers_v1.py'
      - 'scripts/metrics_v2.py'
      - 'scripts/enrich_player_scoring_v2.py'
      - 'scripts/simulation_v2.py'
      - 'scripts/simulation_c2_qb_candidate.py'
      - 'scripts/simulation_explicit_entitlement_v1.py'
      - 'scripts/run_qb_distribution_state_context.py'
      - 'scripts/run_pricing_v2.py'
      - 'scripts/run_pricing_with_rb_conservation_v1.py'
      - 'scripts/run_pricing_with_full_roster_universe_v1.py'
      - 'scripts/run_pricing_with_full_roster_universe_v2.py'
      - 'scripts/run_pricing_with_full_roster_universe_v3.py'
      - 'scripts/stamp_qb_c2_pricing_lineage_v1.py'
      - 'scripts/validate_rb_rush_rec_conservation_v1.py'
      - 'scripts/validate_team_target_pool_v1.py'
      - 'scripts/validate_team_target_pool_full_universe_v2.py'
      - 'scripts/audit_market_model_lineage_v1.py'
      - 'scripts/audit_market_model_lineage_v2.py'
      - 'scripts/validate_anytime_td_model_status_v1.py'
      - 'scripts/validate_full_slate_mechanical_certification_v1.py'
      - 'scripts/validate_certified_full_slate_stack_v1.py'
      - 'scripts/validate_certified_full_slate_stack_v2.py'
      - 'scripts/modeling/rb_pricing_adapter_v1.py'
      - 'scripts/modeling/qb_c2_production_adapter_v1.py'
      - 'scripts/modeling/qb_distribution_state_v1.py'
      - 'scripts/modeling/target_entitlement_v1.py'
      - 'scripts/modeling/te_r5p_entitlement_adapter_v1.py'
      - 'scripts/modeling/wr_r15_entitlement_adapter_v1.py'
      - 'scripts/player_identity_roster_history_v1.py'
      - 'scripts/validate_manual_name_overrides_v1.py'
      - 'scripts/repair_injuries_nflcom_v1.py'
      - 'scripts/validate_full_slate_pre_model_v1.py'
      - 'scripts/validate_player_identity_semantics_v1.py'
      - 'scripts/validate_full_slate_data_quality_v1.py'
      - 'scripts/validate_full_slate_post_pricing_v1.py'
      - 'scripts/slate_universe_v2.py'
      - 'scripts/run_player_form_v2_loader.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  SEASON: '2026'
  PRIOR_SEASON: '2025'
  SLATE_DATE: ''
  FETCH_LIVE_ODDS: 'true'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml

      - name: Download paid failed Full Slate artifact without refetching OddsAPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/paid
          gh run download 34152868136 \
            --repo "${GITHUB_REPOSITORY}" \
            --name run_34152868136 \
            --dir evidence/paid
          test -s evidence/paid/data/live_odds_status.json
          test -s evidence/paid/outputs/props_raw.csv
          cp -a evidence/paid/data/. data/
          mkdir -p outputs
          cp -a evidence/paid/outputs/. outputs/
          echo 'Replaying already-paid odds artifact; NO OddsAPI fetch occurs in this workflow.'

      - name: Harden and repair paid sportsbook snapshot
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.harden_live_odds_artifacts_v1 import harden_live_odds_artifacts
          from scripts.repair_live_prop_identity_v1 import repair_live_prop_identity
          from scripts.materialize_live_props_for_model_v1 import materialize

          hard = harden_live_odds_artifacts()
          ident = repair_live_prop_identity()
          p = Path('data/live_odds_status.json')
          status = json.loads(p.read_text(encoding='utf-8'))
          status.update({
              'artifact_hardening_disposition': hard.get('disposition','missing'),
              'game_identity_event_count': int(hard.get('game_identity_event_count',0)),
              'provider_source_duplicate_rows': int(hard.get('provider_source_duplicate_rows',0)),
              'raw_artifact_exact_duplicates_removed': int(hard.get('raw_artifact_exact_duplicates_removed',0)),
              'grouped_offer_entries_removed': int(hard.get('grouped_offer_entries_removed',0)),
              'blank_name_sentinels_removed': int(hard.get('blank_name_sentinels_removed',0)),
              'unresolved_real_player_names': int(hard.get('unresolved_real_player_names',0)),
              'core_prop_identity_disposition': ident.get('disposition','missing'),
              'core_prop_identity_unresolved_rows': int(ident.get('core_unresolved_rows',0)),
              'core_prop_identity_rows': int(ident.get('core_actual_rows',0)),
              'replay_source_run': 34152868136,
              'odds_api_refetched': False,
          })
          p.write_text(json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          result = materialize()
          if int(result.get('quarantined_rows', -1)) <= 0:
              raise SystemExit('FATAL: paid snapshot unexpectedly preserved zero quarantine rows')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Build PlayerForm and audit current roster identities
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_player_form_v2_loader.py --season 2026 --prior-season 2025 --date ''
          python scripts/enrich_player_scoring_v2.py --season 2026 --prior-season 2025 --date ''
          python scripts/validate_player_identity_semantics_v1.py
          python - <<'PY'
          import json
          import pandas as pd
          required=[
              'data/full_slate_pre_model_semantic_audit.csv',
              'data/player_game_logs.csv',
              'data/player_form.csv',
              'data/player_form_consensus.csv',
              'data/player_identity_validation.csv',
              'data/player_identity_semantic_audit.csv',
              'data/player_scoring_td_position_priors.csv',
          ]
          for p in required:
              df=pd.read_csv(p)
              if df.empty: raise SystemExit(f'FATAL: replay produced zero rows: {p}')
              print(p, 'rows=', len(df))
          td=json.load(open('data/player_scoring_td_prior_status.json',encoding='utf-8'))
          if td.get('sportsbook_inputs_used') is not False:
              raise SystemExit('FATAL: TD position prior does not certify sportsbook-independent construction')
          if int(td.get('position_prior_fallback_rows',0)) <= 0:
              raise SystemExit('FATAL: expected explicit TD position-prior fallback rows were not recorded')
          q=pd.read_csv('data/live_odds_placeholder_rows.csv')
          status=json.load(open('data/live_odds_status.json',encoding='utf-8'))
          expected=int(status.get('production_quarantined_rows',-1))
          if len(q) != expected or expected <= 0:
              raise SystemExit(f'FATAL: quarantine ledger was overwritten/drifted expected={expected} artifact={len(q)}')
          print('immutable quarantine rows=',len(q),'reasons=',q['quarantine_reason'].value_counts().to_dict())
          PY

      - name: Run canonical model components and classify data quality
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_model_context_bridge.py
          python scripts/validate_full_slate_data_quality_v1.py
          python scripts/run_model_bayesian_bridge.py
          python scripts/run_model_ml_bridge.py
          python scripts/run_model_state_bridge.py
          python scripts/run_model_rules_bridge.py
          python scripts/run_model_ensemble_bridge.py
          python scripts/run_rb_week1_no_odds.py --season 2026 --week 1 --iterations 25000 --out data/rb_rush_synthesis_context.csv
          python scripts/run_qb_distribution_state_context.py --season 2026 --week 1
          test -s data/qb_distribution_state_context.csv
          test -s data/qb_distribution_state_context_audit.csv

      - name: Materialize exact bookmaker offers, assemble metrics, and price from promoted Full Slate stack
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/materialize_pricing_offers_v1.py
          python scripts/run_metrics_context.py --season 2026 --mode full --date ''
          python scripts/validate_build_integrity.py
          python scripts/metrics_ready.py --season 2026 --date ''
          python scripts/run_pricing_with_full_roster_universe_v3.py --season 2026
          test -s outputs/props_priced_clean.csv
          test -s data/football_simulation_universe_audit.json
          test -s data/wr_r15_full_slate_entitlement_audit.json
          test -s data/qb_c2_production_integration_audit.json
          python - <<'PY'
          import json
          q=json.load(open('data/qb_c2_production_integration_audit.json',encoding='utf-8'))
          w=json.load(open('data/wr_r15_full_slate_entitlement_audit.json',encoding='utf-8'))
          if q.get('disposition') != 'QB_C2_PRODUCTION_DISTRIBUTION_INTEGRATION_PASS':
              raise SystemExit(f"FATAL: QB C2 production integration not certified: {q.get('disposition')}")
          if int(q.get('football_qb_rows',0)) != 32 or int(q.get('selected_qb_rows',0)) <= 0:
              raise SystemExit(f"FATAL: QB C2 coverage invalid: {q}")
          if float(q.get('max_raw_qb_mean_gap',1.0)) > 1e-10:
              raise SystemExit(f"FATAL: QB C2 raw mean drift: {q.get('max_raw_qb_mean_gap')}")
          if int(q.get('state_capture_changed_arrays',-1)) != 0 or float(q.get('state_capture_max_element_gap',1.0)) > 1e-12:
              raise SystemExit(f"FATAL: QB C2 state-capture parity drift: {q}")
          if int(q.get('sportsbook_inputs_to_selector',1)) != 0 or int(q.get('sportsbook_inputs_to_starter_selection',1)) != 0 or int(q.get('sportsbook_inputs_to_c2_generation',1)) != 0:
              raise SystemExit('FATAL: QB C2 sportsbook leakage flag')
          if int(q.get('receiver_outputs_replaced',1)) != 0 or int(q.get('rb_outputs_replaced',1)) != 0:
              raise SystemExit('FATAL: QB C2 replaced non-QB outputs')
          if q.get('wr_r15_consumed_before_c2') is not True:
              raise SystemExit('FATAL: C2 did not consume WR-R15 upstream state')
          required={
              'disposition':'WR_R15_FULL_SLATE_ENTITLEMENT_READY',
              'model_version':'WR_R15_PRODUCTION_MODEL_V1',
              'm38_wr1_anchor_preserved':True,
              'wr2plus_pool_preserved':True,
              'wr_room_mass_preserved':True,
              'non_wr_entitlement_preserved':True,
              'team_total_player_entitlement_preserved':True,
              'sportsbook_inputs_used':False,
              'current_or_future_outcomes_used':False,
          }
          for k,v in required.items():
              if w.get(k)!=v: raise SystemExit(f'FATAL WR-R15 contract {k}: expected={v!r} actual={w.get(k)!r}')
          if int(w.get('current_wr1_anchor_rows',0)) != 32:
              raise SystemExit('FATAL: expected exactly 32 M38 WR1 anchors')
          if float(w.get('max_wr1_anchor_entitlement_delta',1.0)) != 0.0 or float(w.get('max_non_wr_entitlement_delta',1.0)) != 0.0:
              raise SystemExit('FATAL: WR-R15 changed WR1 or non-WR entitlement')
          print('M38_R15_TE_R5P_C2_PRODUCTION_INTEGRATION_CERTIFIED')
          PY
          python scripts/stamp_qb_c2_pricing_lineage_v1.py
          test -s data/qb_c2_pricing_lineage_stamp_audit.json

      - name: Final mechanical semantic, governed lineage, ATD provenance and consumption certification
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/validate_rb_rush_rec_conservation_v1.py
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_anytime_td_model_status_v1.py
          python scripts/validate_full_slate_mechanical_certification_v1.py

      - name: Model-quality certification - full-roster receiving entitlement and promoted stack
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/validate_team_target_pool_full_universe_v2.py
          python scripts/validate_certified_full_slate_stack_v2.py

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-full-slate-replay-v1
          path: |
            data/full_slate_pre_model_semantic_audit.csv
            data/full_slate_pre_model_semantic_audit.json
            data/full_slate_data_quality_audit.csv
            data/full_slate_data_quality_audit.json
            data/full_slate_post_pricing_audit.csv
            data/live_odds_status.json
            data/live_odds_artifact_hardening.json
            data/live_prop_identity_status.json
            data/live_prop_identity_audit.csv
            data/live_odds_placeholder_rows.csv
            data/live_pricing_offer_audit.json
            data/injuries_source_status.json
            data/injuries_identity_audit.csv
            data/injury_team_scope.csv
            data/player_identity_validation.csv
            data/player_identity_semantic_audit.csv
            data/player_identity_semantic_audit.json
            data/player_identity_roster_history_audit.json
            data/player_scoring_td_position_priors.csv
            data/player_scoring_td_prior_status.json
            data/provider_readiness_v3.csv
            data/model_context_bridge.csv
            data/model_bayesian_diagnostics.csv
            data/model_ml_diagnostics.csv
            data/model_state_diagnostics.csv
            data/model_rule_diagnostics.csv
            data/model_ensemble_diagnostics.csv
            data/model_rule_simulation_inputs.csv
            data/football_simulation_universe.csv
            data/football_simulation_universe_audit.csv
            data/football_simulation_universe_audit.json
            data/target_entitlement_v1_trace.csv
            data/target_entitlement_v1_audit.json
            data/target_entitlement_v1_projection_invariance.csv
            data/te_r5p_full_slate_entitlement_trace.csv
            data/te_r5p_full_slate_entitlement_audit.json
            data/te_r5p_full_slate_simulation_delta.csv
            data/wr_r15_full_slate_entitlement_trace.csv
            data/wr_r15_full_slate_entitlement_audit.json
            data/wr_r15_full_slate_simulation_delta.csv
            data/qb_distribution_state_context.csv
            data/qb_distribution_state_context_audit.csv
            data/qb_c2_production_starter_audit.csv
            data/qb_c2_state_capture_parity.csv
            data/qb_c2_production_integration_audit.csv
            data/qb_c2_production_integration_audit.json
            data/qb_c2_pricing_lineage_stamp_audit.json
            data/market_model_lineage_current.csv
            data/market_model_lineage_current.json
            data/anytime_td_model_status_v1.csv
            data/anytime_td_model_status_v1.json
            data/team_target_pool_audit.csv
            data/team_target_pool_audit.json
            data/certified_full_slate_stack_audit.json
            data/rb_rush_synthesis_context.csv
            data/rb_rush_rec_conservation_input_audit.csv
            data/rb_rush_rec_conservation_input_audit.json
            data/rb_rush_rec_conservation_final_audit.csv
            data/_debug/metrics_unmatched_player_form.csv
            data/_debug/metrics_missing_identity.csv
            data/_debug/pricing_unsimulated_props.csv
            outputs/props_raw_compact.csv
            outputs/props_pricing_offers.csv
            outputs/props_priced_clean.csv
            outputs/paid_full_slate_replay_result.json
          if-no-files-found: warn
          retention-days: 30
