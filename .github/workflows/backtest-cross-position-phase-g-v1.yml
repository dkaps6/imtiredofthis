name: Cross-Position Phase G V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/backtest-cross-position-phase-g-v1.yml'
      - 'scripts/backtest/cross_position_phase_g_v1.py'
      - 'docs/migrations/CROSS_POSITION_PHASE_G_POSITIVE_SHARED_STATE_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  phase-g:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-G evaluator
        run: python -m py_compile scripts/backtest/cross_position_phase_g_v1.py
      - name: Download authoritative Phase-C evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_c
          gh run download 34147777341 --repo "${GITHUB_REPOSITORY}" --name cross-position-catastrophic-casebook-v1-phase-c --dir evidence/phase_c
      - name: Download authoritative Phase-E evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_e
          gh run download 34150046671 --repo "${GITHUB_REPOSITORY}" --name cross-position-phase-e-v1 --dir evidence/phase_e
      - name: Verify frozen inputs
        run: |
          test -s evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv
          test -s evidence/phase_e/data/backtests/cross_position_phase_e_v1/phase_e_shared_state_casebook.csv
      - name: Run Phase-G positive-only shared state
        run: |
          python scripts/backtest/cross_position_phase_g_v1.py \
            --phase-c-all-rows evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv \
            --phase-e-casebook evidence/phase_e/data/backtests/cross_position_phase_e_v1/phase_e_shared_state_casebook.csv \
            --out-dir data/backtests/cross_position_phase_g_v1
      - name: Show Phase-G result
        if: always()
        run: |
          cat data/backtests/cross_position_phase_g_v1/phase_g_result.json 2>/dev/null || true
          cat data/backtests/cross_position_phase_g_v1/phase_g_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_g_v1/phase_g_catastrophic_opportunity_counts.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_g_v1/phase_g_delta_direction_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_g_v1/phase_g_actual_state_scorecard.csv 2>/dev/null || true
      - name: Upload Phase-G evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-phase-g-v1
          path: |
            data/backtests/cross_position_phase_g_v1/*
            docs/migrations/CROSS_POSITION_PHASE_G_POSITIVE_SHARED_STATE_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
