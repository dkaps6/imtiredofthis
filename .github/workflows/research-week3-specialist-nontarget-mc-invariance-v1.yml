name: Week3 Specialist NonTarget MC Invariance V1

on:
  push:
    branches:
      - research-week3-specialist-rng-nontarget-invariance-v1
    paths:
      - 'docs/research/WEEK3_SPECIALIST_NONTARGET_MC_INVARIANCE_V1_PLAN.md'
      - 'scripts/research/audit_specialist_nontarget_mc_invariance_v1.py'
      - 'tests/test_specialist_nontarget_mc_invariance_v1.py'
      - '.github/workflows/research-week3-specialist-nontarget-mc-invariance-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/research/WEEK3_SPECIALIST_NONTARGET_MC_INVARIANCE_V1_PLAN.md'
      - 'scripts/research/audit_specialist_nontarget_mc_invariance_v1.py'
      - 'tests/test_specialist_nontarget_mc_invariance_v1.py'
      - '.github/workflows/research-week3-specialist-nontarget-mc-invariance-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_RUN_ID: "36293274478"
  SOURCE_ARTIFACT_ID: "10923570170"
  SOURCE_ARTIFACT_NAME: "run_36293274478"
  SOURCE_ARTIFACT_DIGEST: "sha256:5a3d4f64592c70553e66dd51bb3bff45263d2900f4d270e370353fa60ea1c480"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Run focused audit tests
        run: |
          export PYTHONPATH="${PWD}"
          pytest -q tests/test_specialist_nontarget_mc_invariance_v1.py

      - name: Verify preserved Week-3 artifact authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/source_artifacts.json
          python - <<'PY'
          import json, os
          obj=json.load(open('/tmp/source_artifacts.json',encoding='utf-8'))
          want_id=int(os.environ['SOURCE_ARTIFACT_ID'])
          matches=[a for a in obj.get('artifacts',[]) if int(a.get('id',-1))==want_id]
          if len(matches)!=1:
              raise SystemExit(f'FATAL: source artifact id {want_id} found {len(matches)} times')
          a=matches[0]
          if a.get('name') != os.environ['SOURCE_ARTIFACT_NAME']:
              raise SystemExit(f"FATAL: artifact name drift {a.get('name')!r}")
          if a.get('digest') != os.environ['SOURCE_ARTIFACT_DIGEST']:
              raise SystemExit(f"FATAL: artifact digest drift {a.get('digest')!r}")
          if bool(a.get('expired')):
              raise SystemExit('FATAL: preserved Week-3 artifact expired')
          print({
              'source_run_id':os.environ['SOURCE_RUN_ID'],
              'artifact_id':want_id,
              'name':a.get('name'),
              'digest':a.get('digest'),
              'expired':a.get('expired'),
          })
          PY

      - name: Download preserved Week-3 paid artifact
        uses: actions/download-artifact@v4
        with:
          name: run_36293274478
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36293274478

      - name: Verify exact required source files
        run: |
          set -euo pipefail
          for f in \
            replay_source/data/target_entitlement_v1_trace.csv \
            replay_source/data/target_entitlement_v1_audit.json \
            replay_source/data/te_r5p_full_slate_entitlement_trace.csv \
            replay_source/data/te_r5p_full_slate_entitlement_audit.json \
            replay_source/data/te_r5p_full_slate_simulation_delta.csv \
            replay_source/data/wr_r15_full_slate_entitlement_trace.csv \
            replay_source/data/wr_r15_full_slate_entitlement_audit.json \
            replay_source/data/wr_r15_full_slate_simulation_delta.csv; do
              test -s "$f"
          done
          echo "PRESERVED_WEEK3_ARTIFACT_READY_NO_ODDS_REFETCH"

      - name: Run frozen non-target MC invariance audit
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          rm -rf data/research/week3_specialist_nontarget_mc_invariance_v1
          python scripts/research/audit_specialist_nontarget_mc_invariance_v1.py \
            --root replay_source \
            --out-dir data/research/week3_specialist_nontarget_mc_invariance_v1 \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-artifact-id "${SOURCE_ARTIFACT_ID}" \
            --source-artifact-digest "${SOURCE_ARTIFACT_DIGEST}"
          test -s data/research/week3_specialist_nontarget_mc_invariance_v1/result.json
          test -s data/research/week3_specialist_nontarget_mc_invariance_v1/summary.csv
          test -s data/research/week3_specialist_nontarget_mc_invariance_v1/detail.csv
          test -s data/research/week3_specialist_nontarget_mc_invariance_v1/top_protected_drifts.csv

      - name: Display frozen audit result
        if: always()
        run: |
          test -f data/research/week3_specialist_nontarget_mc_invariance_v1/result.json && cat data/research/week3_specialist_nontarget_mc_invariance_v1/result.json || true
          test -f data/research/week3_specialist_nontarget_mc_invariance_v1/summary.csv && cat data/research/week3_specialist_nontarget_mc_invariance_v1/summary.csv || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week3-specialist-nontarget-mc-invariance-v1-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/research/week3_specialist_nontarget_mc_invariance_v1/**
