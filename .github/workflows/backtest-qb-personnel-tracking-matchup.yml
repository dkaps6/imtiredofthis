name: Migration 75 QB Personnel Tracking Matchup

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/audit_qb_personnel_tracking_matchup.py'
      - 'scripts/backtest/run_qb_personnel_tracking_matchup.py'
      - 'scripts/backtest/run_qb_personnel_tracking_matchup_v3.py'
      - 'scripts/backtest/freeze_qb_frontier_canonical_v3_football_only.py'
      - 'scripts/backtest/build_historical_inputs.py'
      - 'scripts/backtest/historical_inputs.py'
      - 'scripts/backtest/enrich_historical_defense.py'
      - 'scripts/backtest/validate_historical_inputs.py'
      - 'scripts/backtest/historical_player_logs.py'
      - 'scripts/backtest/build_historical_injuries.py'
      - 'scripts/backtest/build_historical_weather.py'
      - 'scripts/backtest/decompose_qb_passing_error.py'
      - 'scripts/backtest/component_predictions.py'
      - 'scripts/backtest/historical_context.py'
      - '.github/workflows/backtest-qb-personnel-tracking-matchup.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'backtest-migration-75-qb-personnel-tracking-matchup'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scikit-learn pyarrow pytest pyyaml joblib

      - name: Frozen M75 scientific scope
        run: |
          echo 'M75 tests genuinely new NGS receiver tracking and PFR DB coverage information; it is not another transform of M56-M74 inputs.'
          echo 'Foundation correction: canonical v1 used market-trained residual corrections, and v2 still inherited a cohort selected after a non-null market-total filter.'
          echo 'Canonical v3 rebuilds the stable-QB cohort BEFORE any market join/filter using the pre-market historical component pipeline.'
          echo 'Cohort rule: projected pass-yards QB must be realized team primary and handle >=80% of team official QB attempts.'
          echo 'No sportsbook field is used for cohort selection, projection, model features, or output.'
          echo '2024 trains the frozen M75 models; 2025 is untouched evaluation. 2022/2023 are strictly-prior history for new personnel sources.'
          echo 'PFR secondary aggregation is DB-only after verified player-position bridge and reconstructed from underlying coverage counts.'
          echo 'All four frozen receiver x secondary interactions are required together; no post-hoc subset is eligible.'
          echo 'Fixed models: Ridge alpha=50 and HistGB absolute-error 150 iter lr=.04 depth=2 leaf=15 L2=5 seed=75.'
          echo 'Full gate remains: coverage>=.70; YPA residual corr>=.18; YPA MAE gain>=.10; pass MAE gain>=.75; pass corr gain>=.015; 100+ misses non-increase.'
          echo 'Cross-model support remains: residual corr>=.08; pass MAE gain>=.20; 100+ misses non-increase.'
          echo 'No threshold/model/hyperparameter changes are allowed because the cohort correction is an upstream integrity fix.'

      - name: Compile M75 and v3 freezer
        run: |
          python -m py_compile scripts/backtest/audit_qb_personnel_tracking_matchup.py
          python -m py_compile scripts/backtest/run_qb_personnel_tracking_matchup.py
          python -m py_compile scripts/backtest/run_qb_personnel_tracking_matchup_v3.py
          python -m py_compile scripts/backtest/freeze_qb_frontier_canonical_v3_football_only.py

      - name: Rebuild pre-market 2024 QB trace
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          D=data/backtests/m75_premarket_2024
          mkdir -p "$D"
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir "$D"
          if ! python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons 2023,2024 --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"; then
            echo '::warning::Optional 2024 historical defensive enrichment failed; continuing with base team_weekly_history.csv.'
          fi
          python scripts/backtest/validate_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024 --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024 --out "$D/injuries_history.csv" || true
          python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv" || true
          touch "$D/injuries_history.csv" "$D/weather_history.csv"
          python scripts/backtest/decompose_qb_passing_error.py \
            --season 2024 --prior-season 2023 --weeks '1-18' --iterations 2000 \
            --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" \
            --out-dir "$D/qb_passing_error"

      - name: Rebuild pre-market 2025 QB trace
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          D=data/backtests/m75_premarket_2025
          mkdir -p "$D"
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir "$D"
          if ! python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons 2024,2025 --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"; then
            echo '::warning::Optional 2025 historical defensive enrichment failed; continuing with base team_weekly_history.csv.'
          fi
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py --seasons 2024,2025 --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out "$D/injuries_history.csv" || true
          python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv" || true
          touch "$D/injuries_history.csv" "$D/weather_history.csv"
          python scripts/backtest/decompose_qb_passing_error.py \
            --season 2025 --prior-season 2024 --weeks '1-18' --iterations 2000 \
            --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" \
            --out-dir "$D/qb_passing_error"

      - name: Freeze genuinely market-independent canonical v3
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/freeze_qb_frontier_canonical_v3_football_only.py \
            --trace-2024 data/backtests/m75_premarket_2024/qb_passing_error/qb_passing_player_trace.csv \
            --logs-2024 data/backtests/m75_premarket_2024/player_game_logs_history.csv \
            --trace-2025 data/backtests/m75_premarket_2025/qb_passing_error/qb_passing_player_trace.csv \
            --logs-2025 data/backtests/m75_premarket_2025/player_game_logs_history.csv \
            --out-dir data/backtests/qb_frontier_canonical_v3_football_only
          echo '--- football-only v3 oracle summary ---'
          cat data/backtests/qb_frontier_canonical_v3_football_only/football_only_oracle_summary.csv
          echo '--- football-only v3 manifest ---'
          cat data/backtests/qb_frontier_canonical_v3_football_only/manifest.json

      - name: Run M75 on canonical v3
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/run_qb_personnel_tracking_matchup_v3.py \
            --canonical data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv \
            --seasons 2022,2023,2024,2025 \
            --out-dir data/backtests/qb_m75

      - name: Print M75 results
        if: always()
        run: |
          echo '--- M75 interpretation ---'
          cat data/backtests/qb_m75/m75_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- M75 sources ---'
          cat data/backtests/qb_m75/m75_source_manifest.csv 2>/dev/null || true
          echo '--- M75 family status ---'
          cat data/backtests/qb_m75/m75_family_status.csv 2>/dev/null || true
          echo '--- M75 models ---'
          cat data/backtests/qb_m75/m75_model_results.csv 2>/dev/null || true

      - name: Upload M75 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-75-qb-personnel-tracking-matchup
          path: |
            data/backtests/qb_m75/*.csv
            data/backtests/qb_frontier_canonical_v3_football_only/*
            data/backtests/m75_premarket_2024/historical_input_validation.csv
            data/backtests/m75_premarket_2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
