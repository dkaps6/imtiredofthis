name: RB STACK6Q Designed Run Call Model

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6q-designed-run-call-model
    paths:
      - 'scripts/backtest/evaluate_rb_stack6q_designed_run_call_model.py'
      - 'docs/migrations/RB_STACK6Q_DESIGNED_RUN_CALL_MODEL_PLAN.md'
      - 'docs/migrations/RB_STACK6Q_IMPLEMENTATION_SCOPE.md'
      - '.github/workflows/backtest-rb-stack6q-designed-run-call-model.yml'

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      M94C_RUN_ID: '33353485070'
      STACK6H_RUN_ID: '33632678179'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2 pyarrow==17.0.0 nflreadpy
      - name: Compile
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6q_designed_run_call_model.py
      - name: Download frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6q/m94c data/backtests/rb_stack6q/stack6h
          gh run download "$M94C_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-94c-rb-game-environment --dir data/backtests/rb_stack6q/m94c
          gh run download "$STACK6H_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6h-current-pool-oracle --dir data/backtests/rb_stack6q/stack6h
          test -s data/backtests/rb_stack6q/m94c/m94c_2024_holdout_trace.csv
          test -s data/backtests/rb_stack6q/m94c/m94c_2025_team_trace.csv
          test -s data/backtests/rb_stack6q/stack6h/stack6h_team_trace.csv
      - name: Run frozen STACK6Q qualification
        run: |
          rm -rf data/backtests/rb_stack6q/results
          python scripts/backtest/evaluate_rb_stack6q_designed_run_call_model.py \
            --m94c-root data/backtests/rb_stack6q/m94c \
            --stack6h-root data/backtests/rb_stack6q/stack6h \
            --out-dir data/backtests/rb_stack6q/results
      - name: Show outputs
        if: always()
        run: |
          echo '=== training ==='
          cat data/backtests/rb_stack6q/results/stack6q_training_meta.csv 2>/dev/null || true
          echo '=== integrity ==='
          cat data/backtests/rb_stack6q/results/stack6q_integrity.csv 2>/dev/null || true
          echo '=== scores ==='
          cat data/backtests/rb_stack6q/results/stack6q_scores.csv 2>/dev/null || true
          echo '=== gates ==='
          cat data/backtests/rb_stack6q/results/stack6q_gates.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6q/results/stack6q_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6q-designed-run-call-model
          path: data/backtests/rb_stack6q/results/**
          if-no-files-found: warn
          retention-days: 30
