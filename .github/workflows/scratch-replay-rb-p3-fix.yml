# scratch: verify the RB P3 team-scope fallback fix against tonight's
# already-fetched real live-odds artifact (run 34769507865), no re-fetch.
name: Scratch Replay RB P3 Team-Scope Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-replay-rb-p3-fix.yml'

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: ""
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download real props/context data from run 34769507865 (no re-fetch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 34769507865 --repo "$GITHUB_REPOSITORY" --name run_34769507865 --dir artifact
          cp -rv artifact/data/. data/
          cp -rv artifact/outputs/. outputs/
      - name: Apply certified availability-aware current-output coverage seams
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python -m py_compile scripts/run_pricing_with_full_roster_universe_v1.py scripts/modeling/rb_r26_receptions_production_adapter_v1.py scripts/modeling/qb_c2_production_adapter_v1.py
      - name: Price from certified football-first Full Slate stack (replay, no live fetch)
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/run_pricing_with_full_roster_universe_v3.py --season "${SEASON}"
          test -s outputs/props_priced_clean.csv
          echo "=== RB conservation payload ==="
          cat data/rb_rush_rec_conservation_input_audit.json
          echo
          echo "=== priced row count and team coverage ==="
          python3 -c "
          import pandas as pd
          df = pd.read_csv('outputs/props_priced_clean.csv')
          print('rows:', len(df))
          print('teams:', sorted(df['team'].dropna().astype(str).unique()) if 'team' in df.columns else 'n/a')
          rb = df[(df['source_market'].astype(str)=='player_rush_yds')] if 'source_market' in df.columns else df.iloc[0:0]
          print('rush_yds rows:', len(rb))
          print('rush_yds teams:', sorted(rb['team'].dropna().astype(str).unique()))
          nyj = rb[rb['team'].astype(str)=='NYJ']
          print('NYJ rush_yds rows:')
          print(nyj[['player','team','model_proj','rb_synthesis_applied']].to_string() if len(nyj) else '(none)')
          "
      - name: Apply final-board-only verified prop quarantines
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/operations/quarantine_final_priced_props_v1.py
          test -s data/final_priced_props_quarantine_status.json
          cat data/final_priced_props_quarantine_status.json
      - name: Strict repository audits
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict
