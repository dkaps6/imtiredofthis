name: Cross-Position Phase E V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/backtest-cross-position-phase-e-v1.yml'
      - 'scripts/backtest/cross_position_phase_e_v1.py'
      - 'docs/migrations/CROSS_POSITION_PHASE_E_PREGAME_PREDICTABILITY_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  phase-e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-E evaluator
        run: python -m py_compile scripts/backtest/cross_position_phase_e_v1.py
      - name: Download exact authoritative Phase-C evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_c
          gh run download 34147777341 --repo "${GITHUB_REPOSITORY}" --name cross-position-catastrophic-casebook-v1-phase-c --dir evidence/phase_c
      - name: Verify frozen Phase-C input
        run: |
          test -s evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv
          test -s evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_phase_c_result.json
      - name: Run Phase-E pregame predictability validation
        run: |
          python scripts/backtest/cross_position_phase_e_v1.py \
            --phase-c-all-rows evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv \
            --out-dir data/backtests/cross_position_phase_e_v1
      - name: Show Phase-E result
        if: always()
        run: |
          cat data/backtests/cross_position_phase_e_v1/phase_e_result.json 2>/dev/null || true
          cat data/backtests/cross_position_phase_e_v1/phase_e_shared_state_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_e_v1/phase_e_shared_state_signature_recall.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_e_v1/phase_e_player_holdout_scorecard.csv 2>/dev/null || true
      - name: Upload Phase-E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-phase-e-v1
          path: |
            data/backtests/cross_position_phase_e_v1/*
            docs/migrations/CROSS_POSITION_PHASE_E_PREGAME_PREDICTABILITY_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
