name: Import Exact R19 Production Assets Once

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/import-rb-r19-production-assets-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-cross-position-catastrophic-casebook-v1

      - name: Download immutable R19 artifact
        uses: actions/download-artifact@v4
        with:
          name: rb-r19-deployable-tail-scorer-refit-v1
          path: evidence/r19
          github-token: ${{ github.token }}
          repository: dkaps6/imtiredofthis
          run-id: 34288244770

      - name: Verify and materialize exact production assets
        run: |
          set -euo pipefail
          MODEL="$(find evidence/r19 -type f -name 'rb_r19_tail_scorer_model_v1.json' -print -quit)"
          POOLS="$(find evidence/r19 -type f -name 'rb_r19_residual_pools_v1.npz' -print -quit)"
          test -s "$MODEL"
          test -s "$POOLS"
          test "$(sha256sum "$MODEL" | awk '{print $1}')" = "9ed6a98b0022e86992fb468df40a9fd79a54bc87885777ac5955a898b5c292ba"
          test "$(sha256sum "$POOLS" | awk '{print $1}')" = "c69a268a5a1683e846bcb5f59fe55bcae20d70c679792449ea77e6548b37a362"
          mkdir -p data/models/rb_r19_production_v1
          cp "$MODEL" data/models/rb_r19_production_v1/rb_r19_tail_scorer_model_v1.json
          cp "$POOLS" data/models/rb_r19_production_v1/rb_r19_residual_pools_v1.npz
          cat > data/models/rb_r19_production_v1/PROVENANCE.json <<'JSON'
          {
            "artifact_digest": "sha256:11432b9d7b7f2367935a862b63c30df9f40955e479806ab67d90921b63a907c7",
            "artifact_id": 10080377483,
            "artifact_name": "rb-r19-deployable-tail-scorer-refit-v1",
            "head_sha": "6ac1342f737f142acac6a3e4b459f442faf1442a",
            "model_sha256": "9ed6a98b0022e86992fb468df40a9fd79a54bc87885777ac5955a898b5c292ba",
            "pools_sha256": "c69a268a5a1683e846bcb5f59fe55bcae20d70c679792449ea77e6548b37a362",
            "run_id": 34288244770,
            "source_status": "R19_SHADOW_ONLY_AT_FIT_TIME",
            "week1_production_authorization_plan": "docs/migrations/RB_R22_WEEK1_RECEIVING_TAIL_PRODUCTION_INTEGRATION_V1_PLAN.md"
          }
          JSON

      - name: Commit immutable assets to active branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/rb_r19_production_v1
          if git diff --cached --quiet; then
            echo 'Exact R19 assets already committed; no action required.'
            exit 0
          fi
          git commit -m "Import exact R19 Week 1 production assets"
          git push origin HEAD:research-cross-position-catastrophic-casebook-v1
