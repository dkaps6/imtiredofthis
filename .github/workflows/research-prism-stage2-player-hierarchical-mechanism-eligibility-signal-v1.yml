name: Research PRISM Stage2 Player Hierarchical Mechanism Eligibility Signal V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/evaluate_prism_stage2_player_hierarchical_mechanism_eligibility_signal_v1.py'
      - 'tests/test_prism_stage2_player_hierarchical_mechanism_eligibility_signal_v1.py'
      - '.github/workflows/research-prism-stage2-player-hierarchical-mechanism-eligibility-signal-v1.yml'
      - 'docs/research/PRISM_STAGE2_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_V1_FREEZE.md'
      - 'docs/research/PRISM_STAGE2_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_RESULT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pytest pyyaml

      - name: Verify immutable pre-score freeze and parent authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor 8a94c8cae1448520acf283e52c641d3bd631de3a HEAD
          git cat-file -e 8a94c8cae1448520acf283e52c641d3bd631de3a:docs/research/PRISM_STAGE2_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_V1_FREEZE.md
          if git cat-file -e 8a94c8cae1448520acf283e52c641d3bd631de3a:scripts/research/evaluate_prism_stage2_player_hierarchical_mechanism_eligibility_signal_v1.py 2>/dev/null; then
            echo "ERROR: evaluator existed at final pre-score freeze"
            exit 1
          fi
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12070774378 --jq '.workflow_run.id')" = "38957575645"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12070774378 --jq '.digest')" = "sha256:e07edbad1bf97a4917ba95c58156c8941448e7b2668bd0eae2e9bcad5d4945b0"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12126215015 --jq '.workflow_run.id')" = "39098772787"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12126215015 --jq '.digest')" = "sha256:5249f41f72a248443c8a596de2a3cf4211928369b8867b3f3a4d16e70601c78d"

      - uses: actions/download-artifact@v4
        with:
          name: player-active-role-conditional-allocation-bridge-v1-38957575645
          path: /tmp/stage2-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38957575645

      - name: Resolve immutable parent rows
        run: |
          PARENT_ROWS="$(find /tmp/stage2-parent -type f -name 'active_role_conditional_allocation_bridge_player_rows.csv' -print -quit)"
          test -n "$PARENT_ROWS" && test -s "$PARENT_ROWS"
          echo "PARENT_ROWS=$PARENT_ROWS" >> "$GITHUB_ENV"

      - name: Run focused mechanics tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_prism_stage2_player_hierarchical_mechanism_eligibility_signal_v1.py
          pytest -q tests/test_prism_stage2_player_hierarchical_mechanism_eligibility_signal_v1.py

      - name: Score frozen hierarchical mechanism-eligibility signal
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/stage2-player-eligibility-signal
          mkdir -p /tmp/stage2-player-eligibility-signal
          python scripts/research/evaluate_prism_stage2_player_hierarchical_mechanism_eligibility_signal_v1.py             --parent-rows "$PARENT_ROWS"             --out-dir /tmp/stage2-player-eligibility-signal

      - name: Certify frozen contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage2-player-eligibility-signal/stage2_player_hierarchical_eligibility_signal_result.json'))
          assert p['version']=='PRISM_STAGE2_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_V1',p
          assert p['freeze_commit']=='8a94c8cae1448520acf283e52c641d3bd631de3a',p
          assert p['parent_run']==38957575645,p
          assert p['parent_artifact']==12070774378,p
          assert p['source_run']==39098772787,p
          assert p['source_artifact']==12126215015,p
          assert p['cells']==['RB_RUSHING','RB_RECEIVING','TE_RECEIVING'],p
          assert p['pseudo_count']==3.0,p
          assert p['minimum_player_prior']==3,p
          assert p['primary_population']=='CANONICAL_POSITIVE_AUTHORITY_Q_GT_1E_12',p
          assert p['same_week_history_allowed'] is False,p
          assert p['role_prior_excludes_target_player'] is True,p
          assert p['structural_zero_rows_in_history'] is False,p
          assert p['chronology_violations']==0,p
          assert p['duplicate_identities']==0,p
          assert p['projection_values_changed']==0,p
          assert p['stage2_formula_changed'] is False,p
          assert p['coefficients_fit']==0,p
          assert p['threshold_searches']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['week6_outcomes_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PRISM_STAGE2_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_QUALIFIED_ALL',
              'PRISM_STAGE2_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_QUALIFIED_PARTIAL',
              'PRISM_STAGE2_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_CLOSED_ALL',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/stage2-player-eligibility-signal/stage2_player_hierarchical_eligibility_signal_result.json'))
          lines=[
              '### PRISM Stage-2 player hierarchical mechanism-eligibility signal V1',
              '',
              f"- Run: `{os.environ['RUN_ID']}`",
              f"- Exact head: `{os.environ['HEAD_SHA']}`",
              f"- Frozen-before-scoring commit: `{p['freeze_commit']}`",
              f"- Disposition: `{p['disposition']}`",
              '',
          ]
          for cell in p['cells']:
              m24=p['metrics'][cell]['2024']
              m25=p['metrics'][cell]['2025']
              g=p['qualification_gates'][cell]
              failed=[k for k,v in g.items() if k!='tail_floor' and not v]
              lines += [
                  f"- {cell}: `{p['cell_dispositions'][cell]}`",
                  f"  - 2024 rows/players: {m24['rows']} / {m24['players']}; meta-AE gain {m24['mean_delta_meta_ae']:+.6f}; Spearman {m24['baseline_spearman']:+.4f}->{m24['candidate_spearman']:+.4f}",
                  f"  - 2025 rows/players: {m25['rows']} / {m25['players']}; meta-AE gain {m25['mean_delta_meta_ae']:+.6f}",
                  f"  - 2025 player-CI low {m25['player_cluster_bootstrap']['ci95_low']:+.6f}; game-CI low {m25['game_cluster_bootstrap']['ci95_low']:+.6f}; equal-player CI low {m25['equal_player_bootstrap']['ci95_low']:+.6f}",
                  f"  - named-player improved share {m25['equal_player_improved_share']:.2%}; median {m25['equal_player_median_improvement']:+.6f}; p10 {m25['equal_player_p10_improvement']:+.6f}",
                  f"  - failed gates: {failed if failed else 'none'}",
              ]
          lines += [
              '',
              'This scored only future utility of an already-qualified Stage-2 mechanism. No player projection changed; Stage-2 formula unchanged; no 2026/Week-6 outcomes, sportsbook/OddsAPI, coefficient fit or threshold search.',
          ]
          open('/tmp/issue535_stage2_player_eligibility_signal.md','w').write('\n'.join(lines)+'\n')
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/issue535_stage2_player_eligibility_signal.md

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload immutable signal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-stage2-player-hierarchical-mechanism-eligibility-signal-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/stage2-player-eligibility-signal/**
