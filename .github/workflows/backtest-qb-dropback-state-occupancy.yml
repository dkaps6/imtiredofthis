name: Migration 65 QB Dropback State Occupancy

on:
  workflow_dispatch:
    inputs:
      iterations: {description: "MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-65-qb-dropback-state-occupancy'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib pyarrow

      - name: Declare Migration 65 frozen scope and gates
        run: |
          echo "M65 targets the M64 oracle bottleneck: pregame offensive dropback rate."
          echo "State definitions are frozen: neutral score differential -7..+7; trailing <=-8; leading >=+8."
          echo "Primary candidate predicts neutral/trailing/leading play occupancy with expanding leakage-safe ridge regressions, then applies leakage-safe state-specific dropback rates."
          echo "Ridge alpha=20; history window=8 games; league prior=4 games. No hyperparameter sweep."
          echo "2022 is history only. 2023 may supply training labels/history only. 2024/2025 are target evaluation seasons. Consumed 2023 holdout is NOT rescored as an evaluation target."
          echo "No player-prop Vegas line is a feature."
          echo "Mechanism PASS requires ALL: DBR MAE gain >=.010 vs M64 neutral; DBR RMSE gain >=.010; DBR corr gain >=.10; DBR MAE non-worse both 2024 and 2025."
          echo "QB integration requires mechanism PASS plus ALL: attempts MAE gain >=.25 vs Raw; attempts corr +.05; 10+ misses down >=5%; 40+ attempt MAE gain >=.50; passing MAE gain >=.50; passing RMSE gain >=1.00; passing corr +.05; 100+ misses down >=5%; passing MAE non-worse both years."
          echo "State oracles are diagnostic only: actual occupancy vs actual state-specific dropback rates. They cannot rescue a failed gate."
          echo "No post-hoc threshold or gate changes."

      - name: Compile M65 module
        run: python -m py_compile scripts/backtest/validate_qb_dropback_state_occupancy.py

      - name: Build canonical M64 reference layer
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_dropback_state_occupancy/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries_optional.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/diagnose_qb_raw_tail_attribution_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m59"

            python scripts/backtest/audit_qb_extreme_error_regimes.py \
              --season "$SEASON" \
              --game-attribution "$D/m59/m59_game_attribution_${SEASON}.csv" \
              --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" \
              --out-dir "$D/m62"
          }

          run_season 2024 2023
          run_season 2025 2024

          python scripts/backtest/validate_qb_possession_dropback_generative_fixed.py \
            --season-file data/backtests/qb_dropback_state_occupancy/2024/m62/m62_enriched_games_2024.csv \
            --season-file data/backtests/qb_dropback_state_occupancy/2025/m62/m62_enriched_games_2025.csv \
            --player-logs data/backtests/qb_dropback_state_occupancy/2024/player_game_logs_history.csv \
            --player-logs data/backtests/qb_dropback_state_occupancy/2025/player_game_logs_history.csv \
            --out-dir data/backtests/qb_dropback_state_occupancy/m64_summary

      - name: Validate dropback state occupancy
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/validate_qb_dropback_state_occupancy.py \
            --m64-game-level data/backtests/qb_dropback_state_occupancy/m64_summary/m64_game_level.csv \
            --out-dir data/backtests/qb_dropback_state_occupancy/m65_summary

      - name: Show Migration 65 results
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_dropback_state_occupancy/m65_summary/m65_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- dropback rate metrics ---'
          cat data/backtests/qb_dropback_state_occupancy/m65_summary/m65_dropback_rate_metrics.csv 2>/dev/null || true
          echo '--- attempt metrics ---'
          cat data/backtests/qb_dropback_state_occupancy/m65_summary/m65_attempt_metrics.csv 2>/dev/null || true
          echo '--- passing metrics ---'
          cat data/backtests/qb_dropback_state_occupancy/m65_summary/m65_passing_metrics.csv 2>/dev/null || true
          echo '--- state oracles ---'
          cat data/backtests/qb_dropback_state_occupancy/m65_summary/m65_state_oracles.csv 2>/dev/null || true

      - name: Upload Migration 65 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-65-qb-dropback-state-occupancy
          path: |
            data/backtests/qb_dropback_state_occupancy/m65_summary/*.csv
            data/backtests/qb_dropback_state_occupancy/m64_summary/*.csv
            data/backtests/qb_dropback_state_occupancy/2024/historical_input_validation.csv
            data/backtests/qb_dropback_state_occupancy/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
