name: Week1 QB Distribution Shadow V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/shadow-qb-distribution-week1-v1.yml'
      - 'scripts/run_qb_distribution_shadow_v1.py'
      - 'scripts/run_qb_distribution_state_context.py'
      - 'scripts/simulation_c2_qb_candidate.py'
      - 'scripts/modeling/qb_distribution_state_v1.py'
      - 'model/qb_distribution_state_selector_v1.json'
      - 'docs/migrations/QB_DISTRIBUTION_SHADOW_WEEK1_V1_PLAN.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dispatch exact-branch Full Slate with live current-season odds
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "launcher_sha=${GITHUB_SHA}"
          gh workflow run full-slate.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f season=2026 \
            -f prior_season=2025 \
            -f date='' \
            -f fetch_live_odds=true

          RUN_ID=''
          for i in $(seq 1 24); do
            RUN_ID=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow full-slate.yml \
              --branch "${GITHUB_REF_NAME}" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${GITHUB_SHA}\") | .databaseId" | head -n1 || true)
            if [ -n "${RUN_ID}" ]; then break; fi
            sleep 5
          done
          if [ -z "${RUN_ID}" ]; then
            echo 'FATAL: could not resolve dispatched Full Slate run for launcher SHA'
            exit 1
          fi
          echo "full_slate_run_id=${RUN_ID}" | tee full_slate_run_id.txt
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status || true
          gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json status,conclusion,headSha,url

      - name: Download exact Full Slate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence/full_slate
          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "run_${RUN_ID}" \
            --dir evidence/full_slate
          find evidence/full_slate -maxdepth 3 -type f | sort | head -200

      - name: Install frozen shadow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml
          python -m py_compile \
            scripts/run_qb_distribution_shadow_v1.py \
            scripts/run_qb_distribution_state_context.py \
            scripts/simulation_c2_qb_candidate.py \
            scripts/modeling/qb_distribution_state_v1.py

      - name: Build strict-prior 2026 Week1 selector context
        run: |
          set -euo pipefail
          test -s evidence/full_slate/data/team_week_map.csv
          cp evidence/full_slate/data/team_week_map.csv data/team_week_map.csv
          export PYTHONPATH="${PWD}"
          python scripts/run_qb_distribution_state_context.py --season 2026 --week 1
          test -s data/qb_distribution_state_context.csv

      - name: Run real-slate QB distribution shadow audit
        id: science
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          if [ ! -s evidence/full_slate/outputs/props_priced_clean.csv ] || [ ! -s evidence/full_slate/data/model_rule_simulation_inputs.csv ]; then
            mkdir -p outputs
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/full_slate/data/live_odds_status.json')
          live={}
          if p.exists():
              try: live=json.loads(p.read_text())
              except Exception: pass
          result={
              'disposition':'QB_DISTRIBUTION_SHADOW_BLOCKED_NO_PRICED_LIVE_SLATE',
              'live_odds_status':live,
              'production_pricing_modified':0,
              'sportsbook_inputs_to_selector':0,
          }
          Path('outputs/qb_distribution_shadow_v1_result.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
            exit 0
          fi

          python scripts/run_qb_distribution_shadow_v1.py \
            --rule-inputs evidence/full_slate/data/model_rule_simulation_inputs.csv \
            --priced evidence/full_slate/outputs/props_priced_clean.csv \
            --state-context data/qb_distribution_state_context.csv \
            --out outputs/qb_distribution_shadow_v1.csv \
            --result outputs/qb_distribution_shadow_v1_result.json

      - name: Show frozen deployment result
        if: always()
        run: |
          echo '=== Full Slate source run ==='
          cat full_slate_run_id.txt 2>/dev/null || true
          echo '=== Shadow result ==='
          cat outputs/qb_distribution_shadow_v1_result.json 2>/dev/null || true
          echo '=== Shadow QB rows ==='
          test -s outputs/qb_distribution_shadow_v1.csv && cat outputs/qb_distribution_shadow_v1.csv || true

      - name: Upload shadow deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-distribution-shadow-week1-v1
          path: |
            full_slate_run_id.txt
            data/qb_distribution_state_context.csv
            data/qb_distribution_state_context_audit.csv
            outputs/qb_distribution_shadow_v1.csv
            outputs/qb_distribution_shadow_v1_result.json
            docs/migrations/QB_DISTRIBUTION_SHADOW_WEEK1_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
