name: Migration 74 QB Dropback Transition

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/audit_qb_dropback_transition.py'
      - 'scripts/backtest/audit_qb_opportunity_recoverability.py'
      - 'scripts/backtest/audit_qb_efficiency_uncertainty.py'
      - '.github/workflows/backtest-qb-dropback-transition.yml'
      - 'data/backtests/qb_frontier_canonical_v1/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scikit-learn

      - name: Frozen M74 scientific scope
        run: |
          echo 'M74 follows M73: perfect attempts retain 11.16 passing-MAE yards of headroom and DBR dominated 51.7% of canonical 10+ attempt misses.'
          echo 'M74 is NOT M65 state-occupancy redux and NOT a generic additive residual model.'
          echo 'Primary target: log(actual full-game DBR / strictly-prior M73 expected DBR).'
          echo 'Corrected canonical attempts = Raw pred_attempts x corrected_DBR / expected_DBR; passing yards use frozen implied canonical YPA.'
          echo '2024 trains fixed models; 2025 is untouched evaluation. 2022/2023 are history only.'
          echo 'No sportsbook player-prop or game-market feature is used.'
          echo 'New family A: team DBR transition persistence.'
          echo 'New family B: opponent-adjusted defensive DBR inducement.'
          echo 'New family C: verified M68 opening/playcaller intent, residualized vs current DBR expectation.'
          echo 'Existing M65 state predictions are a control family; state+new must beat same-model state control incrementally.'
          echo 'Fixed models: Ridge alpha=50 and HGB absolute-error 150 iter lr=.04 depth=2 leaf=15 L2=5 seed=74.'
          echo 'Predicted transition is clipped only to 2024 target P5/P95; corrected DBR physical bounds .20-.90.'
          echo 'Full gate: coverage>=.75; transition corr>=.20; DBR MAE gain>=.0075; DBR corr +.10; attempts MAE gain>=.30; attempts corr +.03; 10+ misses reduce>=5%; passing MAE gain>=1.0 yd; pass corr +.02; 100+ misses non-increase.'
          echo 'Cross-model support: transition corr>=.10; DBR MAE gain>=.0025; attempts MAE gain>=.10; pass MAE gain>=.25; attempt/pass tails non-worse.'
          echo 'State+new incremental gate: vs same-model state control DBR MAE>=.0025, attempt MAE>=.10, passing MAE>=.50, tails non-worse.'
          echo 'No subset search, threshold retuning, hyperparameter sweep, market leakage, or production promotion.'

      - name: Compile M74
        run: python -m py_compile scripts/backtest/audit_qb_dropback_transition.py

      - name: Run M74
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/audit_qb_dropback_transition.py \
            --canonical data/backtests/qb_frontier_canonical_v1/qb_frontier_canonical_v1.csv \
            --history-seasons 2022,2023,2024,2025 \
            --out-dir data/backtests/qb_m74

      - name: Print M74 results
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_m74/m74_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- model results ---'
          cat data/backtests/qb_m74/m74_model_results.csv 2>/dev/null || true
          echo '--- feature coverage ---'
          cat data/backtests/qb_m74/m74_feature_coverage.csv 2>/dev/null || true
          echo '--- replicated univariate ---'
          cat data/backtests/qb_m74/m74_univariate_transition_screen.csv 2>/dev/null || true
          echo '--- source manifest ---'
          cat data/backtests/qb_m74/m74_source_manifest.csv 2>/dev/null || true

      - name: Upload M74 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-74-qb-dropback-transition
          path: data/backtests/qb_m74/*.csv
          if-no-files-found: warn
          retention-days: 14
