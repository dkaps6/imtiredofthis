name: RB-ND2B Backfield Source AsOf Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-nd2b-allocation-env-atlas
    paths:
      - 'scripts/backtest/audit_rb_nd2b_backfield_asof_sources.py'
      - 'docs/migrations/RB_ND2B_BACKFIELD_SOURCE_ASOF_AUDIT_PLAN.md'
      - '.github/workflows/backtest-rb-nd2b-backfield-source-asof-audit.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  M94C_RUN_ID: '33353485070'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 pyarrow nflreadpy
      - name: Download frozen M94C
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/nd2b_m94c
          gh run download "$M94C_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-94c-rb-game-environment --dir data/backtests/nd2b_m94c
          test -s data/backtests/nd2b_m94c/m94c_2025_rb_trace.csv
      - name: Audit as-of role sources
        run: |
          python -m py_compile scripts/backtest/audit_rb_nd2b_backfield_asof_sources.py
          python scripts/backtest/audit_rb_nd2b_backfield_asof_sources.py --m94c-root data/backtests/nd2b_m94c --out-dir data/backtests/rb_nd2b_source_audit
      - name: Show outputs
        if: always()
        run: |
          cat data/backtests/rb_nd2b_source_audit/nd2b_source_summary.csv 2>/dev/null || true
          cat data/backtests/rb_nd2b_source_audit/nd2b_depth_coverage.csv 2>/dev/null || true
          cat data/backtests/rb_nd2b_source_audit/nd2b_2024_depth_audit.csv 2>/dev/null || true
          cat data/backtests/rb_nd2b_source_audit/nd2b_snap_lag_coverage.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-nd2b-backfield-source-asof-audit
          path: data/backtests/rb_nd2b_source_audit/**
          retention-days: 30
