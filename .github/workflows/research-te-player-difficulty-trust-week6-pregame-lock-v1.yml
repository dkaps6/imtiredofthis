name: Research TE Player Difficulty Trust Week6 Pregame Lock V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/TE_PLAYER_DIFFICULTY_TRUST_WEEK6_PREGAME_LOCK_V1_FREEZE.md"
      - "scripts/research/lock_te_player_difficulty_trust_week6_v1.py"
      - ".github/workflows/research-te-player-difficulty-trust-week6-pregame-lock-v1.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy scikit-learn pyyaml pytest pyarrow==17.0.0

      - name: Compile frozen lock
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m py_compile scripts/research/lock_te_player_difficulty_trust_week6_v1.py

      - name: Download qualified TE trust parent
        uses: actions/download-artifact@v4
        with:
          name: te-player-difficulty-trust-selectivity-v1-38821176218
          path: /tmp/trust_parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38821176218

      - name: Download allocation-error parent
        uses: actions/download-artifact@v4
        with:
          name: player-allocation-only-difficulty-v1
          path: /tmp/allocation_parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38656442803

      - name: Download exact Week6 opportunity lock pack
        uses: actions/download-artifact@v4
        with:
          name: individual-opportunity-lock-pack-v1-week-38644002109
          path: /tmp/week6_pack
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38644002109

      - name: Download exact recovered TE OOS authority
        uses: actions/download-artifact@v4
        with:
          name: wr-te-fold-authorities-recovered-v1
          path: /tmp/te_authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37782189538

      - name: Download historical benchmark component authority
        uses: actions/download-artifact@v4
        with:
          name: historical-benchmark-clean-rebuild-v1
          path: /tmp/historical_benchmark
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38657125777

      - name: Resolve exact parent files
        run: |
          set -euo pipefail
          TRUST_RESULT="$(find /tmp/trust_parent -type f -name 'te_player_difficulty_trust_selectivity_result.json' -print -quit)"
          ALLOC_ROWS="$(find /tmp/allocation_parent -type f -name 'player_allocation_only_difficulty_rows.csv' -print -quit)"
          W6_TE_TRACE="$(find /tmp/week6_pack -type f -name 'te_r5p_week6_parent_trace.csv' -print -quit)"
          W6_VOL="$(find /tmp/week6_pack -type f -name 'player_opportunity_share_volatility_week6_lock.csv' -print -quit)"
          W6_PACK_RESULT="$(find /tmp/week6_pack -type f -name 'individual_opportunity_week6_lock_pack.json' -print -quit)"
          TE_AUTH="$(find /tmp/te_authority -type f -name 'te_r5p_oos_player_casebook.csv' -print -quit)"
          COMPONENT_2025="$(find /tmp/historical_benchmark -type f -name 'component_predictions_2025.csv' -print -quit)"
          for p in "$TRUST_RESULT" "$ALLOC_ROWS" "$W6_TE_TRACE" "$W6_VOL" "$W6_PACK_RESULT" "$TE_AUTH" "$COMPONENT_2025"; do
            test -n "$p" && test -s "$p"
          done
          echo "TRUST_RESULT=$TRUST_RESULT" >> "$GITHUB_ENV"
          echo "ALLOC_ROWS=$ALLOC_ROWS" >> "$GITHUB_ENV"
          echo "W6_TE_TRACE=$W6_TE_TRACE" >> "$GITHUB_ENV"
          echo "W6_VOL=$W6_VOL" >> "$GITHUB_ENV"
          echo "W6_PACK_RESULT=$W6_PACK_RESULT" >> "$GITHUB_ENV"
          echo "TE_AUTH=$TE_AUTH" >> "$GITHUB_ENV"
          echo "COMPONENT_2025=$COMPONENT_2025" >> "$GITHUB_ENV"

      - name: Certify parent boundaries before target-week work
        run: |
          python - <<'PY'
          import json, os
          trust=json.load(open(os.environ["TRUST_RESULT"]))
          pack=json.load(open(os.environ["W6_PACK_RESULT"]))
          assert trust["disposition"]=="TE_PLAYER_DIFFICULTY_TRUST_SELECTIVITY_QUALIFIED",trust
          assert int(trust["outcomes_2026_read"])==0,trust
          assert int(trust["sportsbook_inputs_used"])==0,trust
          assert pack["status"]=="WEEK6_INDIVIDUAL_OPPORTUNITY_LOCK_PACK_FROZEN",pack
          assert int(pack["target_week_outcomes_read"])==0,pack
          assert int(pack["sportsbook_inputs_used"])==0,pack
          state=pack["components"]["player_state"]
          assert state["disposition"]=="PLAYER_STATE_FUTURE_WEEK_READY",state
          assert int(state["roster_source_week"])==6,state
          print("Week6 trust parent boundaries PASS")
          PY

      - name: Build strict-prior 2026 Weeks1-5 historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf /tmp/w6trust_hist /tmp/w6trust_result
          mkdir -p /tmp/w6trust_hist /tmp/w6trust_result
          python scripts/backtest/build_historical_inputs.py             --season 2026 --prior-season 2025 --weeks 1-5             --out-dir /tmp/w6trust_hist
          python scripts/backtest/historical_player_logs.py             --seasons 2025,2026             --schedule /tmp/w6trust_hist/schedule_history.csv             --out /tmp/w6trust_hist/player_game_logs_history.csv

      - name: Fail closed if Week6 outcomes have appeared
        run: |
          python - <<'PY'
          import pandas as pd
          p='/tmp/w6trust_hist/player_game_logs_history.csv'
          x=pd.read_csv(p,low_memory=False)
          s=pd.to_numeric(x['season'],errors='coerce')
          w=pd.to_numeric(x['week'],errors='coerce')
          bad=sorted(w.loc[s.eq(2026)&w.ge(6)].dropna().astype(int).unique().tolist())
          if bad:
              raise RuntimeError(f'Week6-or-later outcomes present; refuse prospective lock: {bad}')
          print('Week6 outcome boundary PASS')
          PY

      - name: Freeze exact Week6 TE trust labels
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/lock_te_player_difficulty_trust_week6_v1.py             --week6-te-trace "$W6_TE_TRACE"             --week6-volatility "$W6_VOL"             --week6-pack-result "$W6_PACK_RESULT"             --parent-allocation-rows "$ALLOC_ROWS"             --parent-trust-result "$TRUST_RESULT"             --te-authority-2025 "$TE_AUTH"             --component-2025 "$COMPONENT_2025"             --player-logs /tmp/w6trust_hist/player_game_logs_history.csv             --team-weekly /tmp/w6trust_hist/team_weekly_history.csv             --schedule /tmp/w6trust_hist/schedule_history.csv             --universe-dir /tmp/w6trust_hist/pregame_universe             --out-dir /tmp/w6trust_result

      - name: Verify immutable research-only lock
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/w6trust_result/te_week6_trust_lock.json'))
          assert p['version']=='TE_PLAYER_DIFFICULTY_TRUST_WEEK6_PREGAME_LOCK_V1',p
          assert p['status']=='WEEK6_TE_TRUST_PREGAME_LOCK_FROZEN',p
          assert p['parent_disposition']=='TE_PLAYER_DIFFICULTY_TRUST_SELECTIVITY_QUALIFIED',p
          assert p['team_target_semantic_parity']['matched_rows']>=1100,p
          assert p['team_target_semantic_parity']['max_abs_gap']<=1e-5,p
          assert p['history_source_max_week_2026']==5,p
          assert p['supported_te']>0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['week6_outcomes_read']==0,p
          assert p['models_fit']==0,p
          assert p['projection_distribution_values_changed']==0,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Upload frozen Week6 TE trust lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-player-difficulty-trust-week6-pregame-lock-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/w6trust_result/**
            docs/research/TE_PLAYER_DIFFICULTY_TRUST_WEEK6_PREGAME_LOCK_V1_FREEZE.md
