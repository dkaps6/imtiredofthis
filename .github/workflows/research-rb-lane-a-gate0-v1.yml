name: RB Lane A Gate 0 Harmonizers V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/backtest/rb_lane_a_gate0_v1.py'
      - 'scripts/backtest/rb_lane_a_transition_detector_v1.py'
      - 'tests/test_rb_lane_a_gate0_v1.py'
      - 'tests/test_rb_lane_a_transition_detector_v1.py'
      - '.github/workflows/research-rb-lane-a-gate0-v1.yml'
  push:
    branches:
      - research-rb-lane-a-transition-gated-allocation-v1
    paths:
      - 'scripts/backtest/rb_lane_a_gate0_v1.py'
      - 'scripts/backtest/rb_lane_a_transition_detector_v1.py'
      - 'docs/research/RB_LANE_A_TRANSITION_GATED_ALLOCATION_V1_PLAN.md'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  helper-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest nflreadpy
      - name: Compile + unit test (network-free contract tests only)
        run: |
          python -m py_compile scripts/backtest/rb_lane_a_gate0_v1.py
          python -m py_compile scripts/backtest/rb_lane_a_transition_detector_v1.py
          python -m pytest tests/test_rb_lane_a_gate0_v1.py tests/test_rb_lane_a_transition_detector_v1.py -v

  run-gate0:
    needs: helper-contract-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy
      - name: Run Gate 0 (0.1 disclosure-only, 0.2, 0.3 structural+event checks) for seasons 2023-2025
        run: |
          python scripts/backtest/rb_lane_a_gate0_v1.py \
            --seasons 2023,2024,2025 \
            --out-dir evidence/rb_lane_a_gate0
      - name: Show Gate 0 disposition
        if: always()
        run: |
          cat evidence/rb_lane_a_gate0/gate0_report.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-lane-a-gate0-v1
          path: evidence/rb_lane_a_gate0/**
          if-no-files-found: error
          retention-days: 30
