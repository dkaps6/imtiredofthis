name: Research Player Opportunity Share Volatility Mechanism V2

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PLAYER_OPPORTUNITY_SHARE_VOLATILITY_MECHANISM_V2_PLAN.md'
      - 'scripts/research/audit_player_opportunity_share_volatility_mechanism_v2.py'
      - 'tests/test_player_opportunity_share_volatility_mechanism_v2.py'
      - '.github/workflows/research-player-opportunity-share-volatility-mechanism-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy pytest pyyaml 'pyarrow==18.1.0'

      - name: Compile and test frozen mechanism
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_player_opportunity_share_volatility_mechanism_v2.py
          pytest -q tests/test_player_opportunity_share_volatility_mechanism_v2.py

      - name: Run frozen 2023-2025 mechanism decomposition
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/share-volatility-mechanism-v2
          python scripts/research/audit_player_opportunity_share_volatility_mechanism_v2.py             --out-dir /tmp/share-volatility-mechanism-v2

      - name: Certify mechanism contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/share-volatility-mechanism-v2/player_opportunity_share_volatility_mechanism_v2_result.json'))
          assert p['version']=='PLAYER_OPPORTUNITY_SHARE_VOLATILITY_MECHANISM_V2',p
          assert p['target_seasons']==[2023,2024,2025],p
          assert p['target_weeks']==[5,18],p
          assert p['prior_window_games']==8,p
          assert p['min_prior_games']==4,p
          assert p['integrity']['same_future_feature_violations']==0,p
          assert p['integrity']['same_team_feature_violations']==0,p
          assert p['integrity']['same_future_denominator_violations']==0,p
          assert p['scoreable_identity_coverage']>=.95,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['model_residuals_used']==0,p
          assert p['predictive_candidate_fits']==0,p
          assert p['projection_changes']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PLAYER_OPPORTUNITY_EXCESS_VOLATILITY_EXISTS',
              'PLAYER_OPPORTUNITY_VOLATILITY_EXPLAINED_BY_MEAN_AND_COUNT_NOISE',
              'PLAYER_OPPORTUNITY_VOLATILITY_MECHANISM_INTEGRITY_FAILURE',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload mechanism artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-opportunity-share-volatility-mechanism-v2-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/share-volatility-mechanism-v2/**
