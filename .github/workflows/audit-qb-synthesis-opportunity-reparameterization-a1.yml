name: QB Synthesis Opportunity Reparameterization A1

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-synthesis-opportunity-reparameterization-a1
    paths:
      - ".github/workflows/audit-qb-synthesis-opportunity-reparameterization-a1.yml"
      - "scripts/backtest/evaluate_qb_synthesis_opportunity_reparameterization_a1.py"
      - "docs/migrations/QB_SYNTHESIS_OPPORTUNITY_REPARAMETERIZATION_A1_PLAN.md"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==1.5.3 scipy==1.11.4
      - name: Compile frozen evaluator
        run: python -m py_compile scripts/backtest/evaluate_qb_synthesis_opportunity_reparameterization_a1.py
      - name: Download immutable parent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/chain evidence/shared
          gh run download 34523313743 --repo "${GITHUB_REPOSITORY}" --name qb-opportunity-chain-decomposition-v1 --dir evidence/chain
          gh run download 34066549394 --repo "${GITHUB_REPOSITORY}" --name qb-wr-shared-pass-volume-mechanism --dir evidence/shared
      - name: Run frozen deterministic A1 diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/qb_synthesis_opportunity_reparameterization_a1
          python scripts/backtest/evaluate_qb_synthesis_opportunity_reparameterization_a1.py \
            --chain-root evidence/chain \
            --shared-root evidence/shared \
            --out-dir data/backtests/qb_synthesis_opportunity_reparameterization_a1
      - name: Show result
        if: always()
        run: cat data/backtests/qb_synthesis_opportunity_reparameterization_a1/qb_synthesis_opportunity_reparameterization_result.json 2>/dev/null || true
      - name: Upload A1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-synthesis-opportunity-reparameterization-a1
          path: |
            data/backtests/qb_synthesis_opportunity_reparameterization_a1/*
            docs/migrations/QB_SYNTHESIS_OPPORTUNITY_REPARAMETERIZATION_A1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
