name: Advance RB Combined Integration Principle

on:
  push:
    branches:
      - research-rb-nd2b-allocation-env-atlas
    paths:
      - '.github/workflows/advance-rb-combined-integration-principle.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Append combined RB integration principle
        run: python scripts/utils/append_rb_combined_handoff.py
      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md; then
            echo 'No handoff changes'
            exit 0
          fi
          git add docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          git commit -m 'RB: lock combined full-stack and enriched-M94C integration rule'
          git push origin HEAD:research-rb-nd2b-allocation-env-atlas
