name: RB STACK6I Team Rush Mechanics Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6i-team-rush-mechanics-oracle
    paths:
      - 'scripts/backtest/evaluate_rb_stack6i_team_rush_mechanics_oracle.py'
      - 'docs/migrations/RB_STACK6I_TEAM_RUSH_MECHANICS_ORACLE_PLAN.md'
      - '.github/workflows/backtest-rb-stack6i-team-rush-mechanics-oracle.yml'
      - 'docs/migrations/RB_STACK6I_RUN_TRIGGER.md'

permissions:
  contents: read
  actions: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      M94C_RUN_ID: '33353485070'
      STACK6H_RUN_ID: '33632678179'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4
      - name: Compile
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6i_team_rush_mechanics_oracle.py
      - name: Download frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6i/m94c data/backtests/rb_stack6i/stack6h
          gh run download "$M94C_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-94c-rb-game-environment --dir data/backtests/rb_stack6i/m94c
          gh run download "$STACK6H_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6h-current-pool-oracle --dir data/backtests/rb_stack6i/stack6h
          test -s data/backtests/rb_stack6i/m94c/m94c_2025_team_trace.csv
          test -s data/backtests/rb_stack6i/stack6h/stack6h_team_trace.csv
      - name: Run frozen STACK6I oracle
        run: |
          rm -rf data/backtests/rb_stack6i/results
          python scripts/backtest/evaluate_rb_stack6i_team_rush_mechanics_oracle.py \
            --m94c-root data/backtests/rb_stack6i/m94c \
            --stack6h-root data/backtests/rb_stack6i/stack6h \
            --out-dir data/backtests/rb_stack6i/results
      - name: Show outputs
        if: always()
        run: |
          echo '=== integrity ==='
          cat data/backtests/rb_stack6i/results/stack6i_integrity.csv 2>/dev/null || true
          echo '=== components ==='
          cat data/backtests/rb_stack6i/results/stack6i_component_scores.csv 2>/dev/null || true
          echo '=== overall ==='
          cat data/backtests/rb_stack6i/results/stack6i_overall_oracle_scores.csv 2>/dev/null || true
          echo '=== bins ==='
          cat data/backtests/rb_stack6i/results/stack6i_bin_oracle_scores.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6i/results/stack6i_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6i-team-rush-mechanics-oracle
          path: data/backtests/rb_stack6i/results/**
          if-no-files-found: warn
          retention-days: 30
