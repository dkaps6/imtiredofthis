name: Research WR Player Opportunity Uncertainty V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/WR_PLAYER_OPPORTUNITY_UNCERTAINTY_V1_FREEZE.md'
      - 'scripts/research/evaluate_wr_player_opportunity_uncertainty_v1.py'
      - 'tests/test_wr_player_opportunity_uncertainty_v1.py'
      - '.github/workflows/research-wr-player-opportunity-uncertainty-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest scipy

      - name: Run frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_wr_player_opportunity_uncertainty_v1.py
          pytest -q tests/test_wr_player_opportunity_uncertainty_v1.py

      - name: Download exact WR mechanism parent
        uses: actions/download-artifact@v4
        with:
          name: wr-player-mechanism-persistence-v1-37634044900
          path: /tmp/wr_mechanism
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37634044900

      - name: Resolve exact parent rows
        run: |
          set -euo pipefail
          ROWS="$(find /tmp/wr_mechanism -type f -name 'wr_player_mechanism_persistence_rows.csv' -print -quit)"
          test -n "$ROWS" && test -s "$ROWS"
          echo "ROWS=$ROWS" >> "$GITHUB_ENV"

      - name: Evaluate frozen player-first uncertainty diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/wr_player_uncertainty
          mkdir -p /tmp/wr_player_uncertainty
          python scripts/research/evaluate_wr_player_opportunity_uncertainty_v1.py \
            --rows "$ROWS" \
            --out-dir /tmp/wr_player_uncertainty

      - name: Verify frozen boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path('/tmp/wr_player_uncertainty/wr_player_opportunity_uncertainty_result.json').read_text())
          assert p['source_run']==37634044900,p
          assert p['source_artifact']==11487359185,p
          assert p['source_parent_disposition']=='WR_PLAYER_PERSISTENCE_MIXED_MECHANISM',p
          assert p['candidate_models_fit']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['projection_mean_changes']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
            'WR_PLAYER_OPPORTUNITY_UNCERTAINTY_INTEGRITY_FAILURE',
            'WR_PLAYER_OPPORTUNITY_UNCERTAINTY_SOURCE_LIMITED',
            'WR_PLAYER_OPPORTUNITY_UNCERTAINTY_CONFIRMED',
            'NO_ACTIONABLE_WR_PLAYER_OPPORTUNITY_UNCERTAINTY',
          },p
          print('WR_PLAYER_OPPORTUNITY_UNCERTAINTY_V1_CONTRACT_CERTIFIED')
          PY

      - name: Display result
        if: always()
        run: cat /tmp/wr_player_uncertainty/wr_player_opportunity_uncertainty_result.json || true

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-player-opportunity-uncertainty-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/wr_player_uncertainty/**
            docs/research/WR_PLAYER_OPPORTUNITY_UNCERTAINTY_V1_FREEZE.md
