name: Research PRISM Pass Catcher QB Regime Allocation Source V1
on:
  push:
    branches: [research-individual-opportunity-roadmap-2026-10-08]
    paths:
      - 'scripts/research/audit_prism_pass_catcher_qb_regime_allocation_state_v1_source.py'
      - '.github/workflows/research-prism-pass-catcher-qb-regime-allocation-source-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 535 --repo "${{ github.repository }}" --body "PRISM pass-catcher QB-regime allocation source audit started: run ${{ github.run_id }}, exact head ${{ github.sha }}. Source/chronology only; no predictive scoring, sportsbook/OddsAPI, fit, target outcomes, or production mutation."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pandas numpy pyyaml 'pyarrow==18.1.0'
      - name: Download frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/qbreg && mkdir -p /tmp/qbreg/source /tmp/qbreg/out
          gh run download 38895205962 --repo "${{ github.repository }}" --name player-active-role-participation-source-v1-38895205962 --dir /tmp/qbreg/source
          U="$(find /tmp/qbreg/source -type f -name player_active_role_pregame_universe.csv -print -quit)"
          test -s "$U"
          echo "U=$U" >> "$GITHUB_ENV"
      - name: Execute source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_pass_catcher_qb_regime_allocation_state_v1_source.py
          python scripts/research/audit_prism_pass_catcher_qb_regime_allocation_state_v1_source.py --pregame-universe "$U" --out-dir /tmp/qbreg/out
      - name: Certify
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qbreg/out/passcatcher_qb_regime_source_result.json'))
          assert len(p['metrics'])==4,p
          i=p['integrity']
          assert i['target_game_outcomes_used_in_source_state']==0,p
          assert i['sportsbook_inputs_used']==0 and i['oddsapi_calls']==0,p
          assert i['predictive_candidates_scored']==0 and i['coefficients_fit']==0,p
          assert i['thresholds_searched']==0 and i['production_changed'] is False,p
          assert i['chronology_violations']==0,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
      - name: Record result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/qbreg-comment.md
          import json,os
          p=json.load(open('/tmp/qbreg/out/passcatcher_qb_regime_source_result.json'))
          print(f"PRISM pass-catcher QB-regime allocation source audit complete. Run {os.environ['GITHUB_RUN_ID']}, exact head {os.environ['GITHUB_SHA']}. Disposition: {p['disposition']}.")
          for r in p['metrics']:
              print(f"{r['family']} {r['season']}: QB-regime={r['qb_regime_source_valid_teamweek_rate']:.3%}, same-QB>=2={r['same_qb_ge2_rate']:.3%}, same-QB>=3={r['same_qb_ge3_rate']:.3%}, support={r['same_qb_ge2_support_rows']} rows/{r['same_qb_ge2_distinct_players']} players, ready={r['source_ready']}.")
          print("Integrity: target-game outcomes in source state 0; predictive candidates 0; sportsbook/OddsAPI 0; fits/thresholds 0; production unchanged.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/qbreg-comment.md
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-pass-catcher-qb-regime-allocation-source-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/qbreg/out/**
