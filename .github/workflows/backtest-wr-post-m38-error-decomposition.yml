name: WR Post-M38 Error Decomposition

on:
  workflow_dispatch:
  push:
    branches:
      - research-wr-post-m38-error-decomposition
    paths:
      - ".github/workflows/backtest-wr-post-m38-error-decomposition.yml"
      - "scripts/backtest/evaluate_wr_post_m38_error_decomposition.py"
      - "docs/migrations/WR_POST_M38_ERROR_DECOMPOSITION_PLAN.md"

jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          path: research

      - name: Checkout exact M38 parent
        uses: actions/checkout@v4
        with:
          ref: b98518d97b3038f471aee9ae3201009b2c70bb29
          path: m38_parent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r m38_parent/requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Compile frozen diagnostic
        working-directory: research
        run: |
          python -m py_compile scripts/backtest/evaluate_wr_post_m38_error_decomposition.py

      - name: Rebuild M38 historical inputs
        working-directory: m38_parent
        env:
          PYTHONPATH: ${{ github.workspace }}/m38_parent
        run: |
          python scripts/backtest/build_historical_inputs.py \
            --season 2025 --prior-season 2024 --weeks "1-18" --out-dir data/backtests
          python scripts/backtest/enrich_historical_defense.py \
            --team-weekly data/backtests/team_weekly_history.csv \
            --seasons 2024,2025 \
            --audit data/backtests/historical_defense_enrichment_audit.csv \
            --observations data/backtests/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py \
            --season 2025 --prior-season 2024 --weeks "1-18" \
            --data-dir data/backtests \
            --report data/backtests/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py \
            --seasons 2024,2025 \
            --schedule data/backtests/schedule_history.csv \
            --out data/backtests/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py \
            --seasons 2024,2025 \
            --out data/backtests/injuries_history.csv
          python scripts/backtest/build_historical_weather.py \
            --schedule data/backtests/schedule_history.csv \
            --out data/backtests/weather_history.csv

      - name: Rebuild exact M38 component predictions
        working-directory: m38_parent
        env:
          PYTHONPATH: ${{ github.workspace }}/m38_parent
        run: |
          rm -f data/backtests/component_predictions.csv
          python scripts/backtest/walk_forward.py \
            --season 2025 --prior-season 2024 --weeks "1-18" \
            --player-logs data/backtests/player_game_logs_history.csv \
            --team-weekly data/backtests/team_weekly_history.csv \
            --schedule data/backtests/schedule_history.csv \
            --universe-dir data/backtests/pregame_universe \
            --injuries data/backtests/injuries_history.csv \
            --weather data/backtests/weather_history.csv \
            --out data/backtests/component_predictions.csv \
            --iterations 2000

      - name: Evaluate frozen post-M38 WR decomposition
        working-directory: research
        env:
          PYTHONPATH: ${{ github.workspace }}/research
        run: |
          rm -rf data/backtests/wr_post_m38_error_decomposition
          python scripts/backtest/evaluate_wr_post_m38_error_decomposition.py \
            --predictions ../m38_parent/data/backtests/component_predictions.csv \
            --player-logs ../m38_parent/data/backtests/player_game_logs_history.csv \
            --out-dir data/backtests/wr_post_m38_error_decomposition

      - name: Show WR decomposition result
        if: always()
        working-directory: research
        run: |
          cat data/backtests/wr_post_m38_error_decomposition/wr_post_m38_result.json 2>/dev/null || true
          echo "--- Shapley summary ---"
          cat data/backtests/wr_post_m38_error_decomposition/wr_post_m38_shapley.csv 2>/dev/null || true

      - name: Upload WR decomposition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-post-m38-error-decomposition
          path: |
            research/data/backtests/wr_post_m38_error_decomposition/*
            m38_parent/data/backtests/historical_input_validation.csv
          if-no-files-found: warn
