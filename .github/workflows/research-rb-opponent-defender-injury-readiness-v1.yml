name: Research RB Opponent Defender Injury Readiness V1

on:
  push:
    branches:
      - research-rb-opponent-defender-injury-readiness-v1
    paths:
      - 'docs/research/RB_OPPONENT_DEFENDER_INJURY_READINESS_V1_PLAN.md'
      - 'scripts/research/audit_rb_opponent_defender_injury_readiness_v1.py'
      - 'tests/test_rb_opponent_defender_injury_readiness_v1.py'
      - '.github/workflows/research-rb-opponent-defender-injury-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyarrow
      - name: Run frozen safeguard tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_rb_opponent_defender_injury_readiness_v1.py
      - name: Run source-readiness audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/rb_opp_injury
          mkdir -p /tmp/rb_opp_injury
          python scripts/research/audit_rb_opponent_defender_injury_readiness_v1.py             --out-dir /tmp/rb_opp_injury
      - name: Verify research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/rb_opp_injury/rb_opponent_defender_injury_readiness_result.json').read_text())
          assert p['sportsbook_inputs_used']==0,p
          assert p['target_game_outcomes_read']==0,p
          assert p['candidate_variants_constructed']==0,p
          assert p['candidate_variants_scored']==0,p
          assert p['parameters_fit']==0,p
          assert p['production_mutations']==0,p
          assert p['same_future_snap_violations']==0,p
          assert p['disposition'] in {
            'RB_OPPONENT_DEFENDER_INJURY_SOURCE_READY',
            'RB_OPPONENT_DEFENDER_INJURY_SOURCE_PARTIAL',
            'RB_OPPONENT_DEFENDER_INJURY_SOURCE_NOT_READY',
          },p
          print('RB_OPPONENT_DEFENDER_INJURY_READINESS_CONTRACT_CERTIFIED')
          PY
      - name: Display result
        if: always()
        run: |
          cat /tmp/rb_opp_injury/rb_opponent_defender_injury_readiness_result.json || true
          echo
          cat /tmp/rb_opp_injury/rb_opponent_defender_injury_source_rows.csv || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-opponent-defender-injury-readiness-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/rb_opp_injury/**
