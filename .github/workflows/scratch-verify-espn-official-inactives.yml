# scratch: verify the new ESPN-based official-inactives replacement end to
# end against real, live data -- confirm it (a) reaches real-money-relevant
# players like Tua Tagovailoa (independently confirmed OUT via nfl.com news
# headline earlier today) with section_complete=1 for finished/live games,
# and (b) the full candidate-prep pipeline still runs clean with it wired
# in. No odds, zero credits.
name: Scratch Verify ESPN Official Inactives

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-verify-espn-official-inactives.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEASON: "2026"
      PRIOR_SEASON: "2025"
      SLATE_DATE: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml
      - name: Build raw Ourlads roles
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/providers/ourlads_depth.py --season "${SEASON}"
      - name: Build authoritative team-week map
        env:
          TEAM_WEEK_MAP_CSV: data/team_week_map.csv
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/build_team_week_map_v2.py --season "${SEASON}" --out data/team_week_map.csv
      - name: Build weather and weekly injuries
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/build/build_weather_week_v2.py --season "${SEASON}" --date "${SLATE_DATE}"
          python scripts/build/build_injuries_weekly.py data/injuries.csv --season "${SEASON}"
      - name: Resolve current availability with ESPN-backed inactives (no odds)
        run: |
          export PYTHONPATH="${PWD}"
          WEEK_RESOLVED=$(python -c "from scripts.runtime_context import resolve_week; print(resolve_week())")
          python scripts/run_current_player_availability_candidate_prep_v1.py --season "${SEASON}" --week "${WEEK_RESOLVED}"
      - name: Verify real known inactives are captured
        run: |
          python3 -c "
          import pandas as pd

          o = pd.read_csv('data/official_inactives_v1.csv', keep_default_na=False)
          print('=== official_inactives_v1.csv ===')
          print('rows:', len(o))
          complete_teams = sorted(o.loc[o.section_complete.eq(1), 'team'].unique())
          print('complete teams:', complete_teams, 'count:', len(complete_teams))

          atl_rows = o[o.team == 'ATL']
          print()
          print('ATL rows:')
          print(atl_rows.to_string())
          atl_players = set(atl_rows.loc[atl_rows.player.ne(''), 'player'])
          print('ATL listed players:', atl_players)
          assert any('Tagovailoa' in p for p in atl_players), f'Tua not found in ATL inactive list: {atl_players}'
          print('PASS: Tua Tagovailoa correctly captured as ATL inactive')

          print()
          print('=== current_player_availability_game_certification.csv ===')
          c = pd.read_csv('data/current_player_availability_game_certification.csv')
          pd.set_option('display.max_columns', None)
          pd.set_option('display.width', 200)
          print(c.to_string())

          r = pd.read_csv('data/roles_current_production_eligible_v1.csv', low_memory=False)
          r.columns = [x.lower() for x in r.columns]
          eligible = sorted(r['team'].dropna().astype(str).unique())
          print()
          print('production_eligible teams now:', eligible, 'count:', len(eligible))
          "
      - name: Strict repository audits
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict
