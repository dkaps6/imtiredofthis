name: OL Roster Pairwise Cohesion Qualification V1

on:
  push:
    branches: [research-football-context-event-redundancy-v1]
    paths:
      - 'scripts/football_context/qualify_ol_roster_pairwise_cohesion_v1.py'
      - 'tests/test_ol_roster_pairwise_cohesion_qualification_v1.py'
      - '.github/workflows/ol-roster-pairwise-cohesion-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile and focused tests
        run: |
          python -m compileall scripts/football_context/qualify_ol_roster_pairwise_cohesion_v1.py
          PYTHONPATH="${PWD}" pytest -q tests/test_ol_roster_pairwise_cohesion_qualification_v1.py

      - name: Rehydrate canonical schedule, prior team state and weekly rosters
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/ol_cohesion_inputs"
          mkdir -p "$out"
          PYTHONPATH="${PWD}" python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd
          import nflreadpy as nfl
          from scripts.backtest.historical_inputs import (
              build_schedule_history,
              build_team_weekly_from_pbp,
          )

          def to_pd(obj):
              if isinstance(obj, pd.DataFrame):
                  return obj.copy()
              if hasattr(obj, "to_pandas"):
                  return obj.to_pandas()
              return pd.DataFrame(obj)

          seasons=list(range(2019,2026))
          out=Path(os.environ["RUNNER_TEMP"])/"ol_cohesion_inputs"
          schedule=build_schedule_history(seasons)
          team_weekly=build_team_weekly_from_pbp(seasons)
          rosters=[]
          for season in seasons:
              rosters.append(to_pd(nfl.load_rosters_weekly(season)))
          roster=pd.concat(rosters,ignore_index=True,sort=False)

          schedule.to_csv(out/"schedule_2019_2025.csv",index=False)
          team_weekly.to_csv(out/"team_weekly_2019_2025.csv",index=False)
          roster.to_csv(out/"weekly_rosters_2019_2025.csv",index=False)
          print({
              "schedule_rows":len(schedule),
              "team_weekly_rows":len(team_weekly),
              "roster_rows":len(roster),
          })
          PY
          echo "INPUT_DIR=$out" >> "$GITHUB_ENV"

      - name: Execute frozen outcome-free OL pairwise cohesion qualification
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/ol_cohesion_qualification"
          PYTHONPATH="${PWD}" python scripts/football_context/qualify_ol_roster_pairwise_cohesion_v1.py \
            --schedule "${INPUT_DIR}/schedule_2019_2025.csv" \
            --roster "${INPUT_DIR}/weekly_rosters_2019_2025.csv" \
            --team-weekly "${INPUT_DIR}/team_weekly_2019_2025.csv" \
            --out-dir "$out" \
            --git-sha "${GITHUB_SHA}"
          echo "QUAL_OUT=$out" >> "$GITHUB_ENV"

      - name: Enforce sanitized evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "${QUAL_OUT}" -maxdepth 1 -type f | wc -l)" -eq 5
          ! find "${QUAL_OUT}" -type f -name '*weekly_roster*' -print -quit | grep -q .
          ! find "${QUAL_OUT}" -type f -name '*team_weekly*' -print -quit | grep -q .
          find "${QUAL_OUT}" -maxdepth 1 -type f -print

      - name: Upload sanitized qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ol-roster-pairwise-cohesion-qualification-v1
          path: ${{ runner.temp }}/ol_cohesion_qualification
          if-no-files-found: error
          retention-days: 30
