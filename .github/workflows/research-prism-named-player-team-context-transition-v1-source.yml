name: Research PRISM Named Player Team Context Transition V1 Source

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_NAMED_PLAYER_TEAM_CONTEXT_TRANSITION_V1_SOURCE_PLAN.md'
      - 'scripts/research/audit_prism_named_player_team_context_transition_v1.py'
      - 'tests/test_prism_named_player_team_context_transition_v1.py'
      - '.github/workflows/research-prism-named-player-team-context-transition-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "fc63601c34760d042adcc00fff12976496622574"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml nflreadpy

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_NAMED_PLAYER_TEAM_CONTEXT_TRANSITION_V1_SOURCE_PLAN.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_named_player_team_context_transition_v1.py" 2>/dev/null; then
            echo "ERROR: implementation existed at source freeze"
            exit 1
          fi

      - name: Compile and run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_named_player_team_context_transition_v1.py
          pytest -q tests/test_prism_named_player_team_context_transition_v1.py

      - name: Execute frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/prism-team-context-transition
          mkdir -p /tmp/prism-team-context-transition/out
          python scripts/research/audit_prism_named_player_team_context_transition_v1.py             --out-dir /tmp/prism-team-context-transition/out

      - name: Certify source-only contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          base='/tmp/prism-team-context-transition/out'
          p=json.load(open(f'{base}/team_context_transition_source_result.json'))
          roster=pd.read_csv(f'{base}/team_context_normalized_weekly_rosters.csv')
          states=pd.read_csv(f'{base}/team_context_named_player_states.csv')
          transitions=pd.read_csv(f'{base}/team_context_transition_events.csv')

          assert p['version']=='PRISM_NAMED_PLAYER_TEAM_CONTEXT_TRANSITION_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='fc63601c34760d042adcc00fff12976496622574',p
          assert p['disposition'] in {
              'PRISM_NAMED_PLAYER_TEAM_CONTEXT_TRANSITION_V1_SOURCE_READY',
              'PRISM_NAMED_PLAYER_TEAM_CONTEXT_TRANSITION_V1_SOURCE_BLOCKED',
          },p
          assert len(roster)>0
          assert set(states['team_context_state'].astype(str).unique()) <= {
              'TEAM_CONTEXT_CONTINUED',
              'TEAM_CONTEXT_TRANSITION',
              'NO_PRIOR_NFL_ROSTER_OBSERVATION',
          }
          if len(transitions):
              assert transitions['stable_id'].astype(str).str.len().gt(0).all()
              assert transitions['prior_team'].astype(str).ne(transitions['team'].astype(str)).all()
              assert pd.to_numeric(transitions['prior_ordinal'],errors='coerce').lt(
                  pd.to_numeric(transitions['ordinal'],errors='coerce')
              ).all()

          assert p['predictive_player_outcomes_scored']==0,p
          assert p['player_opportunity_relationships_scored']==0,p
          assert p['target_game_snaps_used']==0,p
          assert p['target_game_performance_fields_used']==0,p
          assert p['coefficients_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['paid_oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os

          p=json.load(open('/tmp/prism-team-context-transition/out/team_context_transition_source_result.json'))
          print("### PRISM named-player team-context transition V1 — source audit")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for s in p['historical_seasons']:
              print()
              print(f"**{s['season']} named-player source support**")
              print(f"- roster team-week coverage={s['roster_team_week_coverage']:.2%}; stable ID={s['stable_id_coverage']:.2%}")
              print(f"- transition events={s['transition_events']}; named players={s['transition_named_players']}")
              print(f"- Week-1/in-season transitions={s['week1_transition_events']}/{s['inseason_transition_events']}")
              print(f"- prior-team support >=3={s['prior_team_support_ge3_events']} ({s['prior_team_support_ge3_share']:.2%}); >=8={s['prior_team_support_ge8_events']} ({s['prior_team_support_ge8_share']:.2%})")
              print(f"- states={s['state_counts']}")
              for fam in s['family_summary']:
                  print(f"  - {fam['family']}: events={fam['transition_events']} players={fam['transition_named_players']} prior>=3={fam['prior_team_support_ge3_share']:.2%} week1/inseason={fam['week1_transition_events']}/{fam['inseason_transition_events']}")
              failed=[k for k,v in s['gates'].items() if not v]
              print(f"- failed historical source gates: {failed or ['NONE']}")

          q=p['prospective_2026']
          print()
          print("**2026 prospective parity**")
          print(f"- max roster week={q['max_roster_week']}; complete coverage weeks={q['complete_coverage_weeks']}")
          print(f"- stable ID coverage={q['stable_id_coverage']:.2%}")
          print(f"- transition events={q['transition_events']}; named players={q['transition_named_players']}; Week-1/in-season={q['week1_transition_events']}/{q['inseason_transition_events']}")
          failed=[k for k,v in q['gates'].items() if not v]
          print(f"- failed parity gates: {failed or ['NONE']}")
          print()
          print(f"- same-week multi-team unresolved player-weeks={p['state_audit']['same_week_multi_team_ambiguous_player_weeks']}")
          failed_integrity=[k for k,v in p['integrity_gates'].items() if not v]
          print(f"- failed integrity gates: {failed_integrity or ['NONE']}")
          print()
          print("Source/lineage only. A team move is a named-player current-context boundary, not a performance penalty or boost. Rookies/no-prior players remain separate. No snaps, targets, carries, receptions, yards, TDs, 2026 outcomes, sportsbook/OddsAPI, fitted coefficients/thresholds, or production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload immutable source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-named-player-team-context-transition-v1-source-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-team-context-transition/out/**
