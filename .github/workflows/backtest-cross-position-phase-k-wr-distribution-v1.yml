name: Cross-Position Phase K WR Distribution V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - 'scripts/backtest/cross_position_phase_k_wr_distribution_v1.py'
      - 'docs/migrations/CROSS_POSITION_PHASE_K_MEAN_NEUTRAL_WR_DISTRIBUTION_STATE_V1_PLAN.md'
      - '.github/workflows/backtest-cross-position-phase-k-wr-distribution-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase-k-wr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-K evaluator
        run: python -m py_compile scripts/backtest/cross_position_phase_k_wr_distribution_v1.py
      - name: Download authoritative Phase-C evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_c
          gh run download 34147777341 --repo "${GITHUB_REPOSITORY}" --name cross-position-catastrophic-casebook-v1-phase-c --dir evidence/phase_c
      - name: Download authoritative Phase-G evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_g
          gh run download 34150685094 --repo "${GITHUB_REPOSITORY}" --name cross-position-phase-g-v1 --dir evidence/phase_g
      - name: Download authoritative Phase-I evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_i
          gh run download 34151186485 --repo "${GITHUB_REPOSITORY}" --name cross-position-phase-i-v1 --dir evidence/phase_i
      - name: Verify frozen inputs
        run: |
          test -s evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv
          test -s evidence/phase_g/data/backtests/cross_position_phase_g_v1/phase_g_casebook.csv
          test -s evidence/phase_i/data/backtests/cross_position_phase_i_v1/phase_i_qb_casebook.csv
      - name: Run Phase K WR distribution state
        run: |
          python scripts/backtest/cross_position_phase_k_wr_distribution_v1.py \
            --phase-c-all-rows evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv \
            --phase-g-casebook evidence/phase_g/data/backtests/cross_position_phase_g_v1/phase_g_casebook.csv \
            --phase-i-qb-casebook evidence/phase_i/data/backtests/cross_position_phase_i_v1/phase_i_qb_casebook.csv \
            --out-dir data/backtests/cross_position_phase_k_wr_distribution_v1
      - name: Show Phase-K result
        run: |
          cat data/backtests/cross_position_phase_k_wr_distribution_v1/phase_k_result.json
          cat data/backtests/cross_position_phase_k_wr_distribution_v1/phase_k_scorecard.csv
      - name: Upload Phase-K evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-phase-k-wr-distribution-v1
          path: |
            data/backtests/cross_position_phase_k_wr_distribution_v1/*
            docs/migrations/CROSS_POSITION_PHASE_K_MEAN_NEUTRAL_WR_DISTRIBUTION_STATE_V1_PLAN.md
          retention-days: 30
