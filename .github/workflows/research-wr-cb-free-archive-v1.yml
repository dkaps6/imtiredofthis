name: Research WR-CB Free Archive V1

on:
  pull_request:
    paths:
      - "scripts/research/acquire_fantasyalarm_wr_cb_archive_v1.py"
      - "scripts/research/audit_fantasyalarm_wr_cb_source_quality_v1.py"
      - "scripts/research/capture_fantasyalarm_wr_cb_pregame_v1.py"
      - "tests/test_capture_fantasyalarm_wr_cb_pregame_v1.py"
      - "data/research/wr_cb_pregame_capture_request_v1.csv"
      - "tests/test_acquire_fantasyalarm_wr_cb_archive_v1.py"
      - "data/research/wr_cb_free_archive_seed_manifest_v1.csv"
      - "docs/research/WR_CB_FREE_HISTORICAL_ARCHIVE_SOURCE_READINESS_V1.md"
      - ".github/workflows/research-wr-cb-free-archive-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Parser unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_acquire_fantasyalarm_wr_cb_archive_v1.py tests/test_fantasyalarm_wr_cb_source_quality_v1.py tests/test_capture_fantasyalarm_wr_cb_pregame_v1.py
      - name: Capture one explicitly requested prospective article
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          from scripts.research.capture_fantasyalarm_wr_cb_pregame_v1 import run_capture

          req_path = Path("data/research/wr_cb_pregame_capture_request_v1.csv")
          req = pd.read_csv(req_path)
          required = {"season", "week", "url"}
          if not required.issubset(req.columns):
              raise RuntimeError("prospective request must have season,week,url")
          if req.empty:
              print("No explicitly requested prospective article. No fetch.")
          elif len(req) != 1:
              raise RuntimeError("one prospective URL per immutable capture run")
          else:
              record = req.iloc[0]
              run_capture(
                  season=int(record.season), week=int(record.week),
                  url=str(record.url).strip(),
                  out_dir=Path("outputs/wr_cb_prospective") / os.environ["GITHUB_RUN_ID"],
              )
          PY
      - name: Upload any prospective exact capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-cb-prospective-exact-capture
          path: outputs/wr_cb_prospective/
          retention-days: 90
          if-no-files-found: ignore
      - name: Acquire verified public archive
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf outputs/wr_cb_free_archive_v1
          python scripts/research/acquire_fantasyalarm_wr_cb_archive_v1.py \
            --manifest data/research/wr_cb_free_archive_seed_manifest_v1.csv \
            --out-dir outputs/wr_cb_free_archive_v1
      - name: Audit timing coverage and stable identity
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/audit_fantasyalarm_wr_cb_source_quality_v1.py \
            --assignments outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_assignments.csv \
            --page-audit outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_page_audit.csv \
            --out-dir outputs/wr_cb_free_archive_v1
      - name: Source audit summary
        run: |
          cat outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_summary.json
          cat outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_summary.json
          python - <<'PY'
          import pandas as pd
          p="outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_pages.csv"
          x=pd.read_csv(p)
          print(x.to_string(index=False))
          print("\nSEASON COVERAGE")
          print(pd.read_csv("outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_seasons.csv").to_string(index=False))
          PY
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-cb-free-archive-v1
          path: |
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_assignments.csv
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_page_audit.csv
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_full_audit.json
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_summary.json
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_rows.csv
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_pages.csv
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_seasons.csv
            outputs/wr_cb_free_archive_v1/fantasyalarm_wr_cb_source_quality_summary.json
            outputs/wr_cb_free_archive_v1/pages/
          if-no-files-found: warn
          retention-days: 30
