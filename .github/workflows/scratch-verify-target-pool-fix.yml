# scratch: verify the target-pool always-32 fix against the REAL artifact
# from the failed live run 34784333131 (real fetched odds, real pricing
# output already computed) -- no re-fetch, zero additional OddsAPI credits.
name: Scratch Verify Target Pool Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scratch-verify-target-pool-fix.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download real failed-run artifact (no re-fetch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 34784333131 --repo "$GITHUB_REPOSITORY" --name run_34784333131 --dir artifact
      - name: Restore preserved data and outputs
        run: |
          rm -rf data outputs
          mkdir -p data outputs
          cp -a artifact/data/. data/
          cp -a artifact/outputs/. outputs/
      - name: Confirm the real artifact's eligible-team count really is 4 (matches the live failure)
        run: |
          export PYTHONPATH="${PWD}"
          python3 -c "
          import os
          os.environ['ACTIVE_ROLES_CSV'] = 'data/roles_current_production_eligible_v1.csv'
          from scripts.utils.eligible_team_set_v1 import expected_current_teams
          teams = expected_current_teams()
          print('eligible teams:', sorted(teams), 'count:', len(teams))
          assert len(teams) == 4, f'expected the same 4-team state as the live failure, got {len(teams)}'
          "
      - name: Re-run the exact failing sequence with this branch's fix applied
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/audit_market_model_lineage_v2.py
          python scripts/validate_team_target_pool_full_universe_v2.py
          echo "PASS: target-pool validator now succeeds against the real 4-team-eligible artifact"
      - name: Confirm the validator file was never mutated by the seam
        run: |
          git diff --exit-code -- scripts/validate_team_target_pool_full_universe_v2.py
          echo "PASS: validator file untouched on disk"
