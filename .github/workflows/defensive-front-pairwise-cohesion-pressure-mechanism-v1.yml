name: Defensive Front Pairwise Cohesion Pressure Mechanism V1

on:
  push:
    branches: [research-football-context-event-redundancy-v1]
    paths:
      - 'scripts/football_context/test_defensive_front_pairwise_cohesion_pressure_mechanism_v1.py'
      - 'tests/test_defensive_front_pairwise_cohesion_pressure_mechanism_v1.py'
      - '.github/workflows/defensive-front-pairwise-cohesion-pressure-mechanism-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile and focused tests
        run: |
          python -m compileall scripts/football_context/test_defensive_front_pairwise_cohesion_pressure_mechanism_v1.py
          PYTHONPATH="${PWD}" pytest -q tests/test_defensive_front_pairwise_cohesion_pressure_mechanism_v1.py tests/test_defensive_front_pairwise_cohesion_qualification_v1.py

      - name: Rehydrate frozen inputs with sealed 2025 outcome file
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/def_front_cohesion_pressure_inputs"
          mkdir -p "$out"
          PYTHONPATH="${PWD}" python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd
          import nflreadpy as nfl
          from scripts.backtest.historical_inputs import (
              build_schedule_history,
              build_team_weekly_from_pbp,
          )

          def to_pd(obj):
              if isinstance(obj, pd.DataFrame):
                  return obj.copy()
              if hasattr(obj, "to_pandas"):
                  return obj.to_pandas()
              return pd.DataFrame(obj)

          out=Path(os.environ["RUNNER_TEMP"])/"def_front_cohesion_pressure_inputs"
          seasons=list(range(2019,2026))
          schedule=build_schedule_history(seasons)
          team_weekly=build_team_weekly_from_pbp(seasons)
          roster=pd.concat(
              [to_pd(nfl.load_rosters_weekly(s)) for s in seasons],
              ignore_index=True, sort=False
          )

          schedule.to_csv(out/"schedule_2019_2025.csv",index=False)
          roster.to_csv(out/"weekly_rosters_2019_2025.csv",index=False)
          team_weekly.loc[team_weekly.season.le(2024)].to_csv(
              out/"team_weekly_primary_2019_2024.csv",index=False
          )
          team_weekly.loc[team_weekly.season.eq(2025)].to_csv(
              out/"team_weekly_replication_2025.csv",index=False
          )
          print({
              "schedule_rows":len(schedule),
              "roster_rows":len(roster),
              "primary_team_week_rows":int(team_weekly.season.le(2024).sum()),
              "sealed_replication_rows":int(team_weekly.season.eq(2025).sum()),
          })
          PY
          echo "INPUT_DIR=$out" >> "$GITHUB_ENV"

      - name: Execute frozen mechanism experiment
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/def_front_cohesion_pressure_result"
          PYTHONPATH="${PWD}" python scripts/football_context/test_defensive_front_pairwise_cohesion_pressure_mechanism_v1.py \
            --schedule "${INPUT_DIR}/schedule_2019_2025.csv" \
            --roster "${INPUT_DIR}/weekly_rosters_2019_2025.csv" \
            --team-weekly-primary "${INPUT_DIR}/team_weekly_primary_2019_2024.csv" \
            --team-weekly-replication "${INPUT_DIR}/team_weekly_replication_2025.csv" \
            --out-dir "$out" \
            --git-sha "${GITHUB_SHA}"
          echo "RESULT_OUT=$out" >> "$GITHUB_ENV"

      - name: Enforce sanitized result boundary
        shell: bash
        run: |
          set -euo pipefail
          ! find "${RESULT_OUT}" -type f -name '*weekly_roster*' -print -quit | grep -q .
          ! find "${RESULT_OUT}" -type f -name '*team_weekly*' -print -quit | grep -q .
          find "${RESULT_OUT}" -maxdepth 1 -type f -print

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: defensive-front-pairwise-cohesion-pressure-mechanism-v1
          path: ${{ runner.temp }}/def_front_cohesion_pressure_result
          if-no-files-found: error
          retention-days: 30
