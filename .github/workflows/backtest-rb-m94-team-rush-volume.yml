name: M94 RB Team Rush Volume

on:
  push:
    branches:
      - research-rb-m94-team-rush-volume
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  M91_RUN_ID: '33348554748'

jobs:
  rb-team-rush-volume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2

      - name: Download frozen M91 baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m91_frozen
          gh run download "$M91_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name migration-91-rb-temporal-baseline \
            --dir data/backtests/rb_m91_frozen
          test "$(find data/backtests/rb_m91_frozen -name component_predictions.csv | wc -l)" -eq 2
          test "$(find data/backtests/rb_m91_frozen -name team_weekly_history.csv | wc -l)" -eq 2
          test "$(find data/backtests/rb_m91_frozen -name schedule_history.csv | wc -l)" -eq 2

      - name: Run M94 team rushing opportunity test
        run: |
          python -m py_compile scripts/backtest/evaluate_rb_team_rush_volume.py
          python scripts/backtest/evaluate_rb_team_rush_volume.py \
            --m91-root data/backtests/rb_m91_frozen \
            --out-dir data/backtests/rb_m94

      - name: Show M94 disposition
        if: always()
        run: |
          echo '=== M94 disposition ==='
          cat data/backtests/rb_m94/m94_disposition.csv 2>/dev/null || true
          echo '=== 2024 model holdout ==='
          cat data/backtests/rb_m94/m94_model_grid_2024_holdout.csv 2>/dev/null || true
          echo '=== Team rush volume ==='
          cat data/backtests/rb_m94/m94_team_volume_summary.csv 2>/dev/null || true
          echo '=== RB validation ==='
          cat data/backtests/rb_m94/m94_rb_validation_summary.csv 2>/dev/null || true
          echo '=== Script diagnostics ==='
          cat data/backtests/rb_m94/m94_script_classifier_diagnostics.csv 2>/dev/null || true

      - name: Upload M94 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-94-rb-team-rush-volume
          path: data/backtests/rb_m94/**
          if-no-files-found: warn
          retention-days: 14
