name: WR Receiver Catchability Source Audit V1

on:
  push:
    branches:
      - research-wr-yard-efficiency-feature-audit-v1
    paths:
      - 'scripts/research/audit_wr_receiver_catchability_source_v1.py'
      - '.github/workflows/research-wr-receiver-catchability-source-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install source-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow
      - name: Run source-only receiver catchability audit
        run: python -m scripts.research.audit_wr_receiver_catchability_source_v1
      - name: Prove no WR outcome backtest was produced
        run: |
          test ! -e data/backtests/wr_r19_receiver_catchability_v1
          echo 'No WR-R19 outcome directory exists: PASS'
      - name: Upload source audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: wr-receiver-catchability-source-audit-v1
          path: data/backtests/wr_receiver_catchability_source_audit_v1/
          retention-days: 30
