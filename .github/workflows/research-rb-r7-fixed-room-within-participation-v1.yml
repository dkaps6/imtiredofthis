name: RB R7 Fixed Room Within Participation V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - scripts/backtest/evaluate_rb_r7_fixed_room_within_participation_v1.py
      - .github/workflows/research-rb-r7-fixed-room-within-participation-v1.yml

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml scikit-learn joblib

      - name: Build 2020 training inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2020
          python scripts/backtest/build_historical_inputs.py --season 2020 --prior-season 2019 --weeks '1-18' --out-dir data/backtests_2020
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests_2020/team_weekly_history.csv --seasons 2019,2020 --audit data/backtests_2020/historical_defense_enrichment_audit.csv --observations data/backtests_2020/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2020 --prior-season 2019 --weeks '1-18' --data-dir data/backtests_2020 --report data/backtests_2020/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2019,2020 --schedule data/backtests_2020/schedule_history.csv --out data/backtests_2020/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2019,2020 --out data/backtests_2020/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2020/schedule_history.csv --out data/backtests_2020/weather_history.csv

      - name: Build 2021 fresh-confirmation inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2021
          python scripts/backtest/build_historical_inputs.py --season 2021 --prior-season 2020 --weeks '1-18' --out-dir data/backtests_2021
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests_2021/team_weekly_history.csv --seasons 2020,2021 --audit data/backtests_2021/historical_defense_enrichment_audit.csv --observations data/backtests_2021/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2021 --prior-season 2020 --weeks '1-18' --data-dir data/backtests_2021 --report data/backtests_2021/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2020,2021 --schedule data/backtests_2021/schedule_history.csv --out data/backtests_2021/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2020,2021 --out data/backtests_2021/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2021/schedule_history.csv --out data/backtests_2021/weather_history.csv

      - name: Build 2022 replication inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2022
          python scripts/backtest/build_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --out-dir data/backtests_2022
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests_2022/team_weekly_history.csv --seasons 2021,2022 --audit data/backtests_2022/historical_defense_enrichment_audit.csv --observations data/backtests_2022/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --data-dir data/backtests_2022 --report data/backtests_2022/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2021,2022 --schedule data/backtests_2022/schedule_history.csv --out data/backtests_2022/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2021,2022 --out data/backtests_2022/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2022/schedule_history.csv --out data/backtests_2022/weather_history.csv

      - name: Run frozen RB R7 fresh OOS and replication
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/evaluate_rb_r7_fixed_room_within_participation_v1.py \
            --data-2020 data/backtests_2020 --logs-2020 data/backtests_2020/player_game_logs_history.csv \
            --data-2021 data/backtests_2021 --logs-2021 data/backtests_2021/player_game_logs_history.csv \
            --data-2022 data/backtests_2022 --logs-2022 data/backtests_2022/player_game_logs_history.csv \
            --iterations 2000 \
            --out-dir data/backtests/rb_r7_fixed_room_within_v1

      - name: Show frozen R7 result
        if: always()
        run: |
          echo '=== RB R7 result ==='
          cat data/backtests/rb_r7_fixed_room_within_v1/rb_r7_result.json 2>/dev/null || true
          echo '=== RB R7 market summary ==='
          cat data/backtests/rb_r7_fixed_room_within_v1/rb_r7_market_summary.csv 2>/dev/null || true
          echo '=== RB R7 phase summary ==='
          cat data/backtests/rb_r7_fixed_room_within_v1/rb_r7_phase_summary.csv 2>/dev/null || true

      - name: Upload R7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-r7-fixed-room-within-participation-v1
          path: |
            data/backtests_2020/historical_input_validation.csv
            data/backtests_2021/historical_input_validation.csv
            data/backtests_2022/historical_input_validation.csv
            data/backtests/rb_r7_fixed_room_within_v1/*
          if-no-files-found: warn
          retention-days: 30
