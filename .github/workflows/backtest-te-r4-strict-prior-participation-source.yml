name: TE-R4 Strict Prior Participation Source

on:
  push:
    branches:
      - research-te-r4-strict-prior-participation-source
    paths:
      - '.github/workflows/backtest-te-r4-strict-prior-participation-source.yml'
      - 'scripts/backtest/audit_te_r4_strict_prior_participation_source.py'
      - 'docs/migrations/TE_R4_STRICT_PRIOR_PARTICIPATION_SOURCE_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen auditor
        run: python -m py_compile scripts/backtest/audit_te_r4_strict_prior_participation_source.py
      - name: Download exact Joint V1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/joint_v1
          gh run download 34081764151 --repo "${GITHUB_REPOSITORY}" --name joint-pass-receiving-conservation-v1 --dir evidence/joint_v1
          test -s evidence/joint_v1/data/backtests/joint_pass_receiving_v1/result/joint_v1_paired_player_casebook.csv
      - name: Run frozen TE-R4 source audit
        run: |
          python scripts/backtest/audit_te_r4_strict_prior_participation_source.py \
            --joint-root evidence/joint_v1 \
            --out-dir data/backtests/te_r4_strict_prior_participation_source
      - name: Show result
        if: always()
        run: |
          cat data/backtests/te_r4_strict_prior_participation_source/te_r4_result.json 2>/dev/null || true
          cat data/backtests/te_r4_strict_prior_participation_source/te_r4_availability_summary.csv 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-r4-strict-prior-participation-source
          path: |
            data/backtests/te_r4_strict_prior_participation_source/*
            docs/migrations/TE_R4_STRICT_PRIOR_PARTICIPATION_SOURCE_PLAN.md
          if-no-files-found: warn
