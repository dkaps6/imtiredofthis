name: Migration 60 QB Vegas Benchmark

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Regular-season weeks"
        required: false
        default: "1-18"
      iterations:
        description: "Canonical MC iterations"
        required: false
        default: "2000"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'backtest-migration-60-qb-vegas-benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Declare Migration 60 scope
        run: |
          echo "Migration 60 is MEASUREMENT ONLY. No production defaults or football-model features change."
          echo "Primary objective remains real football projection accuracy."
          echo "Secondary benchmark: did the independent projection select the correct side of the pregame QB passing-yard prop?"
          echo "Vegas player-prop lines are NEVER supplied to the football projection. They are joined after projection generation."
          echo "Seasons: 2024 and 2025 only. Consumed 2023 holdout is not rescored."
          echo "Snapshot: 30 minutes before kickoff. Book priority: DraftKings, then FanDuel."
          echo "Market claims require at least 70% matched stable-QB coverage; otherwise results are exploratory only."
          echo "Historical player props consume Odds API credits. Paid pull is blocked if estimated cost exceeds 50% of remaining quota or violates a 250-credit reserve."

      - name: Build independent 2024 and 2025 canonical QB projections
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          WEEKS="${{ github.event.inputs.weeks || '1-18' }}"
          ITERATIONS="${{ github.event.inputs.iterations || '2000' }}"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_vegas_benchmark/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/build_qb_vegas_benchmark_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m60"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Summarize full-sample football accuracy before Vegas join
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root=Path('data/backtests/qb_vegas_benchmark'); out=root/'summary'; out.mkdir(parents=True,exist_ok=True)
          frames=[]
          for s in (2024,2025):
              x=pd.read_csv(root/str(s)/'m60'/f'm60_qb_projection_wide_{s}.csv'); frames.append(x)
          g=pd.concat(frames,ignore_index=True)
          rows=[]
          for candidate in ('current','joint_cap_shrink','attempts_raw_only','ypa_raw_only','both_raw'):
              p=pd.to_numeric(g[f'mc_proj_{candidate}'],errors='coerce'); a=pd.to_numeric(g.actual,errors='coerce')
              z=pd.DataFrame({'p':p,'a':a}).dropna(); e=z.p-z.a
              rows.append({'candidate':candidate,'n':len(z),'mae':e.abs().mean(),'rmse':np.sqrt((e*e).mean()),'bias':e.mean(),'correlation':z.p.corr(z.a),'catastrophic_100plus':e.abs().ge(100).sum(),'under_100plus':e.le(-100).sum(),'over_100plus':e.ge(100).sum()})
          y=pd.DataFrame(rows); y.to_csv(out/'m60_full_football_metrics.csv',index=False)
          print('=== M60 FULL-SAMPLE FOOTBALL METRICS ==='); print(y.to_string(index=False))
          PY

      - name: Preflight quota and fetch historical passing-yard props if safe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/fetch_historical_qb_pass_props.py \
            --projection-file data/backtests/qb_vegas_benchmark/2024/m60/m60_qb_projection_wide_2024.csv \
            --projection-file data/backtests/qb_vegas_benchmark/2025/m60/m60_qb_projection_wide_2025.csv \
            --out-dir data/backtests/qb_vegas_benchmark/market \
            --snapshot-minutes 30 --books draftkings,fanduel \
            --max-quota-fraction 0.50 --quota-reserve 250

      - name: Grade against Vegas on common matched rows
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          STATUS=$(python - <<'PY'
          import pandas as pd
          p='data/backtests/qb_vegas_benchmark/market/m60_odds_api_preflight.csv'
          try:
              x=pd.read_csv(p); print(str(x.iloc[-1].get('status','')))
          except Exception:
              print('missing')
          PY
          )
          echo "M60 historical odds status=$STATUS"
          if [ "$STATUS" = "complete" ]; then
            python scripts/backtest/grade_qb_vegas_benchmark.py \
              --projection-file data/backtests/qb_vegas_benchmark/2024/m60/m60_qb_projection_wide_2024.csv \
              --projection-file data/backtests/qb_vegas_benchmark/2025/m60/m60_qb_projection_wide_2025.csv \
              --props data/backtests/qb_vegas_benchmark/market/m60_historical_qb_pass_props.csv \
              --out-dir data/backtests/qb_vegas_benchmark/summary --min-coverage 0.70
          else
            echo "Historical market pull did not proceed to a complete dataset; benchmark grading intentionally skipped."
          fi

      - name: Show Migration 60 results
        if: always()
        run: |
          echo "--- full football metrics ---"
          cat data/backtests/qb_vegas_benchmark/summary/m60_full_football_metrics.csv 2>/dev/null || true
          echo "--- odds API preflight ---"
          cat data/backtests/qb_vegas_benchmark/market/m60_odds_api_preflight.csv 2>/dev/null || true
          echo "--- market coverage ---"
          cat data/backtests/qb_vegas_benchmark/summary/m60_market_coverage.csv 2>/dev/null || true
          echo "--- football + market metrics ---"
          cat data/backtests/qb_vegas_benchmark/summary/m60_football_and_market_metrics.csv 2>/dev/null || true
          echo "--- edge thresholds ---"
          cat data/backtests/qb_vegas_benchmark/summary/m60_market_edge_thresholds.csv 2>/dev/null || true
          echo "--- catastrophic vs market ---"
          cat data/backtests/qb_vegas_benchmark/summary/m60_catastrophic_market_diagnostics.csv 2>/dev/null || true

      - name: Upload Migration 60 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-60-qb-vegas-benchmark
          path: |
            data/backtests/qb_vegas_benchmark/summary/*.csv
            data/backtests/qb_vegas_benchmark/market/*.csv
            data/backtests/qb_vegas_benchmark/2024/m60/*.csv
            data/backtests/qb_vegas_benchmark/2025/m60/*.csv
            data/backtests/qb_vegas_benchmark/2024/historical_input_validation.csv
            data/backtests/qb_vegas_benchmark/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
