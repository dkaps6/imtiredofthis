name: Research Future-Week Opportunity Lock Pack Mechanics V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/INDIVIDUAL_OPPORTUNITY_FUTURE_WEEK_LOCK_PACK_V1.md'
      - 'scripts/research/certify_individual_opportunity_future_week_lock_pack_v1.py'
      - 'tests/test_individual_opportunity_future_week_lock_pack_v1.py'
      - '.github/workflows/research-future-week-opportunity-lock-pack-mechanics-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Compile and test lock-pack certifier
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/certify_individual_opportunity_future_week_lock_pack_v1.py
          pytest -q tests/test_individual_opportunity_future_week_lock_pack_v1.py
      - name: Certify no live future-week lock executed
        run: |
          test ! -e /tmp/individual-opportunity-lock-pack
          echo "FUTURE_WEEK_OPPORTUNITY_LOCK_PACK_MECHANICS_ONLY_CERTIFIED"
      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
