name: Research Future-Week Share Volatility Lock Mechanics V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PLAYER_OPPORTUNITY_SHARE_VOLATILITY_FUTURE_WEEK_LOCK_V1.md'
      - 'scripts/research/lock_player_opportunity_share_volatility_future_week_v1.py'
      - 'tests/test_player_opportunity_share_volatility_future_week_v1.py'
      - '.github/workflows/research-future-week-share-volatility-lock-mechanics-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml 'pyarrow==18.1.0'
      - name: Compile and test prospective lock mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/lock_player_opportunity_share_volatility_future_week_v1.py
          pytest -q tests/test_player_opportunity_share_volatility_future_week_v1.py
      - name: Certify mechanics only
        run: echo "SHARE_VOLATILITY_FUTURE_WEEK_LOCK_MECHANICS_CERTIFIED"
      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
