name: Migration 64 QB Possession Dropback Generative

on:
  workflow_dispatch:
    inputs:
      iterations: {description: "MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-64-qb-possession-dropback-generative'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib pyarrow

      - name: Declare Migration 64 frozen scope and gates
        run: |
          echo "Migration 64 changes architecture: possessions/drives -> plays/drive -> dropback rate -> pass-attempt conversion -> QB share."
          echo "This is NOT another residual classifier, raw-vs-capped trust stack, or hyperparameter sweep."
          echo "Pregame component estimates use only games before the target week, with a fixed four-game league prior and last-eight history."
          echo "2024 and 2025 are evaluated independently and combined. 2023 is history only; consumed 2023 holdout is NOT target-scored. 2022 is not a target test."
          echo "Primary candidate is generative_gamescript. generative_neutral is diagnostic only."
          echo "Game-script dropback weights are frozen before results: neutral=.35; remaining .65 split by spread-implied win probability logistic scale 6.5."
          echo "Broad component bounds only protect data errors: drives 7-17, plays/drive 3.5-9, dropback rate .30-.85, attempt conversion .75-1.00."
          echo "No final attempts clip is used."
          echo "Frozen PASS gates vs canonical attempts_raw_only:"
          echo "1 attempts MAE improves >=.40"
          echo "2 attempts MAE non-worse in both 2024 and 2025"
          echo "3 attempts correlation improves >=.03"
          echo "4 10+ attempt misses reduce >=10%"
          echo "5 actual-40+ attempt game MAE improves >=.75"
          echo "6 passing-yards MAE improves >=1.50 using existing contextual YPA"
          echo "7 passing-yards MAE non-worse in both 2024 and 2025"
          echo "8 passing-yards correlation improves >=.03"
          echo "9 100+ passing-yard misses reduce >=10%"
          echo "All nine gates are required for architecture eligibility. No post-hoc gate retuning."
          echo "Component oracles are diagnostic only and cannot rescue a failed architecture."

      - name: Compile M64 module
        run: python -m py_compile scripts/backtest/validate_qb_possession_dropback_generative.py

      - name: Build canonical reference rows
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_possession_dropback/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/diagnose_qb_raw_tail_attribution_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m59"

            python scripts/backtest/audit_qb_extreme_error_regimes.py \
              --season "$SEASON" \
              --game-attribution "$D/m59/m59_game_attribution_${SEASON}.csv" \
              --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" \
              --out-dir "$D/m62"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Validate possession-dropback generative architecture
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/validate_qb_possession_dropback_generative.py \
            --season-file data/backtests/qb_possession_dropback/2024/m62/m62_enriched_games_2024.csv \
            --season-file data/backtests/qb_possession_dropback/2025/m62/m62_enriched_games_2025.csv \
            --player-logs data/backtests/qb_possession_dropback/2024/player_game_logs_history.csv \
            --player-logs data/backtests/qb_possession_dropback/2025/player_game_logs_history.csv \
            --out-dir data/backtests/qb_possession_dropback/summary

      - name: Show Migration 64 results
        if: always()
        run: |
          echo '--- interpretation ---'
          cat data/backtests/qb_possession_dropback/summary/m64_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- attempt metrics ---'
          cat data/backtests/qb_possession_dropback/summary/m64_attempt_metrics.csv 2>/dev/null || true
          echo '--- passing metrics ---'
          cat data/backtests/qb_possession_dropback/summary/m64_passing_metrics.csv 2>/dev/null || true
          echo '--- component oracles ---'
          cat data/backtests/qb_possession_dropback/summary/m64_component_oracles.csv 2>/dev/null || true
          echo '--- weekly paired ---'
          cat data/backtests/qb_possession_dropback/summary/m64_weekly_paired.csv 2>/dev/null || true

      - name: Upload Migration 64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-64-qb-possession-dropback-generative
          path: |
            data/backtests/qb_possession_dropback/summary/*.csv
            data/backtests/qb_possession_dropback/2024/m62/m62_enriched_games_2024.csv
            data/backtests/qb_possession_dropback/2025/m62/m62_enriched_games_2025.csv
            data/backtests/qb_possession_dropback/2024/m59/m59_game_attribution_2024.csv
            data/backtests/qb_possession_dropback/2025/m59/m59_game_attribution_2025.csv
            data/backtests/qb_possession_dropback/2024/historical_input_validation.csv
            data/backtests/qb_possession_dropback/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
