name: RB PD2 Forward History Build V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-pd2-forward-shadow-confirmation-v1
    paths:
      - "scripts/research/rb_pd2_forward_shadow_v1.py"
      - "scripts/research/build_rb_pd2_forward_history_v1.py"
      - "scripts/research/assemble_rb_pd2_forward_locks_v1.py"
      - "tests/test_rb_pd2_forward_shadow_v1.py"
      - "tests/test_rb_pd2_forward_operational_v1.py"
      - ".github/workflows/research-rb-pd2-forward-history-v1.yml"

jobs:
  build-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow tabulate

      - name: Run frozen forward-layer tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q             tests/test_rb_pd2_shadow_capture_v1.py             tests/test_rb_pd2_forward_shadow_v1.py             tests/test_rb_pd2_forward_operational_v1.py

      - name: Build independent 2024 and 2025 historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/rb_pd2_hist_2024 /tmp/rb_pd2_hist_2025 /tmp/rb_pd2_forward
          mkdir -p /tmp/rb_pd2_hist_2024 /tmp/rb_pd2_hist_2025 /tmp/rb_pd2_forward
          python scripts/backtest/build_historical_inputs.py             --season 2024 --prior-season 2023 --weeks 1-18 --out-dir /tmp/rb_pd2_hist_2024
          python scripts/backtest/build_historical_inputs.py             --season 2025 --prior-season 2024 --weeks 1-18 --out-dir /tmp/rb_pd2_hist_2025

      - name: Combine authoritative schedule and team-week history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out = Path('/tmp/rb_pd2_forward')
          for name in ['schedule_history.csv', 'team_weekly_history.csv']:
              parts = [
                  pd.read_csv('/tmp/rb_pd2_hist_2024/' + name),
                  pd.read_csv('/tmp/rb_pd2_hist_2025/' + name),
              ]
              x = pd.concat(parts, ignore_index=True)
              keys = ['season', 'week', 'team']
              x = x.sort_values(keys).drop_duplicates(keys, keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined historical identity rows in {name}')
              x.to_csv(out / name, index=False)
              print(name, len(x), sorted(x.season.unique()))
          PY

      - name: Build canonical 2023-2025 player game logs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py             --seasons 2023,2024,2025             --schedule /tmp/rb_pd2_forward/schedule_history.csv             --out /tmp/rb_pd2_forward/player_game_logs_history.csv

      - name: Build leakage-safe 2025 component trace
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/walk_forward.py             --season 2025 --prior-season 2024 --weeks 1-18 --iterations 2000             --player-logs /tmp/rb_pd2_forward/player_game_logs_history.csv             --team-weekly /tmp/rb_pd2_forward/team_weekly_history.csv             --schedule /tmp/rb_pd2_forward/schedule_history.csv             --universe-dir /tmp/rb_pd2_hist_2025/pregame_universe             --out /tmp/rb_pd2_forward/component_predictions_2025.csv

      - name: Build frozen RB PD2 forward history state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/build_rb_pd2_forward_history_v1.py             --components /tmp/rb_pd2_forward/component_predictions_2025.csv             --weights data/model_ensemble_weights.csv             --out-dir /tmp/rb_pd2_forward/history

      - name: Assert history artifact contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('/tmp/rb_pd2_forward/history')
          state = pd.read_csv(root / 'rb_pd2_forward_history_state.csv')
          manifest = json.loads((root / 'rb_pd2_forward_history_manifest.json').read_text())

          assert len(state) > 0
          assert set(state.season.unique()) == {2025}
          assert int(manifest['row_count']) == len(state)
          assert manifest['zero_prospective_outcomes_used'] is True
          assert manifest['rush_yards_fit_scope'] == 'all_2024_oos_frozen_for_2025'
          assert manifest['rush_yards_promotion_lineage'] == 'RB_STACK1_RUN_33535308110_FOR_P3'
          assert len(manifest['manual_name_overrides_sha256']) == 64
          assert len(manifest['roles_ourlads_sha256']) == 64

          scoreable = state[
              (pd.to_numeric(state.prior_games, errors='coerce') >= 4)
              & (pd.to_numeric(state.difficulty_reference_n, errors='coerce') >= 100)
              & pd.to_numeric(state.difficulty_score, errors='coerce').notna()
          ]
          assert len(scoreable) > 0
          print({
              'rows': len(state),
              'players': state.player_clean_key.nunique(),
              'scoreable_rows': len(scoreable),
              'max_reference_n': int(pd.to_numeric(state.difficulty_reference_n).max()),
          })
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload forward-history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-pd2-forward-history-v1
          path: |
            /tmp/rb_pd2_forward/component_predictions_2025.csv
            /tmp/rb_pd2_forward/history/rb_pd2_forward_history_state.csv
            /tmp/rb_pd2_forward/history/rb_pd2_forward_history_manifest.json
          if-no-files-found: error
          retention-days: 30
