name: M95T Advance Research Handoff

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-m95t-constrained-dual-layer-tail
    paths:
      - '.github/workflows/advance-m95t-research-handoff.yml'
      - 'scripts/backtest/advance_m95t_handoff.py'

permissions:
  contents: write

jobs:
  advance-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-rb-m95t-constrained-dual-layer-tail
          fetch-depth: 0

      - name: Update canonical handoff
        run: |
          python scripts/backtest/advance_m95t_handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          git commit -m 'M95T: advance canonical research handoff to M96'
          git push origin HEAD:research-rb-m95t-constrained-dual-layer-tail
