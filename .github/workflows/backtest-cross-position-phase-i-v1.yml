name: Cross-Position Phase I V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - '.github/workflows/backtest-cross-position-phase-i-v1.yml'
      - 'scripts/backtest/cross_position_phase_i_v1.py'
      - 'docs/migrations/CROSS_POSITION_PHASE_I_MEAN_NEUTRAL_QB_DISTRIBUTION_STATE_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  phase-i:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile frozen Phase-I evaluator
        run: python -m py_compile scripts/backtest/cross_position_phase_i_v1.py
      - name: Download authoritative C2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/c2
          gh run download 34142510405 --repo "${GITHUB_REPOSITORY}" --name pass-receiving-conservation-integration-v1 --dir evidence/c2
      - name: Download authoritative Phase-G evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/phase_g
          gh run download 34150685094 --repo "${GITHUB_REPOSITORY}" --name cross-position-phase-g-v1 --dir evidence/phase_g
      - name: Verify frozen inputs
        run: |
          test -s evidence/c2/data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_qb_casebook.csv
          test -s evidence/phase_g/data/backtests/cross_position_phase_g_v1/phase_g_casebook.csv
      - name: Run Phase-I mean-neutral distribution state
        run: |
          python scripts/backtest/cross_position_phase_i_v1.py \
            --c2-qb-casebook evidence/c2/data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_qb_casebook.csv \
            --phase-g-casebook evidence/phase_g/data/backtests/cross_position_phase_g_v1/phase_g_casebook.csv \
            --out-dir data/backtests/cross_position_phase_i_v1
      - name: Show Phase-I result
        if: always()
        run: |
          cat data/backtests/cross_position_phase_i_v1/phase_i_result.json 2>/dev/null || true
          cat data/backtests/cross_position_phase_i_v1/phase_i_scorecard.csv 2>/dev/null || true
          cat data/backtests/cross_position_phase_i_v1/phase_i_slice_scorecard.csv 2>/dev/null || true
      - name: Upload Phase-I evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-phase-i-v1
          path: |
            data/backtests/cross_position_phase_i_v1/*
            docs/migrations/CROSS_POSITION_PHASE_I_MEAN_NEUTRAL_QB_DISTRIBUTION_STATE_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
