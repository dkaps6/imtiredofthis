name: Research Joint Opportunity Allocation Dirichlet V1 Mechanics

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PLAYER_OPPORTUNITY_JOINT_ALLOCATION_DIRICHLET_V1_PLAN.md'
      - 'scripts/research/joint_opportunity_allocation_dirichlet_v1.py'
      - 'tests/test_joint_opportunity_allocation_dirichlet_v1.py'
      - '.github/workflows/research-joint-opportunity-allocation-dirichlet-v1-mechanics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      - name: Compile and test frozen joint allocation mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/joint_opportunity_allocation_dirichlet_v1.py
          pytest -q tests/test_joint_opportunity_allocation_dirichlet_v1.py
      - name: Certify research-only boundary
        run: |
          git diff --exit-code origin/main...HEAD -- scripts/simulation_v2.py || {
            echo "Production simulator changed in mechanics-only lane" >&2
            exit 1
          }
          echo "JOINT_OPPORTUNITY_ALLOCATION_DIRICHLET_V1_MECHANICS_CERTIFIED"
      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
