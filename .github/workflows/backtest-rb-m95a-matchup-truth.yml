name: M95A RB Matchup Truth Test

on:
  push:
    branches:
      - research-rb-m95a-matchup-truth
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  M91_RUN_ID: '33348554748'

jobs:
  rb-matchup-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2 pyarrow==17.0.0

      - name: Download frozen M91 baseline/history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m91_frozen
          gh run download "$M91_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name migration-91-rb-temporal-baseline \
            --dir data/backtests/rb_m91_frozen
          test "$(find data/backtests/rb_m91_frozen -name player_game_logs_history.csv | wc -l)" -eq 2
          test "$(find data/backtests/rb_m91_frozen -name team_weekly_history.csv | wc -l)" -eq 2

      - name: Restore nflverse PBP cache
        id: pbp-cache
        uses: actions/cache@v4
        with:
          path: data/nflverse_pbp
          key: m95a-nflverse-pbp-2022-2025-v1

      - name: Download nflverse PBP 2022-2025
        if: steps.pbp-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/nflverse_pbp
          for season in 2022 2023 2024 2025; do
            url="https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.parquet"
            echo "Downloading $url"
            curl -fL --retry 4 --retry-delay 3 "$url" -o "data/nflverse_pbp/play_by_play_${season}.parquet"
            test -s "data/nflverse_pbp/play_by_play_${season}.parquet"
          done

      - name: Run M95A matchup truth test
        run: |
          python -m py_compile scripts/backtest/evaluate_rb_matchup_truth.py
          python scripts/backtest/evaluate_rb_matchup_truth.py \
            --m91-root data/backtests/rb_m91_frozen \
            --pbp-root data/nflverse_pbp \
            --out-dir data/backtests/rb_m95a

      - name: Show M95A headline results
        if: always()
        run: |
          echo '=== M95A disposition ==='
          cat data/backtests/rb_m95a/m95a_disposition.csv 2>/dev/null || true
          echo '=== M95A weak vs strong ==='
          cat data/backtests/rb_m95a/m95a_weak_vs_strong_summary.csv 2>/dev/null || true
          echo '=== M95A prospective matchup gain ==='
          cat data/backtests/rb_m95a/m95a_incremental_matchup_gain.csv 2>/dev/null || true
          echo '=== M95A feature availability ==='
          cat data/backtests/rb_m95a/m95a_feature_availability.csv 2>/dev/null || true

      - name: Upload M95A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-95a-rb-matchup-truth
          path: data/backtests/rb_m95a/**
          if-no-files-found: warn
          retention-days: 30
