name: Vegas Confirmation Likelihood V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/diagnose_vegas_confirmation_likelihood_v1.py"
      - "scripts/research/diagnose_game_script_confirmed_player_usage_v1.py"
      - "scripts/research/diagnose_vegas_line_gamescript_calibration_v1.py"
      - "tests/test_diagnose_vegas_confirmation_likelihood_v1.py"
      - "docs/research/VEGAS_CONFIRMATION_LIKELIHOOD_V1_PLAN.md"
      - ".github/workflows/research-vegas-confirmation-likelihood-v1.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml scikit-learn
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_diagnose_vegas_confirmation_likelihood_v1.py

  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn

      - name: Run Vegas confirmation likelihood diagnosis
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/vegas_confirmation/result
          python scripts/research/diagnose_vegas_confirmation_likelihood_v1.py \
            --out-dir /tmp/vegas_confirmation/result

      - name: Show results
        if: always()
        run: |
          cat /tmp/vegas_confirmation/result/vegas_confirmation_likelihood_result.json 2>/dev/null || true
          echo
          cat /tmp/vegas_confirmation/result/vegas_confirmation_likelihood_classification.csv 2>/dev/null || true
          echo
          cat /tmp/vegas_confirmation/result/vegas_confirmation_likelihood_downstream.csv 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-confirmation-likelihood-v1
          path: |
            /tmp/vegas_confirmation/result/*.csv
            /tmp/vegas_confirmation/result/*.json
            docs/research/VEGAS_CONFIRMATION_LIKELIHOOD_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 14
