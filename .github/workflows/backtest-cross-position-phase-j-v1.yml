name: Cross-Position Phase J V1

on:
  workflow_dispatch:
  push:
    branches: [research-cross-position-catastrophic-casebook-v1]
    paths:
      - '.github/workflows/backtest-cross-position-phase-j-v1.yml'
      - 'scripts/backtest/cross_position_phase_j_v1.py'
      - 'docs/migrations/CROSS_POSITION_PHASE_J_DEPLOYABLE_QB_STATE_SELECTOR_V1_PLAN.md'

permissions:
  actions: read
  contents: read

jobs:
  phase-j:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile evaluator
        run: python -m py_compile scripts/backtest/cross_position_phase_j_v1.py
      - name: Download Phase-C evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p evidence/phase_c
          gh run download 34147777341 --repo "${GITHUB_REPOSITORY}" --name cross-position-catastrophic-casebook-v1-phase-c --dir evidence/phase_c
      - name: Download C2 evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p evidence/c2
          gh run download 34142510405 --repo "${GITHUB_REPOSITORY}" --name pass-receiving-conservation-integration-v1 --dir evidence/c2
      - name: Verify frozen inputs
        run: |
          test -s evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv
          test -s evidence/c2/data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_qb_casebook.csv
      - name: Run Phase J
        run: |
          python scripts/backtest/cross_position_phase_j_v1.py \
            --phase-c-all-rows evidence/phase_c/data/backtests/cross_position_catastrophic_casebook_v1_phase_c/cross_position_all_rows_game_spot.csv \
            --c2-qb-casebook evidence/c2/data/backtests/pass_receiving_conservation_integration_v1/result/integration_v1_qb_casebook.csv \
            --out-dir data/backtests/cross_position_phase_j_v1
      - name: Show result
        if: always()
        run: cat data/backtests/cross_position_phase_j_v1/phase_j_result.json 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-position-phase-j-v1
          path: |
            data/backtests/cross_position_phase_j_v1/*
            docs/migrations/CROSS_POSITION_PHASE_J_DEPLOYABLE_QB_STATE_SELECTOR_V1_PLAN.md
          retention-days: 30
