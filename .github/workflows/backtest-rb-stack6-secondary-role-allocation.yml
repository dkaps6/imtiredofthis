name: RB-STACK6 Secondary Role Allocation

on:
  push:
    branches:
      - research-rb-stack6-secondary-back-role-state
    paths:
      - 'scripts/backtest/evaluate_rb_stack6_secondary_role_allocation.py'
      - '.github/workflows/backtest-rb-stack6-secondary-role-allocation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  ROLE_SOURCE_RUN_ID: '33545621101'
  STACK3_RUN_ID: '33539468967'
  MARKET_RUN_ID: '33499129109'

jobs:
  secondary-role-allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2
      - name: Compile
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6_secondary_role_allocation.py
      - name: Download frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6/role data/backtests/rb_stack6/stack3 data/backtests/rb_stack6/market
          gh run download "$ROLE_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-role-source-audit --dir data/backtests/rb_stack6/role
          gh run download "$STACK3_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack3-frozen-state-composition --dir data/backtests/rb_stack6/stack3
          gh run download "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-market-benchmark-2025 --dir data/backtests/rb_stack6/market
          test -s data/backtests/rb_stack6/role/stack6_target_game_role_observations_DIAGNOSTIC_ONLY.csv
          test -s data/backtests/rb_stack6/stack3/stack3_2025_casebook.csv
          test -s data/backtests/rb_stack6/market/rb_market_casebook.csv
      - name: Evaluate frozen STACK6 allocation
        run: |
          rm -rf data/backtests/rb_stack6/results
          python scripts/backtest/evaluate_rb_stack6_secondary_role_allocation.py \
            --role-root data/backtests/rb_stack6/role \
            --stack3-root data/backtests/rb_stack6/stack3 \
            --market-root data/backtests/rb_stack6/market \
            --out-dir data/backtests/rb_stack6/results
      - name: Show STACK6 outputs
        if: always()
        run: |
          echo '=== coverage ==='
          cat data/backtests/rb_stack6/results/stack6_coverage.csv 2>/dev/null || true
          echo '=== gate ==='
          cat data/backtests/rb_stack6/results/stack6_primary_gate.csv 2>/dev/null || true
          echo '=== market downstream ==='
          cat data/backtests/rb_stack6/results/stack6_market_metrics_DOWNSTREAM.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6/results/stack6_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6-secondary-role-allocation
          path: data/backtests/rb_stack6/results/**
          if-no-files-found: warn
          retention-days: 30
