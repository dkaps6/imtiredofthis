name: BDB2025 Exact Blocker-Rusher Assignment Qualification V1

on:
  push:
    branches: [research-football-context-event-redundancy-v1]
    paths:
      - 'scripts/football_context/qualify_bdb2025_exact_blocker_rusher_assignment_v1.py'
      - 'tests/test_bdb2025_exact_blocker_rusher_assignment_qualification_v1.py'
      - '.github/workflows/bdb2025-exact-blocker-rusher-assignment-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_SECRET_RAW: ${{ secrets.KAGGLE_API_TOKEN }}
  COMPETITION: nfl-big-data-bowl-2025

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest kaggle

      - name: Compile and focused tests
        run: |
          python -m compileall scripts/football_context/qualify_bdb2025_exact_blocker_rusher_assignment_v1.py
          PYTHONPATH="${PWD}" pytest -q tests/test_bdb2025_exact_blocker_rusher_assignment_qualification_v1.py

      - name: Normalize Kaggle token
        shell: bash
        run: |
          set -euo pipefail
          raw="${KAGGLE_SECRET_RAW:-}"
          token="${raw#export KAGGLE_API_TOKEN=}"
          token="${token#KAGGLE_API_TOKEN=}"
          token="${token//$'\r'/}"
          token="${token//$'\n'/}"
          [[ "$token" == KGAT_* ]]
          echo "::add-mask::$token"
          echo "KAGGLE_API_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p "${HOME}/.kaggle"
          printf '%s' "$token" > "${HOME}/.kaggle/access_token"
          chmod 600 "${HOME}/.kaggle/access_token"

      - name: Attempt exact-assignment source download
        id: source_access
        shell: bash
        run: |
          set -u
          d="${RUNNER_TEMP}/bdb2025_download"
          c="${RUNNER_TEMP}/bdb2025_corpus"
          mkdir -p "$d" "$c"

          # Old Kaggle competitions can return 404 for individual-file download even
          # when the full archive remains available. Try the narrow path first, then
          # fall back mechanically to the full archive without changing science.
          set +e
          kaggle competitions download -c "${COMPETITION}" -f games.csv -p "$d" >"${RUNNER_TEMP}/bdb2025_games.log" 2>&1
          rc1=$?
          kaggle competitions download -c "${COMPETITION}" -f player_play.csv -p "$d" >"${RUNNER_TEMP}/bdb2025_player_play.log" 2>&1
          rc2=$?
          set -e

          if [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]; then
            for f in games.csv player_play.csv; do
              if [ -f "$d/$f" ]; then
                cp "$d/$f" "$c/$f"
              elif [ -f "$d/$f.zip" ]; then
                unzip -q "$d/$f.zip" -d "$c"
              else
                z="$(find "$d" -maxdepth 1 -type f -name "*$f*.zip" -print -quit)"
                if [ -n "$z" ]; then unzip -q "$z" -d "$c"; fi
              fi
            done
          fi

          if [ ! -f "$c/games.csv" ] || [ ! -f "$c/player_play.csv" ]; then
            rm -rf "$d"/*
            set +e
            kaggle competitions download -c "${COMPETITION}" -p "$d" >"${RUNNER_TEMP}/bdb2025_full.log" 2>&1
            rcfull=$?
            set -e
            if [ "$rcfull" -eq 0 ]; then
              z="$(find "$d" -maxdepth 1 -type f -name '*.zip' -print -quit)"
              if [ -n "$z" ]; then
                x="${RUNNER_TEMP}/bdb2025_full"
                mkdir -p "$x"
                unzip -q "$z" -d "$x"
                gf="$(find "$x" -type f -name 'games.csv' -print -quit)"
                pf="$(find "$x" -type f -name 'player_play.csv' -print -quit)"
                if [ -n "$gf" ] && [ -n "$pf" ]; then
                  cp "$gf" "$c/games.csv"
                  cp "$pf" "$c/player_play.csv"
                fi
              fi
            fi
          fi

          if [ ! -f "$c/games.csv" ] || [ ! -f "$c/player_play.csv" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SOURCE_ACCESS=false" >> "$GITHUB_ENV"
            cat "${RUNNER_TEMP}/bdb2025_games.log" "${RUNNER_TEMP}/bdb2025_player_play.log" "${RUNNER_TEMP}/bdb2025_full.log" 2>/dev/null \
              | sed -E 's/(KGAT_[A-Za-z0-9_-]+)/[MASKED]/g' | tail -120
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "SOURCE_ACCESS=true" >> "$GITHUB_ENV"
          echo "BDB2025_CORPUS=$c" >> "$GITHUB_ENV"

      - name: Build nflverse stable-ID crosswalk
        if: steps.source_access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/bdb2025_context"
          mkdir -p "$out"
          PYTHONPATH="${PWD}" python - <<'PY'
          from pathlib import Path
          import nflreadpy as nfl
          from scripts.player_form_v2 import _to_pandas

          out = Path(__import__("os").environ["RUNNER_TEMP"]) / "bdb2025_context"
          players = _to_pandas(nfl.load_players())
          players.to_csv(out / "nflverse_players_crosswalk.csv", index=False)
          print("players_rows", len(players))
          print("players_columns", sorted(players.columns.tolist()))
          PY
          echo "PLAYERS_CROSSWALK=$out/nflverse_players_crosswalk.csv" >> "$GITHUB_ENV"

      - name: Execute outcome-free assignment qualification
        if: steps.source_access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/bdb2025_blocker_rusher_qualification"
          PYTHONPATH="${PWD}" python scripts/football_context/qualify_bdb2025_exact_blocker_rusher_assignment_v1.py \
            --corpus-dir "${BDB2025_CORPUS}" \
            --players "${PLAYERS_CROSSWALK}" \
            --out-dir "$out"
          echo "QUAL_OUT=$out" >> "$GITHUB_ENV"

      - name: Materialize access-blocked result
        if: steps.source_access.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/bdb2025_blocker_rusher_qualification"
          mkdir -p "$out"
          cat > "$out/bdb2025_blocker_rusher_assignment_qualification_v1.json" <<'JSON'
          {
            "audit": "BDB2025_EXACT_BLOCKER_RUSHER_ASSIGNMENT_QUALIFICATION_V1",
            "disposition": "BDB2025_SOURCE_ACCESS_BLOCKED",
            "pressure_outcome_values_read": false,
            "target_game_assignment_is_realized_not_pregame": true,
            "deployable_pregame_source_contract": false,
            "sportsbook_read": false,
            "production_change_authorized": false,
            "issue_535_touched": false,
            "rb_research_note": "RB remains unresolved: Week-1 specialist authorities exist, Weeks 2-18 rushing and receiving-mean gaps remain, and the separately frozen PD2 yard-difficulty MC-width lane remains an open RB research priority."
          }
          JSON
          echo "QUAL_OUT=$out" >> "$GITHUB_ENV"

      - name: Enforce sanitized artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d "${QUAL_OUT}"
          ! find "${QUAL_OUT}" -type f \( -name 'games.csv' -o -name 'player_play.csv' -o -name 'nflverse_players_crosswalk.csv' \) -print -quit | grep -q .
          find "${QUAL_OUT}" -maxdepth 1 -type f -print

      - name: Upload sanitized qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: bdb2025-exact-blocker-rusher-assignment-qualification-v1
          path: ${{ runner.temp }}/bdb2025_blocker_rusher_qualification
          if-no-files-found: error
          retention-days: 30
