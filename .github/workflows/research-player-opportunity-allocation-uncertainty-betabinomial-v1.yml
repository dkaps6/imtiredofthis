name: Research Player Opportunity Allocation Uncertainty BetaBinomial V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PLAYER_OPPORTUNITY_ALLOCATION_UNCERTAINTY_BETABINOMIAL_V1_FREEZE.md'
      - 'scripts/research/audit_player_opportunity_allocation_uncertainty_betabinomial_v1.py'
      - 'tests/test_player_opportunity_allocation_uncertainty_betabinomial_v1.py'
      - '.github/workflows/research-player-opportunity-allocation-uncertainty-betabinomial-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy pytest pyyaml 'pyarrow==18.1.0'

      - name: Compile and test frozen mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_player_opportunity_allocation_uncertainty_betabinomial_v1.py
          pytest -q tests/test_player_opportunity_allocation_uncertainty_betabinomial_v1.py

      - name: Verify exact V2 mechanism artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11768432238 --jq '.id')" = "11768432238"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11768432238 --jq '.workflow_run.id')" = "38295515693"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11768432238 --jq '.digest')" = "sha256:7b31dd29e4b94674d6948cf84af24fae7181d1a4f502a07beaa43919d4d7f3a6"

      - uses: actions/download-artifact@v4
        with:
          name: player-opportunity-share-volatility-mechanism-v2-38295515693
          path: /tmp/share-volatility-v2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38295515693

      - name: Resolve exact V2 rows
        run: |
          set -euo pipefail
          V2_ROWS="$(find /tmp/share-volatility-v2 -type f -name 'player_opportunity_share_volatility_mechanism_v2_rows.csv' -print -quit)"
          test -n "$V2_ROWS" && test -s "$V2_ROWS"
          echo "V2_ROWS=$V2_ROWS" >> "$GITHUB_ENV"

      - name: Score frozen mean-identical allocation distributions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/betabinomial-v1
          python scripts/research/audit_player_opportunity_allocation_uncertainty_betabinomial_v1.py             --v2-rows "$V2_ROWS"             --out-dir /tmp/betabinomial-v1

      - name: Certify frozen governance
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/betabinomial-v1/player_opportunity_allocation_uncertainty_betabinomial_v1_result.json'))
          assert p['version']=='PLAYER_OPPORTUNITY_ALLOCATION_UNCERTAINTY_BETABINOMIAL_V1',p
          assert p['target_seasons']==[2023,2024,2025],p
          assert p['target_weeks']==[5,18],p
          assert sorted(p['cells_authorized'])==sorted(['RB_CARRY_SHARE','RB_TARGET_SHARE','WR_TARGET_SHARE']),p
          assert p['max_expected_count_gap'] <= 1e-12,p
          assert p['max_share_reconstruction_gap'] <= 1e-9,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['fitted_coefficients']==0,p
          assert p['threshold_searches']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'BETA_BINOMIAL_ALLOCATION_UNCERTAINTY_HAS_PASSING_CELLS',
              'BETA_BINOMIAL_ALLOCATION_UNCERTAINTY_ALL_FAIL_CLOSED',
              'BETA_BINOMIAL_ALLOCATION_UNCERTAINTY_INTEGRITY_FAILURE',
          },p
          assert len(p['per_cell'])==3,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-opportunity-allocation-uncertainty-betabinomial-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/betabinomial-v1/**
