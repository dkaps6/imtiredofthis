name: Migration 60B Free QB Vegas Benchmark

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Regular-season weeks"
        required: false
        default: "1-18"
      iterations:
        description: "Canonical MC iterations"
        required: false
        default: "2000"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'backtest-migration-60b-free-qb-props')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib pyarrow

      - name: Declare Migration 60B scope
        run: |
          echo "Migration 60B is MEASUREMENT ONLY. No production football logic changes."
          echo "Primary objective remains accurate real football projection statistics."
          echo "Secondary benchmark grades the independent projection against a free historical sportsbook archive."
          echo "Source: public gcampb41/nfl_data- 2024/2025 Action Network-derived player-prop parquet files."
          echo "Market: full-game QB passing yards. Book priority: DraftKings then FanDuel."
          echo "The source does NOT preserve a trustworthy 30-minute-before-kickoff timestamp."
          echo "Therefore these lines are labeled archived-latest/closing-like, never exact 30-minute snapshots."
          echo "2024 and 2025 development seasons only. Consumed 2023 holdout is not rescored."
          echo "Claims require >=70% matched stable-QB coverage for each claimed season/combined row."

      - name: Build independent 2024 and 2025 canonical QB projections
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          WEEKS="${{ github.event.inputs.weeks || '1-18' }}"
          ITERATIONS="${{ github.event.inputs.iterations || '2000' }}"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_free_vegas_benchmark/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/build_qb_vegas_benchmark_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m60b"
          }

          run_season 2024 2023
          run_season 2025 2024

      - name: Summarize full-sample football accuracy
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path('data/backtests/qb_free_vegas_benchmark'); out=root/'summary'; out.mkdir(parents=True,exist_ok=True)
          g=pd.concat([pd.read_csv(root/str(s)/'m60b'/f'm60_qb_projection_wide_{s}.csv') for s in (2024,2025)],ignore_index=True)
          rows=[]
          for c in ('current','joint_cap_shrink','attempts_raw_only','ypa_raw_only','both_raw'):
              p=pd.to_numeric(g[f'mc_proj_{c}'],errors='coerce'); a=pd.to_numeric(g.actual,errors='coerce')
              z=pd.DataFrame({'p':p,'a':a}).dropna(); e=z.p-z.a
              rows.append({'candidate':c,'n':len(z),'mae':e.abs().mean(),'rmse':np.sqrt((e*e).mean()),'bias':e.mean(),'correlation':z.p.corr(z.a),'catastrophic_100plus':e.abs().ge(100).sum(),'under_100plus':e.le(-100).sum(),'over_100plus':e.ge(100).sum()})
          y=pd.DataFrame(rows); y.to_csv(out/'m60b_full_football_metrics.csv',index=False)
          print('=== M60B FULL-SAMPLE FOOTBALL METRICS ==='); print(y.to_string(index=False))
          PY

      - name: Download, audit, and normalize free historical QB props
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/prepare_free_qb_prop_archive.py \
            --projection-file data/backtests/qb_free_vegas_benchmark/2024/m60b/m60_qb_projection_wide_2024.csv \
            --projection-file data/backtests/qb_free_vegas_benchmark/2025/m60b/m60_qb_projection_wide_2025.csv \
            --out-dir data/backtests/qb_free_vegas_benchmark/market

      - name: Grade free archive on common matched rows
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          STATUS=$(python - <<'PY'
          import pandas as pd
          p='data/backtests/qb_free_vegas_benchmark/market/m60b_free_source_status.csv'
          try:
              x=pd.read_csv(p); print(str(x.iloc[-1].get('status','')))
          except Exception:
              print('missing')
          PY
          )
          echo "M60B free source status=$STATUS"
          if [ "$STATUS" = "complete" ]; then
            python scripts/backtest/grade_qb_vegas_benchmark.py \
              --projection-file data/backtests/qb_free_vegas_benchmark/2024/m60b/m60_qb_projection_wide_2024.csv \
              --projection-file data/backtests/qb_free_vegas_benchmark/2025/m60b/m60_qb_projection_wide_2025.csv \
              --props data/backtests/qb_free_vegas_benchmark/market/m60b_historical_qb_pass_props.csv \
              --out-dir data/backtests/qb_free_vegas_benchmark/summary --min-coverage 0.70
            python scripts/backtest/finalize_qb_free_vegas_benchmark.py \
              --summary-dir data/backtests/qb_free_vegas_benchmark/summary --min-coverage 0.70
          else
            echo "Free archive validation blocked; market grading intentionally skipped rather than guessing."
          fi

      - name: Show Migration 60B results
        if: always()
        run: |
          echo "--- football metrics ---"
          cat data/backtests/qb_free_vegas_benchmark/summary/m60b_full_football_metrics.csv 2>/dev/null || true
          echo "--- free source status ---"
          cat data/backtests/qb_free_vegas_benchmark/market/m60b_free_source_status.csv 2>/dev/null || true
          echo "--- free source audit ---"
          cat data/backtests/qb_free_vegas_benchmark/market/m60b_free_source_audit.csv 2>/dev/null || true
          echo "--- period distribution ---"
          cat data/backtests/qb_free_vegas_benchmark/market/m60b_period_distribution.csv 2>/dev/null || true
          echo "--- book distribution ---"
          cat data/backtests/qb_free_vegas_benchmark/market/m60b_book_distribution.csv 2>/dev/null || true
          echo "--- market coverage ---"
          cat data/backtests/qb_free_vegas_benchmark/summary/m60b_market_coverage.csv 2>/dev/null || true
          echo "--- football + market metrics ---"
          cat data/backtests/qb_free_vegas_benchmark/summary/m60b_football_and_market_metrics.csv 2>/dev/null || true
          echo "--- edge thresholds ---"
          cat data/backtests/qb_free_vegas_benchmark/summary/m60b_market_edge_thresholds.csv 2>/dev/null || true
          echo "--- catastrophic vs market ---"
          cat data/backtests/qb_free_vegas_benchmark/summary/m60b_catastrophic_market_diagnostics.csv 2>/dev/null || true

      - name: Upload Migration 60B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-60b-free-qb-vegas-benchmark
          path: |
            data/backtests/qb_free_vegas_benchmark/summary/*.csv
            data/backtests/qb_free_vegas_benchmark/market/*.csv
            data/backtests/qb_free_vegas_benchmark/2024/m60b/*.csv
            data/backtests/qb_free_vegas_benchmark/2025/m60b/*.csv
            data/backtests/qb_free_vegas_benchmark/2024/historical_input_validation.csv
            data/backtests/qb_free_vegas_benchmark/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
