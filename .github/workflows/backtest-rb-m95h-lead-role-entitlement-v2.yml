name: M95H RB Lead-Role Entitlement v2

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-m95h-lead-role-entitlement
    paths:
      - 'scripts/backtest/evaluate_rb_lead_role_entitlement.py'
      - 'scripts/backtest/evaluate_rb_lead_role_entitlement_v2.py'
      - '.github/workflows/backtest-rb-m95h-lead-role-entitlement-v2.yml'

env:
  PYTHONPATH: ${{ github.workspace }}
  M95F_RUN_ID: '33389924330'
  M95B_RUN_ID: '33357785600'

jobs:
  rb-lead-role-entitlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2 pyarrow==17.0.0 nflreadpy

      - name: Download frozen research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m95f_frozen data/backtests/rb_m95b_frozen
          gh run download "$M95F_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95f-rb-workload-regime-calibration --dir data/backtests/rb_m95f_frozen
          gh run download "$M95B_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95b-rb-offense-defense-matchup --dir data/backtests/rb_m95b_frozen
          test -s data/backtests/rb_m95f_frozen/m95f_2024_temporal_oof_scores.csv
          test -s data/backtests/rb_m95f_frozen/m95f_2024_holdout_trace.csv
          test -s data/backtests/rb_m95f_frozen/m95f_2025_rb_trace.csv
          test -s data/backtests/rb_m95b_frozen/m95b_rb_matchup_trace.csv

      - name: Run M95H recipient-specific entitlement experiment
        run: |
          python -m py_compile scripts/backtest/evaluate_rb_role_availability.py
          python -m py_compile scripts/backtest/evaluate_rb_role_availability_v4.py
          python -m py_compile scripts/backtest/evaluate_rb_role_availability_v5.py
          python -m py_compile scripts/backtest/evaluate_rb_lead_role_entitlement.py
          python -m py_compile scripts/backtest/evaluate_rb_lead_role_entitlement_v2.py
          python scripts/backtest/evaluate_rb_lead_role_entitlement_v2.py \
            --m95f-root data/backtests/rb_m95f_frozen \
            --m95b-root data/backtests/rb_m95b_frozen \
            --out-dir data/backtests/rb_m95h

      - name: Show M95H headline results
        if: always()
        run: |
          echo '=== M95H disposition ==='
          cat data/backtests/rb_m95h/m95h_disposition.csv 2>/dev/null || true
          echo '=== M95H selected architecture ==='
          cat data/backtests/rb_m95h/m95h_selected_architecture.csv 2>/dev/null || true
          echo '=== M95H team recipient audit ==='
          cat data/backtests/rb_m95h/m95h_team_recipient_audit.csv 2>/dev/null || true
          echo '=== M95H 2025 metrics ==='
          cat data/backtests/rb_m95h/m95h_2025_metrics.csv 2>/dev/null || true
          echo '=== M95H source audit ==='
          cat data/backtests/rb_m95h/m95h_source_audit.csv 2>/dev/null || true

      - name: Upload M95H artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-95h-rb-lead-role-entitlement-v2
          path: data/backtests/rb_m95h/**
          if-no-files-found: warn
          retention-days: 30
