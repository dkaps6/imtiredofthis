name: QB Team Pass Opportunity Schedule Rest D1

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-team-pass-opportunity-schedule-rest-d1
    paths:
      - ".github/workflows/backtest-qb-team-pass-opportunity-schedule-rest-d1.yml"
      - "scripts/backtest/evaluate_qb_team_pass_opportunity_schedule_rest_d1.py"
      - "docs/migrations/QB_TEAM_PASS_OPPORTUNITY_SCHEDULE_REST_D1_PLAN.md"

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==1.5.3 scipy==1.11.4 scikit-learn==1.4.2
      - name: Compile frozen evaluator
        run: python -m py_compile scripts/backtest/evaluate_qb_team_pass_opportunity_schedule_rest_d1.py
      - name: Download immutable parent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/chain evidence/source
          gh run download 34523313743 --repo "${GITHUB_REPOSITORY}" --name qb-opportunity-chain-decomposition-v1 --dir evidence/chain
          gh run download 34533408818 --repo "${GITHUB_REPOSITORY}" --name qb-team-pass-opportunity-source-audit-v1 --dir evidence/source
      - name: Run frozen 2024 development screen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/qb_team_pass_opportunity_schedule_rest_d1
          python scripts/backtest/evaluate_qb_team_pass_opportunity_schedule_rest_d1.py \
            --chain-root evidence/chain \
            --source-root evidence/source \
            --out-dir data/backtests/qb_team_pass_opportunity_schedule_rest_d1
      - name: Show result
        if: always()
        run: cat data/backtests/qb_team_pass_opportunity_schedule_rest_d1/schedule_rest_d1_result.json 2>/dev/null || true
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-team-pass-opportunity-schedule-rest-d1
          path: |
            data/backtests/qb_team_pass_opportunity_schedule_rest_d1/*
            docs/migrations/QB_TEAM_PASS_OPPORTUNITY_SCHEDULE_REST_D1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
