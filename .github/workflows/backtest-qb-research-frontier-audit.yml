name: Migration 66 QB Research Frontier Audit

on:
  workflow_dispatch:
    inputs:
      iterations: {description: "MC iterations", required: false, default: "2000"}
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'backtest-migration-66-qb-research-frontier-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn scipy joblib pyarrow

      - name: Declare Migration 66 frozen scope
        run: |
          echo "M66 is a research-frontier audit, not a new QB football model."
          echo "2024/2025 are the only scored target seasons. 2023/2022 are NOT rescored."
          echo "No sportsbook player-prop line is a feature."
          echo "Candidate library is frozen to the paired canonical M59/M64/M65 projections declared in audit_qb_research_frontier.py."
          echo "Model-diversity diagnostic: materially diverse if median absolute pairwise residual correlation <= .85."
          echo "Oracle best-of-library is hindsight diagnostic only; >=8 yards MAE headroom is called large headroom but cannot be deployed."
          echo "Learned ensembles fit 2024 only and evaluate 2025 only. No post-hoc subset search."
          echo "Ensemble follow-up requires 2025 MAE gain >=1.0 yard, corr gain >=.03, RMSE non-worse, and 100+ misses reduced >=5% vs Raw."
          echo "Residual-information signal requires 2025 residual corr >=.20, corrected MAE gain >=1.0 yard, and corrected corr gain >=.03 vs Raw."
          echo "Mean-vs-median signal requires Raw simulation median to improve 2025 MAE by >=.50 yard versus Raw simulation mean."
          echo "No M66 result directly promotes production logic; it selects the next research phase."

      - name: Compile M66 modules
        run: |
          python -m py_compile scripts/backtest/audit_qb_research_frontier.py
          python -m py_compile scripts/backtest/audit_qb_research_frontier_fixed.py
          python -m py_compile scripts/backtest/audit_qb_mc_mean_median.py

      - name: Build paired M59-M65 canonical library
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"

          run_season () {
            SEASON="$1"; PRIOR="$2"; D="data/backtests/qb_research_frontier/${SEASON}"
            python scripts/backtest/build_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" --audit "$D/historical_defense_enrichment_audit.csv" --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/historical_player_logs.py --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries_optional.py --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

            python scripts/backtest/decompose_qb_passing_error.py --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_passing_error"
            python scripts/backtest/decompose_qb_participation_role.py --trace "$D/qb_passing_error/qb_passing_player_trace.csv" --player-logs "$D/player_game_logs_history.csv" --out-dir "$D/qb_participation_role"
            python scripts/backtest/audit_qb_gamescript_market_signals.py --season "$SEASON" --participation-trace "$D/qb_participation_role/qb_participation_player_trace.csv" --out-dir "$D/qb_gamescript_market"
            python scripts/backtest/fit_qb_joint_attempts_ypa_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_joint_attempts_ypa"
            python scripts/backtest/fit_qb_both_raw_walkforward.py --season "$SEASON" --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" --team-weekly "$D/team_weekly_history.csv" --player-logs "$D/player_game_logs_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/qb_both_raw"

            python scripts/backtest/diagnose_qb_raw_tail_attribution_mc.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --iterations "$ITERATIONS" \
              --joint-trace "$D/qb_joint_attempts_ypa/qb_joint_attempts_ypa_trace.csv" \
              --raw-trace "$D/qb_both_raw/qb_both_raw_walkforward_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" --team-weekly "$D/team_weekly_history.csv" \
              --schedule "$D/schedule_history.csv" --universe-dir "$D/pregame_universe" \
              --injuries "$D/injuries_history.csv" --weather "$D/weather_history.csv" --out-dir "$D/m59"

            python scripts/backtest/audit_qb_extreme_error_regimes.py \
              --season "$SEASON" \
              --game-attribution "$D/m59/m59_game_attribution_${SEASON}.csv" \
              --market-trace "$D/qb_gamescript_market/qb_gamescript_market_trace.csv" \
              --player-logs "$D/player_game_logs_history.csv" \
              --out-dir "$D/m62"
          }

          run_season 2024 2023
          run_season 2025 2024

          python scripts/backtest/validate_qb_possession_dropback_generative_fixed.py \
            --season-file data/backtests/qb_research_frontier/2024/m62/m62_enriched_games_2024.csv \
            --season-file data/backtests/qb_research_frontier/2025/m62/m62_enriched_games_2025.csv \
            --player-logs data/backtests/qb_research_frontier/2024/player_game_logs_history.csv \
            --player-logs data/backtests/qb_research_frontier/2025/player_game_logs_history.csv \
            --out-dir data/backtests/qb_research_frontier/m64_summary

          python scripts/backtest/validate_qb_dropback_state_occupancy.py \
            --m64-game-level data/backtests/qb_research_frontier/m64_summary/m64_game_level.csv \
            --out-dir data/backtests/qb_research_frontier/m65_summary

      - name: Replay QB Monte Carlo mean versus median
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          set -euo pipefail
          ITERATIONS="${{ inputs.iterations || '2000' }}"
          WEEKS="1-18"
          MASTER="data/backtests/qb_research_frontier/m65_summary/m65_game_level.csv"

          python scripts/backtest/audit_qb_mc_mean_median.py \
            --season 2024 --prior-season 2023 --weeks "$WEEKS" --iterations "$ITERATIONS" \
            --master-game-level "$MASTER" \
            --player-logs data/backtests/qb_research_frontier/2024/player_game_logs_history.csv \
            --team-weekly data/backtests/qb_research_frontier/2024/team_weekly_history.csv \
            --schedule data/backtests/qb_research_frontier/2024/schedule_history.csv \
            --universe-dir data/backtests/qb_research_frontier/2024/pregame_universe \
            --injuries data/backtests/qb_research_frontier/2024/injuries_history.csv \
            --weather data/backtests/qb_research_frontier/2024/weather_history.csv \
            --out data/backtests/qb_research_frontier/m66_mean_median_2024.csv

          python scripts/backtest/audit_qb_mc_mean_median.py \
            --season 2025 --prior-season 2024 --weeks "$WEEKS" --iterations "$ITERATIONS" \
            --master-game-level "$MASTER" \
            --player-logs data/backtests/qb_research_frontier/2025/player_game_logs_history.csv \
            --team-weekly data/backtests/qb_research_frontier/2025/team_weekly_history.csv \
            --schedule data/backtests/qb_research_frontier/2025/schedule_history.csv \
            --universe-dir data/backtests/qb_research_frontier/2025/pregame_universe \
            --injuries data/backtests/qb_research_frontier/2025/injuries_history.csv \
            --weather data/backtests/qb_research_frontier/2025/weather_history.csv \
            --out data/backtests/qb_research_frontier/m66_mean_median_2025.csv

      - name: Run Migration 66 frontier audit
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python scripts/backtest/audit_qb_research_frontier_fixed.py \
            --m65-game-level data/backtests/qb_research_frontier/m65_summary/m65_game_level.csv \
            --m65-state-features data/backtests/qb_research_frontier/m65_summary/m65_state_training_features.csv \
            --mean-median-file data/backtests/qb_research_frontier/m66_mean_median_2024.csv \
            --mean-median-file data/backtests/qb_research_frontier/m66_mean_median_2025.csv \
            --out-dir data/backtests/qb_research_frontier/m66_summary

      - name: Show Migration 66 results
        if: always()
        run: |
          echo '--- M66 interpretation ---'
          cat data/backtests/qb_research_frontier/m66_summary/m66_precommitted_interpretation.csv 2>/dev/null || true
          echo '--- candidate library ---'
          cat data/backtests/qb_research_frontier/m66_summary/m66_candidate_library_metrics.csv 2>/dev/null || true
          echo '--- oracle library ---'
          cat data/backtests/qb_research_frontier/m66_summary/m66_oracle_library_summary.csv 2>/dev/null || true
          echo '--- ensembles ---'
          cat data/backtests/qb_research_frontier/m66_summary/m66_ensemble_metrics.csv 2>/dev/null || true
          echo '--- residual predictability ---'
          cat data/backtests/qb_research_frontier/m66_summary/m66_residual_predictability.csv 2>/dev/null || true
          echo '--- mean vs median ---'
          cat data/backtests/qb_research_frontier/m66_summary/m66_mean_median_metrics.csv 2>/dev/null || true

      - name: Upload Migration 66 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-66-qb-research-frontier-audit
          path: |
            data/backtests/qb_research_frontier/m66_summary/*.csv
            data/backtests/qb_research_frontier/m66_mean_median_*.csv
            data/backtests/qb_research_frontier/m65_summary/*.csv
            data/backtests/qb_research_frontier/m64_summary/*.csv
            data/backtests/qb_research_frontier/2024/historical_input_validation.csv
            data/backtests/qb_research_frontier/2025/historical_input_validation.csv
          if-no-files-found: warn
          retention-days: 14
