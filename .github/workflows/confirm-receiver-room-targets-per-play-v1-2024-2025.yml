name: Confirm Receiver Room Targets Per Play V1 2024-2025

on:
  push:
    branches: [research-receiver-room-targets-per-play-v1-confirm-2024-2025]
    paths:
      - 'docs/research/RECEIVER_ROOM_TARGETS_PER_PLAY_V1_2024_2025_CONFIRMATION_PLAN.md'
      - 'scripts/research/confirm_receiver_room_targets_per_play_v1_2024_2025.py'
      - '.github/workflows/confirm-receiver-room-targets-per-play-v1-2024-2025.yml'
  workflow_dispatch:

concurrency:
  group: confirm-receiver-room-targets-per-play-v1-2024-2025
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyarrow scikit-learn joblib pyyaml

      - name: Compile frozen confirmation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/confirm_receiver_room_targets_per_play_v1_2024_2025.py

      - name: Create workspace
        run: |
          rm -rf /tmp/room_confirm /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model
          mkdir -p /tmp/room_confirm /tmp/hist_2024 /tmp/hist_2025 /tmp/wr_model /tmp/te_model

      - name: Download WR-R15 fold-safe authority
        uses: actions/download-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: /tmp/wr_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34238301577

      - name: Download TE-R5P fold-safe authority
        uses: actions/download-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: /tmp/te_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34152797603

      - name: Verify specialist authorities
        run: |
          test -s /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          test -s /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv

      - name: Build independent 2024 and 2025 historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir /tmp/hist_2025

      - name: Combine historical schedule and team observations
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/room_confirm')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined rows in {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build historical player targets and pregame context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024,2025 --schedule /tmp/room_confirm/schedule_history.csv --out /tmp/room_confirm/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024,2025 --out /tmp/room_confirm/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule /tmp/room_confirm/schedule_history.csv --out /tmp/room_confirm/weather_history.csv

      - name: Run frozen 2024-2025 confirmation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/room_confirm/result
          python scripts/research/confirm_receiver_room_targets_per_play_v1_2024_2025.py \
            --player-logs /tmp/room_confirm/player_game_logs_history.csv \
            --team-weekly /tmp/room_confirm/team_weekly_history.csv \
            --schedule /tmp/room_confirm/schedule_history.csv \
            --universe-2024 /tmp/hist_2024/pregame_universe \
            --universe-2025 /tmp/hist_2025/pregame_universe \
            --injuries /tmp/room_confirm/injuries_history.csv \
            --weather /tmp/room_confirm/weather_history.csv \
            --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv \
            --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv \
            --weeks '1-18' \
            --out-dir /tmp/room_confirm/result
          cat /tmp/room_confirm/result/RESULT.md

      - name: Upload confirmation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-room-targets-per-play-v1-2024-2025
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/room_confirm/result/**
