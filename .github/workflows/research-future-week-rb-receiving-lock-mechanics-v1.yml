name: Research Future-Week RB Receiving Lock Mechanics V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/lock_rb_receiving_room_share_future_week_v1.py'
      - 'tests/test_rb_receiving_room_share_future_week_v1.py'
      - '.github/workflows/research-future-week-rb-receiving-lock-mechanics-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mechanics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pandas==1.5.3 numpy==1.26.4

      - name: Compile and test future-week RB receiving mechanics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/lock_rb_receiving_room_share_future_week_v1.py
          pytest -q tests/test_rb_receiving_room_share_future_week_v1.py

      - name: Certify no Week-6 lock was created
        run: |
          test ! -e /tmp/rb_receiving_room_share_week6_lock.csv
          echo "FUTURE_WEEK_RB_RECEIVING_LOCK_MECHANICS_ONLY_CERTIFIED"

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict
