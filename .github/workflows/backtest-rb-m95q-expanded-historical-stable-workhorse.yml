name: M95Q RB Expanded Historical Stable Workhorse

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-m95q-expanded-historical-stable-workhorse
    paths:
      - 'scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse.py'
      - 'scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v2.py'
      - 'scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v3.py'
      - 'scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v4.py'
      - '.github/workflows/backtest-rb-m95q-expanded-historical-stable-workhorse.yml'
      - 'docs/migrations/M95Q_PLAN.md'

env:
  PYTHONPATH: ${{ github.workspace }}
  M95G_RUN_ID: '33396339232'
  M91_EXACT_RUN_ID: '33348554748'

jobs:
  build-m91-rotation:
    name: m91-universe-${{ matrix.season }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        season: [2019, 2020, 2021, 2022, 2023, 2024]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install M91 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Rebuild exact M91 temporal rotation
        env:
          SEASON: ${{ matrix.season }}
        run: |
          PRIOR=$((SEASON-1))
          D="data/backtests/rb_m95q/m91/${SEASON}"
          mkdir -p "$D"
          python scripts/backtest/build_historical_inputs.py \
            --season "$SEASON" --prior-season "$PRIOR" --weeks '1-18' --out-dir "$D"
          python scripts/backtest/enrich_historical_defense.py \
            --team-weekly "$D/team_weekly_history.csv" \
            --seasons "$PRIOR,$SEASON" \
            --audit "$D/historical_defense_enrichment_audit.csv" \
            --observations "$D/historical_defense_observations.csv"
          python scripts/backtest/validate_historical_inputs.py \
            --season "$SEASON" --prior-season "$PRIOR" --weeks '1-18' \
            --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py \
            --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history.csv" \
            --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py \
            --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
          python scripts/backtest/build_historical_weather.py \
            --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"
          rm -f "$D/component_predictions.csv"
          python scripts/backtest/walk_forward.py \
            --season "$SEASON" --prior-season "$PRIOR" --weeks '1-18' \
            --player-logs "$D/player_game_logs_history.csv" \
            --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" \
            --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" \
            --weather "$D/weather_history.csv" \
            --out "$D/component_predictions.csv" \
            --iterations 2000
          test -s "$D/component_predictions.csv"

      - name: Upload reconstructed M91 rotation
        uses: actions/upload-artifact@v4
        with:
          name: m95q-m91-${{ matrix.season }}
          path: |
            data/backtests/rb_m95q/m91/${{ matrix.season }}/component_predictions.csv
            data/backtests/rb_m95q/m91/${{ matrix.season }}/historical_input_validation.csv
          if-no-files-found: error
          retention-days: 30

  rb-expanded-historical-stable-workhorse:
    needs: build-m91-rotation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyarrow scikit-learn joblib

      - name: Download reconstructed M91 rotations
        uses: actions/download-artifact@v4
        with:
          pattern: m95q-m91-*
          path: data/backtests/rb_m95q/m91_rebuilt
          merge-multiple: false

      - name: Download authoritative M91 parity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m95q/m91_exact
          gh run download "$M91_EXACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name migration-91-rb-temporal-baseline \
            --dir data/backtests/rb_m95q/m91_exact
          test "$(find data/backtests/rb_m95q/m91_exact -path '*/2024/component_predictions.csv' | wc -l)" -eq 1

      - name: Download authoritative M95G parity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m95q/m95g
          gh run download "$M95G_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name migration-95g-rb-role-availability-v5 \
            --dir data/backtests/rb_m95q/m95g
          test "$(find data/backtests/rb_m95q/m95g -name m95g_2024_holdout_trace.csv | wc -l)" -eq 1

      - name: Download historical nflverse PBP 2018-2024
        run: |
          mkdir -p data/backtests/rb_m95q/pbp
          for season in 2018 2019 2020 2021 2022 2023 2024; do
            f="data/backtests/rb_m95q/pbp/play_by_play_${season}.parquet"
            curl -fL --retry 4 --retry-delay 3 \
              "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${season}.parquet" \
              -o "$f"
            test -s "$f"
          done

      - name: Download historical advanced rushing sources
        run: |
          mkdir -p data/backtests/rb_m95q/pfr data/backtests/rb_m95q/ngs
          for season in 2018 2019 2020 2021 2022 2023 2024; do
            f="data/backtests/rb_m95q/pfr/advstats_week_rush_${season}.csv"
            if ! curl -fL --retry 2 --retry-delay 2 \
              "https://github.com/nflverse/nflverse-data/releases/download/pfr_advstats/advstats_week_rush_${season}.csv" \
              -o "$f"; then
              rm -f "$f"
              echo "PFR weekly rushing unavailable for $season; source degradation will be audited"
            fi
          done
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/nflverse/nflverse-data/releases/download/nextgen_stats/ngs_rushing.parquet" \
            -o data/backtests/rb_m95q/ngs/ngs_rushing.parquet
          python - <<'PY'
          import pandas as pd
          pd.read_parquet('data/backtests/rb_m95q/ngs/ngs_rushing.parquet').to_csv(
              'data/backtests/rb_m95q/ngs/ngs_rushing.csv', index=False)
          PY
          test -s data/backtests/rb_m95q/ngs/ngs_rushing.csv

      - name: Run M95Q exact completed-universe reconstruction
        run: |
          python -m py_compile \
            scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse.py \
            scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v2.py \
            scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v3.py \
            scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v4.py
          python scripts/backtest/evaluate_rb_m95q_expanded_historical_stable_workhorse_v4.py \
            --pbp-root data/backtests/rb_m95q/pbp \
            --pfr-root data/backtests/rb_m95q/pfr \
            --ngs-file data/backtests/rb_m95q/ngs/ngs_rushing.csv \
            --m95g-root data/backtests/rb_m95q/m95g \
            --m91-root data/backtests/rb_m95q/m91_rebuilt \
            --m91-exact-root data/backtests/rb_m95q/m91_exact \
            --out-dir data/backtests/rb_m95q/results

      - name: Show M95Q headline results
        if: always()
        run: |
          echo '=== M95Q M91 universe parity ==='
          cat data/backtests/rb_m95q/results/m95q_2024_m91_universe_parity.csv 2>/dev/null || true
          echo '=== M95Q downstream 2024 parity ==='
          cat data/backtests/rb_m95q/results/m95q_2024_parity_audit.csv 2>/dev/null || true
          echo '=== M95Q stable summary ==='
          cat data/backtests/rb_m95q/results/m95q_stable_workhorse_summary.csv 2>/dev/null || true
          echo '=== M95Q comparability ==='
          cat data/backtests/rb_m95q/results/m95q_historical_comparability.csv 2>/dev/null || true
          echo '=== M95Q disposition ==='
          cat data/backtests/rb_m95q/results/m95q_disposition.csv 2>/dev/null || true

      - name: Upload M95Q artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-95q-rb-expanded-historical-stable-workhorse
          path: data/backtests/rb_m95q/results/**
          if-no-files-found: warn
          retention-days: 30
