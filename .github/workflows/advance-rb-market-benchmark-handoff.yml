name: RB Market Benchmark Advance Handoff

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-market-benchmark
    paths:
      - 'scripts/backtest/advance_rb_market_benchmark_handoff.py'
      - '.github/workflows/advance-rb-market-benchmark-handoff.yml'

permissions:
  contents: write

jobs:
  advance-handoff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update canonical research handoff
        run: python scripts/backtest/advance_rb_market_benchmark_handoff.py

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes required.'
            exit 0
          fi
          git commit -m 'RB market benchmark: advance canonical handoff to RB-ND1'
          git push origin HEAD:research-rb-market-benchmark
