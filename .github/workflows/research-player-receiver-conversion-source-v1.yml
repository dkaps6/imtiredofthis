name: Research Player Receiver Conversion Source Audit V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PLAYER_RECEIVER_CONVERSION_STATE_V1_SOURCE_ANTIRETEST.md'
      - 'scripts/research/audit_player_receiver_conversion_source_v1.py'
      - '.github/workflows/research-player-receiver-conversion-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy 'pyarrow==18.1.0' pyyaml

      - name: Compile source audit
        run: python -m py_compile scripts/research/audit_player_receiver_conversion_source_v1.py

      - name: Run frozen receiver-conversion source audit
        run: |
          rm -rf /tmp/player-receiver-conversion-source-v1
          python scripts/research/audit_player_receiver_conversion_source_v1.py \
            --out-dir /tmp/player-receiver-conversion-source-v1

      - name: Certify source-audit boundaries
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/player-receiver-conversion-source-v1/player_receiver_conversion_source_result.json'))
          assert p['version']=='PLAYER_RECEIVER_CONVERSION_STATE_SOURCE_AUDIT_V1',p
          assert p['seasons']==[2023,2024,2025],p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['predictive_models_fit']==0,p
          assert p['candidate_mean_changes']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PLAYER_RECEIVER_CONVERSION_SOURCE_READY',
              'PLAYER_RECEIVER_CONVERSION_SOURCE_BLOCKED',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-receiver-conversion-source-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/player-receiver-conversion-source-v1/**
