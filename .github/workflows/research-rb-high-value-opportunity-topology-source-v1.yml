name: Research RB High Value Opportunity Topology Source Audit V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/RB_HIGH_VALUE_OPPORTUNITY_TOPOLOGY_V1_SOURCE_AUDIT.md"
      - "scripts/research/audit_rb_high_value_opportunity_topology_v1.py"
      - "tests/test_rb_high_value_opportunity_topology_v1.py"
      - ".github/workflows/research-rb-high-value-opportunity-topology-source-v1.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow nflreadpy

      - name: Run frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_rb_high_value_opportunity_topology_v1.py
          pytest -q tests/test_rb_high_value_opportunity_topology_v1.py

      - name: Run frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/rb_high_value_topology
          mkdir -p /tmp/rb_high_value_topology
          python scripts/research/audit_rb_high_value_opportunity_topology_v1.py             --out-dir /tmp/rb_high_value_topology

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rb_high_value_topology/rb_high_value_opportunity_topology_source_result.json'))
          assert p['version']=='RB_HIGH_VALUE_OPPORTUNITY_TOPOLOGY_V1_SOURCE_AUDIT',p
          assert p['disposition'] in {
            'RB_HIGH_VALUE_OPPORTUNITY_TOPOLOGY_SOURCE_READY',
            'RB_HIGH_VALUE_OPPORTUNITY_TOPOLOGY_SOURCE_BLOCKED',
          },p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['predictive_models_fit']==0,p
          assert p['projection_values_changed']==0,p
          assert p['production_changed'] is False,p
          print('RB_HIGH_VALUE_OPPORTUNITY_TOPOLOGY_SOURCE_BOUNDARY_PASS')
          PY

      - name: Show result
        if: always()
        run: |
          cat /tmp/rb_high_value_topology/rb_high_value_opportunity_topology_source_result.json 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-high-value-opportunity-topology-source-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/rb_high_value_topology/**
            docs/research/RB_HIGH_VALUE_OPPORTUNITY_TOPOLOGY_V1_SOURCE_AUDIT.md
