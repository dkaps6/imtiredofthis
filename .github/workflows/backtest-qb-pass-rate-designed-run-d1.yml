name: QB Pass Rate Designed Run D1

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-pass-rate-designed-run-d1
    paths:
      - ".github/workflows/backtest-qb-pass-rate-designed-run-d1.yml"
      - "scripts/backtest/evaluate_qb_pass_rate_designed_run_d1.py"
      - "docs/migrations/QB_PASS_RATE_DESIGNED_RUN_D1_PLAN.md"

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==1.5.3 scipy==1.11.4
      - name: Compile frozen evaluator
        run: python -m py_compile scripts/backtest/evaluate_qb_pass_rate_designed_run_d1.py
      - name: Download immutable parent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/play evidence/chain evidence/source evidence/shared
          gh run download 34535405829 --repo "${GITHUB_REPOSITORY}" --name qb-team-pass-opportunity-play-rate-decomp-v1 --dir evidence/play
          gh run download 34523313743 --repo "${GITHUB_REPOSITORY}" --name qb-opportunity-chain-decomposition-v1 --dir evidence/chain
          gh run download 34537717639 --repo "${GITHUB_REPOSITORY}" --name qb-pass-rate-designed-run-source-v1 --dir evidence/source
          gh run download 34066549394 --repo "${GITHUB_REPOSITORY}" --name qb-wr-shared-pass-volume-mechanism --dir evidence/shared
      - name: Run frozen 2024 development screen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/qb_pass_rate_designed_run_d1
          python scripts/backtest/evaluate_qb_pass_rate_designed_run_d1.py \
            --play-root evidence/play \
            --chain-root evidence/chain \
            --source-root evidence/source \
            --shared-root evidence/shared \
            --out-dir data/backtests/qb_pass_rate_designed_run_d1
      - name: Show result
        if: always()
        run: cat data/backtests/qb_pass_rate_designed_run_d1/qb_designed_run_d1_result.json 2>/dev/null || true
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-pass-rate-designed-run-d1
          path: |
            data/backtests/qb_pass_rate_designed_run_d1/*
            docs/migrations/QB_PASS_RATE_DESIGNED_RUN_D1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
