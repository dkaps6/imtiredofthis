name: WR-R4 Individual Mechanism Decomposition
on:
  push:
    branches: [research-wr-r4-individual-mechanism-decomposition]
    paths:
      - 'scripts/backtest/evaluate_wr_r4_individual_mechanism_decomposition.py'
      - 'docs/migrations/WR_R4_INDIVIDUAL_MECHANISM_DECOMPOSITION_PLAN.md'
      - '.github/workflows/backtest-wr-r4-individual-mechanism-decomposition.yml'
permissions: {contents: read, actions: read}
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m py_compile scripts/backtest/evaluate_wr_r4_individual_mechanism_decomposition.py
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p evidence/wr_r1
          gh run download 34058453941 --repo "${GITHUB_REPOSITORY}" --name wr-r1-multiseason-2020-2025 --dir evidence/wr_r1
      - run: python scripts/backtest/evaluate_wr_r4_individual_mechanism_decomposition.py --wr-r1-root evidence/wr_r1 --out-dir data/backtests/wr_r4_individual_mechanism_decomposition
      - run: cat data/backtests/wr_r4_individual_mechanism_decomposition/wr_r4_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: wr-r4-individual-mechanism-decomposition
          path: |
            data/backtests/wr_r4_individual_mechanism_decomposition/*
            docs/migrations/WR_R4_INDIVIDUAL_MECHANISM_DECOMPOSITION_PLAN.md
