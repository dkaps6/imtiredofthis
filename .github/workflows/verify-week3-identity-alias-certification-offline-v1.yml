name: Verify Week3 Identity Alias Certification Offline V1

on:
  push:
    branches:
      - fix-player-identity-post-registry-alias-v1
    paths:
      - '.github/workflows/verify-week3-identity-alias-certification-offline-v1.yml'
      - 'scripts/run_player_form_v2_loader.py'
      - 'config/player_identity_current_aliases_v1.csv'
      - 'tests/test_player_identity_post_registry_alias_v1.py'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  PRIOR_SEASON: "2025"
  SLATE_DATE: "2026-09-27"
  FETCH_LIVE_ODDS: "false"
  ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest
      - name: Restore successful paid Week-3 artifact without OddsAPI
        uses: actions/download-artifact@v4
        with:
          name: run_36293274478
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36293274478
      - name: Restore paid snapshot and branch identity configuration
        run: |
          set -euo pipefail
          test -d replay_source/data
          test -d replay_source/outputs
          rm -rf data outputs
          mkdir -p data outputs
          cp -a replay_source/data/. data/
          cp -a replay_source/outputs/. outputs/
          git show HEAD:data/player_identity_aliases.csv > data/player_identity_aliases.csv
          mkdir -p config
git show HEAD:config/player_identity_current_aliases_v1.csv > config/player_identity_current_aliases_v1.csv
          git show HEAD:data/manual_name_overrides.csv > data/manual_name_overrides.csv
          git show HEAD:data/manual_prop_quarantine.csv > data/manual_prop_quarantine.csv
          echo "OFFLINE SNAPSHOT ONLY: no OddsAPI fetch"
      - name: Rebuild PlayerForm identity on exact Week-3 football snapshot
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}" ACTIVE_ROLES_CSV=data/roles_current_production_eligible_v1.csv
          python scripts/run_player_form_current_roles_v1.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}" --date "${SLATE_DATE}"
          python scripts/enrich_player_scoring_v2.py --season "${SEASON}" --prior-season "${PRIOR_SEASON}" --date "${SLATE_DATE}"
          python scripts/validate_player_identity_semantics_v1.py
          python - <<'PY'
          import json,pandas as pd
          pf=pd.read_csv('data/player_form.csv',low_memory=False)
          expected={
              'Joshua Palmer':'gsis:00-0036988',
              'Matt Hibner':'gsis:00-0040879',
          }
          for player,identity in expected.items():
              rows=pf.loc[pf['player'].astype(str).eq(player)]
              assert len(rows)==1,(player,len(rows))
              assert str(rows.iloc[0]['player_identity_key'])==identity,(player,rows.iloc[0]['player_identity_key'])
          s=json.load(open('data/player_identity_semantic_audit.json',encoding='utf-8'))
          assert int(s['temporary_possible_historical_aliases'])==0,s
          print('IDENTITY_ALIAS_SEMANTIC_PASS',s)
          PY
      - name: Reclassify exact paid artifact data quality
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/validate_full_slate_data_quality_v1.py
          python - <<'PY'
          import json
          s=json.load(open('data/full_slate_data_quality_audit.json',encoding='utf-8'))
          assert int(s['certification_blockers'])==0,s
          assert s['disposition'] in {
              'FULL_SLATE_DATA_QUALITY_PASS_WITH_DECLARED_LIMITATIONS',
              'FULL_SLATE_DATA_QUALITY_CERTIFIED',
          },s
          print('WEEK3_PAID_SNAPSHOT_IDENTITY_CERTIFICATION_BLOCKER_CLOSED',s['disposition'])
          PY
      - name: Upload identity certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week3_identity_alias_verify_${{ github.run_id }}
          path: |
            data/player_form.csv
            data/player_identity_semantic_audit.csv
            data/player_identity_semantic_audit.json
            data/full_slate_data_quality_audit.csv
            data/full_slate_data_quality_audit.json
            data/player_identity_roster_history_audit.json
          if-no-files-found: warn
          retention-days: 7
