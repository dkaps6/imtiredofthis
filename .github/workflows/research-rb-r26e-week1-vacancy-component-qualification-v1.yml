name: RB R26E Week 1 Vacancy Component Qualification V1

on:
  push:
    branches:
      - research-rb-r26e-week1-vacancy-component-qualification-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PRODUCTION_BASE_SHA: f8417f55b04ce0e19baf260e9d532765034c47f1
  R26_RUN_ID: '34356222339'
  R26_ARTIFACT_ID: '10106271075'
  R26_ARTIFACT_NAME: rb-r26-vacancy-gated-r9-retrospective-v1
  R26_DIGEST: sha256:607fca6e11c301ecb2a3bf74e3dfea8ae415bb33cf3c150a6d89eaedada2809e

jobs:
  qualify-week1-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4

      - name: Verify frozen plan and protected production boundary
        run: |
          set -euo pipefail
          test -s docs/research/RB_R26E_WEEK1_VACANCY_COMPONENT_QUALIFICATION_V1_FROZEN_PLAN.md
          test -s docs/research/RESEARCH_COMPONENT_PRESERVATION_DOCTRINE.md
          test -s docs/research/RB_R26D_EXIT_SIGNIFICANCE_EFFECT_ATLAS_V1_RESULT.md
          test -s scripts/backtest/finalize_rb_r26e_week1_vacancy_component_v1.py
          python -m py_compile scripts/backtest/finalize_rb_r26e_week1_vacancy_component_v1.py
          sha256sum docs/research/RB_R26E_WEEK1_VACANCY_COMPONENT_QUALIFICATION_V1_FROZEN_PLAN.md | tee r26e_plan.sha256
          sha256sum scripts/backtest/finalize_rb_r26e_week1_vacancy_component_v1.py | tee r26e_code.sha256
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml \
            .github/workflows/production-week1-v4-r22-certification.yml
          echo 'R26E_PROTECTED_PRODUCTION_BOUNDARY_PASS'

      - name: Verify and download immutable R26 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26_ARTIFACT_ID}" --jq '.digest')"
          test "$META" = "$R26_DIGEST"
          rm -rf parent_r26
          mkdir -p parent_r26
          gh run download "$R26_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26_ARTIFACT_NAME" --dir parent_r26
          test "$(find parent_r26 -name r26_predictions.csv -type f | wc -l)" -eq 6
          test "$(find parent_r26 -name r26_structural_audit.csv -type f | wc -l)" -eq 6
          test "$(find parent_r26 -name r26_fit_metadata.json -type f | wc -l)" -eq 6
          test -s parent_r26/data/backtests/r26_vacancy_gated_r9_final/r26_final_disposition.json
          python - <<'PY'
          import json
          d=json.load(open('parent_r26/data/backtests/r26_vacancy_gated_r9_final/r26_final_disposition.json'))
          assert d['disposition'] == 'RETROSPECTIVE_MIXED_OR_FAIL_NO_SHADOW'
          assert d['prospective_2026_shadow_authorized'] is False
          PY
          echo "R26E_IMMUTABLE_PARENT_PASS digest=$META"

      - name: Execute frozen Week 1 qualification
        run: |
          set -euo pipefail
          rm -rf data/backtests/r26e_week1_vacancy_component_qualification_v1
          python scripts/backtest/finalize_rb_r26e_week1_vacancy_component_v1.py \
            --r26-root parent_r26 \
            --out-dir data/backtests/r26e_week1_vacancy_component_qualification_v1

      - name: Assert qualification integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/backtests/r26e_week1_vacancy_component_qualification_v1/r26e_week1_disposition.json').read_text())
          i=d['integrity']
          assert d['parent_full_candidate_disposition_unchanged'] == 'RETROSPECTIVE_MIXED_OR_FAIL_NO_SHADOW'
          assert i['r26_predictions_regenerated'] is False
          assert i['r9_refit'] is False
          assert i['sportsbook_inputs_used'] == 0
          assert i['future_outcomes_used_in_features'] == 0
          assert i['production_parameters_changed'] is False
          assert i['max_receiving_yard_mean_delta'] == 0.0
          assert i['max_r22_authority_delta'] == 0.0
          assert d['production_promotion_authorized'] is False
          assert d['all_season_use_authorized'] is False
          assert d['disposition'] in {
              'WEEK1_COMPONENT_RETROSPECTIVE_SUPPORT_FOR_2026_PROSPECTIVE_SHADOW',
              'WEEK1_COMPONENT_MIXED_OR_FAIL_NO_SHADOW',
              'WEEK1_COMPONENT_INTEGRITY_FAILURE',
          }
          print('R26E_QUALIFICATION_INTEGRITY_PASS disposition=' + d['disposition'])
          PY

      - name: Show R26E qualification
        run: |
          cat data/backtests/r26e_week1_vacancy_component_qualification_v1/r26e_week1_disposition.json
          echo '=== season-by-season Week 1 ==='
          cat data/backtests/r26e_week1_vacancy_component_qualification_v1/r26e_week1_season_metrics.csv

      - name: Upload R26E qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r26e-week1-vacancy-component-qualification-v1
          retention-days: 90
          path: |
            r26e_plan.sha256
            r26e_code.sha256
            data/backtests/r26e_week1_vacancy_component_qualification_v1/*
