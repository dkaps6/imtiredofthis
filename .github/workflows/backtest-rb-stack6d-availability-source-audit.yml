name: RB-STACK6D Availability Source Audit

# Frozen protocol: docs/migrations/RB_STACK6D_AVAILABILITY_SOURCE_AUDIT_PLAN.md
on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6d-availability-source-audit
    paths:
      - 'scripts/backtest/audit_rb_stack6d_availability_source.py'
      - 'docs/migrations/RB_STACK6D_AVAILABILITY_SOURCE_AUDIT_PLAN.md'
      - '.github/workflows/backtest-rb-stack6d-availability-source-audit.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  STACK6_RUN_ID: '33549529203'

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen source-audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 pyarrow==17.0.0 nflreadpy

      - name: Compile
        run: python -m py_compile scripts/backtest/audit_rb_stack6d_availability_source.py

      - name: Download frozen P3 population artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6d/stack6
          gh run download "$STACK6_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-model --dir data/backtests/rb_stack6d/stack6
          test -s data/backtests/rb_stack6d/stack6/stack6_2025_casebook.csv

      - name: Run no-fit availability source audit
        run: |
          rm -rf data/backtests/rb_stack6d/results
          python scripts/backtest/audit_rb_stack6d_availability_source.py \
            --seasons 2024,2025 \
            --stack6-root data/backtests/rb_stack6d/stack6 \
            --out-dir data/backtests/rb_stack6d/results

      - name: Show results
        if: always()
        run: |
          echo '=== source audit ==='
          cat data/backtests/rb_stack6d/results/stack6d_availability_source_audit.csv 2>/dev/null || true
          echo '=== gates ==='
          cat data/backtests/rb_stack6d/results/stack6d_availability_source_gates.csv 2>/dev/null || true
          echo '=== roster timing ==='
          cat data/backtests/rb_stack6d/results/stack6d_weekly_roster_timing_columns.csv 2>/dev/null || true
          echo '=== roster semantics ==='
          cat data/backtests/rb_stack6d/results/stack6d_roster_status_semantics.csv 2>/dev/null || true
          echo '=== injury timing ==='
          cat data/backtests/rb_stack6d/results/stack6d_injury_status_timing_semantics.csv 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6d-availability-source-audit
          path: data/backtests/rb_stack6d/results/**
          if-no-files-found: warn
          retention-days: 30
