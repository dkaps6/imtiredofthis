## STACK5 — remaining market-gap reverse engineering

Branch: `research-rb-stack5-market-gap-forensics`
Authoritative:
- run `33540065380`
- job `99963812729`
- tested SHA `c9087faad1bcb4788dc3ea4281bf637ce3b3af99`
- artifact `9813220944`
- SHA256 `e53ef9afa4f103eb9c8368fcc9b7165eeb4fc9abe49952e38f42f9fa85872188`
- no fit; sportsbook downstream only.

P3 versus Vegas on exact 899:
- P3 MAE `24.315798`
- Vegas `23.701891`
- remaining gap `+0.613907`
- P3 closer `48.1646%`

Joint mechanism remains real across all 899:
- opportunity-oracle recovery `7.8845`
- efficiency-oracle recovery `7.9392`
- opportunity-dominant rate `50.95%`

But the **market gap is not evenly distributed**.

### Frozen M95F workload-risk split
Risk rows (428):
- P3 MAE `28.385169`
- Vegas `28.514019`
- **P3 is better by ~0.129** and closer 52.10%.

Non-risk rows (471):
- P3 `20.617941`
- Vegas `19.329087`
- **Vegas better by ~1.289**; P3 closer only 44.59%.

Therefore do **not** spend the next migration retuning high-workload tails to chase the market. The remaining market deficit is concentrated in ordinary/non-risk listed backs.

### Depth hierarchy split
- depth-rank 1: P3 `27.202466`, Vegas `27.039130` — nearly even (`+0.163` gap)
- depth-rank 2: P3 `21.316647`, Vegas `20.365782` — Vegas `+0.951`
- depth-rank 3+: P3 `21.204248`, Vegas `19.660000` — Vegas `+1.544`

This is direct evidence that the remaining edge is disproportionately in secondary/depth backs rather than established lead backs.

### Large disagreements
Model 10+ yards **above** Vegas (135 rows):
- P3 `21.167141`, Vegas `18.811111`, gap `+2.356`
- predicted carries `11.28`, actual `9.63`, mean carry error `+1.65`
- opportunity-oracle recovery `8.5445` versus efficiency recovery `5.7451`
- opportunity dominant `57.78%`

This is the clearest remaining systematic failure: **large false-high projections are primarily opportunity/allocation overestimates.**

Model 10+ **below** Vegas (158 rows):
- P3 `28.093802`, Vegas `27.310127`, gap `+0.784`
- predicted carries `12.16`, actual `14.54`, mean carry error `-2.38`
- opportunity/efficiency mechanism exactly 50/50

False-low misses include workload shocks and giant efficiency/explosive outcomes, but the market edge is less systematic than on the false-high side.

Week 1 is no longer the dominant problem after STACK3: 53 listed W1 rows P3 `23.709666`, Vegas `23.198113`, gap only `.512`.
Rookies are nearly tied: P3 `22.820668`, Vegas `22.807927`.
Injury-report rows still show a `+1.110` Vegas advantage and deserve exact availability-role audit.

Representative false-high opportunity cases include Chuba Hubbard, Rico Dowdle, Miles Sanders, Alvin Kamara, D'Andre Swift, Tank Bigsby, Jacory Croskey-Merritt, Tyjae Spears, Breece Hall and others where predicted carry allocation remained materially above actual despite the new role layer.

## Current retained capability map

- **P3 central point**: retain as current best retrospective development parent.
- **M94C / enriched opportunity**: retain central/team opportunity and high-workload strength; never discard because full stack wins ordinary games.
- **Full stack**: retain efficiency/context and Week-1 initialization strength.
- **Depth/snap/role allocation**: retain; demonstrated incremental allocation improvement but is not yet detailed enough for secondary-back substitution roles.
- **M95F**: retain workload distribution/high-workload state; current risk subset already matches/beats Vegas. Do not force as mean router.
- **M95I**: retain vacancy/transition/tail evidence; no current mean-point role.
- **M95C/ENV1**: environment is real but weakly deterministic; use as conditional context, not matchup-only replacement.
- **M96C E/P**: redundant/non-portable against P3 point.
- **M96C D**: tiny conditional clue only; not retained in current point.
- **M95D X**: rejected isolated tail increment.

## NEXT MIGRATION — RB-STACK6 / ND3 Secondary-Back Role & Substitution State

The next justified football-data family is **secondary-back role/substitution intelligence**, specifically because STACK5 localizes the remaining market deficit to non-risk RB2/RB3 and false-high opportunity overallocation.

Audit/build timestamp-safe pregame features for:

1. prior-game play-level participation and personnel/formation identity;
2. early-down vs third-down vs two-minute participation/usage;
3. short-yardage, red-zone, inside-10 and inside-5 rushing roles;
4. single-RB vs two-RB personnel and substitution/series/drive rotation where reconstructable;
5. exact active/inactive competitor identity and game-day availability if historical timestamp/source integrity qualifies;
6. competitor return/injury state and current usable RB count;
7. coach/team backfield rotation tendencies from prior games;
8. OL availability only if a valid timestamp-safe source can be demonstrated.

Primary target remains **player share of a constrained team RB opportunity pool**, with special evaluation on M95F-nonrisk depth-rank2/3 backs. Do not disturb M95F-risk/lead-back strength without evidence.

Use 2025 only as exposed development evidence. Do not call retrospective gains independent validation. Freeze any promising architecture for prospective 2026 confirmation.

Do not reopen generic M96 router threshold tuning or generic global efficiency searches. If STACK6 fails, use the failure atlas to justify a genuinely different football mechanism/data source.
