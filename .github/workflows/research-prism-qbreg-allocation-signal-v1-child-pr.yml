name: Research PRISM QB Regime Allocation Signal V1 Child PR
on:
  pull_request:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/evaluate_prism_pass_catcher_qb_regime_allocation_signal_v1.py'
      - '.github/workflows/research-prism-qbreg-allocation-signal-v1-child-pr.yml'

permissions:
  contents: read
  actions: read

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy pyyaml 'pyarrow==18.1.0'

      - name: Verify frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12113054267 --jq '.id')" = "12113054267"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12113054267 --jq '.workflow_run.id')" = "39067415356"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12113054267 --jq '.digest')" = "sha256:61b701091bdfcdad32e86d0c6ba2e6a471b773656c95b4fa6179adbbb54214a2"

      - name: Download exact frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/qbreg-signal
          mkdir -p /tmp/qbreg-signal/source /tmp/qbreg-signal/out
          gh run download 39067415356 --repo "${{ github.repository }}"             --name prism-pass-catcher-qb-regime-source-child-pr-39067415356             --dir /tmp/qbreg-signal/source
          STATE="$(find /tmp/qbreg-signal/source -type f -name passcatcher_qb_regime_target_state.csv -print -quit)"
          HIST="$(find /tmp/qbreg-signal/source -type f -name active_passcatcher_completed_game_history.csv -print -quit)"
          test -s "$STATE"
          test -s "$HIST"
          echo "STATE=$STATE" >> "$GITHUB_ENV"
          echo "HIST=$HIST" >> "$GITHUB_ENV"

      - name: Execute frozen predictive allocation test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_prism_pass_catcher_qb_regime_allocation_signal_v1.py
          python scripts/research/evaluate_prism_pass_catcher_qb_regime_allocation_signal_v1.py             --state "$STATE"             --history "$HIST"             --out-dir /tmp/qbreg-signal/out

      - name: Certify frozen boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qbreg-signal/out/qb_regime_allocation_signal_result.json'))
          assert p['version']=='PRISM_PASS_CATCHER_QB_REGIME_ALLOCATION_SIGNAL_V1',p
          assert p['candidate_variants']==1,p
          assert p['fitted_coefficients']==0,p
          assert p['threshold_searches']==0,p
          assert p['development_season']==2024 and p['confirmation_season']==2025,p
          assert p['families']==['WR','TE'],p
          i=p['integrity']
          assert i['chronology_violations']==0,p
          assert i['target_game_outcomes_used_in_predictor']==0,p
          assert i['sportsbook_inputs_used']==0,p
          assert i['oddsapi_calls']==0,p
          assert i['outcomes_2026_used']==0,p
          assert i['receiving_yards_scored'] is False,p
          assert i['market_translation_scored'] is False,p
          assert i['production_changed'] is False,p
          assert p['disposition'] in {
            'PRISM_PASS_CATCHER_QB_REGIME_ALLOCATION_SIGNAL_V1_QUALIFIED_ALL',
            'PRISM_PASS_CATCHER_QB_REGIME_ALLOCATION_SIGNAL_V1_QUALIFIED_PARTIAL',
            'PRISM_PASS_CATCHER_QB_REGIME_ALLOCATION_SIGNAL_V1_CLOSED',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-pass-catcher-qb-regime-allocation-signal-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/qbreg-signal/out/**
