name: RB R21 2026 Prospective Tail Forecast Lock V1

on:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - docs/migrations/RB_R21_2026_PROSPECTIVE_TAIL_FORECAST_LOCK_AND_GRADE_V1_PLAN.md
      - scripts/backtest/lock_rb_r21_2026_prospective_tail_forecasts_v1.py
      - .github/workflows/research-rb-r21-2026-prospective-tail-forecast-lock-v1.yml
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scikit-learn pyyaml scipy

      - name: Download immutable governed 2026 Week-1 full-slate replay
        uses: actions/download-artifact@v4
        with:
          name: paid-full-slate-replay-v1
          path: r21-full-slate-artifact
          github-token: ${{ github.token }}
          repository: dkaps6/imtiredofthis
          run-id: 34243241733

      - name: Download immutable R19 shadow scorer
        uses: actions/download-artifact@v4
        with:
          name: rb-r19-deployable-tail-scorer-refit-v1
          path: r19-artifact
          github-token: ${{ github.token }}
          repository: dkaps6/imtiredofthis
          run-id: 34288244770

      - name: Download immutable R20 shadow evidence
        uses: actions/download-artifact@v4
        with:
          name: rb-r20-real-slate-shadow-integration-v1
          path: r20-artifact
          github-token: ${{ github.token }}
          repository: dkaps6/imtiredofthis
          run-id: 34291433027

      - name: Capture immutable GitHub metadata and current-run timestamp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r21-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34243241733/artifacts?per_page=100" > r21-metadata/governed-replay.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34152868136/artifacts?per_page=100" > r21-metadata/raw-paid.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34288244770/artifacts?per_page=100" > r21-metadata/r19.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34291433027/artifacts?per_page=100" > r21-metadata/r20.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > r21-metadata/current-run.json

      - name: Materialize immutable replay into validator workspace
        run: |
          set -euo pipefail
          test -s r21-full-slate-artifact/data/football_simulation_universe.csv
          test -s r21-full-slate-artifact/data/target_entitlement_v1_trace.csv
          test -s r21-full-slate-artifact/data/certified_full_slate_stack_audit.json
          test -s r21-full-slate-artifact/outputs/paid_full_slate_replay_result.json
          test -s r21-full-slate-artifact/outputs/props_priced_clean.csv
          mkdir -p data outputs
          cp -a r21-full-slate-artifact/data/. data/
          cp -a r21-full-slate-artifact/outputs/. outputs/
          echo 'R21 Phase A uses immutable pre-outcome sources and the unchanged R20 evaluator.'

      - name: Locate immutable R19 files
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$(find r19-artifact -type f -name 'rb_r19_tail_scorer_model_v1.json' -print -quit)"
          POOLS="$(find r19-artifact -type f -name 'rb_r19_residual_pools_v1.npz' -print -quit)"
          test -n "$MODEL"
          test -n "$POOLS"
          test -s "$MODEL"
          test -s "$POOLS"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "pools=$POOLS" >> "$GITHUB_OUTPUT"

      - name: Run frozen R21 pre-outcome forecast lock
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/backtest/lock_rb_r21_2026_prospective_tail_forecasts_v1.py \
            --full-slate-dir r21-full-slate-artifact \
            --r19-model '${{ steps.locate.outputs.model }}' \
            --r19-pools '${{ steps.locate.outputs.pools }}' \
            --replay-artifact-metadata r21-metadata/governed-replay.json \
            --raw-paid-artifact-metadata r21-metadata/raw-paid.json \
            --r19-artifact-metadata r21-metadata/r19.json \
            --r20-artifact-dir r20-artifact \
            --r20-artifact-metadata r21-metadata/r20.json \
            --current-run-metadata r21-metadata/current-run.json \
            --out-dir data/backtests/rb_r21_2026_prospective_tail_forecast_lock_v1

      - name: Show R21 lock result
        if: always()
        run: |
          cat data/backtests/rb_r21_2026_prospective_tail_forecast_lock_v1/rb_r21_forecast_lock_result.json 2>/dev/null || true
          echo '=== ledger head ==='
          head -25 data/backtests/rb_r21_2026_prospective_tail_forecast_lock_v1/rb_r21_forecast_ledger.csv 2>/dev/null || true

      - name: Upload R21 pre-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-r21-week1-prospective-forecast-lock-v1
          path: data/backtests/rb_r21_2026_prospective_tail_forecast_lock_v1/**
          if-no-files-found: warn
          retention-days: 90
