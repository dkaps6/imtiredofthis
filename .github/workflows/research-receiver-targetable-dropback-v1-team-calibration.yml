name: Research Receiver Targetable Dropback V1 Team Calibration

on:
  push:
    branches: [research-receiver-targetable-dropback-v1-calibration]
    paths:
      - 'docs/research/RECEIVER_TARGETABLE_DROPBACK_V1_TEAM_CALIBRATION_PLAN.md'
      - 'scripts/research/evaluate_receiver_targetable_dropback_v1_team_calibration.py'
      - '.github/workflows/research-receiver-targetable-dropback-v1-team-calibration.yml'
  workflow_dispatch:

concurrency:
  group: research-receiver-targetable-dropback-v1-team-calibration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow scikit-learn joblib

      - name: Compile frozen evaluator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_receiver_targetable_dropback_v1_team_calibration.py

      - name: Build 2022 and 2023 leakage-safe historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/targetable /tmp/hist_2022 /tmp/hist_2023
          mkdir -p /tmp/targetable /tmp/hist_2022 /tmp/hist_2023
          python scripts/backtest/build_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --out-dir /tmp/hist_2022
          python scripts/backtest/build_historical_inputs.py --season 2023 --prior-season 2022 --weeks '1-18' --out-dir /tmp/hist_2023

      - name: Combine historical schedule and team observations
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/targetable')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([pd.read_csv('/tmp/hist_2022/'+name),pd.read_csv('/tmp/hist_2023/'+name)],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any(): raise RuntimeError(f'duplicate combined rows in {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build historical player targets
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2021,2022,2023 --schedule /tmp/targetable/schedule_history.csv --out /tmp/targetable/player_game_logs_history.csv

      - name: Build optional historical context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_injuries.py --seasons 2021,2022,2023 --out /tmp/targetable/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule /tmp/targetable/schedule_history.csv --out /tmp/targetable/weather_history.csv

      - name: Run frozen targetable-dropback temporal calibration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_receiver_targetable_dropback_v1_team_calibration.py \
            --player-logs /tmp/targetable/player_game_logs_history.csv \
            --team-weekly /tmp/targetable/team_weekly_history.csv \
            --schedule /tmp/targetable/schedule_history.csv \
            --universe-2022 /tmp/hist_2022/pregame_universe \
            --universe-2023 /tmp/hist_2023/pregame_universe \
            --injuries /tmp/targetable/injuries_history.csv \
            --weather /tmp/targetable/weather_history.csv \
            --weeks '1-18' \
            --out-dir /tmp/targetable/result
          cat /tmp/targetable/result/RESULT.md

      - name: Upload frozen result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-targetable-dropback-v1-team-calibration
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/targetable/result/**
