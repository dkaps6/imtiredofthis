name: WR R15 WR1 Anchored Participation V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - scripts/backtest/evaluate_wr_r15_wr1_anchor_participation_v1.py
      - .github/workflows/research-wr-r15-wr1-anchor-participation-v1.yml

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml scikit-learn joblib

      - name: Build leakage-safe 2022 fold inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2022
          python scripts/backtest/build_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --out-dir data/backtests_2022
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests_2022/team_weekly_history.csv --seasons 2021,2022 --audit data/backtests_2022/historical_defense_enrichment_audit.csv --observations data/backtests_2022/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --data-dir data/backtests_2022 --report data/backtests_2022/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2021,2022 --schedule data/backtests_2022/schedule_history.csv --out data/backtests_2022/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2021,2022 --out data/backtests_2022/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2022/schedule_history.csv --out data/backtests_2022/weather_history.csv

      - name: Build leakage-safe 2023 fold inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2023
          python scripts/backtest/build_historical_inputs.py --season 2023 --prior-season 2022 --weeks '1-18' --out-dir data/backtests_2023
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests_2023/team_weekly_history.csv --seasons 2022,2023 --audit data/backtests_2023/historical_defense_enrichment_audit.csv --observations data/backtests_2023/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2023 --prior-season 2022 --weeks '1-18' --data-dir data/backtests_2023 --report data/backtests_2023/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2022,2023 --schedule data/backtests_2023/schedule_history.csv --out data/backtests_2023/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2022,2023 --out data/backtests_2023/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2023/schedule_history.csv --out data/backtests_2023/weather_history.csv

      - name: Build leakage-safe 2024 fold inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2024
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir data/backtests_2024
          python scripts/backtest/enrich_historical_defense.py --team-weekly data/backtests_2024/team_weekly_history.csv --seasons 2023,2024 --audit data/backtests_2024/historical_defense_enrichment_audit.csv --observations data/backtests_2024/historical_defense_observations.csv
          python scripts/backtest/validate_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --data-dir data/backtests_2024 --report data/backtests_2024/historical_input_validation.csv
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024 --schedule data/backtests_2024/schedule_history.csv --out data/backtests_2024/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024 --out data/backtests_2024/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2024/schedule_history.csv --out data/backtests_2024/weather_history.csv

      - name: Run frozen two-fold WR R15 confirmation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/evaluate_wr_r15_wr1_anchor_participation_v1.py \
            --data-2022 data/backtests_2022 --logs-2022 data/backtests_2022/player_game_logs_history.csv \
            --data-2023 data/backtests_2023 --logs-2023 data/backtests_2023/player_game_logs_history.csv \
            --data-2024 data/backtests_2024 --logs-2024 data/backtests_2024/player_game_logs_history.csv \
            --iterations 2000 \
            --out-dir data/backtests/wr_r15_wr1_anchor_v1

      - name: Show frozen R15 result
        if: always()
        run: |
          echo '=== WR R15 result ==='
          cat data/backtests/wr_r15_wr1_anchor_v1/wr_r15_result.json 2>/dev/null || true
          echo '=== WR R15 market summary ==='
          cat data/backtests/wr_r15_wr1_anchor_v1/wr_r15_market_summary.csv 2>/dev/null || true
          echo '=== WR R15 bucket summary ==='
          cat data/backtests/wr_r15_wr1_anchor_v1/wr_r15_bucket_summary.csv 2>/dev/null || true

      - name: Upload R15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: |
            data/backtests_2022/historical_input_validation.csv
            data/backtests_2023/historical_input_validation.csv
            data/backtests_2024/historical_input_validation.csv
            data/backtests/wr_r15_wr1_anchor_v1/*
          if-no-files-found: warn
          retention-days: 30
