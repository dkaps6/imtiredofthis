name: Research Player Target Share Trajectory Shadow V1 Lock

on:
  push:
    branches:
      - research-player-target-share-trajectory-shadow-v1
    paths:
      - 'docs/research/PLAYER_TARGET_SHARE_TRAJECTORY_SHADOW_V1_CONTRACT.md'
      - 'scripts/research/lock_player_target_share_trajectory_shadow_v1.py'
      - 'tests/test_player_target_share_trajectory_shadow_v1.py'
      - '.github/workflows/research-player-target-share-trajectory-shadow-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest scipy pyarrow
      - name: Frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_player_target_share_trajectory_shadow_v1.py
      - name: Build Week-5 public pregame inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/trajshadow
          mkdir -p /tmp/trajshadow/hist /tmp/trajshadow/lock
          python scripts/backtest/build_historical_inputs.py             --season 2026 --prior-season 2025 --weeks 5 --out-dir /tmp/trajshadow/hist
          python scripts/backtest/historical_player_logs.py             --seasons 2025,2026             --schedule /tmp/trajshadow/hist/schedule_history.csv             --out /tmp/trajshadow/player_game_logs_history.csv
      - name: Create immutable Week-5 trajectory shadow lock
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/lock_player_target_share_trajectory_shadow_v1.py             --player-logs /tmp/trajshadow/player_game_logs_history.csv             --team-weekly /tmp/trajshadow/hist/team_weekly_history.csv             --schedule /tmp/trajshadow/hist/schedule_history.csv             --universe /tmp/trajshadow/hist/pregame_universe/2026_week_05.csv             --out-dir /tmp/trajshadow/lock
      - name: Verify prospective boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/trajshadow/lock/player_target_share_trajectory_shadow_week5_lock.json').read_text())
          assert p['status']=='WEEK5_PREGAME_LOCK_FROZEN',p
          assert p['season']==2026 and p['week']==5,p
          assert p['same_or_future_feature_violations']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['week5_outcomes_read']==0,p
          assert p['parameters_fit']==0,p
          assert p['production_changed'] is False,p
          assert p['max_room_pool_gap']<=1e-12,p
          assert p['max_team_modeled_target_mass_gap']<=1e-12,p
          assert p['locked_players']>=100,p
          assert p['changed_players']>0,p
          print('PLAYER_TARGET_SHARE_TRAJECTORY_WEEK5_LOCK_CERTIFIED')
          PY
      - name: Display lock
        if: always()
        run: |
          cat /tmp/trajshadow/lock/player_target_share_trajectory_shadow_week5_lock.json || true
      - name: Upload immutable lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-target-share-trajectory-shadow-v1-week5-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/trajshadow/lock/**
