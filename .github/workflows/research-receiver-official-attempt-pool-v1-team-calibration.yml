name: Research Receiver Official Attempt Pool V1 Team Calibration

on:
  push:
    branches: [research-receiver-official-attempt-pool-v1-calibration]
    paths:
      - 'docs/research/RECEIVER_OFFICIAL_ATTEMPT_POOL_V1_TEAM_CALIBRATION_PLAN.md'
      - 'scripts/research/evaluate_receiver_official_attempt_pool_v1_team_calibration.py'
      - '.github/workflows/research-receiver-official-attempt-pool-v1-team-calibration.yml'
  workflow_dispatch:

concurrency:
  group: research-receiver-official-attempt-pool-v1-team-calibration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow scikit-learn joblib

      - name: Compile frozen evaluator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_receiver_official_attempt_pool_v1_team_calibration.py

      - name: Build independent historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/receiver_pool /tmp/hist_2024 /tmp/hist_2025
          mkdir -p /tmp/receiver_pool /tmp/hist_2024 /tmp/hist_2025
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir /tmp/hist_2025

      - name: Combine historical schedule and team state
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('/tmp/receiver_pool')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              x=pd.concat([pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)],ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any(): raise RuntimeError(f'duplicate {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build historical player outcomes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py --seasons 2023,2024,2025 --schedule /tmp/receiver_pool/schedule_history.csv --out /tmp/receiver_pool/player_game_logs_history.csv

      - name: Build optional historical context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024,2025 --out /tmp/receiver_pool/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule /tmp/receiver_pool/schedule_history.csv --out /tmp/receiver_pool/weather_history.csv

      - name: Run frozen team opportunity calibration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_receiver_official_attempt_pool_v1_team_calibration.py \
            --player-logs /tmp/receiver_pool/player_game_logs_history.csv \
            --team-weekly /tmp/receiver_pool/team_weekly_history.csv \
            --schedule /tmp/receiver_pool/schedule_history.csv \
            --universe-2024 /tmp/hist_2024/pregame_universe \
            --universe-2025 /tmp/hist_2025/pregame_universe \
            --injuries /tmp/receiver_pool/injuries_history.csv \
            --weather /tmp/receiver_pool/weather_history.csv \
            --weeks '1-18' \
            --out-dir /tmp/receiver_pool/result
          cat /tmp/receiver_pool/result/RESULT.md

      - name: Upload frozen result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-official-attempt-pool-v1-team-calibration
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/receiver_pool/result/**
