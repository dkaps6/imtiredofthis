name: Migration 85 QB True Blocker-Rusher Source Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-qb-true-blocker-rusher-source-audit.yml"
      - "scripts/backtest/audit_true_blocker_rusher_sources.py"
      - "docs/migrations/M85_TRUE_BLOCKER_RUSHER_SOURCE_AUDIT.md"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frozen M85 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          doc=Path('docs/migrations/M85_TRUE_BLOCKER_RUSHER_SOURCE_AUDIT.md').read_text()
          required=[
              'TRUE_BLOCKER_X_TRUE_RUSHER_ASSIGNMENT',
              'exact offensive blocker × defensive pass-rusher assignment',
              'QUALIFIED_FOR_M86_PREDICTIVE_DEVELOPMENT',
              'HOLD_SOURCE_BLOCKED_NEW_INFORMATION',
              'production_actionable = false',
          ]
          missing=[x for x in required if x not in doc]
          assert not missing, missing
          print('M85 frozen contract: PASS')
          PY

  source-audit:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      - name: Run M85 source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/m85_blocker_rusher_source_audit
          python scripts/backtest/audit_true_blocker_rusher_sources.py --out-dir data/backtests/m85_blocker_rusher_source_audit
      - name: Verify audit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('data/backtests/m85_blocker_rusher_source_audit')
          d=json.loads((root/'m85_decision.json').read_text())
          inv=pd.read_csv(root/'m85_source_inventory.csv')
          assert d['qb_outcomes_read'] is False
          assert d['sportsbook_features_used'] is False
          assert d['production_actionable'] is False
          assert len(inv) >= 4
          print(inv.to_string(index=False))
          print(json.dumps(d, indent=2))
          PY
      - name: Upload M85 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m85-blocker-rusher-source-audit
          path: data/backtests/m85_blocker_rusher_source_audit/*
          if-no-files-found: warn
          retention-days: 14
