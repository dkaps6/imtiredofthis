name: Week5 Full Model Postmortem V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/WEEK5_FULL_MODEL_POSTMORTEM_PROTOCOL_V1.md'
      - 'scripts/research/grade_week5_full_football_board_v1.py'
      - '.github/workflows/week5-full-model-postmortem-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SEASON: "2026"
  WEEK: "5"
  SOURCE_RUN_ID: "37860592615"
  SOURCE_ARTIFACT_ID: "11585973062"
  SOURCE_ARTIFACT_NAME: "run_37860592615"
  SOURCE_ARTIFACT_DIGEST: "sha256:bf52aa4bc30bf6e8cc6029a0a86c0f33cdfaa09f587c38a138f23cef6b7436f4"

jobs:
  postmortem:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install grading dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy pytest pyyaml 'pyarrow==18.1.0'

      - name: Verify immutable Week5 artifact authority
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/w5_artifact.json
          python - <<'PY'
          import json,os
          a=json.load(open('/tmp/w5_artifact.json'))
          assert str(a['id'])==os.environ['SOURCE_ARTIFACT_ID'],a
          assert a['name']==os.environ['SOURCE_ARTIFACT_NAME'],a
          assert a['digest']==os.environ['SOURCE_ARTIFACT_DIGEST'],a
          assert not a['expired'],a
          assert str(a['workflow_run']['id'])==os.environ['SOURCE_RUN_ID'],a
          print(json.dumps({k:a[k] for k in ['id','name','digest','expired']},indent=2))
          PY

      - name: Download exact preserved Week5 board
        run: |
          set -euo pipefail
          rm -rf /tmp/week5_authority
          mkdir -p /tmp/week5_authority
          gh run download "${SOURCE_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "${SOURCE_ARTIFACT_NAME}"             --dir /tmp/week5_authority
          test -s /tmp/week5_authority/outputs/props_priced_clean.csv

      - name: Grade full underlying football board
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/week5_postmortem
          mkdir -p /tmp/week5_postmortem
          python scripts/research/grade_week5_full_football_board_v1.py             --priced /tmp/week5_authority/outputs/props_priced_clean.csv             --out-dir /tmp/week5_postmortem

      - name: Materialize exact Week5 board in ephemeral market ledger
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f data/market_track_record/boards/2026_wk05.csv
          python scripts/operations/archive_priced_board_v1.py             --priced-file /tmp/week5_authority/outputs/props_priced_clean.csv             --season 2026             --week 5             --run-id "${SOURCE_RUN_ID}"             --git-sha "24704e5f1ef872ec86c36446d2c73f6d377c824c"

      - name: Grade production-selected Week5 record
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.operations.grade_market_track_record_gsis_v1 import grade
          out=Path('/tmp/week5_postmortem')
          detail=out/'week5_selected_graded_detail.csv'
          summary=grade(
              2026,[5],detail_out=detail,
              final_board_already_gated=True,
          )
          (out/'week5_selected_settlement_summary.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True,default=str)+'\n'
          )
          print(json.dumps(summary,indent=2,sort_keys=True,default=str))
          if int(summary.get('still_unresolved_rows',-1))!=0:
              raise SystemExit(f"UNRESOLVED_SELECTED_ROWS={summary.get('still_unresolved_rows')}")
          PY

      - name: Generate selected-record diagnostic report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/operations/report_weekly_backtest_v1.py             --detail /tmp/week5_postmortem/week5_selected_graded_detail.csv             | tee /tmp/week5_postmortem/week5_selected_report.txt

      - name: Certify postmortem integrity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/week5_postmortem/week5_full_board_summary.json'))
          s=json.load(open('/tmp/week5_postmortem/week5_selected_settlement_summary.json'))
          assert p['season']==2026 and p['week']==5,p
          assert p['sportsbook_refetch'] is False,p
          assert p['model_fitting'] is False,p
          assert p['production_changed'] is False,p
          assert p['settled_rows']>0,p
          assert p['unresolved_rows']==0,p
          assert s['still_unresolved_rows']==0,s
          print(json.dumps({
            'full_board_rows':p['unique_player_market_rows'],
            'full_board_settled':p['settled_rows'],
            'selected_decided':s['decided_bets'],
            'selected_wins':s['wins'],
            'selected_losses':s['losses'],
          },indent=2))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload Week5 full-model postmortem artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-full-model-postmortem-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/week5_postmortem/**
