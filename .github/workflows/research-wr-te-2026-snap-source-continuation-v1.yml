name: WR TE 2026 Snap Source Continuation V1

on:
  push:
    branches:
      - research-current-season-state-persistence-v1
    paths:
      - "scripts/research/wr_te_2026_snap_source_continuation_v1.py"
      - "docs/research/WR_TE_2026_SNAP_SOURCE_CONTINUATION_V1_PLAN.md"
      - ".github/workflows/research-wr-te-2026-snap-source-continuation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  W2_SOURCE_RUN_ID: "35282021679"
  W2_SOURCE_ARTIFACT_NAME: "run_35282021679"
  W2_SOURCE_ARTIFACT_ID: "10523345092"
  W2_SOURCE_ARTIFACT_DIGEST: "sha256:6024ed21d7032e6e6440145277d9d4b74e98f319ef286962bac2a786a8d28e3c"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml nflreadpy

      - name: Verify preserved Week-2 artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${W2_SOURCE_RUN_ID}/artifacts" > /tmp/w2_artifacts.json
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/w2_artifacts.json',encoding='utf-8'))
          matches=[
              a for a in payload.get('artifacts',[])
              if str(a.get('id')) == os.environ['W2_SOURCE_ARTIFACT_ID']
              and a.get('name') == os.environ['W2_SOURCE_ARTIFACT_NAME']
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exact preserved artifact, got {matches}")
          a=matches[0]
          if bool(a.get('expired')):
              raise SystemExit("preserved Week-2 artifact is expired")
          if a.get('digest') != os.environ['W2_SOURCE_ARTIFACT_DIGEST']:
              raise SystemExit(f"digest mismatch: {a.get('digest')}")
          print("PRESERVED_WEEK2_ARTIFACT_VERIFIED", a['id'], a['name'], a['digest'])
          PY

      - name: Download preserved Week-2 artifact
        uses: actions/download-artifact@v4
        with:
          name: run_35282021679
          path: /tmp/w2_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35282021679

      - name: Verify preserved football universe
        run: |
          set -euo pipefail
          test -s /tmp/w2_source/data/football_simulation_universe.csv
          test -s /tmp/w2_source/data/target_entitlement_v1_trace.csv
          echo "NO LIVE ODDS ACQUISITION: preserved football artifact only"

      - name: Run frozen source-continuation replay
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/research/wr_te_2026_snap_source_continuation_v1.py \
            --week2-source-dir /tmp/w2_source \
            --out-dir /tmp/wr_te_2026_snap_source_continuation_v1 \
            --iterations 5000 \
            --seed 20260922

      - name: Strict repository audit
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/utils/audit_repo.py --strict

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-te-2026-snap-source-continuation-v1
          path: /tmp/wr_te_2026_snap_source_continuation_v1
          if-no-files-found: error
          retention-days: 90
