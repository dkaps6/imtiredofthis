name: Verify Phase4B Key Drift Diagnostic V1

on:
  workflow_dispatch:
  push:
    branches:
      - claude/verify-phase4b-key-drift-diagnostic-v1
    paths:
      - '.github/workflows/verify-phase4b-key-drift-diagnostic-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_RUN_ID: '34238301577'
      AUTHORITY_ARTIFACT_NAME: wr-r15-wr1-anchor-participation-v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow nflreadpy
      - name: Download exact WR-R15 authority artifact
        run: |
          rm -rf /tmp/wr_r15_artifact
          mkdir -p /tmp/wr_r15_artifact
          gh run download "${AUTHORITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${AUTHORITY_ARTIFACT_NAME}" \
            --dir /tmp/wr_r15_artifact
      - name: Run key-drift diagnostic
        run: |
          python -m scripts.research.diagnose_phase4b_unresolved_identity_v1 \
            --features /tmp/wr_r15_artifact/backtests/wr_r15_wr1_anchor_v1/wr_r15_confirmation_features.csv \
            --sample 30
