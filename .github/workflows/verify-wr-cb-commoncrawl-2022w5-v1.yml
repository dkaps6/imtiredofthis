name: Verify 2022W5 WR-CB Common Crawl source V1
on:
  push:
    branches: ["research-wr-cb-historical-snapshot-discovery-v1"]
    paths:
      - "scripts/research/verify_wr_cb_commoncrawl_2022w5_v1.py"
      - "tests/test_verify_wr_cb_commoncrawl_2022w5_v1.py"
      - ".github/workflows/verify-wr-cb-commoncrawl-2022w5-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-commoncrawl-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pytest warcio
      - env: {PYTHONPATH: .}
        run: pytest -q tests/test_verify_wr_cb_commoncrawl_2022w5_v1.py
      - name: Verify exact Common Crawl index + WARC payload
        env: {PYTHONPATH: .}
        continue-on-error: true
        run: |
          python scripts/research/verify_wr_cb_commoncrawl_2022w5_v1.py \
            --out-dir outputs/wr_cb_commoncrawl_2022w5_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-cb-commoncrawl-2022w5-v1
          path: outputs/wr_cb_commoncrawl_2022w5_v1/commoncrawl_2022w5_source_verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Require exact archive + strict roster success
        run: |
          python - <<'PY'
          import json
          x=json.load(open("outputs/wr_cb_commoncrawl_2022w5_v1/commoncrawl_2022w5_source_verification.json"))
          assert x["target_game_outcomes"] is False
          assert x["status"]=="COMMONCRAWL_DIGEST_MATCH_WITH_STRICT_SOURCE_ROWS",x["status"]
          assert x["strict_exact_week_identity_rows"]>0
          PY
