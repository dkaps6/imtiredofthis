name: RB-STACK6B Directional Postmortem

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6b-compact-role-model
    paths:
      - 'scripts/backtest/audit_rb_stack6b_directional_postmortem.py'
      - 'docs/migrations/RB_STACK6B_DIRECTIONAL_POSTMORTEM_PLAN.md'
      - '.github/workflows/backtest-rb-stack6b-directional-postmortem.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  STACK6B_RUN_ID: '33570434397'

jobs:
  postmortem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4

      - name: Compile
        run: python -m py_compile scripts/backtest/audit_rb_stack6b_directional_postmortem.py

      - name: Download frozen STACK6B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6b_postmortem/stack6b
          gh run download "$STACK6B_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6b-compact-role-model --dir data/backtests/rb_stack6b_postmortem/stack6b
          test -s data/backtests/rb_stack6b_postmortem/stack6b/stack6b_2025_casebook.csv

      - name: Run frozen no-fit postmortem
        run: |
          rm -rf data/backtests/rb_stack6b_postmortem/results
          python scripts/backtest/audit_rb_stack6b_directional_postmortem.py \
            --stack6b-root data/backtests/rb_stack6b_postmortem/stack6b \
            --out-dir data/backtests/rb_stack6b_postmortem/results

      - name: Show results
        if: always()
        run: |
          echo '=== protocol ==='
          cat data/backtests/rb_stack6b_postmortem/results/stack6b_postmortem_protocol.csv 2>/dev/null || true
          echo '=== directional ==='
          cat data/backtests/rb_stack6b_postmortem/results/stack6b_postmortem_directional.csv 2>/dev/null || true
          echo '=== counterfactuals ==='
          cat data/backtests/rb_stack6b_postmortem/results/stack6b_postmortem_counterfactuals.csv 2>/dev/null || true
          echo '=== contributions ==='
          cat data/backtests/rb_stack6b_postmortem/results/stack6b_postmortem_contributions.csv 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6b-directional-postmortem
          path: data/backtests/rb_stack6b_postmortem/results/**
          if-no-files-found: warn
          retention-days: 30
