name: Current Player Availability Production Verify V1

on:
  push:
    branches:
      - ops-current-player-availability-production-promotion-v1
    paths:
      - 'docs/operations/CURRENT_PLAYER_AVAILABILITY_PRODUCTION_PROMOTION_V1_IMPLEMENTATION_LOCK.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PROMOTION_PLAN_BLOB: 2d350379377ae65b2fb094504624da0591f53f7e
  VERIFY_PLAN_BLOB: a304f4bcf977c421aef7b7eb1a960579f0c2150c
  FULL_SLATE_BLOB: 41bacd4b756c32279169c80e0ff603a4780b7bee
  DYNAMIC_VERIFY_BLOB: 0a84913d850b44504271fba1985f053b2838b970
  OURLADS_STATUS_BLOB: c115816ea8aa4ba7150a635c3115546d43f94b3c
  NFL_INACTIVES_BLOB: 0d67316b6d7b7b9aa9d3637a07da4cd2b171639e
  AVAILABILITY_RESOLVER_BLOB: 9a1b0a672db7854ff52764ad93e5fcd89f9cb0ea
  T75_VALIDATOR_BLOB: d67ae30ed6e837f62098671c499d05462fe9d837
  ACTIVE_ROLES_BLOB: b2d05882cada048337f1f5f8b8db8ec7f9eef001
  ELIGIBLE_ROLES_BLOB: 8be1e607f4d35359459aa2d888c4cfee12cd27c7
  PLAYERFORM_WRAPPER_BLOB: 0a82649801794c560ccfd0ef368b7a340ec6f38f
  RB_WRAPPER_BLOB: 5874128aaa31dca9ed0a401f4dfa9197ff4c282e
  TEAMFORM_WRAPPER_BLOB: 240f62d018fa419567663cae3c96647483305361
  CURRENT_ROLES_BLOB: 7540cc40e02546b4feb2cc503aa506aa613c44f3
  ELIGIBLE_HELPER_BLOB: 77b591e431378ec984c51e8a032262e673d4c843
  ELIGIBLE_SEAM_BLOB: b64ec5ccd59728121a250433e40e77e3e1013a05
  QB_STARTER_SEAM_BLOB: c7569c54cda779eb04bed7dbf2b22b9ec4fb526b
  QB_PRIMARY_SEAM_BLOB: fbb7d34b54aefe98e95d8c097c7542c7d6490b52
  CERT_RUNNER_BLOB: dc60ab10bc18777d6b13cb5f81f285e8c248f3ab
  FINAL_35_ARTIFACT_ID: '10146675272'
  FINAL_35_DIGEST: sha256:dcc0fec6f07c62542e7115a49c1c45e9a185d18fd3baa2e423e0bd3dd08d0286

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml beautifulsoup4 lxml pytest
      - name: Verify frozen production implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object docs/operations/CURRENT_PLAYER_AVAILABILITY_PRODUCTION_PROMOTION_V1_FROZEN_PLAN.md)" = "$PROMOTION_PLAN_BLOB"
          test "$(git hash-object docs/operations/CURRENT_PLAYER_AVAILABILITY_PRODUCTION_VERIFY_V1_FROZEN_PLAN.md)" = "$VERIFY_PLAN_BLOB"
          test "$(git hash-object .github/workflows/full-slate.yml)" = "$FULL_SLATE_BLOB"
          test "$(git hash-object scripts/operations/run_current_availability_production_verify_v1.py)" = "$DYNAMIC_VERIFY_BLOB"
          test "$(git hash-object scripts/providers/ourlads_depth_status_v1.py)" = "$OURLADS_STATUS_BLOB"
          test "$(git hash-object scripts/providers/nfl_official_inactives_v1.py)" = "$NFL_INACTIVES_BLOB"
          test "$(git hash-object scripts/build/build_current_player_availability_v1.py)" = "$AVAILABILITY_RESOLVER_BLOB"
          test "$(git hash-object scripts/validate_current_player_availability_timing_v1.py)" = "$T75_VALIDATOR_BLOB"
          test "$(git hash-object scripts/build/build_reconciled_active_roles_v1.py)" = "$ACTIVE_ROLES_BLOB"
          test "$(git hash-object scripts/build/build_production_eligible_active_roles_v1.py)" = "$ELIGIBLE_ROLES_BLOB"
          test "$(git hash-object scripts/run_player_form_current_roles_v1.py)" = "$PLAYERFORM_WRAPPER_BLOB"
          test "$(git hash-object scripts/run_rb_week1_current_roles_v1.py)" = "$RB_WRAPPER_BLOB"
          test "$(git hash-object scripts/run_team_form_context_week1_prior_v1.py)" = "$TEAMFORM_WRAPPER_BLOB"
          test "$(git hash-object scripts/utils/current_roles_v1.py)" = "$CURRENT_ROLES_BLOB"
          test "$(git hash-object scripts/utils/eligible_team_set_v1.py)" = "$ELIGIBLE_HELPER_BLOB"
          test "$(git hash-object scripts/operations/apply_current_availability_eligible_team_seam_v1.py)" = "$ELIGIBLE_SEAM_BLOB"
          test "$(git hash-object scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py)" = "$QB_STARTER_SEAM_BLOB"
          test "$(git hash-object scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py)" = "$QB_PRIMARY_SEAM_BLOB"
          test "$(git hash-object scripts/operations/run_current_availability_football_stack_cert_v1.py)" = "$CERT_RUNNER_BLOB"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${FINAL_35_ARTIFACT_ID} --jq .digest)" = "$FINAL_35_DIGEST"
          python -m py_compile scripts/operations/run_current_availability_production_verify_v1.py
          git diff --quiet bb76ba9eabb08e2f0875a9af49301c3877f4141f HEAD -- scripts/modeling data/models model docs/research || { echo 'FATAL: protected science/artifacts/history changed'; exit 1; }
          echo PRODUCTION_IMPLEMENTATION_LOCK_BOUNDARY_PASS
      - name: Dispatch canonical branch Full Slate without odds
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run full-slate.yml --ref "$GITHUB_REF_NAME" -f season=2026 -f prior_season=2025 -f fetch_live_odds=false
          sleep 5
          RID=$(gh run list --workflow full-slate.yml --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$BEFORE\")][0].databaseId")
          test -n "$RID" && test "$RID" != "null"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "dispatched Full Slate run=$RID"
      - name: Wait for clean branch Full Slate
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RID" --repo "$GITHUB_REPOSITORY" --exit-status
          CONCLUSION=$(gh run view "$RID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          test "$CONCLUSION" = "success"
          echo "FULL_SLATE_BRANCH_RUN_SUCCESS run=$RID"
      - name: Stage Full Slate outputs and execute dynamic no-odds football verification
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.dispatch.outputs.run_id }}
          ACTIVE_ROLES_CSV: data/roles_current_production_eligible_v1.csv
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf staged data outputs
          mkdir -p staged data outputs
          gh run download "$RID" --repo "$GITHUB_REPOSITORY" --name "run_${RID}" --dir staged
          test -d staged/data
          cp -a staged/data/. data/
          if [ -d staged/outputs ]; then cp -a staged/outputs/. outputs/; fi
          test -s data/current_player_availability.csv
          test -s data/current_player_availability_game_certification.csv
          test -s data/roles_current_production_eligible_v1.csv
          test -s data/player_form_consensus.csv
          test -s data/qb_distribution_state_context.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('data/qb_distribution_state_context.csv')
          assert len(x)==32 and x.team.nunique()==32, (len(x),x.team.nunique())
          print('QB_STATE_CONTEXT_32_TEAM_SOURCE_INTEGRITY_PASS')
          PY
          python scripts/operations/apply_current_availability_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_eligible_team_seam_v1.py
          python scripts/operations/apply_current_availability_qb_c2_primary_team_seam_v1.py
          python scripts/operations/run_current_availability_production_verify_v1.py
          test -s data/current_player_availability_production_verification.json
          python - <<'PY'
          import json
          d=json.load(open('data/current_player_availability_production_verification.json'))
          assert d['disposition']=='CURRENT_PLAYER_AVAILABILITY_PRODUCTION_BRANCH_VERIFY_PASS_READY_FOR_MAIN_PROMOTION',d
          assert d['sportsbook_inputs_used']==0,d
          assert d['unavailable_players_in_playerform']==0 and d['unavailable_players_with_simulation_arrays']==0,d
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          python scripts/utils/audit_repo.py --strict
          python scripts/audit_2026_production_readiness.py --strict
      - name: Record branch verification lineage
        if: always()
        env:
          RID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('data/current_player_availability_production_verification.json')
          d=json.loads(p.read_text()) if p.exists() else {'disposition':'CURRENT_PLAYER_AVAILABILITY_PRODUCTION_BRANCH_VERIFY_MECHANICAL_FAILURE_NO_DECISION'}
          d['promotion_branch']=os.environ.get('GITHUB_REF_NAME','')
          d['promotion_head']=os.environ.get('GITHUB_SHA','')
          d['canonical_full_slate_run']=os.environ.get('RID','')
          Path('data/current_player_availability_production_verification_lineage.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload immutable production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-player-availability-production-verify-v1
          retention-days: 90
          path: |
            data/current_player_availability_production_verification*.json
            data/current_player_availability*.csv
            data/roles_current_production_eligible_v1*.json
            data/roles_current_production_eligible_v1.csv
            data/football_simulation_universe_audit.json
            data/qb_c2_production_integration_audit.json
            data/rb_r26_receptions_production_audit.json
            data/rb_receiving_tail_production_audit.json
            data/rb_rush_rec_conservation_input_audit.json
            data/target_entitlement_v1_audit.json
