name: Research TE Player Allocation Marginal Rec Yards V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/TE_PLAYER_ALLOCATION_MARGINAL_REC_YARDS_V1_FREEZE.md"
      - "scripts/research/evaluate_te_player_allocation_marginal_rec_yards_v1.py"
      - "tests/test_te_player_allocation_marginal_rec_yards_v1.py"
      - ".github/workflows/research-te-player-allocation-marginal-rec-yards-v1.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml pytest scipy pyarrow==17.0.0

      - name: Run frozen implementation safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_te_player_allocation_marginal_rec_yards_v1.py
          pytest -q tests/test_te_player_allocation_marginal_rec_yards_v1.py

      - name: Download exact recovered WR/TE fold authority
        uses: actions/download-artifact@v4
        with:
          name: wr-te-fold-authorities-recovered-v1
          path: /tmp/authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37782189538

      - name: Download confirmed allocation-only parent
        uses: actions/download-artifact@v4
        with:
          name: player-allocation-only-difficulty-v1
          path: /tmp/allocation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38656442803

      - name: Verify frozen parent authorities
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path('/tmp/authority/recovery_manifest.json').read_text())
          assert manifest['status']=='WR_TE_FOLD_AUTHORITIES_RECOVERED_EXACT',manifest
          assert manifest['provider_rebuild_used'] is False,manifest

          candidates=list(Path('/tmp/allocation').rglob('player_allocation_only_difficulty_result.json'))
          assert len(candidates)==1,candidates
          p=json.loads(candidates[0].read_text())
          assert p['te']['disposition']=='TE_PLAYER_ALLOCATION_DIFFICULTY_CONFIRMED',p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          print('PARENT_AUTHORITIES_CERTIFIED')
          PY
          ALLOC_ROWS="$(find /tmp/allocation -type f -name 'player_allocation_only_difficulty_rows.csv' -print -quit)"
          ALLOC_RESULT="$(find /tmp/allocation -type f -name 'player_allocation_only_difficulty_result.json' -print -quit)"
          test -n "$ALLOC_ROWS" && test -s "$ALLOC_ROWS"
          test -n "$ALLOC_RESULT" && test -s "$ALLOC_RESULT"
          test -s /tmp/authority/te_r5p_recovered/te_r5p_coefficients.csv
          test -s /tmp/authority/wr_r15_original/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          echo "ALLOC_ROWS=$ALLOC_ROWS" >> "$GITHUB_ENV"
          echo "ALLOC_RESULT=$ALLOC_RESULT" >> "$GITHUB_ENV"

      - name: Create historical workspace
        run: |
          rm -rf /tmp/te_marginal /tmp/hist_2024 /tmp/hist_2025
          mkdir -p /tmp/te_marginal/distributions /tmp/te_marginal/result /tmp/hist_2024 /tmp/hist_2025

      - name: Build current canonical historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py             --season 2024 --prior-season 2023 --weeks 1-18 --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py             --season 2025 --prior-season 2024 --weeks 1-18 --out-dir /tmp/hist_2025

      - name: Combine schedule and team history
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          out=Path('/tmp/te_marginal')
          for name in ['schedule_history.csv','team_weekly_history.csv']:
              parts=[pd.read_csv('/tmp/hist_2024/'+name),pd.read_csv('/tmp/hist_2025/'+name)]
              x=pd.concat(parts,ignore_index=True)
              keys=['season','week','team']
              x=x.sort_values(keys).drop_duplicates(keys,keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined rows {name}')
              x.to_csv(out/name,index=False)
          PY

      - name: Build canonical historical player logs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py             --seasons 2023,2024,2025             --schedule /tmp/te_marginal/schedule_history.csv             --out /tmp/te_marginal/player_game_logs_history.csv

      - name: Rebuild canonical historical component traces
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/walk_forward.py             --season 2024 --prior-season 2023 --weeks 1-18 --iterations 2000             --player-logs /tmp/te_marginal/player_game_logs_history.csv             --team-weekly /tmp/te_marginal/team_weekly_history.csv             --schedule /tmp/te_marginal/schedule_history.csv             --universe-dir /tmp/hist_2024/pregame_universe             --out /tmp/te_marginal/component_predictions_2024_base.csv
          python scripts/backtest/walk_forward.py             --season 2025 --prior-season 2024 --weeks 1-18 --iterations 2000             --player-logs /tmp/te_marginal/player_game_logs_history.csv             --team-weekly /tmp/te_marginal/team_weekly_history.csv             --schedule /tmp/te_marginal/schedule_history.csv             --universe-dir /tmp/hist_2025/pregame_universe             --out /tmp/te_marginal/component_predictions_2025_base.csv

      - name: Rebuild TE-R5P production-order marginal arrays
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/persist_wr_te_production_order_historical_v1.py             --season 2024 --prior-season 2023 --weeks 1-18 --iterations 2000             --player-logs /tmp/te_marginal/player_game_logs_history.csv             --team-weekly /tmp/te_marginal/team_weekly_history.csv             --schedule /tmp/te_marginal/schedule_history.csv             --universe-dir /tmp/hist_2024/pregame_universe             --component-file /tmp/te_marginal/component_predictions_2024_base.csv             --component-out /tmp/te_marginal/component_predictions_2024_wrte.csv             --out-dir /tmp/te_marginal/distributions             --te-coefficients /tmp/authority/te_r5p_recovered/te_r5p_coefficients.csv             --wr-coefficients /tmp/authority/wr_r15_original/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          python scripts/research/persist_wr_te_production_order_historical_v1.py             --season 2025 --prior-season 2024 --weeks 1-18 --iterations 2000             --player-logs /tmp/te_marginal/player_game_logs_history.csv             --team-weekly /tmp/te_marginal/team_weekly_history.csv             --schedule /tmp/te_marginal/schedule_history.csv             --universe-dir /tmp/hist_2025/pregame_universe             --component-file /tmp/te_marginal/component_predictions_2025_base.csv             --component-out /tmp/te_marginal/component_predictions_2025_wrte.csv             --out-dir /tmp/te_marginal/distributions             --te-coefficients /tmp/authority/te_r5p_recovered/te_r5p_coefficients.csv             --wr-coefficients /tmp/authority/wr_r15_original/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv

      - name: Evaluate frozen named-TE marginal overlay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/evaluate_te_player_allocation_marginal_rec_yards_v1.py             --allocation-rows "$ALLOC_ROWS"             --parent-result "$ALLOC_RESULT"             --distribution-dir /tmp/te_marginal/distributions             --out-dir /tmp/te_marginal/result

      - name: Verify frozen boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/te_marginal/result/te_player_allocation_marginal_rec_yards_result.json').read_text())
          assert p['version']=='TE_PLAYER_ALLOCATION_MARGINAL_REC_YARDS_V1',p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['projection_mean_changes']==0,p
          assert p['joint_distribution_claimed'] is False,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'TE_PLAYER_ALLOCATION_MARGINAL_REC_YARDS_QUALIFIED',
              'NO_ACTIONABLE_TE_PLAYER_ALLOCATION_MARGINAL_REC_YARDS',
          },p
          print('TE_PLAYER_ALLOCATION_MARGINAL_REC_YARDS_V1_BOUNDARY_CERTIFIED')
          PY

      - name: Show frozen result
        if: always()
        run: |
          cat /tmp/te_marginal/result/te_player_allocation_marginal_rec_yards_result.json 2>/dev/null || true

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-player-allocation-marginal-rec-yards-v1-${{ github.run_id }}
          path: |
            /tmp/te_marginal/result/**
            /tmp/te_marginal/distributions/*_wrte_replay_audit.csv
            /tmp/te_marginal/distributions/*_wrte_component_updates.csv
            /tmp/te_marginal/distributions/*_metadata.csv
            docs/research/TE_PLAYER_ALLOCATION_MARGINAL_REC_YARDS_V1_FREEZE.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload raw marginal distribution authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-player-allocation-marginal-rec-yards-raw-${{ github.run_id }}
          path: /tmp/te_marginal/distributions/*.npz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
