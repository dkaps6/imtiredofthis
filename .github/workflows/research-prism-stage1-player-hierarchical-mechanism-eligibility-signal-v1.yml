name: Research PRISM Stage1 Player Hierarchical Mechanism Eligibility Signal V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/evaluate_prism_stage1_player_hierarchical_mechanism_eligibility_signal_v1.py'
      - 'tests/test_prism_stage1_player_hierarchical_mechanism_eligibility_signal_v1.py'
      - '.github/workflows/research-prism-stage1-player-hierarchical-mechanism-eligibility-signal-v1.yml'
      - 'docs/research/PRISM_STAGE1_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_V1_FREEZE.md'
      - 'docs/research/PRISM_STAGE1_PLAYER_MECHANISM_BENEFIT_HISTORY_V1_SOURCE_RESULT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pytest pyyaml

      - name: Verify immutable pre-score freeze and parent authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor 9ec910700f7febf9e5b1552c0b2d41c837051287 HEAD
          git cat-file -e 9ec910700f7febf9e5b1552c0b2d41c837051287:docs/research/PRISM_STAGE1_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_V1_FREEZE.md
          if git cat-file -e 9ec910700f7febf9e5b1552c0b2d41c837051287:scripts/research/evaluate_prism_stage1_player_hierarchical_mechanism_eligibility_signal_v1.py 2>/dev/null; then
            echo "ERROR: Stage-1 eligibility evaluator existed at freeze commit"
            exit 1
          fi
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12049120604 --jq '.workflow_run.id')" = "38907459996"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12049120604 --jq '.digest')" = "sha256:41b1acd3f1b8d77abb53980db160ece32f8fc40351939d4827248b9caad0c64b"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12125863397 --jq '.workflow_run.id')" = "39099745136"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12125863397 --jq '.digest')" = "sha256:1b81c160ac1f8421d5eed83bb6a6389b5d6872f5a39f468df01b3a98a53d0d38"

      - uses: actions/download-artifact@v4
        with:
          name: player-active-role-participation-mechanism-v1-38907459996
          path: /tmp/stage1-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38907459996

      - name: Resolve immutable Stage-1 parent rows
        run: |
          PARENT_ROWS="$(find /tmp/stage1-parent -type f -name 'player_active_role_mechanism_scored_rows.csv' -print -quit)"
          test -n "$PARENT_ROWS" && test -s "$PARENT_ROWS"
          echo "PARENT_ROWS=$PARENT_ROWS" >> "$GITHUB_ENV"

      - name: Run focused mechanics tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/evaluate_prism_stage1_player_hierarchical_mechanism_eligibility_signal_v1.py
          pytest -q tests/test_prism_stage1_player_hierarchical_mechanism_eligibility_signal_v1.py

      - name: Score frozen Stage-1 hierarchical mechanism-utility signal
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/stage1-player-eligibility-signal
          mkdir -p /tmp/stage1-player-eligibility-signal
          python scripts/research/evaluate_prism_stage1_player_hierarchical_mechanism_eligibility_signal_v1.py             --parent-rows "$PARENT_ROWS"             --out-dir /tmp/stage1-player-eligibility-signal

      - name: Certify frozen contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage1-player-eligibility-signal/stage1_player_hierarchical_eligibility_signal_result.json'))
          assert p['version']=='PRISM_STAGE1_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_V1',p
          assert p['freeze_commit']=='9ec910700f7febf9e5b1552c0b2d41c837051287',p
          assert p['parent_run']==38907459996,p
          assert p['parent_artifact']==12049120604,p
          assert p['source_run']==39099745136,p
          assert p['source_artifact']==12125863397,p
          assert p['families']==['QB','RB','WR','TE'],p
          assert p['minimum_player_prior']==3,p
          assert p['pseudo_count']==3.0,p
          assert p['same_week_history_allowed'] is False,p
          assert p['family_prior_excludes_target_player'] is True,p
          assert p['chronology_violations']==0,p
          assert p['duplicate_identities']==0,p
          assert p['participation_projection_values_changed']==0,p
          assert p['stage1_formula_changed'] is False,p
          assert p['coefficients_fit']==0,p
          assert p['threshold_searches']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['week6_outcomes_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          assert p['disposition'] in {
              'PRISM_STAGE1_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_QUALIFIED_ALL',
              'PRISM_STAGE1_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_QUALIFIED_PARTIAL',
              'PRISM_STAGE1_PLAYER_HIERARCHICAL_MECHANISM_ELIGIBILITY_SIGNAL_CLOSED_ALL',
          },p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/stage1-player-eligibility-signal/stage1_player_hierarchical_eligibility_signal_result.json'))
          lines=[
              '### PRISM Stage-1 player hierarchical mechanism-eligibility signal V1',
              '',
              f"- Run: `{os.environ['RUN_ID']}`",
              f"- Exact head: `{os.environ['HEAD_SHA']}`",
              f"- Frozen-before-scoring commit: `{p['freeze_commit']}`",
              f"- Disposition: `{p['disposition']}`",
              '',
          ]
          for fam in p['families']:
              m24=p['metrics'][fam]['2024']; m25=p['metrics'][fam]['2025']
              failed=[k for k,v in p['qualification_gates'][fam].items() if k!='tail_floor' and not v]
              lines += [
                  f"- {fam}: `{p['family_dispositions'][fam]}`",
                  f"  - 2024 rows/players: {m24['rows']} / {m24['players']}; meta-AE gain {m24['mean_delta_meta_ae']:+.6f}; Spearman {m24['baseline_spearman']:+.4f}->{m24['candidate_spearman']:+.4f}",
                  f"  - 2025 rows/players: {m25['rows']} / {m25['players']}; meta-AE gain {m25['mean_delta_meta_ae']:+.6f}",
                  f"  - 2025 player-CI low {m25['player_cluster_bootstrap']['ci95_low']:+.6f}; game-CI low {m25['game_cluster_bootstrap']['ci95_low']:+.6f}; equal-player CI low {m25['equal_player_bootstrap']['ci95_low']:+.6f}",
                  f"  - named-player improved share {m25['equal_player_improved_share']:.2%}; median {m25['equal_player_median_improvement']:+.6f}; p10 {m25['equal_player_p10_improvement']:+.6f}",
                  f"  - failed gates: {failed if failed else 'none'}",
              ]
          lines += [
              '',
              'Meta-signal only: no participation projection changed; no Stage-1 retune, coefficient/threshold search, 2026/Week-6 outcomes, sportsbook/OddsAPI, or production mutation.',
          ]
          open('/tmp/issue535_stage1_player_eligibility_signal.md','w').write('\n'.join(lines)+'\n')
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/issue535_stage1_player_eligibility_signal.md

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload immutable signal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-stage1-player-hierarchical-mechanism-eligibility-signal-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/stage1-player-eligibility-signal/**
