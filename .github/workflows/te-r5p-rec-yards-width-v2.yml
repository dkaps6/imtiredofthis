name: TE R5P Rec Yards Width V2

on:
  workflow_dispatch:
  push:
    branches:
      - research-te-live-entitlement-efficiency-v1
    paths:
      - '.github/workflows/te-r5p-rec-yards-width-v2.yml'
      - 'docs/research/TE_R5P_REC_YARDS_WIDTH_V2_PLAN.md'
      - 'scripts/research/te_r5p_rec_yards_width_v2.py'
      - 'tests/test_te_r5p_rec_yards_width_v2.py'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml pyarrow tabulate

      - name: Run frozen mechanics and replay tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q             tests/test_te_r5p_rec_yards_width_v2.py             tests/test_wr_te_production_order_historical_v1.py             tests/test_empirical_fair_prob_v1.py             tests/test_benchmark_identity_v1.py

      - name: Create workspace
        run: |
          rm -rf /tmp/tewidth /tmp/hist_2024 /tmp/hist_2025 /tmp/ref /tmp/wr_model /tmp/te_model /tmp/wrte_ref
          mkdir -p /tmp/tewidth/distributions /tmp/tewidth/result                    /tmp/hist_2024 /tmp/hist_2025 /tmp/ref /tmp/wr_model /tmp/te_model /tmp/wrte_ref

      - name: Download canonical empirical baseline reference
        uses: actions/download-artifact@v4
        with:
          name: historical-fair-probability-reconstruction-v1
          path: /tmp/ref
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34712931786

      - name: Download WR-R15 fold-safe OOS authority
        uses: actions/download-artifact@v4
        with:
          name: wr-r15-wr1-anchor-participation-v1
          path: /tmp/wr_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34238301577

      - name: Download TE-R5P production-contract OOS authority
        uses: actions/download-artifact@v4
        with:
          name: te-r5p-production-contract-refit-v1
          path: /tmp/te_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34152797603

      - name: Download exact PR549 compact replay authority
        uses: actions/download-artifact@v4
        with:
          name: wr-te-production-order-historical-replay-v1
          path: /tmp/wrte_ref
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34722725629

      - name: Restore exact PR549 replay-only source environment
        run: |
          git show f04a8a775f4a56fe282cb292f6a52bd509bc8f24:data/manual_name_overrides.csv > data/manual_name_overrides.csv
          git show f04a8a775f4a56fe282cb292f6a52bd509bc8f24:data/model_ensemble_weights.csv > data/model_ensemble_weights.csv
          python - <<'PY'
          from pathlib import Path

          overrides = Path('data/manual_name_overrides.csv').read_text()
          weights = Path('data/model_ensemble_weights.csv').read_text()
          override_lines = [x for x in overrides.splitlines() if x.strip()]
          weight_lines = [x for x in weights.splitlines() if x.strip()]
          assert len(override_lines) == 3, f'unexpected PR549 override authority rows: {len(override_lines)-1}'
          assert 'Chris Godwin,Chris Godwin Jr.' not in overrides
          assert len(weight_lines) == 4, f'unexpected PR549 ensemble-weight authority rows: {len(weight_lines)-1}'
          assert 'rec_yards,' not in weights
          assert 'receptions,' not in weights
          print('PR549 replay-only source environment restored: manual_name_overrides + model_ensemble_weights')
          PY

      - name: Verify frozen fold authorities
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          wr_root = Path('/tmp/wr_model/backtests/wr_r15_wr1_anchor_v1')
          te_root = Path('/tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1')
          wr = pd.read_csv(wr_root / 'wr_r15_fold_coefficients.csv')
          te = pd.read_csv(te_root / 'te_r5p_coefficients.csv')
          wr_result = json.loads((wr_root / 'wr_r15_result.json').read_text())
          te_result = json.loads((te_root / 'te_r5p_result.json').read_text())
          assert sorted(wr['test_season'].astype(int).unique().tolist()) == [2023, 2024]
          assert sorted(te['test_season'].astype(int).unique().tolist()) == [2023, 2024, 2025]
          assert bool(wr_result.get('design_motivated_by_2025_but_2025_confirmation_forbidden'))
          assert te_result.get('candidate_team_pool') == 'b0_te_pool'
          assert float(te_result.get('pool_ratio_contract')) == 1.0
          assert te_result.get('disposition') == 'TE_R5P_PRODUCTION_CONTRACT_REFIT_ELIGIBLE'
          print('frozen fold authority PASS')
          PY

      - name: Build independent historical inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py             --season 2024 --prior-season 2023 --weeks 1-18 --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py             --season 2025 --prior-season 2024 --weeks 1-18 --out-dir /tmp/hist_2025

      - name: Combine schedule and team-week history
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out = Path('/tmp/tewidth')
          for name in ['schedule_history.csv', 'team_weekly_history.csv']:
              parts = [pd.read_csv('/tmp/hist_2024/' + name), pd.read_csv('/tmp/hist_2025/' + name)]
              x = pd.concat(parts, ignore_index=True)
              keys = ['season', 'week', 'team']
              x = x.sort_values(keys).drop_duplicates(keys, keep='last').reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f'duplicate combined historical rows in {name}')
              x.to_csv(out / name, index=False)
          PY

      - name: Build canonical historical player logs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/historical_player_logs.py             --seasons 2023,2024,2025             --schedule /tmp/tewidth/schedule_history.csv             --out /tmp/tewidth/player_game_logs_history.csv

      - name: Build canonical baseline component traces
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/walk_forward.py             --season 2024 --prior-season 2023 --weeks 1-18 --iterations 2000             --player-logs /tmp/tewidth/player_game_logs_history.csv             --team-weekly /tmp/tewidth/team_weekly_history.csv             --schedule /tmp/tewidth/schedule_history.csv             --universe-dir /tmp/hist_2024/pregame_universe             --out /tmp/tewidth/component_predictions_2024_base.csv
          python scripts/backtest/walk_forward.py             --season 2025 --prior-season 2024 --weeks 1-18 --iterations 2000             --player-logs /tmp/tewidth/player_game_logs_history.csv             --team-weekly /tmp/tewidth/team_weekly_history.csv             --schedule /tmp/tewidth/schedule_history.csv             --universe-dir /tmp/hist_2025/pregame_universe             --out /tmp/tewidth/component_predictions_2025_base.csv

      - name: Reproduce canonical baseline projection
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_full_stack_vegas_projection_trace_v2.py             --component-file /tmp/tewidth/component_predictions_2024_base.csv             --component-file /tmp/tewidth/component_predictions_2025_base.csv             --schedule /tmp/tewidth/schedule_history.csv             --weights data/model_ensemble_weights.csv             --out /tmp/tewidth/full_stack_projection_trace_base.csv
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np
          import pandas as pd

          result_dir = Path('/tmp/tewidth/result')
          result_dir.mkdir(parents=True, exist_ok=True)

          current = pd.read_csv('/tmp/tewidth/full_stack_projection_trace_base.csv', low_memory=False)
          frozen = pd.read_csv('/tmp/wrte_ref/full_stack_projection_trace_base.csv', low_memory=False)
          keys = ['season','week','team','opponent','player_clean_key','market','game_id']
          if frozen.duplicated(keys).any() or current.duplicated(keys).any():
              raise RuntimeError('baseline trace identity is not unique')

          merged = frozen.merge(
              current,
              on=keys,
              how='left',
              suffixes=('_frozen','_current'),
              indicator=True,
              validate='one_to_one',
          )
          missing = merged.loc[merged['_merge'].ne('both'), keys]
          if len(missing):
              missing.to_csv(result_dir / 'baseline_missing_frozen_rows.csv', index=False)
              raise RuntimeError(
                  'current rebuild is missing frozen PR549 rows: '
                  + str(missing.head(20).to_dict('records'))
              )

          extra = current.merge(frozen[keys], on=keys, how='left', indicator=True)
          extra = extra.loc[extra['_merge'].eq('left_only')].copy()
          print(f'frozen rows={len(frozen)} current rows={len(current)} extra_current_rows={len(extra)}')
          if len(extra):
              extra.to_csv(result_dir / 'baseline_current_only_rows.csv', index=False)
              print('provider-history extras (excluded from frozen authority):')
              print(extra[keys + ['player','position']].drop_duplicates().to_string(index=False))

          diagnostic_cols = [
              'rules_plays_est',
              'rules_pass_rate',
              'rules_tgt_share',
              'rules_rush_share',
              'rules_ypt',
              'rules_catch_rate',
              'rules_ypc',
              'rules_ypa',
              'rules_volatility_mult',
              'rules_pass_eff_mult',
              'rules_rush_eff_mult',
              'rules_injury_redistribution',
              'ctx_tgt_share_available',
              'ctx_rush_share_available',
              'ctx_ypa_available',
              'ctx_success_rate_available',
              'ctx_pace_available',
              'ctx_plays_available',
              'ctx_proe_available',
              'ctx_pressure_available',
              'ctx_explosive_available',
              'ctx_def_epa_available',
              'ctx_coverage_scheme_available',
              'ctx_box_rates_available',
              'ctx_wr_cb_matchup_available',
              'ctx_injury_available',
              'ctx_weather_available',
              'mc_off_pressure_allowed',
              'mc_def_pressure_generated',
              'mc_projected_plays',
              'mc_dropback_rate',
              'mc_pass_rate',
              'mc_team_expected_dropbacks',
              'mc_team_expected_pass_attempts',
              'mc_expected_pass_attempts',
              'mc_base_ypa',
              'mc_bayes_ypa',
              'mc_rules_ypa',
              'mc_pass_eff_mult',
              'mc_pressure_mismatch',
              'ml_proj',
              'state_proj',
              'ensemble_proj',
              'actual',
          ]
          diagnostic_cols = [
              c for c in diagnostic_cols
              if f'{c}_frozen' in merged.columns and f'{c}_current' in merged.columns
          ]

          summary_rows = []
          for col in ['mc_proj'] + diagnostic_cols:
              a = pd.to_numeric(merged[f'{col}_frozen'], errors='coerce').to_numpy(float)
              b = pd.to_numeric(merged[f'{col}_current'], errors='coerce').to_numpy(float)
              missingness_mismatch = int(np.count_nonzero(np.isnan(a) != np.isnan(b)))
              finite = np.isfinite(a) & np.isfinite(b)
              abs_delta = np.abs(b[finite] - a[finite])
              summary_rows.append({
                  'field': col,
                  'rows_compared': int(finite.sum()),
                  'missingness_mismatch_rows': missingness_mismatch,
                  'nonzero_delta_rows_gt_1e12': int(np.count_nonzero(abs_delta > 1e-12)),
                  'nonzero_delta_rows_gt_1e10': int(np.count_nonzero(abs_delta > 1e-10)),
                  'mean_abs_delta': float(abs_delta.mean()) if len(abs_delta) else 0.0,
                  'max_abs_delta': float(abs_delta.max()) if len(abs_delta) else 0.0,
              })
          field_summary = pd.DataFrame(summary_rows).sort_values(
              ['max_abs_delta','mean_abs_delta'], ascending=False
          )
          field_summary.to_csv(result_dir / 'baseline_provider_drift_field_summary.csv', index=False)

          mc_frozen = pd.to_numeric(merged['mc_proj_frozen'], errors='coerce')
          mc_current = pd.to_numeric(merged['mc_proj_current'], errors='coerce')
          merged['mc_proj_delta'] = mc_current - mc_frozen
          merged['mc_proj_abs_delta'] = merged['mc_proj_delta'].abs()

          row_cols = keys.copy()
          for c in ['player','position','role']:
              for suffix in ['frozen','current']:
                  name = f'{c}_{suffix}'
                  if name in merged.columns:
                      row_cols.append(name)
          row_cols += ['mc_proj_frozen','mc_proj_current','mc_proj_delta','mc_proj_abs_delta']
          for col in diagnostic_cols:
              row_cols.extend([f'{col}_frozen', f'{col}_current'])
              a = pd.to_numeric(merged[f'{col}_frozen'], errors='coerce')
              b = pd.to_numeric(merged[f'{col}_current'], errors='coerce')
              delta_name = f'{col}_delta'
              merged[delta_name] = b - a
              row_cols.append(delta_name)

          drift_rows = merged.loc[
              merged['mc_proj_abs_delta'].fillna(0).gt(1e-12), row_cols
          ].sort_values('mc_proj_abs_delta', ascending=False)
          drift_rows.head(2000).to_csv(
              result_dir / 'baseline_provider_drift_top_rows.csv', index=False
          )

          grouped = (
              merged.assign(mc_drift=merged['mc_proj_abs_delta'].fillna(0).gt(1e-12))
              .groupby(['season','week','team','market'], dropna=False)
              .agg(
                  frozen_rows=('mc_proj_abs_delta','size'),
                  drift_rows=('mc_drift','sum'),
                  mean_abs_mc_delta=('mc_proj_abs_delta','mean'),
                  max_abs_mc_delta=('mc_proj_abs_delta','max'),
              )
              .reset_index()
              .sort_values(['max_abs_mc_delta','mean_abs_mc_delta'], ascending=False)
          )
          grouped.to_csv(result_dir / 'baseline_provider_drift_group_summary.csv', index=False)

          payload = {
              'study': 'TE_R5P_WIDTH_V2_PROVIDER_DRIFT_DIAGNOSTIC_V1',
              'frozen_rows': int(len(frozen)),
              'current_rows': int(len(current)),
              'current_only_rows': int(len(extra)),
              'frozen_missing_rows': int(len(missing)),
              'mc_drift_rows_gt_1e10': int(merged['mc_proj_abs_delta'].fillna(0).gt(1e-10).sum()),
              'mc_max_abs_delta': float(merged['mc_proj_abs_delta'].max()),
              'science_ran': False,
              'parity_tolerance_changed': False,
          }
          (result_dir / 'baseline_provider_drift_summary.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )

          print('largest frozen-row mc_proj drift:')
          print(
              merged.sort_values('mc_proj_abs_delta', ascending=False)[
                  keys + ['player_frozen','position_frozen','mc_proj_frozen','mc_proj_current',
                          'mc_proj_delta','mc_proj_abs_delta']
              ].head(40).to_string(index=False)
          )
          print('largest upstream field drifts:')
          print(field_summary.head(30).to_string(index=False))

          # Preserve the exact pre-registered replay gate. Diagnostics above are
          # evidence only; they do not relax or replace frozen PR #549 parity.
          for col in ['mc_proj','ml_proj','state_proj','ensemble_proj','actual']:
              av = pd.to_numeric(merged[f'{col}_current'], errors='coerce').to_numpy(float)
              bv = pd.to_numeric(merged[f'{col}_frozen'], errors='coerce').to_numpy(float)
              if not np.array_equal(np.isnan(av), np.isnan(bv)):
                  raise RuntimeError(f'{col} missingness drift on frozen PR549 rows')
              m = np.isfinite(av) & np.isfinite(bv)
              delta = float(np.max(np.abs(av[m] - bv[m]))) if m.any() else 0.0
              print(f'frozen-row max delta {col}={delta:.12g}')
              if delta > 1e-10:
                  raise RuntimeError(f'{col} drift on frozen PR549 rows: {delta}')
          print('canonical baseline frozen-row reproduction PASS')
          PY

      - name: Reconstruct fold-safe TE-R5P production-order arrays
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/persist_wr_te_production_order_historical_v1.py             --season 2024 --prior-season 2023 --weeks 1-18 --iterations 2000             --player-logs /tmp/tewidth/player_game_logs_history.csv             --team-weekly /tmp/tewidth/team_weekly_history.csv             --schedule /tmp/tewidth/schedule_history.csv             --universe-dir /tmp/hist_2024/pregame_universe             --component-file /tmp/ref/component_predictions_2024.csv             --component-out /tmp/tewidth/component_predictions_2024_wrte.csv             --out-dir /tmp/tewidth/distributions             --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv             --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv
          python scripts/research/persist_wr_te_production_order_historical_v1.py             --season 2025 --prior-season 2024 --weeks 1-18 --iterations 2000             --player-logs /tmp/tewidth/player_game_logs_history.csv             --team-weekly /tmp/tewidth/team_weekly_history.csv             --schedule /tmp/tewidth/schedule_history.csv             --universe-dir /tmp/hist_2025/pregame_universe             --component-file /tmp/ref/component_predictions_2025.csv             --component-out /tmp/tewidth/component_predictions_2025_wrte.csv             --out-dir /tmp/tewidth/distributions             --te-coefficients /tmp/te_model/data/backtests/te_r5p_production_contract_refit_v1/te_r5p_coefficients.csv             --wr-coefficients /tmp/wr_model/backtests/wr_r15_wr1_anchor_v1/wr_r15_fold_coefficients.csv

      - name: Build specialist full-stack football trace
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_full_stack_vegas_projection_trace_v2.py             --component-file /tmp/tewidth/component_predictions_2024_wrte.csv             --component-file /tmp/tewidth/component_predictions_2025_wrte.csv             --schedule /tmp/tewidth/schedule_history.csv             --weights data/model_ensemble_weights.csv             --out /tmp/tewidth/full_stack_projection_trace_wrte.csv

      - name: Verify reconstructed specialist trace against frozen PR549 authority
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          current = pd.read_csv('/tmp/tewidth/full_stack_projection_trace_wrte.csv', low_memory=False)
          frozen = pd.read_csv('/tmp/wrte_ref/full_stack_projection_trace_wrte.csv', low_memory=False)
          keys = ['season','week','team','opponent','player_clean_key','market','game_id']
          if frozen.duplicated(keys).any() or current.duplicated(keys).any():
              raise RuntimeError('specialist trace identity is not unique')
          merged = frozen.merge(
              current, on=keys, how='left', suffixes=('_frozen','_current'),
              indicator=True, validate='one_to_one',
          )
          if merged['_merge'].ne('both').any():
              bad = merged.loc[merged['_merge'].ne('both'), keys].head(20).to_dict('records')
              raise RuntimeError(f'reconstructed specialist trace missing frozen rows: {bad}')
          for col in ['mc_proj','ml_proj','state_proj','ensemble_proj','actual']:
              av = pd.to_numeric(merged[f'{col}_current'], errors='coerce').to_numpy(float)
              bv = pd.to_numeric(merged[f'{col}_frozen'], errors='coerce').to_numpy(float)
              if not np.array_equal(np.isnan(av), np.isnan(bv)):
                  raise RuntimeError(f'specialist {col} missingness drift')
              m = np.isfinite(av) & np.isfinite(bv)
              delta = float(np.max(np.abs(av[m] - bv[m]))) if m.any() else 0.0
              print(f'specialist frozen-row max delta {col}={delta:.12g}')
              if delta > 1e-8:
                  raise RuntimeError(f'specialist {col} drift on frozen PR549 rows: {delta}')
          print('frozen PR549 specialist trace parity PASS')
          PY

      - name: Run blind TE receiving-yard width validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/te_r5p_rec_yards_width_v2.py             --projection-file /tmp/tewidth/full_stack_projection_trace_wrte.csv             --distribution-dir /tmp/tewidth/distributions             --props /tmp/ref/market_archive/historical_market_props.csv             --out-dir /tmp/tewidth/result
          test -s /tmp/tewidth/result/summary.json
          test -s /tmp/tewidth/result/RESULT.md

      - name: Verify V2 scope invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/tewidth/result/summary.json'))
          assert p['study'] == 'TE_R5P_REC_YARDS_WIDTH_V2'
          assert p['production_changed'] is False
          assert p['sportsbook_inputs_used_to_fit_k'] == 0
          assert set(p['fit']) == {'2024','2025'}
          assert set(p['blind_evaluations']) == {'fit2024_test2025','fit2025_test2024'}
          print('V2 scope invariants PASS')
          PY

      - name: Upload TE width V2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-r5p-rec-yards-width-v2
          path: |
            /tmp/tewidth/result/
            /tmp/tewidth/distributions/*_wrte_replay_audit.csv
            /tmp/tewidth/distributions/*_wrte_component_updates.csv
          if-no-files-found: error
          retention-days: 90

      - name: Upload reconstructed specialist arrays for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-r5p-rec-yards-width-v2-distributions
          path: /tmp/tewidth/distributions/*.npz
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
