name: RB R10 Modern Stability V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-cross-position-catastrophic-casebook-v1
    paths:
      - scripts/backtest/evaluate_rb_r10_modern_stability_v1.py
      - scripts/backtest/evaluate_rb_r9_receiving_identity_shrinkage_v1.py
      - scripts/backtest/evaluate_rb_r8_receiving_identity_v1.py
      - scripts/backtest/enrich_historical_defense_supported_v1.py
      - scripts/backtest/repair_historical_universe_missing_teams_v1.py
      - scripts/utils/team_codes.py
      - .github/workflows/research-rb-r10-modern-stability-v1.yml

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml scikit-learn joblib

      - name: Build 2021 training inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2021
          python scripts/backtest/build_historical_inputs.py --season 2021 --prior-season 2020 --weeks '1-18' --out-dir data/backtests_2021
          python scripts/backtest/enrich_historical_defense_supported_v1.py --team-weekly data/backtests_2021/team_weekly_history.csv --seasons 2020,2021 --audit data/backtests_2021/historical_defense_enrichment_audit.csv --observations data/backtests_2021/historical_defense_observations.csv
          python scripts/backtest/repair_historical_universe_missing_teams_v1.py --data-dir data/backtests_2021 --season 2021 --weeks '1-18' --audit data/backtests_2021/historical_universe_missing_team_repair_audit.csv
          python scripts/backtest/validate_historical_inputs.py --season 2021 --prior-season 2020 --weeks '1-18' --data-dir data/backtests_2021 --report data/backtests_2021/historical_input_validation.csv
          python scripts/backtest/historical_player_logs_schedule_bounded_v1.py --seasons 2020,2021 --schedule data/backtests_2021/schedule_history.csv --out data/backtests_2021/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2020,2021 --out data/backtests_2021/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2021/schedule_history.csv --out data/backtests_2021/weather_history.csv

      - name: Build 2022 inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2022
          python scripts/backtest/build_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --out-dir data/backtests_2022
          python scripts/backtest/enrich_historical_defense_supported_v1.py --team-weekly data/backtests_2022/team_weekly_history.csv --seasons 2021,2022 --audit data/backtests_2022/historical_defense_enrichment_audit.csv --observations data/backtests_2022/historical_defense_observations.csv
          python scripts/backtest/repair_historical_universe_missing_teams_v1.py --data-dir data/backtests_2022 --season 2022 --weeks '1-18' --audit data/backtests_2022/historical_universe_missing_team_repair_audit.csv
          python scripts/backtest/validate_historical_inputs.py --season 2022 --prior-season 2021 --weeks '1-18' --data-dir data/backtests_2022 --report data/backtests_2022/historical_input_validation.csv
          python scripts/backtest/historical_player_logs_schedule_bounded_v1.py --seasons 2021,2022 --schedule data/backtests_2022/schedule_history.csv --out data/backtests_2022/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2021,2022 --out data/backtests_2022/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2022/schedule_history.csv --out data/backtests_2022/weather_history.csv

      - name: Build 2023 inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2023
          python scripts/backtest/build_historical_inputs.py --season 2023 --prior-season 2022 --weeks '1-18' --out-dir data/backtests_2023
          python scripts/backtest/enrich_historical_defense_supported_v1.py --team-weekly data/backtests_2023/team_weekly_history.csv --seasons 2022,2023 --audit data/backtests_2023/historical_defense_enrichment_audit.csv --observations data/backtests_2023/historical_defense_observations.csv
          python scripts/backtest/repair_historical_universe_missing_teams_v1.py --data-dir data/backtests_2023 --season 2023 --weeks '1-18' --audit data/backtests_2023/historical_universe_missing_team_repair_audit.csv
          python scripts/backtest/validate_historical_inputs.py --season 2023 --prior-season 2022 --weeks '1-18' --data-dir data/backtests_2023 --report data/backtests_2023/historical_input_validation.csv
          python scripts/backtest/historical_player_logs_schedule_bounded_v1.py --seasons 2022,2023 --schedule data/backtests_2023/schedule_history.csv --out data/backtests_2023/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2022,2023 --out data/backtests_2023/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2023/schedule_history.csv --out data/backtests_2023/weather_history.csv

      - name: Build 2024 inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2024
          python scripts/backtest/build_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --out-dir data/backtests_2024
          python scripts/backtest/enrich_historical_defense_supported_v1.py --team-weekly data/backtests_2024/team_weekly_history.csv --seasons 2023,2024 --audit data/backtests_2024/historical_defense_enrichment_audit.csv --observations data/backtests_2024/historical_defense_observations.csv
          python scripts/backtest/repair_historical_universe_missing_teams_v1.py --data-dir data/backtests_2024 --season 2024 --weeks '1-18' --audit data/backtests_2024/historical_universe_missing_team_repair_audit.csv
          python scripts/backtest/validate_historical_inputs.py --season 2024 --prior-season 2023 --weeks '1-18' --data-dir data/backtests_2024 --report data/backtests_2024/historical_input_validation.csv
          python scripts/backtest/historical_player_logs_schedule_bounded_v1.py --seasons 2023,2024 --schedule data/backtests_2024/schedule_history.csv --out data/backtests_2024/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2023,2024 --out data/backtests_2024/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2024/schedule_history.csv --out data/backtests_2024/weather_history.csv

      - name: Build 2025 inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests_2025
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --out-dir data/backtests_2025
          python scripts/backtest/enrich_historical_defense_supported_v1.py --team-weekly data/backtests_2025/team_weekly_history.csv --seasons 2024,2025 --audit data/backtests_2025/historical_defense_enrichment_audit.csv --observations data/backtests_2025/historical_defense_observations.csv
          python scripts/backtest/repair_historical_universe_missing_teams_v1.py --data-dir data/backtests_2025 --season 2025 --weeks '1-18' --audit data/backtests_2025/historical_universe_missing_team_repair_audit.csv
          python scripts/backtest/validate_historical_inputs.py --season 2025 --prior-season 2024 --weeks '1-18' --data-dir data/backtests_2025 --report data/backtests_2025/historical_input_validation.csv
          python scripts/backtest/historical_player_logs_schedule_bounded_v1.py --seasons 2024,2025 --schedule data/backtests_2025/schedule_history.csv --out data/backtests_2025/player_game_logs_history.csv
          python scripts/backtest/build_historical_injuries.py --seasons 2024,2025 --out data/backtests_2025/injuries_history.csv
          python scripts/backtest/build_historical_weather.py --schedule data/backtests_2025/schedule_history.csv --out data/backtests_2025/weather_history.csv

      - name: Run frozen R10 modern stability audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/evaluate_rb_r10_modern_stability_v1.py \
            --data-2021 data/backtests_2021 --logs-2021 data/backtests_2021/player_game_logs_history.csv \
            --data-2022 data/backtests_2022 --logs-2022 data/backtests_2022/player_game_logs_history.csv \
            --data-2023 data/backtests_2023 --logs-2023 data/backtests_2023/player_game_logs_history.csv \
            --data-2024 data/backtests_2024 --logs-2024 data/backtests_2024/player_game_logs_history.csv \
            --data-2025 data/backtests_2025 --logs-2025 data/backtests_2025/player_game_logs_history.csv \
            --history-start 2013 --iterations 2000 --bootstrap-reps 2000 \
            --out-dir data/backtests/rb_r10_modern_stability_v1

      - name: Show R10 result
        if: always()
        run: |
          echo '=== RB R10 result ==='
          cat data/backtests/rb_r10_modern_stability_v1/rb_r10_result.json 2>/dev/null || true
          echo '=== RB R10 season summary ==='
          cat data/backtests/rb_r10_modern_stability_v1/rb_r10_season_summary.csv 2>/dev/null || true
          echo '=== RB R10 combined identity buckets ==='
          cat data/backtests/rb_r10_modern_stability_v1/rb_r10_identity_bucket_combined.csv 2>/dev/null || true

      - name: Upload R10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-r10-modern-stability-v1
          path: |
            data/backtests_2021/historical_input_validation.csv
            data/backtests_2021/historical_defense_enrichment_audit.csv
            data/backtests_2021/historical_universe_missing_team_repair_audit.csv
            data/backtests_2022/historical_input_validation.csv
            data/backtests_2022/historical_defense_enrichment_audit.csv
            data/backtests_2022/historical_universe_missing_team_repair_audit.csv
            data/backtests_2023/historical_input_validation.csv
            data/backtests_2023/historical_defense_enrichment_audit.csv
            data/backtests_2023/historical_universe_missing_team_repair_audit.csv
            data/backtests_2024/historical_input_validation.csv
            data/backtests_2024/historical_defense_enrichment_audit.csv
            data/backtests_2024/historical_universe_missing_team_repair_audit.csv
            data/backtests_2025/historical_input_validation.csv
            data/backtests_2025/historical_defense_enrichment_audit.csv
            data/backtests_2025/historical_universe_missing_team_repair_audit.csv
            data/backtests/rb_r10_modern_stability_v1/*
          if-no-files-found: warn
          retention-days: 30
