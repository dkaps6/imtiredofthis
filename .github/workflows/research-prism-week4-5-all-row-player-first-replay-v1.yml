name: Research PRISM Week4-5 All Row Player First Replay V1

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'scripts/research/audit_prism_week4_5_all_row_player_first_replay_v1.py'
      - '.github/workflows/research-prism-week4-5-all-row-player-first-replay-v1.yml'
      - 'docs/research/PRISM_WEEK4_5_ALL_ROW_PLAYER_FIRST_FORENSIC_REPLAY_V1_RESULT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Verify immutable replay authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          expected={
            11423535484:(37485600879,'week4-postmortem-backtest-v1-37485600879','sha256:59185d2aa4178971f6b0cc806eddd172ca0e7fbae559ad44da37a2b99656d791'),
            11812200405:(38395384228,'week5-full-model-postmortem-v1-38395384228','sha256:5888cab39506ae0bf70034dfb60f297defd28dd3219ea8118870738706f55ac3'),
            11550446909:(37777319154,'player-output-component-decomposition-v1-37777319154','sha256:7acfc453258a49f3aadf0d0ea386b13827eb715f1dfb055b96505f733320d204'),
            11524296325:(37717016519,'player-landscape-transmission-audit-v1-37717016519','sha256:e043133d4b9a48ce472dde8810d4d77d636f4ce2fbcee14708b23fe0ea35f6a0'),
            11812403368:(38397361891,'week5-player-failure-casebook-v1-38397361891','sha256:4cdef29912f35368473d57e15b38efdc3dd0f75e897bbbdc3b97fe1ff8f67670'),
          }
          repo=os.environ['GITHUB_REPOSITORY']
          for aid,(run,name,digest) in expected.items():
              raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{aid}'])
              a=json.loads(raw)
              if int(a['id']) != aid: raise SystemExit(f'artifact id drift {aid}')
              if int(a['workflow_run']['id']) != run: raise SystemExit(f'run drift {aid}')
              if a['name'] != name: raise SystemExit(f'name drift {aid}: {a["name"]}')
              if a.get('digest') != digest: raise SystemExit(f'digest drift {aid}: {a.get("digest")}')
              if a.get('expired'): raise SystemExit(f'expired artifact {aid}')
              print('SOURCE_VERIFIED',aid,run,name,digest)
          PY

      - name: Download exact preserved authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-w45
          mkdir -p /tmp/prism-w45/{w4,w5,history,state,casebook,out}
          gh run download 37485600879 --repo "${{ github.repository }}" --name week4-postmortem-backtest-v1-37485600879 --dir /tmp/prism-w45/w4
          gh run download 38395384228 --repo "${{ github.repository }}" --name week5-full-model-postmortem-v1-38395384228 --dir /tmp/prism-w45/w5
          gh run download 37777319154 --repo "${{ github.repository }}" --name player-output-component-decomposition-v1-37777319154 --dir /tmp/prism-w45/history
          gh run download 37717016519 --repo "${{ github.repository }}" --name player-landscape-transmission-audit-v1-37717016519 --dir /tmp/prism-w45/state
          gh run download 38397361891 --repo "${{ github.repository }}" --name week5-player-failure-casebook-v1-38397361891 --dir /tmp/prism-w45/casebook

          test -s /tmp/prism-w45/w4/research/week4_postmortem/week4_selected_full_graded.csv
          test -s /tmp/prism-w45/w5/week5_full_board_graded_detail.csv
          test -s /tmp/prism-w45/history/player_output_component_rows.csv
          test -s /tmp/prism-w45/state/player_landscape_week5_player_state.csv
          test -s /tmp/prism-w45/state/player_landscape_feature_inventory.csv
          test -s /tmp/prism-w45/casebook/week5_player_failure_casebook_v1_rows.csv

      - name: Execute frozen all-row player-first replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/audit_prism_week4_5_all_row_player_first_replay_v1.py
          python scripts/research/audit_prism_week4_5_all_row_player_first_replay_v1.py \
            --w4-board /tmp/prism-w45/w4/research/week4_postmortem/week4_selected_full_graded.csv \
            --w5-board /tmp/prism-w45/w5/week5_full_board_graded_detail.csv \
            --w1-w4-components /tmp/prism-w45/history/player_output_component_rows.csv \
            --w5-state /tmp/prism-w45/state/player_landscape_week5_player_state.csv \
            --w5-casebook /tmp/prism-w45/casebook/week5_player_failure_casebook_v1_rows.csv \
            --feature-inventory /tmp/prism-w45/state/player_landscape_feature_inventory.csv \
            --out-dir /tmp/prism-w45/out

      - name: Certify replay contract
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p='/tmp/prism-w45/out/prism_week4_5_all_row_player_first_replay_result.json'
          r=json.load(open(p))
          expected={
            'disposition':'PRISM_WEEK4_5_ALL_ROW_PLAYER_FIRST_REPLAY_COMPLETE__DIAGNOSTIC_ONLY__NO_PROMOTION',
            'all_row_replay_rows':836,
            'week4_rows':440,
            'week5_rows':396,
            'settled_rows':819,
            'nonsettled_void_dnp_rows':17,
            'component_rows':405,
            'week4_component_rows':365,
            'week5_exact_top40_component_rows':40,
            'informative_case_rows':100,
            'matched_correct_control_rows':100,
            'repeat_case_rows':20,
            'repeat_same_player_market_identities':10,
            'week4_exact_wr_dual_scores_manufactured':0,
            'new_model_fit':0,
            'threshold_searches':0,
            'sportsbook_inputs_used_upstream':0,
            'sportsbook_refetch':False,
            'oddsapi_calls':0,
            'week6_outcomes_used':0,
            'week6_locks_changed':False,
            'production_changed':False,
            'raw_recent_share_replacement_reopened':False,
            'generic_dvp_reopened':False,
            'room_competition_gates_lowered':False,
          }
          for k,v in expected.items():
              if r.get(k) != v:
                  raise SystemExit(f'CERT FAIL {k}: {r.get(k)!r} != {v!r}')
          if float(r['w4_component_max_identity_gap']) > 1e-8:
              raise SystemExit(f'W4 component identity gap {r["w4_component_max_identity_gap"]}')
          cert={
            'version':'PRISM_WEEK4_5_ALL_ROW_PLAYER_FIRST_FORENSIC_REPLAY_V1_CERT',
            'status':'PRISM_WEEK4_5_ALL_ROW_PLAYER_FIRST_REPLAY_REPRODUCED',
            'exact_head':os.environ['HEAD_SHA'],
            'run_id':int(os.environ['RUN_ID']),
            'source_result':r,
          }
          open('/tmp/prism-w45/out/replay_certificate.json','w').write(json.dumps(cert,indent=2,sort_keys=True)+'\n')
          print(json.dumps(cert,indent=2,sort_keys=True))
          PY

      - name: Record Issue 535 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 535 --repo "${{ github.repository }}" --body "PRISM Week-4/5 all-row player-first forensic replay completed at exact head ${{ github.sha }} (run ${{ github.run_id }}). Preserved universe: 836 named player-game-market rows (W4 440, W5 396), 819 settled, 236 unique players. Detailed diagnostic casebook: 100 rows; matched correct-case controls: 100; repeat same-player+market informative cases: 20 rows / 10 identities. Preserved exact/preserved opportunity-efficiency component evidence: 405 rows (W4 365 + W5 frozen top-40 40). Week-5 parent artifact 11585973062 is no longer retrievable, so the replay fails closed outside the frozen top-40 rather than relabeling the W5 state trace as the lost final component path. No fit, no threshold search, no sportsbook upstream/refetch, no OddsAPI, no Week-6 outcomes, no Week-6 lock changes, no production change. Candidate mechanisms remain hypotheses requiring separate freeze + independent validation."

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Upload replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-week4-5-all-row-player-first-replay-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-w45/out/**
