name: Research Football Matchup Integration Candidates V1

on:
  push:
    branches:
      - research-football-matchup-integration-candidates-v1
    paths:
      - 'docs/research/FOOTBALL_MATCHUP_TRANSMISSION_V1_INTEGRATION_CANDIDATE_CONTRACT.md'
      - 'scripts/research/score_football_matchup_integration_candidates_v1.py'
      - 'tests/test_football_matchup_integration_candidates_v1.py'
      - '.github/workflows/research-football-matchup-integration-candidates-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy pytest pyyaml pyarrow tabulate

      - name: Run frozen candidate safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_football_matchup_integration_candidates_v1.py

      - name: Create isolated workspace
        run: |
          set -euo pipefail
          rm -rf /tmp/fmt_hist_2022 /tmp/fmt_hist_2023 /tmp/fmt_hist_2024 /tmp/fmt_hist_2025 /tmp/fmt_candidate
          mkdir -p /tmp/fmt_hist_2022 /tmp/fmt_hist_2023 /tmp/fmt_hist_2024 /tmp/fmt_hist_2025
          mkdir -p /tmp/fmt_candidate/ref/right_tail /tmp/fmt_candidate/work /tmp/fmt_candidate/result

      - name: Download frozen 2024-2025 parent baseline authority
        uses: actions/download-artifact@v4
        with:
          name: distribution-right-tail-asymmetry-v1-37493425352
          path: /tmp/fmt_candidate/ref/right_tail
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37493425352

      - name: Resolve parent authority
        run: |
          set -euo pipefail
          RIGHT_TAIL_DETAIL="$(find /tmp/fmt_candidate/ref/right_tail -type f -name 'distribution_right_tail_asymmetry_detail.csv' -print -quit)"
          test -n "${RIGHT_TAIL_DETAIL}" && test -s "${RIGHT_TAIL_DETAIL}"
          echo "RIGHT_TAIL_DETAIL=${RIGHT_TAIL_DETAIL}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import os, pandas as pd
          p = os.environ["RIGHT_TAIL_DETAIL"]
          x = pd.read_csv(p, nrows=5)
          need = {"season","week","game_id","team","opponent","player_clean_key","market","actual","final_mean"}
          if not need.issubset({str(c).lower() for c in x.columns}):
              raise RuntimeError("parent right-tail authority schema drift")
          print("PARENT_RIGHT_TAIL_AUTHORITY_RESOLVED")
          PY

      - name: Build leakage-safe historical inputs 2022-2025
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for season in 2022 2023 2024 2025; do
            prior=$((season - 1))
            python scripts/backtest/build_historical_inputs.py               --season "${season}" --prior-season "${prior}" --weeks 1-18               --out-dir "/tmp/fmt_hist_${season}"
          done

      - name: Combine canonical schedule and baseline team history
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out = Path("/tmp/fmt_candidate/work")
          for name in ["schedule_history.csv", "team_weekly_history.csv"]:
              parts = [pd.read_csv(f"/tmp/fmt_hist_{s}/{name}") for s in (2022, 2023, 2024, 2025)]
              x = pd.concat(parts, ignore_index=True)
              keys = ["season", "week", "team"]
              x = x.sort_values(keys).drop_duplicates(keys, keep="last").reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f"duplicate combined historical rows in {name}")
              seasons = sorted(pd.to_numeric(x["season"], errors="coerce").dropna().astype(int).unique().tolist())
              if not {2021, 2022, 2023, 2024, 2025}.issubset(set(seasons)):
                  raise RuntimeError(f"historical seasons incomplete in {name}: {seasons}")
              target = out / ("team_weekly_base.csv" if name == "team_weekly_history.csv" else name)
              x.to_csv(target, index=False)
              print(target, len(x), seasons)
          PY

      - name: Build exact matchup-context history copy
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cp /tmp/fmt_candidate/work/team_weekly_base.csv /tmp/fmt_candidate/work/team_weekly_matchup.csv
          python scripts/backtest/correct_m89_team_semantics.py             --team-weekly /tmp/fmt_candidate/work/team_weekly_matchup.csv             --seasons 2021,2022,2023,2024,2025             --observations /tmp/fmt_candidate/work/m89_team_semantics_observations.csv             --audit /tmp/fmt_candidate/work/m89_team_semantics_audit.csv

      - name: Build canonical 2021-2025 player logs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/backtest/historical_player_logs.py             --seasons 2021,2022,2023,2024,2025             --schedule /tmp/fmt_candidate/work/schedule_history.csv             --out /tmp/fmt_candidate/work/player_game_logs_history.csv

      - name: Rebuild canonical football-only baselines 2022-2025
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for season in 2022 2023 2024 2025; do
            prior=$((season - 1))
            python scripts/backtest/walk_forward.py               --season "${season}" --prior-season "${prior}" --weeks 1-18 --iterations 2000               --player-logs /tmp/fmt_candidate/work/player_game_logs_history.csv               --team-weekly /tmp/fmt_candidate/work/team_weekly_base.csv               --schedule /tmp/fmt_candidate/work/schedule_history.csv               --universe-dir "/tmp/fmt_hist_${season}/pregame_universe"               --out "/tmp/fmt_candidate/work/component_predictions_${season}.csv"
          done
          python scripts/backtest/build_full_stack_vegas_projection_trace_v2.py             --component-file /tmp/fmt_candidate/work/component_predictions_2022.csv             --component-file /tmp/fmt_candidate/work/component_predictions_2023.csv             --component-file /tmp/fmt_candidate/work/component_predictions_2024.csv             --component-file /tmp/fmt_candidate/work/component_predictions_2025.csv             --schedule /tmp/fmt_candidate/work/schedule_history.csv             --weights data/model_ensemble_weights.csv             --out /tmp/fmt_candidate/work/full_stack_projection_trace_2022_2025.csv

      - name: Score frozen integration candidates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/research/score_football_matchup_integration_candidates_v1.py             --projection-trace /tmp/fmt_candidate/work/full_stack_projection_trace_2022_2025.csv             --parent-right-tail-detail "${RIGHT_TAIL_DETAIL}"             --team-weekly-matchup /tmp/fmt_candidate/work/team_weekly_matchup.csv             --player-logs /tmp/fmt_candidate/work/player_game_logs_history.csv             --schedule /tmp/fmt_candidate/work/schedule_history.csv             --out-dir /tmp/fmt_candidate/result

      - name: Verify frozen candidate contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("/tmp/fmt_candidate/result/football_matchup_integration_candidate_result.json").read_text())
          assert p["train_season"] == 2022, p
          assert p["primary_confirmation_season"] == 2023, p
          assert p["secondary_consistency_seasons"] == [2024, 2025], p
          assert p["evaluation_weeks"] == [2, 18], p
          assert p["sportsbook_inputs_used"] == 0, p
          assert p["production_changed"] is False, p
          assert p["combined_candidate_scored"] is False, p
          assert p["parent_2024_2025_baseline_parity"]["status"] == "PASS", p
          ids = [c["candidate_id"] for c in p["candidates"]]
          assert ids == ["FMT-RB1", "FMT-WR1", "FMT-TE1"], ids
          print("FOOTBALL_MATCHUP_INTEGRATION_CANDIDATE_CONTRACT_CERTIFIED")
          PY

      - name: Display candidate result
        if: always()
        run: |
          cat /tmp/fmt_candidate/result/football_matchup_integration_candidate_result.json || true
          echo
          cat /tmp/fmt_candidate/result/football_matchup_integration_candidate_scorecard.csv || true

      - name: Upload frozen candidate score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-matchup-integration-candidates-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/fmt_candidate/result/**
            /tmp/fmt_candidate/work/m89_team_semantics_audit.csv
