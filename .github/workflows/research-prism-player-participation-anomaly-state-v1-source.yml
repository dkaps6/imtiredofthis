name: Research PRISM Player Participation Anomaly State V1 Source

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'docs/research/PRISM_PLAYER_PARTICIPATION_ANOMALY_STATE_V1_SOURCE_PLAN.md'
      - 'scripts/research/audit_prism_player_participation_anomaly_state_v1.py'
      - 'tests/test_prism_player_participation_anomaly_state_v1.py'
      - '.github/workflows/research-prism-player-participation-anomaly-state-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "fd787e681aa5c7b6b55c5f8d0dc1d67ec4651b32"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_PLAYER_PARTICIPATION_ANOMALY_STATE_V1_SOURCE_PLAN.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_player_participation_anomaly_state_v1.py" 2>/dev/null; then
            echo "ERROR: implementation existed at source freeze"
            exit 1
          fi

      - name: Verify immutable observation-state parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run=39154145666
          aid=12146625382
          name='prism-player-observation-health-state-v1-source-39154145666'
          digest='sha256:d74f2d3c37a88aa639527aedf719e7e08001d464c722613b46291cda0f74cbeb'
          repo=os.environ['GITHUB_REPOSITORY']
          payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))
          arts={int(a['id']):a for a in payload.get('artifacts',[])}
          a=arts.get(aid)
          assert a is not None,(run,aid)
          assert not a.get('expired'),a
          assert a.get('name')==name,a
          assert a.get('digest')==digest,a
          print('PARENT_VERIFIED',run,aid,name,digest)
          PY

      - name: Download immutable observation-state parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-participation-anomaly
          mkdir -p /tmp/prism-participation-anomaly/{parent,out}
          gh run download 39154145666 --repo "${{ github.repository }}" \
            --name prism-player-observation-health-state-v1-source-39154145666 \
            --dir /tmp/prism-participation-anomaly/parent
          test -s /tmp/prism-participation-anomaly/parent/player_observation_health_state_rows.csv

      - name: Compile and run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_player_participation_anomaly_state_v1.py
          pytest -q tests/test_prism_player_participation_anomaly_state_v1.py

      - name: Execute frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/audit_prism_player_participation_anomaly_state_v1.py \
            --parent /tmp/prism-participation-anomaly/parent/player_observation_health_state_rows.csv \
            --out-dir /tmp/prism-participation-anomaly/out

      - name: Certify source-only contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p=json.load(open('/tmp/prism-participation-anomaly/out/player_participation_anomaly_state_source_result.json'))
          rows=pd.read_csv('/tmp/prism-participation-anomaly/out/player_participation_anomaly_state_rows.csv')
          assert p['version']=='PRISM_PLAYER_PARTICIPATION_ANOMALY_STATE_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='fd787e681aa5c7b6b55c5f8d0dc1d67ec4651b32',p
          assert p['parent_run']==39154145666,p
          assert p['parent_artifact']==12146625382,p
          assert p['parent_digest']=='sha256:d74f2d3c37a88aa639527aedf719e7e08001d464c722613b46291cda0f74cbeb',p
          assert p['disposition'] in {
              'PRISM_PLAYER_PARTICIPATION_ANOMALY_STATE_V1_SOURCE_READY',
              'PRISM_PLAYER_PARTICIPATION_ANOMALY_STATE_V1_SOURCE_BLOCKED',
          },p
          assert p['prior_window_max']==4 and p['prior_window_min']==3,p
          assert p['snap_retention_max']==0.65,p
          assert p['absolute_snap_drop_min']==0.20,p
          assert p['audit']['chronology_violations']==0,p
          assert p['audit']['next_corroboration_order_violations']==0,p
          assert p['performance_outcomes_loaded']==0,p
          assert p['predictive_relationships_scored']==0,p
          assert p['projection_errors_scored']==0,p
          assert p['coefficients_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          assert len(rows)>0
          assert set(rows['season'].unique())=={2024,2025}
          supported=rows.loc[rows['baseline_supported'].astype(str).str.lower().eq('true')]
          assert len(supported)>0
          assert (pd.to_numeric(supported['prior_positive_rows'])>=3).all()
          assert (pd.to_numeric(supported['prior_positive_rows'])<=4).all()
          assert (pd.to_numeric(supported['player_prior_snap_pct'])>0).all()
          assert (pd.to_numeric(supported['snap_retention_ratio'])>=0).all()
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          p=json.load(open('/tmp/prism-participation-anomaly/out/player_participation_anomaly_state_source_result.json'))
          print("### PRISM player participation-anomaly state V1 — source audit")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for s in p['season_summaries']:
              print()
              print(f"**{s['season']}**")
              print(f"- positive-participation rows={s['positive_participation_rows']}; baseline-supported={s['baseline_supported_rows']}; insufficient={s['baseline_insufficient_rows']}")
              print(f"- injury-corroborated collapses={s['injury_corroborated_collapse_rows']}; unresolved collapses={s['unresolved_collapse_rows']}")
              print(f"- current-week corroboration={s['current_week_corroboration_rows']}; next-game corroboration={s['next_game_corroboration_rows']}")
              print(f"- median prior snap pct={s['median_prior_snap_pct_supported']:.3f}; collapse current pct={s['median_current_snap_pct_collapse']:.3f}; collapse retention={s['median_retention_ratio_collapse']:.3f}")
              failed=[k for k,v in s['gates'].items() if not v]
              print(f"- failed gates: {failed or ['NONE']}")
          print()
          print("Source/state only. The rule is same-player/same-team; position is inventory only. No targets/yards/carries/TDs, projection error, 2026 outcomes, sportsbook/OddsAPI, fitted coefficient, threshold search, or production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-player-participation-anomaly-state-v1-source-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-participation-anomaly/out/**
