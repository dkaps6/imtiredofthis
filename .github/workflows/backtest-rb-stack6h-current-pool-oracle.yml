name: RB STACK6H Current Pool Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6h-current-pool-oracle
    paths:
      - 'scripts/backtest/evaluate_rb_stack6h_current_pool_oracle.py'
      - 'docs/migrations/RB_STACK6H_CURRENT_POOL_ORACLE_PLAN.md'
      - '.github/workflows/backtest-rb-stack6h-current-pool-oracle.yml'
      - 'docs/migrations/RB_STACK6H_RUN_TRIGGER.md'

permissions:
  contents: read
  actions: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      STACK6_RUN_ID: '33549529203'
      M94C_RUN_ID: '33353485070'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2 pyarrow==17.0.0 nflreadpy
      - name: Compile
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6h_current_pool_oracle.py
      - name: Download frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6h/stack6 data/backtests/rb_stack6h/m94c
          gh run download "$STACK6_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-model --dir data/backtests/rb_stack6h/stack6
          gh run download "$M94C_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-94c-rb-game-environment --dir data/backtests/rb_stack6h/m94c
          test -s data/backtests/rb_stack6h/stack6/stack6_2025_casebook.csv
          test -s data/backtests/rb_stack6h/m94c/m94c_2025_team_trace.csv
      - name: Run frozen STACK6H oracle
        run: |
          rm -rf data/backtests/rb_stack6h/results
          python scripts/backtest/evaluate_rb_stack6h_current_pool_oracle.py \
            --stack6-root data/backtests/rb_stack6h/stack6 \
            --m94c-root data/backtests/rb_stack6h/m94c \
            --out-dir data/backtests/rb_stack6h/results
      - name: Show outputs
        if: always()
        run: |
          echo '=== integrity ==='
          cat data/backtests/rb_stack6h/results/stack6h_integrity.csv 2>/dev/null || true
          echo '=== overall ==='
          cat data/backtests/rb_stack6h/results/stack6h_overall_oracle_scores.csv 2>/dev/null || true
          echo '=== bins ==='
          cat data/backtests/rb_stack6h/results/stack6h_bin_oracle_scores.csv 2>/dev/null || true
          echo '=== disposition ==='
          cat data/backtests/rb_stack6h/results/stack6h_disposition.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6h-current-pool-oracle
          path: data/backtests/rb_stack6h/results/**
          if-no-files-found: warn
          retention-days: 30
