name: WR-R7 YPR Mechanism Conditioned Efficiency

on:
  workflow_dispatch:
  push:
    branches:
      - research-wr-r7-ypr-mechanism-conditioned-efficiency
    paths:
      - ".github/workflows/backtest-wr-r7-ypr-mechanism-conditioned-efficiency.yml"
      - "scripts/backtest/evaluate_wr_r7_ypr_mechanism_conditioned_efficiency.py"
      - "docs/migrations/WR_R7_YPR_MECHANISM_CONDITIONED_EFFICIENCY_PLAN.md"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy==1.26.4 pandas==1.5.3 scipy==1.11.4
      - name: Compile evaluator
        run: python -m py_compile scripts/backtest/evaluate_wr_r7_ypr_mechanism_conditioned_efficiency.py
      - name: Download frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/wr_r5 evidence/nd6
          gh run download 34066489537 --repo "${GITHUB_REPOSITORY}" --name wr-r5-target-catch-ypr-individual-decomposition --dir evidence/wr_r5
          gh run download 34056970854 --repo "${GITHUB_REPOSITORY}" --name wr-nd6-player-level-explosive-ceiling --dir evidence/nd6
      - name: Evaluate WR-R7
        run: |
          rm -rf data/backtests/wr_r7_ypr_mechanism_conditioned_efficiency
          python scripts/backtest/evaluate_wr_r7_ypr_mechanism_conditioned_efficiency.py \
            --wr-r5-root evidence/wr_r5 \
            --nd6-root evidence/nd6 \
            --out-dir data/backtests/wr_r7_ypr_mechanism_conditioned_efficiency
      - name: Show result
        if: always()
        run: cat data/backtests/wr_r7_ypr_mechanism_conditioned_efficiency/wr_r7_result.json 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-r7-ypr-mechanism-conditioned-efficiency
          path: |
            data/backtests/wr_r7_ypr_mechanism_conditioned_efficiency/*
            docs/migrations/WR_R7_YPR_MECHANISM_CONDITIONED_EFFICIENCY_PLAN.md
          if-no-files-found: warn
          retention-days: 30
