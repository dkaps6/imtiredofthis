name: RB R27D0B 2019 YAC Quality Source Extension

on:
  push:
    branches:
      - research-rb-r27d0-yac-quality-source-audit
    paths:
      - 'docs/research/RB_R27D0B_2019_YAC_QUALITY_SOURCE_EXTENSION_LOCK.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PRODUCTION_BASE_SHA: bb76ba9eabb08e2f0875a9af49301c3877f4141f
  EXTENSION_PLAN_BLOB: b34d8fc2c1a40b7159f9c41b81094e8d1d84c9f9
  R27D0_SCRIPT_BLOB: 48644f59ec10717e3ef7dd3470643fb29520cc23
  R27B_PARENT_RUN: '34428917229'
  R27B_PARENT_ARTIFACT_ID: '10134023092'
  R27B_PARENT_ARTIFACT_NAME: rb-r27b-v2-novel-efficiency-context
  R27B_PARENT_DIGEST: sha256:1df1a14c9900b890fe86e04269849dc90d76fc03a9215ad8612c1820dee5341f

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Verify frozen source-extension boundary
        run: |
          set -euo pipefail
          test "$(git hash-object docs/research/RB_R27D0B_2019_YAC_QUALITY_TRAINING_SOURCE_EXTENSION.md)" = "$EXTENSION_PLAN_BLOB"
          test "$(git hash-object scripts/backtest/audit_rb_r27d0_yac_quality_sources.py)" = "$R27D0_SCRIPT_BLOB"
          python -m py_compile scripts/backtest/audit_rb_r27d0_yac_quality_sources.py
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/run_pricing_with_full_roster_universe_v5_production.py \
            scripts/simulation_v2.py scripts/simulation_c2_qb_candidate.py \
            data/models model .github/workflows/full-slate.yml
          sha256sum docs/research/RB_R27D0B_2019_YAC_QUALITY_TRAINING_SOURCE_EXTENSION.md > r27d0b_plan.sha256
          sha256sum docs/research/RB_R27D0B_2019_YAC_QUALITY_SOURCE_EXTENSION_LOCK.md > r27d0b_lock.sha256
          sha256sum scripts/backtest/audit_rb_r27d0_yac_quality_sources.py > r27d0b_code.sha256

      - name: Verify and stage exact V2 universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R27B_PARENT_ARTIFACT_ID}" --jq .digest)"
          test "$D" = "$R27B_PARENT_DIGEST"
          mkdir -p data/r27d0b_v2_parent
          gh run download "$R27B_PARENT_RUN" --repo "$GITHUB_REPOSITORY" --name "$R27B_PARENT_ARTIFACT_NAME" --dir data/r27d0b_v2_parent
          test -s data/r27d0b_v2_parent/data/backtests/r27b_v2_final/r27b_v2_all_predictions.csv

      - name: Extend exact source audit through 2019
        run: |
          rm -rf data/backtests/r27d0b_2019_source_extension
          PYTHONPATH=. python scripts/backtest/audit_rb_r27d0_yac_quality_sources.py \
            --predictions data/r27d0b_v2_parent/data/backtests/r27b_v2_final/r27b_v2_all_predictions.csv \
            --seasons 2019-2025 \
            --out-dir data/backtests/r27d0b_2019_source_extension

      - name: Assert source-only execution and 2019 xYAC presence
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          d=json.loads(Path('data/backtests/r27d0b_2019_source_extension/r27d0_source_audit_summary.json').read_text())
          assert d['model_fit_performed'] is False and d['candidate_projection_created'] is False
          assert d['prediction_error_scored'] is False and d['sportsbook_inputs']==0
          p=pd.read_csv('data/backtests/r27d0b_2019_source_extension/r27d0_pbp_source_coverage.csv')
          r=p[p.season.eq(2019)]
          assert len(r)==1
          assert r.iloc[0].xyac_mean_field == 'xyac_mean_yardage'
          print('R27D0B_2019_SOURCE_EXTENSION_COMPLETE')
          print(r.to_string(index=False))
          PY

      - name: Upload immutable R27D0B source extension
        uses: actions/upload-artifact@v4
        with:
          name: rb-r27d0b-2019-yac-quality-source-extension
          retention-days: 90
          path: |
            r27d0b_plan.sha256
            r27d0b_lock.sha256
            r27d0b_code.sha256
            data/backtests/r27d0b_2019_source_extension/*
