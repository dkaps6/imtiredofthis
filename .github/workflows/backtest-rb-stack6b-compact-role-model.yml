name: RB-STACK6B Compact Role Model

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-stack6b-compact-role-model
    paths:
      - 'scripts/backtest/evaluate_rb_stack6b_compact_role_model.py'
      - 'docs/migrations/RB_STACK6B_COMPACT_ROLE_MODEL_PLAN.md'
      - '.github/workflows/backtest-rb-stack6b-compact-role-model.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  STACK6_RUN_ID: '33549529203'
  MARKET_RUN_ID: '33499129109'

jobs:
  stack6b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2

      - name: Compile evaluator
        run: python -m py_compile scripts/backtest/evaluate_rb_stack6b_compact_role_model.py

      - name: Download frozen parent and downstream market artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_stack6b/stack6 data/backtests/rb_stack6b/market
          gh run download "$STACK6_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-stack6-secondary-role-model --dir data/backtests/rb_stack6b/stack6
          gh run download "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rb-market-benchmark-2025 --dir data/backtests/rb_stack6b/market
          test -s data/backtests/rb_stack6b/stack6/stack6_2025_casebook.csv
          test -s data/backtests/rb_stack6b/market/rb_market_casebook.csv

      - name: Evaluate frozen STACK6B protocol
        run: |
          rm -rf data/backtests/rb_stack6b/results
          python scripts/backtest/evaluate_rb_stack6b_compact_role_model.py \
            --stack6-root data/backtests/rb_stack6b/stack6 \
            --market-root data/backtests/rb_stack6b/market \
            --out-dir data/backtests/rb_stack6b/results

      - name: Show results
        if: always()
        run: |
          echo '=== coverage ==='
          cat data/backtests/rb_stack6b/results/stack6b_coverage.csv 2>/dev/null || true
          echo '=== scores ==='
          cat data/backtests/rb_stack6b/results/stack6b_score_table.csv 2>/dev/null || true
          echo '=== gates ==='
          cat data/backtests/rb_stack6b/results/stack6b_retention_gates.csv 2>/dev/null || true
          echo '=== frozen disposition ==='
          cat data/backtests/rb_stack6b/results/stack6b_disposition.csv 2>/dev/null || true
          echo '=== downstream market ==='
          cat data/backtests/rb_stack6b/results/stack6b_market_metrics.csv 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-stack6b-compact-role-model
          path: data/backtests/rb_stack6b/results/**
          if-no-files-found: warn
          retention-days: 30
