name: Research Receiving Semantics Stage2 Source Audit

on:
  push:
    branches:
      - research-public-intent-week3-prospective-v1
    paths:
      - 'docs/research/RECEIVING_RULE_SEMANTICS_INTEGRITY_V1_STAGE2_SOURCE_AUDIT_RUN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build leakage-safe historical sources only
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/build_historical_inputs.py --season 2025 --prior-season 2024 --weeks 1-18
      - name: Audit semantic source availability
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/audit_receiving_semantics_stage2_sources_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: receiving-semantics-stage2-source-audit
          path: outputs/receiving_rule_semantics_stage2_source_audit/
          retention-days: 90
