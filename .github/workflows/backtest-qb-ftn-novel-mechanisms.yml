name: Migration 81 QB FTN Novel Mechanism Development

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/test_qb_ftn_novel_mechanisms.py'
      - 'docs/migrations/M81_QB_FTN_NOVEL_MECHANISM_DEVELOPMENT.md'
      - 'docs/migrations/M81_FROZEN_FEATURE_DICTIONARY.md'
      - 'data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv'
      - '.github/workflows/backtest-qb-ftn-novel-mechanisms.yml'

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: github.head_ref == 'backtest-migration-81-qb-ftn-novel-mechanism-development'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen M81 contract
        run: |
          echo 'M81 is DEVELOPMENT ONLY.'
          echo '2024 outcomes only: Weeks 1-9 fit; Weeks 10-18 holdout.'
          echo '2025 target outcomes are sealed for M82.'
          echo 'Only four M80-qualified FTN families are allowed.'
          echo 'One architecture: StandardScaler + Ridge(alpha=20, fit_intercept=False).'
          echo 'No sportsbook features. No target-game FTN. No model zoo.'
          test -s docs/migrations/M81_QB_FTN_NOVEL_MECHANISM_DEVELOPMENT.md
          test -s docs/migrations/M81_FROZEN_FEATURE_DICTIONARY.md
          CANON=data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv
          echo 'c4a481a760657bb7516d52b9aa9ba84af096063a4e78660b12a541f59fd7b742  '$CANON | sha256sum -c -
          python -m py_compile scripts/backtest/test_qb_ftn_novel_mechanisms.py

  development:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow scikit-learn
      - name: Run frozen M81 development screen
        run: |
          python scripts/backtest/test_qb_ftn_novel_mechanisms.py \
            --canonical data/backtests/qb_frontier_canonical_v3_football_only/qb_frontier_canonical_v3_football_only.csv \
            --out data/backtests/qb_m81
      - name: Verify sealed 2025 and emit results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/backtests/qb_m81/m81_source_contract.json').read_text())
          d=json.loads(Path('data/backtests/qb_m81/m81_survivor_decision.json').read_text())
          assert c['2025_target_outcomes_accessed'] is False
          assert d['2025_target_outcomes_accessed'] is False
          assert c['sportsbook_features_used'] is False
          assert c['target_game_ftn_used'] is False
          assert c['target_season'] == 2024
          print('2025 SEALED: PASS')
          print('--- M81 DEVELOPMENT METRICS ---')
          print(Path('data/backtests/qb_m81/m81_development_metrics.csv').read_text())
          print('--- M81 GATES ---')
          print(Path('data/backtests/qb_m81/m81_gate_table.csv').read_text())
          print('--- M81 DECISION ---')
          print(json.dumps(d, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m81-qb-ftn-development
          path: data/backtests/qb_m81/*
          if-no-files-found: error
