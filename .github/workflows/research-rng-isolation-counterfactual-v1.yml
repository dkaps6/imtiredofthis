name: RNG Isolation Paid Board Counterfactual V1

on:
  push:
    branches:
      - research-specialist-rng-isolation-v1
    paths:
      - 'docs/research/SPECIALIST_RNG_ISOLATION_COUNTERFACTUAL_V1_PLAN.md'
      - 'scripts/research/audit_rng_isolation_counterfactual_v1.py'
      - 'tests/test_rng_isolation_counterfactual_v1.py'
      - '.github/workflows/research-rng-isolation-counterfactual-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_RUN_ID: "36293274478"
  SOURCE_ARTIFACT_ID: "10923570170"
  SOURCE_ARTIFACT_NAME: "run_36293274478"
  SOURCE_ARTIFACT_DIGEST: "sha256:5a3d4f64592c70553e66dd51bb3bff45263d2900f4d270e370353fa60ea1c480"
  PAID_HEAD: "0982b62276303403e2ca58b16e6f4fc3e041f65d"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run focused tests
        run: |
          export PYTHONPATH="${PWD}"
          pytest -q tests/test_rng_isolation_counterfactual_v1.py

      - name: Verify production code remains identical to paid head
        run: |
          set -euo pipefail
          git diff --exit-code "${PAID_HEAD}" --             scripts/simulation_v2.py             scripts/simulation_explicit_entitlement_v1.py             scripts/simulation_c2_qb_candidate.py             scripts/modeling/qb_c2_production_adapter_v1.py             scripts/run_pricing_v2.py             scripts/modeling/discrete_count_alignment_v1.py             scripts/modeling/ensemble_v2.py             scripts/modeling/qb_pass_synthesis_v1.py             scripts/utils/player_identity_v3.py
          echo "PRODUCTION_CODE_IDENTICAL_TO_PAID_HEAD"

      - name: Verify preserved paid artifact authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/source_artifacts.json
          python - <<'PY'
          import json, os
          obj=json.load(open('/tmp/source_artifacts.json',encoding='utf-8'))
          want=int(os.environ['SOURCE_ARTIFACT_ID'])
          m=[a for a in obj.get('artifacts',[]) if int(a.get('id',-1))==want]
          if len(m)!=1:
              raise SystemExit(f'FATAL artifact id {want} found {len(m)} times')
          a=m[0]
          assert a.get('name') == os.environ['SOURCE_ARTIFACT_NAME'], a
          assert a.get('digest') == os.environ['SOURCE_ARTIFACT_DIGEST'], a
          assert not bool(a.get('expired')), a
          print({'id':want,'name':a.get('name'),'digest':a.get('digest'),'expired':a.get('expired')})
          PY

      - name: Download preserved Week-3 paid artifact
        uses: actions/download-artifact@v4
        with:
          name: run_36293274478
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36293274478

      - name: Verify exact source files
        run: |
          set -euo pipefail
          for f in             replay_source/outputs/props_priced_clean.csv             replay_source/data/football_simulation_universe.csv             replay_source/data/target_entitlement_v1_trace.csv             replay_source/data/te_r5p_full_slate_entitlement_trace.csv             replay_source/data/wr_r15_full_slate_entitlement_trace.csv             replay_source/data/te_r5p_full_slate_simulation_delta.csv             replay_source/data/wr_r15_full_slate_simulation_delta.csv             replay_source/data/qb_c2_production_starter_audit.csv             replay_source/data/qb_c2_production_integration_audit.csv             replay_source/data/qb_c2_production_integration_audit.json             replay_source/data/model_rule_simulation_inputs.csv             replay_source/data/model_ensemble_weights.csv             replay_source/data/qb_promoted_team_context.csv             replay_source/data/player_game_logs.csv             replay_source/data/weather_week.csv; do
              test -s "$f"
          done
          echo "PAID_ARTIFACT_COUNTERFACTUAL_SOURCE_READY"

      - name: Install exact paid data state into ephemeral working tree
        run: |
          set -euo pipefail
          rm -rf data
          cp -a replay_source/data data
          echo "EPHEMERAL_PAID_DATA_STATE_READY"

      - name: Run frozen paid-board counterfactual
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          rm -rf data/research/rng_isolation_counterfactual_v1
          python scripts/research/audit_rng_isolation_counterfactual_v1.py             --root replay_source             --out-dir data/research/rng_isolation_counterfactual_v1             --source-run-id "${SOURCE_RUN_ID}"             --source-artifact-id "${SOURCE_ARTIFACT_ID}"             --source-artifact-digest "${SOURCE_ARTIFACT_DIGEST}"

      - name: Display result
        if: always()
        run: |
          for f in             data/research/rng_isolation_counterfactual_v1/result.json             data/research/rng_isolation_counterfactual_v1/candidate_vs_paid_summary.csv; do
              if [ -f "$f" ]; then
                echo "===== $f ====="
                cat "$f"
              fi
          done

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rng-isolation-counterfactual-v1-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/research/rng_isolation_counterfactual_v1/**
