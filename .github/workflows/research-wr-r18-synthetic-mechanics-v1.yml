name: WR R18 Synthetic Mechanics V1

on:
  push:
    branches:
      - research-wr-r18-receiver-target-cpoe-v1
    paths:
      - '.github/workflows/research-wr-r18-synthetic-mechanics-v1.yml'
      - 'scripts/research/evaluate_wr_r18_receiver_target_cpoe_stage_a_v1.py'
      - 'scripts/research/evaluate_wr_r18_receiver_target_cpoe_stage_a_v1b.py'
      - 'scripts/research/test_wr_r18_receiver_target_cpoe_synthetic_v1.py'
      - 'scripts/research/test_wr_r18_receiver_target_cpoe_synthetic_v1b.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-mechanics-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WR-R18 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install synthetic-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Run corrected WR-R18 synthetic mechanics suite
        run: |
          python -m scripts.research.test_wr_r18_receiver_target_cpoe_synthetic_v1b

      - name: Prove no real-data evaluator was run
        run: |
          test ! -d data/backtests/wr_r18_receiver_target_cpoe_v1
          echo 'Synthetic-only gate: PASS; no WR-R18 football result generated.'
