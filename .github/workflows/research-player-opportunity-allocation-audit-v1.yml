name: Research Player Opportunity Allocation Audit V1

on:
  push:
    branches:
      - research-player-opportunity-allocation-audit-v1
    paths:
      - 'docs/research/PLAYER_OPPORTUNITY_ALLOCATION_AUDIT_V1_CONTRACT.md'
      - 'scripts/research/run_player_opportunity_allocation_audit_v1.py'
      - 'tests/test_player_opportunity_allocation_audit_v1.py'
      - '.github/workflows/research-player-opportunity-allocation-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyarrow pyyaml

      - name: Run player-opportunity contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_player_opportunity_allocation_audit_v1.py
          pytest -q tests/test_all_player_all_position_replay_v1.py

      - name: Build leakage-safe Weeks 1-4 historical football inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/player_opportunity_audit
          mkdir -p /tmp/player_opportunity_audit/input /tmp/player_opportunity_audit/parent /tmp/player_opportunity_audit/output
          python - <<'PY'
          from pathlib import Path
          from scripts.backtest.historical_inputs import build_all_historical_inputs
          out = build_all_historical_inputs(
              season=2026,
              prior_season=2025,
              out_dir=Path('/tmp/player_opportunity_audit/input'),
              weeks=range(1, 5),
          )
          print(out)
          PY
          python scripts/backtest/historical_player_logs.py             --seasons 2025,2026             --schedule /tmp/player_opportunity_audit/input/schedule_history.csv             --out /tmp/player_opportunity_audit/input/player_game_logs_history.csv

      - name: Recover frozen parent all-player replay scoreboard
        run: |
          gh run download 37683439543             --repo "${GITHUB_REPOSITORY}"             --name "all-player-all-position-replay-v1-37683439543"             --dir /tmp/player_opportunity_audit/parent
          test -s /tmp/player_opportunity_audit/parent/all_players_point_scoreboard.csv
          python - <<'PY'
          import pandas as pd
          p = pd.read_csv('/tmp/player_opportunity_audit/parent/all_players_point_scoreboard.csv', low_memory=False)
          assert len(p) == 4488, len(p)
          assert set(p['week'].unique()) == {1,2,3,4}
          assert set(p['position_family'].unique()).issuperset({'QB','RB','WR','TE'})
          assert not p['sportsbook_inputs_used_upstream'].astype(bool).any()
          assert not p['rb_week5_room_allocation_shadow_applied'].astype(bool).any()
          print({
              'parent_rows': len(p),
              'parent_player_weeks': p[['week','team','player_clean_key']].drop_duplicates().shape[0],
          })
          PY

      - name: Run frozen individual-player opportunity audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/run_player_opportunity_allocation_audit_v1.py             --player-logs /tmp/player_opportunity_audit/input/player_game_logs_history.csv             --team-weekly /tmp/player_opportunity_audit/input/team_weekly_history.csv             --schedule /tmp/player_opportunity_audit/input/schedule_history.csv             --universe-dir /tmp/player_opportunity_audit/input/pregame_universe             --point-scoreboard /tmp/player_opportunity_audit/parent/all_players_point_scoreboard.csv             --iterations 5000             --out-dir /tmp/player_opportunity_audit/output

      - name: Certify player-opportunity audit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/player_opportunity_audit/output')
          required = [
              'player_opportunity_allocation_rows.csv',
              'player_opportunity_allocation_summary.csv',
              'player_opportunity_zero_state_audit.csv',
              'player_opportunity_audit_summary.json',
          ]
          for name in required:
              p = root / name
              assert p.exists() and p.stat().st_size > 0, name

          s = json.loads((root / 'player_opportunity_audit_summary.json').read_text())
          r = pd.read_csv(root / 'player_opportunity_allocation_rows.csv', low_memory=False)
          m = pd.read_csv(root / 'player_opportunity_allocation_summary.csv', low_memory=False)
          z = pd.read_csv(root / 'player_opportunity_zero_state_audit.csv', low_memory=False)

          assert s['version'] == 'PLAYER_OPPORTUNITY_ALLOCATION_AUDIT_V1', s
          assert s['season'] == 2026 and s['weeks'] == [1,2,3,4], s
          assert s['parameters_fit'] == 0, s
          assert s['automatic_promotion'] is False, s
          assert s['sportsbook_inputs_used_upstream'] is False, s
          assert s['paid_odds_api_used'] is False, s
          assert s['rb_week5_room_shadow_rows'] == 0, s

          assert set(r['week'].unique()) == {1,2,3,4}
          assert set(r['position_family'].unique()).issuperset({'QB','RB','WR','TE'})
          assert set(r['opportunity_type'].unique()) == {'pass_attempts','carries','targets'}
          assert not r['sportsbook_inputs_used_upstream'].astype(bool).any()
          assert not r['rb_week5_room_allocation_shadow_applied'].astype(bool).any()
          assert r['predicted_opportunities'].ge(0).all()
          assert r['actual_opportunities'].ge(0).all()
          assert r['allocation_sampling_delta'].abs().max() <= 0.25
          assert not r.duplicated(
              ['season','week','event_id','team','player_clean_key','opportunity_type']
          ).any()

          overall = m.loc[m['actual_opportunity_bin'].eq('ALL')]
          expected = {
              ('QB','pass_attempts'),
              ('RB','carries'),
              ('RB','targets'),
              ('WR','targets'),
              ('TE','targets'),
          }
          got = set(zip(overall['position_family'], overall['opportunity_type']))
          assert expected.issubset(got), got

          assert {'zero_precision_pred_lt_0_5','zero_recall_pred_lt_0_5',
                  'zero_precision_pred_lt_1_0','zero_recall_pred_lt_1_0'}.issubset(z.columns)

          print(json.dumps({
              'rows': len(r),
              'unique_player_weeks': s['unique_player_weeks'],
              'max_abs_allocation_sampling_delta': s['max_abs_allocation_sampling_delta'],
              'overall': overall[[
                  'position_family','opportunity_type','rows','mae','signed_bias',
                  'prediction_actual_pearson','actual_zero_rate',
                  'mean_prediction_when_actual_zero',
                  'opportunity_error_vs_linked_yards_error_pearson'
              ]].to_dict('records'),
          }, indent=2, sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/utils/audit_repo.py --strict

      - name: Display audit summary
        if: always()
        run: |
          cat /tmp/player_opportunity_audit/output/player_opportunity_audit_summary.json || true

      - name: Upload player-opportunity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-opportunity-allocation-audit-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/player_opportunity_audit/output/**
