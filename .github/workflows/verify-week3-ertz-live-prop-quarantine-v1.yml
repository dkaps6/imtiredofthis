name: Verify Week-3 Ertz Live-Prop Quarantine V1

on:
  push:
    branches:
      - fix-week3-zach-ertz-live-prop-quarantine-v1
    paths:
      - 'data/manual_prop_quarantine.csv'
      - '.github/workflows/verify-week3-ertz-live-prop-quarantine-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Restore exact failed paid Full Slate artifact
        uses: actions/download-artifact@v4
        with:
          name: run_36292654942
          path: replay_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36292654942
      - name: Re-run live prop identity repair with branch quarantine
        run: |
          set -euo pipefail
          rm -rf data outputs
          mkdir -p data outputs
          cp -a replay_source/data/. data/
          cp -a replay_source/outputs/. outputs/
          git show HEAD:data/manual_prop_quarantine.csv > data/manual_prop_quarantine.csv
          export PYTHONPATH="${PWD}"
          python scripts/repair_live_prop_identity_v1.py
          python - <<'PY'
          import json, pandas as pd
          s=json.load(open('data/live_prop_identity_status.json',encoding='utf-8'))
          assert s['disposition']=='LIVE_PROP_IDENTITY_READY', s
          assert int(s['core_unresolved_rows'])==0, s
          assert int(s['manual_prop_quarantine_rows_removed']['compact']) >= 3, s
          props=pd.read_csv('outputs/props_raw.csv',low_memory=False)
          pcol=next(c for c in ('canonical_player_name','player_canonical','player') if c in props.columns)
          assert not props[pcol].fillna('').astype(str).eq('Zach Ertz').any()
          print('ERTZ_LIVE_PROP_QUARANTINE_OFFLINE_REPLAY_PASS', json.dumps(s,sort_keys=True))
          PY
