name: RB R27B V2 Novel Efficiency Context

on:
  push:
    branches:
      - research-rb-r27b-v2-novel-efficiency-context
    paths:
      - 'docs/research/RB_R27B_V2_NOVEL_EFFICIENCY_CONTEXT_IMPLEMENTATION_LOCK.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONPATH: ${{ github.workspace }}
  PRODUCTION_BASE_SHA: bb76ba9eabb08e2f0875a9af49301c3877f4141f
  R27_PLAN_BLOB: 88c1377acc2e5389df092ec74ab876eaed468cdd
  R27B_SOURCE_AUDIT_BLOB: cae5da5bf13dadb81aff65005845793e679d5fd2
  R27B_BUILDER_BLOB: 10661d1cf6463124a886b5802fe5869b7ac34403
  R27B_EVALUATOR_BLOB: 80a450e22cd111c3982858c341035ea9513d1cb1
  R27B_FINALIZER_BLOB: f6b774212e74d1a27bddcf4d820620c5badf2c71
  R25_PARENT_BLOB: 93da760073059d68c6481b212a906c68734089e3
  R25_PLAYER_LOG_BLOB: b993bd46fd44c88785bb37344c756c51b5d39afa
  R26_PARENT_BLOB: 17170baa072bcc3157dee03c7a0de75297060e71
  R26_TRANSITION_BLOB: 7459dc8a48a0c5e58e14b358ec4a9b0cd19eb959
  R26_IDENTITY_RUNTIME_BLOB: 688d1b64fff78a588b1cd86af27654008b55cf26
  R27_EVALUATOR_BLOB: a284592a0b2f948b8f12f973ca9eb7d9c08d6b23
  R27_FINALIZER_BLOB: 4f8bf99b25210e8c88a6c8c4511ff9d565d47652
  R27_SCHEDULE_STAGE_BLOB: 6a32fcb6cabfcba458b35ab43c029f04d5d62df0
  R27_PARENT_RUN: '34423546037'
  R27_PARENT_ARTIFACT_ID: '10132290573'
  R27_PARENT_ARTIFACT_NAME: rb-r27-receiving-yard-mean-decomposition-v1
  R27_PARENT_DIGEST: sha256:cd5c9e26efa44c47ef3374e4deefe9038dc504c155799b48548ad64746e10e45

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pyyaml scipy scikit-learn

      - name: Verify frozen plan, implementation lock, code and parent mechanisms
        run: |
          set -euo pipefail
          for F in \
            docs/research/RB_R27B_V2_NOVEL_EFFICIENCY_CONTEXT_FROZEN_PLAN.md \
            docs/research/RB_R27B_V2_NOVEL_EFFICIENCY_CONTEXT_IMPLEMENTATION_LOCK.md \
            scripts/backtest/audit_rb_r27b_v2_novel_efficiency_sources.py \
            scripts/backtest/build_rb_r27b_v2_novel_efficiency_dataset.py \
            scripts/backtest/evaluate_rb_r27b_v2_novel_efficiency_context.py \
            scripts/backtest/finalize_rb_r27b_v2_novel_efficiency_context.py \
            scripts/backtest/evaluate_rb_r25_receptions_specialist_v1.py \
            scripts/backtest/historical_player_logs.py \
            scripts/backtest/evaluate_rb_r26_vacancy_gated_r9_v1.py \
            scripts/backtest/audit_rb_r26_safe_transition_state_v1.py \
            scripts/backtest/evaluate_rb_r27_receiving_yard_mean_decomposition_v1.py \
            scripts/backtest/finalize_rb_r27_receiving_yard_mean_decomposition_v1.py \
            scripts/backtest/stage_r27_regular_schedule_for_player_logs_v1.py \
            scripts/modeling/rb_receiving_identity_runtime_v1.py; do
            test -s "$F"
          done

          test "$(git hash-object docs/research/RB_R27B_V2_NOVEL_EFFICIENCY_CONTEXT_FROZEN_PLAN.md)" = "$R27_PLAN_BLOB"
          test "$(git hash-object scripts/backtest/audit_rb_r27b_v2_novel_efficiency_sources.py)" = "$R27B_SOURCE_AUDIT_BLOB"
          test "$(git hash-object scripts/backtest/build_rb_r27b_v2_novel_efficiency_dataset.py)" = "$R27B_BUILDER_BLOB"
          test "$(git hash-object scripts/backtest/evaluate_rb_r27b_v2_novel_efficiency_context.py)" = "$R27B_EVALUATOR_BLOB"
          test "$(git hash-object scripts/backtest/finalize_rb_r27b_v2_novel_efficiency_context.py)" = "$R27B_FINALIZER_BLOB"
          test "$(git hash-object scripts/backtest/evaluate_rb_r25_receptions_specialist_v1.py)" = "$R25_PARENT_BLOB"
          test "$(git hash-object scripts/backtest/historical_player_logs.py)" = "$R25_PLAYER_LOG_BLOB"
          test "$(git hash-object scripts/backtest/evaluate_rb_r26_vacancy_gated_r9_v1.py)" = "$R26_PARENT_BLOB"
          test "$(git hash-object scripts/backtest/audit_rb_r26_safe_transition_state_v1.py)" = "$R26_TRANSITION_BLOB"
          test "$(git hash-object scripts/modeling/rb_receiving_identity_runtime_v1.py)" = "$R26_IDENTITY_RUNTIME_BLOB"
          test "$(git hash-object scripts/backtest/evaluate_rb_r27_receiving_yard_mean_decomposition_v1.py)" = "$R27_EVALUATOR_BLOB"
          test "$(git hash-object scripts/backtest/finalize_rb_r27_receiving_yard_mean_decomposition_v1.py)" = "$R27_FINALIZER_BLOB"
          test "$(git hash-object scripts/backtest/stage_r27_regular_schedule_for_player_logs_v1.py)" = "$R27_SCHEDULE_STAGE_BLOB"

          python -m py_compile \
            scripts/backtest/build_rb_r27b_v2_novel_efficiency_dataset.py \
            scripts/backtest/evaluate_rb_r27b_v2_novel_efficiency_context.py \
            scripts/backtest/finalize_rb_r27b_v2_novel_efficiency_context.py

          sha256sum docs/research/RB_R27B_V2_NOVEL_EFFICIENCY_CONTEXT_FROZEN_PLAN.md | tee r27b_v2_plan.sha256
          sha256sum docs/research/RB_R27B_V2_NOVEL_EFFICIENCY_CONTEXT_IMPLEMENTATION_LOCK.md | tee r27b_v2_lock.sha256
          sha256sum \
            scripts/backtest/build_rb_r27b_v2_novel_efficiency_dataset.py \
            scripts/backtest/evaluate_rb_r27b_v2_novel_efficiency_context.py \
            scripts/backtest/finalize_rb_r27b_v2_novel_efficiency_context.py | tee r27b_v2_code.sha256

          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/run_pricing_with_full_roster_universe_v5_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml
          echo PASS > r27b_v2_protected_clean.txt
          echo R27B_V2_FROZEN_CODE_AND_PRODUCTION_BOUNDARY_PASS

      - name: Download and verify exact R27 scientific parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OBSERVED_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R27_PARENT_ARTIFACT_ID}" --jq .digest)"
          test "$OBSERVED_DIGEST" = "$R27_PARENT_DIGEST"
          rm -rf data/r27_exact_parent_artifact
          mkdir -p data/r27_exact_parent_artifact
          gh run download "$R27_PARENT_RUN" --repo "$GITHUB_REPOSITORY" --name "$R27_PARENT_ARTIFACT_NAME" --dir data/r27_exact_parent_artifact
          test -s data/r27_exact_parent_artifact/data/backtests/r27_rec_yard_mean_final/r27_disposition.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/r27_exact_parent_artifact/data/backtests/r27_rec_yard_mean_final/r27_disposition.json')
          d=json.loads(p.read_text())
          assert d['disposition']=='R27_R26_OPPORTUNITY_TRANSLATION_MIXED_OR_FAIL', d
          assert int(d['gate_count'])==27 and int(d['gate_pass_count'])==24, d
          assert d['gates']['27_vacancy_rec_yard_mae_improves_at_least_0_50pct'] is True
          print('R27B_V2_EXACT_R27_PARENT_ARTIFACT_PASS')
          PY

      - name: Stage exact R26/R27 parent fold outputs from preserved artifact
        run: |
          set -euo pipefail
          mkdir -p data/backtests
          for TEST in 2020 2021 2022 2023 2024 2025; do
            SRC26="data/r27_exact_parent_artifact/data/backtests/r27_r26_parent_${TEST}"
            SRC27="data/r27_exact_parent_artifact/data/backtests/r27_rec_yard_mean_${TEST}"
            test -s "$SRC26/r26_predictions.csv"
            test -s "$SRC27/r27_player_predictions.csv"
            rm -rf "data/backtests/r27b_r26_parent_${TEST}" "data/backtests/r27b_r27_parent_${TEST}"
            cp -R "$SRC26" "data/backtests/r27b_r26_parent_${TEST}"
            cp -R "$SRC27" "data/backtests/r27b_r27_parent_${TEST}"
          done

      - name: Build historical football bundles 2019-2025 for strict-prior context
        run: |
          set -euo pipefail
          for SEASON in 2019 2020 2021 2022 2023 2024 2025; do
            PRIOR=$((SEASON-1))
            if [ "$SEASON" -le 2020 ]; then WEEKS='1-17'; else WEEKS='1-18'; fi
            D="data/r27b_hist_${SEASON}"
            rm -rf "$D"
            python scripts/backtest/build_historical_inputs.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" --out-dir "$D"
            python scripts/backtest/enrich_historical_defense.py \
              --team-weekly "$D/team_weekly_history.csv" --seasons "$PRIOR,$SEASON" \
              --audit "$D/historical_defense_enrichment_audit.csv" \
              --observations "$D/historical_defense_observations.csv"
            python scripts/backtest/validate_historical_inputs.py \
              --season "$SEASON" --prior-season "$PRIOR" --weeks "$WEEKS" \
              --data-dir "$D" --report "$D/historical_input_validation.csv"
            python scripts/backtest/stage_r27_regular_schedule_for_player_logs_v1.py \
              --schedule "$D/schedule_history.csv" --seasons "$PRIOR,$SEASON" \
              --out "$D/schedule_history_player_logs_reg.csv" \
              --audit "$D/r27_player_log_schedule_scope_audit.json"
            python scripts/backtest/historical_player_logs.py \
              --seasons "$PRIOR,$SEASON" --schedule "$D/schedule_history_player_logs_reg.csv" \
              --out "$D/player_game_logs_history.csv"
            python scripts/backtest/build_historical_injuries.py \
              --seasons "$PRIOR,$SEASON" --out "$D/injuries_history.csv"
            python scripts/backtest/build_historical_weather.py \
              --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"
          done

      - name: Build frozen novel-context dataset
        run: |
          rm -rf data/backtests/r27b_v2_dataset
          python scripts/backtest/build_rb_r27b_v2_novel_efficiency_dataset.py \
            --hist-root data \
            --r26-root data/backtests \
            --out-dir data/backtests/r27b_v2_dataset

      - name: Evaluate all six frozen outer folds
        run: |
          set -euo pipefail
          for TEST in 2020 2021 2022 2023 2024 2025; do
            OUT="data/backtests/r27b_v2_${TEST}"
            rm -rf "$OUT"
            python scripts/backtest/evaluate_rb_r27b_v2_novel_efficiency_context.py \
              --test-season "$TEST" \
              --dataset-dir data/backtests/r27b_v2_dataset \
              --r27-dir "data/backtests/r27b_r27_parent_${TEST}" \
              --out-dir "$OUT"
          done

      - name: Apply all 31 frozen R27B V2 gates
        run: |
          python scripts/backtest/finalize_rb_r27b_v2_novel_efficiency_context.py \
            --dirs \
              data/backtests/r27b_v2_2020 \
              data/backtests/r27b_v2_2021 \
              data/backtests/r27b_v2_2022 \
              data/backtests/r27b_v2_2023 \
              data/backtests/r27b_v2_2024 \
              data/backtests/r27b_v2_2025 \
            --protected-clean-marker r27b_v2_protected_clean.txt \
            --out-dir data/backtests/r27b_v2_final

      - name: Assert integrity gates only and show disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/backtests/r27b_v2_final/r27b_v2_disposition.json').read_text())
          integrity={k:v for k,v in d['gates'].items() if int(k[:2]) <= 15}
          assert len(integrity)==15, integrity
          assert all(integrity.values()), integrity
          print('R27B_V2_INTEGRITY_GATES_PASS')
          print('scientific_disposition=', d['disposition'])
          print('gate_pass_count=', d['gate_pass_count'], '/', d['gate_count'])
          PY
          cat data/backtests/r27b_v2_final/r27b_v2_disposition.json

      - name: Upload exact first-result evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r27b-v2-novel-efficiency-context
          retention-days: 90
          path: |
            r27b_v2_plan.sha256
            r27b_v2_lock.sha256
            r27b_v2_code.sha256
            r27b_v2_protected_clean.txt
            data/backtests/r27b_v2_dataset/*
            data/r27b_hist_*/historical_input_validation.csv
            data/r27b_hist_*/r27_player_log_schedule_scope_audit.json
            data/backtests/r27b_r26_parent_2020/*
            data/backtests/r27b_r26_parent_2021/*
            data/backtests/r27b_r26_parent_2022/*
            data/backtests/r27b_r26_parent_2023/*
            data/backtests/r27b_r26_parent_2024/*
            data/backtests/r27b_r26_parent_2025/*
            data/backtests/r27b_r27_parent_2020/*
            data/backtests/r27b_r27_parent_2021/*
            data/backtests/r27b_r27_parent_2022/*
            data/backtests/r27b_r27_parent_2023/*
            data/backtests/r27b_r27_parent_2024/*
            data/backtests/r27b_r27_parent_2025/*
            data/backtests/r27b_v2_2020/*
            data/backtests/r27b_v2_2021/*
            data/backtests/r27b_v2_2022/*
            data/backtests/r27b_v2_2023/*
            data/backtests/r27b_v2_2024/*
            data/backtests/r27b_v2_2025/*
            data/backtests/r27b_v2_final/*
