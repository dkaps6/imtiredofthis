name: Research Football Matchup Transmission Phase B-C V1

on:
  push:
    branches:
      - research-football-matchup-transmission-v1
    paths:
      - 'docs/research/FOOTBALL_MATCHUP_TRANSMISSION_V1_PHASE_BC_METHODS.md'
      - 'scripts/research/audit_football_matchup_transmission_phase_bc_v1.py'
      - 'tests/test_football_matchup_transmission_phase_bc_v1.py'
      - '.github/workflows/research-football-matchup-transmission-phase-bc-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy scipy pytest pyyaml pyarrow tabulate

      - name: Run frozen Phase B-C safeguard tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_football_matchup_transmission_phase_bc_v1.py

      - name: Create isolated research workspace
        run: |
          set -euo pipefail
          rm -rf /tmp/hist_2024 /tmp/hist_2025 /tmp/matchup
          mkdir -p /tmp/hist_2024 /tmp/hist_2025 \
                   /tmp/matchup/ref/right_tail /tmp/matchup/ref/qb \
                   /tmp/matchup/work /tmp/matchup/result

      - name: Download frozen right-tail football-only authority
        uses: actions/download-artifact@v4
        with:
          name: distribution-right-tail-asymmetry-v1-37493425352
          path: /tmp/matchup/ref/right_tail
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37493425352

      - name: Download frozen M89-M90 football-only QB control authority
        uses: actions/download-artifact@v4
        with:
          name: qb-m89-opportunity-efficiency-decomposition-v1
          path: /tmp/matchup/ref/qb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36330107392

      - name: Resolve and verify frozen authority files
        run: |
          set -euo pipefail
          RIGHT_TAIL_DETAIL="$(find /tmp/matchup/ref/right_tail -type f -name 'distribution_right_tail_asymmetry_detail.csv' -print -quit)"
          QB_CONTROL_TRACE="$(find /tmp/matchup/ref/qb -type f -name 'qb_m89_opp_eff_player_trace.csv' -print -quit)"
          test -n "${RIGHT_TAIL_DETAIL}" && test -s "${RIGHT_TAIL_DETAIL}"
          test -n "${QB_CONTROL_TRACE}" && test -s "${QB_CONTROL_TRACE}"
          echo "RIGHT_TAIL_DETAIL=${RIGHT_TAIL_DETAIL}" >> "${GITHUB_ENV}"
          echo "QB_CONTROL_TRACE=${QB_CONTROL_TRACE}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import pandas as pd, os
          rt = pd.read_csv(os.environ["RIGHT_TAIL_DETAIL"], nrows=5)
          qb = pd.read_csv(os.environ["QB_CONTROL_TRACE"], nrows=5)
          need_rt = {"season","week","game_id","team","opponent","player_clean_key","market","actual","final_mean"}
          need_qb = {"season","week","team","player_clean_key","actual_pass_yards","football_synthesis"}
          if not need_rt.issubset({str(c).lower() for c in rt.columns}):
              raise RuntimeError("right-tail authority schema drift")
          if not need_qb.issubset({str(c).lower() for c in qb.columns}):
              raise RuntimeError("M89/M90 control authority schema drift")
          print("FROZEN_AUTHORITY_FILES_RESOLVED")
          PY

      - name: Build leakage-safe historical source inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/backtest/build_historical_inputs.py \
            --season 2024 --prior-season 2023 --weeks 1-18 \
            --out-dir /tmp/hist_2024
          python scripts/backtest/build_historical_inputs.py \
            --season 2025 --prior-season 2024 --weeks 1-18 \
            --out-dir /tmp/hist_2025

      - name: Combine schedule and team-week history
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          out = Path("/tmp/matchup/work")
          for name in ["schedule_history.csv", "team_weekly_history.csv"]:
              parts = [
                  pd.read_csv("/tmp/hist_2024/" + name),
                  pd.read_csv("/tmp/hist_2025/" + name),
              ]
              x = pd.concat(parts, ignore_index=True)
              keys = ["season", "week", "team"]
              x = x.sort_values(keys).drop_duplicates(keys, keep="last").reset_index(drop=True)
              if x.duplicated(keys).any():
                  raise RuntimeError(f"duplicate combined historical rows in {name}")
              seasons = sorted(pd.to_numeric(x["season"], errors="coerce").dropna().astype(int).unique().tolist())
              if not {2023, 2024, 2025}.issubset(set(seasons)):
                  raise RuntimeError(f"historical seasons incomplete in {name}: {seasons}")
              x.to_csv(out / name, index=False)
              print(name, len(x), seasons)
          PY

      - name: Apply exact M89-M90 historical team semantics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/backtest/correct_m89_team_semantics.py \
            --team-weekly /tmp/matchup/work/team_weekly_history.csv \
            --seasons 2023,2024,2025 \
            --observations /tmp/matchup/work/m89_team_semantics_observations.csv \
            --audit /tmp/matchup/work/m89_team_semantics_audit.csv

      - name: Recover historical box and coverage diagnostics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/backtest/enrich_historical_defense.py \
            --team-weekly /tmp/matchup/work/team_weekly_history.csv \
            --seasons 2023,2024,2025 \
            --audit /tmp/matchup/work/historical_defense_enrichment_audit.csv \
            --observations /tmp/matchup/work/historical_defense_observations.csv

      - name: Build canonical historical player logs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/backtest/historical_player_logs.py \
            --seasons 2023,2024,2025 \
            --schedule /tmp/matchup/work/schedule_history.csv \
            --out /tmp/matchup/work/player_game_logs_history.csv

      - name: Run frozen Phase B-C residual audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/research/audit_football_matchup_transmission_phase_bc_v1.py \
            --right-tail-detail "${RIGHT_TAIL_DETAIL}" \
            --qb-control-trace "${QB_CONTROL_TRACE}" \
            --team-weekly /tmp/matchup/work/team_weekly_history.csv \
            --player-logs /tmp/matchup/work/player_game_logs_history.csv \
            --schedule /tmp/matchup/work/schedule_history.csv \
            --out-dir /tmp/matchup/result

      - name: Verify frozen research contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("/tmp/matchup/result/football_matchup_phase_bc_result.json").read_text())
          assert p["evaluation_seasons"] == [2024, 2025], p
          assert p["evaluation_weeks"] == [2, 18], p
          assert p["sportsbook_inputs_used"] == 0, p
          assert p["candidate_models_fit"] == 0, p
          assert p["production_changed"] is False, p
          assert p["phase_a_rerun"] is False, p
          assert p["qb_control_reopens_closed_family"] is False, p
          assert p["m95_generic_rb_matchup_reopened"] is False, p
          print("FOOTBALL_MATCHUP_TRANSMISSION_PHASE_BC_CONTRACT_CERTIFIED")
          PY

      - name: Display Phase B-C result
        if: always()
        run: |
          cat /tmp/matchup/result/football_matchup_phase_bc_result.json || true
          echo
          cat /tmp/matchup/result/football_matchup_phase_bc_summary.csv || true
          echo
          cat /tmp/matchup/result/football_matchup_phase_bc_source_readiness.csv || true

      - name: Upload frozen Phase B-C research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-matchup-transmission-phase-bc-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/matchup/result/**
            /tmp/matchup/work/m89_team_semantics_audit.csv
            /tmp/matchup/work/historical_defense_enrichment_audit.csv
            /tmp/matchup/work/historical_defense_observations.csv
