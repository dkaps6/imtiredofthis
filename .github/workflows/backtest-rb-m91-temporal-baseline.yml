name: M91 RB Temporal Baseline

on:
  push:
    branches:
      - research-rb-m91-temporal-baseline
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  rb-temporal-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy pytest pyyaml scikit-learn joblib

      - name: Validate M91 evaluator
        run: |
          python -m py_compile scripts/backtest/evaluate_rb_temporal.py

      - name: Build 2024 leakage-safe inputs
        run: |
          D=data/backtests/rb_m91/2024
          python scripts/backtest/build_historical_inputs.py \
            --season 2024 --prior-season 2023 --weeks '1-18' --out-dir "$D"
          python scripts/backtest/enrich_historical_defense.py \
            --team-weekly "$D/team_weekly_history.csv" \
            --seasons 2023,2024 \
            --audit "$D/historical_defense_enrichment_audit.csv" \
            --observations "$D/historical_defense_observations.csv"
          python scripts/backtest/validate_historical_inputs.py \
            --season 2024 --prior-season 2023 --weeks '1-18' \
            --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py \
            --seasons 2023,2024 --schedule "$D/schedule_history.csv" \
            --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py \
            --seasons 2023,2024 --out "$D/injuries_history.csv"
          python scripts/backtest/build_historical_weather.py \
            --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

      - name: Score 2024 prospectively from 2023 history
        run: |
          D=data/backtests/rb_m91/2024
          rm -f "$D/component_predictions.csv"
          python scripts/backtest/walk_forward.py \
            --season 2024 --prior-season 2023 --weeks '1-18' \
            --player-logs "$D/player_game_logs_history.csv" \
            --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" \
            --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" \
            --weather "$D/weather_history.csv" \
            --out "$D/component_predictions.csv" \
            --iterations 2000

      - name: Build 2025 leakage-safe inputs
        run: |
          D=data/backtests/rb_m91/2025
          python scripts/backtest/build_historical_inputs.py \
            --season 2025 --prior-season 2024 --weeks '1-18' --out-dir "$D"
          python scripts/backtest/enrich_historical_defense.py \
            --team-weekly "$D/team_weekly_history.csv" \
            --seasons 2024,2025 \
            --audit "$D/historical_defense_enrichment_audit.csv" \
            --observations "$D/historical_defense_observations.csv"
          python scripts/backtest/validate_historical_inputs.py \
            --season 2025 --prior-season 2024 --weeks '1-18' \
            --data-dir "$D" --report "$D/historical_input_validation.csv"
          python scripts/backtest/historical_player_logs.py \
            --seasons 2024,2025 --schedule "$D/schedule_history.csv" \
            --out "$D/player_game_logs_history.csv"
          python scripts/backtest/build_historical_injuries.py \
            --seasons 2024,2025 --out "$D/injuries_history.csv"
          python scripts/backtest/build_historical_weather.py \
            --schedule "$D/schedule_history.csv" --out "$D/weather_history.csv"

      - name: Score 2025 prospectively from 2024 history
        run: |
          D=data/backtests/rb_m91/2025
          rm -f "$D/component_predictions.csv"
          python scripts/backtest/walk_forward.py \
            --season 2025 --prior-season 2024 --weeks '1-18' \
            --player-logs "$D/player_game_logs_history.csv" \
            --team-weekly "$D/team_weekly_history.csv" \
            --schedule "$D/schedule_history.csv" \
            --universe-dir "$D/pregame_universe" \
            --injuries "$D/injuries_history.csv" \
            --weather "$D/weather_history.csv" \
            --out "$D/component_predictions.csv" \
            --iterations 2000

      - name: Evaluate RB temporal baseline and bell-cow slices
        run: |
          python scripts/backtest/evaluate_rb_temporal.py \
            --predictions \
              data/backtests/rb_m91/2024/component_predictions.csv \
              data/backtests/rb_m91/2025/component_predictions.csv \
            --out-dir data/backtests/rb_m91/evaluation

      - name: Show M91 headline results
        if: always()
        run: |
          echo '=== RB temporal summary ==='
          cat data/backtests/rb_m91/evaluation/rb_temporal_summary.csv 2>/dev/null || true
          echo '=== RB workload share summary ==='
          cat data/backtests/rb_m91/evaluation/rb_workload_share_summary.csv 2>/dev/null || true
          echo '=== RB1 leader summary ==='
          cat data/backtests/rb_m91/evaluation/rb1_leader_summary.csv 2>/dev/null || true

      - name: Upload M91 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-91-rb-temporal-baseline
          path: data/backtests/rb_m91/**
          if-no-files-found: warn
          retention-days: 14
