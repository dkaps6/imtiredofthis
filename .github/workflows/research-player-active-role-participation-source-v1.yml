name: Research Player Active Role Participation Source Audit V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - "docs/research/PLAYER_ACTIVE_ROLE_PARTICIPATION_V1_SOURCE_AUDIT.md"
      - "scripts/research/audit_player_active_role_participation_v1.py"
      - "tests/test_player_active_role_participation_v1.py"
      - ".github/workflows/research-player-active-role-participation-source-v1.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow nflreadpy

      - name: Run frozen safeguards
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_player_active_role_participation_v1.py
          pytest -q tests/test_player_active_role_participation_v1.py

      - name: Run frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf /tmp/player_active_role
          mkdir -p /tmp/player_active_role
          python scripts/research/audit_player_active_role_participation_v1.py             --inactives data/backtests/qb_m78_official_inactives_corrected/m78_corrected_candidate_teamweek.csv             --out-dir /tmp/player_active_role

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/player_active_role/player_active_role_participation_source_result.json'))
          assert p['version']=='PLAYER_ACTIVE_ROLE_PARTICIPATION_V1_SOURCE_AUDIT',p
          assert p['disposition'] in {
            'PLAYER_ACTIVE_ROLE_PARTICIPATION_SOURCE_READY_ALL',
            'PLAYER_ACTIVE_ROLE_PARTICIPATION_SOURCE_READY_PARTIAL',
            'PLAYER_ACTIVE_ROLE_PARTICIPATION_SOURCE_BLOCKED',
          },p
          assert set(p['position_dispositions'])=={'QB','RB','WR','TE'},p
          assert p['m78_teamweek_rows']==1088,p
          assert p['target_game_snap_result_used_as_predictor']==0,p
          assert p['predictive_models_fit']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['outcomes_2026_read']==0,p
          assert p['projection_values_changed']==0,p
          assert p['production_changed'] is False,p
          print('PLAYER_ACTIVE_ROLE_PARTICIPATION_SOURCE_BOUNDARY_PASS')
          PY

      - name: Show result
        if: always()
        run: |
          cat /tmp/player_active_role/player_active_role_participation_source_result.json 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-active-role-participation-source-v1-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/player_active_role/**
            docs/research/PLAYER_ACTIVE_ROLE_PARTICIPATION_V1_SOURCE_AUDIT.md
