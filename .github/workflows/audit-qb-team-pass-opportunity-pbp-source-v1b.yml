name: QB Team Pass Opportunity PBP Source Audit V1B

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-team-pass-opportunity-pbp-source-audit-v1b
    paths:
      - ".github/workflows/audit-qb-team-pass-opportunity-pbp-source-v1b.yml"
      - "scripts/backtest/audit_qb_team_pass_opportunity_pbp_sources_v1b.py"
      - "docs/migrations/QB_TEAM_PASS_OPPORTUNITY_PBP_SOURCE_AUDIT_V1B_PLAN.md"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy
      - name: Compile frozen auditor
        run: python -m py_compile scripts/backtest/audit_qb_team_pass_opportunity_pbp_sources_v1b.py
      - name: Download immutable M89 target-key artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/m89
          gh run download 33331073376 --repo "${GITHUB_REPOSITORY}" --name m89-qb-data-integrity-casebook-synthesis --dir evidence/m89
      - name: Run frozen V1B source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/qb_team_pass_opportunity_pbp_source_audit_v1b
          python scripts/backtest/audit_qb_team_pass_opportunity_pbp_sources_v1b.py \
            --m89-root evidence/m89 \
            --out-dir data/backtests/qb_team_pass_opportunity_pbp_source_audit_v1b
      - name: Show result
        if: always()
        run: cat data/backtests/qb_team_pass_opportunity_pbp_source_audit_v1b/qb_team_pass_opportunity_pbp_source_audit_v1b_result.json 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-team-pass-opportunity-pbp-source-audit-v1b
          path: |
            data/backtests/qb_team_pass_opportunity_pbp_source_audit_v1b/*
            docs/migrations/QB_TEAM_PASS_OPPORTUNITY_PBP_SOURCE_AUDIT_V1B_PLAN.md
          if-no-files-found: warn
          retention-days: 30
