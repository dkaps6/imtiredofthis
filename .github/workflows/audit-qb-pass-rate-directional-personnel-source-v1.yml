name: QB Pass Rate Directional Personnel Source Audit V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-qb-pass-rate-directional-personnel-source-audit-v1
    paths:
      - ".github/workflows/audit-qb-pass-rate-directional-personnel-source-v1.yml"
      - "scripts/backtest/audit_qb_pass_rate_directional_personnel_source_v1.py"
      - "docs/migrations/QB_PASS_RATE_DIRECTIONAL_PERSONNEL_SOURCE_AUDIT_V1_PLAN.md"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy beautifulsoup4 lxml
      - name: Compile frozen auditor
        run: python -m py_compile scripts/backtest/audit_qb_pass_rate_directional_personnel_source_v1.py
      - name: Run frozen source/provenance audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf data/backtests/qb_pass_rate_directional_personnel_source_audit_v1
          python scripts/backtest/audit_qb_pass_rate_directional_personnel_source_v1.py \
            --m78 data/backtests/qb_m78_official_inactives_corrected/m78_corrected_candidate_teamweek.csv \
            --out-dir data/backtests/qb_pass_rate_directional_personnel_source_audit_v1
      - name: Show result
        if: always()
        run: cat data/backtests/qb_pass_rate_directional_personnel_source_audit_v1/directional_personnel_source_result.json 2>/dev/null || true
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-pass-rate-directional-personnel-source-v1
          path: |
            data/backtests/qb_pass_rate_directional_personnel_source_audit_v1/*
            docs/migrations/QB_PASS_RATE_DIRECTIONAL_PERSONNEL_SOURCE_AUDIT_V1_PLAN.md
          if-no-files-found: warn
          retention-days: 30
