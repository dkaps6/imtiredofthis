name: Migration 70 QB Extreme YPA Mechanism Autopsy

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest/audit_qb_extreme_ypa_mechanisms.py'
      - 'scripts/backtest/run_qb_extreme_ypa_mechanisms_official_attempts.py'
      - '.github/workflows/backtest-qb-extreme-ypa-mechanism-autopsy.yml'
      - 'data/backtests/qb_frontier_canonical_v1/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Frozen M70 scope
        run: |
          echo 'M70 loads immutable qb_frontier_canonical_v1; it does NOT rebuild M59-M65.'
          echo 'M70 is forensic discovery only: no predictive model fit and no production promotion.'
          echo 'Frozen target: the 47 M69 100+ passing-yard catastrophes labeled YPA explosion/collapse.'
          echo 'Pregame comparison baseline: same QB prior 8 regular-season games, minimum 3 prior games; no team fallback.'
          echo 'Physical YPA decomposition: completion-rate contribution + completed-air contribution + YAC contribution + interaction + split remainder.'
          echo 'Physical driver is called dominant only at >=45% of total absolute component contribution; otherwise mixed.'
          echo 'Context overadjustment: actual within 0.75 YPA of prior baseline while model shifts >=1.25 YPA.'
          echo 'Context wrong-direction: actual and model each shift >=0.75 YPA from prior baseline in opposite directions.'
          echo 'Real performance shift threshold: 1.50 YPA from prior baseline.'
          echo 'Explosive concentration diagnostic: 20+ completions >=45% of passing yards and >=15pp above prior-8 share.'
          echo 'PBP pass-attempt denominator is normalized to NFL official-style attempts: sacks and two-point conversions excluded.'
          echo 'Postgame PBP is diagnostic only and cannot become a live feature through M70.'

      - name: Compile M70
        run: |
          python -m py_compile scripts/backtest/audit_qb_extreme_ypa_mechanisms.py
          python -m py_compile scripts/backtest/run_qb_extreme_ypa_mechanisms_official_attempts.py

      - name: Run M70 from canonical snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/backtest/run_qb_extreme_ypa_mechanisms_official_attempts.py \
            --canonical data/backtests/qb_frontier_canonical_v1/qb_frontier_canonical_v1.csv \
            --history-seasons 2023,2024,2025 \
            --out-dir data/backtests/qb_m70

      - name: Print M70 results
        run: |
          echo '--- M70 interpretation ---'
          cat data/backtests/qb_m70/m70_precommitted_interpretation.csv
          echo '--- M70 mechanism summary ---'
          cat data/backtests/qb_m70/m70_mechanism_summary.csv
          echo '--- M70 source manifest ---'
          cat data/backtests/qb_m70/m70_source_manifest.csv

      - name: Upload M70 artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-70-qb-extreme-ypa-mechanism-autopsy
          path: data/backtests/qb_m70/*.csv
          retention-days: 14
