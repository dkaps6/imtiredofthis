name: RB R26M 2026 Week 1 Prospective Qualification Synthesis V1

on:
  push:
    branches:
      - research-rb-r26m-2026-week1-prospective-qualification-synthesis-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PRODUCTION_BASE_SHA: f8417f55b04ce0e19baf260e9d532765034c47f1
  R26_RUN_ID: '34356222339'
  R26_ARTIFACT_ID: '10106271075'
  R26_ARTIFACT_NAME: rb-r26-vacancy-gated-r9-retrospective-v1
  R26_DIGEST: sha256:607fca6e11c301ecb2a3bf74e3dfea8ae415bb33cf3c150a6d89eaedada2809e
  R26E_RUN_ID: '34368268224'
  R26E_ARTIFACT_ID: '10110785184'
  R26E_ARTIFACT_NAME: rb-r26e-week1-component-qualification-v1
  R26E_DIGEST: sha256:2b64fe25a1024136f2bb2cdde42bc74de290b6b9df63b4bb6cd675f6095b8bb7
  R26J_RUN_ID: '34374987828'
  R26J_ARTIFACT_ID: '10113466373'
  R26J_ARTIFACT_NAME: rb-r26j-2020-week1-comparability-source-audit-v1
  R26J_DIGEST: sha256:7d886f228487e052ee1617cc5f42b974cd9da6a9d448f3a86b1de82cb4fc4f46
  R26K_RUN_ID: '34376961740'
  R26K_ARTIFACT_ID: '10114261724'
  R26K_ARTIFACT_NAME: rb-r26k-week1-allocation-mechanism-atlas-v1
  R26K_DIGEST: sha256:74a3d9ac58fca360f6d2d23e19b28e1254f38e49e3be23878ee1b37cebe22c88
  R26L_RUN_ID: '34389455694'
  R26L_ARTIFACT_ID: '10119058769'
  R26L_ARTIFACT_NAME: rb-r26l-2026-week1-regime-transportability-v1
  R26L_DIGEST: sha256:3351dfb5bbf6b571174a94ddf0a03179d70786edbb91d316e4fdf2c3cf005c46

jobs:
  synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install synthesis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4

      - name: Verify frozen R26M contract and production boundary
        run: |
          set -euo pipefail
          test -s docs/research/RB_R26M_2026_WEEK1_PROSPECTIVE_QUALIFICATION_SYNTHESIS_V1_FROZEN_PLAN.md
          test -s docs/research/RB_R26M_2026_WEEK1_PROSPECTIVE_QUALIFICATION_SYNTHESIS_V1_IMPLEMENTATION_LOCK.md
          test -s scripts/backtest/synthesize_rb_r26m_2026_week1_prospective_qualification_v1.py
          python -m py_compile scripts/backtest/synthesize_rb_r26m_2026_week1_prospective_qualification_v1.py
          sha256sum docs/research/RB_R26M_2026_WEEK1_PROSPECTIVE_QUALIFICATION_SYNTHESIS_V1_FROZEN_PLAN.md | tee r26m_plan.sha256
          sha256sum docs/research/RB_R26M_2026_WEEK1_PROSPECTIVE_QUALIFICATION_SYNTHESIS_V1_IMPLEMENTATION_LOCK.md | tee r26m_lock.sha256
          sha256sum scripts/backtest/synthesize_rb_r26m_2026_week1_prospective_qualification_v1.py | tee r26m_code.sha256
          git diff --quiet "$PRODUCTION_BASE_SHA" HEAD -- \
            scripts/modeling \
            scripts/run_rb_week1_no_odds.py \
            scripts/run_pricing_with_full_roster_universe_v3.py \
            scripts/run_pricing_with_full_roster_universe_v3_core.py \
            scripts/run_pricing_with_full_roster_universe_v4_production.py \
            scripts/simulation_v2.py \
            scripts/simulation_c2_qb_candidate.py \
            data/models \
            model \
            .github/workflows/full-slate.yml \
            .github/workflows/production-week1-v4-r22-certification.yml
          echo PASS > r26m_protected_clean.txt
          echo R26M_PROTECTED_PRODUCTION_BOUNDARY_PASS

      - name: Verify and download immutable R26M parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R26_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26_ARTIFACT_ID}" --jq '.digest')"
          R26E_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26E_ARTIFACT_ID}" --jq '.digest')"
          R26J_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26J_ARTIFACT_ID}" --jq '.digest')"
          R26K_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26K_ARTIFACT_ID}" --jq '.digest')"
          R26L_ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26L_ARTIFACT_ID}" --jq '.digest')"
          test "$R26_ACTUAL" = "$R26_DIGEST"
          test "$R26E_ACTUAL" = "$R26E_DIGEST"
          test "$R26J_ACTUAL" = "$R26J_DIGEST"
          test "$R26K_ACTUAL" = "$R26K_DIGEST"
          test "$R26L_ACTUAL" = "$R26L_DIGEST"

          rm -rf parent_r26 parent_r26e parent_r26j parent_r26k parent_r26l
          mkdir -p parent_r26 parent_r26e parent_r26j parent_r26k parent_r26l
          gh run download "$R26_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26_ARTIFACT_NAME" --dir parent_r26
          gh run download "$R26E_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26E_ARTIFACT_NAME" --dir parent_r26e
          gh run download "$R26J_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26J_ARTIFACT_NAME" --dir parent_r26j
          gh run download "$R26K_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26K_ARTIFACT_NAME" --dir parent_r26k
          gh run download "$R26L_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26L_ARTIFACT_NAME" --dir parent_r26l

          test -s parent_r26/data/backtests/r26_vacancy_gated_r9_final/r26_final_disposition.json
          test -s parent_r26e/data/backtests/r26e_week1_component_qualification_v1/r26e_week1_qualification_disposition.json
          test -s parent_r26j/data/backtests/r26j_2020_week1_comparability_source_audit_v1/r26j_source_disposition.json
          test -s parent_r26k/data/backtests/r26k_week1_allocation_mechanism_atlas_v1/r26k_disposition.json
          test -s parent_r26l/data/backtests/r26l_2026_week1_regime_transportability_v1/r26l_disposition.json
          echo "R26M_IMMUTABLE_PARENTS_PASS r26=$R26_ACTUAL r26e=$R26E_ACTUAL r26j=$R26J_ACTUAL r26k=$R26K_ACTUAL r26l=$R26L_ACTUAL"

      - name: Execute frozen R26M synthesis
        run: |
          set -euo pipefail
          rm -rf data/backtests/r26m_2026_week1_prospective_qualification_synthesis_v1
          python scripts/backtest/synthesize_rb_r26m_2026_week1_prospective_qualification_v1.py \
            --r26-root parent_r26 \
            --r26e-root parent_r26e \
            --r26j-root parent_r26j \
            --r26k-root parent_r26k \
            --r26l-root parent_r26l \
            --protected-clean-marker r26m_protected_clean.txt \
            --out-dir data/backtests/r26m_2026_week1_prospective_qualification_synthesis_v1

      - name: Assert R26M authority ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/backtests/r26m_2026_week1_prospective_qualification_synthesis_v1/r26m_disposition.json')
          d=json.loads(p.read_text())
          allowed={
              '2026_WEEK1_UNMODIFIED_R26_SHADOW_CANDIDATE_DESIGN_QUALIFIED',
              '2026_WEEK1_UNMODIFIED_R26_SHADOW_CANDIDATE_DESIGN_NOT_QUALIFIED',
          }
          assert d['disposition'] in allowed
          qualified=d['disposition']=='2026_WEEK1_UNMODIFIED_R26_SHADOW_CANDIDATE_DESIGN_QUALIFIED'
          assert d['r26n_design_authorized'] is qualified
          assert d['parent_artifacts_verified_by_workflow'] is True
          assert d['prospective_shadow_activation_authorized'] is False
          assert d['production_promotion_authorized'] is False
          assert d['exclude_2020_authorized'] is False
          assert d['new_historical_router_authorized'] is False
          assert d['r9_refit'] is False
          assert d['predictions_regenerated'] is False
          assert d['2026_outcomes_used'] == 0
          assert d['sportsbook_football_inputs_used'] == 0
          assert d['same_week_depth_used'] is False
          assert d['production_parameters_changed'] is False
          assert d['r22_changed'] is False
          assert d['receiving_yard_means_changed'] is False
          print('R26M_AUTHORITY_CONTRACT_PASS disposition=' + d['disposition'])
          PY

      - name: Show R26M result
        run: |
          cat data/backtests/r26m_2026_week1_prospective_qualification_synthesis_v1/r26m_disposition.json
          echo '=== parent evidence matrix ==='
          cat data/backtests/r26m_2026_week1_prospective_qualification_synthesis_v1/r26m_parent_evidence_matrix.csv

      - name: Upload R26M evidence
        uses: actions/upload-artifact@v4
        with:
          name: rb-r26m-2026-week1-prospective-qualification-synthesis-v1
          retention-days: 90
          path: |
            r26m_plan.sha256
            r26m_lock.sha256
            r26m_code.sha256
            r26m_protected_clean.txt
            data/backtests/r26m_2026_week1_prospective_qualification_synthesis_v1/*
