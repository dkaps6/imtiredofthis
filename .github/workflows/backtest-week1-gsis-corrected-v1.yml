name: Backtest Week 1 GSIS Corrected V1

on:
  workflow_dispatch:
  push:
    branches:
      - claude/diagnose-live-identity-gap
    paths:
      - '.github/workflows/backtest-week1-gsis-corrected-v1.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_REPLAY_RUN_ID: '34910010508'
  SOURCE_REPLAY_ARTIFACT_NAME: offline_replay_34910010508
  BACKTEST_SEASON: '2026'
  BACKTEST_WEEK: '1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Download the real priced Week 1 board
        run: |
          rm -rf /tmp/board_artifact
          mkdir -p /tmp/board_artifact
          gh run download "${SOURCE_REPLAY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_REPLAY_ARTIFACT_NAME}" \
            --dir /tmp/board_artifact
          test -s /tmp/board_artifact/outputs/props_priced_clean.csv
          mkdir -p outputs
          cp /tmp/board_artifact/outputs/props_priced_clean.csv outputs/props_priced_clean.csv

      - name: Archive board into the durable market track record
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/operations/archive_priced_board_v1.py \
            --priced-file outputs/props_priced_clean.csv \
            --season "${BACKTEST_SEASON}" \
            --week "${BACKTEST_WEEK}"

      - name: Grade with GSIS identity + zero-usage-preserving actuals
        run: |
          export PYTHONPATH="${PWD}"
          python scripts/operations/grade_market_track_record_gsis_v1.py \
            --season "${BACKTEST_SEASON}" \
            --weeks "${BACKTEST_WEEK}"
