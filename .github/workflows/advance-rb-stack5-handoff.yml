Build a materially better independent, football-only RB rushing-yard projection and benchmark it downstream against archived pregame/closing-like Vegas rushing lines. Sportsbook values may never enter football-model features, fitting, routing, thresholds, weights, or upstream gates. 2025 is now exposed retrospective development data; new winners must be frozen for prospective 2026 confirmation.

