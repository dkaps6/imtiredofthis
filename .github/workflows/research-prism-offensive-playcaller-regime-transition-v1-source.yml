name: Research PRISM Offensive Playcaller Regime Transition V1 Source

on:
  push:
    branches:
      - research-individual-opportunity-roadmap-2026-10-08
    paths:
      - 'config/prism_playcaller_regime_2026_v1.csv'
      - 'docs/research/PRISM_OFFENSIVE_PLAYCALLER_REGIME_TRANSITION_V1_SOURCE_PLAN.md'
      - 'scripts/research/audit_prism_offensive_playcaller_regime_transition_v1.py'
      - 'tests/test_prism_offensive_playcaller_regime_transition_v1.py'
      - '.github/workflows/research-prism-offensive-playcaller-regime-transition-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FREEZE_COMMIT: "533e628c99359fbfddbb9f4d787a96d8dbfbc67c"
  M68_BLOB_SHA: "6db89b71288c62b3d6a0972a4848dd0449b2524a"

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyyaml

      - name: Verify frozen-before-implementation boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FREEZE_COMMIT" HEAD
          git cat-file -e "$FREEZE_COMMIT:docs/research/PRISM_OFFENSIVE_PLAYCALLER_REGIME_TRANSITION_V1_SOURCE_PLAN.md"
          if git cat-file -e "$FREEZE_COMMIT:scripts/research/audit_prism_offensive_playcaller_regime_transition_v1.py" 2>/dev/null; then
            echo "ERROR: source implementation existed at freeze"
            exit 1
          fi

      - name: Verify frozen historical playcaller source blob
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD:scripts/backtest/build_qb_playcaller_opening_leverage.py)"
          echo "M68_BLOB=$ACTUAL"
          test "$ACTUAL" = "$M68_BLOB_SHA"

      - name: Verify immutable player identity parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run=39154145666
          aid=12146625382
          name='prism-player-observation-health-state-v1-source-39154145666'
          digest='sha256:d74f2d3c37a88aa639527aedf719e7e08001d464c722613b46291cda0f74cbeb'
          repo=os.environ['GITHUB_REPOSITORY']
          payload=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']
          ))
          arts={int(a['id']):a for a in payload.get('artifacts',[])}
          a=arts.get(aid)
          assert a is not None,(run,aid)
          assert not a.get('expired'),a
          assert a.get('name')==name,a
          assert a.get('digest')==digest,a
          print('PARENT_VERIFIED',run,aid,name,digest)
          PY

      - name: Download immutable player identity parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/prism-playcaller-regime
          mkdir -p /tmp/prism-playcaller-regime/{health,out}
          gh run download 39154145666 --repo "${{ github.repository }}"             --name prism-player-observation-health-state-v1-source-39154145666             --dir /tmp/prism-playcaller-regime/health
          test -s /tmp/prism-playcaller-regime/health/player_observation_health_state_rows.csv

      - name: Compile and run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/research/audit_prism_offensive_playcaller_regime_transition_v1.py
          pytest -q tests/test_prism_offensive_playcaller_regime_transition_v1.py

      - name: Execute frozen source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/research/audit_prism_offensive_playcaller_regime_transition_v1.py             --health-parent /tmp/prism-playcaller-regime/health/player_observation_health_state_rows.csv             --snapshot-2026 config/prism_playcaller_regime_2026_v1.csv             --out-dir /tmp/prism-playcaller-regime/out

      - name: Certify source-only contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          base='/tmp/prism-playcaller-regime/out'
          p=json.load(open(f'{base}/playcaller_regime_source_result.json'))
          tw=pd.read_csv(f'{base}/playcaller_regime_team_weeks.csv')
          pw=pd.read_csv(f'{base}/playcaller_regime_named_player_weeks.csv')
          snap=pd.read_csv(f'{base}/playcaller_regime_2026_snapshot_certified.csv')

          assert p['version']=='PRISM_OFFENSIVE_PLAYCALLER_REGIME_TRANSITION_V1_SOURCE_AUDIT',p
          assert p['freeze_commit']=='533e628c99359fbfddbb9f4d787a96d8dbfbc67c',p
          assert p['m68_historical_source_blob_sha']=='6db89b71288c62b3d6a0972a4848dd0449b2524a',p
          assert p['health_parent_run']==39154145666,p
          assert p['disposition'] in {
              'PRISM_OFFENSIVE_PLAYCALLER_REGIME_TRANSITION_V1_SOURCE_READY',
              'PRISM_OFFENSIVE_PLAYCALLER_REGIME_TRANSITION_V1_SOURCE_BLOCKED',
          },p
          assert len(tw)>0
          assert len(pw)>0
          assert len(snap)>=33
          assert p['target_week_snaps_used_to_define_caller_state']==0,p
          assert p['target_week_opportunity_performance_fields_used']==0,p
          assert p['predictive_player_outcomes_scored']==0,p
          assert p['coefficients_fit']==0,p
          assert p['thresholds_searched']==0,p
          assert p['outcomes_2026_used']==0,p
          assert p['sportsbook_inputs_used']==0,p
          assert p['oddsapi_calls']==0,p
          assert p['paid_oddsapi_calls']==0,p
          assert p['production_changed'] is False,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Strict repository audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/utils/audit_repo.py --strict

      - name: Record Issue 535 source result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          p=json.load(open('/tmp/prism-playcaller-regime/out/playcaller_regime_source_result.json'))
          print("### PRISM offensive playcaller regime transition V1 — source audit")
          print()
          print(f"- Run: {os.environ['RUN_ID']}")
          print(f"- Exact head: {os.environ['HEAD_SHA']}")
          print(f"- Freeze: {p['freeze_commit']}")
          print(f"- Disposition: {p['disposition']}")
          for s in p['season_summaries']:
              print()
              print(f"**{s['season']} named-player source support**")
              print(f"- team-weeks={s['team_weeks']}; caller coverage={s['caller_identity_coverage']:.2%}")
              print(f"- offseason W1 caller changes={s['offseason_week1_change_events']}; in-season changes={s['inseason_change_events']}; total events={s['total_caller_change_events']}")
              print(f"- transition player-weeks={s['transition_player_weeks']}; named players={s['transition_named_players']}")
              print(f"- >=3 strictly-prior same-team positive rows={s['prior_positive_support_ge3_player_weeks']} ({s['prior_positive_support_share']:.2%})")
              for fam in s['family_summary']:
                  print(f"  - {fam['family']}: transition rows={fam['transition_player_weeks']} players={fam['distinct_named_players']} prior-support={fam['prior_positive_support_share']:.2%}")
              failed=[k for k,v in s['gates'].items() if not v]
              print(f"- failed historical source gates: {failed or ['NONE']}")
          q=p['prospective_2026_parity']
          print()
          print(f"**2026 prospective parity**")
          print(f"- Week-1 teams={q['week1_teams']}; override rows={q['override_rows']}; max effective week={q['max_effective_week']}")
          failed=[k for k,v in q['gates'].items() if not v]
          print(f"- failed parity gates: {failed or ['NONE']}")
          print()
          print("Source/lineage only. The object is a named-player pregame offensive playcaller regime transition. No target-week skill-player snaps, carries, targets, receptions, yards, TDs, 2026 outcomes, sportsbook/OddsAPI, fitted coefficients/thresholds, or production mutation.")
          PY
          gh issue comment 535 --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload immutable source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-offensive-playcaller-regime-transition-v1-source-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/prism-playcaller-regime/out/**
