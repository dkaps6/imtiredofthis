name: Advance RB Stack Audit Handoff

on:
  push:
    branches:
      - research-rb-nd2b-allocation-env-atlas
    paths:
      - '.github/workflows/advance-rb-stack-audit-handoff.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Append latest RB continuity checkpoint
        run: |
          if grep -q 'LATEST CONTINUITY UPDATE — RB ENV1 / ND2B / PRODUCTION-STACK AUDIT' docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md; then
            echo 'handoff already current'
          else
            echo '' | base64 -d >> docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          fi
      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md; then
            echo 'No handoff changes'
            exit 0
          fi
          git add docs/migrations/CURRENT_NFL_RESEARCH_HANDOFF.md
          git commit -m 'RB: advance continuity to production-equivalent stack audit'
          git push origin HEAD:research-rb-nd2b-allocation-env-atlas
