name: WR Read Priority Controls Audit V3
on:
  push:
    branches: [research-wr-read-priority-source-audit-v1]
    paths:
      - 'scripts/research/audit_wr_read_priority_controls_v3.py'
      - '.github/workflows/research-wr-read-priority-controls-v3.yml'
  workflow_dispatch:

jobs:
  source-controls-only:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORITY_RUN_ID: '34238301577'
      AUTHORITY_ARTIFACT_ID: '10061328722'
      AUTHORITY_ARTIFACT_NAME: wr-r15-wr1-anchor-participation-v1
      AUTHORITY_DIGEST: sha256:8df31b5e136621d959272daf0422dfc665593cd0da2eb0892b4aa69c1417f3ce
      AUTHORITY_CSV: /tmp/wr_r15_artifact/backtests/wr_r15_wr1_anchor_v1/wr_r15_confirmation_predictions.csv
      OUT_DIR: data/backtests/wr_read_priority_controls_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow nflreadpy
      - name: Verify exact WR-R15 authority artifact lineage
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORITY_RUN_ID}/artifacts" > /tmp/wr_r15_artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/wr_r15_artifacts.json').read_text())
          m=[a for a in p.get('artifacts',[]) if int(a.get('id',-1))==int(os.environ['AUTHORITY_ARTIFACT_ID'])]
          assert len(m)==1
          a=m[0]
          assert a.get('name')==os.environ['AUTHORITY_ARTIFACT_NAME']
          assert a.get('digest')==os.environ['AUTHORITY_DIGEST']
          assert not a.get('expired')
          print('WR-R15 authority lineage: PASS')
          PY
      - name: Download exact WR-R15 authority artifact
        run: |
          rm -rf /tmp/wr_r15_artifact && mkdir -p /tmp/wr_r15_artifact
          gh run download "${AUTHORITY_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${AUTHORITY_ARTIFACT_NAME}" --dir /tmp/wr_r15_artifact
          test -s "${AUTHORITY_CSV}"
      - name: Run source-only control feasibility audit
        run: |
          rm -rf "${OUT_DIR}"
          python -m scripts.research.audit_wr_read_priority_controls_v3 --authority "${AUTHORITY_CSV}" --out-dir "${OUT_DIR}"
      - name: Prove no WR outcome or holdout scoring occurred
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT_DIR'])
          r=json.loads((out/'wr_read_priority_v3_control_result.json').read_text())
          p=pd.read_csv(out/'wr_read_priority_v3_control_panel_2023.csv')
          assert r['wr_outcomes_loaded'] is False
          assert r['holdout_2024_projection_or_outcome_fields_parsed'] is False
          assert r['sportsbook_inputs']==0
          forbidden={'actual_rec_yards','mc_rec_yards','yard_residual','residual'}
          assert not forbidden.intersection(p.columns)
          assert r['authority_meta']['authority_materialized_seasons']==[2023]
          assert r['authority_meta']['outcome_fields_parsed'] is False
          print('WR read-priority V3 source-only guards: PASS')
          PY
      - name: Upload source-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: wr-read-priority-controls-v3
          path: data/backtests/wr_read_priority_controls_v3/
          if-no-files-found: error
          retention-days: 30
