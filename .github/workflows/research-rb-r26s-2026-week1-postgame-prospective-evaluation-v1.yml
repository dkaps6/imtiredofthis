name: RB R26S 2026 Week 1 Postgame Prospective Evaluation V1

on:
  push:
    branches:
      - research-rb-r26s-2026-week1-postgame-prospective-evaluation-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  R26S_PLAN_COMMIT: 63722c61ca1b408b8ae77eba383e5fa8daecf9f2
  R26S_CODE_COMMIT: e42099dbf11cdd510eb64e43a0910444c75ec7f8
  R26S_LOCK_COMMIT: 3a706fa52f91f6584f6fd6594563239dd6ea3b53
  R26S_REPAIR_NOTE_COMMIT: b78d4e1671e30eee392ed07a219d409aa00f8b41
  R26S_COMPAT_COMMIT: adb4b07fa3d7f0585c477d217a58095ac0b9ae10
  PROTECTED_PRODUCTION_HEAD: f8417f55b04ce0e19baf260e9d532765034c47f1
  R26Q_RUN_ID: "34400524030"
  R26Q_ARTIFACT_ID: "10123251043"
  R26Q_ARTIFACT_NAME: rb-r26q-2026-week1-receptions-prospective-seal-v1
  R26Q_DIGEST: sha256:dd3ec0e8e3831ab7f2255c2e5abf343cda8a7943d33a1d4863e52372d6f858a1
  R26Q_HEAD: 68661da94f03cab2f96182d47636cf55e088b5de
  R26R_RUN_ID: "34401814588"
  R26R_ARTIFACT_ID: "10124274040"
  R26R_ARTIFACT_NAME: rb-r26r-2026-week1-prospective-observation-snapshot-v1
  R26R_DIGEST: sha256:b4d3e573909803e892d57858c9b0c4bdac089bcf078c1d6f6e53366e4622303e
  R26R_HEAD: 469aa40c90c738e12a82ee32ccca70c9cdbbc29f

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nflreadpy

      - name: Verify frozen R26S contracts and protected outcome-normalization boundary
        run: |
          set -euo pipefail
          PLAN=docs/research/RB_R26S_2026_WEEK1_POSTGAME_PROSPECTIVE_EVALUATION_V1_FROZEN_PLAN.md
          CODE=scripts/backtest/evaluate_rb_r26s_2026_week1_postgame_prospective_v1.py
          LOCK=docs/research/RB_R26S_2026_WEEK1_POSTGAME_PROSPECTIVE_EVALUATION_V1_IMPLEMENTATION_LOCK.md
          REPAIR=docs/research/RB_R26S_RUN1_R26Q_GATECOUNT_CONTRACT_MECHANICAL_REPAIR_V1.md
          COMPAT=scripts/backtest/stage_r26s_r26q_gatecount_compat_v1.py
          test -s "$PLAN" && test -s "$CODE" && test -s "$LOCK" && test -s "$REPAIR" && test -s "$COMPAT"
          python -m py_compile "$CODE" "$COMPAT"
          git diff --quiet "$R26S_PLAN_COMMIT" HEAD -- "$PLAN"
          git diff --quiet "$R26S_CODE_COMMIT" HEAD -- "$CODE"
          git diff --quiet "$R26S_LOCK_COMMIT" HEAD -- "$LOCK"
          git diff --quiet "$R26S_REPAIR_NOTE_COMMIT" HEAD -- "$REPAIR"
          git diff --quiet "$R26S_COMPAT_COMMIT" HEAD -- "$COMPAT"
          git diff --quiet "$PROTECTED_PRODUCTION_HEAD" HEAD -- scripts/player_form_v2.py
          sha256sum "$PLAN" | tee r26s_plan.sha256
          sha256sum "$CODE" | tee r26s_code.sha256
          sha256sum "$LOCK" | tee r26s_lock.sha256
          sha256sum "$REPAIR" | tee r26s_repair_note.sha256
          sha256sum "$COMPAT" | tee r26s_compat.sha256
          echo PASS > r26s_protected_outcome_normalizer_clean.txt
          echo R26S_FROZEN_CONTRACT_AND_PROTECTED_OUTCOME_BOUNDARY_PASS

      - name: Verify and download immutable R26Q and R26R parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Q_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26Q_ARTIFACT_ID}" --jq '.digest')"
          Q_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26Q_ARTIFACT_ID}" --jq '.workflow_run.head_sha')"
          R_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26R_ARTIFACT_ID}" --jq '.digest')"
          R_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R26R_ARTIFACT_ID}" --jq '.workflow_run.head_sha')"
          test "$Q_DIGEST" = "$R26Q_DIGEST"
          test "$Q_HEAD" = "$R26Q_HEAD"
          test "$R_DIGEST" = "$R26R_DIGEST"
          test "$R_HEAD" = "$R26R_HEAD"
          rm -rf parent_r26q parent_r26q_compat parent_r26r
          mkdir -p parent_r26q parent_r26r
          gh run download "$R26Q_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26Q_ARTIFACT_NAME" --dir parent_r26q
          gh run download "$R26R_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$R26R_ARTIFACT_NAME" --dir parent_r26r
          test -s parent_r26q/data/backtests/r26q_2026_week1_receptions_prospective_seal_v1/r26q_disposition.json
          test -s parent_r26r/data/backtests/r26r_2026_week1_prospective_observation_snapshot_v1/r26r_disposition.json
          printf '%s\n' "$Q_HEAD" > r26s_r26q_parent_head.txt
          printf '%s\n' "$R_HEAD" > r26s_r26r_parent_head.txt
          printf '%s\n' "$Q_DIGEST" > r26s_r26q_parent_digest.txt
          printf '%s\n' "$R_DIGEST" > r26s_r26r_parent_digest.txt
          echo PASS > r26s_parents_verified.txt
          echo "R26S_IMMUTABLE_PARENTS_PASS q=$Q_DIGEST r=$R_DIGEST"

      - name: Stage frozen R26Q gate-count compatibility copy
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          python scripts/backtest/stage_r26s_r26q_gatecount_compat_v1.py \
            --source-root parent_r26q \
            --staged-root parent_r26q_compat \
            --audit-json r26s_r26q_gatecount_compat_audit.json
          test -s r26s_r26q_gatecount_compat_audit.json
          echo R26S_R26Q_GATECOUNT_COMPAT_STAGING_PASS

      - name: Execute locked R26S prospective evaluation
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}"
          rm -rf data/backtests/r26s_2026_week1_postgame_prospective_evaluation_v1
          python scripts/backtest/evaluate_rb_r26s_2026_week1_postgame_prospective_v1.py \
            --r26q-root parent_r26q_compat \
            --r26r-root parent_r26r \
            --out-dir data/backtests/r26s_2026_week1_postgame_prospective_evaluation_v1

      - name: Assert R26S authority ceiling
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/backtests/r26s_2026_week1_postgame_prospective_evaluation_v1/r26s_disposition.json')
          if not p.is_file():
              raise SystemExit('R26S disposition missing: mechanical failure')
          d=json.loads(p.read_text())
          allowed={
              'R26S_2026_WEEK1_POSTGAME_PROSPECTIVE_EVALUATION_PASS_READY_FOR_PRODUCTION_PROMOTION_REVIEW',
              'R26S_2026_WEEK1_POSTGAME_PROSPECTIVE_EVALUATION_FAIL_NO_PROMOTION',
              'R26S_2026_WEEK1_POSTGAME_PROSPECTIVE_EVALUATION_INCOMPLETE_NO_DECISION',
          }
          assert d['disposition'] in allowed
          assert d['sportsbook_football_inputs_used'] == 0
          assert d['football_values_regenerated'] is False
          assert d['r9_refit'] is False
          assert d['tuning_performed'] is False
          assert d['same_week_depth_used_to_change_candidate'] is False
          assert d['production_parameters_changed'] is False
          assert d['production_promotion_performed'] is False
          assert d['live_shadow_production_activation_performed'] is False
          if d['disposition'].endswith('PASS_READY_FOR_PRODUCTION_PROMOTION_REVIEW'):
              assert d['production_promotion_review_authorized'] is True
          else:
              assert d['production_promotion_review_authorized'] is False
          print('R26S_AUTHORITY_CONTRACT_PASS disposition=' + d['disposition'])
          PY

      - name: Show R26S evidence
        if: always()
        run: |
          ROOT=data/backtests/r26s_2026_week1_postgame_prospective_evaluation_v1
          if [ -s "$ROOT/r26s_disposition.json" ]; then
            cat "$ROOT/r26s_disposition.json"
            echo '=== R26S gates ==='
            cat "$ROOT/r26s_gate_matrix.csv"
            echo '=== R26S source status ==='
            cat "$ROOT/r26s_outcome_source_status.json"
          fi

      - name: Upload R26S prospective evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-r26s-2026-week1-postgame-prospective-evaluation-v1
          retention-days: 90
          path: |
            r26s_plan.sha256
            r26s_code.sha256
            r26s_lock.sha256
            r26s_repair_note.sha256
            r26s_compat.sha256
            r26s_r26q_gatecount_compat_audit.json
            r26s_protected_outcome_normalizer_clean.txt
            r26s_parents_verified.txt
            r26s_r26q_parent_head.txt
            r26s_r26r_parent_head.txt
            r26s_r26q_parent_digest.txt
            r26s_r26r_parent_digest.txt
            data/backtests/r26s_2026_week1_postgame_prospective_evaluation_v1/*
