name: M96B RB Modular Joint Synthesis

on:
  workflow_dispatch:
  push:
    branches:
      - research-rb-m96b-modular-joint-synthesis
    paths:
      - 'scripts/backtest/evaluate_rb_m96b_modular_joint_synthesis.py'
      - 'docs/migrations/M96B_PLAN.md'
      - '.github/workflows/backtest-rb-m96b-modular-joint-synthesis.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  M94C_RUN_ID: '33353485070'
  M95D_RUN_ID: '33359898917'
  M95F_RUN_ID: '33389924330'
  M95I_RUN_ID: '33402566592'

jobs:
  rb-modular-joint-synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==1.5.3 numpy==1.26.4 scikit-learn==1.5.2

      - name: Download frozen module artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtests/rb_m94c_frozen data/backtests/rb_m95d_frozen data/backtests/rb_m95f_frozen data/backtests/rb_m95i_frozen
          gh run download "$M94C_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-94c-rb-game-environment --dir data/backtests/rb_m94c_frozen
          gh run download "$M95D_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95d-rb-rushing-environment-scheme --dir data/backtests/rb_m95d_frozen
          gh run download "$M95F_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95f-rb-workload-regime-calibration --dir data/backtests/rb_m95f_frozen
          gh run download "$M95I_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-95i-rb-deep-concentration-tail --dir data/backtests/rb_m95i_frozen
          test -s data/backtests/rb_m94c_frozen/m94c_2025_rb_trace.csv
          test -s data/backtests/rb_m95d_frozen/m95d_rb_environment_trace.csv
          test -s data/backtests/rb_m95d_frozen/m95d_prediction_trace.csv
          test -s data/backtests/rb_m95f_frozen/m95f_2024_holdout_trace.csv
          test -s data/backtests/rb_m95f_frozen/m95f_2025_rb_trace.csv
          test -s data/backtests/rb_m95i_frozen/m95i_2025_trace.csv

      - name: Run frozen M96B modular synthesis
        run: |
          python -m py_compile scripts/backtest/evaluate_rb_m96b_modular_joint_synthesis.py
          python scripts/backtest/evaluate_rb_m96b_modular_joint_synthesis.py \
            --m94c-root data/backtests/rb_m94c_frozen \
            --m95d-root data/backtests/rb_m95d_frozen \
            --m95f-root data/backtests/rb_m95f_frozen \
            --m95i-root data/backtests/rb_m95i_frozen \
            --out-dir data/backtests/rb_m96b

      - name: Show M96B results
        if: always()
        run: |
          echo '=== disposition ==='
          cat data/backtests/rb_m96b/m96b_disposition.csv 2>/dev/null || true
          echo '=== module ledger ==='
          cat data/backtests/rb_m96b/m96b_module_ledger.csv 2>/dev/null || true
          echo '=== point gate ==='
          cat data/backtests/rb_m96b/m96b_e_point_gate.csv 2>/dev/null || true
          echo '=== tail ablation ==='
          cat data/backtests/rb_m96b/m96b_tail_ablation.csv 2>/dev/null || true
          echo '=== vacancy diagnostic ==='
          cat data/backtests/rb_m96b/m96b_vacancy_diagnostic.csv 2>/dev/null || true

      - name: Upload M96B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-96b-rb-modular-joint-synthesis
          path: data/backtests/rb_m96b/**
          if-no-files-found: warn
          retention-days: 30
